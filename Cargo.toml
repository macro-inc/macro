lol_html = "2.4.0"
loro = "1.16.2"
lru = "0.16"
md-5 = "0.10.6"
miniz_oxide = { version = "0.8", features = ["with-alloc"] }
mockall = "0.13"
nutype = { version = "0.8.0", features = ["serde", "derive_unchecked"] }
nom = "8"
openssl-sys = "0.9"
opus-pure = "0.2.1"
opentelemetry = { version = "0.31.0", default-features = false }
opentelemetry-appender-tracing = { version = "0.31.1", default-features = false }
opentelemetry-http = { version = "0.31.0", default-features = false }
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = [
  "grpc-tonic",
  "internal-logs",
  "logs",
  "metrics",
  "trace",
] }
opentelemetry_sdk = { version = "0.31.0", default-features = false }
ordered-float = "5"
paste = "1"
pdfium-render = { version = "0.8.37", default-features = false, features = [
  "pdfium_7543",
  "thread_safe",
] }
pgvector = { version = "0.4", features = ["postgres", "sqlx"] }
png = "0.18"
postcard = { version = "1", features = ["use-std"] }
pollster = "0.4"
proptest = { version = "1.11", default-features = false, features = ["std"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
quote = "1"
rand = "0.9.0"
ratatui = "0.29"
# uses vendored to fix lambda builds failing.
rdkafka = { version = "0.37", default-features = false, features = [
  "cmake-build",
  "libz-static",
  "ssl-vendored",
  "tokio",
] }
readonly = "0.2"
recursion = "0.5.4"
redis = "1.0.3"
regex = "1.11.1"
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "hickory-dns",
  "json",
  "rustls",
] }
rmcp = "1.6.0"
skrifa = { version = "0.48", default-features = false, features = ["std"] }
sse-stream = "0.2"
rootcause = { version = "0.12", features = ["compat-anyhow1"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
# Mirrors the ACP SDK's own declaration: `coding_agent_worker` ports its
# process-group kill and makes the same call.
rustix = { version = "1", default-features = false, features = ["process", "std"] }
rootcause-tracing = "0.12.1"
schemars = { version = "1.0.4", features = ["chrono04", "uuid1"] }
semver = { version = "1", features = ["serde"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde = { version = "1.0.214", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
serde_path_to_error = "0.1.20"
serde_json = { version = "1.0.132" }
serde_repr = "0.1"
serde_with = { version = "3.12.0", features = ["base64"] }
serde_yaml = "0.9"
shell-words = "1.1.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
sha2 = "0.10.8"
sqlx = { version = "0.8.6", features = [
  "chrono",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
] }
sqlx-core = { version = "0.8.6" }
sse-core = { version = "0.2.3", default-features = false, features = ["std"] }
strsim = "0.11"
strum = { version = "0.27.1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = [
  "isomp4",
  "mkv",
  "ogg",
  "wav",
] }
tar = "0.4.46"
tempfile = "3"
thiserror = "2.0.0"
time = "0.3.37"
tiny-skia = { version = "0.11.4", default-features = false, features = ["simd", "std"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tokio-retry = { version = "0.3.2", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-stream = { version = "0.1.17" }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
# Signal's compression fork is based on tungstenite 0.27. Keep its Tokio
# adapter separate from the upstream sockets used elsewhere in the workspace.
tokio-tungstenite-signal = { package = "tokio-tungstenite", version = "0.27", default-features = false, features = ["handshake"] }
tungstenite-signal = { package = "tungstenite", version = "0.27", default-features = false, features = ["handshake", "deflate"] }
tokio-util = "0.7.13"
tower = { version = "0.5.1", features = ["util"] }
tower-service = "0.3"
tower-http = { version = "0.6.1", features = [
  "compression-gzip",
  "cors",
  "trace",
] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-tree = "0.4.0"
tui-input = { version = "0.14.0", default-features = false }
# Pin the official upstream revision used by the browser cache. Cache writes use
# deferred transactions so browser WASM does not initialize Turso's temp database.
turso_core = { git = "https://github.com/tursodatabase/turso", rev = "79163249538197d01dec5ea7f65519454ed792e2", default-features = false }
tungstenite = { version = "0.28", features = ["url"] }
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = [
  "axum_extras",
  "chrono",
  "repr",
  "uuid",
] }
# debug-embed: debug builds embed Swagger UI instead of compiling in the
# absolute build-directory path they would read it from at runtime, which made
# the crate and every service above it differ per checkout.
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored", "debug-embed"] }
uuid = { version = "1.15.1", features = ["fast-rng", "serde", "v4", "v5", "v7"] }
webpki-roots = "1.0.10"
wiremock = "0.6.5"
zeroize = "1.8.2"
zune-core = "0.5"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
# worker-build (see services/sync-service/wrangler.toml) refuses to build against
