[patch.crates-io]
# Only replaces tungstenite 0.27 (GraphQL subscriptions); 0.28/0.29 stay upstream.
tungstenite = { git = "https://github.com/signalapp/tungstenite-rs", rev = "a1837ccfe96b6895a57352d7f0112e4557516c27" }
# Writes a checkout-independent embed folder; see vendor/utoipa-swagger-ui/README-MACRO.md.
utoipa-swagger-ui = { path = "vendor/utoipa-swagger-ui" }

# Full debuginfo made the agent_harness_service debug binary 2.9 GB and most
# of each edit's rebuild was writing and linking it. Line tables keep file and
# line in backtraces and panics for workspace code; dependencies get none.
# Tests inherit this. For a debugger, pass
# `--config 'profile.dev.debug="full"' --config 'profile.dev.package."*".debug="full"'`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# cache-turso's storage tests load thousands of rows into the embedded SQL engine
# to assert VM step budgets. Unoptimized, the engine made them the slowest tests
# in the Rust suite (34 s for the crate); at opt-level 2 the crate's tests take
# 2.6 s. The assertions count VM steps, which optimization does not change.
[profile.dev.package.turso_core]
opt-level = 2

[profile.dev.package.turso_parser]
opt-level = 2

[profile.dev.package.turso_ext]
opt-level = 2

# Retain Rust DWARF for local cache profiling while keeping release-level LLVM
# optimization. wasm-pack's custom profile metadata prevents the final
# wasm-opt pass from discarding or rewriting these locations.
[profile.cache-wasm-profiling]
inherits = "release"
debug = 2
strip = "none"

# The Cloudflare sync worker is size-sensitive. Package manifests cannot own
# profiles once they are workspace members, so keep its former release profile
# here without changing release optimization for the backend services.

[profile.sync-service-release]
inherits = "release"
lto = true
opt-level = "s"

# The fig engine's browser build (apps/web `build-fig-engine-wasm`): one
# codegen unit and full LTO, so its rasterizing loops inline across crates.
[profile.fig-engine-wasm]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.psd-engine-wasm]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.ai-engine-wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
