[workspace.dependencies]
aes = "0.8.4"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
anyhow = "1.0.100"
apollo-compiler = "1"
apollo-parser = "0.8"
# Locally forked (see third_party/README.md). Defaults off so the fold's
# dependency chain stays wasm-reachable; whoever spawns an agent as a
# subprocess asks for `features = ["subprocess"]`.
# Pinned past the v2.0.0 tag to pick up wasm32 support (PR #294, merged to
# main but not yet in a tagged release):
# https://github.com/agentclientprotocol/rust-sdk/pull/294
# Swap back to a plain version once upstream cuts a release containing it.
agent-client-protocol = { git = "https://github.com/agentclientprotocol/rust-sdk", rev = "8769d16d10e0c9fa7e662ee18424a4313b06ea88", features = [
  "unstable_elicitation",
] }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# Templates use built-in defaults; omit the unused config parser and basic-toml.
askama = { version = "0.14", default-features = false, features = ["derive", "std", "urlencode"] }
async-graphql = "7.2.1"
async-lock = "3"
async-openai = { version = "0.36.1", features = [
  "byot",
  "chat-completion",
  "completions",
  "embedding",
] }
async-stream = "0.3.6"
async-trait = "0.1.86"
automod = "1"
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-msk-iam-sasl-signer = "1.0.1"
# SDK defaults also enable the deprecated `rustls` feature, which pulls in
# rustls 0.21 / hyper 0.14. Keep the modern HTTPS client and the other defaults;
# macro_aws_config uses BehaviorVersion::latest() with this transport.
aws-sdk-dynamodb = { version = "1.111.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.104.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.132.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.104.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1.118.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.99.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.98.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.4.7"
aws-types = "1"
aws_lambda_events = { version = "0.16.0", default-features = false }
axum = { version = "0.8", features = ["tower-log"] }
axum-extra = { version = "0.10" }
backoff = { version = "0.4.0", features = ["tokio"] }
base64 = "0.22.1"
bebop = "3.1.3"
brotli-decompressor = { version = "5.0.3", default-features = false, features = ["std"] }
cached = { version = "0.54.0", features = ["async_tokio_rt_multi_thread"] }
chrono = { version = "0.4.39", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.5.20", features = ["derive"] }
cloudfront_sign = "0.3.0"
cbc = { version = "0.1.2", features = ["std"] }
constant_time_eq = "0.3.1"
console_error_panic_hook = "0.1.7"
crossterm = "0.28"
cookie = "0.18.1"
cron = "0.16.0"
csv = "1"
dashmap = "6.1.0"
dateparser = "0.2.1"
determinator = "0.12.0"
dotenvy = "0.15.7"
ego-tree = "0.6.2"
either = "1"
eventsource-stream = "0.2.3"
flate2 = "1"
fractional_index = { version = "2.0.2", default-features = false }
futures = "0.3.31"
getrandom = "0.3"
gif = { version = "0.14", default-features = false, features = ["std"] }
glob = "0.3.3"
# Pinned engine for the generated dependency artifacts (used by the xtask
# graph/deps commands). This version lives in Cargo.lock, so dev machines and
# CI always run the identical generator; guppy is pinned to the version the
# hakari release is built against.
guppy = "0.17.24"
h2 = "0.4"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
encoding_rs = "0.8"
http = "1"
http-body = "1.0.1"
http-body-util = "0.1.2"
httpdate = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
# image's default formats minus "avif": its AVIF encoder pulls in rav1e, whose
# build script records whether it runs in CI, so rav1e and everything above it
# (attachment, image_optimizer, ...) compiled differently on developer machines
# and in CI. Nothing here decodes AVIF (that needs "avif-native"), so AVIF
# inputs already failed before reaching the encoder.
image = { version = "0.25", default-features = false, features = [
  "rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm",
  "qoi", "tga", "tiff", "webp",
] }
image-webp = "0.2"
indexmap = "2"
infer = "0.19.0"
indoc = "2"
inquire = "0.7"
itertools = "0.14"
jsonschema = { version = "0.58.6", default-features = false }
jsonwebtoken = { git = "https://github.com/whutchinson98/jsonwebtoken", features = [
  "rust_crypto",
] }
lambda_runtime = "0.13.0"
lazy-regex = "3.6.1"
lazy_static = "1.5.0"
# Signal's curve25519 keys and XEdDSA; see crates/whatsmeow_signal/AGENTS.md.
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.2" }
livekit-api = { version = "0.4.16", default-features = false, features = [
  "access-token",
  "rustls-tls-webpki-roots",
  "services-tokio",
  "webhooks",
] }
livekit-protocol = "0.7.2"
log = "0.4.26"
