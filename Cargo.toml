glob = "0.3.3"
# Pinned engine for the generated dependency artifacts (used by the xtask
# graph/deps commands). This version lives in Cargo.lock, so dev machines and
# CI always run the identical generator; guppy is pinned to the version the
# hakari release is built against.
guppy = "0.17.24"
h2 = "0.4"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
encoding_rs = "0.8"
http = "1"
http-body = "1.0.1"
http-body-util = "0.1.2"
httpdate = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
# image's default formats minus "avif": its AVIF encoder pulls in rav1e, whose
# build script records whether it runs in CI, so rav1e and everything above it
# (attachment, image_optimizer, ...) compiled differently on developer machines
# and in CI. Nothing here decodes AVIF (that needs "avif-native"), so AVIF
# inputs already failed before reaching the encoder.
image = { version = "0.25", default-features = false, features = [
  "rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm",
  "qoi", "tga", "tiff", "webp",
] }
image-webp = "0.2"
indexmap = "2"
infer = "0.19.0"
indoc = "2"
inquire = "0.7"
itertools = "0.14"
jsonschema = { version = "0.58.6", default-features = false }
jsonwebtoken = { git = "https://github.com/whutchinson98/jsonwebtoken", features = [
  "rust_crypto",
] }
lambda_runtime = "0.13.0"
lazy-regex = "3.6.1"
lazy_static = "1.5.0"
# Signal's curve25519 keys and XEdDSA; see crates/whatsapp/whatsmeow_signal/AGENTS.md.
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.2" }
livekit-api = { version = "0.4.16", default-features = false, features = [
  "access-token",
  "rustls-tls-webpki-roots",
  "services-tokio",
  "webhooks",
] }
livekit-protocol = "0.7.2"
log = "0.4.26"
logos = "0.16"
lol_html = "2.4.0"
loro = "1.16.2"
lru = "0.16"
md-5 = "0.10.6"
