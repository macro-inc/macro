tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tokio-retry = { version = "0.3.2", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-stream = { version = "0.1.17" }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
# Signal's compression fork is based on tungstenite 0.27. Keep its Tokio
# adapter separate from the upstream sockets used elsewhere in the workspace.
tokio-tungstenite-signal = { package = "tokio-tungstenite", version = "0.27", default-features = false, features = ["handshake"] }
tungstenite-signal = { package = "tungstenite", version = "0.27", default-features = false, features = ["handshake", "deflate"] }
tokio-util = "0.7.13"
tower = { version = "0.5.1", features = ["util"] }
tower-service = "0.3"
tower-http = { version = "0.6.1", features = [
  "compression-gzip",
  "cors",
  "trace",
] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-tree = "0.4.0"
tui-input = { version = "0.14.0", default-features = false }
# Pin the official upstream revision used by the browser cache. Cache writes use
# deferred transactions so browser WASM does not initialize Turso's temp database.
turso_core = { git = "https://github.com/tursodatabase/turso", rev = "79163249538197d01dec5ea7f65519454ed792e2", default-features = false }
tungstenite = { version = "0.28", features = ["url"] }
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = [
  "axum_extras",
  "chrono",
  "repr",
  "uuid",
] }
# debug-embed: debug builds embed Swagger UI instead of compiling in the
# absolute build-directory path they would read it from at runtime, which made
# the crate and every service above it differ per checkout.
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored", "debug-embed"] }
uuid = { version = "1.15.1", features = ["fast-rng", "serde", "v4", "v5", "v7"] }
webpki-roots = "1.0.10"
wiremock = "0.6.5"
zeroize = "1.8.2"
zune-core = "0.5"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
# worker-build (see services/sync-service/wrangler.toml) refuses to build against
# anything older than 0.2.123, so keep this floor above that.
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
web-time = "1.1.0"
webbrowser = { version = "=1.2.2", features = ["hardened"] }
windows-sys = "0.61"
worker = "0.8.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# this is pinned to match axum 0.7.9 dependency requirements
async-stripe = { version = "0.41", default-features = false, features = [
  "billing",
  "checkout",
  "runtime-tokio-hyper",
] }
axum-macros = "0.5"
bytes = "1.11.1"
doppleganger = "0.5"
doppler-config = "0.1.2"
js-sys = "0.3"
scraper = "0.18"
serde_urlencoded = "0.7.1"
strum_macros = "0.27.1"
unicode-segmentation = "1.9.0"
url = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = [
  "aes-crypto",
  "bzip2",
  "deflate",
  "deflate64",
  "lzma",
  "time",
  "xz",
  "zstd",
] }
ammonia = "4.1.8"
html-escape = "0.2"
subtle = "2.6.1"

