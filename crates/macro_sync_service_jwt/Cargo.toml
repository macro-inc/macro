[package]
edition = "2024"
name = "macro_sync_service_jwt"
publish = false
version = "0.1.0"

# Excluded from workspace-hack in .config/hakari.toml since it needs to compile
# to wasm too for sync service. The sync-service Docker image builds this crate
# outside the checkout, against a stub workspace root synthesized from the real
# one (see docker/sync-service.Dockerfile) — so `workspace = true` still resolves
# there without duplicating any version pins here.
[dependencies]
derive_more = { workspace = true, features = ["display", "from"] }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
