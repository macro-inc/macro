[package]
edition = "2024"
name = "github_pull_requests"
publish = false
version = "0.1.0"

[features]
default = ["outbound", "ports", "service"]
outbound = ["dep:sqlx", "ports"]
ports = []
schema = ["dep:utoipa"]
service = ["foreign_entity/ports", "ports"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
foreign_entity = { path = "../foreign_entity", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
