[package]
edition = "2024"
name = "email"
publish = false
version = "0.1.0"

[features]
all = [
  "ai_tools",
  "gmail_token",
  "http_client",
  "inbound",
  "outbound",
  "ports",
]
attachment = [
  "dep:attachment",
  "dep:non_empty",
  "ports",
]
ai_schema = ["dep:schemars"]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
  "ports",
]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "models_pagination/axum",
]
gmail_token = ["dep:authentication_service_client", "dep:redis", "ports"]
http_client = ["dep:reqwest", "ports"]
inbound = ["ports"]
outbound = ["dep:sqlx", "dep:email_db_client", "ports"]
ports = ["crm/ports", "dep:tokio", "frecency/ports", "macro_event_broker/ports"]

[dependencies]
ai_toolset = { path = "../ai_toolset", optional = true }
attachment = { path = "../attachment", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true }
entity_access = { path = "../entity_access" }
entity_access_management = { path = "../entity_access_management", default-features = false, features = [
  "ports",
] }
futures = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
crm = { path = "../crm", default-features = false }
doppleganger = { workspace = true, features = ["chrono", "uuid"] }
either = { workspace = true }
email_utils = { path = "../email_utils" }
filter_ast = { path = "../filter_ast" }
frecency = { path = "../frecency" }
item_filters = { path = "../item_filters" }
lol_html = { workspace = true }
scraper = { workspace = true }
email_db_client = { path = "../email_db_client", optional = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"], optional = true }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
model-entity = { path = "../model-entity" }
non_empty = { path = "../non_empty", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
models_pagination = { path = "../models_pagination" }
recursion = { workspace = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true, features = ["uuid1"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
authentication_service_client = { path = "../authentication_service_client", optional = true }
redis = { workspace = true, features = ["tokio-rustls-comp"], optional = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"], optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
crm = { path = "../crm", features = ["outbound"] }
frecency = { path = "../frecency", features = ["outbound", "postgres"] }
macro_event_broker = { path = "../macro_event_broker", default-features = false, features = [
  "ports",
] }
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
