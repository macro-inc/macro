[package]
edition = "2024"
name = "reminders"
publish = false
version = "0.1.0"

[features]
default = []
# The queue worker. Transport-agnostic: it drives the domain through the
# dispatch ports, so it needs an async runtime but no AWS SDK.
dispatch = ["dep:serde_json", "dep:tokio", "dep:tokio-util", "ports"]
# The worker plus the SQS adapter that backs it.
dispatch-sqs = ["dep:aws-sdk-sqs", "dispatch", "outbound"]
inbound = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:utoipa",
  "entity_access/inbound",
  "ports",
]
notify = ["dep:model_notifications", "dep:notification", "outbound"]
outbound = ["ports"]
ports = ["dep:entity_access", "dep:tracing", "dep:email", "dep:serde_json"]
postgres = ["dep:macro_uuid", "dep:sqlx", "dep:tokio", "outbound"]

[dependencies]
email = { workspace = true, optional = true, features = ["ports"] }
aws-sdk-sqs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# `query` brings `axum_extra::extract::Query`, whose deserializer collects
# repeated query keys into a vector; `axum::extract::Query` keeps only one.
axum-extra = { workspace = true, optional = true, features = ["query"] }
chrono = { workspace = true, features = ["serde"] }
entity_access = { workspace = true, optional = true, features = ["ports"] }
macro_authorization = { workspace = true, optional = true, features = ["axum"] }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true, optional = true }
model_entity = { workspace = true }
rootcause = { workspace = true }
model_error_response = { workspace = true, optional = true }
model_notifications = { workspace = true, optional = true }
notification = { workspace = true, default-features = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "time"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
entity_access_outbound = { workspace = true }
crm = { workspace = true, features = ["ports"] }
email = { workspace = true, features = ["outbound"] }
entity_access_management = { workspace = true, default-features = true }
frecency = { workspace = true, features = ["postgres"] }
macro_db_migrator = { workspace = true }
model_user = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
