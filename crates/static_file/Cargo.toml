[package]
edition = "2024"
name = "static_file"
publish = false
version = "0.1.0"

[features]
default = ["outbound"]
attachment = ["dep:futures", "dep:attachment", "dep:model_entity"]
outbound = ["dep:reqwest"]

[dependencies]
anyhow = { workspace = true }
mime = "0.3"
tracing = { workspace = true }

# Domain
macro_user_id = { workspace = true }

# Attachment
attachment = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
model_entity = { workspace = true, optional = true }
non_empty = { workspace = true }

# Outbound
reqwest = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
