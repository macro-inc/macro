<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e3df; --accent: #3b5bdb; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
      --line: #2f2f2c; --accent: #7c96ff; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 17px; margin: 0; }
  #count { color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    padding: 12px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .seen .dot { background: transparent; }
  .kind { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .title { font-weight: 550; word-break: break-word; }
  .snippet { color: var(--muted); overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .done { border: 0; background: var(--chip); border-radius: 8px; padding: 6px 10px; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); border-radius: 10px; padding: 8px 8px 8px 14px;
    display: flex; gap: 12px; align-items: center; }
  .toast[hidden] { display: none; }
  .toast button { border: 0; background: transparent; color: inherit; font-weight: 600; padding: 4px 8px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .toast button[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Inbox</h1><span id="count"></span></header>
  <div id="list"><p class="empty">Loading…</p></div>
</div>
<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span><button id="undo">Undo</button>
</div>

<script type="text/macro" id="feed" lang="ts">
  /** The first string a notification's metadata carries under one of these keys. */
  function pick(content: unknown, keys: string[]): string | null {
    if (typeof content !== 'object' || content === null) return null;
    const record = content as Record<string, unknown>;
    for (const key of keys) {
      const value = record[key];
      if (typeof value === 'string' && value.trim()) return value;
    }
    return null;
  }

  /** One of Macro's tags in message text: `<m-…>{json}</m-…>`. */
  const MACRO_TAG = /<(m-[a-z-]+)>(.*?)<\/\1>/g;

  type TagData = {
    userId?: string; email?: string; displayName?: string; name?: string; documentName?: string;
    groupAlias?: string; label?: string; date?: string; displayFormat?: string;
  };

  /**
   * Message text with Macro's mention tags shown as names; any other text,
   * angle brackets included, stays as written. A mention the SDK built
   * carries only the user's id, so its name is loaded (once per id, in `names`).
   */
  async function plain(
    text: string,
    macro: ProgramContext['macro'],
    names: Map<string, Promise<string | undefined>>,
  ): Promise<string> {
    const tags = [...text.matchAll(MACRO_TAG)].map((match) => {
      try {
        return JSON.parse(match[2] ?? '') as TagData;
      } catch {
        return {};
      }
    });
    for (const tag of tags) {
      if (tag.userId && !tag.displayName && !names.has(tag.userId)) {
        names.set(tag.userId, macro.users.byId(tag.userId).name().catch(() => undefined));
      }
    }
    const loaded = await Promise.all(tags.map((tag) => (tag.userId ? names.get(tag.userId) : undefined)));

    let index = 0;
    return text.replace(MACRO_TAG, (_match, kind: string) => {
      const tag = tags[index] ?? {};
      const loadedName = loaded[index];
      index += 1;
      if (kind === 'm-user-mention' || kind === 'm-contact-mention') {
        const email = tag.email ?? tag.userId?.replace(/^macro\|/, '');
        return `@${tag.displayName || tag.name || loadedName || email || 'someone'}`;
      }
      if (kind === 'm-group-mention') return `@${tag.groupAlias ?? 'group'}`;
      if (kind === 'm-date-mention') return tag.displayFormat || tag.date || '';
      // Document, task, project and other chips carry their name; images and cards show nothing.
      return tag.documentName || tag.label || tag.name || '';
    });
  }

  export default async function (_args: {}, { macro }: ProgramContext) {
    // The feed holds unseen and seen notifications; done ones are left out.
    const rows = [];
    const mentioned = new Map<string, Promise<string | undefined>>();
    for await (const notification of macro.notifications.list({ pageSize: 30 })) {
      const metadata = await notification.metadata();
      const sender = await notification.sender();
      const kind = metadata.tag.replaceAll('_', ' ');
      // A sender without a Macro profile, such as an outside contact, has no name to load.
      const from = sender
        ? ((await sender.name().catch(() => undefined)) ?? sender.email() ?? null)
        : pick(metadata.content, ['senderDisplayName']);
      // A direct message's channel is named for the viewer; show who wrote instead.
      const direct = pick(metadata.content, ['channelType']) === 'directMessage';
      const named = pick(metadata.content, [
        'documentName', 'entityName', 'taskName', 'channelName', 'subject', 'title', 'name',
      ]);
      const snippet = pick(metadata.content, ['messageContent', 'snippet', 'body', 'message', 'content']);
      rows.push({
        id: notification.id,
        kind,
        title: (direct ? from : named) ?? kind.replace(/^./, (first) => first.toUpperCase()),
        snippet: snippet === null ? null : await plain(snippet, macro, mentioned),
        from,
        at: await notification.createdAt(),
        seen: await notification.seen(),
      });
      if (rows.length === 30) break;
    }
    return rows;
  }
</script>

<script type="text/macro" id="setDone" lang="ts">
  export default async function ({ id, done }: { id: string; done: boolean }, { macro }: ProgramContext) {
    const notification = macro.notifications.byId(id);
    if (done) await notification.markDone();
    else await notification.markUndone();
    return { done };
  }
</script>

<script type="module" lang="ts">
  import { on } from 'macro:client';
  import { feed, setDone } from 'macro:programs';

  const list = document.getElementById('list')!;
  const count = document.getElementById('count')!;
  const toast = document.getElementById('toast')!;
  const toastText = document.getElementById('toast-text')!;
  const undo = document.getElementById('undo') as HTMLButtonElement;
  let lastDone: string | null = null;

  function el<K extends keyof HTMLElementTagNameMap>(tag: K, className = '', text = '') {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function relative(at: string) {
    const minutes = Math.round((Date.now() - new Date(at).getTime()) / 60000);
    if (minutes < 60) return `${Math.max(minutes, 1)}m`;
    if (minutes < 60 * 24) return `${Math.round(minutes / 60)}h`;
    return `${Math.round(minutes / 1440)}d`;
  }

  // Coalesce reloads: live events arrive in bursts, and a page may run only
  // two programs at once.
  let reloading: Promise<void> | null = null;
  let stale = false;
  function reload(): Promise<void> {
    stale = true;
    reloading ??= (async () => {
      while (stale) {
        stale = false;
        await load();
      }
    })().finally(() => {
      reloading = null;
    });
    return reloading;
  }

  function showToast(text: string, canUndo: boolean) {
    toastText.textContent = text;
    undo.hidden = !canUndo;
    toast.hidden = false;
  }

  async function load() {
    let rows: Awaited<ReturnType<typeof feed>>;
    try {
      rows = await feed();
    } catch (error) {
      list.replaceChildren(el('p', 'empty', `Couldn't load notifications: ${String(error)}`));
      return;
    }
    count.textContent = rows.length ? String(rows.length) : '';
    if (rows.length === 0) {
      list.replaceChildren(el('p', 'empty', "You're all caught up."));
      return;
    }
    const ul = el('ul');
    for (const row of rows) {
      const li = el('li', row.seen ? 'seen' : '');
      const text = el('div');
      const kind = [row.kind, row.from, relative(row.at)].filter(Boolean).join(' · ');
      text.append(el('div', 'kind', kind), el('div', 'title', row.title));
      if (row.snippet) text.append(el('div', 'snippet', row.snippet));
      const button = el('button', 'done', 'Done');
      button.setAttribute('aria-label', `Mark “${row.title}” done`);
      button.addEventListener('click', async () => {
        button.disabled = true;
        li.style.opacity = '.4';
        try {
          await setDone({ id: row.id, done: true });
        } catch (error) {
          button.disabled = false;
          li.style.opacity = '';
          showToast(`Couldn't mark “${row.title}” done: ${String(error)}`, false);
          return;
        }
        lastDone = row.id;
        showToast('Marked done', true);
        await reload();
      });
      li.append(el('span', 'dot'), text, button);
      ul.append(li);
    }
    list.replaceChildren(ul);
  }

  undo.addEventListener('click', async () => {
    if (!lastDone) return;
    undo.disabled = true;
    try {
      await setDone({ id: lastDone, done: false });
    } catch (error) {
      toastText.textContent = `Couldn't undo: ${String(error)}`;
      return;
    } finally {
      undo.disabled = false;
    }
    lastDone = null;
    toast.hidden = true;
    await reload();
  });
  // Notifications have no live event of their own; a mention, message or
  // shared document usually arrives with one.
  on(['message.posted', 'message.mentioned', 'document.created'], reload);
  await reload();
</script>
</body>
</html>
