<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e3df; --accent: #3b5bdb; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
      --line: #2f2f2c; --accent: #7c96ff; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  input, button { font: inherit; color: inherit; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  h1 { font-size: 17px; margin: 0 auto 0 0; }
  input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    min-width: 0; flex: 1 1 160px; }
  #query { max-width: 260px; }
  .add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .add input { max-width: 240px; }
  button { padding: 8px 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  .person { display: flex; align-items: center; gap: 10px; font-weight: 550; }
  .initial { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--chip);
    display: grid; place-items: center; font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .status { color: var(--muted); margin: 0 0 12px; }
  .status:empty { display: none; }
  @media (max-width: 560px) { .optional { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Contacts</h1>
    <input id="query" type="search" placeholder="Search name or email" aria-label="Search contacts">
  </header>
  <div class="add">
    <input id="name" placeholder="Name" aria-label="New contact name">
    <input id="email" type="email" placeholder="Email" aria-label="New contact email">
    <button id="create">Add contact</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <div id="list"><p class="empty">Loading…</p></div>
</div>

<script type="text/macro" id="contacts" lang="ts">
  export default async function ({ query }: { query: string }, { macro }: ProgramContext) {
    // CRM contacts belong to the viewer's current team.
    if ((await macro.teams.list()).length === 0) return { inTeam: false, contacts: [] };
    const found = await macro.crm.searchContacts(query, { limit: 50 });
    const companies = new Map<string, Promise<string | null>>();
    const contacts = await Promise.all(found.map(async (contact) => {
      const company = await contact.company();
      if (company && !companies.has(company.id)) {
        companies.set(company.id, company.name().then((name) => name ?? null));
      }
      return {
        id: contact.id,
        name: (await contact.name()) || '(no name)',
        email: (await contact.email()) ?? null,
        company: company ? await companies.get(company.id)! : null,
        lastInteraction: (await contact.lastInteraction()) ?? null,
      };
    }));
    return { inTeam: true, contacts };
  }
</script>

<script type="text/macro" id="addContact" lang="ts">
  export default async function (
    { name, email }: { name: string; email: string },
    { macro }: ProgramContext,
  ) {
    const contact = await macro.crm.createContact({ name, email: email || null });
    return { id: contact.id };
  }
</script>

<script type="module" lang="ts">
  import { addContact, contacts } from 'macro:programs';

  const list = document.getElementById('list')!;
  const queryInput = document.getElementById('query') as HTMLInputElement;
  const nameInput = document.getElementById('name') as HTMLInputElement;
  const emailInput = document.getElementById('email') as HTMLInputElement;
  const createButton = document.getElementById('create') as HTMLButtonElement;
  const status = document.getElementById('status')!;

  function el<K extends keyof HTMLElementTagNameMap>(tag: K, className = '', text = '') {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  // Coalesce reloads: live events arrive in bursts, and a page may run only
  // two programs at once.
  let reloading: Promise<void> | null = null;
  let stale = false;
  function reload(): Promise<void> {
    stale = true;
    reloading ??= (async () => {
      while (stale) {
        stale = false;
        await load();
      }
    })().finally(() => {
      reloading = null;
    });
    return reloading;
  }

  async function load() {
    const query = queryInput.value.trim();
    let result: Awaited<ReturnType<typeof contacts>>;
    try {
      result = await contacts({ query });
    } catch (error) {
      list.replaceChildren(el('p', 'empty', `Couldn't load contacts: ${String(error)}`));
      return;
    }
    const { inTeam, contacts: rows } = result;
    if (!inTeam) {
      createButton.disabled = true;
      list.replaceChildren(el('p', 'empty', 'Contacts belong to a team. Create or join a team to keep contacts here.'));
      return;
    }
    if (rows.length === 0) {
      list.replaceChildren(el('p', 'empty', 'No contacts yet. People you email appear here.'));
      return;
    }
    const table = el('table');
    const head = el('tr');
    head.append(el('th', '', 'Name'), el('th', '', 'Company'), el('th', 'optional', 'Last interaction'));
    table.append(head);
    for (const row of rows) {
      const tr = el('tr');
      const person = el('div', 'person');
      const text = el('div', '', row.name);
      if (row.email) text.append(el('div', 'muted', row.email));
      person.append(el('span', 'initial', row.name.slice(0, 1).toUpperCase()), text);
      const nameCell = el('td');
      nameCell.append(person);
      const last = row.lastInteraction
        ? new Date(row.lastInteraction).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
        : '—';
      tr.append(nameCell, el('td', row.company ? '' : 'muted', row.company ?? '—'), el('td', 'muted optional', last));
      table.append(tr);
    }
    list.replaceChildren(table);
  }

  let debounce: ReturnType<typeof setTimeout> | undefined;
  queryInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(reload, 250);
  });
  createButton.addEventListener('click', async () => {
  // One add at a time, so repeated clicks can't add duplicates.
  let adding = false;
    const name = nameInput.value.trim();
    if (!name || adding) return;
    adding = true;
    createButton.disabled = true;
    status.textContent = '';
    try {
      await addContact({ name, email: emailInput.value.trim() });
      nameInput.value = '';
      emailInput.value = '';
    } catch (error) {
      status.textContent = `Couldn't add “${name}”: ${String(error)}`;
      return;
    } finally {
      adding = false;
      createButton.disabled = false;
    }
    await reload();
  });
  await reload();
</script>
</body>
</html>
