<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channels</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e3df; --accent: #3b5bdb; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
      --line: #2f2f2c; --accent: #7c96ff; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 220px 1fr; }
  input, button { font: inherit; color: inherit; }
  nav { border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; }
  nav h1 { font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin: 4px 8px 10px; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 7px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  nav button[aria-current="true"] { background: var(--chip); font-weight: 600; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  main header { padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  #messages { flex: 1; overflow: auto; padding: 12px 16px; display: flex;
    flex-direction: column; gap: 12px; }
  .message { display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
    color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .who { font-weight: 600; margin-right: 6px; }
  .when { color: var(--muted); font-size: 12px; }
  .body { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); }
  .composer button { padding: 9px 14px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; cursor: pointer; }
  .muted { color: var(--muted); }
  .status { color: var(--muted); margin: 0; padding: 0 16px 8px; }
  .status:empty { display: none; }
  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px; }
    nav h1 { display: none; }
    nav button { width: auto; flex: none; }
  }
</style>
</head>
<body>
<nav id="channels" aria-label="Channels"><h1>Channels</h1></nav>
<main>
  <header id="title">Loading…</header>
  <div id="messages" aria-live="polite"></div>
  <p class="status" id="status" role="status"></p>
  <div class="composer">
    <input id="draft" placeholder="Write a message" aria-label="Message">
    <button id="send">Send</button>
  </div>
</main>

<script type="text/macro" id="channelList" lang="ts">
  export default async function (_args: {}, { macro }: ProgramContext) {
    const page = await macro.workspace.page({ includeTypes: ['channel'], limit: 40 });
    return page.items.flatMap((item) =>
      item.type === 'channel' ? [{ id: item.id, name: item.name ?? 'Untitled channel' }] : [],
    );
  }
</script>

<script type="text/macro" id="messages" lang="ts">
  /** One of Macro's tags in message text: `<m-…>{json}</m-…>`. */
  const MACRO_TAG = /<(m-[a-z-]+)>(.*?)<\/\1>/g;

  type TagData = {
    userId?: string; email?: string; displayName?: string; name?: string; documentName?: string;
    groupAlias?: string; label?: string; date?: string; displayFormat?: string;
  };

  /**
   * Message text with Macro's mention tags shown as names; any other text,
   * angle brackets included, stays as written. A mention the SDK built
   * carries only the user's id, so its name is loaded (once per id, in `names`).
   */
  async function plain(
    text: string,
    macro: ProgramContext['macro'],
    names: Map<string, Promise<string | undefined>>,
  ): Promise<string> {
    const tags = [...text.matchAll(MACRO_TAG)].map((match) => {
      try {
        return JSON.parse(match[2] ?? '') as TagData;
      } catch {
        return {};
      }
    });
    for (const tag of tags) {
      if (tag.userId && !tag.displayName && !names.has(tag.userId)) {
        names.set(tag.userId, macro.users.byId(tag.userId).name().catch(() => undefined));
      }
    }
    const loaded = await Promise.all(tags.map((tag) => (tag.userId ? names.get(tag.userId) : undefined)));

    let index = 0;
    return text.replace(MACRO_TAG, (_match, kind: string) => {
      const tag = tags[index] ?? {};
      const loadedName = loaded[index];
      index += 1;
      if (kind === 'm-user-mention' || kind === 'm-contact-mention') {
        // Someone with no profile name shows their email's local part.
        const email = tag.email ?? tag.userId?.replace(/^macro\|/, '');
        return `@${tag.displayName || tag.name || loadedName || email?.split('@')[0] || 'someone'}`;
      }
      if (kind === 'm-group-mention') return `@${tag.groupAlias ?? 'group'}`;
      if (kind === 'm-date-mention') return tag.displayFormat || tag.date || '';
      // Document, task, project and other chips carry their name; images and cards show nothing.
      return tag.documentName || tag.label || tag.name || '';
    });
  }

  export default async function ({ channelId }: { channelId: string }, { macro }: ProgramContext) {
    const channel = macro.channels.byId(channelId);
    const recent = [];
    for await (const message of channel.messages({ pageSize: 30 })) {
      recent.push(message);
      if (recent.length === 30) break;
    }

    const names = new Map<string, Promise<string>>();
    const mentioned = new Map<string, Promise<string | undefined>>();
    const rows = await Promise.all(recent.map(async (message) => {
      const author = await message.author();
      if (!names.has(author.id)) {
        // People without a profile name show their email's local part.
        const fallback = author.email()?.split('@')[0] ?? 'Someone';
        names.set(author.id, author.name().then((name) => name ?? fallback, () => fallback));
      }
      return {
        id: message.id,
        author: await names.get(author.id)!,
        content: await plain(await message.content(), macro, mentioned),
        createdAt: await message.createdAt(),
      };
    }));
    return { name: (await channel.name()) ?? 'Channel', messages: rows.reverse() };
  }
</script>

<script type="text/macro" id="post" lang="ts">
  export default async function (
    { channelId, text }: { channelId: string; text: string },
    { macro }: ProgramContext,
  ) {
    const message = await macro.channels.byId(channelId).send(text);
    return { id: message.id };
  }
</script>

<script type="module" lang="ts">
  import { on } from 'macro:client';
  import { channelList, messages, post } from 'macro:programs';

  const nav = document.getElementById('channels')!;
  const title = document.getElementById('title')!;
  const list = document.getElementById('messages')!;
  const draft = document.getElementById('draft') as HTMLInputElement;
  const sendButton = document.getElementById('send') as HTMLButtonElement;
  const status = document.getElementById('status')!;
  let current: string | null = null;

  function el<K extends keyof HTMLElementTagNameMap>(tag: K, className = '', text = '') {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function openChannel(id: string) {
    current = id;
    for (const button of nav.querySelectorAll('button')) {
      button.setAttribute('aria-current', String(button.dataset.id === id));
    }
    return reload();
  }

  // Coalesce reloads: live events arrive in bursts, and a page may run only
  // two programs at once.
  let reloading: Promise<void> | null = null;
  let stale = false;
  function reload(): Promise<void> {
    stale = true;
    reloading ??= (async () => {
      while (stale) {
        stale = false;
        await load();
      }
    })().finally(() => {
      reloading = null;
    });
    return reloading;
  }

  async function load() {
    const id = current;
    if (!id) return;
    let result: Awaited<ReturnType<typeof messages>>;
    try {
      result = await messages({ channelId: id });
    } catch (error) {
      if (current === id) list.replaceChildren(el('p', 'muted', `Couldn't load messages: ${String(error)}`));
      return;
    }
    if (current !== id) return;
    const { name, messages: rows } = result;
    title.textContent = `# ${name}`;
    if (rows.length === 0) {
      list.replaceChildren(el('p', 'muted', 'No messages yet. Say hello.'));
      return;
    }
    list.replaceChildren(...rows.map((row) => {
      const item = el('div', 'message');
      const text = el('div');
      const line = el('div');
      const when = new Date(row.createdAt).toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
      });
      line.append(el('span', 'who', row.author), el('span', 'when', when));
      text.append(line, el('div', 'body', row.content));
      item.append(el('div', 'avatar', row.author.slice(0, 1).toUpperCase()), text);
      return item;
    }));
    list.scrollTop = list.scrollHeight;
  }

  // One send at a time, so repeated Enter presses can't post twice. The draft
  // is cleared only once the message is posted, so a failed send keeps it.
  let sending = false;
  async function send() {
    const text = draft.value.trim();
    if (!text || !current || sending) return;
    sending = true;
    sendButton.disabled = true;
    status.textContent = '';
    try {
      await post({ channelId: current, text });
      if (draft.value.trim() === text) draft.value = '';
    } catch (error) {
      status.textContent = `Couldn't send: ${String(error)}`;
      return;
    } finally {
      sending = false;
      sendButton.disabled = false;
    }
    await reload();
  }

  let channels: Awaited<ReturnType<typeof channelList>> = [];
  try {
    channels = await channelList();
    if (channels.length === 0) title.textContent = 'You are not in any channels yet.';
  } catch (error) {
    title.textContent = `Couldn't load channels: ${String(error)}`;
  }
  for (const channel of channels) {
    const button = el('button', '', channel.name);
    button.dataset.id = channel.id;
    button.addEventListener('click', () => openChannel(channel.id));
    nav.append(button);
  }
  sendButton.addEventListener('click', send);
  draft.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') send();
  });
  on(['message.posted', 'message.patched', 'message.deleted'], reload);
  if (channels[0]) await openChannel(channels[0].id);
</script>
</body>
</html>
