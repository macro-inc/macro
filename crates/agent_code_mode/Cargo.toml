[package]
name = "agent_code_mode"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent_runtime_protocol = { path = "../agent_runtime_protocol", features = ["utoipa"] }
chrono = { workspace = true }
cognition = { path = "../cognition" }
agent_session = { path = "../agent_session", default-features = false }
ai_toolset = { path = "../ai_toolset" }
dynamic_ui = { path = "../dynamic_ui" }
async-trait = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
bot_id = { path = "../bot_id" }
calendar_events = { path = "../calendar_events", features = ["ai_tools"] }
code_execution = { path = "../code_execution" }
code_mode_assets = { path = "../code_mode_assets" }
email = { path = "../email", features = ["ai_tools", "inbound"] }
entity_access = { path = "../entity_access", default-features = false, features = ["ports", "inbound"] }
futures = { workspace = true }
import = { path = "../import" }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
mcp_client = { path = "../mcp_client" }
macro_uuid = { path = "../macro_uuid" }
nutype = { workspace = true }
pipedream_mcp = { path = "../pipedream_mcp" }
rootcause = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
specta = { workspace = true }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
sqlx = { workspace = true, features = ["json"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
jev = { path = "../jev", features = ["outbound"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
macro_db_migrator = { path = "../macro_db_migrator" }
agent_session = { path = "../agent_session", default-features = false, features = ["test-utils", "outbound"] }
entity_access = { path = "../entity_access", features = ["outbound"] }
tower = { workspace = true, features = ["util"] }
