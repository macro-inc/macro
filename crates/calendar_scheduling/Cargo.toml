[package]
name = "calendar_scheduling"
version = "0.1.0"
edition = "2024"
publish = false

[features]
client = ["dep:reqwest"]
default = []
ai_tools = ["dep:ai_toolset", "dep:async-trait", "dep:schemars", "dep:anyhow"]
postgres = ["dep:sqlx"]
inbound = ["dep:axum", "dep:macro_authorization", "schema"]
schema = ["dep:utoipa"]
calendar = ["dep:calendar_events", "dep:teams", "dep:macro_user_id", "dep:reqwest"]

[dependencies]
reqwest = { workspace = true, optional = true }
ai_toolset = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
email_validator = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
rootcause = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
macro_authorization = { workspace = true, features = ["axum"], optional = true }
calendar_events = { workspace = true, optional = true }
teams = { workspace = true, features = ["ports"], optional = true }
macro_user_id = { workspace = true, optional = true }

[dev-dependencies]
model_user = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
