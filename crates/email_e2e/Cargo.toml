[package]
edition = "2024"
name = "email_e2e"
publish = false
version = "0.1.0"
description = "Test support: runs the real email_service and pubsub_workers binaries against the Gmail and Outlook emulators, and the end-to-end email scenarios written on top."

[dependencies]
ai_toolset = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
crm = { workspace = true, default-features = true }
email = { workspace = true, features = ["ai_tools", "inbound", "outbound", "sqs"] }
entity_access = { workspace = true, default-features = true }
entity_access_management = { workspace = true, default-features = true }
frecency = { workspace = true, features = ["outbound", "postgres"] }
calendar_events = { workspace = true, features = ["inbound", "postgres"] }
chrono = { workspace = true }
hex = { workspace = true }
lexical_client = { workspace = true }
gmail_emulator = { workspace = true }
macro_auth = { workspace = true, features = ["testing"] }
macro_authorization = { workspace = true, default-features = true }
macro_aws_config = { workspace = true, features = ["sqs"] }
macro_db_migrator = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
outlook_emulator = { workspace = true }
rdkafka = { workspace = true }
redis = { workspace = true, features = ["tokio-comp"] }
reqwest = { workspace = true }
rootcause = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqs_client = { workspace = true, features = ["email", "gmail"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
chrono = { workspace = true }
feature_flags = { workspace = true }
macro_env = { workspace = true }
