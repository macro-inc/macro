# What the email end-to-end suite leaves uncovered, and why. Four kinds:
# waived for good, deferred to the full-stack tier, thought dead, and (in
# functions.toml, `bug`) held open by a known product bug. Anything waived,
# deferred or thought dead here that a scenario does cover or reach is
# reported as stale. A fifth kind is not left uncovered: entry points owned
# by the functions of another product, counted there.
#
# A function no scenario is asked to cover:
#
# [[function]]
# id = "F-000"            # from apps/web/tests/email-e2e/ledger/functions.tsv
# provider = "outlook"    # optional: gmail or outlook; both when absent
# reason = "..."
#
# An entry point no scenario is asked to reach:
#
# [[entry_point]]
# entry = "http GET /health"   # `kind key`, as in entrypoints.tsv
# provider = "gmail"           # optional
# reason = "..."
#
# An entry point left to the full-stack tier (a provider's sign-in route,
# say): not waived and not open, counted in its own column. An entry point
# is waived or deferred on a provider, never both.
#
# [[deferred]]
# entry = "http GET /email/oauth/callback"
# provider = "gmail"           # optional
# reason = "..."
#
# An entry point nothing in the repository calls: waived on both providers
# and listed under "Dead code candidates" with its source. The reason says
# how it was found to have no caller.
#
# [[dead_code]]
# entry = "http GET /email/unused"
# reason = "..."
#
# An entry point the functions of another product call, not email's: not
# waived, deferred or open, and in none of email's totals. It is counted
# with its owner's functions; the report lists it under "Counted with the
# <owner> functions" and says whether a scenario reached it. It cannot also
# be waived, deferred, dead code or named in functions.toml.
#
# [[owned]]
# entry = "provider gmail:events.list"
# provider = "gmail"           # optional
# owner = "calendar"
#
# Functions another service carries out are deferred to the full-stack tier
# by `outside` in functions.toml, not here.

# ------------------------------------------------- provider methods unused

[[entry_point]]
entry = "provider gmail:messages.batchDelete"
reason = "served by the emulator, never called by the product: every Gmail request goes through gmail_client, which has no batch delete"

[[entry_point]]
entry = "provider gmail:messages.delete"
reason = "served by the emulator, never called by the product: gmail_client only reads messages by id; the product trashes, it never deletes"

[[entry_point]]
entry = "provider gmail:messages.import"
reason = "served by the emulator, never called by the product: sending is messages.send; nothing posts to messages/import"

[[entry_point]]
entry = "provider gmail:labels.update"
reason = "served by the emulator, never called by the product: the Gmail label adapter lists, creates and deletes; nothing sends a PUT or PATCH"

[[entry_point]]
entry = "provider outlook:messages.copy"
reason = "served by the emulator, never called by the product: archive and move use /move; no Graph request ends in /copy"

[[entry_point]]
entry = "provider outlook:messages.sendMail"
reason = "served by the emulator, never called by the product: Outlook sends by creating a draft and posting /send on it"

[[entry_point]]
entry = "provider outlook:messages.reply"
reason = "served by the emulator, never called by the product: the product calls createReply, a separate row"

[[entry_point]]
entry = "provider outlook:messages.forward"
reason = "served by the emulator, never called by the product: no Graph request ends in /forward"

[[entry_point]]
entry = "provider outlook:batch"
reason = "served by the emulator, never called by the product: every Graph call is a single request; nothing posts to $batch"

# ---------------------------------------------------- sign-in, full stack

