# Which backend entry points perform each email function.
#
# One table per function of the shared function list (F-001 .. F-192), in id
# order. An atom is "<kind> <key>" exactly as in columns 1 and 2 of
# entrypoints.tsv, optionally followed by " where <cond>, <cond>".
#
#   by      the function is performed when ONE of these is seen in a scenario
#   gmail   and, on a Gmail inbox, ALL of these are seen in the same scenario
#   outlook the same for an Outlook inbox
#   also    other entry points that take part; they map entry points to
#           functions and are not needed for "performed"
#   ui      the function happens in the browser; the value says why no
#           backend takes part
#   outside another service carries the function out and no scenario's stack
#           records it; the value names the service. Deferred to the
#           full-stack tier, not measured here.
#   bug     a known product bug keeps the function open; the value is its
#           short id. The function is never proved or claimed, and checks
#           and proofs that name it are not looked at, until the line goes.
#   bug_on  the one provider (gmail or outlook) the bug is on, when the
#           function works on the other; both when absent.
#
# Conditions:
#   /json/pointer=value, /json/pointer   on the request body shape (http,
#                                        webhook, queue) or the GraphQL
#                                        variables shape; a bare pointer means
#                                        present and not null
#   name=value                           a path parameter of an http template
#   ?key, ?key=value                     an http query key
#   ~text                                the GraphQL query text contains text
#
# In a shape a list keeps its first item only, booleans stay, numbers are 0
# and a string stays only when it is a short word (letters, "_", ".", "-").
#
# Loops are never seen in a scenario, so they appear under `also` only.

# ---------------------------------------------------------------- connect

[F-001]  # Connect a Gmail inbox
by = ["http POST /email/init where ?link_id"]
gmail = ["provider gmail:getProfile", "provider gmail:watch"]
also = [
  "kafka macro.email:LinkConnected",
  "provider gmail:oauth.authorize",
  "provider gmail:oauth.userinfo",
  "provider gmail:oauth.tokeninfo",
  "provider gmail:labels.list",
]

[F-002]  # Connect an Outlook inbox
by = ["http POST /email/init where ?link_id"]
outlook = ["provider outlook:me.get", "provider outlook:subscriptions.create", "webhook outlook:validation"]
also = [
  "http POST /outlook/webhook/{attempt}",
  "kafka macro.email:LinkConnected",
  "provider outlook:oauth.authorize",
  "provider outlook:oauth.token",
  "provider outlook:oauth.userinfo",
  "provider outlook:oauth.discovery",
  "provider outlook:oauth.keys",
  "provider outlook:subscriptions.list",
  "provider outlook:folders.list",
  "provider outlook:folders.get",
  "provider outlook:categories.list",
]

[F-003]  # Connect an Outlook inbox that needs administrator approval
# After approval the inbox is linked by the same request as any other
# Outlook inbox (F-002); what differs happens before it.
outside = "the authentication service asks for the administrator's approval and records it"

[F-004]  # Connect a second inbox to the same account
by = ["http POST /email/init where ?link_id"]
gmail = ["provider gmail:getProfile", "provider gmail:watch"]
outlook = ["provider outlook:me.get", "provider outlook:subscriptions.create"]
also = ["kafka macro.email:LinkConnected"]

[F-005]  # Share an inbox another user already connected
by = ["http POST /email/init where ?force_share=true"]
also = ["kafka macro.email:LinkConnected"]

[F-006]  # Cancel or fail the provider consent and return to the app
# Nothing reaches the email service when consent is abandoned; the attempt it
# left behind is removed by this daily sweep.
by = ["lambda user_link_cleanup_handler"]

[F-007]  # Reconnect an inbox whose access expired or was revoked
by = ["http POST /email/init where ?link_id"]
gmail = ["provider gmail:oauth.authorize", "provider gmail:watch"]
outlook = ["provider outlook:oauth.authorize", "provider outlook:subscriptions.create"]
also = ["kafka macro.email:LinkReauthRequired"]

[F-008]  # Enable a disabled inbox
by = ["http POST /email/init"]
gmail = ["provider gmail:watch"]
outlook = ["provider outlook:subscriptions.create"]

[F-009]  # Remove an inbox (own: clears its mail; shared: removes access)
# The provider lists hold for an inbox the user owns; removing a shared inbox
# only drops the user's access and calls no provider.
by = ["http DELETE /email/links/{link_id}", "http DELETE /email/sync"]
gmail = ["provider gmail:stop"]
outlook = ["provider outlook:subscriptions.delete"]
also = [
  "queue link-manager:DeleteLink",
  "kafka macro.email:LinkDisconnected",
  "gateway refresh_email:LinkRemoved",
  "loop mailbox_sync_worker::run_lifecycle",
]

[F-010]  # Connect an inbox during onboarding
ui = "the backend sees the same connect request as F-001 and F-002; nothing in it says onboarding"

[F-011]  # Link Gmail automatically on Google sign-in
# The same request without `link_id`, which no condition can say.
by = ["http POST /email/init"]
gmail = ["provider gmail:getProfile", "provider gmail:watch"]

[F-012]  # Refresh provider access tokens
by = ["queue link-manager:HealthCheck", "queue link-manager:Refresh"]
gmail = ["provider gmail:oauth.token"]
outlook = ["provider outlook:oauth.token"]

[F-013]  # Renew the provider's change notifications (Gmail watch, Outlook subscriptions)
by = [
  "queue link-manager:Refresh",
  "webhook outlook:lifecycle:reauthorizationRequired",
  "webhook outlook:lifecycle:subscriptionRemoved",
]
gmail = ["provider gmail:watch"]
outlook = ["provider outlook:subscriptions.update"]
also = ["lambda email_refresh_handler", "loop mailbox_sync_worker::run_watches"]

[F-014]  # Show inbox health and prompt to reconnect
by = ["http POST /email/links/health-check"]
also = [
  "queue link-manager:HealthCheck",
  "queue link-manager:NotifyReauthRequired",
  "kafka macro.email:LinkReauthRequired",
  "loop mailbox_sync_worker::run_health",
]

[F-015]  # Send-as aliases: list them and keep them in sync
by = ["graphql GraphqlEmailLink.sendAs"]
gmail = ["provider gmail:settings.sendAs.list"]
also = ["loop mailbox_sync_worker::run_settings"]

# ------------------------------------------------------------------- sync

[F-016]  # Import existing mail when an inbox is connected (backfill)
by = ["http POST /email/init"]
gmail = ["queue backfill:ListThreads", "provider gmail:threads.list"]
outlook = ["provider outlook:messages.delta"]
also = [
  "queue backfill:Init",
  "queue backfill:BackfillThread",
  "queue backfill:BackfillMessage",
  "queue backfill:BackfillAttachment",
  "queue backfill:UpdateThreadMetadata",
  "queue backfill:FinalizeBackfill",
  "kafka macro.email:ThreadBackfilled",
  "gateway refresh_email:Backfill",
  "gateway refresh_email:BackfillProgress",
  "http GET /email/backfill/gmail",
  "http GET /email/backfill/gmail/active",
  "http GET /email/backfill/gmail/{id}",
  "http POST /internal/backfill/provider/gmail",
  "http GET /internal/backfill/provider/gmail/{id}",
  "provider gmail:threads.get",
  "provider gmail:messages.list",
  "provider outlook:messages.list",
  "provider outlook:batch",
  "loop backfill_outbox::run",
  "loop mailbox_sync_worker::run",
]

[F-017]  # Receive a new message from the provider
by = ["http POST /gmail/webhook", "webhook outlook:change where /value/0/changeType=created"]
gmail = [
  "queue gmail-inbox-sync:GmailMessage",
  "queue gmail-inbox-sync:UpsertMessage",
  "provider gmail:history.list",
  "provider gmail:messages.get",
]
outlook = ["provider outlook:messages.delta"]
also = [
  "http POST /outlook/webhook/{attempt}",
  "kafka macro.email:MessageReceived",
  "provider outlook:messages.get",
  "provider outlook:attachments.list",
  "loop mailbox_sync_worker::run",
]

[F-018]  # Show a new message in the open list without reloading
by = ["gateway refresh_email:UpsertMessage"]

[F-019]  # Pick up a change made in the provider's own client (read, archive, star, trash, label)
by = ["queue gmail-inbox-sync:UpdateLabels", "webhook outlook:change where /value/0/changeType=updated"]
gmail = ["provider gmail:history.list"]
outlook = ["provider outlook:messages.delta"]
also = ["gateway refresh_email:UpdateLabels", "provider gmail:labels.get"]

[F-020]  # Pick up a message deleted at the provider
by = ["queue gmail-inbox-sync:DeleteMessage", "webhook outlook:change where /value/0/changeType=deleted"]
gmail = ["provider gmail:history.list"]
outlook = ["provider outlook:messages.delta"]
also = ["kafka macro.email:MessageDeleted", "gateway refresh_email:DeleteMessage"]

[F-021]  # Pick up a draft created or changed at the provider
by = ["kafka macro.email:MessageDraftSynced"]
gmail = ["queue gmail-inbox-sync:UpsertMessage"]
outlook = ["webhook outlook:change"]
also = [
  "provider gmail:drafts.list",
  "provider gmail:drafts.get",
  "loop mailbox_sync_worker::run_drafts",
]

[F-022]  # Pick up mail sent from the provider's own client
by = ["kafka macro.email:MessageSent"]
gmail = ["queue gmail-inbox-sync:UpsertMessage"]
outlook = ["webhook outlook:change"]

[F-023]  # Force a sync of an inbox
by = ["http POST /email/links/{link_id}/resync"]
gmail = ["queue backfill:ListThreads", "provider gmail:threads.list"]
outlook = ["provider outlook:messages.delta"]

[F-024]  # Recover after missed or failed provider notifications
# Gmail recovers inside the ordinary sync message (its retry queue is an
# alias of the same entry point), so only the queue message can be named.
by = ["webhook outlook:lifecycle:missed", "queue gmail-inbox-sync:GmailMessage"]
gmail = ["provider gmail:history.list"]
outlook = ["provider outlook:messages.delta"]

[F-025]  # Thread messages into conversations
by = [
  "queue gmail-inbox-sync:UpsertMessage",
  "queue backfill:BackfillThread",
  "webhook outlook:change where /value/0/changeType=created",
]
gmail = ["provider gmail:threads.get"]
outlook = ["provider outlook:messages.delta"]

[F-026]  # Sync the provider address book into contacts
by = ["http POST /email/init", "queue link-manager:Refresh"]
gmail = ["provider gmail:people.connections.list", "provider gmail:otherContacts.list"]
outlook = ["provider outlook:contactFolders.list", "provider outlook:contacts.list"]
also = [
  "queue sfs-uploader:SFSUploaderMessage",
  "queue backfill:SeedSentContact",
  "gateway refresh_email:PhotoSynced",
  "provider gmail:people.get",
  "provider outlook:contacts.delta",
  "provider outlook:contacts.photo",
  "provider outlook:me.photo",
  "loop mailbox_sync_worker::run_contacts",
]

[F-027]  # Classify mail as Focus, Signal or Noise
by = ["gateway refresh_email:FocusUpdated"]
also = ["graphql GraphqlSoupEmailThread.focus"]

[F-028]  # Index mail for search
by = [
  "kafka macro.email:ThreadsReindexRequested",
  "kafka macro.email:MessageReceived",
  "kafka macro.email:ThreadBackfilled",
]
also = [
  "http POST /internal/threads/histories",
  "http POST /internal/messages/senders",
  "http GET /internal/threads/{id}/messages",
  "loop mailbox_sync_worker::run_projections",
]

# ------------------------------------------------------------------- list

[F-029]  # Open the Inbox and switch between Focus, Signal and Noise
by = [
  "http GET /email/threads/previews/cursor/{view} where view=inbox",
  "graphql GraphqlUser.emailFocus",
  "graphql GraphqlSoupEmailThread.mailAllPreview",
]

[F-030]  # Open a mailbox tab: Drafts, Sent, Scheduled, All mail, Archived, Starred
by = [
  "http GET /email/threads/previews/cursor/{view} where view=drafts",
  "http GET /email/threads/previews/cursor/{view} where view=sent",
  "http GET /email/threads/previews/cursor/{view} where view=all",
  "http GET /email/threads/previews/cursor/{view} where view=starred",
  "http GET /email/drafts/scheduled",
  "graphql GraphqlSoupEmailThread.mailDraftPreview",
  "graphql GraphqlSoupEmailThread.mailSentPreview",
]
also = [
  "graphql GraphqlSoupEmailThread.latestOutboundMessageTs",
  "graphql GraphqlSoupEmailThread.latestNonSpamMessageTs",
]

[F-031]  # Open Spam and Trash
by = [
  "http GET /email/threads/previews/cursor/{view} where view=spam",
  "http GET /email/threads/previews/cursor/{view} where view=trash",
]

[F-032]  # Open Shared with me
outside = "document storage: POST /items/soup/ast with the shared filter"

[F-033]  # Choose which inboxes or alias the list shows
# The REST list always shows every inbox of the user; the web app narrows
# the list by an owner literal in the filter tree of the soup request.
by = ["elsewhere document_storage_service POST /items/soup/ast where /ef/l/Owner"]
also = ["graphql GraphqlSoupEmailThread.linkId"]

[F-034]  # Filter the list by read state, done state, star, attachments, people, tags, importance, activity
by = ["elsewhere document_storage_service POST /items/soup/ast where /ef"]

[F-035]  # Sort the list
by = ["http GET /email/threads/previews/cursor/{view} where ?sort_method"]

[F-036]  # Page through a long list (load more)
by = ["http GET /email/threads/previews/cursor/{view} where ?cursor"]

[F-037]  # Refresh the list
by = ["http GET /email/threads/previews/cursor/{view}"]

[F-038]  # Move through the list with the keyboard
ui = "no request leaves the browser"

[F-039]  # Select threads (one, range, all) and clear the selection
ui = "selection is browser state"

[F-040]  # Use the reading pane (toggle, resize, open beside the list)
ui = "layout is browser state"

[F-041]  # See a thread's row: sender, subject, snippet, time, unread, star, attachment, draft and count marks
by = [
  "http GET /email/threads/previews/cursor/{view}",
  "graphql GraphqlSoupEmailThread.latestContentMessage",
]
also = [
  "graphql GraphqlSoupEmailThread.mailDraftState",
  "graphql GraphqlSoupEmailThread.hasReceivedMail",
  "graphql GraphqlSoupEmailThread.latestInboundMessageTs",
]

[F-042]  # See the unread count badge on Mail
outside = "nothing in the email service returns an unread count; the badge comes from the notification service"

[F-043]  # See empty, loading and failed list states and retry
ui = "states the browser draws around the list request of F-029"

[F-044]  # Undo the last list action
# Undo sends the opposite of the action it undoes.
by = [
  "http PATCH /email/threads/{id}/archived",
  "http PATCH /email/threads/archived",
  "http PATCH /email/threads/{id}/state",
  "graphql CompleteMutationRoot.setEmailThreadArchived",
  "graphql CompleteMutationRoot.setEmailThreadsArchived",
  "graphql CompleteMutationRoot.setEmailThreadState",
]

# ------------------------------------------------------------------ views

[F-045]  # Create a saved view from filters
outside = "saved views are stored outside the email service"

[F-046]  # Open a saved view
# A saved view's filters arrive as the same filter tree; the view itself
# is stored outside the email service.
by = ["elsewhere document_storage_service POST /items/soup/ast where /ef"]

[F-047]  # Edit, rename or duplicate a saved view
outside = "saved views are stored outside the email service"

[F-048]  # Delete a saved view
outside = "saved views are stored outside the email service"

[F-049]  # Reorder saved views
outside = "saved views are stored outside the email service"

# ----------------------------------------------------------------- search

[F-050]  # Search mail by text from the list
by = ["elsewhere document_storage_service POST /search"]

[F-051]  # Search mail from global search and Cmd+K and open a result
by = ["elsewhere document_storage_service POST /search"]

[F-052]  # Open a thread at the message a search hit names
by = ["http GET /email/threads/{thread_id}", "graphql GraphqlUser.emailThread"]

# ------------------------------------------------------------------- read

[F-053]  # Open a thread
by = [
  "http GET /email/threads/{thread_id}",
  "http GET /email/threads/{id}/messages",
  "graphql GraphqlUser.emailThread",
  "graphql GraphqlSoupEmailThread.messages",
]

[F-054]  # Open a thread in a new split or tab
ui = "the backend sees the same thread read as F-053; the split or tab is browser state"

[F-055]  # Open a thread from a link, mention or notification
by = ["http GET /email/threads/{thread_id}", "graphql GraphqlUser.emailThread"]

[F-056]  # Read a message: sanitized HTML body, plain text, inline images
by = [
  "http GET /email/messages/{id}",
  "http POST /email/messages/batch",
  "http GET /email/threads/{thread_id}",
  "graphql GraphqlSoupEmailThread.messages",
]

[F-057]  # Load remote images through the image proxy
outside = "the image proxy is not an email entry point"

[F-058]  # Expand and collapse messages and their header details
ui = "no request leaves the browser"

[F-059]  # Show quoted text and trimmed signatures
ui = "the browser folds text it already has"

[F-060]  # Read a long thread (hidden middle messages, expand all)
by = [
  "http GET /email/threads/{thread_id} where ?offset",
  "http GET /email/threads/{id}/messages where ?offset",
  "graphql GraphqlSoupEmailThread.messages",
]

[F-061]  # Go to the next or previous thread
ui = "the backend sees the same thread read as F-053; which thread is next is browser state"

[F-062]  # Move between messages with the keyboard
ui = "no request leaves the browser"

[F-063]  # See who a message is from and to (participants, hover card)
ui = "participants come with the thread already loaded"

[F-064]  # Download a message as .eml
by = ["http GET /email/messages/{id}/eml"]
gmail = ["provider gmail:messages.get"]
outlook = ["provider outlook:messages.value"]

[F-065]  # Copy a link to a thread
ui = "no request leaves the browser"

[F-066]  # See read receipts for sent mail
by = ["http GET /email/threads/{thread_id}/read-receipts"]
also = ["http GET /opens/{token}"]

[F-067]  # Turn read receipts on or off for an inbox
by = ["http PATCH /email/settings where /settings/read_receipts_enabled"]

# --------------------------------------------------------------- organise

[F-068]  # Mark a thread read
by = [
  "http PATCH /email/threads/{id}/state where /field=read, /value=true",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=READ, /input/value=true",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.update"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadRead"]

[F-069]  # Mark a thread unread
by = [
  "http PATCH /email/threads/{id}/state where /field=read, /value=false",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=READ, /input/value=false",
  "graphql CompleteMutationRoot.markEmailThreadUnread",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.update"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadRead"]

[F-070]  # Mark a thread read automatically when it is opened
by = ["http POST /email/threads/{id}/seen", "graphql CompleteMutationRoot.markEmailThreadSeen"]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.update"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadRead"]

[F-071]  # Mark a thread done (archive)
by = [
  "http PATCH /email/threads/{id}/archived where /value=true",
  "graphql CompleteMutationRoot.setEmailThreadArchived where /input/archived=true",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.move"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadArchived"]

[F-072]  # Mark a thread not done (back to the inbox)
by = [
  "http PATCH /email/threads/{id}/archived where /value=false",
  "graphql CompleteMutationRoot.setEmailThreadArchived where /input/archived=false",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.move"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadArchived"]

[F-073]  # Star a thread
by = [
  "http PATCH /email/threads/{id}/state where /field=starred, /value=true",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=STARRED, /input/value=true",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.update"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadStarred"]

[F-074]  # Unstar a thread
by = [
  "http PATCH /email/threads/{id}/state where /field=starred, /value=false",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=STARRED, /input/value=false",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.update"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadStarred"]

[F-075]  # Move a thread to Trash
by = [
  "http PATCH /email/threads/{id}/state where /field=trashed, /value=true",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=TRASHED, /input/value=true",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.move"]
also = [
  "queue gmail-ops:ModifyMessageLabels",
  "kafka macro.email:ThreadTrashed",
  "provider gmail:messages.trash",
]

[F-076]  # Restore a thread from Trash
by = [
  "http PATCH /email/threads/{id}/state where /field=trashed, /value=false",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=TRASHED, /input/value=false",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.move"]
also = [
  "queue gmail-ops:ModifyMessageLabels",
  "kafka macro.email:ThreadTrashed",
  "provider gmail:messages.untrash",
]

[F-077]  # Delete a thread permanently
ui = "no backend entry point deletes a thread at the provider; Trash is the only removal"

[F-078]  # Report a thread as not spam
by = [
  "http PATCH /email/threads/{id}/state where /field=junk, /value=false",
  "graphql CompleteMutationRoot.setEmailThreadState where /input/field=JUNK, /input/value=false",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.move"]
also = ["queue gmail-ops:ModifyMessageLabels", "kafka macro.email:ThreadSpamChanged"]

[F-079]  # Mute and unmute a thread's notifications
outside = "notification preferences are kept outside the email service"

[F-080]  # Block a sender
by = ["http POST /email/contacts/block"]
gmail = ["provider gmail:settings.filters.create"]
outlook = ["provider outlook:rules.create"]
also = [
  "http GET /email/contacts/blocked",
  "queue gmail-ops:BlockSender",
  "provider gmail:settings.filters.list",
  "provider gmail:settings.filters.get",
  "provider outlook:rules.list",
]

[F-081]  # Set a sender to Signal or Noise
by = ["http PUT /email/filters where /is_important"]
also = ["http GET /email/filters", "http DELETE /email/filters/{id}"]

[F-082]  # Act on several selected threads at once (done, read, star, trash, tag)
by = [
  "http PATCH /email/threads/archived",
  "graphql CompleteMutationRoot.setEmailThreadsArchived",
  "http PATCH /email/messages/labels",
]
gmail = ["provider gmail:messages.modify"]
outlook = ["provider outlook:messages.move"]
also = [
  "queue gmail-ops:ModifyMessageLabelsBatch",
  "provider gmail:messages.batchModify",
  "kafka macro.email:ThreadArchived",
]

[F-083]  # Undo an action from its toast
# Undo sends the opposite of the action it undoes.
by = [
  "http PATCH /email/threads/{id}/archived",
  "http PATCH /email/threads/archived",
  "http PATCH /email/threads/{id}/state",
  "graphql CompleteMutationRoot.setEmailThreadArchived",
  "graphql CompleteMutationRoot.setEmailThreadsArchived",
  "graphql CompleteMutationRoot.setEmailThreadState",
]

# ----------------------------------------------------------------- labels

[F-084]  # Add and remove a tag on a thread
by = [
  "elsewhere document_storage_service POST /properties/entities/{entity_type}/{entity_id}/{property_id}/options/{option_id} where entity_type=THREAD",
  "elsewhere document_storage_service DELETE /properties/entities/{entity_type}/{entity_id}/{property_id}/options/{option_id} where entity_type=THREAD",
]
also = ["elsewhere document_storage_service POST /properties/tags"]

[F-085]  # Filter by a tag from a row's chip
ui = "sets a list filter; the list read is F-034"

[F-086]  # Change a thread's provider labels or folder
