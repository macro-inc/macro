  "queue reminder-dispatch:Sweep",
  "graphql GraphqlSoupEmailThread.reminderReturnedAt",
  "queue gmail-ops:ModifyMessageLabels",
]

[F-094]  # A reply cancels an if-no-reply reminder
# The reply is an ordinary received message; the cancelling itself happens in
# the reminders code and leaves no entry point of its own.
by = ["kafka macro.email:MessageReceived"]

