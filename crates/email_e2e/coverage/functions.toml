gmail = ["provider gmail:labels.list"]
outlook = ["provider outlook:categories.list", "provider outlook:folders.list"]

# -------------------------------------------------------------- reminders

[F-090]  # Set a reminder on a thread (preset, typed time, if no reply or regardless)
by = ["elsewhere document_storage_service PUT /reminders/email/{thread_id} where /type=set"]

[F-091]  # Change or remove a reminder
# An edit names the revision it replaces; removing is the other type.
by = [
  "elsewhere document_storage_service PUT /reminders/email/{thread_id} where /type=set, /expectedRevision",
  "elsewhere document_storage_service PUT /reminders/email/{thread_id} where /type=remove",
]

[F-092]  # See reminders in the Reminders tab
by = ["elsewhere document_storage_service GET /reminders/email/collection"]
also = ["elsewhere document_storage_service GET /reminders/email/{thread_id}"]

[F-093]  # A due reminder brings the thread back and notifies
