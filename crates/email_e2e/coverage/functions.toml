  "graphql CompleteMutationRoot.resolveEmailMessageOperation where /input/action=USE_PROVIDER",
  "graphql CompleteMutationRoot.resolveEmailMessageOperation where /input/action=RECHECK",
]
also = ["http GET /email/drafts/{id}/operation"]

[F-121]  # Keep local drafts across sign-out confirmation
