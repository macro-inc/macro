[package]
edition = "2024"
name = "github_pull_requests"
publish = false
version = "0.1.0"

[features]
default = ["outbound", "ports", "service"]
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model_error_response",
  "entity_access/inbound",
  "schema",
  "service",
]
outbound = [
  "dep:filter_ast",
  "dep:pagination_types",
  "dep:sqlx",
  "ports",
]
ports = ["dep:entity_access", "dep:item_filters", "foreign_entity/ports"]
# Pull request patches in S3.
s3 = ["dep:aws-sdk-s3", "outbound"]
schema = ["dep:utoipa", "git_patch/schema"]
service = ["ports"]

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
entity_access = { workspace = true, optional = true, features = ["ports"] }
filter_ast = { workspace = true, optional = true }
foreign_entity = { workspace = true }
git_patch = { workspace = true }
item_filters = { workspace = true, default-features = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = ["axum"] }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
model_error_response = { workspace = true, optional = true }
pagination_types = { workspace = true, optional = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
foreign_entity = { workspace = true, features = ["outbound"] }
macro_db_migrator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
