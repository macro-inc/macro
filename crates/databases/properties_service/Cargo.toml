[package]
edition = "2024"
name = "properties_service"
publish = false
version = "0.1.0"

[lib]
name = "properties_service"
path = "src/lib.rs"

[[bin]]
name = "properties_service_openapi"
path = "src/openapi.rs"

[dependencies]
axum = { workspace = true, features = ["tower-log", "ws"] }
entity_access = { workspace = true, default-features = true }
entity_access_outbound = { workspace = true }
macro_authorization = { workspace = true, default-features = true }
properties_types = { workspace = true }
notification = { workspace = true, default-features = true }
notification_outbound = { workspace = true }
properties = { workspace = true, default-features = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
properties_inbound = { workspace = true, default-features = true }
