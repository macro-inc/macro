[package]
edition = "2024"
name = "forms"
publish = false
version = "0.1.0"

[features]
default = []
scheduling = ["dep:calendar_scheduling", "outbound"]
ai_tools = ["dep:ai_toolset", "dep:async-trait", "dep:anyhow", "ports"]
# Capability impls for the unified entity-mutation router (rename, trash,
# restore, permanent delete).
entity_mutation = ["dep:entity_mutation", "ports"]
# Axum HTTP router.
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:utoipa",
  "databases/ports",
  "entity_access/inbound",
  "ports",
]
# Liveness pings through the connection gateway.
gateway = ["dep:anyhow", "dep:connection_gateway_client", "dep:serde_json", "outbound"]
# Driven adapters share the port contracts.
outbound = ["dep:collab_surface", "dep:reqwest", "dep:base64", "dep:macro_tower_layers", "ports"]
ports = ["dep:schemars", "models_forms/schema", "models_databases/schema", "databases/ports", "dep:entity_access", "dep:tracing", "dep:loro", "dep:serde_json"]
# Branding images read through the static-file service.
static_files = ["dep:anyhow", "dep:static_file_service_client", "outbound"]
# Postgres persistence for forms, layouts and the submission ledger.
postgres = ["dep:entity_access_db_utils", "dep:serde_json", "dep:sqlx", "outbound"]

[dependencies]
base64 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
macro_tower_layers = { workspace = true, optional = true }
calendar_scheduling = { workspace = true, optional = true }
ai_toolset = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
nom = { workspace = true }
strum = { workspace = true }
schemars = { workspace = true, optional = true }
activity = { workspace = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bot_id = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
collab_surface = { workspace = true, optional = true, features = ["ports"] }
connection_gateway_client = { workspace = true, optional = true }
databases = { workspace = true }
entity_access = { workspace = true, optional = true, features = ["ports"] }
entity_access_db_utils = { workspace = true, optional = true }
entity_mutation = { workspace = true, optional = true }
loro = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = ["axum"] }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
model_entity = { workspace = true }
models_databases = { workspace = true }
models_forms = { workspace = true }
models_permissions = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
static_file_service_client = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
bot_id = { workspace = true, features = ["test-utils"] }
entity_access = { workspace = true, features = ["outbound"] }
macro_db_migrator = { workspace = true }
models_properties = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
