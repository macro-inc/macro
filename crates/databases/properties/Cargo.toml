[package]
edition = "2024"
name = "properties"
publish = false
version = "0.1.0"

[features]
# The `JsonSchema` derive on `TagColor` for `properties_inbound`'s toolset.
ai_tools = ["dep:schemars", "ports"]
default = ["ai_tools", "outbound", "ports"]
outbound = [
  "dep:entity_access_db_utils",
  "dep:futures",
  "dep:macro_uuid",
  "dep:entity_kind",
  "dep:model_notifications",
  "dep:permissions_types",
  "dep:notification",
  "dep:sqlx",
  "ports",
]
ports = []
# mockall mocks of the ports, for crates that test against this service.
mock = ["dep:mockall"]

[dependencies]
activity = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
document_sub_type = { workspace = true, default-features = true }
bot_id = { workspace = true }
entity_access = { workspace = true, features = [
  "ports",
] }
entity_access_db_utils = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
model_owner = { workspace = true }
macro_uuid = { workspace = true, optional = true }
entity_kind = { workspace = true, optional = true }
model_notifications = { workspace = true, optional = true }
permissions_types = { workspace = true, optional = true }
properties_types = { workspace = true }
notification = { workspace = true, default-features = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
system_properties = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
mockall = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true }
macro_db_migrator = { workspace = true }
mockall = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.sqlx]
offline = true
