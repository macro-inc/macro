[package]
edition = "2024"
name = "database_webhooks"
publish = false
version = "0.1.0"

[features]
default = []
# Axum HTTP router: managing a database's webhooks, and receiving one.
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model_error_response",
  "databases/inbound",
  "entity_access/inbound",
]
# Postgres persistence, and receipts minted through entity access.
postgres = ["dep:sqlx"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
databases = { workspace = true, features = ["ports"] }
entity_access = { workspace = true, features = ["ports"] }
hex = { workspace = true }
macro_authorization = { workspace = true, optional = true, features = ["axum"] }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
model_error_response = { workspace = true, optional = true }
models_databases = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
# The real databases service and entity access, for the end-to-end test.
databases = { workspace = true, features = ["postgres"] }
entity_access = { workspace = true }
entity_access_outbound = { workspace = true }
macro_db_migrator = { workspace = true }
macro_event_broker = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
