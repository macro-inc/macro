[package]
edition = "2024"
name = "password_import_wasm"
publish = false
version = "0.1.0"

[lib]
# `cdylib` for the browser build; `rlib` so the wire mapping tests run natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The only crate that turns on `serde`: it serializes revealed values for the
# browser's import worker.
password_import = { path = "../password_import", features = ["serde"] }
serde = { workspace = true }

# The wasm-bindgen shell in `bindings`, which only exists on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
