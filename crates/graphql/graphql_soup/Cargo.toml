[package]
edition = "2024"
name = "graphql_soup"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
async-graphql = { workspace = true, features = ["dataloader"] }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
email = { workspace = true, features = [
  "axum",
  "inbound",
  "ports",
] }
entity_access = { workspace = true, features = [
  "inbound",
] }
filter_ast = { workspace = true }
graphql_common = { workspace = true }
