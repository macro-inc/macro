[package]
edition = "2024"
name = "calendar_events"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:models_pagination",
  "schema",
]
postgres = ["dep:sqlx", "dep:tokio"]
schema = ["dep:utoipa"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true }
futures = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = [
  "axum",
], optional = true }
models_pagination = { path = "../models_pagination", optional = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true }
