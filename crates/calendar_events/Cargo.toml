[package]
edition = "2024"
name = "calendar_events"
publish = false
version = "0.1.0"

[features]
default = []
outlook = ["dep:tokio"]
# The AI toolset adapter exposing calendar CRUD to agents.
ai_tools = [
  "dep:ai_toolset",
  "dep:anyhow",
  "dep:async-trait",
  "dep:email_validator",
  "dep:schemars",
  "dep:specta",
]
# The reminder dispatch queue worker. Transport-agnostic: it drives the
# domain through the dispatch ports.
dispatch = ["dep:tokio", "dep:tokio-util"]
# The worker plus the SQS adapter that backs it.
dispatch-sqs = ["dep:aws-sdk-sqs", "dispatch"]
google = ["dep:reqwest", "dep:urlencoding"]
# The calendar-service HTTP adapter implementing the mutation port, for hosts
# that are not the calendar write authority.
mutation-client = ["dep:reqwest"]
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:models_pagination",
  "dep:urlencoding",
  "schema",
]
# The notification-service reminder notifier.
notify = ["dep:macro_user_id", "dep:model_entity", "dep:model_notifications", "dep:notification"]
postgres = ["dep:sqlx", "dep:tokio"]
schema = ["dep:utoipa"]

[dependencies]
ai_toolset = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
email_validator = { workspace = true, optional = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
email_utils = { workspace = true }
futures = { workspace = true }
macro_authorization = { workspace = true, features = [
  "axum",
], optional = true }
macro_user_id = { workspace = true, optional = true }
model_entity = { workspace = true, optional = true }
model_notifications = { workspace = true, optional = true }
models_pagination = { workspace = true, optional = true }
notification = { workspace = true, default-features = true, optional = true }
reqwest = { workspace = true, optional = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
rootcause = { workspace = true }
schemars = { workspace = true, optional = true }
specta = { workspace = true, optional = true, features = ["chrono", "uuid"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
calendar_event_id = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
macro_db_migrator = { workspace = true }
macro_user_id = { workspace = true }
tokio = { workspace = true }
