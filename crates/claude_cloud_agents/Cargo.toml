[package]
name = "claude_cloud_agents"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
cursor_api_key = { path = "../cursor_api_key" }
axum = { workspace = true }
base64 = { workspace = true }
macro_authorization = { path = "../macro_authorization", features = ["axum"] }
rand = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
utoipa = { workspace = true }
agent-runtime-protocol = { package = "agent_runtime_protocol", path = "../agent_runtime_protocol", default-features = false, features = ["transport"] }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
sse-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros"] }
uuid = { workspace = true }
zeroize = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
tempfile = { workspace = true }
clap = { workspace = true, features = ["derive"] }
