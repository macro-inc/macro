[package]
edition = "2024"
name = "activity"
publish = false
version = "0.1.0"

[features]
schema = ["dep:utoipa"]
axum = ["reads", "schema", "dep:axum", "dep:macro_authorization", "dep:tracing"]
# The read service: ranges and feeds with display metadata resolved.
reads = ["dep:async-trait"]
# JSON schemas of the range types, for saved transcripts of the removed
# ReadActivity tool.
json_schema = ["dep:schemars", "reads"]
consumer = [
  "dep:kafka_util",
  "dep:futures",
  "dep:tokio-util",
  "dep:rdkafka",
  "dep:rootcause",
  "dep:tokio",
  "dep:tracing",
  "macro_event_broker/outbound",
]
default = ["consumer", "outbound", "realtime"]
outbound = ["dep:sqlx", "dep:tracing", "dep:entity_access"]
realtime = [
  "dep:broadcast",
  "dep:rootcause",
  "dep:tokio",
  "dep:tokio-retry",
  "dep:tracing",
]

[dependencies]
entity_access = { workspace = true, optional = true, features = ["ports"] }
agent_correlation = { workspace = true }
utoipa = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
macro_authorization = { workspace = true, features = [
  "axum",
], optional = true }
async-trait = { workspace = true, optional = true }
broadcast = { workspace = true, optional = true }
channel_sender = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true, optional = true }
kafka_util = { workspace = true, optional = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
model-entity = { workspace = true }
model_owner = { workspace = true }
rdkafka = { workspace = true, optional = true }
readonly = { workspace = true }
rootcause = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["json"], optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tokio-retry = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bot_id = { workspace = true }
macro_db_migrator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
