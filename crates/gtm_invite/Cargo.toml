[package]
edition = "2024"
name = "gtm_invite"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:ip_extractor",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:tower",
  "dep:utoipa",
]
default = ["axum", "inbound", "outbound", "ports"]
inbound = ["axum", "ports"]
outbound = ["dep:sqlx", "ports"]
ports = []

[dependencies]
# Core
anyhow = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Domain models
macro_authorization = { workspace = true, optional = true, features = [
  "axum",
] }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
rate_limit = { workspace = true, features = ["axum"] }

# Axum dependencies (for inbound)
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
ip_extractor = { workspace = true, optional = true }
model-error-response = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

# Outbound dependencies
sqlx = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
macro_db_migrator = { workspace = true }
mockall = { workspace = true }
model_user = { workspace = true }
rate_limit = { workspace = true, features = ["axum", "testing"] }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
