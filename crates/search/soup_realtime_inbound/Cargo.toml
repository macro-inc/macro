[package]
edition = "2024"
name = "soup_realtime_inbound"
publish = false
version = "0.1.0"

[dependencies]
call = { path = "../../call", default-features = false }
channels = { path = "../../channels", default-features = false }
chat = { path = "../../chat", default-features = false }
documents = { path = "../../documents", default-features = false, features = ["service"] }
email = { path = "../../email", default-features = false }
futures = { workspace = true }
github_pull_requests = { path = "../../github_pull_requests", default-features = false }
initiative = { path = "../../initiative", default-features = false }
kafka_util = { path = "../../kafka_util" }
macro_event_broker = { path = "../../macro_event_broker", default-features = false, features = ["outbound"] }
macro_user_id = { path = "../../macro_user_id" }
messages = { path = "../../messages", features = ["broker"] }
model-entity = { path = "../../model-entity" }
model_owner = { path = "../../model_owner" }
models_properties = { path = "../../models_properties" }
projects = { path = "../../projects", default-features = false, features = ["service"] }
properties = { path = "../../properties", default-features = false, features = ["ports"] }
rdkafka = { workspace = true }
rootcause = { workspace = true }
soup_realtime_core = { path = "../soup_realtime_core" }
system_properties = { path = "../../system_properties" }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-retry = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
uuid = { workspace = true }
