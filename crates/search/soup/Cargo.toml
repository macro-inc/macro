[package]
edition = "2024"
name = "soup"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
  "email/ai_tools",
  "email/inbound",
  "email/outbound",
  "models_soup/schema",
  "outbound",
  "ports",
]
all = ["ai_tools", "axum", "inbound", "outbound", "ports"]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:utoipa",
  "email/axum",
  "email/inbound",
  "item_filters/schema",
  "models_pagination/axum",
  "models_soup/schema",
]
inbound = ["email/inbound", "entity_access/inbound", "ports"]
outbound = [
  "crm/outbound",
  "dep:readonly_pool",
  "dep:sqlx",
  "ports",
  "properties/outbound",
]
ports = ["crm/ports", "dep:tokio", "frecency_core/ports"]


[dependencies]
activity = { workspace = true }
ai_toolset = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
call = { workspace = true, features = ["ports"] }
channels = { workspace = true, features = [
  "list",
] }
chrono = { workspace = true }
cowlike = { workspace = true }
crm = { workspace = true }
document_sub_type = { workspace = true, default-features = true }
either = { workspace = true }
email = { workspace = true, features = ["ports"] }
email_thread_id = { workspace = true }
entity_access = { workspace = true }
favorites = { workspace = true, features = ["ports"] }
filter_ast = { workspace = true }
foreign_entity = { workspace = true, features = [
  "ports",
] }
github_pull_requests = { workspace = true, features = ["ports"] }
indexmap = { workspace = true }
item_filters = { workspace = true, default-features = true }
macro_authorization = { workspace = true, features = ["axum"], optional = true }
macro_user_id = { workspace = true }
model_entity = { workspace = true }
model_error_response = { workspace = true, optional = true }
model_owner = { workspace = true }
models_grouping = { workspace = true }
models_pagination = { workspace = true }
models_properties = { workspace = true }
models_soup = { workspace = true }
non_empty = { workspace = true }
properties = { workspace = true }
readonly_pool = { workspace = true, optional = true }
recursion = { workspace = true }
rootcause = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
system_properties = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"], optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
frecency_core = { workspace = true }

[dev-dependencies]
ai_toolset = { workspace = true }
cool_asserts = "2"
filter_ast = { workspace = true }
frecency = { workspace = true, features = ["mock", "outbound"] }
http-body-util = { workspace = true }
item_filters = { workspace = true, default-features = true, features = ["mock"] }
macro_db_migrator = { workspace = true }
model_user = { workspace = true }
mockall = { workspace = true }
ordered-float = { workspace = true }
rootcause = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
