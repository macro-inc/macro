[package]
edition = "2024"
name = "soup_realtime"
publish = false
version = "0.1.0"

[features]
consumer = [
  "dep:call",
  "dep:channels",
  "dep:chat",
  "dep:documents",
  "dep:email",
  "dep:github_pull_requests",
  "dep:initiative",
  "dep:kafka_util",
  "dep:models_properties",
  "dep:projects",
  "dep:properties",
  "dep:rdkafka",
  "dep:system_properties",
  "dep:tokio",
  "macro_event_broker/outbound",
  "ports",
]
default = ["consumer", "outbound", "ports"]
outbound = [
  "dep:agent_session",
  "dep:entity_access",
  "ports",
]
ports = [
  "dep:broadcast",
  "dep:futures",
  "dep:rootcause",
  "dep:tokio",
  "dep:tokio-retry",
  "dep:tracing",
]

[dependencies]
agent_session = { workspace = true, optional = true }
broadcast = { workspace = true, optional = true }
call = { workspace = true, optional = true }
channels = { workspace = true, optional = true }
messages = { workspace = true, features = ["broker"] }
chat = { workspace = true, optional = true }
documents = { workspace = true, features = ["service"], optional = true }
email = { workspace = true, optional = true }
entity_access = { workspace = true, features = ["ports"], optional = true }
futures = { workspace = true, optional = true }
github_pull_requests = { workspace = true, optional = true }
initiative = { workspace = true, optional = true }
kafka_util = { workspace = true, optional = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
model_entity = { workspace = true }
model_owner = { workspace = true }
models_properties = { workspace = true, optional = true }
projects = { workspace = true, features = ["service"], optional = true }
properties = { workspace = true, features = ["ports"], optional = true }
rdkafka = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
serde = { workspace = true }
system_properties = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
tokio-retry = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
uuid = { workspace = true }
