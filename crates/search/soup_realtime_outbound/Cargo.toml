[package]
edition = "2024"
name = "soup_realtime_outbound"
publish = false
version = "0.1.0"

[features]
default = []
# `SoupTopicConsumer`, the Kafka consumer of recipient-targeted patches.
consumer = ["dep:kafka_util", "dep:rdkafka", "macro_event_broker/outbound"]

[dependencies]
agent_session = { workspace = true }
entity_access = { workspace = true, features = ["ports"] }
kafka_util = { workspace = true, optional = true }
macro_event_broker = { workspace = true }
macro_user_id = { workspace = true }
entity_kind = { workspace = true }
rdkafka = { workspace = true, optional = true }
rootcause = { workspace = true }
soup_realtime_core = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
