[package]
edition = "2024"
name = "soup_realtime_outbound"
publish = false
version = "0.1.0"

[features]
default = []
# `SoupTopicConsumer`, the Kafka consumer of recipient-targeted patches.
consumer = ["dep:kafka_util", "dep:rdkafka", "macro_event_broker/outbound"]

[dependencies]
agent_session = { path = "../../agent_session", default-features = false }
entity_access = { path = "../../entity_access", default-features = false, features = ["ports"] }
kafka_util = { path = "../../kafka_util", optional = true }
macro_event_broker = { path = "../../macro_event_broker", default-features = false }
macro_user_id = { path = "../../macro_user_id" }
model-entity = { path = "../../model-entity" }
rdkafka = { workspace = true, optional = true }
rootcause = { workspace = true }
soup_realtime_core = { path = "../soup_realtime_core" }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
