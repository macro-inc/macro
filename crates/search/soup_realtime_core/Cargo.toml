[package]
edition = "2024"
name = "soup_realtime_core"
publish = false
version = "0.1.0"

[features]
default = ["ports"]
ports = [
  "dep:broadcast",
  "dep:futures",
  "dep:rootcause",
  "dep:tokio",
  "dep:tokio-retry",
  "dep:tracing",
]

[dependencies]
broadcast = { path = "../../broadcast", optional = true }
futures = { workspace = true, optional = true }
macro_event_broker = { path = "../../macro_event_broker", default-features = false }
macro_event_topics = { path = "../../macro_event_topics" }
macro_user_id = { path = "../../macro_user_id" }
model-entity = { path = "../../model-entity" }
rootcause = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
tokio-retry = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
