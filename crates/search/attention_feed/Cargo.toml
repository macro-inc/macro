[package]
edition = "2024"
name = "attention_feed"
publish = false
version = "0.1.0"

[features]
default = []
# Viewer resolution at the entity access boundary, for GraphQL adapters.
inbound = ["entity_access/inbound"]
# Adapters over the services that own the feeds' data.
outbound = [
  "dep:activity",
  "dep:cow_str",
  "dep:email",
  "dep:models_soup",
  "dep:soup",
  "dep:soup_realtime_core",
]
# Notification fixtures and port fakes for the feeds' tests.
test-utils = []

[dependencies]
activity = { workspace = true, features = ["realtime"], optional = true }
async-stream = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
cow_str = { workspace = true, optional = true }
email = { workspace = true, features = ["ports"], optional = true }
email_thread_id = { workspace = true }
entity_access = { workspace = true, features = ["ports"] }
futures = { workspace = true }
item_filters = { workspace = true, default-features = true }
macro_user_id = { workspace = true }
model_entity = { workspace = true }
model_notifications = { workspace = true }
models_soup = { workspace = true, optional = true }
notification = { workspace = true, default-features = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
soup = { workspace = true, features = ["ports"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
soup_realtime_core = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
