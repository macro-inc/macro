[package]
edition = "2024"
name = "item_filters"
publish = false
version = "0.1.0"

[features]
default = ["native"]
mock = []
native = ["document_sub_type/default", "notification_state/postgres"]
schema = ["dep:schemars", "dep:utoipa", "notification_state/schema"]

[dependencies]
chrono = { workspace = true }
document_sub_type = { workspace = true }
either = { workspace = true }
filter_ast = { workspace = true }
macro_user_id = { workspace = true }
model_file_type = { workspace = true }
model_owner = { workspace = true }
nom = { workspace = true }
non_empty = { workspace = true }
notification_state = { workspace = true }
rootcause = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
cool_asserts = "2.0.3"
