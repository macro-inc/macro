[package]
edition = "2024"
name = "email_api_client"
publish = false
version = "0.1.0"

[features]
default = []
ports = ["dep:tokio"]
outbound-gmail = [
  "ports",
  "dep:base64",
  "dep:encoding_rs",
  "dep:gmail_client",
  "dep:html-escape",
  "dep:http",
  "dep:mailparse",
  "dep:serde_json",
]
microsoft-gate = ["ports", "dep:redis"]
outbound-outlook = ["dep:scraper", "dep:html-escape", "dep:calendar_events", "dep:chrono-tz", "ports", "dep:sha2", "dep:base64", "dep:reqwest", "dep:serde_json", "dep:url", "dep:httpdate", "dep:mailparse"]

[dependencies]
scraper = { workspace = true, optional = true }
calendar_events = { workspace = true, features = ["outlook"], optional = true }
chrono-tz = { workspace = true, optional = true }
redis = { workspace = true, features = ["tokio-rustls-comp"], optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
email_utils = { workspace = true }
encoding_rs = { workspace = true, optional = true }
gmail_client = { workspace = true, optional = true }
html-escape = { workspace = true, optional = true }
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
mail-builder = "0.4.3"
mailparse = { version = "0.16.1", optional = true }
models_email = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
calendar_events = { workspace = true, features = ["outlook", "postgres"] }
macro_db_migrator = { workspace = true }
macro_event_broker = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
