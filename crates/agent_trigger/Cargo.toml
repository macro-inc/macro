[package]
edition = "2024"
name = "agent_trigger"
publish = false
version = "0.1.0"

[features]
# Keep billing infrastructure out of domain-event-only consumers.
admission = ["dep:ai_billing"]
# Lexical / fast-model adapters. Off by default: `lexical_client` pulls
# models_search → models_soup → notification → rdkafka, and the self-hosted
# daemon only needs domain events from this crate. Services that construct
# the adapters enable this; do not add it to coding_agent_worker.
outbound = ["admission", "dep:agent", "dep:ai_usage", "dep:async-trait", "dep:document_storage_service_client", "dep:document_sub_type", "dep:lexical_client", "dep:sqlx", "dep:static_file", "channels/ports"]

[dependencies]
ai_billing = { path = "../ai_billing", optional = true }
agent = { path = "../agent", optional = true }
agent_session = { path = "../agent_session", default-features = false }
ai_usage = { path = "../ai_usage", optional = true }
anyhow = { workspace = true }
bot_id = { path = "../bot_id" }
document_storage_service_client = { path = "../document_storage_service_client", optional = true }
document_sub_type = { path = "../document_sub_type", optional = true }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
bots = { path = "../bots", default-features = false, features = ["ports"] }
lexical_client = { path = "../lexical_client", optional = true }
static_file = { path = "../static_file", optional = true, default-features = false }
chrono = { workspace = true }
# Only the domain vocabulary (`Event`, `MacroEvent`, `TopicEvent`). Asking for
# `outbound` here would pull rdkafka — and so librdkafka and openssl — into
# every consumer of this crate, including the self-hosted daemon, which
# publishes nothing and has to link statically.
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
channel_sender = { path = "../channel_sender" }
macro_uuid = { path = "../macro_uuid" }
messages = { path = "../messages", features = ["broker", "ports"] }
properties = { path = "../properties", default-features = false }
initiative = { path = "../initiative", default-features = false, features = ["ports"] }
models_properties = { path = "../models_properties" }
system_properties = { path = "../system_properties" }
rootcause = { workspace = true }
# Domain vocabulary: channel-parent trigger events keep the channel-only post
# shape, and the channel topic's `message_posted` can still feed the trigger.
channels = { path = "../channels", default-features = false }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
async-trait = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
messages = { path = "../messages", features = ["test-utils"] }
agent_session = { path = "../agent_session", features = ["test-utils"] }
bot_id = { path = "../bot_id", features = ["test-utils"] }
mime = "0.3"
mockall = { workspace = true }
model_owner = { path = "../model_owner" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
