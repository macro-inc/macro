[package]
edition = "2024"
name = "agent_trigger"
publish = false
version = "0.1.0"

[dependencies]
agent = { path = "../agent" }
agent_session = { path = "../agent_session" }
ai_usage = { path = "../ai_usage" }
anyhow = { workspace = true }
bot_id = { path = "../bot_id" }
lexical_client = { path = "../lexical_client" }
channels = { path = "../channels", features = ["ports"] }
chrono = { workspace = true }
# Only the domain vocabulary (`Event`, `MacroEvent`, `TopicEvent`). Asking for
# `outbound` here would pull rdkafka — and so librdkafka and openssl — into
# every consumer of this crate, including the self-hosted daemon, which
# publishes nothing and has to link statically.
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
channel_sender = { path = "../channel_sender" }
macro_uuid = { path = "../macro_uuid" }
serde = { workspace = true }
strum = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent_session = { path = "../agent_session", features = ["test-utils"] }
bot_id = { path = "../bot_id", features = ["test-utils"] }
mockall = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
