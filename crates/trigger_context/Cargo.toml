[package]
edition = "2024"
name = "trigger_context"
publish = false
version = "0.1.0"

# Why an agent was called, as it travels from whatever called it to whoever
# composes the agent's prompt. Plain data, so the self-hosted daemon and the
# session control API can carry it without the producers' dependencies.
[features]
# OpenAPI schema for the origin a session reports through its API.
schema = ["bot_id/schema", "dep:utoipa", "macro_user_id/schema"]

[dependencies]
bot_id = { path = "../bot_id" }
chrono = { workspace = true, features = ["serde"] }
macro_user_id = { path = "../macro_user_id" }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
