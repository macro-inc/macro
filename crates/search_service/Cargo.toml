[package]
edition = "2024"
name = "search_service"
publish = false
version = "0.1.0"

[lib]
name = "search_service"
path = "src/lib.rs"

[[bin]]
name = "search_service_openapi"
path = "src/openapi.rs"

[dependencies]
agent_session = { path = "../agent_session", default-features = false }
rootcause = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
calendar_events = { path = "../calendar_events" }
chrono = { workspace = true }
channels = { path = "../channels", default-features = false, features = ["outbound"] }
comms_db_client = { path = "../comms_db_client" }
crm = { path = "../crm", default-features = false, features = ["search"] }
document_sub_type = { path = "../document_sub_type" }
email_db_client = { path = "../email_db_client" }
feature_flags = { path = "../feature_flags" }
futures = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, features = [
  "outbound",
] }
indexmap = { workspace = true }
item_filters = { path = "../item_filters" }
macro_authorization = { path = "../macro_authorization" }
macro_db_client = { path = "../macro_db_client" }
models_properties = { path = "../models_properties" }
models_soup = { path = "../models_soup" }
properties = { path = "../properties", default-features = false, features = [
  "outbound",
] }
system_properties = { path = "../system_properties" }
readonly_pool = { path = "../readonly_pool" }
macro_user_id = { path = "../macro_user_id" }
model = { path = "../model" }
models_email = { path = "../models_email" }
models_opensearch = { path = "../models_opensearch" }
models_search = { path = "../models_search" }
models_search_cursor = { path = "../models_search_cursor" }
name_search = { path = "../name_search" }
opensearch_client = { path = "../opensearch_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
tracing-subscriber = { workspace = true }
