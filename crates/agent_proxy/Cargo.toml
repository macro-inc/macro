[package]
edition = "2024"
name = "agent_proxy"
publish = false
version = "0.1.0"

[[bin]]
name = "mock_runtime"
path = "src/bins/mock_runtime.rs"

[dependencies]
# Domain
agent = { path = "../agent" }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
chat = { path = "../chat", default-features = false, features = ["outbound"] }
chrono = { workspace = true }
futures = { workspace = true }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
model = { path = "../model" }
model-entity = { path = "../model-entity" }
models_permissions = { path = "../models_permissions" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
stream = { path = "../stream" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }

# Inbound (HTTP + runtime WebSocket)
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
axum = { workspace = true, features = ["ws"] }
macro_authorization = { path = "../macro_authorization", default-features = false, features = [
  "axum",
] }
utoipa = { workspace = true }

# Outbound
connection_gateway_client = { path = "../connection_gateway_client" }

# mock_runtime test bin
clap = { workspace = true, features = ["derive"] }
dotenvy = { workspace = true }
macro_entrypoint = { path = "../macro_entrypoint" }
tokio-tungstenite = { workspace = true }

workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
async-trait = { workspace = true }
attachment = { path = "../attachment" }
macro_db_migrator = { path = "../macro_db_migrator" }
