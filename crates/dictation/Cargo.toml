[package]
edition = "2024"
name = "dictation"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:rate_limit",
  "dep:rootcause",
  "dep:serde",
  "dep:utoipa",
  "rate_limit/axum",
]
outbound = [
  "dep:async-openai",
  "dep:backoff",
  "dep:macro_env_var",
  "dep:opus-pure",
  "dep:reqwest",
  "dep:serde",
  "dep:symphonia",
]

[dependencies]
ai_usage = { workspace = true }
async-openai = { workspace = true, optional = true, features = ["audio"] }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
backoff = { workspace = true, optional = true }
bytes = { workspace = true }
infer = { workspace = true }
macro_authorization = { workspace = true, optional = true, features = [
  "axum",
] }
macro_env_var = { workspace = true, optional = true }
macro_user_id = { workspace = true }
model-error-response = { workspace = true, optional = true }
opus-pure = { workspace = true, optional = true }
rate_limit = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
model_user = { workspace = true }
rate_limit = { workspace = true, features = [
  "axum",
  "testing",
] }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }
