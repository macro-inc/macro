[package]
name = "suggestions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent_correlation = { workspace = true }
agent_session = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
channels = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
documents = { workspace = true, features = ["outbound", "ports"] }
email = { workspace = true, features = ["outbound"] }
