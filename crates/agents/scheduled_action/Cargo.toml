[package]
name = "scheduled_action"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
local_auth = ["macro_authorization/local_auth"]

[dependencies]
ai_billing = { workspace = true }
ai_usage = { workspace = true }
bots = { workspace = true, default-features = true, features = ["outbound"] }
activity = { workspace = true }
agent_runtime_protocol = { workspace = true }
agent_session = { workspace = true, features = ["admission"] }
agent_correlation = { workspace = true }
async-trait = { workspace = true }
bot_id = { workspace = true }
call = { workspace = true, features = ["outbound"] }
channel_id = { workspace = true }
channel_sender = { workspace = true }
channels = { workspace = true, features = ["sqlx"] }
documents = { workspace = true, features = ["outbound", "ports"] }
document_sub_type = { workspace = true, default-features = true }
email = { workspace = true, features = ["outbound"] }
github = { workspace = true, features = ["installation_claims"] }
glob = { workspace = true }
feature_flags = { workspace = true }
jev_classifier = { workspace = true, features = ["outbound"] }
lexical_client = { workspace = true }
mention_utils = { workspace = true }
entity_access = { workspace = true, features = ["inbound"] }
entity_access_db_utils = { workspace = true }
kafka_util = { workspace = true }
macro_event_broker = { workspace = true, default-features = true, features = ["outbound"] }
messages = { workspace = true, features = ["broker", "outbound"] }
properties_types = { workspace = true }
properties = { workspace = true, features = ["outbound"] }
routine_program = { workspace = true, features = ["schema"] }
system_properties = { workspace = true }
trigger_context = { workspace = true }
rdkafka = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
serde_json = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
sqlx = { workspace = true }
macro_user_id = { workspace = true }
cron = { workspace = true }
anyhow = { workspace = true }
macro_uuid = { workspace = true }
chrono = { workspace = true}
chrono-tz = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
connection_gateway_client = { workspace = true }
shared_types = { workspace = true }
entity_kind = { workspace = true }
model_owner = { workspace = true }
entity_registry = { workspace = true, features = ["axum"] }
entity_registry_db_utils = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
tower = { workspace = true }
macro_tower_layers = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
entity_access_outbound = { workspace = true }
bot_id = { workspace = true, features = ["test-utils"] }
macro_db_migrator = { workspace = true }
