[package]
edition = "2024"
name = "agent_trigger"
publish = false
version = "0.1.0"

[features]
# Keep billing infrastructure out of domain-event-only consumers.
admission = ["dep:ai_billing"]
# Lexical / Jev / fast-model adapters. Off by default: `lexical_client` pulls
# models_search → models_soup → notification → rdkafka, and the self-hosted
# daemon only needs domain events from this crate. Services that construct
# the adapters enable this; do not add it to coding_agent_worker.
outbound = ["admission", "dep:agent_loop", "dep:ai_usage", "dep:call", "dep:document_storage_service_client", "dep:document_sub_type", "dep:jev_classifier", "dep:lexical_client", "dep:sqlx", "dep:static_file", "channels/ports"]

[dependencies]
ai_billing = { workspace = true, optional = true }
agent_loop = { workspace = true, optional = true }
agent_session = { workspace = true }
ai_usage = { workspace = true, optional = true }
anyhow = { workspace = true }
bot_id = { workspace = true }
document_storage_service_client = { workspace = true, optional = true }
document_sub_type = { workspace = true, default-features = true, optional = true }
jev_classifier = { workspace = true, optional = true }
entity_access = { workspace = true, features = ["ports"] }
bots = { workspace = true, features = ["ports"] }
lexical_client = { workspace = true, optional = true }
static_file = { workspace = true, optional = true }
chrono = { workspace = true }
trigger_context = { workspace = true }
# Only the domain vocabulary (`Event`, `MacroEvent`, `TopicEvent`). Asking for
# `outbound` here would pull rdkafka — and so librdkafka and openssl — into
# every consumer of this crate, including the self-hosted daemon, which
# publishes nothing and has to link statically.
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
channel_sender = { workspace = true }
macro_uuid = { workspace = true }
messages = { workspace = true, features = ["broker", "ports"] }
properties = { workspace = true }
project = { workspace = true, features = ["ports"] }
properties_types = { workspace = true }
system_properties = { workspace = true }
rootcause = { workspace = true }
# Domain vocabulary: channel-parent trigger events keep the channel-only post
# shape, and the channel topic's `message_posted` can still feed the trigger.
channels = { workspace = true, features = ["ports"] }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
async-trait = { workspace = true }
call = { workspace = true, features = ["ports"], optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { workspace = true }
messages = { workspace = true, features = ["test-utils"] }
agent_session = { workspace = true, default-features = true, features = ["test-utils"] }
bot_id = { workspace = true, features = ["test-utils"] }
mime = "0.3"
mockall = { workspace = true }
model_owner = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
