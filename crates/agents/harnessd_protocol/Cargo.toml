[package]
edition = "2024"
name = "harnessd_protocol"
publish = false
version = "0.1.0"

[features]
# `ToSchema` for the agent enum, for services that put it in their API.
schema = ["dep:utoipa"]
# `sqlx::Type` for the Postgres `agent_provider` enum.
sqlx = ["dep:sqlx"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
utoipa = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
