[package]
name = "agent_session"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["inbound", "outbound"]
# Quota contracts and helper orchestration without enabling session adapters.
admission = ["dep:ai_billing", "dep:ai_usage", "dep:jev_classifier"]
ai_tools = ["inbound", "dep:ai_toolset", "dep:async-trait", "dep:schemars"]
# The `seed_jsonl` replay binary: an argument parser, and the Postgres
# adapter it writes through.
cli = ["dep:clap", "outbound"]
# The axum router serving sessions over HTTP.
inbound = [
  "admission",
  "dep:axum",
  "dep:entity_registry",
  "dep:macro_authorization",
  "entity_access/inbound",
  "macro_authorization/axum",
  "schema",
]
# Postgres, the connection gateway, and the model-backed name generator.
outbound = [
  "admission",
  "bots/outbound",
  "dep:agent_loop",
  "dep:ai_usage",
  "dep:connection_gateway_client",
  "dep:entity_access_db_utils",
  "dep:entity_registry",
  "dep:entity_registry_db_utils",
  "dep:entity_kind",
  "dep:reqwest",
  "dep:macro_tower_layers",
  "dep:macro_authorization",
  "dep:sqlx",
  "dep:share_permission_db_utils",
  "macro_user_id/sqlx",
  "macro_authorization/axum",
]
# OpenAPI schemas for the vocabulary that reaches an HTTP boundary: the
# router's DTOs, and the lifecycle events the webhook union carries.
schema = ["activity/schema", "dep:utoipa", "agent_runtime_protocol/utoipa", "macro_user_id/schema", "trigger_context/schema"]
# Mock and in-memory port implementations, for crates that test against this one.
test-utils = ["dep:mockall", "agent_fold/test-utils"]

[dependencies]
activity = { workspace = true }
ai_billing = { workspace = true, optional = true }
lazy-regex = { workspace = true }
ai_toolset = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

agent-client-protocol = { workspace = true }
harness_id = { workspace = true }
agent_loop = { workspace = true, optional = true }
ai_usage = { workspace = true, optional = true }
jev_classifier = { workspace = true, optional = true }
dashmap = { workspace = true }
macro_uuid = { workspace = true }
messages = { workspace = true, features = ["ports", "schema"] }
mockall = { workspace = true, optional = true }
agent_fold = { workspace = true, default-features = true }
# Only the domain vocabulary; `outbound` would pull rdkafka into every
# consumer of this crate.
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
agent_runtime_protocol = { workspace = true, default-features = true }
axum = { workspace = true, optional = true }
bots = { workspace = true }
connection_gateway_client = { workspace = true, optional = true }
entity_access = { workspace = true, features = [
  "ports",
] }
entity_access_db_utils = { workspace = true, optional = true }
entity_registry = { workspace = true, optional = true }
entity_registry_db_utils = { workspace = true, optional = true }
genai_telemetry = { workspace = true }
entity_kind = { workspace = true, optional = true }
model_owner = { workspace = true }
models_permissions = { workspace = true }
share_permission_db_utils = { workspace = true, optional = true }
shared_entity_registry = { workspace = true }
clap = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true }
macro_user_id = { workspace = true }
utoipa = { workspace = true, optional = true }
rootcause = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, optional = true }
macro_tower_layers = { workspace = true, optional = true }
uuid = { workspace = true }
sqlx = { workspace = true, features = ["json"], optional = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bot_id = { workspace = true }
mention_utils = { workspace = true }
trigger_context = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
agent_session_id = { workspace = true }

[[bin]]
name = "seed_jsonl"
path = "src/bin/seed_jsonl.rs"
required-features = ["cli"]

[dev-dependencies]
messages = { workspace = true, features = ["outbound"] }
entity_access = { workspace = true, default-features = true }
entity_access_outbound = { workspace = true }
agent-client-protocol = { workspace = true }
bot_id = { workspace = true, features = ["test-utils"] }
harness_id = { workspace = true, features = ["test-utils"] }
model_user = { workspace = true }
non_empty = { workspace = true }
agent_fold = { workspace = true, default-features = true, features = ["test-utils"] }
axum = { workspace = true, features = ["ws"] }
macro_db_migrator = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "time", "test-util"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "backfill_turn_states"
path = "src/bin/backfill_turn_states.rs"
required-features = ["cli"]
