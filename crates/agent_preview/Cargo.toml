[package]
name = "agent_preview"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The agent-session id vocabulary only. `default-features = false` drops the
# fold's developer binaries, which want clap and tokio; the newtype does not.
agent_fold = { workspace = true }
ai_toolset = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws", "form"] }
base64 = { workspace = true }
bytes = { workspace = true }
entity_access = { workspace = true, features = ["ports", "inbound"] }
macro_authorization = { workspace = true, features = ["axum"] }
macro_user_id = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "process"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

uuid = { workspace = true, features = ["v7", "serde"] }
sqlx = { workspace = true }
chrono = { workspace = true }
macro_tower_layers = { workspace = true }

[dev-dependencies]
macro_db_migrator = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
