[package]
edition = "2024"
name = "artifacts"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
entity_access = { path = "../entity_access" }
entity_registry = { path = "../entity_registry/entity_registry", features = ["axum"] }
futures = { workspace = true }
hex = { workspace = true }
lazy-regex = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_env = { path = "../macro_env" }
macro_aws_config = { path = "../macro_aws_config", features = ["s3"] }
macro_service_urls = { path = "../macro_service_urls" }
macro_tower_layers = { path = "../macro_tower_layers" }
model = { path = "../model" }
model-error-response = { path = "../model-error-response" }
model_owner = { path = "../model_owner" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bot_id = { path = "../bot_id" }
http-body-util = { workspace = true }
macro_user_id = { path = "../macro_user_id" }
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
