[package]
edition = "2024"
name = "macro_config"
publish = false
version = "0.1.0"

[dependencies]
macro_config_derive = { workspace = true }
macro_env = { workspace = true }
remote_env_var = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_env_var = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[package.metadata.cargo-shear]
# `macro_env_var` macros expand to `#[tracing::instrument]`.
ignored = ["tracing"]
