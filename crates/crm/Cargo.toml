[package]
edition = "2024"
name = "crm"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:macro_user_id",
  "dep:models_properties",
  "dep:properties",
  "dep:schemars",
  "entity_access/ports",
  "ports",
]
axum = [
  "dep:axum",
  "dep:messages",
  "dep:macro_authorization",
  "dep:macro_uuid",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/axum",
  "entity_access/inbound",
  "entity_access/ports",
  "ports",
]
# Links archived call records to CRM records from the call topic.
call_link = [
  "dep:call",
  "dep:kafka_util",
  "dep:macro_event_broker",
  "dep:models_properties",
  "dep:rdkafka",
  "dep:rootcause",
  "dep:sqlx",
  "dep:tokio",
  "macro_event_broker/outbound",
  "ports",
]
default = ["ai_tools", "call_link", "inbound", "lookup", "outbound", "ports"]
inbound = ["axum", "ports"]
# Read-only company/contact identity for other domains. Pulls only sqlx + ports.
lookup = ["dep:messages", "dep:rootcause", "dep:sqlx", "ports"]
outbound = [
  "dep:macro_user_id",
  "dep:models_properties",
  "dep:properties",
  "dep:reqwest",
  "dep:sqlx",
  "dep:unfurl",
  "ports",
]
ports = []
# Read-only CRM search (name/domain). Pulls only sqlx + ports — no
# reqwest/unfurl/axum — so search consumers stay lightweight.
search = ["dep:sqlx", "ports"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
filter_ast = { path = "../filter_ast" }
item_filters = { path = "../item_filters", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

call = { path = "../call", default-features = false, features = ["ports"], optional = true }
entity_access = { path = "../entity_access", default-features = false }
kafka_util = { path = "../kafka_util", optional = true }
macro_event_broker = { path = "../macro_event_broker", default-features = false, optional = true }
messages = { path = "../messages", default-features = false, features = ["ports"], optional = true }
rdkafka = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# AI toolset dependencies
ai_toolset = { path = "../ai_toolset", optional = true }
async-trait = { workspace = true, optional = true }
macro_user_id = { path = "../macro_user_id", optional = true }
models_properties = { path = "../models_properties", optional = true }
properties = { path = "../properties", default-features = false, features = [
  "ports",
], optional = true }
schemars = { workspace = true, optional = true }
system_properties = { path = "../system_properties" }

# Axum / inbound dependencies
axum = { workspace = true, optional = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_uuid = { path = "../macro_uuid", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
utoipa = { workspace = true, optional = true }

# Outbound dependencies
reqwest = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
unfurl = { path = "../unfurl", features = ["ports"], optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
messages = { path = "../messages", default-features = false, features = ["outbound", "test-utils"] }
macro_user_id = { path = "../macro_user_id" }
properties = { path = "../properties", default-features = false, features = [
  "outbound",
  "ports",
] }
rootcause = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tower = { workspace = true }
