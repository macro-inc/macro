[package]
name = "graphql_external_agent"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-graphql = { workspace = true }
bot_id = { path = "../bot_id" }
bots = { path = "../bots", default-features = false, features = ["ports"] }
external_agents = { path = "../external_agents", default-features = false }
graphql_common = { path = "../graphql_common" }
macro_user_id = { path = "../macro_user_id" }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
messages = { path = "../messages", features = ["ports"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
