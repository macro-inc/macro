[package]
edition = "2024"
name = "macro_user_id"
publish = false
version = "0.1.0"

[features]
schema = ["dep:utoipa"]
sqlx = ["dep:sqlx"]

[dependencies]
cowlike = { path = "../cowlike" }
doppleganger = { workspace = true }
nom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[package.metadata.cargo-shear]
# Unused, but apps/web/tauri locks this crate by path, and changing its
# lockfiles trips the native store-release version gates. Remove with the
# next native release.
ignored = ["tracing"]
