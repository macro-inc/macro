[package]
edition = "2024"
name = "whatsapp_e2e"
publish = false
version = "0.1.0"
description = "End-to-end tests of WhatsApp linked devices: session-service replicas, the linked-devices domain and MacroDB against a fake WhatsApp server."

[dependencies]
entity_access_db_utils = { workspace = true }
async-trait = { workspace = true }
entity_access = { workspace = true, features = ["ports"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
whatsapp_fake_server = { workspace = true }
external_chat = { workspace = true, features = ["outbound"] }
whatsapp_linked = { workspace = true, features = ["outbound"] }
whatsapp_session_service = { workspace = true }
whatsapp_store_pg = { workspace = true, features = ["fake-kms"] }
whatsmeow = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zeroize = { workspace = true }

[dev-dependencies]
macro_user_id = { workspace = true }
chrono = { workspace = true }
whatsmeow_signal = { workspace = true }
macro_db_migrator = { workspace = true }
