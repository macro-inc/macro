[package]
edition = "2024"
name = "coding_agent_worker"
publish = false
version = "0.1.0"

[[bin]]
name = "macrod"
path = "src/main.rs"

[dependencies]
# Direct crate imports are the whole typegen story: the protocol envelope,
# the trigger event vocabulary, and the delivery signature all come from the
# owning crates, compiler-checked.
agent-client-protocol = { workspace = true }
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
agent_session = { path = "../agent_session" }
agent_trigger = { path = "../agent_trigger" }
axum = { workspace = true }
bot_id = { path = "../bot_id" }
# Only the domain models: the daemon reads `GET /bots/me` and the webhook
# API's bodies, and wants none of either crate's server-side machinery.
bots = { path = "../bots", default-features = false }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
harness_id = { path = "../harness_id" }
harnesses = { path = "../harnesses", default-features = false }
dashmap = { workspace = true }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
ratatui = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
# The gateway dial is `wss` on every deployment but a local stack, and
# tokio-tungstenite's rustls feature selects no crypto provider.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-retry = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
webhook = { path = "../webhook", default-features = false }
webhook_signature = { path = "../webhook_signature" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bot_id = { path = "../bot_id", features = ["test-utils"] }
channel_sender = { path = "../channel_sender" }
channels = { path = "../channels", default-features = false }
chrono = { workspace = true }
harness_id = { path = "../harness_id", features = ["test-utils"] }
tower = { workspace = true, features = ["util"] }
