[package]
edition = "2024"
name = "coding_agent_worker"
publish = false
version = "0.1.0"

[[bin]]
name = "macrod"
path = "src/main.rs"

[dependencies]
pairing_id = { path = "../pairing_id" }
agent_fold = { path = "../folds/agent_fold", default-features = false }
claude_fold = { path = "../folds/claude_fold" }
codex_fold = { path = "../folds/codex_fold" }
messages = { path = "../messages", features = ["broker"] }
# Direct crate imports are the whole typegen story: the protocol envelope,
# the trigger event vocabulary, and the delivery signature all come from the
# owning crates, compiler-checked.
agent-client-protocol = { workspace = true }
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
agent_session = { path = "../agent_session" }
agent_trigger = { path = "../agent_trigger" }
arboard = { workspace = true }
base64 = { workspace = true }
bot_id = { path = "../bot_id" }
trigger_context = { path = "../trigger_context" }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
genai_telemetry = { path = "../genai_telemetry" }
harness_id = { path = "../harness_id" }
harnesses = { path = "../harnesses", default-features = false }
hex = { workspace = true }
hosted_runtimes = { path = "../hosted_runtimes", default-features = false }
lazy-regex = { workspace = true }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_env_var = { path = "../macro_env_var" }
macro_service_urls = { path = "../macro_service_urls" }
macro_tower_layers = { path = "../macro_tower_layers" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rootcause = { workspace = true }
# The gateway dial is `wss` on every deployment but a local stack, and
# tokio-tungstenite's rustls feature selects no crypto provider.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-retry = { workspace = true }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tui-input = { workspace = true }
uuid = { workspace = true }
webbrowser = { workspace = true }
webhook = { path = "../webhook", default-features = false }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "pty", "termios"] }

# Release archives: tar.gz everywhere but Windows, which gets a zip.
[target.'cfg(not(windows))'.dependencies]
flate2 = { workspace = true }
tar = { workspace = true }

# Stripe (agent_session -> ai_billing) reaches native-tls, which is OpenSSL on
# Linux, and a musl build has no system OpenSSL to link: compile it in.
[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
] }
zip = { workspace = true }

[dev-dependencies]
bot_id = { path = "../bot_id", features = ["test-utils"] }
channel_sender = { path = "../channel_sender" }
channels = { path = "../channels", default-features = false }
chrono = { workspace = true }
harness_id = { path = "../harness_id", features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "test-util"] }
wiremock = { workspace = true }

[package.metadata.cargo-shear]
# Linked for its `vendored` feature on musl, never named in code.
ignored = ["openssl-sys"]
