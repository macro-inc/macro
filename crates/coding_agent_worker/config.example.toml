# This machine's macrod config. The TUI and `macrod service` both read
# ~/.macrod/macrod.toml unless given `--config <path>`.
#
# This example omits credentials, so `macrod` starts in Quickstart. Pairing
# shows a code for approval in the web app, then adds a `[credentials]` table
# containing a bearer token to this file. Keep the resulting config private.
#
# The runtime's name, ownership (private or team), and permission bypass are
# not set here: change them on the web at Settings → Agents → Runtimes.

# Optional development overrides. Every key defaults to production.
# [macro]
# # Base URL of the agent-harness service. Its ws(s) twin hosts the runtime
# # gateway the daemon connects to on startup.
# api_url = "http://localhost:50009/agent-harness"
# # Base URL of the storage service (harness pairing + live event stream).
# storage_url = "http://localhost:50009/dss"
# # Base URL of the Macro web app, used for the pairing and settings links.
# web_url = "http://localhost:3000/app"

[harness]
command = "hermes"
args = ["acp"]
# Optional: environment added to the harness and to every model probe. The
# Codex and Claude Code presets set it to point their npm adapter at the CLI
# installed on this machine instead of the copy the adapter bundles, e.g.
# env = { CODEX_PATH = "/usr/local/bin/codex" }

[workspace]
# Every session this daemon serves runs here.
path = "/workspace"
# Informational: having the repo cloned at `path` is the operator's job.
repo_url = "https://github.com/macro-inc/macro"

# Optional defaults for the one native Herdr configuration (also editable in the TUI).
# [herdr]
# model = "sonnet"            # Launch fallback; Macro picks each agent's model.
# arguments = []              # Native CLI arguments, one word per element.
# storage_path = "/path/to/agents" # Omit for ~/.macrod/herdr/<harness-id>.
# focus = true               # false opens new sessions in the background.

# Optional: a released macrod checks for a newer release every hour and
# installs it. Set auto = false (or MACROD_NO_UPDATE=1) to turn that off.
# [update]
# auto = true
