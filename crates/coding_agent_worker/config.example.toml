# Everything a coding agent worker needs to serve one session.
# Written by the provisioner (or by hand for an externally-run worker).

[session]
id = "01a00125-3b8c-76d1-97bb-4aadf145d6ec"
# The gatewayUrl returned by POST /agent-sessions, verbatim.
gateway_url = "ws://localhost:8101/runtime/01a00125-3b8c-76d1-97bb-4aadf145d6ec/ws"
# The bot API token.
bot_token = "mbot_0123456789ab_0123456789abcdef"

[harness]
command = "opencode"
args = ["acp"]
cwd = "/workspace"

[workspace]
repo_url = "https://github.com/macro-inc/macro"
