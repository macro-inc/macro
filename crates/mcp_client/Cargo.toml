[package]
name = "mcp_client"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["providers"]
providers = ["macro_env_var"]

[dependencies]
aes-gcm = "0.10"
ai_toolset = { workspace = true }
anyhow.workspace = true
authentication_service_client = { workspace = true }
async-trait.workspace = true
oauth2 = { version = "5.0", default-features = false }
base64.workspace = true
axum.workspace = true
futures.workspace = true
macro_authorization = { workspace = true, features = [
  "axum",
] }
macro_env_var = { workspace = true, optional = true }
macro_user_id = { workspace = true }
model-error-response = { workspace = true }
redis = { workspace = true, features = ["aio", "tokio-comp"] }
reqwest.workspace = true
rmcp = { workspace = true, features = ["auth", "client", "transport-streamable-http-client-reqwest"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
regex.workspace = true
tokio.workspace = true
