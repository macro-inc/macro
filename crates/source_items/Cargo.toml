[package]
edition = "2024"
name = "source_items"
publish = false
version = "0.1.0"

[features]
cli = ["dep:clap", "dep:macro_env_var", "dep:macro_entrypoint"]

[dependencies]
clap = { workspace = true, features = ["derive"], optional = true }
macro_env_var = { workspace = true, optional = true }
model-entity = { workspace = true }
rootcause = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
macro_entrypoint = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { workspace = true }
rand = { workspace = true }

[[bin]]
name = "source_items"
path = "src/bin/source_items.rs"
required-features = ["cli"]
