[package]
edition = "2024"
exclude = ["examples/"]
name = "opensearch_client"
publish = false
version = "0.1.0"

# Needs an OpenSearch with the search indices, so `cargo test` builds and runs
# it only with `--test content_search`; CI runs it in the test job's
# OpenSearch step.
[[test]]
name = "content_search"
path = "tests/content_search/main.rs"
test = false

[dev-dependencies]
bytes = { workspace = true }
hyper = { workspace = true, features = ["http2", "server"] }
hyper-util = { workspace = true, features = ["http2", "server"] }
rustls = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-rustls = { workspace = true }
uuid = { workspace = true }


[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
h2 = { workspace = true }
hyper = { workspace = true }
filter_ast = { path = "../filter_ast" }
item_filters = { path = "../item_filters" }
models_opensearch = { path = "../models_opensearch" }
models_search_cursor = { path = "../models_search_cursor" }
opensearch = { version = "2.3.0", default-features = false, features = ["rustls-tls"] }
opensearch_query_builder = { path = "../opensearch_query_builder", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-retry = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
