[package]
edition = "2024"
name = "graphql_work_feed"
publish = false
version = "0.1.0"

[dependencies]
async-graphql = { workspace = true }
async-stream = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, features = ["inbound"] }
futures = { workspace = true }
graphql_common = { path = "../graphql_common" }
graphql_notification = { path = "../graphql_notification" }
graphql_soup = { path = "../graphql_soup" }
macro_user_id = { path = "../macro_user_id" }
model_notifications = { path = "../model_notifications" }
rootcause = { workspace = true }
soup = { path = "../soup", default-features = false, features = ["ports"] }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = { workspace = true }
work_feed = { path = "../work_feed" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
chrono = { workspace = true }
model-entity = { path = "../model-entity" }
notification = { path = "../notification" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
