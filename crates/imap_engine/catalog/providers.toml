# Mail endpoint defaults and EmailEngine autodetect-imap-settings.js MX mappings.
# Ports are validated when the built-in catalog is first loaded.

[[provider]]
name = "Google"
domains = ["gmail.com", "googlemail.com"]
mx = "(?:^|\\.)(?:l\\.google\\.com|smtp\\.google\\.com)$"
imap = "imap.gmail.com"
smtp = "smtp.gmail.com"
smtp_port = 465
steer = "gmail"
help_url = "https://support.google.com/accounts/answer/185833"

[[provider]]
name = "Microsoft"
domains = ["outlook.com", "hotmail.com", "live.com", "msn.com"]
mx = "(?:^|\\.)(?:protection\\.outlook\\.com|olc\\.protection\\.outlook\\.com)$"
steer = "outlook"

