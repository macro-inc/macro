[package]
edition = "2024"
name = "dashboards"
publish = false
version = "0.1.0"

[features]
default = []
inbound = ["dep:axum", "dep:macro_authorization", "dep:model-error-response"]
outbound = [
  "dep:entity_access",
  "dep:entity_access_db_utils",
  "dep:feature_flags",
  "dep:model_owner",
  "dep:sqlx",
]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
dynamic_ui = { path = "../dynamic_ui" }
entity_access = { path = "../entity_access", optional = true, default-features = false, features = ["ports"] }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
feature_flags = { path = "../feature_flags", optional = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
model-error-response = { path = "../model-error-response", optional = true }
model_owner = { path = "../model_owner", optional = true }
models_permissions = { path = "../models_permissions" }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
