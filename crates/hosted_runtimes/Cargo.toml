[package]
edition = "2024"
name = "hosted_runtimes"
publish = false
version = "0.1.0"

[features]
default = ["inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:entity_access",
  "entity_access/axum",
  "entity_access/inbound",
  "entity_access/ports",
  "dep:macro_authorization",
  "macro_authorization/axum",
  "dep:model-error-response",
  "dep:utoipa",
  "stripe_price_id/schema",
  "ports",
]
outbound = ["dep:incus_client", "dep:macro_env", "dep:sqlx", "ports", "tokio/fs", "tokio/process", "tokio/time"]
ports = ["dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
computer_id = { path = "../computer_id" }
entity_access = { path = "../entity_access", optional = true, default-features = false }
feature_flags = { path = "../feature_flags" }
harness_id = { path = "../harness_id" }
incus_client = { path = "../incus_client", optional = true }
lazy-regex = { workspace = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false }
macro_env = { path = "../macro_env", optional = true }
macro_user_id = { path = "../macro_user_id" }
model-error-response = { path = "../model-error-response", optional = true }
pairing_id = { path = "../pairing_id" }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
stripe_price_id = { path = "../stripe_price_id", default-features = false, features = ["serde"] }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v7"] }
zeroize = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
clap = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "incus_fleet_smoke"
required-features = ["outbound"]
