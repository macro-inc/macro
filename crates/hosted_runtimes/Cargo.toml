[package]
edition = "2024"
name = "hosted_runtimes"
publish = false
version = "0.1.0"

[features]
default = ["inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:entity_access",
  "entity_access/axum",
  "entity_access/inbound",
  "entity_access/ports",
  "dep:macro_authorization",
  "macro_authorization/axum",
  "dep:model-error-response",
  "schema",
  "bot_id/schema",
  "computer_id/schema",
  "computer_types/schema",
  "pairing_id/schema",
  "ports",
]
outbound = [
  "dep:firecracker_host_api",
  "dep:harnesses",
  "dep:macro_env",
  "dep:sqlx",
  "ports",
  "tokio/fs",
  "tokio/net",
  "tokio/process",
  "tokio/time",
]
ports = []
# OpenAPI schemas for the shared types other crates' routes return.
schema = ["dep:utoipa"]

[dependencies]
async-stripe = { workspace = true, default-features = false }
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id" }
chrono = { workspace = true, features = ["serde"] }
computer_id = { workspace = true }
computer_types = { path = "../computer_types" }
entity_access = { path = "../entity_access", optional = true, default-features = false }
feature_flags = { path = "../feature_flags" }
firecracker_host_api = { path = "../firecracker_host_api", optional = true, features = ["client"] }
futures = { workspace = true }
harness_id = { path = "../harness_id" }
harnesses = { path = "../harnesses", optional = true, default-features = false, features = ["outbound"] }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false }
macro_env = { path = "../macro_env", optional = true }
macro_user_id = { path = "../macro_user_id" }
model-error-response = { path = "../model-error-response", optional = true }
rootcause = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
pairing_id = { workspace = true }
tracing-opentelemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
nom = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "sync"] }
tokio-retry = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v7"] }
zeroize = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
firecracker_host_api = { path = "../firecracker_host_api", features = ["client", "test-support"] }
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing", "trace"] }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
model_user = { path = "../model_user" }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
wiremock = { workspace = true }

[[example]]
name = "firecracker_fleet_smoke"
required-features = ["outbound"]
