[package]
edition = "2024"
name = "favorites"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/inbound",
  "ports",
]
mock = ["dep:mockall"]
outbound = ["ports"]
ports = ["dep:entity_access", "dep:tokio", "dep:tracing"]
postgres = ["dep:sqlx", "outbound"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
# `query` brings `axum_extra::extract::Query`, whose deserializer collects
# repeated query keys into a vector; `axum::extract::Query` keeps only one.
axum-extra = { workspace = true, optional = true, features = ["query"] }
chrono = { workspace = true, features = ["serde"] }
cowlike = { path = "../cowlike" }
entity_access = { path = "../entity_access", optional = true, default-features = false, features = ["ports"] }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
mockall = { workspace = true, optional = true }
model-entity = { path = "../model-entity" }
model-error-response = { path = "../model-error-response", optional = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
model_user = { path = "../model_user" }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
