[package]
edition = "2024"
name = "ai_chat"
publish = false
version = "0.1.0"

[features]
default = ["ai_tools", "inbound", "outbound", "ports"]
ai_tools = ["dep:async-trait", "dep:schemars", "inbound", "ports"]
attachment = [
  "dep:futures",
  "inbound",
]
inbound = [
  "dep:axum",
  "dep:entity_registry",
  "dep:macro_authorization",
  "dep:roles_and_permissions",
  "entity_access/inbound",
  "entity_registry/axum",
  "ports",
]
outbound = [
  "dep:entity_access_db_utils",
  "dep:entity_registry",
  "dep:entity_registry_db_utils",
  "dep:macro_uuid",
  "dep:share_permission_db_utils",
  "dep:sqlx",
  "ports",
]
ports = []

[dependencies]
activity = { workspace = true }
ai_toolset = { workspace = true }
anyhow = { workspace = true }
bot_id = { workspace = true }
attachment = { workspace = true }
chrono = { workspace = true }
entity_access = { workspace = true }
entity_access_db_utils = { workspace = true, optional = true }
entity_registry = { workspace = true, optional = true }
entity_registry_db_utils = { workspace = true, optional = true }
entity_access_management = { workspace = true, features = [
  "ports",
] }
entity_mutation = { workspace = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
shared_types = { workspace = true }
non_empty = { workspace = true }
entity_kind = { workspace = true }
model_owner = { workspace = true }
permissions_types = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shared_entity_registry = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }

# Attachment (attachment provider)
futures = { workspace = true, optional = true }

# AI tools (toolset adapter)
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Inbound (HTTP handlers)
axum = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = [
  "axum",
] }
roles_and_permissions = { workspace = true, optional = true, features = [
  "ports",
] }
utoipa = { workspace = true }

# Outbound (database adapters)
share_permission_db_utils = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

macro_uuid = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
# Domain (always included)
chat_message = { workspace = true, features = ["schema"] }
chat_id = { workspace = true }

[dev-dependencies]
bot_id = { workspace = true, features = ["test-utils"] }
http-body-util = { workspace = true }
macro_db_migrator = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
