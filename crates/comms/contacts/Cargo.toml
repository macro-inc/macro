[package]
edition = "2024"
name = "contacts"
publish = false
version = "0.1.0"

[features]
axum = ["dep:contacts_inbound", "contacts_inbound/axum"]
directory-names = ["dep:contacts_outbound", "contacts_outbound/directory-names", "ports"]
default = ["axum", "inbound", "outbound", "ports"]
inbound = ["axum", "contacts_inbound/worker", "ports"]
outbound = ["dep:contacts_outbound", "ports"]
ports = []

[dependencies]
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
contacts_core = { workspace = true }
contacts_inbound = { workspace = true, optional = true }
contacts_outbound = { workspace = true, optional = true }

