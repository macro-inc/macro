[package]
edition = "2024"
name = "channels_outbound"
publish = false
version = "0.1.0"

[features]
# The channel-message attachment repository.
attachment = ["channels/attachment"]

[dependencies]
thread_id = { workspace = true }
async-trait = { workspace = true }
channels = { workspace = true, features = ["list", "ports", "sqlx"] }
connection_gateway_client = { workspace = true }
contacts_core = { workspace = true }
entity_access = { workspace = true, features = ["ports"] }
entity_access_db_utils = { workspace = true }
filter_ast = { workspace = true }
indexmap = { workspace = true }
item_filters = { workspace = true, features = ["native"] }
macro_uuid = { workspace = true }
entity_kind = { workspace = true }
model_notifications = { workspace = true }
permissions_types = { workspace = true }
notification_hex = { workspace = true }
recursion = { workspace = true }
share_permission_db_utils = { workspace = true }
sqlx = { workspace = true }
static_file_service_client = { workspace = true }
anyhow = { workspace = true }
bot_id = { workspace = true }
channel_sender = { workspace = true }
chrono = { workspace = true }
macro_user_id = { workspace = true, features = ["sqlx"] }
model_file_type = { workspace = true }
model_owner = { workspace = true }
pagination_types = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
bot_id = { workspace = true, features = ["test-utils"] }
macro_db_migrator = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
