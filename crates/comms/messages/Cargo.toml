[package]
edition = "2024"
name = "messages"
publish = false
version = "0.1.0"

[features]
ai_tools = ["dep:ai_toolset", "dep:schemars", "ports"]
annotations = ["dep:model", "ports"]
broker = ["dep:macro_event_broker", "dep:macro_event_topics", "ports"]
default = []
delivery = [
  "dep:properties",
  "dep:models_properties",
  "dep:connection_gateway_client",
  "dep:model_entity",
  "dep:model_notifications",
  "dep:model_owner",
  "dep:notification",
  "dep:system_properties",
  "outbound",
]
inbound = [
  "dep:axum",
  "dep:ip_extractor",
  "dep:rate_limit",
  "dep:macro_authorization",
  "entity_access/inbound",
  "ports",
  "schema",
]
json-schema = ["dep:schemars", "message_parent/json-schema"]
outbound = ["dep:macro_uuid", "dep:sqlx", "ports"]
ports = ["dep:async-trait", "dep:entity_access", "dep:futures", "dep:rootcause", "entity_access/ports"]
schema = ["channel_sender/schema", "dep:utoipa", "activity/schema", "message_parent/schema"]
test-utils = ["dep:mockall", "ports"]

[dependencies]
message_id = { workspace = true }
activity = { workspace = true }
ai_toolset = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
ip_extractor = { workspace = true, optional = true }
rate_limit = { workspace = true, features = ["axum"], optional = true }
futures = { workspace = true, optional = true }
bot_id = { workspace = true }
channel_sender = { workspace = true }
chrono = { workspace = true }
connection_gateway_client = { workspace = true, optional = true }
entity_access = { workspace = true, optional = true }
macro_authorization = { workspace = true, features = [
  "axum",
], optional = true }
macro_event_broker = { workspace = true, optional = true }
macro_event_topics = { workspace = true, optional = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }
model = { workspace = true, optional = true }
model_entity = { workspace = true, optional = true }
model_notifications = { workspace = true, optional = true }
model_owner = { workspace = true, optional = true }
models_pagination = { workspace = true }
models_properties = { workspace = true, optional = true }
properties = { workspace = true, features = ["ports"], optional = true }
notification = { workspace = true, default-features = true, optional = true }
rootcause = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
system_properties = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
message_parent = { workspace = true }

[dev-dependencies]
initiative = { workspace = true, features = ["postgres"] }
macro_db_migrator = { workspace = true }
models_permissions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
entity_access = { workspace = true }
entity_access_outbound = { workspace = true }
macro_db_client = { workspace = true, default-features = true }
