[package]
edition = "2024"
name = "channels_inbound"
publish = false
version = "0.1.0"

[features]
# The AI toolset for reading channel messages and threads.
ai_tools = [
  "channels/ai_tools",
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
]
# The adapter that renders channel references as AI attachments.
attachment = [
  "channels/attachment",
  "dep:attachment",
  "dep:futures",
  "dep:entity_kind",
  "dep:non_empty",
]
# The channel-message HTTP routes.
axum = [
  "channels/schema",
  "dep:axum",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:utoipa",
  "entity_access/inbound",
  "models_pagination/axum",
]
# The Kafka consumer that ensures teammate DMs after `team.member_joined`.
kafka_consumer = [
  "dep:kafka_util",
  "dep:rdkafka",
  "dep:tokio-retry",
  "macro_event_broker/outbound",
]
# The legacy channel list routes (with `axum`).
list = ["channels/list", "dep:frecency_core"]

[dependencies]
ai_toolset = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
attachment = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
channel_id = { workspace = true }
channels = { workspace = true, features = ["ports"] }
entity_access = { workspace = true, features = ["ports"] }
frecency_core = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
kafka_util = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = ["axum"] }
entity_kind = { workspace = true, optional = true }
model_error_response = { workspace = true, optional = true }
non_empty = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio-retry = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
agent_correlation = { workspace = true }
anyhow = { workspace = true }
bot_id = { workspace = true }
chrono = { workspace = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
messages = { workspace = true, features = ["broker"] }
models_pagination = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
bot_id = { workspace = true, features = ["test-utils"] }
messages = { workspace = true, features = ["test-utils"] }
http-body-util = { workspace = true }
kafka_util = { workspace = true }
macro_event_broker = { workspace = true, default-features = true }
rdkafka = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tower = { workspace = true }
