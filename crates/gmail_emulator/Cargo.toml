[package]
edition = "2024"
name = "gmail_emulator"
publish = false
version = "0.1.0"
description = "Test support: a stateful fake of the Google APIs Macro's email, calendar and sign-in code call (Gmail REST, Calendar REST with push channels, People, OAuth, signed Pub/Sub push), in process or as a standalone binary."

[dependencies]
askama = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
mail-builder = { workspace = true }
mailparse = { workspace = true }
nom = { workspace = true }
reqwest = { workspace = true }
rrule = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
calendar_events = { workspace = true, features = ["google"] }
email_api_client = { workspace = true, features = ["outbound-gmail"] }
fusionauth = { workspace = true }
gmail_client = { workspace = true }
models_email = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
