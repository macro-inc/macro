# Two Macro users' Gmail mailboxes and Google calendars, and one outside
# correspondent's. The calendars hold repeating events, so they have something
# on them whenever the emulator runs.
mailboxes:
  - email: ada@example.com
    name: Ada Example
    labels:
      - name: Receipts
    contacts:
      - { email: grace@example.com, name: Grace Hopper }
    other_contacts:
      - { email: alan@example.com, name: Alan Turing }
    messages:
      - from: Grace Hopper <grace@example.com>
        subject: Quarterly numbers
        text: The Q3 numbers are ready for review.
        message_id: q3-1@example.com
        labels: [INBOX, CATEGORY_PERSONAL]
        date: "2026-11-03T09:00:00Z"
      - from: Ada Example <ada@example.com>
        to: Grace Hopper <grace@example.com>
        subject: "Re: Quarterly numbers"
        text: Thanks, reading them now.
        message_id: q3-2@example.com
        in_reply_to: q3-1@example.com
        labels: [SENT]
        date: "2026-11-03T09:30:00Z"
      - from: Grace Hopper <grace@example.com>
        subject: "Re: Quarterly numbers"
        html: "<p>One correction on <b>page 4</b>.</p>"
        text: One correction on page 4.
        in_reply_to: q3-2@example.com
        labels: [INBOX, UNREAD, CATEGORY_PERSONAL, STARRED]
        date: "2026-11-03T10:00:00Z"
      - from: Billing <billing@example.com>
        subject: Receipt 1042
        text: Your receipt is attached to your account.
        labels: [INBOX, UNREAD, Label_1, CATEGORY_UPDATES]
        date: "2026-11-05T12:00:00Z"
      - from: Alan Turing <alan@example.com>
        subject: Lunch on Friday?
        text: Are you free at noon on Friday?
        labels: [INBOX, UNREAD, CATEGORY_PERSONAL]
        date: "2026-11-08T08:15:00Z"
      - from: Newsletter <news@example.com>
        subject: This week in computing
        html: "<h1>Weekly</h1><p>Five stories you missed.</p>"
        labels: [INBOX, CATEGORY_PROMOTIONS]
        date: "2026-11-09T07:00:00Z"
    calendars:
      # No id: Ada's primary calendar.
      - summary: Ada Example
        time_zone: America/New_York
        events:
          - id: standup
            summary: Standup
            location: Room 2
            start: { dateTime: "2026-11-02T09:30:00-05:00", timeZone: America/New_York }
            end: { dateTime: "2026-11-02T09:45:00-05:00", timeZone: America/New_York }
            recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO,WE,FR"]
            attendees:
              - { email: ada@example.com, responseStatus: accepted }
              - { email: bob@example.com }
              - { email: carol@example.com, responseStatus: accepted }
          - id: numbers
            summary: Quarterly numbers with Grace
            description: Page 4 needs a correction.
            start: { dateTime: "2026-11-05T14:00:00-05:00", timeZone: America/New_York }
            end: { dateTime: "2026-11-05T15:00:00-05:00", timeZone: America/New_York }
            recurrence: ["RRULE:FREQ=MONTHLY;BYDAY=1TH"]
            attendees:
              - { email: ada@example.com, responseStatus: accepted }
              - { email: grace@example.com, displayName: Grace Hopper, responseStatus: tentative }
          - id: founding
            summary: Company anniversary
            start: { date: "2026-03-12" }
            end: { date: "2026-03-13" }
            recurrence: ["RRULE:FREQ=YEARLY"]
            transparency: transparent
      - id: team@group.calendar.example.com
        summary: Team
        background_color: "#7986cb"
        events:
          - id: release
            summary: Release train
            start: { dateTime: "2026-11-05T16:00:00Z" }
            end: { dateTime: "2026-11-05T16:30:00Z" }
            recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=TH"]
      # A calendar Ada can only read, and that Google will not push for.
      - id: holidays@group.calendar.example.com
        summary: Holidays
        access_role: reader
        push_supported: false
        events:
          - id: neu1jan
            summary: New Year's Day
            start: { date: "2026-01-01" }
            end: { date: "2026-01-02" }
            recurrence: ["RRULE:FREQ=YEARLY"]
  - email: bob@example.com
    name: Bob Example
    messages:
      - from: Carol <carol@example.com>
        subject: Welcome aboard
        text: Glad to have you on the team.
        labels: [INBOX, UNREAD, CATEGORY_PERSONAL]
        date: "2026-11-02T15:00:00Z"
      - from: Carol <carol@example.com>
        subject: Your laptop
        text: It ships on Monday.
        labels: [INBOX, CATEGORY_PERSONAL]
        date: "2026-11-04T11:00:00Z"
    calendars:
      - summary: Bob Example
        time_zone: Europe/London
        events:
          - id: focus
            summary: Focus time
            start: { dateTime: "2026-11-03T13:00:00Z", timeZone: Europe/London }
            end: { dateTime: "2026-11-03T15:00:00Z", timeZone: Europe/London }
            recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=TU,TH"]
            eventType: focusTime
  - email: carol@example.com
    name: Carol Example
