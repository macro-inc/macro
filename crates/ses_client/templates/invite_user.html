<!doctype html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Invitation to Macro</title>
    <!--[if mso]>
      <noscript
        ><xml
          ><o:OfficeDocumentSettings
            ><o:PixelsPerInch>96</o:PixelsPerInch
            ><o:AllowPNG /></o:OfficeDocumentSettings></xml
      ></noscript>
    <![endif]-->
    <style>
      @media screen and (max-width: 600px) {
        .email-page {
          padding: 24px 12px !important;
        }
        .email-content {
          padding: 28px 24px !important;
        }
        .email-heading {
          font-size: 26px !important;
          line-height: 34px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f5f5f4;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        mso-hide: all;
      "
    >
      You've been invited to join an organization on Macro.
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#f5f5f4"
      style="
        font-family: Arial, Helvetica, sans-serif;
        color: #222222;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      "
    >
      <tr>
        <td class="email-page" align="center" style="padding: 48px 20px">
          <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; table-layout: fixed"
          >
            <tr>
              <td
                class="email-content"
                bgcolor="#ffffff"
                style="
                  padding: 36px 40px 40px;
                  border: 1px solid #e7e7e5;
                  border-radius: 12px;
                  overflow-wrap: break-word;
                  word-wrap: break-word;
                "
              >
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin-bottom: 36px"
                >
                  <tr>
                    <td width="36" style="vertical-align: middle">
                      <a href="https://macro.com" style="text-decoration: none"
                        ><img
                          src="https://static-file-service.macro.com/file/b911aba9-94a6-435c-aa16-8404739f13b0"
                          width="36"
                          height="36"
                          alt="Macro"
                          style="
                            display: block;
                            border: 0;
                            background-color: #ffffff;
                            -ms-interpolation-mode: bicubic;
                          "
                      /></a>
                    </td>
                  </tr>
                </table>
                <h1
                  class="email-heading"
                  style="
                    margin: 0 0 16px;
                    font-size: 28px;
                    line-height: 36px;
                    font-weight: 600;
                    letter-spacing: -0.5px;
                    color: #222222;
                  "
                >
                  You're invited
                </h1>
                <p
                  style="
                    margin: 0 0 20px;
                    font-size: 16px;
                    line-height: 26px;
                    color: #525252;
                  "
                >
                  You've been invited to join <strong>{ORG_NAME}</strong> on
                  Macro.
                </p>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 28px 0 8px; max-width: 100%"
                >
                  <tr>
                    <td
                      bgcolor="#222222"
                      style="
                        border-radius: 6px;
                        text-align: center;
                        mso-padding-alt: 14px 24px;
                      "
                    >
                      <a
                        href="https://{PREFIX}macro.com/app/?login=true"
                        style="
                          display: inline-block;
                          padding: 14px 24px;
                          border: 1px solid #222222;
                          border-radius: 6px;
                          color: #ffffff;
                          background-color: #222222;
                          font-size: 15px;
                          line-height: 20px;
                          font-weight: 600;
                          text-decoration: none;
                          mso-padding-alt: 0;
                        "
                        >Accept invitation</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 16px 0;
                  text-align: center;
                  font-size: 12px;
                  line-height: 20px;
                  color: #737373;
                "
              >
                Need a hand?
                <a
                  href="mailto:support@macro.com"
                  style="color: #525252; text-decoration: underline"
                  >Contact support</a
                >
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
