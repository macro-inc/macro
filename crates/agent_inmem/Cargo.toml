[package]
edition = "2024"
name = "agent_inmem"
publish = false
version = "0.1.0"

[dependencies]
agent_code_mode = { workspace = true }
ai_billing = { workspace = true }
agent = { workspace = true }
agent_api_keys = { workspace = true }
# The egress proxy's domain service, driven in-process: the same verification,
# resolution and stamping a sandbox reaches over the wire, minus the wire.
agent_egress = { workspace = true }
agent-client-protocol = { workspace = true }
agent_runtime_protocol = { workspace = true, default-features = true }
agent_session = { workspace = true, default-features = true }
anyhow = { workspace = true }
ai_tools = { workspace = true }
attachment = { workspace = true }
ai_toolset = { workspace = true }
ai_usage = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bot_id = { workspace = true }
chat = { workspace = true }
cognition = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
feature_flags = { workspace = true }
genai_telemetry = { workspace = true }
macro_user_id = { workspace = true }
model_owner = { workspace = true }
roles_and_permissions = { workspace = true, features = ["ports"] }
http = { workspace = true }
http-body-util = { workspace = true }
macro_uuid = { workspace = true }
mcp_select = { workspace = true }
mcp_toolset = { workspace = true }
memory = { workspace = true }
model_entity = { workspace = true }
non_empty = { workspace = true }
nom = { workspace = true }
prompt = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skills = { workspace = true, default-features = true }
sqlx = { workspace = true }
sse-stream = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
jev = { workspace = true, features = ["outbound"] }
rootcause = { workspace = true }
agent_fold = { workspace = true, default-features = true }
agent_session = { workspace = true, default-features = true, features = ["test-utils"] }
bot_id = { workspace = true, features = ["test-utils"] }
futures = { workspace = true }
rig-agent = "0.41.0"
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
trigger_context = { workspace = true }
