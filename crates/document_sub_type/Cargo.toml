[package]
edition = "2024"
name = "document_sub_type"
publish = false
version = "0.1.0"

[features]
default = ["schema", "sqlx"]
schema = ["dep:schemars", "dep:utoipa"]
sqlx = ["dep:sqlx"]

[dependencies]
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-shear]
# Unused, but apps/web/tauri locks this crate by path, and changing its
# lockfiles trips the native store-release version gates. Remove with the
# next native release.
ignored = ["thiserror"]
