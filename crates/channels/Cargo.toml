[package]
edition = "2024"
name = "channels"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:entity_access",
  "dep:schemars",
  "entity_access/ports",
  "ports",
]
attachment = [
  "dep:attachment",
  "dep:entity_access",
  "dep:futures",
  "dep:model_entity",
  "dep:non_empty",
  "entity_access/ports",
  "ports",
]
inbound = [
  "dep:axum",
  "dep:entity_access",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:utoipa",
  "entity_access/inbound",
  "models_pagination/axum",
  "ports",
  "schema",
]
kafka_consumer = [
  "dep:kafka_util",
  "dep:rdkafka",
  "dep:tokio-retry",
  "macro_event_broker/outbound",
  "ports",
]
list = [
  "dep:filter_ast",
  "dep:models_soup",
  "dep:model_entity",
  "dep:recursion",
  "dep:rootcause",
  "dep:serde_json",
  "ports",
  "dep:frecency_core",
  "frecency_core/ports",
]
outbound = [
  "item_filters/native",
  "dep:connection_gateway_client",
  "dep:contacts_core",
  "dep:entity_access",
  "dep:entity_access_db_utils",
  "dep:indexmap",
  "dep:macro_uuid",
  "dep:model_entity",
  "dep:model_notifications",
  "dep:models_permissions",
  "dep:notification_hex",
  "dep:serde_json",
  "dep:share_permission_db_utils",
  "dep:sqlx",
  "dep:static_file_service_client",
  "entity_access/ports",
  "list",
  "macro_user_id/sqlx",
  "ports",
]
entity_mutation = [
  "dep:entity_access",
  "dep:entity_mutation",
  "dep:model_entity",
  "dep:rootcause",
  "entity_access/ports",
  "ports",
]
ports = [
  "dep:async-trait",
  "dep:entity_access",
  "dep:rootcause",
  "dep:tokio",
  "entity_access/ports",
  "messages/ports",
]
schema = [
  "channel_sender/schema",
  "dep:utoipa",
  "item_filters/schema",
  "macro_user_id/schema",
  "messages/schema",
]

[dependencies]
agent_correlation = { workspace = true }
activity = { workspace = true }
anyhow = { workspace = true }
attachment = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bot_id = { workspace = true }
channel_sender = { workspace = true }
entity_mutation = { workspace = true, optional = true }
chrono = { workspace = true }
connection_gateway_client = { workspace = true, optional = true }
entity_access = { workspace = true, optional = true }
entity_access_db_utils = { workspace = true, optional = true }
filter_ast = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
item_filters = { workspace = true }
kafka_util = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = [
  "axum",
] }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true, optional = true }
messages = { workspace = true, features = ["broker"] }
model_entity = { workspace = true, optional = true }
model_error_response = { workspace = true, optional = true }
model_file_type = { workspace = true }
model_notifications = { workspace = true, optional = true }
model_owner = { workspace = true }
models_pagination = { workspace = true }
models_permissions = { workspace = true, optional = true }
non_empty = { workspace = true, optional = true }
notification_hex = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
recursion = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
share_permission_db_utils = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
static_file_service_client = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"], optional = true }
tokio-retry = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

# AI Tool dependencies
ai_toolset = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
models_soup = { workspace = true, optional = true }
frecency_core = { workspace = true, optional = true }
contacts_core = { workspace = true, optional = true }

[dev-dependencies]
bot_id = { workspace = true, features = ["test-utils"] }
messages = { workspace = true, features = ["test-utils"] }
http-body-util = { workspace = true }
kafka_util = { workspace = true }
macro_db_migrator = { workspace = true }
macro_env_var = { workspace = true }
# Examples need the Kafka adapter (outbound); the library itself only uses ports.
macro_event_broker = { workspace = true, default-features = true }
mockall = { workspace = true }
rdkafka = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
