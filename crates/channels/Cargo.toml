[package]
edition = "2024"
name = "channels"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:entity_access",
  "dep:schemars",
  "entity_access/ports",
  "ports",
]
attachment = [
  "dep:attachment",
  "dep:entity_access",
  "dep:futures",
  "dep:model-entity",
  "dep:non_empty",
  "entity_access/ports",
  "ports",
]
inbound = [
  "dep:axum",
  "dep:entity_access",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/inbound",
  "models_pagination/axum",
  "ports",
  "schema",
]
kafka_consumer = [
  "dep:kafka_util",
  "dep:rdkafka",
  "dep:tokio-retry",
  "macro_event_broker/outbound",
  "ports",
]
list = [
  "dep:filter_ast",
  "dep:frecency",
  "dep:item_filters",
  "dep:model-entity",
  "dep:recursion",
  "dep:rootcause",
  "dep:serde_json",
  "frecency/ports",
  "ports",
]
outbound = [
  "dep:connection_gateway_client",
  "dep:contacts",
  "dep:entity_access",
  "dep:entity_access_db_utils",
  "dep:indexmap",
  "dep:macro_uuid",
  "dep:model-entity",
  "dep:model_notifications",
  "dep:models_permissions",
  "dep:notification_hex",
  "dep:serde_json",
  "dep:share_permission_db_utils",
  "dep:sqlx",
  "entity_access/ports",
  "list",
  "macro_user_id/sqlx",
  "ports",
]
entity_mutation = [
  "dep:entity_access",
  "dep:entity_mutation",
  "dep:model-entity",
  "dep:rootcause",
  "entity_access/ports",
  "ports",
]
ports = ["dep:entity_access", "dep:tokio", "entity_access/ports"]
schema = ["channel_sender/schema", "dep:utoipa", "macro_user_id/schema"]

[dependencies]
activity = { path = "../activity", default-features = false }
anyhow = { workspace = true }
attachment = { path = "../attachment", optional = true }
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id" }
channel_sender = { path = "../channel_sender" }
entity_mutation = { path = "../entity_mutation", optional = true }
chrono = { workspace = true }
connection_gateway_client = { path = "../connection_gateway_client", optional = true }
contacts = { path = "../contacts", default-features = false, features = [
  "outbound",
], optional = true }
entity_access = { path = "../entity_access", optional = true, default-features = false }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
filter_ast = { path = "../filter_ast", optional = true }
frecency = { path = "../frecency", optional = true }
futures = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
item_filters = { path = "../item_filters", optional = true }
kafka_util = { path = "../kafka_util", optional = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = [
  "axum",
] }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid", optional = true }
model-entity = { path = "../model-entity", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
model_notifications = { path = "../model_notifications", optional = true }
models_pagination = { path = "../models_pagination" }
models_permissions = { path = "../models_permissions", optional = true }
non_empty = { path = "../non_empty", optional = true }
notification_hex = { path = "../notification", package = "notification", optional = true }
rdkafka = { workspace = true, optional = true }
recursion = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
share_permission_db_utils = { path = "../share_permission_db_utils", optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"], optional = true }
tokio-retry = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

# AI Tool dependencies
ai_toolset = { path = "../ai_toolset", optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bot_id = { path = "../bot_id", features = ["test-utils"] }
http-body-util = { workspace = true }
kafka_util = { path = "../kafka_util" }
macro_db_migrator = { path = "../macro_db_migrator" }
macro_env_var = { path = "../macro_env_var" }
# Examples need the Kafka adapter (outbound); the library itself only uses ports.
macro_event_broker = { path = "../macro_event_broker" }
mockall = { workspace = true }
rdkafka = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
