[package]
edition = "2024"
name = "notification_inbox"
publish = false
version = "0.1.0"

[features]
default = []
# The connection gateway adapter for clear updates.
outbound = ["dep:connection_gateway_client"]

[dependencies]
attention_feed = { path = "../attention_feed" }
chrono = { workspace = true }
connection_gateway_client = { path = "../connection_gateway_client", optional = true }
filter_ast = { path = "../filter_ast" }
item_filters = { path = "../item_filters" }
macro_user_id = { path = "../macro_user_id" }
model-entity = { path = "../model-entity" }
model_notifications = { path = "../model_notifications" }
notification = { path = "../notification", default-features = false }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
attention_feed = { path = "../attention_feed", features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
