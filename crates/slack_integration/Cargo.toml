[package]
edition = "2024"
name = "slack_integration"
publish = false
version = "0.1.0"

[features]
default = []
# Adapter implementations are added separately; models remain usable alone.
inbound = ["dep:axum", "dep:utoipa", "dep:macro_authorization", "entity_access/inbound", "ports"]
outbound = ["ports"]
ports = ["dep:entity_access", "dep:futures", "dep:rootcause", "dep:tracing"]
gateway = ["dep:connection_gateway_client", "outbound"]
ledger = ["dep:import", "outbound"]
postgres = ["dep:sqlx", "ledger"]
s3 = ["dep:aws-sdk-s3", "dep:base64", "dep:macro_aws_config", "dep:s3_key", "dep:tokio", "outbound"]
sqs = ["dep:aws-sdk-sqs", "dep:macro_queues", "outbound"]
search = ["dep:reqwest", "outbound"]
worker = ["dep:tokio", "dep:tokio-util", "ports"]

[dependencies]
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
connection_gateway_client = { path = "../connection_gateway_client", optional = true }
entity_access = { path = "../entity_access", optional = true, default-features = false }
futures = { workspace = true, optional = true }
import = { path = "../import", optional = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"], optional = true }
macro_aws_config = { path = "../macro_aws_config", optional = true }
macro_queues = { path = "../macro_queues", optional = true }
macro_user_id = { path = "../macro_user_id" }
mention_utils = { path = "../mention_utils" }
reqwest = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
s3_key = { path = "../s3_key", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
model_user = { path = "../model_user" }
tokio = { workspace = true }
tower = { workspace = true }

