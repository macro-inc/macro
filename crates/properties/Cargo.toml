[package]
edition = "2024"
name = "properties"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
  "ports",
]
default = ["ai_tools", "inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:tokio",
  "dep:utoipa",
  "entity_access/inbound",
  "ports",
]
outbound = [
  "dep:entity_access_db_utils",
  "dep:futures",
  "dep:macro_uuid",
  "dep:model-entity",
  "dep:model_notifications",
  "dep:models_permissions",
  "dep:notification",
  "dep:sqlx",
  "ports",
]
ports = []

[dependencies]
activity = { workspace = true }
ai_toolset = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
document_sub_type = { workspace = true, default-features = true }
bot_id = { workspace = true }
entity_access = { workspace = true, features = [
  "ports",
] }
entity_access_db_utils = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
filter_ast = { workspace = true }
item_filters = { workspace = true }
macro_authorization = { workspace = true, features = [
  "axum",
], optional = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
model_owner = { workspace = true }
macro_uuid = { workspace = true, optional = true }
model-entity = { workspace = true, optional = true }
model_notifications = { workspace = true, optional = true }
models_permissions = { workspace = true, optional = true }
models_properties = { workspace = true }
notification = { workspace = true, default-features = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
system_properties = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"], optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
ai_toolset = { workspace = true }
chrono = { workspace = true }
macro_db_migrator = { workspace = true }
mockall = { workspace = true }
models_pagination = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }

[package.metadata.sqlx]
offline = true
