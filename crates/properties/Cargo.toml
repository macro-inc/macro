[package]
edition = "2024"
name = "properties"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
  "ports",
]
default = ["ai_tools", "inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:tokio",
  "dep:utoipa",
  "entity_access/inbound",
  "ports",
]
outbound = [
  "dep:entity_access_db_utils",
  "dep:futures",
  "dep:macro_uuid",
  "dep:model-entity",
  "dep:model_notifications",
  "dep:models_permissions",
  "dep:notification",
  "dep:sqlx",
  "ports",
]
ports = []

[dependencies]
activity = { path = "../activity", default-features = false }
ai_toolset = { path = "../ai_toolset", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
document_sub_type = { path = "../document_sub_type" }
bot_id = { path = "../bot_id" }
entity_access = { path = "../entity_access", default-features = false, features = [
  "ports",
] }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
futures = { workspace = true, optional = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = [
  "axum",
], optional = true }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid", optional = true }
model-entity = { path = "../model-entity", optional = true }
model_notifications = { path = "../model_notifications", optional = true }
models_permissions = { path = "../models_permissions", optional = true }
models_properties = { path = "../models_properties" }
notification = { path = "../notification", optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
system_properties = { path = "../system_properties" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"], optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
ai_toolset = { path = "../ai_toolset" }
chrono = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
mockall = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }

[package.metadata.sqlx]
offline = true
