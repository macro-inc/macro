[package]
edition = "2024"
name = "ai_billing"
publish = false
version = "0.1.0"

[dependencies]
ai_usage = { path = "../ai_usage" }
anyhow = { workspace = true }
async-stripe = { workspace = true, default-features = false, features = [
  "billing",
  "checkout",
  "runtime-tokio-hyper-rustls-webpki",
] }
authentication_service_client = { path = "../authentication_service_client" }
axum = { workspace = true }
chrono = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = [
  "axum",
] }
macro_user_id = { path = "../macro_user_id", features = ["schema"] }
macro_uuid = { path = "../macro_uuid" }
roles_and_permissions = { path = "../roles_and_permissions", default-features = false, features = [
  "ports",
] }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
teams = { path = "../teams", default-features = false, features = ["ports"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
