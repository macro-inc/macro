[package]
edition = "2024"
name = "ai_billing"
publish = false
version = "0.1.0"

[features]
# Host composition only; admission consumers can keep depending on domain ports.
pg-admission = ["roles_and_permissions/outbound"]

[dependencies]
ai_usage = { workspace = true }
anyhow = { workspace = true }
async-stripe = { workspace = true, default-features = false, features = [
  "billing",
  "checkout",
  "runtime-tokio-hyper",
] }
authentication_service_client = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
macro_authorization = { workspace = true, features = [
  "axum",
] }
macro_user_id = { workspace = true, features = ["schema"] }
macro_uuid = { workspace = true }
roles_and_permissions = { workspace = true, features = [
  "ports",
] }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
ai_admission = { workspace = true }

[dev-dependencies]
macro_db_migrator = { workspace = true }
roles_and_permissions = { workspace = true, features = [
  "outbound",
] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
