[package]
edition = "2024"
name = "whatsapp_linked"
publish = false
version = "0.1.0"

[features]
default = []
# Port traits and the domain services built on them.
ports = [
  "dep:async-trait",
  "dep:entity_access",
  "dep:macro_user_id",
  "dep:rootcause",
  "entity_access/ports",
]
# Postgres adapters, shared by DSS and the session service.
outbound = [
  "dep:entity_access",
  "dep:opentelemetry",
  "dep:sqlx",
  "dep:tracing-opentelemetry",
  "entity_access/ports",
  "entity_access/outbound",
  "ports",
]
# DSS HTTP routes.
inbound = [
  "dep:axum",
  "dep:entity_access",
  "dep:macro_authorization",
  "entity_access/inbound",
  "ports",
  "schema",
]
schema = ["dep:utoipa"]

[dependencies]
models_permissions = { path = "../models_permissions" }
share_permission_db_utils = { path = "../share_permission_db_utils" }
entity_registry_db_utils = { path = "../entity_registry/entity_registry_db_utils" }
entity_access_db_utils = { path = "../entity_access_db_utils" }
model_owner = { path = "../model_owner" }
model-entity = { path = "../model-entity" }
opentelemetry = { workspace = true, features = ["trace"], optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, features = ["multipart"], optional = true }
chrono = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, optional = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"], optional = true }
macro_user_id = { path = "../macro_user_id", optional = true }
rootcause = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
