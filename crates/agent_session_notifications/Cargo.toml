[package]
name = "agent_session_notifications"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent_session = { path = "../agent_session", default-features = false }
macro_user_id = { path = "../macro_user_id" }
model-entity = { path = "../model-entity" }
model_notifications = { path = "../model_notifications" }
notification = { path = "../notification" }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
agent_session = { path = "../agent_session", default-features = false, features = ["test-utils"] }
bots = { path = "../bots" }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
