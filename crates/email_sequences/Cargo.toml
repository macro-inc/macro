[package]
edition = "2024"
name = "email_sequences"
publish = false
version = "0.1.0"

[features]
default = []
# The HTTP routes (authenticated API and the public unsubscribe page) and the
# sweep loop.
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:serde_json",
  "dep:tokio",
  "dep:tokio-util",
  "dep:utoipa",
]
# Postgres persistence and the team/CRM access adapter.
outbound = [
  "dep:crm",
  "dep:entity_access",
  "dep:filter_ast",
  "dep:item_filters",
  "dep:macro_uuid",
  "dep:sqlx",
]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
crm = { path = "../crm", optional = true, default-features = false, features = ["ports"] }
email = { path = "../email", default-features = false, features = ["ports"] }
entity_access = { path = "../entity_access", optional = true, default-features = false, features = ["ports"] }
filter_ast = { path = "../filter_ast", optional = true }
item_filters = { path = "../item_filters", optional = true, default-features = false }
lazy-regex = { workspace = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
rand = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["json"] }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "time"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
email = { path = "../email", default-features = false, features = ["outbound"] }
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
