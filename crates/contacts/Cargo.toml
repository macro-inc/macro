[package]
edition = "2024"
name = "contacts"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:rate_limit",
  "dep:utoipa",
]
default = ["axum", "inbound", "outbound", "ports"]
inbound = ["axum", "dep:aws-sdk-sqs", "dep:sqs_worker", "ports"]
outbound = [
  "dep:aws-sdk-sqs",
  "dep:reqwest",
  "dep:sqlx",
  "dep:urlencoding",
  "ports",
]
ports = []
picture-fanout = [
  "dep:connection_gateway_client",
  "dep:kafka_util",
  "dep:macro_event_broker",
  "dep:model-entity",
  "dep:rdkafka",
  "dep:user_events",
  "ports",
]
directory-names = ["dep:macro_db_client", "dep:non_empty", "dep:sqlx", "ports"]

[dependencies]
aws-sdk-sqs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
macro_authorization = { workspace = true, features = [
  "axum",
], optional = true }
connection_gateway_client = { workspace = true, optional = true }
kafka_util = { workspace = true, optional = true }
macro_event_broker = { workspace = true, default-features = true, features = [
  "outbound",
], optional = true }
model-entity = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
user_events = { workspace = true, optional = true }
macro_user_id = { workspace = true }
macro_db_client = { workspace = true, default-features = true, optional = true }
non_empty = { workspace = true, optional = true }
rootcause = { workspace = true }
subsequence_match = { workspace = true }
rate_limit = { workspace = true, features = ["axum"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
sqs_worker = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
futures = { workspace = true }
macro_db_migrator = { workspace = true }
http-body-util = { workspace = true }
rate_limit = { workspace = true, features = ["axum", "testing"] }
tower = { workspace = true }
