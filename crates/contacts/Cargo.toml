[package]
edition = "2024"
name = "contacts"
publish = false
version = "0.1.0"

# Facade over contacts_core, contacts_inbound and contacts_outbound; see
# src/lib.rs. Depend on the layer crate you need instead.
[features]
axum = ["dep:contacts_inbound", "contacts_inbound/axum"]
default = ["axum", "inbound", "outbound", "ports"]
inbound = ["axum", "contacts_inbound/worker", "ports"]
outbound = ["dep:contacts_outbound", "ports"]
ports = []

[dependencies]
contacts_core = { path = "../chat/contacts_core" }
contacts_inbound = { path = "../chat/contacts_inbound", default-features = false, optional = true }
contacts_outbound = { path = "../chat/contacts_outbound", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
