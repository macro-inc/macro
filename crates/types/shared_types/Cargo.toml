[package]
edition = "2024"
name = "shared_types"
publish = false
version = "0.1.0"

[features]
# `GenericResponse::send` and the `validate_api_version` middleware. Off by
# default so crates that only use the DTOs don't compile axum through `model`.
axum = ["dep:axum"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
document_sub_type = { workspace = true, default-features = true }
macro_user_id = { workspace = true, features = ["schema"] }
entity_kind = { workspace = true }
model_error_response = { workspace = true, features = ["anyhow"] }
model_owner = { workspace = true }
model_file_type = { workspace = true, features = ["utoipa"] }
model_user = { workspace = true }
models_bulk_upload = { workspace = true }
models_pagination = { workspace = true }
models_permissions = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_repr = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror.workspace = true
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
chat_message = { workspace = true, features = ["schema"] }
entity_basic_types = { workspace = true, features = ["schema", "sqlx"] }
