[package]
edition = "2024"
name = "forms_types"
publish = false
version = "0.1.0"

# The wire vocabulary of Macro Forms, shared by the service, the web client
# and the SDK. Answers and gate rules are `databases_types` types unchanged.
[features]
schema = ["dep:schemars", "form_id/schema", "databases_types/schema"]

[dependencies]
schemars = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
form_id = { workspace = true }
lazy-regex = { workspace = true }
databases_types = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, features = ["chrono", "uuid"] }
strum = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
