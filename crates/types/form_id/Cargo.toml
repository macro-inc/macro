[package]
edition = "2024"
name = "form_id"
publish = false
version = "0.1.0"

[features]
# The agent tools' JSON Schemas of the ids.
schema = ["dep:schemars"]

[dependencies]
id_newtype = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
specta = { workspace = true, features = ["uuid"] }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-shear]
# `uuid_id!` expands to nutype impls that name `::serde`.
ignored = ["serde"]
