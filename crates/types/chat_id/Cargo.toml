[package]
edition = "2024"
name = "chat_id"
publish = false
version = "0.1.0"

[features]
schema = ["dep:utoipa"]
sqlx = ["dep:sqlx"]

[dependencies]
nutype = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-shear]
# `#[nutype(derive(Serialize, Deserialize))]` expands to code that names
# `::serde`, which cargo-shear cannot see.
ignored = ["serde"]
