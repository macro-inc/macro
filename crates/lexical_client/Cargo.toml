[package]
edition = "2024"
name = "lexical_client"
publish = false
version = "0.1.0"

[features]
test-utils = ["dep:axum", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]

[dependencies]
opentelemetry = { workspace = true, features = ["trace"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
agent_fold = { path = "../folds/agent_fold", default-features = false }
anyhow = { workspace = true }
base64 = { workspace = true }
macro_tower_layers = { path = "../macro_tower_layers" }
messages = { path = "../messages" }
trigger_context = { path = "../trigger_context" }
reqwest = { workspace = true }
lazy-regex = { workspace = true }
nom = { workspace = true }
strum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
macro_config = { workspace = true }
macro_document_model = { workspace = true, features = ["html"] }
macro_document_composers = { workspace = true }
lexical_model = { workspace = true }
lexical_loro = { workspace = true }
loro = { workspace = true }
getrandom = { workspace = true }
chrono = { workspace = true }
sync_service_client = { workspace = true }
macro_service_urls = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum = { workspace = true }
