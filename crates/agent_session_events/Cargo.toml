[package]
edition = "2024"
name = "agent_session_events"
publish = false
version = "0.1.0"

[features]
# OpenAPI schemas, for the webhook payload union. Off by default: every
# consumer that only publishes or decodes these events needs none of it.
schema = [
  "dep:utoipa",
  "agent_runtime_protocol/utoipa",
  "bot_id/schema",
  "macro_user_id/schema",
]

[dependencies]
agent_fold = { path = "../agent_fold" }
agent_runtime_protocol = { path = "../agent_runtime_protocol", default-features = false }
bot_id = { path = "../bot_id" }
# Only the domain vocabulary (`Event`, `MacroEvent`, `TopicEvent`); asking for
# `outbound` would pull rdkafka into every consumer of these types.
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
serde = { workspace = true }
strum = { workspace = true }
utoipa = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent_fold = { path = "../agent_fold", features = ["test-utils"] }
bot_id = { path = "../bot_id", features = ["test-utils"] }
serde_json = { workspace = true }
