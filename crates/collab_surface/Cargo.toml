[package]
edition = "2024"
name = "collab_surface"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:utoipa",
  "entity_access/inbound",
  "ports",
]
outbound = ["dep:lexical_client", "dep:sync_service_client", "ports"]
ports = ["dep:entity_access", "dep:tracing"]
postgres = ["dep:macro_db_client", "dep:sqlx", "outbound"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
entity_access = { workspace = true, optional = true, features = ["ports"] }
lexical_client = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = ["axum"] }
macro_db_client = { workspace = true, default-features = true, optional = true }
macro_sync_service_jwt = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
model = { workspace = true }
model_entity = { workspace = true }
model_error_response = { workspace = true, optional = true }
models_permissions = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
sync_service_client = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-retry = { workspace = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { workspace = true }
mockall = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
