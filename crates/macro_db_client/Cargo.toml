[package]
edition = "2024"
name = "macro_db_client"
publish = false
version = "0.1.0"

[features]
account_merge_request = ["dep:rand"]
default = ["account_merge_request", "team"]
team = ["dep:models_team"]

[dependencies]
messages = { workspace = true, features = ["outbound", "annotations"] }
agent = { workspace = true }
anyhow = { workspace = true }
rootcause = { workspace = true }
async-recursion = "1.1.1"
async-trait = { workspace = true }
cached = { workspace = true }
chrono = { workspace = true }
document_sub_type = { workspace = true, default-features = true }
entity_access_db_utils = { workspace = true }
entity_registry_db_utils = { workspace = true }
futures = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
model = { workspace = true }
model-entity = { workspace = true }
model_owner = { workspace = true }
model_file_type = { workspace = true }
models_dcs = { workspace = true }
models_entity_access_management = { workspace = true, default-features = true, features = [
  "db",
] }
models_opensearch = { workspace = true }
models_pagination = { workspace = true }
models_permissions = { workspace = true }
models_team = { workspace = true, optional = true }
non_empty = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
system_properties = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
user_quota = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
entity_access = { workspace = true, features = ["outbound"] }
