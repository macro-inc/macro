[package]
edition = "2024"
name = "documents"
publish = false
version = "0.1.0"

[[bin]]
name = "backfill_markdown_content_location"
path = "src/bin/backfill_markdown_content_location.rs"
required-features = ["backfill_binary"]

[features]
purge = [
  "ports",
  "outbound",
  "dep:macro_db_client",
  "dep:macro_sha_count_client",
  "dep:sqs_client",
  "dep:comms_db_client",
]
ai_tools = [
  "dep:ai_billing",
  "dep:base64",
  "dep:ai_engine",
  "dep:ai_toolset",
  "dep:ai_usage",
  "dep:docx_engine",
  "dep:fig_engine",
  "dep:async-trait",
  "dep:loro",
  "dep:macro_tower_layers",
  "dep:messages",
  "dep:macro_db_client",
  "dep:model_file_type",
  "dep:pptx_engine",
  "dep:psd_engine",
  "dep:schemars",
  "dep:sha2",
  "document_create_adapters",
  "outbound",
  "ports",
]
attachment = [
  "dep:ai_toolset",
  "dep:attachment",
  "dep:lexical_client",
  "dep:model_file_type",
  "dep:reqwest",
  "ports",
]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:base64",
  "dep:entity_registry",
  "dep:jsonwebtoken",
  "dep:lexical_client",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:model_user",
  "dep:task_dedup",
  "dep:utoipa",
  "entity_access/axum",
  "entity_registry/axum",
  "schema",
]
backfill_binary = [
  "dep:clap",
  "dep:macro_entrypoint",
  "dep:lexical_service_url",
  "dep:sync_service_url",
  "markdown_init",
  "outbound",
  "ports",
]
default = ["ai_tools", "axum", "inbound", "outbound", "ports", "service"]
document_create = ["dep:base64", "dep:sha2", "ports"]
document_create_adapters = [
  "dep:comms_db_client",
  "dep:reqwest",
  "dep:sqlx",
  "document_create",
  "markdown_init",
]
inbound = ["axum", "document_create_adapters", "ports"]
markdown_init = ["dep:lexical_client"]
outbound = [
  "dep:aws-sdk-s3",
  "dep:base64",
  "dep:entity_access_db_utils",
  "dep:entity_registry",
  "dep:entity_registry_db_utils",
  "dep:hex",
  "dep:redis",
  "dep:share_permission_db_utils",
  "dep:sqlx",
  "ports",
]
ports = ["dep:shared_entity_registry", "dep:tokio", "dep:tokio-retry"]
schema = ["dep:utoipa", "macro_user_id/schema", "pptx_engine?/openapi"]
service = [
  "dep:entity_access_management",
  "dep:foreign_entity",
  "dep:github_pull_requests",
  "ports",
]

[dependencies]
agent_correlation = { workspace = true }
macro_db_client = { workspace = true, default-features = true, optional = true }
macro_sha_count_client = { workspace = true, optional = true }
sqs_client = { workspace = true, default-features = true, optional = true }
activity = { workspace = true }
bot_id = { workspace = true }
# Core
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }

# Domain models (always included)
connection = { workspace = true, features = [
  "ports",
] }
document_sub_type = { workspace = true, default-features = true }
entity_access = { workspace = true, default-features = true }
entity_mutation = { workspace = true }
entity_access_management = { workspace = true, features = [
  "outbound",
  "ports",
], optional = true }
foreign_entity = { workspace = true, features = [
  "ports",
], optional = true }
github_pull_requests = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = [
  "axum",
] }
macro_aws_config = { workspace = true, features = ["s3"] }
macro_entrypoint = { workspace = true, optional = true }
macro_env_var = { workspace = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_sync_service_jwt = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
system_skills = { workspace = true }
model = { workspace = true }
model_entity = { workspace = true }
models_permissions = { workspace = true }
models_properties = { workspace = true }
rootcause = { workspace = true }
s3_key = { workspace = true }

# Async runtime (for ports)
tokio = { workspace = true, optional = true }
tokio-retry = { workspace = true, optional = true }

# Axum dependencies (for inbound)
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
model_error_response = { workspace = true, optional = true }
model_user = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

# Outbound dependencies
aws-sdk-s3 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cloudfront_sign = { workspace = true }
comms_db_client = { workspace = true, optional = true }
entity_access_db_utils = { workspace = true, optional = true }
entity_registry = { workspace = true, optional = true }
entity_registry_db_utils = { workspace = true, optional = true }
shared_entity_registry = { workspace = true, optional = true }
model_owner = { workspace = true }
futures = { workspace = true }
share_permission_db_utils = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["aio", "tokio-rustls-comp"] }
sqlx = { workspace = true, optional = true }
sync_service_client = { workspace = true }
task_dedup = { workspace = true, optional = true }

# AI Tool dependencies
ai_billing = { workspace = true, optional = true }
ai_toolset = { workspace = true, optional = true }
ai_usage = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
lexical_client = { workspace = true, optional = true }
loro = { workspace = true, optional = true }
macro_tower_layers = { workspace = true, optional = true }
messages = { workspace = true, optional = true, features = ["ports"] }
model_file_type = { workspace = true, optional = true }
ai_engine = { workspace = true, optional = true }
docx_engine = { workspace = true, optional = true }
fig_engine = { workspace = true, default-features = true, optional = true }
pptx_engine = { workspace = true, default-features = true, optional = true, features = ["embedded-fonts", "schema"] }
psd_engine = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }


# Attachment
attachment = { workspace = true, optional = true }
non_empty = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
lexical_service_url = { workspace = true, optional = true }
sync_service_url = { workspace = true, optional = true }

[dev-dependencies]
channel_sender = { workspace = true }
messages = { workspace = true, features = ["ports", "test-utils"] }
bot_id = { workspace = true, features = ["test-utils"] }
embedding = { workspace = true }
http-body-util = { workspace = true }
kafka_util = { workspace = true }
macro_db_migrator = { workspace = true }
# Examples need the Kafka adapter (outbound); the library itself only uses ports.
macro_event_broker = { workspace = true, default-features = true }
mockall = { workspace = true }
rdkafka = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
