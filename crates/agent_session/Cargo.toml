[package]
name = "agent_session"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Mock and in-memory port implementations, for crates that test against this one.
test-utils = ["dep:mockall"]

[dependencies]

macro_uuid = { path = "../macro_uuid" }
mockall = { workspace = true, optional = true }
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
bots = { path = "../bots"}
macro_user_id =  { path = "../macro_user_id", features = ["sqlx"] }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent-client-protocol = { workspace = true }
axum = { workspace = true, features = ["ws"] }
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }
