[package]
name = "graphql_email"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-graphql = { workspace = true, features = ["dataloader"] }
chrono = { workspace = true }
email = { path = "../email", default-features = false, features = ["axum", "inbound", "ports"] }
email_utils = { path = "../email_utils" }
entity_access = { path = "../entity_access", default-features = false }
futures = { workspace = true }
graphql_common = { path = "../graphql_common" }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bot_id = { path = "../bot_id" }
tracing-subscriber = { workspace = true }
