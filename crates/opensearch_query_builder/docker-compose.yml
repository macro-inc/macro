# Single-node OpenSearch for crate examples. Image is Nix dockerTools
# (`macro-local-opensearch:dev`); load it with:
#   bash tooling/scripts/load-nix-docker-streams.sh stream-docker-image-local-opensearch
version: "3.8"
services:
  opensearch:
    image: macro-local-opensearch:dev
    container_name: opensearch
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600

volumes:
  opensearch-data:
