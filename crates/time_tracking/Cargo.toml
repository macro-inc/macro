[package]
edition = "2024"
name = "time_tracking"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:serde_with",
  "dep:utoipa",
]
outbound = ["dep:feature_flags", "dep:sqlx", "dep:system_properties"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
feature_flags = { path = "../feature_flags", optional = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
model-error-response = { path = "../model-error-response", optional = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
system_properties = { path = "../system_properties", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v7"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
anyhow = { workspace = true }
http-body-util = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
model_user = { path = "../model_user" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tower = { workspace = true }
