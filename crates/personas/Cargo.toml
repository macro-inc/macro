[package]
edition = "2024"
name = "personas"
publish = false
version = "0.1.0"

[features]
default = ["inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model-error-response",
  "macro_authorization/axum",
  "dep:utoipa",
  "ports",
]
outbound = ["dep:sqlx", "ports"]
ports = ["dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id", features = ["schema"] }
chrono = { workspace = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
model-error-response = { path = "../model-error-response", optional = true }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
anyhow = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
