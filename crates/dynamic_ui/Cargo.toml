[package]
name = "dynamic_ui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# The `export_view_types` codegen binary, which writes files the library never
# needs.
cli = ["dep:specta-typescript", "dep:specta-serde"]

[[bin]]
name = "export_view_types"
required-features = ["cli"]
test = false

[dependencies]
lazy-regex = { workspace = true }
nutype = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
specta = { workspace = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
