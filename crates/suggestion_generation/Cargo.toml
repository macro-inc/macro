[package]
name = "suggestion_generation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent_runtime_protocol = { path = "../agent_runtime_protocol", default-features = false }
agent_session = { path = "../agent_session", default-features = false, features = ["admission"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bot_id = { path = "../bot_id" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
feature_flags = { path = "../feature_flags" }
futures = { workspace = true }
suggestions = { path = "../suggestions" }
macro_authorization = { path = "../macro_authorization", features = ["postgres"] }
macro_user_id = { path = "../macro_user_id" }
macro_tower_layers = { path = "../macro_tower_layers" }
macro_uuid = { path = "../macro_uuid" }
rootcause = { workspace = true }
routine_program = { path = "../routine_program" }
scheduled_action = { path = "../scheduled_action" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
trigger_context = { path = "../trigger_context" }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true }
model_owner = { path = "../model_owner" }
bot_id = { path = "../bot_id", features = ["test-utils"] }
macro_db_migrator = { path = "../macro_db_migrator" }
uuid = { workspace = true }
