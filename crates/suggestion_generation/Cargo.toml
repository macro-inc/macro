futures = { workspace = true }
suggestions = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = ["postgres"] }
macro_user_id = { workspace = true }
macro_tower_layers = { workspace = true }
macro_uuid = { workspace = true }
rootcause = { workspace = true }
routine_program = { workspace = true }
scheduled_action = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
trigger_context = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
