[package]
name = "suggestion_generation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent_runtime_protocol = { workspace = true }
agent_session = { workspace = true, features = ["admission"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bot_id = { workspace = true }
chrono = { workspace = true }
