[package]
edition = "2024"
name = "skills"
publish = false
version = "0.1.0"

[features]
ai_tools = ["dep:ai_toolset", "dep:async-trait", "dep:schemars", "dep:serde", "ports"]
default = ["ai_tools", "outbound", "ports"]
outbound = [
  "dep:cowlike",
  "dep:document_sub_type",
  "dep:email",
  "dep:filter_ast",
  "dep:item_filters",
  "dep:models_pagination",
  "dep:models_search",
  "dep:models_soup",
  "dep:search_service_client",
  "dep:soup",
  "ports",
]
ports = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
macro_user_id = { path = "../macro_user_id" }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# AI toolset dependencies
ai_toolset = { path = "../ai_toolset", optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# Outbound dependencies
cowlike = { path = "../cowlike", optional = true }
document_sub_type = { path = "../document_sub_type", optional = true }
email = { path = "../email", default-features = false, optional = true }
filter_ast = { path = "../filter_ast", optional = true }
item_filters = { path = "../item_filters", optional = true }
models_pagination = { path = "../models_pagination", optional = true }
models_search = { path = "../models_search", optional = true }
models_soup = { path = "../models_soup", optional = true }
search_service_client = { path = "../search_service_client", optional = true }
soup = { path = "../soup", default-features = false, features = ["ports"], optional = true }

workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
