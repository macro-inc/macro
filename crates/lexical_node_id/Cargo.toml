[package]
name = "lexical_node_id"
version = "0.1.0"
edition = "2024"
publish = false

[features]
sqlx = ["dep:sqlx"]
schema = ["dep:utoipa"]

[dependencies]
nutype.workspace = true
serde.workspace = true
sqlx = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[package.metadata.cargo-shear]
# nutype's serialization derives expand to ::serde paths.
ignored = ["serde"]
