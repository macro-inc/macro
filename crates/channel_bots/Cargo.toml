[package]
edition = "2024"
name = "channel_bots"
publish = false
version = "0.1.0"

[dependencies]
agent = { path = "../agent" }
ai_usage = { path = "../ai_usage" }
ai_tools = { path = "../ai_tools" }
ai_toolset = { path = "../ai_toolset" }
anyhow = { workspace = true }
async-trait = { workspace = true }
bot_id = { path = "../bot_id" }
calendar_events = { path = "../calendar_events" }
channel_sender = { path = "../channel_sender" }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
lexical_client = { path = "../lexical_client" }
macro_user_id = { path = "../macro_user_id" }
messages = { path = "../messages", features = ["ports"] }
prompt = { path = "../prompt" }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
messages = { path = "../messages", features = ["test-utils"] }
