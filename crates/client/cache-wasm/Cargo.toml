[package]
edition = "2024"
name = "cache-wasm"
publish = false
version = "0.6.4"

[features]
default = []
browser-test-hooks = ["cache-turso/browser-test-hooks"]

[lib]
crate-type = ["cdylib", "rlib"]

# Custom profiles are reserved for local profiling builds. Keep Rust DWARF in
# wasm-bindgen's output and skip wasm-opt, which otherwise strips or rewrites
# the source locations needed to symbolicate Firefox profiles.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom.wasm-bindgen]
demangle-name-section = true
dwarf-debug-info = true

# Browser-only wasm-bindgen shell around the engine + Turso OPFS storage. It
# compiles to an empty shell off-wasm so workspace `cargo test` stays green.

[dependencies]
cache-core = { path = "../cache-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-lock = { workspace = true }
cache-turso = { path = "../cache-turso" }
predicate-index = { path = "../../predicate_index" }
soup-filter-cache-adapter = { path = "../../soup_filter_cache_adapter" }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
turso-opfs = { path = "../turso-opfs" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
soup-filter-projection = { path = "../../soup_filter_projection", default-features = false }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen-test = { workspace = true }
