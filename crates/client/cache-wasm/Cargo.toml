[package]
edition = "2024"
name = "cache-wasm"
publish = false
# Rebuild with paged database view reads retained in the cache.
version = "0.6.54"

[features]
default = []
browser-test-hooks = ["cache-turso/browser-test-hooks"]

[lib]
crate-type = ["cdylib", "rlib"]

# Custom profiles are reserved for local profiling builds. Keep Rust DWARF in
# wasm-bindgen's output and skip wasm-opt, which otherwise strips or rewrites
# the source locations needed to symbolicate Firefox profiles.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom.wasm-bindgen]
demangle-name-section = true
dwarf-debug-info = true

# Browser-only wasm-bindgen shell around the engine + Turso OPFS storage. It
# compiles to an empty shell off-wasm so workspace `cargo test` stays green.

[dependencies]
cache-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-lock = { workspace = true }
cache-turso = { workspace = true }
predicate-index = { workspace = true }
soup-filter-cache-adapter = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
turso-opfs = { workspace = true }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
soup-filter-projection = { workspace = true }
wasm-bindgen-test = { workspace = true }
