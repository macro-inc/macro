[package]
edition = "2024"
name = "cache-diff-fuzz"
publish = false
version = "0.1.0"

[[bin]]
name = "cache-diff-fuzz"
path = "src/main.rs"

[dependencies]
apollo-compiler = { workspace = true }
cache-core = { path = "../cache-core" }
cache-turso = { path = "../cache-turso" }
clap = { workspace = true }
pollster = { workspace = true }
predicate-index = { path = "../../predicate_index" }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
soup-filter-cache-adapter = { path = "../../soup_filter_cache_adapter" }
soup-filter-projection = { path = "../../soup_filter_projection", default-features = false }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
turso_core = { workspace = true, features = ["fs"] }
uuid = { workspace = true }

# build.rs compiles the Tauri host's engine module and src/fuzz_hooks.rs into the binary
# through include!, where cargo-shear can't see them use these.
[package.metadata.cargo-shear]
ignored = ["soup-filter-cache-adapter", "tokio", "tracing"]
ignored-paths = ["src/fuzz_hooks.rs"]
