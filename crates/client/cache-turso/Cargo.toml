[package]
edition = "2024"
name = "cache-turso"
publish = false
version = "0.1.0"

[features]
default = []
browser-test-hooks = []

[dependencies]
cache-core = { path = "../cache-core" }
maybe_send = { path = "../../maybe_send" }
predicate-index = { path = "../../predicate_index" }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
turso-opfs = { path = "../turso-opfs" }
turso_core = { workspace = true, features = ["fs", "pure-rust-crypto", "uuid"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
turso_core = { workspace = true, features = ["fs", "pure-rust-crypto", "uuid"] }

[dev-dependencies]
apollo-compiler = { workspace = true }
apollo-parser = { workspace = true }
clap = { workspace = true, features = ["derive"] }
pollster = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[bench]]
name = "graphql_queries"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
soup-filter-projection = { path = "../../soup_filter_projection", default-features = false }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
