[package]
edition = "2024"
name = "cache-core"
publish = false
version = "0.1.0"

[features]
schema = ["dep:schemars", "database_sql_engine/schema"]

[[example]]
name = "people_schema"
required-features = ["schema"]

[dependencies]
apollo-compiler = { workspace = true }
apollo-parser = { workspace = true }
chrono = { workspace = true }
database_sql_engine = { workspace = true }
lru = { workspace = true }
macro_user_id = { workspace = true }
maybe_send = { workspace = true }
miniz_oxide = { workspace = true }
postcard = { workspace = true }
predicate-index = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
# Opaque JSON scalars must preserve floating-point values when reparsed.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
subsequence_match = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
database_sql_engine = { workspace = true, features = ["schema"] }
schemars = { workspace = true }
pollster = { workspace = true }
proptest = { workspace = true }
