[package]
name = "lexical_loro"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Preview/test probes; the production feature graph excludes this opt-in.
dev-probes = []

[dependencies]
lexical_model = { workspace = true }
loro = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
lexical_model = { workspace = true, features = ["model-segmentation"] }
proptest = { workspace = true }
lexical_rich_nodes = { workspace = true }
