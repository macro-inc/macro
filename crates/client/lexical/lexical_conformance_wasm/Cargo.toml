[package]
name = "lexical_conformance_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["js-nodes"]
js-nodes = ["lexical_model/foreign-nodes"]

[dependencies]
thiserror.workspace = true
lexical_model.workspace = true
lexical_rich_nodes.workspace = true
lexical_markdown.workspace = true
regress.workspace = true
wasm-bindgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[build-dependencies]
serde_json.workspace = true
