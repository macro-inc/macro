[package]
name = "lexical_conformance_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["js-nodes"]
js-nodes = ["lexical_model/foreign-nodes", "dep:lexical_conformance", "dep:postcard", "dep:specta", "dep:scoped-tls-hkt", "dep:js-sys"]

[dependencies]
macro_document_composers.workspace = true
lexical_loro.workspace = true
macro_document_model = { workspace = true, default-features = false, features = ["html"] }
js-sys = { workspace = true, optional = true }
scoped-tls-hkt = { workspace = true, optional = true }
lexical_conformance = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
thiserror.workspace = true
lexical_model.workspace = true
lexical_rich_nodes.workspace = true
lexical_markdown.workspace = true
regress.workspace = true
wasm-bindgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[build-dependencies]
syn.workspace = true
serde_json.workspace = true

[dev-dependencies]
specta-serde.workspace = true
specta-typescript.workspace = true
clap.workspace = true
rootcause.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true

[[example]]
name = "export_host_types"
required-features = ["js-nodes"]
