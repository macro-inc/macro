[package]
edition = "2024"
name = "slack_linked"
publish = false
version = "0.1.0"
description = "Slack Connect conversations from a person's own Slack sessions, as external chats."

[features]
default = []
# Port traits and the domain services built on them.
ports = [
  "dep:async-trait",
  "dep:macro_user_id",
  "dep:rootcause",
  "external_chat/ports",
]
# Postgres and KMS adapters, shared by DSS and the session service.
outbound = [
  "dep:entity_access_db_utils",
  "dep:entity_registry_db_utils",
  "dep:kms_envelope",
  "dep:macro_env",
  "dep:model_owner",
  "dep:share_permission_db_utils",
  "dep:sha2",
  "dep:sqlx",
  "dep:thiserror",
  "dep:zeroize",
  "external_chat/outbound",
  "ports",
]
# DSS HTTP routes.
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "external_chat/inbound",
  "ports",
  "schema",
]
schema = ["dep:utoipa", "external_chat/schema"]

[dependencies]
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
entity_registry_db_utils = { path = "../entity_registry/entity_registry_db_utils", optional = true }
external_chat = { path = "../external_chat" }
kms_envelope = { path = "../kms_envelope", optional = true }
lazy-regex = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"], optional = true }
macro_env = { path = "../macro_env", optional = true }
macro_user_id = { path = "../macro_user_id", optional = true }
model-entity = { path = "../model-entity" }
model_owner = { path = "../model_owner", optional = true }
rootcause = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
share_permission_db_utils = { path = "../share_permission_db_utils", optional = true }
sha2 = { workspace = true, optional = true }
slack_client = { path = "../slack_client" }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
kms_envelope = { path = "../kms_envelope", features = ["fake"] }
macro_db_migrator = { path = "../macro_db_migrator" }
