[package]
edition = "2024"
name = "whatsmeow_signal"
publish = false
version = "0.1.0"
license = "AGPL-3.0-only"
description = "The Signal protocol for the whatsmeow port, built on Signal's libsignal and patched for WhatsApp's wire format."

[dependencies]
aes = { workspace = true }
async-trait = { workspace = true }
cbc = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
libsignal-core = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
whatsmeow = { path = "../whatsmeow" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokio-util = { workspace = true }
whatsapp_fake_server = { path = "../whatsapp_fake_server" }
