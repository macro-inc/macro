# Two Macro users' Outlook mailboxes and calendars, and one outside
# correspondent's.
mailboxes:
  - email: ada@example.com
    name: Ada Example
    # The email_links.id this mailbox is connected as, for the
    # authentication-service stand-in.
    link_id: 0195a000-0000-7000-8000-00000000a11c
    # mailboxSettings.timeZone, as Outlook names it.
    time_zone: Pacific Standard Time
    # Events are the JSON a client posts to Graph, with times in an IANA
    # zone. Series repeat without end, so a stack has something on its
    # calendars whenever it runs.
    calendars:
      - name: Calendar
        default: true
        events:
          - subject: Team sync
            iCalUId: team-sync@example.com
            start: { dateTime: "2026-01-05T10:00:00", timeZone: America/Los_Angeles }
            end: { dateTime: "2026-01-05T10:30:00", timeZone: America/Los_Angeles }
            originalStartTimeZone: Pacific Standard Time
            location: { displayName: Room 4 }
            body: { contentType: html, content: "<p>Weekly priorities and blockers.</p>" }
            attendees:
              - { emailAddress: { address: bob@example.com, name: Bob Example }, type: required, status: { response: accepted, time: "2026-01-02T17:00:00Z" } }
              - { emailAddress: { address: carol@example.com, name: Carol Example }, type: optional }
            recurrence:
              pattern: { type: weekly, interval: 1, daysOfWeek: [monday], firstDayOfWeek: sunday }
              range: { type: noEnd, startDate: "2026-01-05" }
            # One week's meeting moved to the Tuesday, and one deleted.
            exceptions:
              - date: "2026-11-16"
                subject: Team sync (moved)
                start: { dateTime: "2026-11-17T14:00:00", timeZone: America/Los_Angeles }
                end: { dateTime: "2026-11-17T14:30:00", timeZone: America/Los_Angeles }
            cancelledOccurrences: ["2026-11-23"]
          - subject: Standup
            start: { dateTime: "2026-01-05T09:00:00", timeZone: America/Los_Angeles }
            end: { dateTime: "2026-01-05T09:15:00", timeZone: America/Los_Angeles }
            showAs: tentative
            recurrence:
              pattern: { type: weekly, interval: 1, daysOfWeek: [monday, tuesday, wednesday, thursday, friday], firstDayOfWeek: sunday }
              range: { type: noEnd, startDate: "2026-01-05" }
          - subject: 1:1 with Grace
            organizer: { emailAddress: { address: grace@example.com, name: Grace Example } }
            responseStatus: { response: accepted, time: "2026-01-06T18:00:00Z" }
            start: { dateTime: "2026-01-08T13:00:00", timeZone: America/New_York }
            end: { dateTime: "2026-01-08T13:45:00", timeZone: America/New_York }
            attendees:
              - { emailAddress: { address: ada@example.com, name: Ada Example }, type: required, status: { response: accepted, time: "2026-01-06T18:00:00Z" } }
            recurrence:
              pattern: { type: relativeMonthly, interval: 1, daysOfWeek: [thursday], index: second }
              range: { type: noEnd, startDate: "2026-01-08" }
          - subject: Quarterly numbers review
            start: { dateTime: "2026-11-12T15:00:00", timeZone: America/Los_Angeles }
            end: { dateTime: "2026-11-12T16:00:00", timeZone: America/Los_Angeles }
            sensitivity: private
          - subject: Out of office
            isAllDay: true
            showAs: oof
            start: { dateTime: "2026-11-26T00:00:00", timeZone: UTC }
            end: { dateTime: "2026-11-28T00:00:00", timeZone: UTC }
      - name: Apollo launch
        color: lightBlue
        hex_color: "#0078d4"
        events:
          - subject: Launch checkpoint
            start: { dateTime: "2026-01-07T11:00:00", timeZone: America/Los_Angeles }
            end: { dateTime: "2026-01-07T11:30:00", timeZone: America/Los_Angeles }
            recurrence:
              pattern: { type: weekly, interval: 2, daysOfWeek: [wednesday], firstDayOfWeek: sunday }
              range: { type: noEnd, startDate: "2026-01-07" }
      - name: United States holidays
        read_only: true
        online_meeting_providers: []
        events:
          - subject: New Year's Day
            isAllDay: true
            showAs: free
            start: { dateTime: "2026-01-01T00:00:00", timeZone: UTC }
            end: { dateTime: "2026-01-02T00:00:00", timeZone: UTC }
            recurrence:
              pattern: { type: absoluteYearly, interval: 1, dayOfMonth: 1, month: 1 }
              range: { type: noEnd, startDate: "2026-01-01" }
          - subject: Thanksgiving Day
            isAllDay: true
            showAs: free
            start: { dateTime: "2026-11-26T00:00:00", timeZone: UTC }
            end: { dateTime: "2026-11-27T00:00:00", timeZone: UTC }
            recurrence:
              pattern: { type: relativeYearly, interval: 1, daysOfWeek: [thursday], index: fourth, month: 11 }
              range: { type: noEnd, startDate: "2026-11-26" }
    folders:
      - name: Projects
      - name: Apollo
        parent: Projects
    categories: [Receipts]
    contacts:
      - { email: grace@example.com, name: Grace Example }
      - { email: alan@example.com, name: Alan Example }
    messages:
      - from: Grace Example <grace@example.com>
        subject: Quarterly numbers
        text: The Q3 numbers are ready for review.
        message_id: q3-1@example.com
        read: true
        date: "2026-11-03T09:00:00Z"
      - from: Ada Example <ada@example.com>
        to: Grace Example <grace@example.com>
        subject: "RE: Quarterly numbers"
        text: Thanks, reading them now.
        message_id: q3-2@example.com
        in_reply_to: q3-1@example.com
        folder: sentitems
        date: "2026-11-03T09:30:00Z"
      - from: Grace Example <grace@example.com>
        subject: "RE: Quarterly numbers"
        html: "<p>One correction on <b>page 4</b>.</p>"
        in_reply_to: q3-2@example.com
        flagged: true
        date: "2026-11-03T10:00:00Z"
        attachments:
          - filename: page4.csv
            mime_type: text/csv
            text: "region,total\nwest,42\n"
      - from: Billing <billing@example.com>
        subject: Receipt 1042
        text: Your receipt is attached to your account.
        categories: [Receipts]
        other: true
        date: "2026-11-05T12:00:00Z"
      - from: Alan Example <alan@example.com>
        subject: Lunch on Friday?
        text: Are you free at noon on Friday?
        date: "2026-11-08T08:15:00Z"
      - from: Alan Example <alan@example.com>
        subject: Apollo kickoff
        text: Notes from the kickoff.
        folder: Apollo
        read: true
        date: "2026-11-09T07:00:00Z"
  - email: bob@example.com
    name: Bob Example
    time_zone: Eastern Standard Time
    calendars:
      - name: Calendar
        default: true
        events:
          # Bob's copy of Ada's meeting: the same iCalUId, her as organizer.
          - subject: Team sync
            iCalUId: team-sync@example.com
            organizer: { emailAddress: { address: ada@example.com, name: Ada Example } }
            responseStatus: { response: accepted, time: "2026-01-02T17:00:00Z" }
            start: { dateTime: "2026-01-05T10:00:00", timeZone: America/Los_Angeles }
            end: { dateTime: "2026-01-05T10:30:00", timeZone: America/Los_Angeles }
            originalStartTimeZone: Pacific Standard Time
            location: { displayName: Room 4 }
            attendees:
              - { emailAddress: { address: bob@example.com, name: Bob Example }, type: required, status: { response: accepted, time: "2026-01-02T17:00:00Z" } }
              - { emailAddress: { address: carol@example.com, name: Carol Example }, type: optional }
            recurrence:
              pattern: { type: weekly, interval: 1, daysOfWeek: [monday], firstDayOfWeek: sunday }
              range: { type: noEnd, startDate: "2026-01-05" }
            exceptions:
              - date: "2026-11-16"
                subject: Team sync (moved)
                start: { dateTime: "2026-11-17T14:00:00", timeZone: America/Los_Angeles }
                end: { dateTime: "2026-11-17T14:30:00", timeZone: America/Los_Angeles }
            cancelledOccurrences: ["2026-11-23"]
    messages:
      - from: Carol Example <carol@example.com>
        subject: Welcome aboard
        text: Glad to have you on the team.
        date: "2026-11-02T15:00:00Z"
      - from: Carol Example <carol@example.com>
        subject: Your laptop
        text: It ships on Monday.
        read: true
        date: "2026-11-04T11:00:00Z"
  - email: carol@example.com
    name: Carol Example
