[package]
edition = "2024"
name = "outlook_emulator"
publish = false
version = "0.1.0"
description = "Test support: a stateful fake of the Microsoft Graph mail API Macro's email code calls (messages, folders, delta, drafts, attachments, subscriptions with change notifications, throttling), in process or as a standalone binary."

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
macro_entrypoint = { path = "../macro_entrypoint" }
macro_env = { path = "../macro_env" }
mail-builder = { workspace = true }
mailparse = { workspace = true }
nom = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
email_api_client = { path = "../email_api_client", features = ["outbound-outlook"] }
macro_service_urls = { path = "../macro_service_urls" }
models_email = { path = "../models_email" }
