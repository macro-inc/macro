[package]
edition = "2024"
name = "slack_e2e"
publish = false
version = "0.1.0"
description = "End-to-end tests of Slack Connect sync: DSS use cases, session-service replicas and a fake Slack."

[dependencies]
kms_envelope = { path = "../kms_envelope", features = ["fake"] }
slack_client = { path = "../slack_client" }
slack_fake_server = { path = "../slack_fake_server" }
slack_session_service = { path = "../../services/slack_session_service" }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
async-trait = { workspace = true }
macro_user_id = { path = "../macro_user_id" }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
external_chat = { path = "../external_chat", features = ["outbound", "test-support"] }
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
slack_linked = { path = "../slack_linked", features = ["outbound"] }
uuid = { workspace = true }
