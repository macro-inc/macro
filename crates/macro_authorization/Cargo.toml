[package]
edition = "2024"
name = "macro_authorization"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:macro_auth",
  "dep:model-error-response",
  "dep:serde",
]
default = ["axum", "outbound"]
local_auth = ["dep:macro_env_var"]
outbound = ["dep:macro_auth"]
postgres = ["dep:sqlx", "dep:sha2"]

[dependencies]
axum = { workspace = true, optional = true }
bot_id = { workspace = true }
bot_token = { workspace = true }
constant_time_eq = { workspace = true }
harness_id = { workspace = true }
harness_token = { workspace = true }
macro_auth = { workspace = true, optional = true }
macro_env_var = { workspace = true, optional = true }
macro_user_id = { workspace = true }
model-error-response = { workspace = true, optional = true }
model_user = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
cookie = { workspace = true }
harness_id = { workspace = true, features = ["test-utils"] }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
macro_auth = { workspace = true, features = ["testing"] }
macro_db_migrator = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }
urlencoding = { workspace = true }
