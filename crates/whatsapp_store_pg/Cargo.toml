[package]
edition = "2024"
name = "whatsapp_store_pg"
publish = false
version = "0.1.0"
description = "Postgres implementation of the whatsmeow device stores, with per-account envelope encryption."

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
kms_envelope = { path = "../kms_envelope" }
postcard = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
whatsmeow = { path = "../whatsmeow" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zeroize = { workspace = true }

[dev-dependencies]
kms_envelope = { path = "../kms_envelope", features = ["fake"] }
futures = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
