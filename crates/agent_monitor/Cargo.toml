[package]
description = "Collector for the agent monitor: the normalized agent model, the single-writer store, source adapters, and the gRPC server and client over a Unix socket."
edition = "2024"
name = "agent_monitor"
publish = false
version = "0.1.0"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
notify = { workspace = true }
prost = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[package.metadata.cargo-shear]
# Used by the code `build.rs` generates into `OUT_DIR`.
ignored = ["prost", "tonic-prost"]
