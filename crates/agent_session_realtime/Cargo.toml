[package]
edition = "2024"
name = "agent_session_realtime"
publish = false
version = "0.1.0"

[features]
# The Redis Stream publisher and consumer; without it only the ports and the
# fan-out service compile, for the GraphQL schema crate.
default = ["redis"]
redis = [
  "dep:chrono",
  "dep:macro_uuid",
  "dep:redis",
  "dep:serde_json",
]

[dependencies]
agent_session = { workspace = true }
broadcast = { workspace = true }
chrono = { workspace = true, optional = true }
macro_uuid = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = [
  "aio",
  "streams",
  "tokio-comp",
] }
rootcause = { workspace = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-retry = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent-client-protocol = { workspace = true }
agent_runtime_protocol = { workspace = true, default-features = true }
agent_session = { workspace = true, features = ["test-utils"] }
chrono = { workspace = true }
macro_env_var = { workspace = true }
macro_uuid = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
