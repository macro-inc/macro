[package]
edition = "2024"
name = "entity_registry"
publish = false
version = "0.1.0"

[features]
axum = ["dep:axum", "macro_authorization/axum"]
default = []
postgres = ["dep:sqlx", "model_owner/sqlx"]

[dependencies]
axum = { workspace = true, optional = true }
bot_id = { workspace = true }
chrono = { workspace = true }
macro_authorization = { workspace = true }
entity_kind = { workspace = true }
model_owner = { workspace = true }
rootcause = { workspace = true }
shared_entity_registry = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
harness_id = { workspace = true }
macro_db_migrator = { workspace = true }
macro_user_id = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v7"] }
