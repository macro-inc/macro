[package]
edition = "2024"
name = "entity_access_outbound"
publish = false
version = "0.1.0"

[[bin]]
name = "explain_access"
path = "src/bin/explain_access.rs"
required-features = ["explain_binary"]

[features]
# The `explain_access` CLI and the Postgres queries behind it.
explain_binary = [
  "dep:clap",
  "dep:database_env_vars",
  "dep:macro_entrypoint",
  "entity_access/explain_binary",
]

[dependencies]
anyhow = { workspace = true }
bot_id = { workspace = true }
cached = { workspace = true }
clap = { workspace = true, optional = true }
database_env_vars = { workspace = true, optional = true }
entity_access = { workspace = true, features = ["ports", "sqlx"] }
futures = { workspace = true }
macro_entrypoint = { workspace = true, optional = true }
macro_user_id = { workspace = true }
model_entity = { workspace = true }
models_entity_access_management = { workspace = true, default-features = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
