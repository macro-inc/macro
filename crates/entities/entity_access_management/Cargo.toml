[package]
edition = "2024"
name = "entity_access_management"
publish = false
version = "0.1.0"

[features]
default = ["outbound", "ports"]
outbound = [
  "dep:entity_access_db_utils",
  "dep:sqlx",
  "entity_access_management_types/db",
  "ports",
]
ports = []

[dependencies]
# Core
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
entity_kind = { workspace = true }
entity_access_management_types = { workspace = true }
permissions_types = { workspace = true }

# Database
entity_access_db_utils = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
