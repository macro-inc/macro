[package]
edition = "2024"
name = "frecency_outbound"
publish = false
version = "0.1.0"

[features]
mock = ["dep:mockall", "frecency_core/mock"]
postgres = ["dep:recursion", "dep:serde_json", "dep:sqlx", "dep:thiserror"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
filter_ast = { path = "../../filter_ast" }
frecency_core = { path = "../frecency_core", features = ["ports"] }
item_filters = { path = "../../item_filters" }
macro_user_id = { path = "../../macro_user_id" }
mockall = { workspace = true, optional = true }
model-entity = { path = "../../model-entity" }
recursion = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
item_filters = { path = "../../item_filters", features = ["mock"] }
macro_db_migrator = { path = "../../macro_db_migrator" }
serde_json = { workspace = true }
uuid = { workspace = true }
