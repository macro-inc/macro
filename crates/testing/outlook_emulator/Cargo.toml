[package]
edition = "2024"
name = "outlook_emulator"
publish = false
version = "0.1.0"
description = "Test support: a stateful fake of the Microsoft Graph mail and calendar APIs and the Microsoft identity platform Macro's email, calendar and sign-in code call (messages, folders, delta, drafts, attachments, subscriptions with change notifications, throttling; calendars, events, series, calendarView delta; sign-in page, tokens, ID tokens and their keys), in process or as a standalone binary."

[dependencies]
askama = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
mail-builder = { workspace = true }
mailparse = { workspace = true }
nom = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
calendar_events = { workspace = true }
email_api_client_core = { workspace = true, features = ["ports"] }
email_api_client_outbound = { workspace = true, features = ["outbound-outlook"] }
fusionauth = { workspace = true }
microsoft_graph_url = { workspace = true }
email_types = { workspace = true }
