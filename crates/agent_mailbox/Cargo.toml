[package]
edition = "2024"
name = "agent_mailbox"
publish = false
version = "0.1.0"

[features]
default = []
outbound = [
  "dep:http",
  "dep:macro_service_urls",
  "dep:macro_tower_layers",
  "dep:reqwest",
  "dep:serde",
  "dep:sqlx",
]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
email_validator = { path = "../email_validator" }
http = { workspace = true, optional = true }
macro_service_urls = { path = "../macro_service_urls", optional = true }
macro_tower_layers = { path = "../macro_tower_layers", optional = true }
macro_user_id = { path = "../macro_user_id" }
reqwest = { workspace = true, optional = true }
rootcause = { workspace = true }
serde = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zeroize = { workspace = true }

[dev-dependencies]
agent_mailbox = { path = ".", features = ["outbound"] }
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }

# The crate depends on itself in tests to turn on `outbound`, which shear reads as unused.
[package.metadata.cargo-shear]
ignored = ["agent_mailbox"]
