[package]
edition = "2024"
name = "team_agents"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "hosted_runtimes/schema",
  "entity_access/axum",
  "entity_access/inbound",
  "dep:tokio",
]
outbound = [
  "agent_git/client",
  "dep:macro_service_urls",
  "dep:model-entity",
  "dep:model_notifications",
  "dep:notification",
  "dep:sqlx",
  "dep:teams",
  "dep:user_api_key",
  "dep:email_service_client",
  "dep:tokio",
]

[dependencies]
agent_credentials = { path = "../agent_credentials" }
agent_git = { path = "../agent_git", default-features = false }
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
email_service_client = { path = "../email_service_client", optional = true }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
feature_flags = { path = "../feature_flags" }
futures = { workspace = true }
harness_id = { path = "../harness_id" }
hosted_runtimes = { path = "../hosted_runtimes", default-features = false, features = ["ports"] }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_service_urls = { path = "../macro_service_urls", optional = true }
macro_user_id = { path = "../macro_user_id" }
model-entity = { path = "../model-entity", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
model_notifications = { path = "../model_notifications", optional = true }
notification = { path = "../notification", optional = true, default-features = false }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
teams = { path = "../teams", optional = true, default-features = false, features = ["ports"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "time"] }
tracing = { workspace = true }
user_api_key = { path = "../user_api_key", optional = true, features = ["ports"] }
utoipa = { workspace = true, optional = true, features = ["chrono", "uuid"] }
uuid = { workspace = true, features = ["serde", "v7"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
model_user = { path = "../model_user" }
bot_id = { path = "../bot_id" }
team_agents = { path = ".", features = ["inbound"] }
tower = { workspace = true }
axum = { workspace = true }
harness_id = { path = "../harness_id", features = ["test-utils"] }
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
user_api_key = { path = "../user_api_key", features = ["postgres"] }
wiremock = { workspace = true }

# The crate depends on itself in tests to turn on `inbound`, which shear reads as unused.
[package.metadata.cargo-shear]
ignored = ["team_agents"]
