[package]
edition = "2024"
name = "projects"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
  "ports",
]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/axum",
]
default = ["axum", "inbound", "outbound", "ports", "service"]
inbound = ["axum", "ports"]
outbound = [
  "dep:async-recursion",
  "dep:aws-sdk-s3",
  "dep:base64",
  "dep:document_sub_type",
  "dep:documents",
  "dep:dynamodb_client",
  "dep:entity_access_db_utils",
  "dep:hex",
  "dep:macro_sha_count_client",
  "dep:share_permission_db_utils",
  "dep:sqlx",
  "dep:sqs_client",
  "dep:system_properties",
  "ports",
]
ports = ["dep:tokio"]
service = ["dep:entity_access_management", "ports"]

[dependencies]
activity = { path = "../activity", default-features = false }
# Core
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }

# Domain models (always included)
bot_id = { path = "../bot_id" }
entity_access = { path = "../entity_access" }
entity_access_management = { path = "../entity_access_management", default-features = false, features = [
  "outbound",
  "ports",
], optional = true }
macro_aws_config = { path = "../macro_aws_config", features = ["s3"] }
macro_env_var = { path = "../macro_env_var" }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
macro_event_topics = { path = "../macro_event_topics" }
entity_mutation = { path = "../entity_mutation" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
model = { path = "../model" }
model-entity = { path = "../model-entity" }
models_bulk_upload = { path = "../models_bulk_upload" }
models_permissions = { path = "../models_permissions" }
rootcause = { workspace = true }
s3_key = { path = "../s3_key" }

# Async runtime (for ports)
tokio = { workspace = true, optional = true }

# AI toolset dependencies
ai_toolset = { path = "../ai_toolset", optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Axum dependencies
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = [
  "axum",
] }
model-error-response = { path = "../model-error-response", optional = true }
utoipa = { workspace = true, optional = true }

# Outbound dependencies
async-recursion = { version = "1.1.1", optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
document_sub_type = { path = "../document_sub_type", optional = true }
documents = { path = "../documents", default-features = false, optional = true }
dynamodb_client = { path = "../dynamodb_client", optional = true }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
hex = { workspace = true, optional = true }
macro_sha_count_client = { path = "../macro_sha_count_client", optional = true }
share_permission_db_utils = { path = "../share_permission_db_utils", optional = true }
sqlx = { workspace = true, optional = true }
sqs_client = { path = "../sqs_client", default-features = false, features = [
  "document",
], optional = true }
system_properties = { path = "../system_properties", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
aws-sdk-sqs = { workspace = true }
dotenvy = { workspace = true }
http-body-util = { workspace = true }
kafka_util = { path = "../kafka_util" }
macro_db_migrator = { path = "../macro_db_migrator" }
# Examples need the Kafka adapter (outbound); the library itself only uses ports.
macro_event_broker = { path = "../macro_event_broker" }
mockall = { workspace = true }
rdkafka = { workspace = true }
model_user = { path = "../model_user" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
