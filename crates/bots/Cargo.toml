[package]
edition = "2024"
name = "bots"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:entity_access",
  "dep:schemars",
  "entity_access/ports",
  "ports",
]
default = ["inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:channels",
  "dep:entity_access",
  "entity_access/inbound",
  "entity_access/ports",
  "dep:macro_authorization",
  "dep:model-error-response",
  "macro_authorization/axum",
  "dep:serde_json",
  "dep:utoipa",
  "ports",
]
outbound = ["dep:sqlx", "dep:macro_uuid", "ports"]
ports = ["dep:entity_access", "entity_access/ports", "dep:tokio"]
test-utils = ["dep:mockall", "ports"]

[dependencies]
ai_toolset = { path = "../ai_toolset", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id", features = ["schema"] }
bot_token = { path = "../bot_token" }
harness_id = { path = "../harness_id", features = ["schema", "sqlx"] }
channels = { path = "../channels", optional = true, default-features = false, features = ["ports"] }
chrono = { workspace = true }
entity_access = { path = "../entity_access", optional = true, default-features = false }
hex = { workspace = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false }
macro_event_broker = { path = "../macro_event_broker", default-features = false }
mockall = { workspace = true, optional = true }
macro_event_topics = { path = "../macro_event_topics" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
rand = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
entity_access = { path = "../entity_access", default-features = false, features = [
  "outbound",
  "ports",
] }
macro_db_migrator = { path = "../macro_db_migrator" }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
