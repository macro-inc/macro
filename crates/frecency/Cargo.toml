[package]
edition = "2024"
name = "frecency"
publish = false
version = "0.1.0"

# Facade over frecency_core, frecency_inbound and frecency_outbound; see
# src/lib.rs. Depend on the layer crate you need instead.
[features]
inbound = ["dep:frecency_inbound", "ports"]
mock = ["frecency_core/mock", "frecency_outbound?/mock"]
outbound = ["dep:frecency_outbound", "ports"]
ports = ["frecency_core/ports"]
postgres = ["frecency_outbound/postgres", "outbound"]

[dependencies]
frecency_core = { path = "../entities/frecency_core" }
frecency_inbound = { path = "../entities/frecency_inbound", optional = true }
frecency_outbound = { path = "../entities/frecency_outbound", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
