[package]
edition = "2024"
name = "frecency"
publish = false
version = "0.1.0"

[features]
inbound = ["dep:frecency_inbound", "ports"]
mock = ["frecency_core/mock", "frecency_outbound?/mock"]
outbound = ["dep:frecency_outbound", "ports"]
ports = ["frecency_core/ports"]
postgres = ["frecency_outbound/postgres", "outbound"]


[dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }
frecency_core = { workspace = true }
frecency_inbound = { workspace = true, optional = true }
frecency_outbound = { workspace = true, optional = true }

