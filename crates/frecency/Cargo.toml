[package]
edition = "2024"
name = "frecency"
publish = false
version = "0.1.0"

[features]
inbound = ["ports"]
mock = ["dep:mockall"]
outbound = ["ports"]
ports = ["dep:tokio", "dep:tracing"]
postgres = ["dep:recursion", "dep:serde_json", "dep:sqlx", "outbound"]


[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
cowlike = { workspace = true }
filter_ast = { workspace = true }
item_filters = { workspace = true, default-features = true }
macro_user_id = { workspace = true }
mockall = { workspace = true, optional = true }
model_entity = { workspace = true }
num-traits = { version = "0.2" }
ordered-float = { workspace = true }
recursion = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
tracing = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
cool_asserts = "2"
item_filters = { workspace = true, default-features = true, features = ["mock"] }
macro_db_migrator = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
