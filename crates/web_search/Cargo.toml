[package]
name = "web_search"
version = "0.1.0"
edition = "2024"
publish = false

[features]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_authorization",
  "dep:rate_limit",
  "dep:rootcause",
]

[dependencies]
ai_billing = { path = "../ai_billing" }
ai_toolset = { path = "../ai_toolset" }
ai_usage = { path = "../ai_usage" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
chrono.workspace = true
macro_authorization = { path = "../macro_authorization", default-features = false, features = [
  "axum",
], optional = true }
macro_env_var = { path = "../macro_env_var" }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
rate_limit = { path = "../rate_limit", default-features = false, features = [
  "axum",
], optional = true }
reqwest.workspace = true
rootcause = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
http-body-util.workspace = true
model_user = { path = "../model_user" }
rate_limit = { path = "../rate_limit", default-features = false, features = [
  "axum",
  "testing",
] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true
