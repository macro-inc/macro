[package]
edition = "2024"
name = "fig_engine_wasm"
publish = false
version = "0.1.0"

# The browser build of `fig_engine`: wasm-pack builds this crate, and its
# cdylib is the only one, so native builds of `fig_engine` link no `.so`.
[lib]
crate-type = ["cdylib"]

[dependencies]
fig_engine = { workspace = true, features = ["bindings"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
