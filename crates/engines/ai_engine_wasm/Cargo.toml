[package]
edition = "2024"
name = "ai_engine_wasm"
publish = false
version = "0.1.0"

# The browser build of `ai_engine`: wasm-pack builds this crate, and its
# cdylib is the only one, so native builds of `ai_engine` link no `.so`.
[lib]
crate-type = ["cdylib"]

[dependencies]
ai_engine = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
