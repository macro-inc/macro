[package]
edition = "2024"
name = "illustrator_engine"
publish = false
version = "0.1.0"

[features]
default = []
# The `ai_render` developer CLI (renders, round trips, and fidelity scoring
# against reference renders).
cli = ["dep:clap"]

[[bin]]
name = "ai_render"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
# The Figma engine supplies the shared design foundation: fonts (the
# registry and glyph outlines), boolean path operations, image decoding,
# and the JPEG encoder.
fig_engine = { workspace = true }
miniz_oxide = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
zune-core = { workspace = true }
zune-jpeg = { workspace = true }

# The wasm-bindgen shell in `wasm`, which only exists on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
