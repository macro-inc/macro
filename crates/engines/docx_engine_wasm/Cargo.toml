[package]
edition = "2024"
name = "docx_engine_wasm"
publish = false
version = "0.1.0"

# The browser build of `docx_engine`: wasm-pack builds this crate, and its
# cdylib is the only one, so native builds of `docx_engine` link no `.so`.
[lib]
crate-type = ["cdylib"]

[dependencies]
docx_engine = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
