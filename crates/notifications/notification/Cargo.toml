[package]
edition = "2024"
name = "notification"
publish = false
version = "0.1.0"


[features]
ai_tool = [
  "dep:ai_toolset",
  "dep:anyhow",
  "dep:async-trait",
  "dep:schemars",
  "notification_state/schema",
]
axum = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:model_error_response",
  "dep:model_user",
  "dep:serde_with",
  "models_pagination/axum",
  "schema",
]
clear_ios_push = []
default = ["kafka"]
docs = ["dep:aquamarine"]
# The Kafka publishers and consumer. Off for crates that only need the
# notification ports, so librdkafka stays out of the self-hosted `macrod`.
kafka = ["dep:kafka_util", "dep:rdkafka", "macro_event_broker/outbound"]
redis-tests = []
schema = ["dep:utoipa", "macro_user_id/schema", "notification_state/schema"]

[dependencies]
ai_toolset = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
aquamarine = { version = "0.6", optional = true }
async-trait = { workspace = true, optional = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sns = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true, optional = true }
broadcast = { workspace = true }
chrono = { workspace = true }
cowlike = { workspace = true }
either = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
itertools = { workspace = true }
kafka_util = { workspace = true, optional = true }
last_online_tracker = { workspace = true }
macro_authorization = { workspace = true, features = [
  "axum",
], optional = true }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
model_entity = { workspace = true }
model_error_response = { workspace = true, optional = true }
model_user = { workspace = true, optional = true }
models_pagination = { workspace = true }
notification_state = { workspace = true, features = ["postgres"] }
opentelemetry = { workspace = true, features = ["trace"] }
rate_limit = { workspace = true }
rdkafka = { workspace = true, optional = true }
redis = { workspace = true, features = [
  "aio",
  "tokio-comp",
  "tokio-rustls-comp",
] }
reqwest = { workspace = true }
rootcause = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, optional = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-retry = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
notification_service_url = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-subscriber = { workspace = true }
http-body-util = { workspace = true }
macro_db_migrator = { workspace = true }
rate_limit = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tower = { workspace = true }
wiremock = { workspace = true }
