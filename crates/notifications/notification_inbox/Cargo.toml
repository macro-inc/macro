[package]
edition = "2024"
name = "notification_inbox"
publish = false
version = "0.1.0"

[dependencies]
attention_feed = { workspace = true }
chrono = { workspace = true }
filter_ast = { workspace = true }
item_filters = { workspace = true, default-features = true }
macro_user_id = { workspace = true }
model_entity = { workspace = true }
model_notifications = { workspace = true }
rootcause = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
attention_feed = { workspace = true, features = ["test-utils"] }
notification = { workspace = true, default-features = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
