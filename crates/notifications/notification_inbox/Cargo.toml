[package]
edition = "2024"
name = "notification_inbox"
publish = false
version = "0.1.0"

[features]
default = []
# The connection gateway adapter for clear updates.
outbound = ["dep:connection_gateway_client"]

[dependencies]
attention_feed = { workspace = true }
chrono = { workspace = true }
connection_gateway_client = { workspace = true, optional = true }
filter_ast = { workspace = true }
item_filters = { workspace = true, default-features = true }
macro_user_id = { workspace = true }
entity_kind = { workspace = true }
model_notifications = { workspace = true }
notification = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
attention_feed = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
