[package]
edition = "2024"
name = "agent_feedback"
publish = false
version = "0.1.0"

[features]
default = ["inbound", "outbound"]
# The axum routes serving ratings to the web app and the internal export.
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "dep:macro_tower_layers",
  "entity_access/inbound",
]
# The Postgres adapter.
outbound = ["dep:sqlx"]

[dependencies]
agent_fold = { path = "../folds/agent_fold", default-features = false }
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id" }
cached = { workspace = true }
chrono = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
feature_flags = { path = "../feature_flags" }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"], optional = true }
macro_tower_layers = { path = "../macro_tower_layers", optional = true }
macro_user_id = { path = "../macro_user_id" }
mention_utils = { path = "../mention_utils" }
messages = { path = "../messages", default-features = false, features = ["ports", "schema"] }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
async-trait = { workspace = true }
bot_id = { path = "../bot_id", features = ["test-utils"] }
channel_sender = { path = "../channel_sender" }
macro_authorization = { path = "../macro_authorization", features = ["axum"] }
macro_db_migrator = { path = "../macro_db_migrator" }
model_user = { path = "../model_user" }
tokio = { workspace = true }
tower = { workspace = true }
