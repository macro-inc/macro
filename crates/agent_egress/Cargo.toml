[package]
edition = "2024"
name = "agent_egress"
publish = false
version = "0.1.0"

[dependencies]
uuid = { workspace = true }
# The session scope a code-mode credential signs beside its correlation.
agent_correlation = { path = "../agent_correlation" }
# `AgentSessionId` only. `default-features = false` drops the crate's CLI
# binaries (clap, tokio), which the vocabulary does not need.
agent_fold = { path = "../folds/agent_fold", default-features = false }
ai_toolset = { path = "../ai_toolset" }
async-trait = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
agent_session = { path = "../agent_session" }
axum = { workspace = true }
# `headers`' typed `Authorization`, which owns the Bearer/Basic parsing the
# session-token extraction would otherwise hand-roll.
axum-extra = { workspace = true, features = ["typed-header"] }
base64 = { workspace = true }
# The session's agent, signed into Macro's own MCP credential.
bot_id = { path = "../bot_id" }
bytes = { workspace = true }
# Holding a tool call for the owner: the stream it answers with.
futures = { workspace = true }
chrono = { workspace = true }
# The installation records that say whose installation an installation is, and
# the team memberships that decide whether the session's owner is one of them.
github = { path = "../github", default-features = false, features = [
  "outbound",
  "ports",
  "sync",
] }
http = { workspace = true }
httpdate = { workspace = true }
# Wrapping upstream event-stream bodies so their lifetime and volume get logged.
http-body = { workspace = true }
http-body-util = { workspace = true }
lru = { workspace = true }
# Signing Macro API tokens, with the same shared vocabulary
# `authentication_service` mints through.
macro_auth = { path = "../macro_auth" }
# The owner's `User` row, which carries the FusionAuth id the exchange needs.
macro_db_client = { path = "../macro_db_client" }
macro_tower_layers = { path = "../macro_tower_layers" }
macro_user_id = { path = "../macro_user_id" }
# The connection services that decide what a session may reach, and the
# address-guarded HTTP client for upstream MCP servers.
connectors = { path = "../connectors" }
# The MCP client identity the actor transport handshakes with.
mcp_toolset = { path = "../mcp_toolset" }
macro_uuid = { path = "../macro_uuid" }
model_owner = { path = "../model_owner" }
rand = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
sse-stream = { workspace = true }
thiserror = { workspace = true }
# The hold's keepalive timer, and the channel its stream is fed through.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
url = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bot_id = { path = "../bot_id", features = ["test-utils"] }
# The real connection services over in-memory sources.
connectors = { path = "../connectors", features = ["test-fakes"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
