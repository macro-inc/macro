[package]
edition = "2024"
name = "agent_egress"
publish = false
version = "0.1.0"

[dependencies]
uuid = { workspace = true }
# `AgentSessionId` only. `default-features = false` drops the crate's CLI
# binaries (clap, tokio), which the vocabulary does not need.
agent_fold = { workspace = true }
ai_toolset = { workspace = true }
async-trait = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
agent_runtime_protocol = { workspace = true, default-features = true }
agent_session = { workspace = true, default-features = true }
axum = { workspace = true }
# `headers`' typed `Authorization`, which owns the Bearer/Basic parsing the
# session-token extraction would otherwise hand-roll.
axum-extra = { workspace = true, features = ["typed-header"] }
base64 = { workspace = true }
# The session's agent, signed into Macro's own MCP credential.
bot_id = { workspace = true }
bytes = { workspace = true }
# Holding a tool call for the owner: the stream it answers with.
futures = { workspace = true }
chrono = { workspace = true }
# The installation records that say whose installation an installation is, and
# the team memberships that decide whether the session's owner is one of them.
github = { workspace = true, features = [
  "outbound",
  "ports",
  "sync",
] }
http = { workspace = true }
# Wrapping upstream event-stream bodies so their lifetime and volume get logged.
http-body = { workspace = true }
http-body-util = { workspace = true }
lru = { workspace = true }
# Signing Macro API tokens, with the same shared vocabulary
# `authentication_service` mints through.
macro_auth = { workspace = true }
# The owner's `User` row, which carries the FusionAuth id the exchange needs.
macro_db_client = { workspace = true, default-features = true }
macro_tower_layers = { workspace = true }
macro_user_id = { workspace = true }
# The rows holding the owner's custom (URL-added) MCP servers and their
# encrypted grants, and the refresh that keeps a grant live. Port and domain
# service only; the Postgres adapter is the composition root's to build.
mcp_client = { workspace = true }
macro_uuid = { workspace = true }
model_owner = { workspace = true }
# The rows saying which apps an owner connected, and the client that turns one
# into Pipedream's MCP endpoint plus the headers scoping a call to it.
pipedream_mcp = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
sse-stream = { workspace = true }
thiserror = { workspace = true }
# The hold's keepalive timer, and the channel its stream is fed through.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
url = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
anyhow = { workspace = true }
bot_id = { workspace = true, features = ["test-utils"] }
futures = { workspace = true }
# Building the stored OAuth grants the custom-server resolver reads.
rmcp = { workspace = true, features = ["auth"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }
