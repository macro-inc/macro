[package]
edition = "2024"
name = "webhook"
publish = false
version = "0.1.0"

[features]
consumer = [
  "dep:kafka_util",
  "dep:rdkafka",
  "dep:tokio",
  "dep:tokio-retry",
  "ingestion",
  "macro_event_broker/outbound",
]
default = ["consumer", "inbound", "outbound", "ports", "stream"]
inbound = [
  "dep:axum",
  "dep:axum-extra",
  "dep:channels",
  "dep:documents",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:model_user",
  "dep:rate_limit",
  "dep:serde_json",
  "dep:utoipa",
  "agent_session/schema",
  "call/inbound",
  "channels/schema",
  "documents/schema",
  "messages/schema",
  "ports",
  "rate_limit/axum",
]
ingestion = [
  "dep:agent_session",
  "dep:agent_trigger",
  "dep:channels",
  "dep:call",
  "dep:documents",
  "dep:entity_access",
  "dep:futures",
  "dep:uuid",
  "ports",
]
outbound = [
  "dep:webhook_signature",
  "dep:macro_uuid",
  "dep:reqwest",
  "dep:sqlx",
  "dep:sqs_client",
  "dep:tokio",
  "dep:url",
  "ports",
]
ports = ["dep:serde_json", "dep:url"]
stream = [
  "dep:futures",
  "dep:kafka_util",
  "dep:tokio",
  "dep:uuid",
  "ingestion",
  "inbound",
  "macro_event_broker/outbound",
]
worker = ["dep:tokio", "ports"]

[dependencies]
messages = { workspace = true, features = ["broker"] }
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
agent_session = { workspace = true, optional = true }
agent_trigger = { workspace = true, optional = true }
call = { workspace = true, optional = true }
channels = { workspace = true, optional = true }
chrono = { workspace = true }
documents = { workspace = true, optional = true }
model_owner = { workspace = true }
entity_access = { workspace = true, features = [
  "ports",
], optional = true }
futures = { workspace = true, optional = true }
kafka_util = { workspace = true, optional = true }
macro_authorization = { workspace = true, optional = true, features = [
  "axum",
] }
macro_event_broker = { workspace = true }
macro_event_topics = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true, optional = true }
model-error-response = { workspace = true, optional = true }
model_user = { workspace = true, optional = true }
rate_limit = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
webhook_signature = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sqs_client = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"], optional = true }
tokio-retry = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent_fold = { workspace = true, default-features = true }
agent_runtime_protocol = { workspace = true }
agent_session = { workspace = true, features = [
  "test-utils",
] }
bot_id = { workspace = true, features = ["test-utils"] }
channel_sender = { workspace = true }
trigger_context = { workspace = true }
macro_db_migrator = { workspace = true }
messages = { workspace = true }
rate_limit = { workspace = true, features = [
  "axum",
  "testing",
] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
