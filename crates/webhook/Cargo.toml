[package]
edition = "2024"
name = "webhook"
publish = false
version = "0.1.0"

[features]
consumer = [
  "dep:macro_env",
  "dep:macro_event_topics",
  "dep:rdkafka",
  "dep:tokio",
  "ingestion",
  "macro_event_broker/outbound",
]
default = ["consumer", "inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:axum-extra",
  "dep:model-error-response",
  "dep:model_user",
  "dep:rate_limit",
  "rate_limit/axum",
  "dep:serde_json",
  "dep:utoipa",
  "ports",
]
ingestion = [
  "dep:channels",
  "dep:documents",
  "dep:entity_access",
  "dep:futures",
  "dep:macro_event_broker",
  "dep:uuid",
  "ports",
]
outbound = [
  "dep:hex",
  "dep:hmac",
  "dep:reqwest",
  "dep:sha2",
  "dep:macro_uuid",
  "dep:sqlx",
  "dep:sqs_client",
  "dep:tokio",
  "dep:url",
  "ports",
]
ports = ["dep:serde_json", "dep:url"]
worker = ["dep:tokio", "ports"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
channels = { path = "../channels", default-features = false, optional = true }
chrono = { workspace = true }
documents = { path = "../documents", default-features = false, optional = true }
entity_access = { path = "../entity_access", default-features = false, features = [
  "ports",
], optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
macro_env = { path = "../macro_env", optional = true }
macro_event_broker = { path = "../macro_event_broker", default-features = false, optional = true }
macro_event_topics = { path = "../macro_event_topics", optional = true }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
model_user = { path = "../model_user", optional = true, features = ["axum"] }
rate_limit = { path = "../rate_limit", optional = true, default-features = false }
rdkafka = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sqs_client = { path = "../sqs_client", default-features = false, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"], optional = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
channel_sender = { path = "../channel_sender" }
tokio = { workspace = true, features = ["test-util"] }
macro_db_migrator = { path = "../macro_db_migrator" }
rate_limit = { path = "../rate_limit", default-features = false, features = [
  "axum",
  "testing",
] }
rootcause = { workspace = true }
tower = { workspace = true }
