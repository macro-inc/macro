[package]
edition = "2024"
name = "notification_sandbox"
publish = false
version = "0.1.0"

[dependencies]
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sns = { workspace = true }
email_formatting = { workspace = true }
hmac = { workspace = true }
inquire = { workspace = true }
macro_aws_config = { workspace = true }
macro_env = { workspace = true }
macro_user_id = { workspace = true }
entity_kind = { workspace = true }
model_notifications = { workspace = true }
pagination_types = { workspace = true }
notification = { workspace = true, default-features = true }
notification_outbound = { workspace = true }
rate_limit = { workspace = true, features = ["testing"] }
redis = { workspace = true, features = [
  "aio",
  "tokio-comp",
  "tokio-rustls-comp",
] }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
