<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email backend coverage</title>
<style>
:root { color-scheme: light dark; --line: #8884; --good: #1a7f37; --part: #9a6700; --bad: #cf222e; --mute: #6e7781; }
body { font: 15px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 16px; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; margin-top: 2rem; } h3 { font-size: 1rem; margin-top: 1.5rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; vertical-align: top; }
tr > :first-child, table.rows td, table.rows th { text-align: left; }
table.rows td:first-child { min-width: 12rem; }
code { font-size: 0.85em; overflow-wrap: anywhere; }
small { color: var(--mute); display: block; }
td small:first-child { display: inline; }
td.proved b, td.covered b { color: var(--good); } td.claimed b, td.performed b { color: var(--part); } td.open b { color: var(--bad); }
td.na, td.waived b, td.deferred b, td.owned b { color: var(--mute); }
details summary { cursor: pointer; color: var(--mute); font-size: 0.85em; }
details.kind { margin: 0.5rem 0; } details.kind > summary { font-size: 1rem; color: inherit; font-weight: 600; }
</style>
</head>
<body>
<!-- body -->
</body>
</html>
