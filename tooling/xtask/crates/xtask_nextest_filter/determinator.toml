use-default-rules = false

[[path-rule]]
globs = ["static_assets/**"]
mark-changed = [
  "cache-schema",
  "cache-wasm",
  "collab_surface",
  "complete_graph",
  "documents",
  "graphql_calendar",
  "seed_cli",
  "xtask_email_coverage",
  "xtask_graphql_schema_compat",
  "xtask_local",
  "xtask_workflows",
]

# Compiled into code_mode_assets by its build script (and the flake's
# code-mode-assets package), which cargo cannot see.
[[path-rule]]
globs = [
  "bun.lock",
  "packages/code-mode-sdk/**",
  "packages/sdk-docs/**",
  "packages/sdk/**",
]
mark-changed = ["code_mode_assets"]

# The permission registry, which the JS tools catalog code_mode_assets builds
# reads.
[[path-rule]]
globs = ["crates/agent_permission_registry/registry.json"]
mark-changed = ["code_mode_assets"]
