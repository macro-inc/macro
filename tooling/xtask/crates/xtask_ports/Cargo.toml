[package]
description = "Port windows and Docker subnets for local stacks: the layout, the machine-wide registry, and the free checks"
edition = "2024"
name = "xtask_ports"
publish = false
version = "0.1.0"

[dependencies]
# Signal 0 checks whether a registry entry's owner process is still alive.
libc = { workspace = true }
macro_env_var = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# EnumIter derives the port list, whose order is each port's offset.
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
