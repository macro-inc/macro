[package]
description = "Typed GitHub Actions workflow model, vendored from tailcallhq/gh-workflow (see AGENTS.md)"
edition = "2021"
license = "Apache-2.0"
name = "gh_workflow"
publish = false
version = "0.8.1"

[dependencies]
derive_more = { workspace = true }
derive_setters = { workspace = true }
gh_workflow_macros = { path = "../gh_workflow_macros" }
indexmap = { workspace = true, features = ["serde"] }
merge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[[test]]
name = "test-workflow"
path = "tests/test-workflow.rs"
