[package]
description = "xtask workflows: generate/verify the repo's GitHub Actions workflows from Rust"
edition = "2024"
name = "xtask_workflows"
publish = false
version = "0.1.0"

[[bin]]
name = "xtask_workflows"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
# Define GitHub Actions workflows in Rust.
gh-workflow = "0.8"
indoc = { workspace = true }
serde_yaml = { workspace = true }
xtask_paths = { path = "../xtask_paths" }
