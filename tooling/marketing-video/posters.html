<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro posters</title>
<!--
  Static poster ads in a different format from "X wasn't built like Macro": a centered serif headline with
  one highlighted phrase, a short line under it, one hero image and a pill CTA. `raise` and `raise-dotcom`
  are announcement cards. The hero images are frames of the blocks v3 ads (img/posters/).
    ?c=price|replace|call|raise|raise-dotcom   &mode=light|dark   &fmt=45|916|11
  Render a PNG with: PAGE=posters.html FMT=45 QS="&c=price&mode=dark" node render.mjs stills <dir> 0
  Headlines never run past two lines (fit() steps the size down), and in 9:16 everything stays inside the
  middle ~800 px, because tall phones crop the sides of a 9:16 story.
-->
<style>
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root {
  --page: #f2f2eb; --ink: #1a1917; --body: #4a4844; --lab: #77756f; --card: #fff; --rule: #ecebe6;
  --hl: #e8b13a66; --hl-ink: var(--ink); --cta: #1a1917; --cta-ink: #f5f4ef; --panel: #0e0e0e;
  /* the web app's composer-shadow (light), as on the blocks */
  --card-sh: 0 0 0 1px rgba(11, 11, 11, .04), 0 2px 8px rgba(11, 11, 11, .04), 0 4px 80px 8px rgba(11, 11, 11, .024);
}
/* dark: the app's dark page (the blocks v3 dark frames sit on it), its desktop glass on the card */
html.dark {
  --page: #0d0d0d; --ink: #f2f1ec; --body: #a9a7a1; --lab: #85837e; --card: #171717; --rule: rgba(255, 255, 255, .07);
  --hl: #e8b13a; --hl-ink: #141312; --cta: #f2f1ec; --cta-ink: #141312; --panel: #0d0d0d;
  --card-sh: 0 0 0 .6px rgba(0, 0, 0, .24), inset 0 .6px 0 rgba(255, 255, 255, .072), inset 0 0 0 .6px rgba(255, 255, 255, .048),
    0 2px 6px -3px rgba(0, 0, 0, .12), 0 1px 2px -1px rgba(0, 0, 0, .08);
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--page); }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; }
/* only the hero flexes: everything else keeps its size, so a big hero can never squeeze the CTA */
#stage > * { flex: none; }
.logo { height: 34px; display: block; }
html.dark .logo { filter: invert(1) brightness(.95); }
h1 { font-family: "display"; font-weight: 400; text-align: center; text-wrap: balance; letter-spacing: -0.01em; color: var(--ink); }
h1 .hl { background: linear-gradient(transparent 8%, var(--hl) 8%, var(--hl) 92%, transparent 92%); color: var(--hl-ink);
  padding: 0 .08em; margin: 0 -.04em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sub { text-align: center; color: var(--body); font-size: 30px; line-height: 1.4; text-wrap: balance; }
#stage > .hero { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.hero img { max-width: 100%; max-height: 100%; display: block;
  /* a soft edge so the frame's table melts into the page; the frames are cropped clear of every card */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent), linear-gradient(transparent, #000 4%, #000 96%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent), linear-gradient(transparent, #000 4%, #000 96%, transparent); mask-composite: intersect; }
.cta { display: inline-flex; align-items: center; gap: 12px; height: 84px; padding: 0 44px; border-radius: 42px; background: var(--cta); color: var(--cta-ink); font-size: 32px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; }
.cta svg { width: 28px; height: 28px; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
.total .k { font-size: 18px; font-weight: 600; letter-spacing: .12em; color: var(--lab); }
.total .v { font-family: "display"; font-size: 56px; color: var(--ink); }
.foot { font-size: 18px; color: var(--lab); text-align: center; }
/* the announcement card */
.news { background: var(--card); border-radius: 40px; box-shadow: var(--card-sh); overflow: hidden; display: flex; flex-direction: column; }
.news .bar { display: flex; align-items: center; justify-content: space-between; height: 108px; padding: 0 48px; border-bottom: 1px solid var(--rule); }
.news .bar .tag { font-size: 22px; font-weight: 600; letter-spacing: .14em; color: var(--lab); }
.news h1 { font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; padding: 48px 52px 40px; }
.news .panel { margin: 0 44px 44px; border-radius: 24px; background: var(--panel); display: flex; align-items: center; justify-content: center; overflow: hidden; }
html.dark .news .panel { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.news .panel img { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const FMT = Q.get("fmt") || "45", C = Q.get("c") || "price", DARK = Q.get("mode") === "dark";
if (DARK) document.documentElement.classList.add("dark");
// each format is laid out on a 1080-wide canvas; 1x1 is drawn at 1080 and scaled to 1440
const H = { "45": 1350, "916": 1920, "11": 1080 }[FMT];
const SCALE = FMT === "11" ? 1440 / 1080 : 1;
const ARROW = `<svg viewBox="0 0 256 256" fill="currentColor"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32Z"/></svg>`;
const CTA = `<div class="cta">Get started at macro.com${ARROW}</div>`;
const LOGO = `<img class="logo" src="img/macro-logo.svg" alt="Macro">`;
const img = (light, dark) => `<img src="img/posters/${DARK ? dark : light}.webp" alt="">`;

// [headline html, sub line, hero html, extra html under the hero]
const POSTERS = {
  price: ["Four apps cost <span class=\"hl\">$84 a seat.</span> Macro is $40.",
    "Notion, Slack, Linear and Superhuman, against one workspace with every module included.",
    img("price", "price-dark"),
    `<div class="total"><span class="k">PER SEAT, PER MONTH</span><span class="v">$84</span></div><div class="foot" style="margin-top:6px">Business plans, billed annually. List prices checked September 2026.</div>`],
  replace: ["<span class=\"hl\">27+ apps,</span> replaced by a single system.",
    "Email, chat, docs, tasks, calls, CRM and agents in one workspace, for $40 a seat.",
    img("grid", "grid-dark"), ""],
  call: ["<span class=\"hl\">One call</span> updates your CRM, tasks and calendar.",
    "Then an agent drafts the follow-up.",
    img("call", "call-dark"), ""],
};
// the news cards: Macro's own announcement, with the module grid on the app's dark page
const NEWS = { raise: "Macro raises $30M led&nbsp;by&nbsp;a16z", "raise-dotcom": "macro.com raises $30M led&nbsp;by&nbsp;a16z" };

const S = document.getElementById("stage");
S.style.height = H + "px";
S.style.transform = `scale(${SCALE})`;
// per format: vertical rhythm (top pad, logo→headline, headline size, headline→sub, sub→hero, hero→cta, cta→bottom)
// and the column widths (headline, sub, hero); 9:16 keeps all of it inside the middle ~800 px. The gaps are kept
// tight so the hero gets every spare pixel; in 9:16 the CTA ends at about 75% of the height, above the Stories
// reply bar and Sign up sticker
const R = {
  "45": { top: 60, gH: 46, hs: 76, gS: 22, gHero: 22, gCta: 26, bot: 54, hw: 940, sw: 860, xw: 1080, nw: 900, nh: 74, panel: 520, ss: 30 },
  "916": { top: 276, gH: 44, hs: 78, gS: 20, gHero: 28, gCta: 30, bot: 470, hw: 800, sw: 760, xw: 800, nw: 820, nh: 70, panel: 600, ss: 29 },
  "11": { top: 48, gH: 36, hs: 62, gS: 16, gHero: 14, gCta: 18, bot: 44, hw: 900, sw: 860, xw: 1080, nw: 900, nh: 60, panel: 360, ss: 26 },
}[FMT];

if (NEWS[C]) {
  S.innerHTML = `
    <div style="height:${R.top + (FMT === "916" ? 0 : 10)}px;flex:none"></div>
    <div class="news" style="width:${R.nw}px">
      <div class="bar">${LOGO}<span class="tag">NEWS</span></div>
      <h1 style="font-size:${R.nh}px">${NEWS[C]}</h1>
      <div class="panel" style="height:${R.panel}px"><img src="img/posters/grid-dark.webp" style="height:${R.panel - 40}px" alt=""></div>
    </div>
    <div style="height:${R.gCta + 14}px;flex:none"></div>${CTA}
    <div style="flex:1"></div>`;
} else {
  const [hd, sub, hero, extra] = POSTERS[C];
  S.innerHTML = `
    <div style="height:${R.top}px;flex:none"></div>${LOGO}
    <div style="height:${R.gH}px;flex:none"></div>
    <h1 style="font-size:${R.hs}px;line-height:1.12;max-width:${R.hw}px">${hd}</h1>
    <div style="height:${R.gS}px;flex:none"></div><div class="sub" style="font-size:${R.ss}px;max-width:${R.sw}px">${sub}</div>
    <div style="height:${R.gHero}px;flex:none"></div>
    <div class="hero" style="width:${R.xw}px;max-width:${R.xw}px">${hero}</div>
    ${extra ? `<div style="flex:none;display:flex;flex-direction:column;align-items:center;max-width:${R.sw}px">${extra}</div>` : ""}
    <div style="height:${R.gCta}px;flex:none"></div>${CTA}
    <div style="height:${R.bot}px;flex:none"></div>`;
}

// at most `lines` lines: step the font size down until the block fits (layout px, so the 1x1 scale doesn't matter)
function fit(el, lines, min) {
  if (!el) return;
  const lh = parseFloat(getComputedStyle(el).lineHeight) / parseFloat(getComputedStyle(el).fontSize);
  let fs = parseFloat(getComputedStyle(el).fontSize);
  const pad = parseFloat(getComputedStyle(el).paddingTop) + parseFloat(getComputedStyle(el).paddingBottom);
  while (el.offsetHeight - pad > fs * lh * lines + 2 && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; }
}

// render.mjs contract: a still page, so time does nothing
window.DURATION = 0; window.CUES = []; window.B = (b) => b * 0.6; window.seek = () => {};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => {
  fit(document.querySelector("h1"), 2, 40);
  fit(document.querySelector(".sub"), 2, 22);
  // the price total lines up with the cards, whatever size the hero lands at
  const im = document.querySelector(".hero img"), total = document.querySelector(".total");
  if (im && total) total.style.width = (0.93 * im.offsetWidth) + "px";
});
</script>
</body>
</html>
