<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro posters</title>
<!--
  Static poster ads in a different format from "X wasn't built like Macro": a centered serif headline with
  one highlighted phrase, a short line under it, one hero image and a pill CTA. `raise` and `raise-dotcom`
  are announcement cards. The hero images are frames of the blocks v3 ads (img/posters/).
  `orbs3`, `orbs12` and `orbs-price` draw macro.com's homepage hero (the tool orbs around Macro) and run on the
  site's cream; the `eng-*` posters are for engineers: the PR split from ui.html, and code cards in Geist Mono.
    ?c=price|replace|call|raise|raise-dotcom|orbs3|orbs12|orbs-price|eng-pr|eng-mcp|eng-oss   &mode=light|dark   &fmt=45|916|11
  Render a PNG with: PAGE=posters.html FMT=45 QS="&c=price&mode=dark" node render.mjs stills <dir> 0
  Headlines never run past two lines (fit() steps the size down), and in 9:16 everything stays inside the
  middle ~800 px, because tall phones crop the sides of a 9:16 story.
-->
<style>
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root {
  --page: #f2f2eb; --ink: #1a1917; --body: #4a4844; --lab: #77756f; --card: #fff; --rule: #ecebe6;
  --hl: #e8b13a66; --hl-ink: var(--ink); --cta: #1a1917; --cta-ink: #f5f4ef; --panel: #0e0e0e;
  /* the web app's composer-shadow (light), as on the blocks */
  --card-sh: 0 0 0 1px rgba(11, 11, 11, .04), 0 2px 8px rgba(11, 11, 11, .04), 0 4px 80px 8px rgba(11, 11, 11, .024);
}
/* dark: the app's dark page (the blocks v3 dark frames sit on it), its desktop glass on the card */
html.dark {
  --page: #0d0d0d; --ink: #f2f1ec; --body: #a9a7a1; --lab: #85837e; --card: #171717; --rule: rgba(255, 255, 255, .07);
  --hl: #e8b13a; --hl-ink: #141312; --cta: #f2f1ec; --cta-ink: #141312; --panel: #0d0d0d;
  --card-sh: 0 0 0 .6px rgba(0, 0, 0, .24), inset 0 .6px 0 rgba(255, 255, 255, .072), inset 0 0 0 .6px rgba(255, 255, 255, .048),
    0 2px 6px -3px rgba(0, 0, 0, .12), 0 1px 2px -1px rgba(0, 0, 0, .08);
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--page); }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; }
/* only the hero flexes: everything else keeps its size, so a big hero can never squeeze the CTA */
#stage > * { flex: none; }
.logo { height: 34px; display: block; }
html.dark .logo { filter: invert(1) brightness(.95); }
h1 { font-family: "display"; font-weight: 400; text-align: center; text-wrap: balance; letter-spacing: -0.01em; color: var(--ink); }
h1 .hl { background: linear-gradient(transparent 8%, var(--hl) 8%, var(--hl) 92%, transparent 92%); color: var(--hl-ink);
  padding: 0 .08em; margin: 0 -.04em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sub { text-align: center; color: var(--body); font-size: 30px; line-height: 1.4; text-wrap: balance; }
#stage > .hero { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.hero img { max-width: 100%; max-height: 100%; display: block;
  /* a soft edge so the frame's table melts into the page; the frames are cropped clear of every card */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent), linear-gradient(transparent, #000 4%, #000 96%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent), linear-gradient(transparent, #000 4%, #000 96%, transparent); mask-composite: intersect; }
.cta { display: inline-flex; align-items: center; gap: 12px; height: 84px; padding: 0 44px; border-radius: 42px; background: var(--cta); color: var(--cta-ink); font-size: 32px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; }
.cta svg { width: 28px; height: 28px; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
.total .k { font-size: 18px; font-weight: 600; letter-spacing: .12em; color: var(--lab); }
.total .v { font-family: "display"; font-size: 56px; color: var(--ink); }
.foot { font-size: 18px; color: var(--lab); text-align: center; }
/* the announcement card */
.news { background: var(--card); border-radius: 40px; box-shadow: var(--card-sh); overflow: hidden; display: flex; flex-direction: column; }
.news .bar { display: flex; align-items: center; justify-content: space-between; height: 108px; padding: 0 48px; border-bottom: 1px solid var(--rule); }
.news .bar .tag { font-size: 22px; font-weight: 600; letter-spacing: .14em; color: var(--lab); }
.news h1 { font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; padding: 48px 52px 40px; }
.news .panel { margin: 0 44px 44px; border-radius: 24px; background: var(--panel); display: flex; align-items: center; justify-content: center; overflow: hidden; }
html.dark .news .panel { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.news .panel img { display: block; }
/* macro.com's cream (apps/marketing cream-preview.css), for the orb and engineer posters in light mode */
html.cream { --page: #f5f1e8; --ink: #1d1c1a; --body: #54524f; --lab: #72706c; --card: #fcfbf8; --rule: #e6e1d7; --cta: #1d1c1a; --cta-ink: #f5f1e8; }
/* a UI still with its own edge (ui.html ?hero=1): no soft mask, and a shadow drawn for this page */
.hero img.flat { -webkit-mask-image: none; mask-image: none; max-width: 95%; filter: drop-shadow(0 28px 44px rgba(29, 28, 26, .2)) drop-shadow(0 2px 6px rgba(29, 28, 26, .08)); }
html.dark .hero img.flat { filter: drop-shadow(0 28px 60px rgba(0, 0, 0, .6)); }
/* the homepage hero (apps/marketing WelcomeSteps.tsx ContextScene), drawn around a 0×0 point at the hero's center and
   scaled to fit it; --s is that scale, so hairlines stay hairlines */
.orbs { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; --hair: calc(1.4px / var(--s, 1)); }
.orbs > * { position: absolute; left: 0; top: 0; }
.orbs .halo { overflow: visible; fill: none; stroke: var(--ink); stroke-width: calc(1px / var(--s, 1)); }
.orbs .ring { border-radius: 50%; transform: translate(-50%, -50%); border: var(--hair) solid color-mix(in srgb, var(--ink) 7%, transparent); background: color-mix(in srgb, var(--ink) 2%, transparent); }
.orbs .ring.in { border-color: color-mix(in srgb, var(--ink) 12%, transparent); background: color-mix(in srgb, var(--ink) 3%, transparent); }
/* the site's `glass` utility, light palette: a white top edge and rim, a hint of ink below, a soft cast shadow */
.orb { transform: translate(-50%, -50%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink);
  background: color-mix(in srgb, var(--page), var(--ink) 8%);
  --rim: linear-gradient(135deg, rgba(255, 255, 255, .525) 0%, transparent 24%, transparent 76%, rgba(255, 255, 255, .3) 100%);
  --rim-shade: color-mix(in srgb, var(--ink) 7%, transparent);
  box-shadow: inset 0 var(--hair) 0 rgba(255, 255, 255, .55), inset 0 calc(-1 * var(--hair)) 0 color-mix(in srgb, var(--ink) 8%, transparent), 0 11px 26px -18px rgba(0, 0, 0, .28); }
html.dark .orb {
  --rim: linear-gradient(135deg, rgba(212, 212, 212, .135) 0%, transparent 24%, transparent 76%, rgba(212, 212, 212, .09) 100%);
  --rim-shade: transparent;
  box-shadow: inset 0 var(--hair) 0 rgba(212, 212, 212, .06), inset 0 calc(-1 * var(--hair)) 0 rgba(0, 0, 0, .4), 0 11px 26px -18px rgba(0, 0, 0, .55); }
.orb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: var(--hair); background: var(--rim); background-color: var(--rim-shade);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
.orb.macro { background: color-mix(in srgb, var(--page), var(--ink) 12%); }
.orb > span { display: flex; width: 44%; height: 44%; }
.orb.macro > span { width: 50%; height: 50%; }
.orb svg { width: 100%; height: 100%; display: block; }
.orbs .lab { transform: translateX(-50%); font-size: 14px; font-weight: 500; color: var(--body); white-space: nowrap; letter-spacing: -0.005em; }
.orbs .tag { transform: translate(-50%, -50%); padding: 3px 10px; border-radius: 99px; background: var(--card); box-shadow: var(--card-sh); font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.orbs .tag.hl { background: #e8b13a; color: #141312; box-shadow: none; }
/* a code card: the engineer posters' terminal and repo */
.term { flex: none; min-width: 760px; background: var(--card); border-radius: 30px; box-shadow: var(--card-sh); overflow: hidden; }
.term .bar { display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 30px; border-bottom: 1px solid var(--rule); font-size: 24px; font-weight: 500; color: var(--ink); }
.term .bar svg { width: 30px; height: 30px; flex: none; }
.term .bar .r { margin-left: auto; font-size: 17px; font-weight: 600; letter-spacing: .08em; color: var(--lab); padding: 7px 14px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
.term pre { padding: 30px 36px 34px; font: 400 29px/1.6 "mono"; color: var(--ink); white-space: pre; letter-spacing: -0.01em; }
.term .cm { color: var(--lab); }
.term .pr { color: var(--lab); }
.term .ft { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 840px; padding: 0 36px 36px; }
.term .ft .k { font-size: 17px; font-weight: 600; letter-spacing: .08em; color: var(--lab); margin-right: 6px; }
.term .chip { font: 500 21px "mono"; padding: 8px 14px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--body); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="orb-logos.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const FMT = Q.get("fmt") || "45", C = Q.get("c") || "price", DARK = Q.get("mode") === "dark";
if (DARK) document.documentElement.classList.add("dark");
// the orb and engineer posters sit on macro.com's cream in light mode
else if (/^(orbs|eng)/.test(C)) document.documentElement.classList.add("cream");
// each format is laid out on a 1080-wide canvas; 1x1 is drawn at 1080 and scaled to 1440
const H = { "45": 1350, "916": 1920, "11": 1080 }[FMT];
const SCALE = FMT === "11" ? 1440 / 1080 : 1;
const ARROW = `<svg viewBox="0 0 256 256" fill="currentColor"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32Z"/></svg>`;
const CTA = `<div class="cta">Get started at macro.com${ARROW}</div>`;
const LOGO = `<img class="logo" src="img/macro-logo.svg" alt="Macro">`;
const img = (light, dark) => `<img src="img/posters/${DARK ? dark : light}.webp" alt="">`;


// ---- macro.com's homepage hero (apps/marketing WelcomeSteps.tsx ContextScene) ----
// Two rings, 54 faint circles and glass orbs around the Macro orb; positions are % of the site's 448×288 box.
const SITE = [["Linear", 50, 11, 54], ["Google", 82, 39, 48], ["GitHub", 70, 82, 44], ["Notion", 27, 80, 56], ["Slack", 15, 37, 60],
  ["Superhuman", 92, 12, 40], ["Zoom", 9, 72, 36], ["Google Meet", 94, 75, 30], ["Calendly", 31, 9, 32], ["PostHog", 6, 12, 28],
  ["HubSpot", 51, 94, 26], ["Figma", 77, 6, 24]];
const THREE = ["Linear", "Superhuman", "Notion"];
// per seat a month, business plans billed annually (meta-ads docs/claims.md: the $84 row)
const PRICE = { Linear: "$16", Superhuman: "$33", Notion: "$20", Macro: "$40" };
function orb(name, x, y, size, o = {}) {
  return `<div class="orb${name === "Macro" ? " macro" : ""}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px${o.dim ? `;opacity:${o.dim}` : ""}">`
    + `<span style="opacity:${size < 36 ? 0.6 : 1}">${ORB_LOGOS[name]}</span></div>`
    + (o.label ? `<div class="lab" style="left:${x}px;top:${y + size / 2 + 10}px">${o.label}</div>` : "")
    + (o.tag ? `<div class="tag${name === "Macro" ? " hl" : ""}" style="left:${x + size * 0.38}px;top:${y - size * 0.38}px">${o.tag}</div>` : "");
}
// all: the site's constellation, with the three named tools brought forward and the rest stepped back.
// three / price: just those three on the ring, 120° apart, Linear on top; price tags each orb with its seat price.
function orbScene(kind) {
  const rings = Array.from({ length: 54 }, (_, i) => `<circle r="${56 + i * 8}" opacity="${(0.1 * (1 - i / 54) ** 2.6).toFixed(4)}"/>`).join("");
  let h = `<svg class="halo" viewBox="-480 -480 960 960" style="left:-480px;top:-480px;width:960px;height:960px">${rings}</svg>`
    + `<div class="ring" style="width:288px;height:288px"></div><div class="ring in" style="width:176px;height:176px"></div>`;
  if (kind === "all") {
    const grow = { Linear: 64, Superhuman: 54, Notion: 64 };
    for (const [n, px, py, sz] of SITE) {
      const on = THREE.includes(n);
      h += orb(n, px / 100 * 448 - 224, py / 100 * 288 - 144, on ? grow[n] : sz, on ? { label: n } : { dim: 0.4 });
    }
  } else {
    THREE.forEach((n, i) => {
      const a = (-90 - i * 120) * Math.PI / 180;
      h += orb(n, Math.cos(a) * 128, Math.sin(a) * 128, 68, { label: n, tag: kind === "price" ? PRICE[n] : "" });
    });
  }
  h += orb("Macro", 0, 0, 96, { tag: kind === "price" ? PRICE.Macro : "" });
  return `<div class="orbs">${h}</div>`;
}
const GH = ORB_LOGOS.GitHub, MARK = ORB_LOGOS.Macro;
// the engineer posters' code cards; every command is from apps/docs/AI/mcp/overview.mdx or the repo README
const MCP = `<div class="term"><div class="bar">${MARK}Macro MCP server<span class="r">EVERY PLAN</span></div><pre>`
  + `<span class="cm"># Claude Code</span>\n<span class="pr">$</span> claude mcp add --transport http macro \\\n    https://mcp-server.macro.com/mcp\n\n`
  + `<span class="cm"># Codex</span>\n<span class="pr">$</span> codex mcp add macro \\\n    --url https://mcp-server.macro.com/mcp</pre>`
  + `<div class="ft"><span class="k">TOOLS INCLUDE</span>${["ContentSearch", "SendEmail", "CreateCalendarEvent", "SendChannelMessage", "ReadCallRecord", "SetEntityProperty"].map((t) => `<span class="chip">${t}</span>`).join("")}</div></div>`;
const OSS = `<div class="term"><div class="bar">${GH}macro-inc/macro<span class="r">AGPL-3.0</span></div><pre>`
  + `<span class="pr">$</span> git clone https://github.com/macro-inc/macro\n\nmacro/\n`
  + [["apps/web/", "SolidJS client"], ["services/", "services and workers"], ["crates/", "Rust libraries"], ["packages/", "shared TypeScript"], ["infra/", "Pulumi definitions"]]
    .map(([d, c], i, a) => `${i === a.length - 1 ? "└──" : "├──"} ${d.padEnd(11)} <span class="cm">${c}</span>`).join("\n") + `</pre></div>`;
const PRICE_FOOT = `<div class="foot">Business plans, billed annually. List prices checked September 2026.</div>`;

// [headline html, sub line, hero html, extra html under the hero]
const POSTERS = {
  price: ["Four apps cost <span class=\"hl\">$84 a seat.</span> Macro is $40.",
    "Notion, Slack, Linear and Superhuman, against one workspace with every module included.",
    img("price", "price-dark"),
    `<div class="total"><span class="k">PER SEAT, PER MONTH</span><span class="v">$84</span></div><div class="foot" style="margin-top:6px">Business plans, billed annually. List prices checked September 2026.</div>`],
  replace: ["<span class=\"hl\">27+ apps,</span> replaced by a single system.",
    "Email, chat, docs, tasks, calls, CRM and agents in one workspace, for $40 a seat.",
    img("grid", "grid-dark"), ""],
  call: ["<span class=\"hl\">One call</span> updates your CRM, tasks and calendar.",
    "Then an agent drafts the follow-up.",
    img("call", "call-dark"), ""],
  orbs3: ["Replace <span class=\"hl\">Linear, Superhuman and Notion</span> with one tool.",
    "Tasks, email and docs in one workspace, with chat, calls and agents built in.",
    orbScene("three"), ""],
  orbs12: ["Replace <span class=\"hl\">Linear, Superhuman and Notion</span> with one tool.",
    "Tasks, email, docs, chat and calls in one workspace, for $40 a seat.",
    orbScene("all"), ""],
  "orbs-price": ["Linear, Superhuman and Notion cost <span class=\"hl\">$69 a seat.</span> Macro is $40.",
    "Tasks, email and docs in one workspace, with every module included.",
    orbScene("price"), PRICE_FOOT],
  "eng-pr": ["Your PRs, <span class=\"hl\">right in chat.</span>",
    "Paste a GitHub link to see its status, changes and reviews, and merge it without leaving the chat.",
    `<img class="flat" src="img/posters/pr-split-${FMT}.webp" alt="">`, ""],
  "eng-mcp": ["Give your agents <span class=\"hl\">your whole workspace.</span>",
    "Claude Code, Codex and Cursor connect to Macro over MCP, on every plan including Free.",
    MCP, ""],
  "eng-oss": ["<span class=\"hl\">Open source.</span> Built in Rust.",
    "A Rust backend and a SolidJS app, open source under AGPLv3. Read every line or self-host it.",
    OSS, ""],
};
// the news cards: Macro's own announcement, with the module grid on the app's dark page
const NEWS = { raise: "Macro raises $30M led&nbsp;by&nbsp;a16z", "raise-dotcom": "macro.com raises $30M led&nbsp;by&nbsp;a16z" };

const S = document.getElementById("stage");
S.style.height = H + "px";
S.style.transform = `scale(${SCALE})`;
// per format: vertical rhythm (top pad, logo→headline, headline size, headline→sub, sub→hero, hero→cta, cta→bottom)
// and the column widths (headline, sub, hero); 9:16 keeps all of it inside the middle ~800 px. The gaps are kept
// tight so the hero gets every spare pixel; in 9:16 the CTA ends at about 75% of the height, above the Stories
// reply bar and Sign up sticker
const R = {
  "45": { top: 60, gH: 46, hs: 76, gS: 22, gHero: 22, gCta: 26, bot: 54, hw: 940, sw: 860, xw: 1080, nw: 900, nh: 74, panel: 520, ss: 30 },
  "916": { top: 276, gH: 44, hs: 78, gS: 20, gHero: 28, gCta: 30, bot: 470, hw: 800, sw: 760, xw: 800, nw: 820, nh: 70, panel: 600, ss: 29 },
  "11": { top: 48, gH: 36, hs: 62, gS: 16, gHero: 14, gCta: 18, bot: 44, hw: 900, sw: 860, xw: 1080, nw: 900, nh: 60, panel: 360, ss: 26 },
}[FMT];

if (NEWS[C]) {
  S.innerHTML = `
    <div style="height:${R.top + (FMT === "916" ? 0 : 10)}px;flex:none"></div>
    <div class="news" style="width:${R.nw}px">
      <div class="bar">${LOGO}<span class="tag">NEWS</span></div>
      <h1 style="font-size:${R.nh}px">${NEWS[C]}</h1>
      <div class="panel" style="height:${R.panel}px"><img src="img/posters/grid-dark.webp" style="height:${R.panel - 40}px" alt=""></div>
    </div>
    <div style="height:${R.gCta + 14}px;flex:none"></div>${CTA}
    <div style="flex:1"></div>`;
} else {
  const [hd, sub, hero, extra] = POSTERS[C];
  S.innerHTML = `
    <div style="height:${R.top}px;flex:none"></div>${LOGO}
    <div style="height:${R.gH}px;flex:none"></div>
    <h1 style="font-size:${R.hs}px;line-height:1.12;max-width:${R.hw}px">${hd}</h1>
    <div style="height:${R.gS}px;flex:none"></div><div class="sub" style="font-size:${R.ss}px;max-width:${R.sw}px">${sub}</div>
    <div style="height:${R.gHero}px;flex:none"></div>
    <div class="hero" style="width:${R.xw}px;max-width:${R.xw}px">${hero}</div>
    ${extra ? `<div style="flex:none;display:flex;flex-direction:column;align-items:center;max-width:${R.sw}px">${extra}</div>` : ""}
    <div style="height:${R.gCta}px;flex:none"></div>${CTA}
    <div style="height:${R.bot}px;flex:none"></div>`;
}

// at most `lines` lines: step the font size down until the block fits (layout px, so the 1x1 scale doesn't matter)
function fit(el, lines, min) {
  if (!el) return;
  const lh = parseFloat(getComputedStyle(el).lineHeight) / parseFloat(getComputedStyle(el).fontSize);
  let fs = parseFloat(getComputedStyle(el).fontSize);
  const pad = parseFloat(getComputedStyle(el).paddingTop) + parseFloat(getComputedStyle(el).paddingBottom);
  while (el.offsetHeight - pad > fs * lh * lines + 2 && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; }
}

// render.mjs contract: a still page, so time does nothing
window.DURATION = 0; window.CUES = []; window.B = (b) => b * 0.6; window.seek = () => {};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => {
  fit(document.querySelector("h1"), 2, 40);
  fit(document.querySelector(".sub"), 2, 22);
  // the price total lines up with the cards, whatever size the hero lands at
  const im = document.querySelector(".hero img"), total = document.querySelector(".total");
  if (im && total) total.style.width = (0.93 * im.offsetWidth) + "px";
  // the orb scene and the code cards are drawn at their own size, then scaled to fill the hero
  const hero = document.querySelector("#stage > .hero"), W = hero && hero.offsetWidth, Hh = hero && hero.offsetHeight;
  const sc = document.querySelector(".orbs");
  if (sc) {
    // everything but the faint circles, in layout px around the scene's center (the stage itself is scaled in 1x1)
    const o = sc.getBoundingClientRect(); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const el of sc.children) {
      if (el.classList.contains("halo")) continue;
      const r = el.getBoundingClientRect();
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
    }
    [x0, x1] = [(x0 - o.left) / SCALE, (x1 - o.left) / SCALE]; [y0, y1] = [(y0 - o.top) / SCALE, (y1 - o.top) / SCALE];
    // the Macro orb stays on the poster's center line, under the headline and above the CTA; vertically the content centers
    const hw = Math.max(-x0, x1), k = Math.min(W * 0.47 / hw, Hh * 0.94 / (y1 - y0), 2.6), cx = 0, cy = (y0 + y1) / 2;
    sc.style.setProperty("--s", k);
    sc.style.transform = `translate(${-cx * k}px, ${-cy * k}px) scale(${k})`;
  }
  const term = document.querySelector(".term");
  if (term) term.style.transform = `scale(${Math.min(W * 0.96 / term.offsetWidth, Hh * 0.96 / term.offsetHeight, 1.2)})`;
});
</script>
</body>
</html>
