<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro blocks v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Block ads v2, the premium cut: Macro replacing the tools a company runs on. Porcelain and graphite modules with
   a few deep primaries on a studio-lit off-white. Twelve modules lock around the Macro core in a 4×4 grid, and its
   LEDs light up. Every contact has its own close sound (audio/bmix.py, style "premium"). Three routes:
     replace: "Replace 27+ apps": 27 real tool logos sort into the twelve module cells and get absorbed into the modules.
     price:   "$84 a seat": Notion, Slack, Linear and Superhuman stack up with their prices; a Macro slab presses
              them flat ($40), then unfolds into the whole system.
     swap:    "Your tools weren't built to fit together": mismatched tool tiles flip, split-flap style, into
              aligned Macro modules.
   ?v=replace|price|swap  &fmt=916|45|11 */
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --bg: #f1f0eb; --ink: #1a1917; --body: #4a4844; --lab: #77756f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
html.render body { display: block; min-height: 0; }
#stage { position: relative; overflow: hidden; flex: none; color: var(--ink);
  background: radial-gradient(ellipse 85% 62% at 50% 46%, #f7f6f2 0%, #f1f0eb 58%, #e8e7e1 100%);
  font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "cv11", "ss01"; }
#world, #screen, .layer { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.a { position: absolute; }
.flex { display: flex; align-items: center; }
.t1 { line-height: 1; white-space: nowrap; }
.slab { font-family: display; font-weight: 320; letter-spacing: -0.035em; line-height: 1; color: var(--ink); white-space: nowrap; }
.w { display: inline-block; }
/* a module: 300×300 design units, scaled to the grid. Every block wears the Macro app's email composer card: no border
   or lip, a hairline ring on the face (ring()) and a soft shadow under it (shadow()). */
.mod { position: absolute; left: 0; top: 0; width: 300px; height: 300px; transform-origin: 150px 150px; }
.sh { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 22px; }
.fc { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 22px; overflow: hidden; }
.ico { position: absolute; left: 30px; top: 30px; }
.lbl { position: absolute; left: 30px; top: 240px; font-size: 24px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; line-height: 28px; white-space: nowrap; }
.led, .ledon { position: absolute; right: 32px; top: 36px; width: 14px; height: 14px; border-radius: 50%; }
.ledon { background: #45e08c; box-shadow: 0 0 12px 3px #45e08c88, inset 0 -1px 1px #0003; opacity: 0; }
.gl { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 22px; background: #fff; opacity: 0; pointer-events: none; }
/* flip tiles (swap): two faces back to back */
.flip { position: absolute; left: 0; top: 0; width: 300px; height: 300px; transform-origin: 150px 150px; transform-style: preserve-3d; }
.face { position: absolute; left: 0; top: 0; width: 300px; height: 300px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.back { transform: rotateY(180deg); }
/* a tool tile: 120 px, scaled */
.lt { position: absolute; left: 0; top: 0; width: 120px; height: 120px; transform-origin: 60px 60px; }
.lt .sh { width: 120px; height: 120px; border-radius: 28px; }
.lt .fc { width: 120px; height: 120px; border-radius: 28px; display: flex; align-items: center; justify-content: center; }
/* price slabs: 800 wide, scaled */
.sl { position: absolute; left: 0; top: 0; width: 800px; height: 118px; transform-origin: 400px 59px; }
.sl .sh { width: 800px; height: 118px; border-radius: 22px; }
.sl .fc { width: 800px; height: 118px; border-radius: 22px; }
.sock { background: #e9e8e2; box-shadow: inset 0 0 0 1px rgba(11,11,11,.04), inset 0 1px 3px rgba(11,11,11,.05); opacity: 0; }
.key { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
.keyf { display: inline-flex; align-items: center; justify-content: center; background: #1d1d1c; color: #fff; font-weight: 600; white-space: nowrap; }
.prow { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; color: var(--body); }
.cap { font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--lab); }
</style>

"use strict";
// ---------- format and variant ----------
const Q = new URLSearchParams(location.search);
const FMT = Q.get("fmt") || "45", V = Q.get("v") || "replace";
const [W, H] = { "916": [1080, 1920], "45": [1080, 1350], "11": [1440, 1440] }[FMT];
const K = W / 1080, AH = H / K;
const REPLACE = V === "replace", PRICE = V === "price", SWAP = V === "swap";

// ---------- tempo ----------
// The bed is 100 BPM (audio/bmix.py, style "premium"). Every variant locks the core on the downbeat of bar 5 (beat 16);
// the end card follows. 24 beats = 14.4 s.
const BPM = 100, SPB = 60 / BPM, BEATS = 24, T = BEATS * SPB;
const B = (b) => b * SPB;
const LOCK = 16, ENDB = 17.5;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const TAU = Math.PI * 2;
function spr(t, resp = 0.42, damp = 0.82) {
  if (t <= 0) return 0;
  const w = TAU / resp;
  if (damp >= 1) { const e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  const wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return 1 - e * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
const mj = (x) => { x = clamp(x); return x * x * x * (10 + x * (-15 + 6 * x)); };
const eo3 = (x) => 1 - Math.pow(1 - clamp(x), 3);
const ei2 = (x) => { x = clamp(x); return x * x; };
const bell = (x) => (x <= 0 || x >= 1 ? 0 : 16 * x * x * (1 - x) * (1 - x));
function Tr(evs) {
  const E = evs.map(([b, v, r, d]) => ({ t: B(b), v, r: r ?? 0.8, d: d ?? 0.9 }));
  return (t) => { let v = E[0].v; for (let i = 1; i < E.length; i++) v += (E[i].v - E[i - 1].v) * spr(t - E[i].t, E[i].r, E[i].d); return v; };
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- icons, logos ----------

const ic = (name, size, color = "currentColor") => `<span style="display:inline-block;width:${size}px;height:${size}px;color:${color}">${window.ICONS[name]}</span>`;
// the real logo (img/macro-logo.svg): the mark's three pieces and the MACRO letterforms, 126.4 units tall
const LOGO_MARK = ["M0 47.151L16.199 40.81C22.551 47.236 34.299 57.491 39.832 63.809L39.88 99.564C39.876 105.615 40.12 114.034 39.774 119.931C34.433 121.982 29.103 124.064 23.786 126.177C19.631 122.268 1.946 106.135 0 102.379L0 47.151Z", "M47.632 0L48.504 0C50.116 1.598 52.174 3.051 53.824 4.712C73.817 24.845 95.62 43.76 115.445 63.991C115.552 66.818 115.592 69.696 115.513 72.523C115.075 88.301 115.701 104.194 115.444 119.951C111.602 121.871 103.313 124.848 99.214 126.339C94.102 120.866 86.899 114.298 81.323 109.052C71.856 100.234 62.526 91.27 53.337 82.163C50.385 79.209 45.332 75.304 43.124 72.361C43.132 68.995 43.082 65.629 42.976 62.264C40.676 59.71 35.402 55.12 32.496 52.172C32.501 37.889 32.044 20.249 32.654 6.207C36.92 4.311 43.939 2.079 47.632 0Z", "M123.569 0L124.699 0C128.214 3.816 134.12 9.106 138.047 12.948L177.874 51.237C181.701 54.971 188.687 60.396 191.23 64.633L191.308 120.003C187.261 121.904 179.556 124.694 175.227 126.234C171.746 123.787 160.568 112.286 156.725 108.629C144.592 97.087 130.339 84.409 118.9 72.353C118.953 69.16 118.982 65.966 118.986 62.772C117.614 60.894 110.311 54.369 108.016 51.991C107.405 39.273 107.793 19.202 108.018 6.291C111.901 4.493 120.969 1.705 123.569 0Z"];

.977 86.034 560.504 86.019L615.56 85.992C615.606 92.272 615.602 98.552 615.547 104.832L553.729 104.862C542.096 104.861 522.286 106.802 512.392 101.015C500.895 93.871 502.35 80.027 502.761 68.524C503.463 48.961 497.044 28.443 522.79 23.419Z", "M628.023 23.423L687.86 23.349C698.415 23.346 709.045 23.201 719.557 23.509C732.988 23.902 740.546 34.132 740.72 46.907C740.927 62.171 741.52 71.402 725.794 78.315C729.671 87.236 734.935 96.141 738.536 104.878L726.814 104.839L718.021 104.824C713.247 97.434 708.766 87.719 705.08 79.668C686.032 79.254 665.821 79.606 646.685 79.619L646.702 104.947C640.54 104.716 634.082 104.833 627.913 104.9C627.35 85.968 628.179 66.507 627.828 47.527C627.688 39.873 627.578 31.009 628.023 23.423ZM646.664 60.92L694.437 60.958C699.456 60.961 718.131 61.618 721.579 59.898C722.324 56.863 722.193 46.423 721.11 43.41C718.778 41.117 699.087 41.949 694.809 41.951L651.996 42.012C650.307 42.034 648.619 42.078 646.926 42.142C646.414 44.538 646.642 57.699 646.664 60.92Z", "M773.622 23.423C792.145 23.184 810.799 23.439 829.33 23.344C835.53 23.761 843.447 22.578 849.478 24.136C867.501 28.796 866.367 45.886 865.766 60.547C865.419 69.063 866.756 79.557 865.355 87.263C864.767 90.557 863.405 93.663 861.378 96.322C857.285 101.702 852.11 103.801 845.635 104.68C842.406 104.992 836.566 104.83 833.075 104.831L810.418 104.85L787.359 104.857C778.899 104.852 768.629 105.79 761.651 100.217C756.805 96.65 752.548 88.79 753.115 82.502C754.203 70.468 751.507 52.227 753.72 40.77C754.359 37.381 755.802 34.196 757.927 31.481C762.07 26.201 767.198 24.208 773.622 23.423ZM844.027 86.04C848.128 83.916 847.248 78.015 846.799 73.885C846.13 67.731 848.28 47.736 846.075 43.201C843.6 41.958 837.946 41.865 835.064 41.967C815.382 42.661 794.384 41.048 774.816 42.108C773.724 42.46 773 42.546 772.425 43.642C771.354 45.694 771.507 81.49 772.332 83.863C772.569 84.54 772.759 85.098 773.432 85.431C776.398 86.889 835.593 85.87 844.027 86.04Z"];
const markSvg = (w, c) => `<svg width="${w}" height="${(w * 126.4) / 191.3}" viewBox="0 0 191.3 126.4" fill="${c}" style="display:block">${LOGO_MARK.map((d) => `<path d="${d}"/>`).join("")}</svg>`;
const lockup = (h, c) => { const k = h / 126.4; return `<div class="flex" style="gap:${(44.7 * k).toFixed(2)}px">${markSvg(191.3 * k, c)}<svg width="${(630.7 * k).toFixed(2)}" height="${h}" viewBox="236 0 630.7 126.4" fill="${c}" style="display:block">${LOGO_TYPE.map((d) => `<path d="${d}"/>`).join("")}</svg></div>`; };
// a tool's full-color mark (SVG Logos / Simple Icons, both CC0; see logos27.js); ids are made unique per use
function logoSvg(key, size, uid) {
  const s = window.LOGOS27[key].svg;
  if (s.startsWith("ICONS:")) { const [, n, c] = s.split(":"); return `<span style="display:block;width:${size}px;height:${size}px;color:${c || "#1a1917"}">${window.ICONS[n]}</span>`; }
  return s.replace(/id="([^"]+)"/g, `id="$1${uid}"`).replace(/url\(#([^)]+)\)/g, `url(#$1${uid})`).replace(/href="#([^"]+)"/g, `href="#$1${uid}"`)
    .replace("<svg ", `<svg width="${size}" height="${size}" style="display:block" preserveAspectRatio="xMidYMid meet" `);
}

// ---------- palette: porcelain and graphite, with deep primaries ----------
const PAL = {

};
// twelve modules around the core, clockwise from the top left of the 4×4 grid, with the tools each one replaces
const MODS = {

const RING = Object.keys(MODS);

// ---------- layout (canvas px) ----------
const LY = {

}[FMT];
const EL = {
  "45":  { em: 362, es: 330, hfs: 72, hb: [660, 738], sfs: 25, sub: 780, slh: 38, cta: 896, ch: 92, cfs: 28, demo: 1026, dfs: 21, proof: 1132, pfs: 19 },
  "916": { em: 512, es: 310, hfs: 78, hb: [758, 842], sfs: 27, sub: 886, slh: 41, cta: 1004, ch: 96, cfs: 30, demo: 1136, dfs: 23, proof: 1208, pfs: 20 },
  "11":  { em: 258, es: 240, hfs: 60, hb: [494, 560], sfs: 22, sub: 598, slh: 34, cta: 694, ch: 80, cfs: 25, demo: 806, dfs: 19, proof: 892, pfs: 17 },
}[FMT];
const CS = LY.cs, G0 = LY.g, GL = G0, GX = 540, GY = LY.gy, SC = CS / 300, CORE = 2 * CS + GL;
const cellXY = ([c, r], gap) => [GX + (c - 1.5) * (CS + gap), GY + (r - 1.5) * (CS + gap)];

// =====================================================================
// the story, per variant (beats)
// =====================================================================
const LINES = [], NUDGE = [];
const CORE_IN = { t0: 13.5, th: 14.6, t1: LOCK };       // the core rises in from below, hovers, presses
const S = {};
if (REPLACE) {
  // The pile is a neat grid of the 27 tools. It sorts itself into the module cells (b0.6–2.8); then, clockwise, each
  // cell's tools converge and become the module (one every 0.85 beats from b3.2); the core locks at 16.
  S.mod = (i) => 3.2 + 0.85 * i;
  LINES.push({ l: 0, w: "Replace 27+ apps", tin: -1, tout: ENDB }, { l: 1, w: "with a single system.", tin: LOCK + 0.05, tout: ENDB });

    { l: 0, w: "Every module", tin: 12.05, tout: ENDB }, { l: 1, w: "included.", tin: 12.05, tout: ENDB });

}

  // (split-flap), landing flush; the four in the middle flip together into the core on the lock
  S.face = { email: "gmail", chat: "slack", calls: "zoom", calendar: "gcal", booking: "calendly", crm: "hubspot", agents: null, search: null,
    drive: "dropbox", sheets: "airtable", docs: "notion", tasks: "linear" };
  S.center = ["teams", "jira", "salesforce", "gdrive"];
  S.flip = (i) => 3.1 + 0.78 * i;                   // landing beat of the i-th ring flip
  S.bumps = [[0.55, "chat", "calls", 1], [1.45, "docs", "tasks", -1]];
  LINES.push({ l: 0, w: "Your tools weren't built", tin: -1, tout: 2.45 }, { l: 1, w: "to fit together.", tin: -1, tout: 2.45 },
    { l: 0, w: "Macro was.", tin: 2.6, tout: LOCK - 0.1 }, { l: 0, w: "One system.", tin: LOCK + 0.05, tout: ENDB });
  CORE_IN.t0 = null;

const px = (v) => v.toFixed(3) + "px";

    + `0 ${u(26 * lift)} ${u(52 * lift)} ${u(-14 * lift)} ${a(0.14 * lift)}`;
};
// the end card's button: resting a little above the card, flat on the card while it's pressed
const keySh = (press) => `${ring(1)}, ${shadow(0.35 * (1 - press), 1)}`;

  if (REPLACE) P = drop(t, B(CORE_IN.t0), B(CORE_IN.th), B(CORE_IN.t1), CORE_FROM, [GX, GY], -8);
  else { const lt = B(S.coreLift), u = (t - lt) / (B(LOCK) - lt); P = { x: GX, y: GY, r: 0, s: 1, lift: t < lt ? 0 : t < B(LOCK) - 0.07 ? 0.7 * sm(u * 2.2) : t < B(LOCK) ? 0.7 * (1 - ((t - B(LOCK) + 0.07) / 0.07) ** 2) : 0 }; if (t >= B(LOCK)) P.s = 1 - 0.012 * Math.exp(-(t - B(LOCK)) / 0.06); }

// ----- replace: the tools -----
function toolsFx(t) {

    el.style.zIndex = lift > 0.02 ? "20" : "1";

}

// ----- price: the slabs, the press, the morph into the core -----
const SLW = 800, SLH = 118, SLL = 12, SLS = (SLH + SLL) * LY.sk;      // slab, the gap above it; one slab's pitch in the stack
function priceFx(t) {
  const sk = LY.sk, base = LY.stack + 2 * SLS;                        // the table under the stack
  const p0 = B(S.press[0]), p1 = B(S.press[1]), pp = t < p0 ? 0 : t > p1 ? 1 : mj((t - p0) / (p1 - p0));
  const hgt = 4 * SLS * (1 - pp);                                     // the stack's height as it's pressed
  let sum = 0, shake = 0;
  S.slabs.forEach((el, i) => {
    const land = B(S.land[i]), t0 = land - 0.46, restY = base - (i + 0.5) * SLS * (1 - pp) - (SLL * sk) / 2 * (1 - pp);

    else {

    }

    el.style.zIndex = String(2 + i + (lift > 0 ? 20 : 0));
    const fo = String(1 - sm((pp - 0.6) / 0.35));
    E[`sl${i}_sh`].style.boxShadow = shadow(lift * 0.9, sk);
    E[`sl${i}_sh`].style.opacity = fo; E[`sl${i}_fc`].style.opacity = fo;
    if (t >= land) sum += S.prices[i][2];
  });
  // the total counts up as they land, then down to Macro's price as the press goes
  const prevSum = (i) => S.prices.slice(0, i).reduce((a, p) => a + p[2], 0);
  let shown = 0;
  S.land.forEach((b, i) => { const u = b < 0 ? 1 : clamp((t - B(b)) / 0.32); if (t >= B(b)) shown = prevSum(i) + Math.round(S.prices[i][2] * u); });
  if (pp > 0) shown = Math.round(lerp(84, 40, pp));
  E.totv.textContent = "$" + shown;
  const tb = base + 34 * sk + (FMT === "11" ? 4 : 10);
  fx(E.tot, 1 - sm((t - B(S.morph[0])) / 0.3), 0, `translate3d(0,${px(tb)},0)`);
  fx(E.note, 0.9 * (1 - sm((t - B(S.press[0])) / 0.3)), 0, `translate3d(0,${px(tb + 66 * sk)},0)`);
  // the Macro slab: lowers into view, hovers, presses, rests; then becomes the core at the grid's center
  const el = E.slM, mIn = B(S.mIn), mH = B(S.mHov), m0 = B(S.morph[0]), m1 = B(S.morph[1]);
  if (t < mIn || t > m1 + 0.03) { show(el, 0); show(E.slM_sh, 0); return; }
  const restTop = base - hgt, yRest = restTop - (SLH * sk) / 2 - SLL * sk;
  let y, lift = 0;
  if (t < mH) { const u = mj((t - mIn) / (mH - mIn)); y = lerp(yRest - 900, yRest - 70, u); lift = 1; }
  else if (t < p0) { const u = t - mH; y = yRest - 70 + 2.5 * Math.sin(u * 31) * Math.exp(-u / 0.6) + 1.2 * Math.sin(u * 53); lift = 1; }
  else if (pp < 1) { const v = clamp((t - p0) / 0.25); y = lerp(yRest - 70, yRest, sm(v)) + (v >= 1 ? 0.8 * Math.sin(t * 70) : 0); lift = 1 - sm(v); }
  else y = yRest;

  el.style.zIndex = "40";

}

// ----- swap: each tool flips into its module -----
function flipPose(t, land, messy, exact, dur = 0.46) {
  const t0 = land - dur;
  if (t <= t0) return { ...messy, th: 0 };
  if (t >= land) { const u = t - land; return { ...exact, th: 180, lift: 0, s: exact.s * (1 - 0.01 * Math.exp(-u / 0.05) * Math.cos(u * 45)) }; }
  const u = (t - t0) / dur, p = mj(u);
  return { x: lerp(messy.x, exact.x, p), y: lerp(messy.y, exact.y, p), r: lerp(messy.r, 0, p), s: lerp(messy.s, exact.s, p), th: 180 * p, lift: lerp(messy.lift, 0, p) + Math.sin(Math.PI * u) * 0.7 };
}
function swapFx(t) {
  S.ring.forEach((F, i) => {
    const [gx, gy] = gridPos(F.k, t), [c0x, c0y] = cellXY(MODS[F.k].cell, G0), [nx, ny] = nudge(F.k, t);
    const messy = { x: c0x + F.o.dx + nx, y: c0y + F.o.dy + ny, r: F.o.r, s: F.o.s, lift: F.o.h };
    let P;
    if (F.key) P = flipPose(t, F.land, messy, { x: gx, y: gy, r: 0, s: 1 });
    else { const d = drop(t, F.land - 0.5, F.land - 0.24, F.land, [gx, gy - 40], [gx, gy]); P = { ...d, th: 180 }; if (t < F.land - 0.5) { show(F.el, 0); show(F.sh, 0); return; } }
    show(F.el, 1); show(F.sh, 1);
    const sc = SC * P.s * (1 + 0.06 * P.lift);
    F.el.style.transform = `translate3d(${px(P.x - 150)},${px(P.y - 150)},0) rotate(${P.r.toFixed(3)}deg) scale(${sc.toFixed(5)}) perspective(1300px) rotateY(${P.th.toFixed(3)}deg)`;
    F.el.style.zIndex = P.lift > 0.02 ? "40" : "2";
    const cosw = Math.max(0.06, Math.abs(Math.cos((P.th * Math.PI) / 180)));
    F.sh.style.transform = `translate3d(${px(P.x - 150)},${px(P.y - 150)},0) rotate(${P.r.toFixed(3)}deg) scale(${(sc * cosw).toFixed(5)},${sc.toFixed(5)})`;
    F.sh.style.borderRadius = P.th < 90 ? `${F.o.rad}px` : "22px";
    F.sh.style.boxShadow = shadow(P.lift, SC);
    E[`m_${F.k}_gl`].style.opacity = sweep(i, t).toFixed(3);
    E[`m_${F.k}_led`].style.opacity = t >= ledT(i) ? clamp((t - ledT(i)) / 0.05).toFixed(3) : "0";
  });
  // the middle four flip together into the core on the lock, then hand over to the core itself
  const land = B(LOCK), q2 = CORE / 2;
  S.quads.forEach((Qd, i) => {
    const [c0x, c0y] = [GX + (Qd.qx - 0.5) * (CS + G0), GY + (Qd.qy - 0.5) * (CS + G0)];
    const exact = { x: GX + (Qd.qx - 0.5) * q2, y: GY + (Qd.qy - 0.5) * q2, r: 0, s: q2 / CS };
    const jit = t > B(14.6) && t < land - 0.5 ? 1.4 * Math.sin(t * 47 + i * 2) : 0;
    const P = flipPose(t, land, { x: c0x + Qd.o.dx + jit, y: c0y + Qd.o.dy, r: Qd.o.r, s: Qd.o.s, lift: Qd.o.h }, exact, 0.52);
    if (t >= land + 0.02) { show(Qd.el, 0); show(Qd.sh, 0); return; }
    show(Qd.el, 1); show(Qd.sh, 1);
    const sc = SC * P.s * (1 + 0.06 * P.lift);
    Qd.el.style.transform = `translate3d(${px(P.x - 150)},${px(P.y - 150)},0) rotate(${P.r.toFixed(3)}deg) scale(${sc.toFixed(5)}) perspective(1300px) rotateY(${P.th.toFixed(3)}deg)`;
    Qd.el.style.zIndex = P.lift > 0.02 ? "40" : "2";
    const cosw = Math.max(0.06, Math.abs(Math.cos((P.th * Math.PI) / 180)));
    Qd.sh.style.transform = `translate3d(${px(P.x - 150)},${px(P.y - 150)},0) rotate(${P.r.toFixed(3)}deg) scale(${(sc * cosw).toFixed(5)},${sc.toFixed(5)})`;
    Qd.sh.style.borderRadius = `${Qd.o.rad}px`;
    Qd.sh.style.boxShadow = shadow(P.lift, SC);

  }

}

// ----- header and end card -----
function wordsFx(ln, t) {

    if (ln.tin < 0) { const q = sm((t - b) / 0.22); fx(w, 1 - q, q * 7, `translate3d(0,${px(-q * 16)},0)`); return; }

}
function headerFx(t) {

}
function thumb(t, td, x, y) {
  const tu = td + 0.16;

  const appear = clamp((t - (td - 0.12)) / 0.1), lift = sm((t - tu) / 0.16), held = t >= td && t <= tu ? 1 : 0;

  if (t > tu) { const u = (t - tu) / 0.36; fx(E.tring, (1 - sm(u)) * 0.9, 0, `translate3d(${px(x)},${px(y)},0) scale(${(1 + 1.3 * mj(u)).toFixed(4)})`); } else show(E.tring, 0);

function handsFx(t) { if (!thumb(t, B(20), 540 + 150, EL.cta + EL.ch / 2)) { show(E.touch, 0); show(E.tring, 0); } }

const CUES = [];
const MUSIC = { bpm: BPM, beats: BEATS, lock: LOCK, end: ENDB, style: "premium" };
function buildCues() {
  const cueT = (t, type, gain = 1, extra = {}) => CUES.push({ t, type, gain, ...extra });
  const pan = (x) => clamp((x - 540) / 540, -1, 1) * 0.55;
  if (REPLACE) {
    S.tiles.forEach((T) => { cueT(T.s0 + 0.01, "slide", 0.12, { pan: pan(T.A.x), dur: T.s1 - T.s0 }); cueT(T.s1, "tak", 0.26, { pan: pan(T.C.x), seed: T.i }); });
    RING.forEach((k, i) => {
      const [x] = cellXY(MODS[k].cell, G0), tk = B(S.mod(i));
      MODS[k].tools.forEach((_, j) => cueT(tk - 0.12 + j * 0.022, "absorb", 0.45, { pan: pan(x), seed: i * 6 + j }));
      cueT(tk, "msnap", 0.95, { pan: pan(x), seed: i });
    });
    cueT(B(CORE_IN.t0) + 0.05, "lift", 0.5);
    cueT(B(CORE_IN.th) - 0.2, "riser", 0.5, { dur: B(LOCK) - B(CORE_IN.th) + 0.2 });
  }
  if (PRICE) {
    S.land.forEach((b, i) => {
      if (b < 0) return;
      cueT(B(b) - 0.46, "whoosh", 0.18, { pan: 0 });
      cueT(B(b), "slab", 1.0, { pan: 0, seed: i });
      for (let n = 0; n < 6; n++) cueT(B(b) + 0.05 + n * 0.05, "count", 0.2, { pan: 0.3, seed: n });
      SHAKE.push([B(b), 1.6]);
    });
    cueT(B(S.mIn), "lift", 0.4, { pan: 0 });
    cueT(B(S.press[0]) - 0.05, "hydraulic", 0.9, { dur: B(S.press[1]) - B(S.press[0]) + 0.1 });
    for (let n = 0; n < 10; n++) cueT(B(S.press[0]) + 0.1 + n * ((B(S.press[1]) - B(S.press[0]) - 0.1) / 10), "count", 0.14, { pan: 0.3, seed: 10 + n });
    cueT(B(S.press[1]), "slab", 1.1, { pan: 0, seed: 9, heavy: 1 }); cueT(B(S.press[1]) + 0.03, "hiss", 0.6, { pan: 0 });
    SHAKE.push([B(S.press[1]), 2.4]);
    cueT(B(S.morph[0]), "whoosh", 0.3, { pan: 0 });
    RING.forEach((k, i) => { const [x] = cellXY(MODS[k].cell, G0); cueT(B(S.out(i)) + 0.34, "msnap", 0.7, { pan: pan(x), seed: i }); });
    cueT(B(S.coreLift) + 0.02, "lift", 0.4, { pan: 0 });
    cueT(B(S.coreLift) + 0.1, "riser", 0.4, { dur: B(LOCK) - B(S.coreLift) - 0.1 });
  }
  if (SWAP) {
    S.bumps.forEach(([b]) => cueT(B(b), "clunk", 0.8, { pan: 0, seed: Math.round(b * 10) }));
    S.ring.forEach((F, i) => { const [x] = cellXY(MODS[F.k].cell, G0); if (F.key) { cueT(F.land - 0.44, "flap", 0.42, { pan: pan(x), seed: i }); cueT(F.land, "msnap", 0.9, { pan: pan(x), seed: i }); } else { cueT(F.land - 0.5, "lift", 0.3, { pan: pan(x) }); cueT(F.land, "msnap", 0.9, { pan: pan(x), seed: i }); } });
    cueT(B(LOCK) - 0.52, "flap", 0.7, { pan: -0.1, seed: 40 }); cueT(B(LOCK) - 0.5, "flap", 0.7, { pan: 0.1, seed: 41 });
    cueT(B(14.6), "riser", 0.45, { dur: B(LOCK) - B(14.6) });
  }
  // the lock: the core's thock, the ring pulling tight, the LEDs coming on, and the system's chime
  cueT(B(LOCK), "thock", 1.0, { pan: 0 }); SHAKE.push([B(LOCK), 2]);
  RING.forEach((k, i) => { const [x] = cellXY(MODS[k].cell, G0); cueT(B(LOCK) + 0.08 + i * 0.022, "click", 0.36, { pan: pan(x), seed: i }); cueT(ledT(i), "led", 0.2, { pan: pan(x), seed: i }); });
  cueT(B(LOCK) + 0.32, "online", 0.4, { pan: 0 });
  // end card
  const e = B(ENDB) + 0.45;
  cueT(B(ENDB) - 0.02, "whoosh", 0.3, { pan: 0 });
  cueT(e + 0.95 + 0.12, "msnap", 0.55, { pan: 0, seed: 30 });
  cueT(B(20), "press", 0.95, { pan: 0.15 }); cueT(B(20) + 0.16, "release", 0.65, { pan: 0.15 });
}

// =====================================================================
// seek(t)
// =====================================================================
function seek(tIn) {
  const t = clamp(tIn, 0, T);
  {
    const dx = 0.6 * Math.sin(t * 0.7 + 1.1) + 0.3 * Math.sin(t * 1.7 + 0.4), dy = 0.5 * Math.sin(t * 0.55 + 2.3) + 0.25 * Math.sin(t * 1.3 + 1.7);
    let z = Math.exp(LZT(t)), sx = 0, sy = 0;
    const u = t - B(LOCK); if (u >= 0) z *= 1 + 0.012 * clamp(u / 0.02) * Math.exp(-u / 0.16);
    for (const [c, a] of SHAKE) { const v = t - c; if (v >= 0 && v < 0.5) { const k = a * Math.exp(-v / 0.06); sx += k * Math.sin(v * 90); sy += k * 0.6 * Math.sin(v * 67 + 1); } }
    CAM = { cx: CXT(t), cy: CYT(t), z, sy: SYT(t), dx: dx + sx, dy: dy + sy };
    world.style.transform = `translate(${((540 + CAM.dx) * K).toFixed(3)}px,${((CAM.sy + CAM.dy) * K).toFixed(3)}px) scale(${(K * z).toFixed(5)}) translate(${(-CAM.cx).toFixed(3)}px,${(-CAM.cy).toFixed(3)}px)`;
  }
  if (REPLACE) toolsFx(t);
  if (PRICE) priceFx(t);
  modsFx(t);
  headerFx(t);
  endFx(t);
  handsFx(t);
}

// ---------- boot ----------
window.seek = seek; window.DURATION = T; window.CUES = CUES; window.B = B; window.MUSIC = MUSIC; window.FMT = [W, H];
window.ready = Promise.all(['400 20px "Inter"', '500 20px "Inter"', '600 20px "Inter"', '700 20px "Inter"', '320 40px "display"'].map((f) => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => { init(); seek(0); return true; });
const params = new URLSearchParams(location.search);
if (params.has("render")) document.documentElement.classList.add("render");
else {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); Object.assign(stage.style, { position: "fixed", left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${k})` }); };
  addEventListener("resize", fit); fit();
  const at = params.has("t") ? parseFloat(params.get("t")) : null;
  window.ready.then(() => { if (at != null) { seek(at); return; } const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
