<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro UI loops</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* UI loop ads for Meta, in the format of the team's X posts: one Macro surface on black that morphs from state to state
   (size, radius, color) while its content swaps with a short blur. A cursor and keycaps drive every change, a Roboto
   Slab caption says what's happening, and the camera fits each state to the frame. Everything lands on the 112 BPM
   grid of the kit's stock track ("Gimme that Groove!", Mixkit 872): 7 bars, 28 beats, 15 s. The last frame is the
   first frame, so it loops. The UI is drawn from the app's Macro Dark theme and its own icons (ui-icons.js).
     ?ad=pr|mention|search|email|cmdk   &fmt=45|916|11   (&t=<seconds> to hold a moment in a browser) */
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root {
  /* Macro Dark (apps/web/src/features/theme/themes/macro-dark.ts) and its task-status tokens (themeColorTokens.ts) */
  --s1: #121212; --s2: #171717; --s3: #1b1b1b; --s4: #222222; --edge: #1e1e1e;
  --ink: #ffffff; --ink1: oklch(0.83 0 21); --ink2: oklch(0.75 0 21); --ink3: oklch(0.63 0 21); --ink4: oklch(0.55 0 21);
  --accent: oklch(0.7 0.12 250); --green: oklch(0.75 0.2 149.579); --red: oklch(0.75 0.2 25.331);
  --violet: oklch(0.75 0.2 292.717); --amber: oklch(0.75 0.2 70.08);
  --st-ns: var(--ink1); --st-ip: color-mix(in srgb, var(--amber) 80%, #fff); --st-rv: var(--violet); --st-dn: var(--accent);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
html.render body { display: block; min-height: 0; }
#stage { position: relative; overflow: hidden; flex: none; background: #000; color: var(--ink);
  font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  font-feature-settings: "cv11", "ss01"; }
/* the canvas: black, with the faint rings of the X posts around the middle (static, so it never shimmers) */
#bg { position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 52%, rgba(255,255,255,.035) 0%, rgba(255,255,255,0) 58%),
    repeating-radial-gradient(circle at 50% 52%, rgba(255,255,255,.028) 0px, rgba(255,255,255,.028) 1.6px, rgba(255,255,255,0) 2.6px, rgba(255,255,255,0) 46px);
  -webkit-mask-image: radial-gradient(circle at 50% 52%, #000 0%, #000 24%, transparent 66%); mask-image: radial-gradient(circle at 50% 52%, #000 0%, #000 24%, transparent 66%); }
#wmask { position: absolute; inset: 0; }
#world, #screen { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.L { position: absolute; }
.fx { display: flex; align-items: center; }
.ic { display: block; flex: none; }
.slot { position: relative; flex: none; }
.slot > .L { left: 0; top: 0; white-space: nowrap; }
/* the one shape */
.shell { position: absolute; background: var(--s1); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.055), 0 40px 120px rgba(0,0,0,.55); }
/* app pieces, at about 1.6x the app's size so they read on a phone */
.hdr { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 0 44px;
  border-bottom: 1.5px solid var(--edge); font-size: 34px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; }
.av { display: block; border-radius: 50%; overflow: hidden; flex: none; background: #2a2a2a; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avs { display: flex; } .avs .av + .av { margin-left: -14px; } .avs .av { box-shadow: 0 0 0 3px var(--s1); }
.nm { font-size: 25px; color: var(--ink3); white-space: nowrap; }
.mg { position: absolute; display: flex; flex-direction: column; gap: 10px; }
.mg.me { align-items: flex-end; }
.row { display: flex; align-items: center; gap: 20px; }
.bub { background: var(--s3); border-radius: 36px; padding: 20px 30px; font-size: 31px; line-height: 1.3; color: #ececec;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.03); white-space: nowrap; }
.cmp { background: var(--s3); border-radius: 50px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.05); display: flex; align-items: center;
  gap: 22px; padding: 0 20px 0 34px; }
.ph { color: var(--ink4); font-size: 31px; line-height: 44px; }
.tx { font-size: 31px; line-height: 44px; color: #ececec; }
.send { width: 60px; height: 60px; border-radius: 50%; background: #262626; color: #8a8a8a; display: flex; align-items: center; justify-content: center; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.06); white-space: nowrap; vertical-align: middle; }
.u { text-decoration: underline; text-decoration-color: rgba(255,255,255,.28); text-decoration-thickness: 1.5px; text-underline-offset: 7px; }
.mono { font-family: "mono"; letter-spacing: -0.01em; }
.pop { background: #1a191c; border-radius: 26px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.075), 0 30px 80px rgba(0,0,0,.7); }
.badge { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 21px; font-size: 24px; font-weight: 600; letter-spacing: .06em; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-radius: 14px; font-size: 25px; font-weight: 500; color: #e6e6e6; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,.055); font-size: 25px; color: #e2e2e2; white-space: nowrap; }
.caret { display: inline-block; width: 3px; height: 36px; margin-left: 3px; background: #e8e8e8; vertical-align: -8px; }
mark.hl { background: rgba(104,160,228,calc(var(--hl, 1) * .3)); color: inherit; border-radius: 6px; padding: 0 3px; margin: 0 -3px; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 8px; font-size: 20px; color: var(--ink2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1); }
.it { display: flex; align-items: center; gap: 18px; height: 72px; padding: 0 20px; margin: 0 10px; border-radius: 14px; font-size: 28px; color: #e8e8e8; white-space: nowrap; }
.sec { font-size: 21px; font-weight: 500; color: var(--ink3); padding: 16px 30px 8px; white-space: nowrap; }
.cmpt .bub { font-size: 27px; padding: 16px 24px; border-radius: 30px; } .cmpt .nm { font-size: 22px; } .cmpt .chip { height: 42px; }
/* screen-space overlays: captions, keycaps, cursor, wordmark */
.cap { position: absolute; left: 0; width: 100%; text-align: center; font-family: "display", "Inter"; font-weight: 330; letter-spacing: -0.02em;
  line-height: 1; color: #f4f4f2; white-space: nowrap; }
.kc { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; gap: .3em; height: 1.95em; padding: 0 .62em;
  border-radius: .44em; background: #1c1c1c; color: #ededed; font-weight: 500; white-space: nowrap; letter-spacing: .01em;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1), inset 0 -3px 0 rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.55); }
.cur { position: absolute; left: 0; top: 0; transform-origin: 3px 3px; }
.mark { position: absolute; left: 0; width: 100%; display: flex; justify-content: center; opacity: .92; }
</style>
<script src="ui-icons.js"></script>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="wmask"><div id="world"></div></div><div id="screen"></div></div>
<script>
"use strict";
// ---------- format, ad, beat grid ----------
const Q = new URLSearchParams(location.search);
const FMT = Q.get("fmt") || "45", AD = Q.get("ad") || "pr";
const [W, H] = { "916": [1080, 1920], "45": [1080, 1350], "11": [1440, 1440] }[FMT];
// The kit's "Gimme that Groove!" is 112 BPM; the scene is cut from its downbeat, so beat 1 is t = 0 and every change
// lands on a beat. 7 bars of 4 beats; beat 29 is the loop point (= beat 1).
const BPM = 112, SPB = 60 / BPM, BEATS = 28, T = BEATS * SPB;
const B = (b) => (b - 1) * SPB;
// Per format: the caption (center y, size), the box the camera fits the UI into, the wordmark, the cursor and keycap
// sizes. 9:16 keeps the caption below the top 14% and everything above the bottom 35%, inside the middle ~900 px
// (tall phones crop the sides of a story).
// wk narrows the world's layouts (cards, splits) so the tall formats fill their width at a readable size; mask is the
// screen y above which the UI fades out, so the caption always sits on clean black.
const LAY = {
  "11": { capY: 166, capS: 84, safe: [80, 292, 1280, 990], maxS: 1.32, markY: 1376, markH: 30, cur: 48, key: 44, wk: 1, mask: 226 },
  "45": { capY: 118, capS: 64, safe: [48, 220, 984, 968], maxS: 1.12, markY: 1292, markH: 26, cur: 40, key: 38, wk: 0.86, mask: 166 },
  "916": { capY: 394, capS: 66, safe: [60, 478, 960, 770], maxS: 1.06, markY: 306, markH: 26, cur: 42, key: 40, wk: 0.78, mask: 440 },
}[FMT];
const WK = LAY.wk;
const SAFE = { x: LAY.safe[0], y: LAY.safe[1], w: LAY.safe[2], h: LAY.safe[3] };
SAFE.cx = SAFE.x + SAFE.w / 2; SAFE.cy = SAFE.y + SAFE.h / 2;
const TALL = FMT === "916", NARROW = WK < 1;

// ---------- motion: closed-form springs, summed per key (pure functions of t) ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const TAU = Math.PI * 2;
function spr(t, resp = 0.42, damp = 0.86) {
  if (t <= 0) return 0;
  const w = TAU / resp;
  if (damp >= 1) { const e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  const wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return 1 - e * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
const C97 = {};
const c97 = (damp) => { if (!(damp in C97)) { let t = 0; while (spr(t, 1, damp) < 0.97) t += 0.0005; C97[damp] = t; } return C97[damp]; };
// a spring step that starts at t0 and is 97% of the way at t1, then settles (damping 0.88: a 0.3% overshoot at most)
const step = (t, t0, t1, damp = 0.88) => spr(t - t0, (t1 - t0) / c97(damp), damp);
const bell = (x) => (x <= 0 || x >= 1 ? 0 : 16 * x * x * (1 - x) * (1 - x));
// a value track: [[beat, value, beats to 97%, damping], ...]; the first key is the value at t = 0
// A track that ends where it starts (every loop track) has its last sub-pixel of spring residue blended away over
// the final 0.35 s, so the loop point is exactly frame 0.
const SEAM = 0.35;
function tr(keys) {
  const K = keys.map(([b, v, d = 0.9, z = 0.88]) => ({ t0: B(b), t1: B(b) + d * SPB, v, z }));
  const loops = K.length > 1 && Math.abs(K[K.length - 1].v - K[0].v) < 1e-9;
  return (t) => {
    let v = K[0].v; for (let i = 1; i < K.length; i++) v += (K[i].v - K[i - 1].v) * step(t, K[i].t0, K[i].t1, K[i].z);
    return loops && t > T - SEAM ? K[0].v + (v - K[0].v) * (1 - sm((t - (T - SEAM)) / SEAM)) : v;
  };
}
// visibility windows: [[in beat (null: from the start), out beat (null: to the end), in beats, out beats], ...]
function visOf(t, wins) {
  let o = 0, pin = 1;
  for (const [a, b, fi = 0.42, fo = 0.3] of wins) {
    const pi = a == null ? 1 : sm((t - B(a)) / (fi * SPB)), po = b == null ? 0 : sm((t - B(b)) / (fo * SPB)), v = pi * (1 - po);
    if (v > o) { o = v; pin = a == null ? 1 : spr(t - B(a), 0.36, 0.86); }
  }
  return [o, pin];
}
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgbStr = (c) => `rgb(${c.map((v) => Math.round(clamp(v, 0, 255))).join(",")})`;
const mixHex = (a, b, p) => rgbStr(hexRGB(a).map((v, i) => v + (hexRGB(b)[i] - v) * clamp(p)));
const px = (v) => v.toFixed(2) + "px";

// ---------- DOM ----------
const $ = (id) => document.getElementById(id);
const stage = $("stage"), world = $("world"), scr = $("screen");
stage.style.width = W + "px"; stage.style.height = H + "px";
$("wmask").style.webkitMaskImage = $("wmask").style.maskImage = `linear-gradient(to bottom, transparent ${LAY.mask}px, #000 ${LAY.mask + 44}px)`;
const IC = (n, s, c = "currentColor", st = "") => `<span class="ic" style="width:${s}px;height:${s}px;color:${c};${st}">${window.UI_ICONS[n]}</span>`;
const AVS = { julia: "img/julia.webp", jacob: "img/jacob.webp", teo: "img/teo.webp" };
const AV = (who, s, st = "") => `<span class="av" style="width:${s}px;height:${s}px;${st}"><img src="${AVS[who]}" alt=""></span>`;
// the task status icons (TaskStatusIcon.tsx), in their theme colors
const STATUS = {
  ns: ["task-created", "var(--st-ns)", "Not Started"], ip: ["task-in-progress", "var(--st-ip)", "In Progress"],
  rv: ["task-in-review", "var(--st-rv)", "In Review"], dn: ["task-completed-fill", "var(--st-dn)", "Completed"],
  cx: ["task-canceled-fill", "var(--ink1)", "Canceled"],
};
const ST = (k, s) => IC(STATUS[k][0], s, STATUS[k][1]);

// A layer: a world-space element with visibility windows; it swaps in and out with a short blur. `clip` clips it to the
// shell (so a state is revealed by the shape growing around it), `pop` scales it in from 95.5%, `dy` rises it in.
const LAYERS = [];
function L(id, box, html, o = {}) {
  const el = document.createElement("div");
  el.className = "L" + (o.cls ? " " + o.cls : "");
  if (id) el.id = id;
  const st = [];
  if (box) { st.push(`left:${box[0]}px`, `top:${box[1]}px`); if (box[2] != null) st.push(`width:${box[2]}px`); if (box[3] != null) st.push(`height:${box[3]}px`); }
  if (o.style) st.push(o.style);
  el.setAttribute("style", st.join(";"));
  el.innerHTML = html;
  (o.parent ? (typeof o.parent === "string" ? $(o.parent) : o.parent) : world).appendChild(el);
  const R = { el, box: box ? box.slice() : null, wins: o.wins || [[null, null]], clip: !!o.clip, pop: o.pop, dy: o.dy || 0, blur: o.blur ?? 9, at: o.at, origin: o.origin };
  if (o.origin) el.style.transformOrigin = o.origin;
  LAYERS.push(R);
  return R;
}
// world position of an element (layout boxes, so the camera's transform doesn't matter)
function wpos(el) {
  if (typeof el === "string") el = $(el.replace(/^#/, ""));
  let x = 0, y = 0, n = el;
  while (n && n !== world) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return [x, y, el.offsetWidth, el.offsetHeight];
}
// a target: [x, y], "#id" (its center), or ["#id", fx, fy, dx, dy]
function tgt(v) {
  if (Array.isArray(v) && typeof v[0] === "number") return v;
  const [id, fx = 0.5, fy = 0.5, dx = 0, dy = 0] = Array.isArray(v) ? v : [v];
  const [x, y, w, h] = wpos(id);
  return [x + w * fx + dx, y + h * fy + dy];
}

// ---------- the shell, camera, cursor, keycaps, captions ----------
let SHELL = null, CAM = null, CUR = null;
const KEYS = [], CAPS = [], CUES = [];
const cue = (b, type, gain = 1, extra = {}) => CUES.push({ t: Math.max(0, B(b)), type, gain, ...extra });
// shell: named states {name: [x, y, w, h, radius, color]} and keys [[beat, name, beats to 97%, damping]]
function shellOf(states, keys) {
  const el = document.createElement("div"); el.className = "shell"; world.insertBefore(el, world.firstChild);
  const comp = (i) => tr(keys.map(([b, n, d, z]) => [b, states[n][i], d, z]));
  const ch = [0, 1, 2].map((c) => tr(keys.map(([b, n, d, z]) => [b, hexRGB(states[n][5])[c], d, z])));
  SHELL = { el, x: comp(0), y: comp(1), w: comp(2), h: comp(3), r: comp(4), ch, cur: null };
  keys.slice(1).forEach(([b]) => { cue(b, "swish", 0.22); if (MUSIC.edits) MUSIC.edits.push(+(b - 1).toFixed(2)); });
}
function shellFx(t) {
  const S = SHELL, c = { x: S.x(t), y: S.y(t), w: S.w(t), h: S.h(t), r: S.r(t) };
  S.cur = c;
  Object.assign(S.el.style, { left: px(c.x), top: px(c.y), width: px(c.w), height: px(c.h), borderRadius: px(c.r), background: rgbStr(S.ch.map((f) => f(t))) });
}
function clipToShell(R) {
  const s = SHELL.cur, [lx, ly, lw, lh] = R.box;
  const tp = Math.max(0, s.y - ly), lf = Math.max(0, s.x - lx), rt = Math.max(0, lx + lw - (s.x + s.w)), bt = Math.max(0, ly + lh - (s.y + s.h));
  R.el.style.clipPath = `inset(${px(tp)} ${px(rt)} ${px(bt)} ${px(lf)} round ${px(s.r)})`;
}
// camera: keys [[beat, focus box [x, y, w, h, max scale?], beats to 97%, damping]]; the box is fit into SAFE
function cameraOf(keys) {
  const sc = (bx) => Math.min(SAFE.w / bx[2], SAFE.h / bx[3], bx[4] || LAY.maxS);
  CAM = {
    cx: tr(keys.map(([b, bx, d = 1.1, z = 0.9]) => [b, bx[0] + bx[2] / 2, d, z])),
    cy: tr(keys.map(([b, bx, d = 1.1, z = 0.9]) => [b, bx[1] + bx[3] / 2, d, z])),
    ls: tr(keys.map(([b, bx, d = 1.1, z = 0.9]) => [b, Math.log(sc(bx)), d, z])),
    cur: null,
  };
}
function camFx(t) {
  const s = Math.exp(CAM.ls(t)), cx = CAM.cx(t), cy = CAM.cy(t);
  CAM.cur = { s, X: SAFE.cx - cx * s, Y: SAFE.cy - cy * s };
  world.style.transform = `translate(${px(CAM.cur.X)},${px(CAM.cur.Y)}) scale(${s.toFixed(5)})`;
}
const toScr = (x, y) => [CAM.cur.X + x * CAM.cur.s, CAM.cur.Y + y * CAM.cur.s];
// cursor: keys [[arrival beat, target, beats of travel]]; clicks [beat, ...]
const CURSOR_SVG = `<svg viewBox="0 0 26 38" style="display:block;width:100%;height:100%;overflow:visible"><path d="M2.2 2.2 L2.2 29.6 L8.6 23.6 L12.9 33.9 L17.4 32 L13.2 22 L21.8 22 Z" fill="#0b0b0b" stroke="#fff" stroke-width="2.1" stroke-linejoin="round"/></svg>`;
function cursorOf(keys, clicks) {
  const el = document.createElement("div"); el.className = "cur"; el.innerHTML = CURSOR_SVG;
  el.style.width = px(LAY.cur * 26 / 38); el.style.height = px(LAY.cur); scr.appendChild(el);
  const P = keys.map(([b, v, d = 0.85]) => [b, tgt(v), d]);
  const kx = P.map(([b, p, d], i) => [i ? b - d : b, p[0], d, 0.9]), ky = P.map(([b, p, d], i) => [i ? b - d : b, p[1], d, 0.9]);
  CUR = { el, x: tr(kx), y: tr(ky), clicks };
  clicks.forEach((b) => cue(b, "click", 0.55));
}
function cursorFx(t) {
  const [sx, sy] = toScr(CUR.x(t), CUR.y(t));
  let press = 0; for (const b of CUR.clicks) press = Math.max(press, bell((t - B(b) + 0.07) / 0.2));
  CUR.el.style.transform = `translate(${px(sx)},${px(sy)}) scale(${(1 - 0.16 * press).toFixed(4)})`;
}
// keycaps: [beat, label, world anchor (the keycap's center), beats held]; the key goes down on the beat
function keyOf(b, label, anchor, hold = 1.2, type = "key") {
  const el = document.createElement("div"); el.className = "kc"; el.innerHTML = label; el.style.fontSize = px(LAY.key); scr.appendChild(el);
  KEYS.push({ el, b, anchor, hold }); cue(b, type, type === "enter" ? 0.7 : 0.6);
}
function keysFx(t) {
  for (const K of KEYS) {
    const [o, pin] = visOf(t, [[K.b - 0.5, K.b + K.hold, 0.36, 0.34]]);
    if (o <= 0.003) { K.el.style.display = "none"; continue; }
    K.el.style.display = "";
    if (!K.wh) K.wh = [K.el.offsetWidth, K.el.offsetHeight];
    const [sx, sy] = toScr(...tgt(K.anchor)), press = bell((t - B(K.b) + 0.05) / 0.22);
    const s = (0.9 + 0.1 * pin) * (1 - 0.07 * press);
    K.el.style.opacity = o.toFixed(4);
    K.el.style.filter = o < 0.995 ? `blur(${px((1 - o) * 8)})` : "";
    K.el.style.transform = `translate(${px(sx - K.wh[0] / 2)},${px(sy - K.wh[1] / 2 + 3 * press)}) scale(${s.toFixed(4)})`;
  }
}
// captions: [in beat, out beat, text]; caption 1 is up at t = 0 and comes back at the end, so the loop is seamless
function capOf(wins, text) {
  const el = document.createElement("div"); el.className = "cap"; el.textContent = text;

// =====================================================================
// boot
// =====================================================================
// The soundtrack: the kit's stock track by default; ?music=score swaps in the kit's composed score (audio/score.py),
// funk at the same 112 BPM, which needs no download. Its acts are 0-based beats: the drop lands on beat 2 (the first
// action), the groove runs to bar 7, and it settles as the UI returns to frame 0. The shell's morphs get swells.
const MUSIC = Q.get("music") === "score"
  ? { track: "score", bpm: BPM, beats: BEATS, vibe: "funk", seed: "macro-ui-" + AD, score: { turn: 1, groove: 1, release: 24, end: 28 }, edits: [] }
  : { track: "gimme-groove", bpm: BPM, beats: BEATS, vibe: "funk" };
let AdFx = null;
function init() {
  const ad = ADS[AD]();
  ad.wire();
  AdFx = ad.fx;
  // the wordmark
  const m = document.createElement("div"); m.className = "mark"; m.innerHTML = lockup(LAY.markH, "#f2f1ec"); m.style.top = px(LAY.markY - LAY.markH / 2); m.style.width = W + "px"; scr.appendChild(m);
  CUES.sort((a, b) => a.t - b.t);
}
function seek(tIn) {
  const t = clamp(tIn, 0, T);
  shellFx(t); camFx(t); layersFx(t); AdFx(t); keysFx(t); capsFx(t); cursorFx(t);
}
window.seek = seek; window.DURATION = T; window.CUES = CUES; window.B = B; window.MUSIC = MUSIC; window.FMT = [W, H];
const fontsReady = ['400 20px "Inter"', '500 20px "Inter"', '600 20px "Inter"', '330 40px "display"', '400 20px "mono"'].map((f) => document.fonts.load(f));
window.ready = Promise.all(fontsReady).then(() => document.fonts.ready)
  .then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {}))))
  .then(() => { init(); return Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); })
  .then(() => { seek(0); return true; });
if (Q.has("render")) document.documentElement.classList.add("render");
else {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); Object.assign(stage.style, { position: "fixed", left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${k})` }); };
  addEventListener("resize", fit); fit();
  const at = Q.has("t") ? parseFloat(Q.get("t")) : null;
  window.ready.then(() => { if (at != null) { seek(at); return; } const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
