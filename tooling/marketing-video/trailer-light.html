<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro Trailer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }

:root {
  --canvas: #ECEAE6;
  --ink: #0B0B0B;
  --ink2: #6C6862;
  --ink3: #A29E98;
  --fill: #F2F1EE;
  --hover: #F5F4F1;
  --hair: rgba(11, 11, 11, 0.08);
  --accent: #F58C34;
  --accent-ink: #B4580F;
  --accent-tint: #FDEAD9;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
html.render body { display: block; min-height: 0; }

#stage {
  position: relative; width: 1440px; height: 1440px; overflow: hidden; flex: none;
  background: var(--canvas); color: var(--ink);
  font-family: "Geist", system-ui, sans-serif; font-weight: 400;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
#shape { position: absolute; overflow: hidden; transform-origin: 50% 50%; }
.layer { position: absolute; transform-origin: 50% 50%; }
.a { position: absolute; }
.row-flex { display: flex; align-items: center; }
.nowrap { white-space: nowrap; }

/* shared bits */
.av { display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; flex: none; }
.chip { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; border-radius: 8px; font-weight: 560; font-size: 17px; white-space: nowrap; }
.chip.ac { background: var(--accent-tint); color: var(--accent-ink); }
.chip.gr { background: var(--fill); color: var(--ink2); }
.kc {
  display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px;
  border-radius: 7px; border: 1.5px solid rgba(11,11,11,.12); border-bottom-width: 2.5px;
  font-size: 13px; font-weight: 600; color: var(--ink2); background: #fff;
}
.caret { display: inline-block; width: 2px; height: 22px; background: var(--ink); border-radius: 1px; margin-left: 1px; }

/* inbox */
.row { left: 8px; width: 584px; height: 72px; }
.rowbg { left: 0; right: 0; top: 4px; bottom: 4px; border-radius: 16px; background: var(--hover); opacity: 0; }
.tile { left: 16px; top: 16px; width: 40px; height: 40px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; justify-content: center; }
.rt { left: 68px; top: 13px; font-size: 18px; font-weight: 620; white-space: nowrap; letter-spacing: -0.005em; }
.rs { left: 68px; top: 38px; font-size: 16px; color: var(--ink2); white-space: nowrap; }
.rtime { right: 20px; top: 15px; font-size: 15px; color: var(--ink3); white-space: nowrap; }

/* messages */
.msg { left: 0; width: 600px; }
.nm { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; font-size: 16px; }
.nm b { font-weight: 620; }
.nm span { font-size: 14px; color: var(--ink3); }
.body { display: flex; align-items: center; gap: 6px; font-size: 18px; white-space: nowrap; height: 28px; }
.att { width: 360px; height: 64px; border-radius: 16px; border: 1.5px solid var(--hair); background: #FAF9F7; transform-origin: 50% 50%; }
.att-ic { left: 11px; top: 11px; width: 40px; height: 40px; border-radius: 11px; background: #fff; border: 1.5px solid var(--hair); display: flex; align-items: center; justify-content: center; }
.att-t { left: 64px; top: 11px; font-size: 17px; font-weight: 620; white-space: nowrap; }
.att-s { left: 64px; top: 34px; font-size: 14px; color: var(--ink3); white-space: nowrap; }

/* doc */
.dl { font-size: 20px; line-height: 30px; white-space: nowrap; }
.item { display: flex; align-items: center; gap: 12px; font-size: 20px; white-space: nowrap; height: 30px; }
.box { width: 22px; height: 22px; border-radius: 7px; border: 1.75px solid var(--ink3); flex: none; margin-right: 8px; }

/* task */
.segl { top: 0; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 560; white-space: nowrap; }

/* palette */
.prow { left: 0; width: 600px; height: 52px; }
.pic { left: 26px; top: 16px; color: var(--ink2); }
.plab { left: 60px; top: 14px; font-size: 18px; font-weight: 520; white-space: nowrap; }
.phint { right: 22px; top: 13px; display: flex; gap: 4px; }

#curPos { position: absolute; left: 0; top: 0; width: 160px; height: 160px; transform-origin: 80px 80px; pointer-events: none; }
#curRot { position: absolute; left: 80px; top: 80px; width: 0; height: 0; transform-origin: 0 0; }
#cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><div id="shape"></div></div>
  <svg width="0" height="0" style="position:absolute"><filter id="mb" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter></svg>
  <div id="curPos"><div id="curRot">
    <svg id="cursor" viewBox="-2 -2 18 26" width="18" height="26" overflow="visible">
      <path d="M1 1 L1 18.2 L5.1 14.4 L8.2 21.2 L11.2 19.9 L8.2 13.3 L13.9 13.3 Z" fill="#0B0B0B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </svg></div></div>
</div>
<script>
"use strict";
// =====================================================================
// Macro trailer: one shape, never cut. Every style is a pure function
// of time computed in seek(t). No transitions, no timers, no state.
// =====================================================================

// ---------- timing ----------
const BPM = 120, BEAT = 60 / BPM, BEATS = 28, T = BEATS * BEAT; // 7 bars
const B = (x) => x * BEAT;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const TAU = Math.PI * 2;

// Closed-form unit step response of a damped spring.
// resp = undamped period (s), damp = damping ratio (<1 gives a tiny overshoot).
function spr(t, resp = 0.42, damp = 0.82) {
  if (t <= 0) return 0;
  const w = TAU / resp;
  if (damp >= 1) { const e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  const wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return 1 - e * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
// Free response from displacement x0 and velocity v0 (used after a drag release).
function free(t, x0, v0, resp, damp) {
  const w = TAU / resp, wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return e * (x0 * Math.cos(wd * t) + ((v0 + damp * w * x0) / wd) * Math.sin(wd * t));
}
const mj = (x) => { x = clamp(x); return x * x * x * (10 + x * (-15 + 6 * x)); }; // minimum-jerk
const bell = (x) => (x <= 0 || x >= 1 ? 0 : 16 * x * x * (1 - x) * (1 - x));

// A value that changes target many times is the sum of one spring per change.
// Periodic: every change also contributes from the previous loop (t + T), so the
// last frame flows into the first with matching position and velocity.
function Track(evs, resp = 0.42, damp = 0.82) {
  const E = evs.map(([bt, v, r, d]) => ({ t: B(bt), v, r: r ?? resp, d: d ?? damp }));
  const n = E.length;
  E.forEach((e, i) => { e.dv = e.v - E[(i + n - 1) % n].v; });
  const base = E[n - 1].v;
  const f = (t) => {
    let v = base;
    for (const e of E) if (e.dv !== 0) v += e.dv * (spr(t - e.t, e.r, e.d) + spr(t + T - e.t, e.r, e.d));
    return v;
  };
  f.target = (t) => {
    let best = -Infinity, v = base;
    for (const e of E) for (const tt of [e.t, e.t - T]) if (tt <= t && tt > best) { best = tt; v = e.v; }
    return v;
  };
  return f;
}

// Cursor path: sum of minimum-jerk moves, each with a slight perpendicular arc.
function Path(segs) {
  const S = segs.map(([b0, b1, x, y, bow]) => ({ t0: B(b0), t1: B(b1), x, y, bow: bow ?? 0.07 }));
  const n = S.length;
  S.forEach((s, i) => { const p = S[(i + n - 1) % n]; s.dx = s.x - p.x; s.dy = s.y - p.y; });
  const bx = S[n - 1].x, by = S[n - 1].y;
  return (t) => {
    let x = bx, y = by;
    for (const s of S) for (const tt of [t, t + T]) {
      const u = (tt - s.t0) / (s.t1 - s.t0);
      if (u <= 0) continue;
      const m = mj(u), bb = bell(u) * s.bow;
      x += s.dx * m - s.dy * bb;
      y += s.dy * m + s.dx * bb;
    }
    return [x, y];
  };
}

// Content enter/exit: its own timing, so swapped text never overlaps.
function visAmt(t, tin, tout, inResp = 0.3) {
  const f = (tt) => {
    if (tt < tin) return null;
    const pin = spr(tt - tin, inResp, 1);
    const pout = tout == null ? 0 : sm((tt - tout) / 0.11);
    return { pin, pout, o: pin * (1 - pout) };
  };
  let r = f(t) || { pin: 0, pout: 0, o: 0 };
  if (tout != null && tout > T) { // only windows that wrap past the loop point
    const r2 = f(t + T);
    if (r2 && r2.o > r.o) r = r2;
  }
  return r;
}

// ---------- palette ----------
const INK = [11, 11, 11], WHITE = [255, 255, 255], ACC = [245, 140, 52], INK2 = [108, 104, 98], INK3 = [162, 158, 152];
const mixc = (a, b, p) => `rgb(${Math.round(lerp(a[0], b[0], p))},${Math.round(lerp(a[1], b[1], p))},${Math.round(lerp(a[2], b[2], p))})`;
const mix3 = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];

// ---------- icons (one set, one stroke weight in world px) ----------
const ICON = {
  mail: '<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="m3.8 7.6 8.2 5.6 8.2-5.6"/>',
  hash: '<path d="M4.5 9h15M4.5 15h15M10 4 8.4 20M15.6 4 14 20"/>',
  task: '<circle cx="12" cy="12" r="8.5"/><path d="m8.6 12.3 2.3 2.3 4.6-4.8"/>',
  doc: '<path d="M13.5 3h-6A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5v-10z"/><path d="M13.5 3v5.5H19M9 13h6M9 16.8h4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  spark: '<path d="M12 4.5c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7z"/>',
  share: '<path d="M12 14.5V3.8M8 7.6l4-3.8 4 3.8"/><path d="M5.5 11.5v6A2.5 2.5 0 0 0 8 20h8a2.5 2.5 0 0 0 2.5-2.5v-6"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  cmd: '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
  enter: '<path d="M19 5v6.5a3 3 0 0 1-3 3H6"/><path d="m9.5 11-3.5 3.5L9.5 18"/>',
  up: '<path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
};
const STROKE = 1.6; // world px, identical for every icon at every size
function icon(name, size, color = "currentColor", sw = STROKE) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${(sw * 24 / size).toFixed(3)}" stroke-linecap="round" stroke-linejoin="round" style="display:block">${ICON[name]}</svg>`;
}
const MARK = [
  "M0 10.014v6.801a.75.75 0 0 0 .225.513l2.742 2.644 2.002-.8v-7.099l-2.97-2.859z",
  "M4.078 4.8v5.786l1.36 1.309v1.313L12.481 20l2.002-.8-.001-7.1L6.078 4z",
  "M13.594 4.8v5.786l1.36 1.311-.013 1.3L22 20 24 19.2V12.42a.75.75 0 0 0-.225-.533L15.595 4z",
];
const markSVG = (size, color, only) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="display:block">${(only == null ? MARK : [MARK[only]]).map((d) => `<path d="${d}"/>`).join("")}</svg>`;

const AV = { ana: ["#E7E3DD", "#0B0B0B", "A"], sam: ["#2B2926", "#FFFFFF", "S"], lee: ["#CFCAC2", "#0B0B0B", "L"] };
const avatar = (k, size) => { const [bg, fg, ch] = AV[k]; return `<div class="av" style="width:${size}px;height:${size}px;background:${bg};color:${fg};font-size:${Math.round(size * 0.42)}px">${ch}</div>`; };
const macroAv = (size) => `<div class="av" style="width:${size}px;height:${size}px;background:#0B0B0B;border-radius:${Math.round(size * 0.3)}px">${markSVG(Math.round(size * 0.58), "#fff")}</div>`;
const stack = (size) => `<div class="row-flex">${["ana", "sam", "lee"].map((k, i) => `<div style="margin-left:${i ? -8 : 0}px;border-radius:50%;box-shadow:0 0 0 2px #fff">${avatar(k, size)}</div>`).join("")}</div>`;

// ---------- world geometry ----------
const TC = { x: -40, y: 50 };                       // task / command palette center
const DOC = [-320, -340, 320, 340];
const PMAX = 640;                                    // pane width at 50/50
const LR = {                                         // layer rects [x, y, w, h] in world px
  btn: [-126, -38, 252, 76],
  loader: [-38, -38, 76, 76],
  mark: [-64, -64, 128, 128],
  inbox: [-300, -150, 600, 292],
  chan: [-300, -246, 600, 476],
  doc: [-320, -340, 640, 680],
  pane: [320, -340, 640, 680],
  task: [TC.x - 280, TC.y - 136, 560, 272],
  key: [TC.x - 58, TC.y - 58, 116, 116],
  pal: [TC.x - 300, TC.y - 203, 600, 406],
  toast: [-186, -38, 372, 76],
};

// Shape keyframes: [beat, x0, y0, x1, y1, radius, color(0 black .. 1 white)]
const TK = LR.task, PL = LR.pal;
const KF = [
  [0, -131, -40, 131, 40, 40, 0],                    // hover lift
  [2, -38, -38, 38, 38, 38, 0],                      // loader
  [3, -64, -64, 64, 64, 32, 0],                      // mark
  [4, -300, -150, 300, -2, 28, 1],                   // inbox, 1 row
  [5, -300, -150, 300, 70, 28, 1],                   // 2 rows
  [6, -300, -150, 300, 142, 28, 1],                  // 3 rows
  [7.3, -300, -150, 300, 70, 28, 1],                 // row done, collapsed
  [8, -300, -14, 300, 230, 28, 1],                   // channel
  [11, -300, -90, 300, 230, 28, 1],
  [12, -300, -166, 300, 230, 28, 1],
  [13, -300, -240, 300, 230, 28, 1],
  [14, DOC[0], DOC[1], DOC[2], DOC[3], 24, 1],       // doc
  [20, TK[0], TK[1], TK[0] + TK[2], TK[1] + TK[3], 28, 1], // task
  [24, LR.key[0], LR.key[1], LR.key[0] + 116, LR.key[1] + 116, 30, 0], // ⌘K key
  [24.5, PL[0], PL[1], PL[0] + 600, PL[1] + 406, 24, 1],   // palette, 6 rows
  [25, PL[0], PL[1], PL[0] + 600, PL[1] + 250, 24, 1],     // "s": 3 rows
  [25.25, PL[0], PL[1], PL[0] + 600, PL[1] + 146, 24, 1],  // "sh": 1 row
  [26, -186, -38, 186, 38, 38, 0],                   // toast
  [27, -126, -38, 126, 38, 38, 0],                   // button (= frame 0)
];
const SH = [0.42, 0.82];
const X0 = Track(KF.map((k) => [k[0], k[1]]), ...SH);
const Y0 = Track(KF.map((k) => [k[0], k[2]]), ...SH);
const X1 = Track(KF.map((k) => [k[0], k[3]]), ...SH);
const Y1 = Track(KF.map((k) => [k[0], k[4]]), ...SH);
const RAD = Track(KF.map((k) => [k[0], k[5]]), ...SH);
const COL = Track(KF.map((k) => [k[0], k[6]]), 0.2, 1);

function tap(t, at, depth, down = 0.14, up = 0.22) {
  return depth * (spr(t - at + 0.025, down, 1) - spr(t - at - 0.08, up, 0.8));
}
const shapePress = (t) => tap(t, B(1), 0.045) + tap(t, B(24.25), 0.07);

// ---------- cursor ----------
const CUR = Path([
  [1.25, 1.95, 88, 92],          // step aside for the loader
  [3.3, 4.6, 214, 196],          // below the inbox card
  [6.0, 6.85, -256, -50],        // row 1 checkbox
  [7.35, 7.92, -118, -48],       // #launch row (now in slot 0)
  [8.2, 8.95, 262, 268],         // out of the way while typing
  [13.2, 13.9, -120, 76],        // doc chip
  [14.3, 15.85, 322, 6],         // doc right edge
  [16.06, 17.96, 1052, 16, 0.012], // drag past max
  [18.04, 18.7, 1080, 18, 0],    // tug
  [19.06, 19.9, TC.x - 172, TC.y],       // Press kit
  [20.2, 20.9, TC.x, TC.y + 12],         // In progress
  [21.2, 21.9, TC.x + 179, TC.y + 12],   // Done
  [22.2, 22.95, 206, 236],       // rest below the card
  [24.1, 24.7, 330, 300],        // clear the palette
  [27.15, 27.95, 50, 17],        // glide back onto the button
]);
const CLICKS = [1, 7, 8, 14, 20, 21, 22].map(B);
const GRAB = B(16), REL = B(19), SPLIT_END = B(20);
function cursorPress(t) {
  let p = 0;
  for (const c of CLICKS) p += spr(t - c + 0.035, 0.12, 1) - spr(t - c - 0.07, 0.16, 0.9);
  p += spr(t - GRAB + 0.035, 0.12, 1) - spr(t - REL, 0.16, 0.9);
  return clamp(p, 0, 1.1);
}

// ---------- split drag: direct manipulation + rubber band + spring back ----------
function rubber(raw) {
  if (raw <= PMAX) return Math.max(0, raw);
  const L = 200, c = 0.55, o = raw - PMAX;
  return PMAX + L * (1 - 1 / (o * c / L + 1));
}
const GRAB_X = CUR(B(16))[0];
const paneRaw = (t) => CUR(t)[0] - GRAB_X; // direct manipulation: offset from where it was grabbed
const REL_X0 = rubber(paneRaw(REL)) - PMAX;
const REL_V0 = (rubber(paneRaw(REL)) - rubber(paneRaw(REL - 0.002))) / 0.002;
function paneW(t) {
  if (t < GRAB) return 0;
  if (t <= REL) return rubber(paneRaw(t));                           // held: follows the cursor
  if (t < SPLIT_END) return PMAX + free(t - REL, REL_X0, REL_V0, 0.36, 0.74); // released: springs back
  return PMAX * (1 - spr(t - SPLIT_END, ...SH));                    // folds into the task card
}
const dragDelta = (t) => (t < GRAB ? 0 : paneW(t));

// ---------- camera: zooms so each state fills the frame ----------
const CAMSPEC = [[0, { s: 3.0 }], [2, { s: 4.4 }], [3, { s: 3.4 }], [4, { fill: 0.84 }], [16, { fill: 0.9, cur: true }],
  [20, { fill: 0.84 }], [24, { s: 3.5 }], [24.5, { fill: 0.84 }], [26, { s: 2.7 }], [27, { s: 3.0 }]];
function camTarget(t) {
  const bt = t / BEAT;
  let sp = CAMSPEC[0][1];
  for (const [b0, s] of CAMSPEC) if (b0 <= bt) sp = s;
  const x0 = X0.target(t), y0 = Y0.target(t), y1 = Y1.target(t);
  // during the drag the camera leads by LEAD seconds so the pane never runs out of frame
  const LEAD = 0.14, td = Math.min(t + LEAD, SPLIT_END - 1e-4);
  let x1 = X1.target(t) + (t >= GRAB - LEAD && t < SPLIT_END ? paneW(td) : 0);
  if (sp.cur && t >= GRAB && t < SPLIT_END) x1 = Math.max(x1, CUR(td)[0] + 40);
  const s = sp.s ?? (sp.fill * 1440) / Math.max(x1 - x0, y1 - y0);
  return [Math.log(s), (x0 + x1) / 2, (y0 + y1) / 2];
}
// The camera follows its target through a spring. The target is sampled into a
// fine staircase; the spring response to a staircase is still a smooth, pure
// function of time (sum of closed-form steps).
const CAM_RATE = 240, CAM_N = Math.round(T * CAM_RATE), CR = 0.52, CD = 0.92;
const camEv = [[], [], []];
const camBase = camTarget((CAM_N - 1) / CAM_RATE);
(() => {
  let prev = camBase;
  for (let i = 0; i < CAM_N; i++) {
    const tt = i / CAM_RATE, v = camTarget(tt);
    for (let k = 0; k < 3; k++) { const dv = v[k] - prev[k]; if (Math.abs(dv) > 1e-9) camEv[k].push([tt, dv]); }
    prev = v;
  }
})();
function camAt(t) {
  const out = [0, 0, 0];
  for (let k = 0; k < 3; k++) {
    let v = camBase[k];
    for (const [te, dv] of camEv[k]) v += dv * (spr(t - te, CR, CD) + spr(t + T - te, CR, CD));
    out[k] = v;
  }
  return out;
}

// ---------- intra-state tracks (resets happen while hidden) ----------
const COUNT = Track([[4, 1], [5, 2], [6, 3], [7.3, 2], [9, 1]], 0.34, 0.86);
const SLOT1 = Track([[2, 1], [7.3, 0]], ...SH);

  if (swap(L.mark, t, 3.0, 4.0, 0) > 0) {
    [0, 1, 2].forEach((k) => {
      const t0 = B(3) + 0.02 + k * 0.055, p = spr(t - t0, 0.28, 0.8);
      fx(E["mk" + k], t < t0 ? 0 : clamp(p * 1.5), (1 - clamp(p)) * BLUR,
        `translate3d(0,${px((1 - p) * 12)},0) scale(${(0.7 + 0.3 * p).toFixed(4)})`);
    });
  }

  // ----- inbox -----
  if (swap(L.inbox, t, 4.02, 8.0, 0) > 0) {
    E.odo.style.transform = `translate3d(0,${px(-COUNT(t) * 28)},0)`;
    const slots = [0, SLOT1(t), SLOT2(t)];
    [0, 1, 2].forEach((i) => {
      const el = E["r" + i];
      el.style.top = px(64 + 72 * slots[i]);
      const tin = B(4 + i), p = spr(t - tin, 0.36, 0.84);
      const pout = i === 0 ? sm((t - B(7.22)) / 0.13) : 0;
      fx(el, t < tin ? 0 : clamp(p * 1.3) * (1 - pout), ((1 - clamp(p)) + pout) * BLUR,
        `translate3d(0,${px((1 - p) * 18 - pout * 8)},0)`);
    });
    // row 1 hover → checkbox + "Done E"; click on the beat
    const hov = sm((t - B(6.62)) / 0.09);
    E.r0bg.style.opacity = hov.toFixed(3);
    E.r0tile.style.opacity = (1 - hov).toFixed(3);
    E.r0cb.style.opacity = hov.toFixed(3);
    E.r0time.style.opacity = (1 - hov).toFixed(3);
    E.r0hint.style.opacity = hov.toFixed(3);
    E.r0hint.style.transform = `translate3d(${px((1 - hov) * 6)},0,0)`;
    const fillP = spr(t - B(7), 0.2, 1);
    E.r0fill.style.opacity = fillP.toFixed(3);
    E.r0fill.style.transformOrigin = "20px 20px";
    E.r0fill.style.transform = `scale(${(0.6 + 0.4 * fillP).toFixed(4)})`;
    E.r0ring.style.opacity = (1 - fillP).toFixed(3);
    E.r0chk.style.strokeDashoffset = (1 - sm((t - B(7) - 0.03) / 0.15)).toFixed(4);
    // row 2 hover + press
    const hov1 = sm((t - B(7.82)) / 0.08);
    E.r1bg.style.opacity = hov1.toFixed(3);
    E.r1bg.style.background = mixc([245, 244, 241], [236, 234, 230], clamp(tap(t, B(8), 1)));
  }

  // ----- channel -----
  if (swap(L.chan, t, 8.06, 14.0, 0) > 0) {
    const LTOP = LR.chan[1];
    E.chHdr.style.top = px(y0 - LTOP);
    const hS = H_SAM(t), hM = H_MAC(t);
    const bottom = 380, macTop = bottom - hM, samTop = macTop - hS, anaTop = samTop - 76;
    E.mAna.style.top = px(anaTop); E.mSam.style.top = px(samTop); E.mMac.style.top = px(macTop);
    swap(E.mAna, t, 8.12, null, 10);
    swap(E.mSam, t, 11.0, null, 16);
    swap(E.mMac, t, 12.0, null, 16);
    // thinking dots on 8th notes, then the draft
    const dv = visAmt(t, B(12.05), B(13));
    if (fx(E.dots, dv.o, dv.pout * BLUR)) {
      [0, 1, 2].forEach((k) => {
        const ph = ((bt - 12) * 2 - k * 0.22) % 1, pulse = Math.pow(Math.max(0, Math.sin(Math.PI * ((ph + 1) % 1))), 3);
        E["dot" + k].style.opacity = (0.35 + 0.65 * pulse).toFixed(3);
        E["dot" + k].style.transform = `translate3d(0,${px(-4 * pulse)},0)`;
      });
    }
    swap(E.macTxt, t, 13.04, null, 6);
    swap(E.macAtt, t, 13.1, null, 12);
    const chHov = sm((t - B(13.86)) / 0.08);
    E.chAtt.style.borderColor = mixc([232, 231, 229], [190, 186, 180], chHov);
    E.chAtt.style.transform = `scale(${(1 - tap(t, B(14), 0.035)).toFixed(4)})`;
    // composer: type "@macro", snap to a chip, finish the prompt, send
    const n1 = typed(bt, T1), n2 = typed(bt, T2), chip = bt >= 10, sent = bt >= 11;
    E.cph.style.display = n1 === 0 || sent ? "" : "none";
    E.cpre.style.display = !chip && n1 > 0 && !sent ? "" : "none";
    E.cpre.textContent = TYPE1.slice(0, n1);
    const cp = spr(t - B(10), 0.3, 0.72);
    E.cchip.style.display = chip && !sent ? "" : "none";
    E.cchip.style.transform = `scale(${(0.8 + 0.2 * cp).toFixed(4)})`;
    E.cchip.style.opacity = clamp(cp * 1.4).toFixed(3);
    E.crest.style.display = chip && !sent ? "" : "none";
    E.crest.textContent = TYPE2.slice(0, n2).replace(/^ /, "");
    const typing = (bt >= 8.9 && bt < 9.6) || (bt >= 10 && bt < 10.95);
    const blink = typing || (bt % 1) < 0.5;
    E.ccar.style.opacity = bt > 8.45 && !sent && blink ? "1" : "0";
    const hasText = n1 > 0 && !sent;
    E.csend.style.background = hasText ? "#0B0B0B" : "#F2F1EE";
    E.csendIc.style.color = hasText ? "#fff" : "#A29E98";
    E.csend.style.transform = `scale(${(1 - tap(t, B(11), 0.08)).toFixed(4)})`;
  }

  // ----- document -----
  if (swap(L.doc, t, 14.08, 20.0, 0) > 0) {
    write(E.dTitle, t, 14.22, 14.62);
    write(E.dMeta, t, 14.5, 14.8);
    write(E.dl0, t, 15.0, 15.3); write(E.dl1, t, 15.18, 15.48); write(E.dl2, t, 15.36, 15.62);
    swap(E.dHead, t, 15.5, null, 8);
    swap(E.di0, t, 15.62, null, 8); swap(E.di1, t, 15.72, null, 8); swap(E.di2, t, 15.82, null, 8);
    swap(E.dFoot, t, 15.9, null, 6);
    E.di0.style.background = "transparent";
  }

  // ----- split pane (revealed by the drag, clipped by the shape) -----
  const pw = dragDelta(t);
  const paneOn = t >= GRAB - 0.3 && bt < 20.5;
  if (paneOn) {
    const pout = sm((t - B(20)) / 0.11);
    fx(L.pane, 1 - pout, pout * BLUR);
    E.pDiv.style.opacity = clamp(pw / 30).toFixed(3);
    const hovH = sm((t - B(15.7)) / 0.1) * (1 - sm((t - REL - 0.15) / 0.2));
    const held = t >= GRAB && t <= REL ? 1 : 0;
    const over = Math.max(0, rubber(paneRaw(t)) - PMAX) * held + Math.max(0, pw - PMAX) * (1 - held);
    const hh = 56 + over * 0.9, hw = 6 - Math.min(2, over * 0.03);
    const hx = (x1 - LR.pane[0]) - 16;
    const H = E.pHandle.style;
    H.left = px(hx - hw / 2); H.width = px(hw); H.top = px(340 - hh / 2); H.height = px(hh); H.borderRadius = px(hw / 2);
    H.background = mixc([200, 196, 190], [11, 11, 11], clamp(held + tap(t, GRAB, 0)));
    H.opacity = hovH.toFixed(3);
  } else L.pane.style.display = "none";

  // ----- task: liquid status indicator -----
  if (swap(L.task, t, 20.08, 24.0, 0) > 0) {
    const iL = IND_L(t), iR = IND_R(t), acc = clamp(IND_C(t));
    const nat = IND_R.target(t) - IND_L.target(t), stretch = Math.max(0, (iR - iL) - nat);
    const ih = 44 - Math.min(7, stretch * 0.05);
    const I = E.segInd.style;
    I.left = px(iL); I.width = px(iR - iL); I.top = px(28 - ih / 2); I.height = px(ih); I.borderRadius = px(ih / 2);
    I.background = mixc(INK, ACC, acc);
    const on = mix3(WHITE, INK, acc);
    [[6, 140], [140, 364], [364, 498]].forEach(([a, b], k) => {
      const cov = clamp((Math.min(iR, b) - Math.max(iL, a)) / (b - a));
      E["segl" + k].style.color = mixc(INK2, on, cov);
    });
    const done = spr(t - B(22), 0.22, 1);
    E.tFill.style.opacity = done.toFixed(3);
    E.tFill.style.transformOrigin = "17px 17px";
    E.tFill.style.transform = `scale(${(0.5 + 0.5 * done).toFixed(4)})`;
    E.tRing.style.opacity = (1 - done).toFixed(3);
    E.tChk.style.strokeDashoffset = (1 - sm((t - B(22) - 0.04) / 0.16)).toFixed(4);
    pop(E.tAna, t, 23.0, null, 0.7);
    pop(E.tDue, t, 23.15, null, 0.7);
  }

  // ----- ⌘K key -----
  swap(L.key, t, 24.03, 24.5, 0);

  // ----- command palette -----
  if (swap(L.pal, t, 24.54, 26.0, 0) > 0) {
    const n3 = typed(bt, T3);
    E.pph.style.display = n3 ? "none" : "";
    E.ptx.textContent = TYPE3.slice(0, n3);
    E.pcar.style.opacity = (n3 > 0 && n3 < 5) || (bt % 1) < 0.5 ? "1" : "0";
    PROWS.forEach((_, i) => {
      const el = E["pr" + i];
      el.style.top = px(80 + 52 * P_SLOT[i](t));
      const tin = B(24.56) + i * 0.028, p = spr(t - tin, 0.32, 1);
      const pout = P_OUT[i] == null ? 0 : sm((t - B(P_OUT[i])) / 0.1);
      fx(el, t < tin ? 0 : p * (1 - pout), ((1 - p) + pout) * BLUR, `translate3d(0,${px((1 - p) * 10)},0)`);
    });
    E.penter.style.opacity = sm((bt - 25.25) * 6).toFixed(3);
    E.phl.style.background = mixc([242, 241, 238], [230, 228, 224], clamp(tap(t, B(26), 1)));
  }

  // ----- toast -----
  if (swap(L.toast, t, 26.05, 27.0, 0) > 0) {
    pop(E.toastChk, t, 26.06, null, 0.5);
    E.toastPath.style.strokeDashoffset = (1 - sm((t - B(26.1)) / 0.16)).toFixed(4);
  }

  // ----- cursor (world-anchored, drawn in screen space) -----
  const [wx, wy] = CUR(t);
  const sx = 720 + (wx - cx) * s, sy = 720 + (wy - cy) * s;
  const size = 36 * Math.sqrt(s);
  const cs = (size / 26) * (1 - 0.12 * cursorPress(t));
  // Directional blur for the in-subframe exposure (1/480 s at 180° with 4 subframes),
  // from the screen velocity of the pure path (camera motion included).
  const dt = 1 / 960, pa = screenPos(t - dt), pb = screenPos(t + dt);
  const vx = (pb[0] - pa[0]) / (2 * dt), vy = (pb[1] - pa[1]) / (2 * dt);
  const sigma = (Math.hypot(vx, vy) / 480) * 0.45, ang = (Math.atan2(vy, vx) * 180) / Math.PI;
  curPos.style.transform = `translate(${px(sx - 80)},${px(sy - 80)}) rotate(${ang.toFixed(3)}deg)`;
  curRot.style.transform = `rotate(${(-ang).toFixed(3)}deg)`;
  if (sigma > 0.25) { mbg.setAttribute("stdDeviation", `${sigma.toFixed(3)} 0`); curPos.style.filter = "url(#mb)"; }
  else curPos.style.filter = "none";
  cursorEl.style.transform = `scale(${cs.toFixed(4)}) translate(-3px,-3px)`;
  cursorEl.style.filter = `drop-shadow(0 ${px(1.2)} ${px(1.6)} rgba(0,0,0,.28))`;
}

// ---------- boot ----------
window.seek = seek;
window.probe = (t) => { t = ((t % T) + T) % T; const c = camAt(t), cu = CUR(t);
  return [X0(t), Y0(t), X1(t) + dragDelta(t), Y1(t), RAD(t), COL(t), Math.exp(c[0]), c[1], c[2], cu[0], cu[1], IND_L(t), IND_R(t)]; };
window.DURATION = T;
window.CUES = CUES;
window.BEAT_SEC = BEAT;
window.ready = Promise.all([
  document.fonts.load('400 20px "Geist"'), document.fonts.load('560 20px "Geist"'),
  document.fonts.load('620 20px "Geist"'), document.fonts.load('660 20px "Geist"'),
]).then(() => document.fonts.ready).then(() => { seek(0); return true; });

const params = new URLSearchParams(location.search);
if (params.has("render")) {
  document.documentElement.classList.add("render");
} else {
  // Preview only: fit to window and drive seek() from the audio clock (or wall clock).
  const fit = () => {
    const k = Math.min(innerWidth, innerHeight) / 1440;
    Object.assign(stage.style, { position: "fixed", left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${k})` });
  };
  addEventListener("resize", fit); fit();
  const audio = new Audio("macro-trailer-audio.m4a"); audio.loop = true;
  let t0 = performance.now(), useAudio = false;
  addEventListener("pointerdown", () => { audio.currentTime = 0; audio.play().then(() => { useAudio = true; }).catch(() => {}); t0 = performance.now(); });
  const at = params.has("t") ? parseFloat(params.get("t")) : null;
  window.ready.then(() => {
    if (at != null) { seek(at); return; }
    const loop = () => { seek(useAudio ? audio.currentTime : (performance.now() - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
