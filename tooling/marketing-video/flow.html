<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* v3 of the cream launch ad. Frame 0 is the winning Meta creative ("Notion wasn't built like Macro"; or the Slack
   or "Replace 27+ apps" opener). Its callout lines come alive and become a diagram: one demo call flows into the CRM,
   a task and the calendar; an agent picks up all of it and drafts the follow-up; the team picks it up; you send it
   and everything syncs. Then the diagram folds into one shared context and the end card (price, CTA, proof).
   ?cut=full|30|15  &hook=notion|slack|replace  &word=<tool>  &static=dark (opener stills only)  &fmt=916|45|11 */
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --bg: #f5f1e8; --rail: #efebe3; --panel: #e9e5dc; --surf: #ece8df; --tile: #dfdbd3; --ink: #1d1c1a; --body: #54524f; --lab: #72706c; --mut: #8f8c86;
  --ok: #2e9e5b; --warn: #f59e0b; --doc: #7c5cd6; --blue: #5b9be6; --claude: #d97757; --red: #e5484d; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
html.render body { display: block; min-height: 0; }
#stage { position: relative; overflow: hidden; flex: none; background: var(--bg); color: var(--ink);
  font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "cv11", "ss01"; }
#world, #screen, .layer { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.a { position: absolute; }
.flex { display: flex; align-items: center; }
.nowrap { white-space: nowrap; }
.ic { display: inline-block; flex: none; vertical-align: -3px; }
.lg svg { display: block; width: 100%; height: 100%; }
.slab { font-family: display; font-weight: 320; letter-spacing: -0.035em; line-height: 1; color: var(--ink); white-space: nowrap; }
.w { display: inline-block; }
.t1 { line-height: 1; white-space: nowrap; }
.card { position: absolute; background: var(--surf); border-radius: 30px; box-shadow: 0 10px 40px -12px #1d1c1a26; }

.node { position: absolute; transform-origin: 50% 50%; }
.ring { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: 0 0 0 1.5px #1d1c1a6b, 0 0 0 9px #1d1c1a0c; }

  box-shadow: 0 20px 44px -20px #1d1c1aa6, inset 0 1px 0 #ffffff26; }

// ---------- format, cut, opener ----------
// The canvas is 1080 wide. The opener poster sits at its top (the 1080×1350 creative grid fitted into the format);
// the diagram starts below it at Y0. A camera (center cx, cy and zoom z) flies over the canvas.
const Q = new URLSearchParams(location.search);
const FMT = Q.get("fmt") || "45", CUT = Q.get("cut") || "full", HOOK = Q.get("hook") || "notion";
const [W, H] = { "916": [1080, 1920], "45": [1080, 1350], "11": [1440, 1440] }[FMT];

const EDY = TALL ? -140 : 0;                                    // the "Replace 27+ apps" opener: keep its headline above the Reels caption
const Y0 = AH + 240;                                            // diagram origin on the canvas

// the riser bar (-1) so the first drop lands on beat 4, when the poster turns into the diagram.
// full: drop A (beats 4–44) filters down into the breakdown, its riser lands the second drop on Send (beat 52),
//       a breath, then the end card on a drop-B downbeat (beat 68). 80 beats = 48 s.
// 30:   drop A to beat 32, a breath, the end card hit. 44 beats = 26.4 s.   15: the same at beat 16. 24 beats = 14.4 s.
const SONG = "song-swish-swed-arulo-100.wav";
window.SONGS = { upA: [SONG, 45.6382], upB: [SONG, 120.0382], upC: [SONG, 144.0382] };
const MUSIC = {
  full: [["upA", 100.0, Array(44).fill(1), { lpEnd: [1.2, 16000, 420] }], ["upB", 100.0, Array(24).fill(1), { gapEnd: 0.15 }], ["upC", 100.0, Array(12).fill(1)]],
  "30": [["upA", 100.0, Array(32).fill(1), { gapEnd: 0.15 }], ["upC", 100.0, Array(12).fill(1)]],
  "15": [["upA", 100.0, Array(16).fill(1), { gapEnd: 0.12 }], ["upC", 100.0, Array(8).fill(1)]],

const STEP_T = [0];
for (const [, bpm, beats] of MUSIC) for (const n of beats) STEP_T.push(STEP_T[STEP_T.length - 1] + (n * 60) / bpm);

function stepAt(t) { let i = 0; while (i < BEATS - 1 && STEP_T[i + 1] <= t) i++; return i + (t - STEP_T[i]) / (STEP_T[i + 1] - STEP_T[i]); }

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const TAU = Math.PI * 2;

// Closed-form unit step response of a damped spring.
// resp = undamped period (s), damp = damping ratio (<1 gives a tiny overshoot).
function spr(t, resp = 0.42, damp = 0.82) {
  if (t <= 0) return 0;
  const w = TAU / resp;
  if (damp >= 1) { const e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  const wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return 1 - e * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
// Free response from displacement x0 and velocity v0 (what a flung carousel does after the thumb lifts).
function free(t, x0, v0, resp, damp) {
  const w = TAU / resp, wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return e * (x0 * Math.cos(wd * t) + ((v0 + damp * w * x0) / wd) * Math.sin(wd * t));
}

const bell = (x) => (x <= 0 || x >= 1 ? 0 : 16 * x * x * (1 - x) * (1 - x));
// A value that changes target several times: one spring per change (the film plays once, so no wrap-around).
function Tr(evs) {
  const E = evs.map(([b, v, r, d]) => ({ t: B(b), v, r: r ?? 1, d: d ?? 0.9 }));
  return (t) => { let v = E[0].v; for (let i = 1; i < E.length; i++) v += (E[i].v - E[i - 1].v) * spr(t - E[i].t, E[i].r, E[i].d); return v; };
}

// sound
// =====================================================================
const CUES = [];
function buildCues() {
  const cueT = (t, type, gain = 1, extra = {}) => CUES.push({ t, type, gain, ...extra });
  const cue = (b, type, gain, extra) => cueT(B(b), type, gain, extra);
  // the song's hits: the first drop (poster → diagram), the second drop on Send (full), the end card
  cue(4, "revcrash", 0.75); cue(4, "impact", 0.85); cue(4, "crash", 0.62, { seed: 724 });
  if (FULL) { cue(43.95, "downlift", 0.75); cue(44, "boom", 0.2); cue(52, "riser", 0.85, { dur: 2.4 }); cue(52, "revcrash", 0.85); cue(52, "impact", 1); cue(52, "crash", 0.8, { seed: 733 }); }
  else cue(S.sent, "impact", 0.5);
  cue(S.end, "revcrash", 1); cue(S.end, "impact", 1); cue(S.end, "crash", 0.85, { seed: 739 });
  // opener: pulses run down the callouts and tick as they land; the thumb taps Calendar
  S.pul.forEach((b, i) => { cueT(B(b), "swish", 0.08); cueT(B(b) + 0.5, "tick", 0.4, { pitch: DING[i] }); });
  cueT(B(S.lead) + 0.55, "blip", 0.28);
  cue(S.emph, "tick", 0.25, { pitch: 1.12 }); cue(S.tap, "tap", 0.9); cue(4.02, "swoosh", 0.6);
  // connectors: a swish as each draws, a tick as it lands, pitched up the scale
  WL.forEach((w, i) => {
    if (w.spoke) return;
    cueT(w.draw[0], "swish", 0.2);
    cueT(w.draw[0] + w.draw[1], "tick", 0.34, { pitch: DING[(i + 2) % 8] });
    w.ev.forEach(([t0]) => { cueT(t0, "swish", 0.16); cueT(t0 + w.edur, "tick", 0.38, { pitch: DING[(i + 4) % 8] * 1.12 }); });
  });
  NODES.forEach((k, i) => { const at = NODE_AT[k]; if (at != null) cueT(at + 0.02, "pop", 0.4, { pitch: [0.9, 1, 1.12, 1.26, 1.335, 0.95, 1.12, 1.26, 1.498][i % 9] }); });
  // the cursor
  CURS.forEach((c) => c.clicks.forEach((tc) => cueT(tc, "click", 0.75)));
  // call: the transcript fills in word by word, each phrase gets marked
  if (NODE.call) {
    TRL.forEach((l, i) => { const [b0, b1] = S.tr[i]; for (let k = 0; k < l.n; k++) cueT(B(b0) + (k / l.n) * (B(b1) - B(b0)), "tick", 0.05, { pitch: 1.6 + 0.03 * (k % 3) }); });
    S.hl.forEach((b, i) => { cue(b, "swish", 0.22); cue(b + 0.05, "tick", 0.3, { pitch: 1.26 + 0.12 * i }); });
  }
  if (NODE.crm) S.crmF.forEach((b, i) => cue(b, "tick", 0.4, { pitch: [1.26, 1.335, 1.498, 1.682][i] }));
  if (NODE.task) { cue(S.taskT[0], "swish", 0.15); cue(S.taskM, "pop", 0.3, { pitch: 1.4 }); }
  if (NODE.cal2) TEAM.forEach((_, i) => cueT(B(S.cal2A[0]) + i * S.cal2A[1], "pop", 0.26, { pitch: DING[i] * 1.2 }));
  // agent: context arrives chip by chip, then it drafts
  CHIP_T.forEach((ct, i) => { if (ct < 1e8) cueT(ct, "pop", 0.42, { pitch: DING[i + 1] * 1.12 }); });
  cue(S.drafting, "blip", 0.35);
  if (NODE.email) {
    cue(S.to, "pop", 0.35, { pitch: 1.2 }); cue(S.subj[0], "swish", 0.16);
    S.body.forEach((b) => cue(b, "swish", 0.13));
    cue(S.attach, "pop", 0.42, { pitch: 1.3 }); cue(S.badge, "chime", 0.32);
  }
  if (NODE.chat) { cue(S.msg1, "pop", 0.5, { pitch: 1.15 }); cue(S.msg2, "pop", 0.5, { pitch: 1.3 }); }
  if (NODE.doc) ITEMS.forEach((x, i) => { const a = B(S.items[i]), n = Math.min(14, x.length); for (let k = 0; k < n; k++) cueT(a + (k / n) * S.itemDur * 0.95 + (k % 3) * 0.008, "key", 0.18, { seed: 30 + i * 14 + k }); });
  if (S.ps) { const a = B(S.ps[0]), b = B(S.ps[1]), n = PS_TXT.length; for (let k = 0; k < n; k += 2) cueT(a + (k / n) * (b - a) + (k % 5) * 0.006, "key", 0.3, { seed: 60 + (k % 40) }); }
  if (S.pop) { cue(S.pop[0], "pop", 0.4, { pitch: 1.2 }); cue(S.pop[1], "swish", 0.12); }
  cueT(B(S.sent) + 0.02, "chime", 0.6);
  if (SYNC.task) cueT(SYNC.task + 0.05, "chime", 0.3);
  if (SYNC.chat) cueT(SYNC.chat + 0.05, "pop", 0.4, { pitch: 1.5 });
  // overview, hub, fold
  if (S.over) { cue(S.over[0] - 0.4, "swoosh", 0.4); NODES.forEach((_, i) => cueT(B(S.over[0]) + i * 0.06, "tick", 0.14, { pitch: 1.5 + 0.05 * i })); }
  cue(S.hub, "swoosh", 0.5);
  RING.forEach((r) => cueT(B(S.hub) + 0.35 + r.i * 0.045, "pop", 0.28, { pitch: DING[7 - (r.i % 8)] }));
  RING.forEach((r) => cueT(B(S.hub) + 1.0 + r.i * 0.07, "tick", 0.16, { pitch: 1.5 }));
  cue(S.fold, "swoosh", 0.45);
  // end card
  cueT(B(S.end) + 1.35, "pop", 0.5, { pitch: 1.0 }); [0, 1, 2].forEach((i) => cueT(B(S.end) + 2.05 + i * 0.12, "tick", 0.2, { pitch: 1.5 + 0.1 * i }));
}

// =====================================================================
// seek(t)
// =====================================================================
const hubQ = (k, t) => spr(t - B(S.hub) - (NODE[k].hi ?? 0) * 0.045, 0.62, 0.86);
function swap(a, b, t, at) {
  const p = t < at ? 0 : spr(t - at, 0.32, 0.8);
  fx(a, 1 - sm(p * 1.6), p * 4, `translate3d(0,${px(-p * 14)},0)`);
  fx(b, t < at ? 0 : clamp(p * 1.4), (1 - clamp(p)) * 4, `translate3d(0,${px((1 - p) * 14)},0)`);
}
const flash = (n, t, at) => { const u = t - at; n.style.background = u >= 0 && u < 2.5 ? `rgba(234,217,174,${(0.75 * Math.exp(-u * 2.2) * clamp(u / 0.05)).toFixed(3)})` : "transparent"; };

// node internals
const FXN = {
  cal(t) {
    const c = CURS[0] ? CURS[0].clicks[0] : 1e9, u = t - c, pr = u > -0.03 && u < 0.2 ? Math.sin(Math.PI * clamp((u + 0.03) / 0.2)) : 0;
    E.cJoin.style.transform = `scale(${(1 - 0.07 * pr).toFixed(4)})`;
  },
  call(t, at) {
    setHtml(E.kTime, mmss(724 + Math.max(0, t - at)));
    E.kRec.style.opacity = (0.5 + 0.5 * Math.cos(t * 5.5)).toFixed(3);
    TRL.forEach((l, i) => {
      const t0 = B(S.tr[i][0]), t1 = B(S.tr[i][1]);
      for (let k = 0; k < l.n; k++) {
        const tw = t0 + (k / l.n) * (t1 - t0), p = spr(t - tw, 0.22, 1);
        fx(E[`kL${i}w${k}`], t < tw ? 0 : clamp(p * 1.3), (1 - clamp(p)) * 4, `translate3d(0,${px((1 - p) * 6)},0)`);
      }
      E[`kL${i}p`].style.backgroundSize = `${(mj((t - B(S.hl[i])) / 0.3) * 100).toFixed(2)}% 48%`;
    });
    const spk = (i) => sm((t - B(S.tr[i][0]) + 0.1) / 0.15) * (1 - sm((t - B(S.tr[i][1]) - 0.15) / 0.2));
    E.kSpk0.style.opacity = Math.max(spk(0), spk(2)).toFixed(3); E.kSpk1.style.opacity = spk(1).toFixed(3);
  },
  crm(t) {
    S.crmF.forEach((b, i) => {
      if (i < 3 || SYNC.crm == null || t < SYNC.crm) { swap(E[`mV${i}a`], E[`mV${i}b`], t, B(b)); if (i === 3) show(E.mV3c, 0); }
      else { show(E.mV3a, 0); swap(E.mV3b, E.mV3c, t, SYNC.crm); }
      flash(E["mF" + i], t, i === 3 && SYNC.crm != null && t >= SYNC.crm ? SYNC.crm : B(b));
    });
  },
  task(t) {
    write(E.tT, t, B(S.taskT[0]), B(S.taskT[1]));
    pop(E.tM, t, B(S.taskM), 8);
    const dn = SYNC.task ?? 1e9, p = t < dn ? 0 : spr(t - dn, 0.3, 0.6);
    show(E.tS0, 1 - clamp(p * 2.5));
    if (t < dn) show(E.tS1, 0); else fx(E.tS1, clamp(p * 1.6), 0, `scale(${(0.4 + 0.6 * p).toFixed(4)})`);
    E.tT.style.color = t >= dn + 0.1 ? "var(--mut)" : "";
    if (show(E.tX, t >= dn + 0.1 ? 1 : 0)) E.tX.style.transform = `scaleX(${mj((t - dn - 0.1) / 0.28).toFixed(4)})`;
  },
  cal2(t) {
    TEAM.forEach((_, i) => popScale(E["c2a" + i], t, B(S.cal2A[0]) + i * S.cal2A[1], 0.4, 0.3, 0.6));
    pop(E.c2n, t, B(S.cal2A[0]) + 0.3, 6);
  },
  agent(t) {
    let n = 0;
    CHIP_T.forEach((ct, i) => { if (t >= ct) n++; popScale(E["gC" + i], t, ct, 0.5, 0.3, 0.62); });
    const dr = B(S.drafting), dd = WM.c9 ? WM.c9.draw[0] : 1e9, sent = SYNC.agent ?? 1e9;
    setHtml(E.gCnt, n === 0 ? "Reading the context" : t < dd ? `Reading ${n} source${n > 1 ? "s" : ""}` : `Used ${n} sources`);
    if (show(E.gSpin, t < dd ? 1 : 0)) E.gSpin.style.transform = `rotate(${((t * 300) % 360).toFixed(1)}deg)`;
    const o0 = t < dr ? 0 : clamp((t - dr) / 0.2) * (1 - sm((t - dd) / 0.15));
    if (fx(E.gO0, o0, 0, `translate3d(0,${px((1 - spr(t - dr, 0.3, 1)) * 8)},0)`)) E.gO0t.style.opacity = (0.55 + 0.45 * Math.cos((t - dr) * 6)).toFixed(3);
    fx(E.gO1, t < dd ? 0 : sm((t - dd) / 0.2) * (1 - sm((t - sent) / 0.15)), 0, "none");
    fx(E.gO2, t < sent ? 0 : sm((t - sent) / 0.2), 0, "none");
  },
  email(t) {
    pop(E.eTo, t, B(S.to), 6);
    write(E.eSubj, t, B(S.subj[0]), B(S.subj[1]));
    S.body.forEach((b, i) => write(E["eB" + i], t, B(b), B(b) + S.bodyDur));
    popScale(E.eAtt, t, B(S.attach), 0.85, 0.3, 0.7);
    popScale(E.eBadge, t, B(S.badge), 0.7, 0.3, 0.6);
    if (S.ps) {   // a person adds a line: typed, with a caret
      const a = B(S.ps[0]), b = B(S.ps[1]), on = t >= CURS[1].clicks[0];
      if (show(E.ePS, on ? 1 : 0)) {
        setHtml(E.ePSt, PS_TXT.slice(0, Math.round(PS_TXT.length * clamp((t - a) / (b - a)))));
        E.ePSc.style.opacity = t < b ? 1 : t < b + 1.5 && Math.floor((t - b) * 2.6) % 2 === 1 ? 1 : 0;
      }
    } else show(E.ePS, 0);
    if (S.pop) {   // the badge opens to show what the draft was built from
      const a = B(S.pop[0]), b = B(S.pop[1]), p = t < a ? 0 : spr(t - a, 0.32, 0.72), q = sm((t - b) / 0.18);
      if (fx(E.ePop, t < a ? 0 : clamp(p * 1.5) * (1 - q), 0, `translate3d(0,${px((1 - p) * -8 - q * 6)},0) scale(${(0.94 + 0.06 * p).toFixed(4)})`)) [0, 1, 2].forEach((i) => pop(E["ePr" + i], t, a + 0.12 + i * 0.09, 6));
    } else show(E.ePop, 0);
    const c = B(S.send), u = t - c, pr = u > -0.03 && u < 0.2 ? Math.sin(Math.PI * clamp((u + 0.03) / 0.2)) : 0;
    const st = B(S.sent), q = t < st ? 0 : spr(t - st, 0.3, 0.68);
    const hov = CURS[1] && t >= CURS[1].t0 && t <= CURS[1].t1 ? clamp(1 - Math.hypot(...curG(CURS[1], t).map((v, i) => v - [ANCH.eSend.x + ANCH.eSend.w / 2, ANCH.eSend.y + ANCH.eSend.h / 2][i])) / 70) : 0;
    fx(E.eSend, 1 - clamp(q * 2), 0, `scale(${(1 + 0.03 * hov * (1 - pr) - 0.07 * pr).toFixed(4)})`);
    E.eSend.style.background = hov > 0.5 && t < st ? "#000" : "var(--ink)";
    fx(E.eSent, t < st ? 0 : clamp(q * 1.6), 0, `scale(${(0.86 + 0.14 * q).toFixed(4)})`);
    if (t >= st && t < st + 0.7) { const r = (t - st) / 0.7; fx(E.eRing, (1 - sm(r)) * 0.85, 0, `scale(${(1 + 0.32 * mj(r)).toFixed(4)},${(1 + 0.75 * mj(r)).toFixed(4)})`); } else show(E.eRing, 0);
    swap(E.eH0, E.eH1, t, st + 0.12);
  },
  chat(t) {
    pop(E.hM0, t, B(S.msg1), 12);
    const ta = B(S.typing[0]), tb = B(S.typing[1]);
    if (show(E.hTy, t >= ta && t < tb ? 1 : 0)) [0, 1, 2].forEach((i) => { E["hD" + i].style.transform = `translateY(${px(-3.5 * Math.max(0, Math.sin((t - ta) * 9 - i * 0.9)))})`; });
    pop(E.hM1, t, B(S.msg2), 12);
    if (SYNC.chat != null) pop(E.hSy, t, SYNC.chat, 8); else show(E.hSy, 0);
  },
  doc(t) {
    ITEMS.forEach((x, i) => {
      const a = B(S.items[i]), b = a + S.itemDur;
      if (!show(E["dI" + i], t >= a - 0.15 ? 1 : 0)) return;
      setHtml(E["dT" + i], x.slice(0, Math.round(x.length * clamp((t - a) / (b - a)))));
      E["dC" + i].style.display = t < b + 0.12 && (i === ITEMS.length - 1 || t < B(S.items[i + 1]) - 0.15) ? "" : "none";
    });
  },
};

function nodeFx(k, t) {
  const n = NODE[k], at = NODE_AT[k];
  if (at == null || t < at) { show(n.el, 0); return; }
  const p = spr(t - at, 0.44, 0.78);
  let o = clamp(spr(t - at, 0.2, 1) * 1.3), tx = 0, ty = (1 - p) * 18, sc = 0.96 + 0.04 * p, blur = (1 - clamp(p)) * 5;
  if (t >= B(S.hub)) {   // fold into a disc on the ring (the agent into the center)
    const q = hubQ(k, t), tgt = k === "agent" ? HC : (() => { const r = RING.find((x) => x.k === k); return [r.rx, r.ry]; })();
    const sEnd = (k === "agent" ? 132 : 84) / Math.max(n.w, n.h);
    tx += (tgt[0] - n.cx) * q; ty += (tgt[1] - n.cy) * q; sc *= 1 - (1 - sEnd) * q; o *= 1 - sm(q / 0.55); blur += q * 3;
  }
  if (!fx(n.el, o, blur, `translate3d(${px(tx)},${px(ty)},0) scale(${sc.toFixed(4)})`)) return;
  let fl = 0;
  for (const h of n.hits) { const u = t - h; if (u >= 0 && u < 1) fl = Math.max(fl, Math.exp(-u * 4.5) * clamp(u / 0.05)); }
  E["r_" + k].style.opacity = (0.75 * fl).toFixed(3);
  FXN[k](t, at);
}

function wireFx(w, t, sw, ps, hubOut) {
  const [d0, d1] = w.draw;
  const p = t < d0 ? 0 : mj((t - d0) / d1);
  let o = w.spoke ? 1 - sm((t - B(S.fold) - 0.25) / 0.15) : hubOut;
  if (w.id === "c0") o *= 1 - sm((t - d0 - d1 - 1.4) / 0.5);
  if (p <= 0 || !show(w.g, o)) { show(w.g, 0); return; }
  // pulses: the one riding the draw, the ambient flow, and events
  const list = [];
  if (t < d0 + d1 + 0.15) list.push([mj((t - d0) / d1), Math.min(1, (d0 + d1 + 0.15 - t) / 0.15), 1, 1]);
  if (w.amb) {
    const { s, e, per, dur, ph, dir } = w.amb, k1 = Math.floor((t - s - ph) / per);
    for (let k = Math.max(0, k1 - 2); k <= k1; k++) {
      const t0 = s + ph + k * per, x = (t - t0) / dur;
      if (t0 > e - dur * 0.6 || x < 0 || x >= 1.2) continue;
      list.push([ease(clamp(x)), 0.5 * Math.min(1, x / 0.08, (1.2 - x) / 0.2), dir, 0.45]);
    }
  }
  for (const [t0, dir] of w.ev) { const x = (t - t0) / w.edur; if (x >= 0 && x < 1.2) list.push([ease(clamp(x)), Math.min(1, x / 0.06, (1.2 - x) / 0.2), dir, 1]); }
  let act = 0;
  list.forEach((q) => { act = Math.max(act, q[1] * q[3]); });
  if (w.spoke && t > B(S.fold)) {   // retract from the outside in, with the disc
    const f = clamp(spr(t - B(S.fold) - w.ri * 0.012, 0.36, 1));
    w.path.style.strokeDasharray = `0 ${(1000 * f).toFixed(1)} ${(1000 * (1 - f)).toFixed(1)} 1000`; w.path.style.strokeDashoffset = "0";
  } else { w.path.style.strokeDasharray = "1000 1000"; w.path.style.strokeDashoffset = (1000 * (1 - p)).toFixed(2); }
  w.path.style.strokeWidth = sw.toFixed(3);
  w.path.style.strokeOpacity = (0.24 + 0.24 * act).toFixed(3);
  const fo = w.spoke && t > B(S.fold) ? clamp(spr(t - B(S.fold) - w.ri * 0.012, 0.36, 1)) : 0;   // the fold takes the outer diamond with it
  const ea = clamp((t - d0) / 0.1) * (1 - 0.5 * fo), eb = t < d0 + d1 ? 0 : spr(t - d0 - d1, 0.26, 0.6);
  const pa = fo > 0 ? lutAt(w.L, fo) : w.a;
  w.da.setAttribute("transform", `translate(${pa[0].toFixed(2)} ${pa[1].toFixed(2)}) rotate(45) scale(${(ps * ea).toFixed(3)})`);
  w.db.setAttribute("transform", `translate(${w.b[0].toFixed(2)} ${w.b[1].toFixed(2)}) rotate(45) scale(${(ps * eb).toFixed(3)})`);
  w.pool.forEach((g, i) => { const q = list[i]; if (!q) { g.style.display = "none"; return; } pulseU(g, w.L, q[0], q[1], ps, q[2]); });
}

function posterFx(t) {
  const o = 1 - sm((t - B(S.w.c0[0]) - 0.6) / 0.5);
  if (!show(LP, o)) return;
  const em = sm((t - B(S.emph)) / 0.35), ps = 1.1;
  const tapS = (h) => (h < -0.05 ? 1 : 1 - 0.1 * Math.sin(Math.PI * clamp((h + 0.05) / 0.17)) + (h > 0.12 ? 0.14 * Math.exp(-(h - 0.12) * 6) * Math.sin(Math.min((h - 0.12) * 16, Math.PI)) : 0));
  if (!REPLACE) {
    CALL.forEach((c, i) => {
      pulseX(E["ap" + i], OPL[i], (t - B(S.pul[i])) / 0.5, 1, ps);
      E["acl" + i].style.strokeOpacity = (i === 3 ? 0.22 + 0.3 * em : 0.22 * (1 - 0.45 * em)).toFixed(3);
      E["acx" + i].style.opacity = (i === 3 ? 1 : 1 - 0.5 * em).toFixed(3);
      E["acd" + i].style.opacity = (i === 3 ? 1 : 1 - 0.4 * em).toFixed(3);
    });
    SIDE.forEach((_, si) => {
      const ci = CALL.findIndex((c) => c[3] === si);
      let s = 1, hal = 0;
      if (ci >= 0) { const h = t - (B(S.pul[ci]) + 0.5); if (h >= 0) { s += 0.16 * Math.exp(-h * 7) * Math.sin(Math.min(h * 18, Math.PI)); hal = 0.9 * Math.exp(-h * 4.5); } }
      if (si === 7) { const h = t - B(S.tap); s *= tapS(h); if (h > 0.12) hal = Math.max(hal, Math.exp(-(h - 0.12) * 2.5)); }
      E["as" + si].style.transform = `scale(${s.toFixed(4)})`;
      E["ash" + si].style.opacity = hal.toFixed(3);
    });
    pulseX(E.apL, LEADL, (t - B(S.lead)) / 0.55, 1, ps);
  } else {
    let ctr = 0;
    MODS.forEach((m, i) => {
      const k = MOD_ORDER.indexOf(i), d0 = B(0.5) + k * 0.05, p = mj((t - d0) / 0.45);
      E["es" + i].style.strokeDashoffset = (1000 * (1 - p)).toFixed(1);
      E["es" + i].style.strokeOpacity = (i === 0 ? 0.2 + 0.3 * em : 0.2 * (1 - 0.45 * em)).toFixed(3);
      [1.45, 2.4].forEach((b, wv) => pulseX(E[`ep${i}_${wv}`], ESL[i], (t - B(b) - k * 0.035) / 0.5, 0.9, ps));
      const hit = [1.45, 2.4].reduce((a, b) => { const h = t - (B(b) + k * 0.035 + 0.5); return a + (h > 0 ? 0.05 * Math.exp(-h * 9) * Math.sin(Math.min(h * 20, Math.PI)) : 0); }, 0);
      if (i === 0) E.em0.style.transform = `scale(${(tapS(t - B(S.tap)) * (1 + 0.06 * em)).toFixed(4)})`;
      else { E["em" + i].style.opacity = (1 - 0.45 * em).toFixed(3); E["eml" + i].style.opacity = (1 - 0.45 * em).toFixed(3); }
      ctr += hit;
    });
    E.ectr.style.transform = `scale(${(1 + Math.min(0.12, ctr)).toFixed(4)})`;
  }
}

function headerFx(t) {
  const e = B(S.end);
  show(E.band, sm((t - B(4.2)) / 0.35) * (1 - sm((t - e + 0.1) / 0.25)));
  const p1 = REPLACE ? 1 : spr(t - B(4.0), 0.62, 0.86), p2 = spr(t - e, 0.55, 0.88);
  const [sx, sy] = toS(AX, AY);
  let x = lerp(sx, HX, p1), y = lerp(sy, HY, p1), s = lerp(LS_A * CAM.z, LS_H, p1);
  x = lerp(x, EX, p2); y = lerp(y, EY, p2); s = lerp(s, LS_E, p2);
  fx(E.lock, REPLACE ? clamp(spr(t - B(4.3), 0.3, 1) * 1.3) : 1, 0, `translate3d(${px(x)},${px(y)},0) scale(${s.toFixed(5)})`);
  S.heads.forEach(([a, b, l1, l2], k) => [l1, l2].forEach((l, r) => {
    if (!l) return;
    l.split(" ").forEach((_, j) => {
      const d = r * 0.2 + j * 0.12 + 0.025 * Math.sin(j * 2.7 + k * 1.3);
      rise(E[`hd${k}${"ab"[r]}w${j}`], t, B(a + d), B(b) + r * 0.03 + j * 0.02, 34 + 6 * Math.sin(j + k), 12, 0.42 + 0.04 * Math.sin(j * 1.9 + k), 0.78);
    });
  }));
}

function endFx(t) {
  const e = B(S.end);
  if (!show(LX, t >= e - 0.05 ? 1 : 0)) return;
  const g = clamp(spr(t - e, 0.9, 1) * 1.1);
  fx(E.xglow, g, 0, `translate3d(${px(Math.sin(t * 0.7) * 14)},${px(Math.cos(t * 0.5) * 8)},0) scale(${(0.94 + 0.06 * g).toFixed(4)})`);
  ["Replace 27+ apps", "with a single system."].forEach((l, r) => l.split(" ").forEach((_, j) => rise(E[`xh${r}w${j}`], t, e + 0.3 + r * 0.14 + j * 0.06, null, 34, 12, 0.44, 0.8)));
  rise(E.xsub, t, e + 0.85, null, 18, 8);
  popScale(E.xcta, t, e + 1.35, 0.7, 0.42, 0.6);
  E.xarr.style.transform = `translateX(${px(5 * Math.max(0, Math.sin((t - e - 1.6) * 3.4)) * clamp((t - e - 1.6) / 0.3))})`;
  rise(E.xdemo, t, e + 1.7, null, 12, 6);
  [0, 1, 2].forEach((i) => { rise(E["xp" + i], t, e + 2.05 + i * 0.12, null, 10, 6); if (i) show(E["xs" + i], clamp((t - e - 2.05 - i * 0.12) / 0.2)); });
}

function handsFx(t) {
  {
    const td = B(S.tap), tu = td + 0.13;
    if (t < td - 0.07 || t > tu + 0.34) { show(E.touch, 0); show(E.tring, 0); }
    else {
      const [x, y] = toS(TAP[0] + 4, TAP[1] + 3);
      const appear = clamp((t - (td - 0.07)) / 0.07), lift = sm((t - tu) / 0.16), held = t >= td && t <= tu ? 1 : 0;
      fx(E.touch, appear * (1 - lift), 0, `translate3d(${px(x)},${px(y)},0) scale(${((1.25 - 0.25 * sm(appear)) * (1 - 0.1 * held) * (1 + 0.15 * lift)).toFixed(4)})`);
      if (t > tu) { const u = (t - tu) / 0.36; fx(E.tring, (1 - sm(u)) * 0.9, 0, `translate3d(${px(x)},${px(y)},0) scale(${(1 + 1.3 * mj(u)).toFixed(4)})`); } else show(E.tring, 0);
    }
  }
  let k = null;
  for (const q of CURS) if (t >= q.t0 && t <= q.t1) { k = q; break; }
  if (!k) { show(E.cur, 0); show(E.cring, 0); return; }
  let [x, y] = toS(...curG(k, t).map((v, i) => v + (i ? Y0 : 0)));
  const [jx, jy] = tremor(t, k.seed, 0.6); x += jx; y += jy;
  const o = clamp((t - k.t0) / 0.12) * (1 - clamp((t - (k.t1 - 0.2)) / 0.2));
  let press = 0, ring = null;
  for (const tc of k.clicks) { const u = t - tc; if (u > -0.02 && u < 0.14) press = Math.max(press, Math.sin(Math.PI * clamp((u + 0.02) / 0.16))); if (u >= 0 && u < 0.4) ring = u / 0.4; }
  fx(E.cur, o, 0, `translate3d(${px(x - 2)},${px(y - 2)},0) scale(${(1 - 0.1 * press).toFixed(4)})`);
  if (ring != null) fx(E.cring, (1 - ring) * 0.9 * o, 0, `translate3d(${px(x)},${px(y)},0) scale(${(0.3 + 0.9 * mj(ring)).toFixed(4)})`); else show(E.cring, 0);
}
const curG = (c, t) => c.hand(t);   // graph px

function seek(tIn) {
  const t = clamp(tIn, 0, T);   // the film plays once: the shutter's samples before 0 hold frame 0 (no wrap to the end card)
  // ----- camera: springs between shots, a handheld drift that starts once things move, a punch on each hit -----
  {
    const env = sm((t - B(2.6)) / 1.2);
    const dx = env * (1.6 * Math.sin(t * 0.83 + 1.1) + 0.7 * Math.sin(t * 1.97 + 0.4)), dy = env * (1.3 * Math.sin(t * 0.61 + 2.3) + 0.6 * Math.sin(t * 1.49 + 1.7));
    const rot = env * (0.06 * Math.sin(t * 0.47 + 0.7) + 0.02 * Math.sin(t * 1.3));
    let z = Math.exp(LZ(t));
    for (const [b, a] of S.punch) { const u = t - B(b); if (u >= 0) z *= 1 + a * clamp(u / 0.025) * Math.exp(-u / 0.13); }
    CAM = { cx: CX(t), cy: CY(t), z, dx, dy };
    world.style.transform = `translate(${(W / 2 + dx * K).toFixed(3)}px,${(H / 2 + dy * K).toFixed(3)}px) rotate(${rot.toFixed(4)}deg) scale(${(K * z).toFixed(5)}) translate(${(-CAM.cx).toFixed(3)}px,${(-CAM.cy).toFixed(3)}px)`;
  }
  posterFx(t);
  // ----- the diagram -----
  const gOut = 1 - sm((t - B(S.end) + 0.04) / 0.3);
  if (show(LG, gOut)) {
    const z = CAM.z, sw = 1.7 / Math.pow(z, 0.72), ps = Math.pow(1 / z, 0.55), hubOut = 1 - sm((t - B(S.hub)) / 0.35);
    NODES.forEach((k) => nodeFx(k, t));
    WL.forEach((w) => wireFx(w, t, sw, ps, hubOut));
    WL.forEach((w) => {
      if (!w.tagEl) return;
      const at = w.draw[0] + w.draw[1] * 0.5, p = t < at ? 0 : spr(t - at, 0.3, 0.7);
      if (fx(w.tagEl, clamp(p * 1.4) * hubOut, 0, `translate3d(${px(w.tagP[0] - w.tagW / 2)},${px(w.tagP[1] - 13)},0) scale(${(Math.pow(1 / z, 0.5) * (0.8 + 0.2 * p)).toFixed(4)})`)) {}
    });
    NODES.forEach((k, i) => {   // overview callouts stay readable at any zoom
      const el = E["co_" + k];
      if (!S.over) { show(el, 0); return; }
      const a = B(S.over[0]) + i * 0.06, b = B(S.over[1]), p = t < a ? 0 : spr(t - a, 0.35, 1);
      if (!show(el, p * (1 - sm((t - b) / 0.25)))) return;
      const [x, y, w, h] = NL[k], l = CO[k][0] === "l";
      el.style.transform = `translate(${px(l ? x : x + w)},${px(y + h / 2)}) scale(${(1 / z).toFixed(4)}) translate(${px((l ? -1 : 1) * (1 - p) * 12)},0px)`;
    });
    // the hub: discs on a ring around the mark, spokes flowing in; then they fold into the mark
    const h0 = B(S.hub), fold = B(S.fold);
    RING.forEach((r) => {
      const el = E["rd_" + r.k];
      if (t < h0) { show(el, 0); return; }
      const q = hubQ(r.k, t), f = spr(t - fold - r.i * 0.012, 0.36, 1);
      const x = lerp(lerp(r.nx, r.rx, q), HC[0], f), y = lerp(lerp(r.ny, r.ry, q), HC[1], f) + Math.sin(t * 1.7 + r.i * 1.3) * 3 * clamp((t - h0 - 0.8) / 0.6) * (1 - f);
      fx(el, sm((q - 0.25) / 0.45) * (1 - sm((f - 0.45) / 0.45)), 0, `translate3d(${px(x)},${px(y)},0) scale(${((0.55 + 0.45 * q) * (1 - 0.6 * f)).toFixed(4)})`);
    });
    if (t < h0 || !NODE.agent) show(E.rdC, 0);
    else {
      const q = hubQ("agent", t), pulse = RING.reduce((a, r) => { const h = t - (fold + r.i * 0.012 + 0.2); return a + (h > 0 ? 0.035 * Math.exp(-h * 8) * Math.sin(Math.min(h * 20, Math.PI)) : 0); }, 0);
      fx(E.rdC, sm((q - 0.2) / 0.45), 0, `translate3d(${px(HC[0])},${px(HC[1])},0) scale(${(0.5 + 0.5 * q + pulse + 0.25 * sm((t - B(S.end)) / 0.3)).toFixed(4)})`);
    }
  }
  headerFx(t);
  endFx(t);
  handsFx(t);
}

// ---------- boot ----------
window.seek = seek; window.DURATION = T; window.CUES = CUES; window.B = B; window.MUSIC = MUSIC; window.FMT = [W, H];
window.ready = Promise.all(['400 20px "Inter"', '500 20px "Inter"', '600 20px "Inter"', '700 20px "Inter"', '320 40px "display"'].map((f) => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([...document.querySelectorAll("[style*='url(img']")].map((a) => { const u = a.style.backgroundImage.match(/url\("?(.*?)"?\)/); if (!u) return 0; return new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u[1]; }); })))
  .then(() => { init(); seek(0); return true; });
const params = new URLSearchParams(location.search);
if (params.has("render")) document.documentElement.classList.add("render");
else {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); Object.assign(stage.style, { position: "fixed", left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${k})` }); };
  addEventListener("resize", fit); fit();
  const at = params.has("t") ? parseFloat(params.get("t")) : null;
  window.ready.then(() => { if (at != null) { seek(at); return; } const t0 = performance.now(); const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
