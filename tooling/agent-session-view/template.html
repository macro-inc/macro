<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Session View</title>
<link rel="stylesheet" id="hljs-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" id="hljs-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
  --model: #8b5cf6; --model-soft: #ede9fe; --tool: #10b981; --tool-soft: #d1fae5;
  --fail: #ef4444; --fail-soft: #fee2e2; --warn: #f59e0b; --warn-soft: #fef3c7;
  --msg: #2563eb; --msg-soft: #dbeafe; --code-bg: #f3f3f0; --chip: #eef2ff;
  --p-system: #94a3b8; --p-guides: #8b5cf6; --p-sdk: #2563eb; --p-tools: #10b981; --p-history: #f59e0b; --p-results: #0891b2;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --panel: #1b1b19; --ink: #ececea; --muted: #9b9b95; --line: #2c2c29;
    --model: #a78bfa; --model-soft: #2e2547; --tool: #34d399; --tool-soft: #12352b;
    --fail: #f87171; --fail-soft: #3f1d1d; --warn: #fbbf24; --warn-soft: #3a2f12;
    --msg: #60a5fa; --msg-soft: #1b2a45; --code-bg: #161614; --chip: #23263a;
    --p-system: #64748b; --p-guides: #a78bfa; --p-sdk: #60a5fa; --p-tools: #34d399; --p-history: #fbbf24; --p-results: #22d3ee;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --panel: #1b1b19; --ink: #ececea; --muted: #9b9b95; --line: #2c2c29;
  --model: #a78bfa; --model-soft: #2e2547; --tool: #34d399; --tool-soft: #12352b;
  --fail: #f87171; --fail-soft: #3f1d1d; --warn: #fbbf24; --warn-soft: #3a2f12;
  --msg: #60a5fa; --msg-soft: #1b2a45; --code-bg: #161614; --chip: #23263a;
  --p-system: #64748b; --p-guides: #a78bfa; --p-sdk: #60a5fa; --p-tools: #34d399; --p-history: #fbbf24; --p-results: #22d3ee;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
a { color: var(--msg); }
header { padding: 20px 24px 12px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { margin: 0 0 4px; font-size: 19px; }
.meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta code { font-family: var(--mono); font-size: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; }
.stat b { font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.controls label { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
.controls input[type=search] { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 8px; min-width: 200px; }
.histogram { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.histogram button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; cursor: pointer; }
.histogram button.active { background: var(--tool-soft); border-color: var(--tool); }
.histogram button .bad { color: var(--fail); }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 0; }
nav { border-right: 1px solid var(--line); padding: 12px 10px; position: sticky; top: var(--header-h, 160px); height: calc(100vh - var(--header-h, 160px)); overflow: auto; }
nav a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 12.5px; }
nav a:hover { background: var(--panel); }
nav a .n { font-weight: 600; }
nav a .d { color: var(--muted); float: right; font-variant-numeric: tabular-nums; }
nav a .p { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav a .f { color: var(--fail); }
main { padding: 16px 24px 80px; min-width: 0; }
.turn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; overflow: clip; }
.turn-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.turn-head h2 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.turn-head h2 .when { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.prompt { margin-top: 8px; white-space: pre-wrap; word-break: break-word; background: var(--msg-soft); border-radius: 8px; padding: 10px 12px; }
.turn-stats { color: var(--muted); font-size: 12.5px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.timeline { position: relative; height: 34px; margin-top: 10px; background: var(--model-soft); border-radius: 6px; overflow: hidden; cursor: pointer; }
.timeline .seg { position: absolute; top: 0; bottom: 0; min-width: 2px; }
.timeline .seg.tool { background: var(--tool); opacity: .85; }
.timeline .seg.tool.failed { background: var(--fail); }
.timeline .seg.tool.soft { background: var(--warn); }
.timeline .seg.msg { background: var(--msg); opacity: .5; }
.timeline.models { height: 14px; margin-top: 3px; background: transparent; border: 1px dashed var(--line); cursor: default; }
.timeline.models .seg.call { background: var(--model); opacity: .7; border-right: 1px solid var(--bg, #fff); }
.timeline.models .seg.call.failed { background: var(--fail); }
div.calls { overflow-x: auto; }
table.calls { border-collapse: collapse; font-size: 12px; margin: 6px 0; white-space: nowrap; }
table.calls td, table.calls th { padding: 2px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.calls td:nth-child(5), table.calls th:nth-child(5), table.calls td:last-child, table.calls th:last-child { text-align: left; }
.timeline .tick { position: absolute; bottom: 0; font-size: 10px; color: var(--muted); padding-left: 2px; border-left: 1px solid var(--line); height: 12px; line-height: 12px; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.items { padding: 6px 16px 14px; }
.gap { color: var(--muted); font-size: 11.5px; margin: 8px 0 2px 2px; font-variant-numeric: tabular-nums; }
.gap.slow { color: var(--warn); font-weight: 600; }
details.thought { border-left: 3px solid var(--model); background: var(--model-soft); border-radius: 0 8px 8px 0; padding: 4px 10px; margin: 4px 0; }
details.thought summary { cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.thought .body { white-space: pre-wrap; font-size: 13px; padding: 6px 0 4px; }
.message { border-left: 3px solid var(--msg); padding: 2px 12px; margin: 6px 0; }
.message > :first-child { margin-top: 4px; } .message > :last-child { margin-bottom: 4px; }
.message pre { background: var(--code-bg); padding: 8px; border-radius: 6px; overflow: auto; }
.message table { border-collapse: collapse; } .message td, .message th { border: 1px solid var(--line); padding: 3px 8px; }
.tool { border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; background: var(--panel); }
.tool.failed { border-color: var(--fail); }
.tool.soft { border-color: var(--warn); }
.tool > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tool > summary::-webkit-details-marker { display: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tool); flex: none; }
.tool.failed .dot { background: var(--fail); } .tool.soft .dot { background: var(--warn); } .tool.pending .dot { background: var(--muted); }
.tool .num { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tool .name { font-weight: 600; font-family: var(--mono); font-size: 13px; }
.tool .args-inline { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 200px; min-width: 0; }
.tool .dur { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.tool .dur.slow { color: var(--warn); font-weight: 600; }
.tool .err { color: var(--fail); font-size: 12.5px; padding: 0 12px 8px 31px; font-family: var(--mono); word-break: break-word; }
.tool .body { border-top: 1px solid var(--line); padding: 8px 12px 10px; }
.tool h4 { margin: 8px 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
pre.json, pre.code { margin: 0; background: var(--code-bg); border-radius: 6px; padding: 8px 10px; overflow: auto; max-height: 520px; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
pre.code { white-space: pre; }
pre.code code.hljs { background: transparent; padding: 0; }
.more { margin-top: 4px; font-size: 12px; }
.more button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.event { color: var(--muted); font-size: 12px; margin: 6px 0; font-family: var(--mono); }
.error-frame { color: var(--fail); background: var(--fail-soft); border-radius: 8px; padding: 6px 10px; margin: 6px 0; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
.chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 0 6px; font-size: 12.5px; }
details.ctx { margin-top: 6px; font-size: 12px; color: var(--muted); }
details.ctx pre { white-space: pre-wrap; }
.end { color: var(--muted); font-size: 12.5px; padding: 6px 2px 0; }
.hidden { display: none !important; }
section.tokens { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; padding: 14px 16px; }
section.tokens h2 { margin: 0 0 6px; font-size: 15px; }
section.tokens p { margin: 6px 0; max-width: 80ch; }
table.tokens { border-collapse: collapse; font-size: 12.5px; margin: 8px 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.tokens td, table.tokens th { padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: right; }
table.tokens td:first-child, table.tokens th:first-child { text-align: left; }
table.tokens tr.sum td { font-weight: 600; border-top: 2px solid var(--line); }
table.tokens tr.side td { color: var(--muted); }
div.tokens-scroll { overflow-x: auto; }
.coverage { font-size: 12.5px; }
.semantics { font-size: 12px; color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
svg.spark { display: block; margin: 6px 0; max-width: 100%; }
svg.spark .axis { stroke: var(--line); }
svg.spark text { fill: var(--muted); font-size: 10px; font-family: var(--sans); }
.turn-tokens { font-size: 12.5px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.turn-tokens .chip.model { background: var(--model-soft); }
.turn-tokens .chip.opener, .turn-tokens .chip.nospan { background: var(--chip); color: var(--muted); }
.turn-tokens .miss { color: var(--fail); font-weight: 600; }
.round { display: inline-block; font-size: 11px; color: var(--model); font-family: var(--mono); border: 1px solid var(--model); border-radius: 4px; padding: 0 5px; margin-right: 6px; white-space: nowrap; }
.round.none { color: var(--muted); border-color: var(--line); }
.message > .round { margin: 4px 0 0; }
.tool { border-style: dashed; }
.tool .exec { color: var(--tool); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.legend i.exec { background: transparent; border: 1px dashed var(--tool); }
.card.literal { grid-column: 1 / -1; }
.card.literal .part { margin: 3px 0; }
.card.literal summary { cursor: pointer; }
.status { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; }
.status.ok { background: var(--tool-soft); color: var(--ink); }
.status.bad { background: var(--fail); color: #fff; }
.status.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.status.muted { background: var(--chip); color: var(--muted); }
.warn-text { color: var(--warn); }
.literal-error { background: var(--fail-soft); border: 1px solid var(--fail); color: var(--ink); border-radius: 6px; padding: 4px 8px; margin: 6px 0; font-weight: 600; }
pre.literal-text { max-height: 480px; }
.stream { margin: 4px 0 6px; }
.stream .label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.stream.bad pre { background: var(--fail-soft); }
.theme { margin-left: auto; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.keys { color: var(--muted); font-size: 11.5px; }
.keys kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--bg); }
.turn-bar { position: sticky; top: var(--header-h, 160px); z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; }
.turn-bar .title { font-weight: 600; color: var(--ink); text-decoration: none; }
.turn-bar .took { color: var(--muted); font-variant-numeric: tabular-nums; }
.turn-bar button.jump { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
.strip { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 260px; min-width: 0; }
.strip button { width: 9px; height: 14px; padding: 0; border: 0; border-radius: 2px; background: var(--tool); opacity: .75; cursor: pointer; }
.strip button.failed { background: var(--fail); opacity: 1; }
.strip button.soft { background: var(--warn); opacity: 1; }
.strip button.code { box-shadow: inset 0 -4px 0 rgba(0,0,0,.28); }
.strip button.lit { outline: 2px solid var(--ink); outline-offset: 1px; opacity: 1; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.flag { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 2px 8px; font-size: 12px; text-align: left; cursor: default; }
.flag.warn { background: var(--warn-soft); border-color: var(--warn); }
.flag[data-tools] { cursor: pointer; }
.flag code { font-family: var(--mono); font-weight: 600; font-size: 11.5px; }
.flag .sep { color: var(--muted); margin: 0 6px; }
.badge { display: inline-block; border-radius: 999px; padding: 0 7px; font-size: 11.5px; font-weight: 600; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.context { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-size: 12.5px; min-width: 0; }
.card h5 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.card .big { font-size: 16px; font-weight: 600; }
.card .big.bad { color: var(--fail); }
.card .muted, .muted { color: var(--muted); }
.card .names { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
.card .names .chip { font-family: var(--mono); font-size: 11.5px; }
.card .names .chip.used { background: var(--tool-soft); }
.card a.chip { color: var(--ink); text-decoration: none; }
.card details summary { cursor: pointer; color: var(--muted); }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--line); margin: 4px 0; }
.stack i { display: block; height: 100%; min-width: 1px; }
.stack.mini { height: 8px; width: 160px; margin: 0; }
.parts { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; font-variant-numeric: tabular-nums; }
.parts i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-top: 4px; }
.parts span:nth-child(3n) { text-align: right; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--warn); } to { box-shadow: 0 0 0 3px transparent; } }
mark { background: var(--warn-soft); color: inherit; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav { display: none; }
  header { position: static; padding: 14px 16px 10px; }
  .turn-bar { top: 0; }
  main { padding: 12px 16px 60px; }
}
</style>
</head>
<body>
<header id="top">
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="stats" id="stats"></div>
  <div class="histogram" id="histogram"></div>
  <div class="controls">
    <input type="search" id="search" placeholder="Filter steps by text…">
    <label><input type="checkbox" id="expandThinking"> expand thinking</label>
    <label><input type="checkbox" id="expandTools"> expand tool calls</label>
    <label><input type="checkbox" id="expandCode" checked> show code runs</label>
    <label><input type="checkbox" id="onlyFailures"> failures only</label>
    <label><input type="checkbox" id="hideThinking"> hide thinking</label>
    <span class="keys"><kbd>n</kbd>/<kbd>p</kbd> next/previous failure · <kbd>j</kbd>/<kbd>k</kbd> next/previous turn</span>
    <button class="theme" id="theme" title="switch light / dark">◐ theme</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script id="session-data" type="application/json">__SESSION_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('session-data').textContent);
const SLOW_MODEL_MS = 8000, SLOW_TOOL_MS = 5000, INLINE_LIMIT = 4000;
const parseTime = s => Date.parse(String(s).replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1'));
const secs = ms => ms == null ? '–' : ms < 1000 ? `${Math.round(ms)}ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)}s` : `${Math.floor(ms / 60000)}m${Math.round(ms % 60000 / 1000)}s`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (tag, attrs = {}, html = '') => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); n.innerHTML = html; return n; };
// token_usage.reconcile: spans normalized and matched to ai_usage rows.
const TOKENS = DATA.tokens || null;
const MODEL_CALLS = (DATA.spans?.model_calls || []).map((call, index) => ({ ...call, index, usage: TOKENS?.calls?.[index] || null }));
const count = n => n == null ? '' : Math.round(n).toLocaleString();
const short = n => n == null ? '?' : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(Math.round(n));
const dollars = v => v == null ? null : v >= 1 ? `$${v.toFixed(2)}` : v >= 0.01 ? `$${v.toFixed(3)}` : `$${v.toFixed(4)}`;
const callLabel = call => call.usage?.opener ? 'opener' : call.model;

// The language of each code tool's program; ExecuteCode's is in
// `rawInput.source`, the others' in `rawInput.input`.
const CODE_LANGUAGES = { ExecuteCode: 'javascript', BashCodeExecution: 'bash', TextEditorCodeExecution: 'plaintext' };

function takeInput(item, raw) {
  if (!raw || typeof raw !== 'object') return;
  const input = { ...raw };
  let code = input.source;
  delete input.source;
  if (code === undefined && item.name !== 'ExecuteCode' && CODE_LANGUAGES[item.name] && input.input !== undefined) {
    code = input.input;
    delete input.input;
  }
  if (code !== undefined) item.source = typeof code === 'string' ? code : JSON.stringify(code, null, 2);
  Object.assign(item.input, input);
}

function buildTurns(frames) {
  // A provider can reuse a tool call id: updates go to its latest call, and
  // the n-th call with an id takes the n-th span carrying it.
  const turns = [], tools = {}, occurrences = {};
  let turn = null;
  for (const [index, frame] of frames.entries()) {
    const content = frame.content || {}, t = parseTime(frame.t);
    // The model call (span index) this frame streamed in: token_usage.frame_rounds.
    const round = DATA.frame_rounds?.[index] ?? null;
    if (content.method === 'session/prompt') {
      turn = { n: turns.length + 1, start: t, end: null, last: t, prompt: content.params?.prompt || [], user: frame.user_id, items: [], stop: null };
      turns.push(turn);
      continue;
    }
    if (!turn) continue;
    turn.last = t;
    const update = content.params?.update, kind = update?.sessionUpdate;
    const previous = turn.items[turn.items.length - 1];
    if (kind === 'agent_thought_chunk' || kind === 'agent_message_chunk') {
      const k = kind === 'agent_thought_chunk' ? 'thought' : 'message';
      const text = update.content?.text || '';
      // Chunks of one step merge; a new model call (the opener, then the turn's model) starts a new one.
      const sameRound = previous?.round == null || round == null || previous.round === round;
      if (previous && previous.kind === k && sameRound) { previous.text += text; previous.end = t; }
      else turn.items.push({ kind: k, text, start: t, end: t, round });
    } else if (kind === 'tool_call') {
      const item = { kind: 'tool', id: update.toolCallId, title: update.title, name: (update._meta?.macro?.toolName || update.title || '?').replace(/^mcp__macro_internal__/, ''), input: {}, source: undefined, start: t, end: null, status: update.status || 'pending', output: undefined, content: null, round };
      takeInput(item, update.rawInput);
      item.occurrence = occurrences[update.toolCallId] = (occurrences[update.toolCallId] ?? -1) + 1;
      tools[update.toolCallId] = item;
      turn.items.push(item);
    } else if (kind === 'tool_call_update') {
      const item = tools[update.toolCallId];
      if (!item) continue;
      // A streamed call sends its arguments, code included, after it starts.
      takeInput(item, update.rawInput);
      if (update.status) item.status = update.status;
      if (update.rawOutput !== undefined) item.output = update.rawOutput;
      if (update.content) item.content = update.content;
      if (update.status === 'completed' || update.status === 'failed') item.end = t;
    } else if (kind === 'plan') {
      turn.items.push({ kind: 'event', text: 'plan: ' + (update.entries || []).map(e => `${e.status === 'completed' ? '✓' : '○'} ${e.content}`).join(' · '), start: t, end: t });
    } else if (content.result?.stopReason) {
      turn.stop = content.result.stopReason; turn.end = t;
    } else if (content.error) {
      turn.items.push({ kind: 'error', error: content.error, start: t, end: t });
    } else if (content.type === 'event') {
      turn.items.push({ kind: 'event', text: `event: ${content.event}${content.detail ? ' ' + JSON.stringify(content.detail) : ''}`, start: t, end: t });
    }
  }
  for (const turn of turns) {
    turn.end = turn.end || turn.last;
    let n = 0;
    for (const item of turn.items) {
      if (item.kind !== 'tool') continue;
      item.n = ++n;
      item.dom = `tool-${turn.n}-${item.n}`;
      if (item.end == null) item.end = item.start;
      const span = nthSpan(item.id, item.occurrence);
      if (span) {
        item.start = span.start_ms; item.end = span.end_ms;
        item.resultBytes = span.result_bytes; item.resultCut = span.result_cut;
      }
      const out = item.output;
      item.softFail = item.status !== 'failed' && reportsFailure(out);
      item.errorText = errorText(item);
    }
    turn.tools = turn.items.filter(i => i.kind === 'tool');
    turn.failures = turn.tools.filter(i => i.status === 'failed' || i.softFail).length;
    turn.toolMs = unionMs(turn.tools.map(i => [i.start, i.end]));
    turn.totalMs = turn.end - turn.start;
    turn.calls = MODEL_CALLS.filter(call => call.start_ms >= turn.start && call.start_ms <= turn.end);
    // The opener races the first round and takes no round number of its own.
    let round = 0;
    turn.calls.forEach(call => { call.round = call.usage?.opener ? null : ++round; });
    turn.tokens = TOKENS?.turns?.[turn.n - 1] || null;
    turn.context = DATA.turn_context?.[turn.n - 1] || null;
    turn.flags = turn.context?.flags || [];
  }
  return turns;
}

// The same predicate as markdown_export.failure: a result that reports a
// program that did not succeed, or carries an error.
const FAILED_PROGRAM = ['failed', 'timed_out', 'cancelled'];
function reportsFailure(out) {
  return !!out && typeof out === 'object' && (FAILED_PROGRAM.includes(out.status) || !!out.error);
}

function nthSpan(id, n) {
  const spans = DATA.spans?.tools?.[id];
  if (!spans) return null;
  return Array.isArray(spans) ? spans[n] ?? null : n === 0 ? spans : null;
}

function errorText(item) {
  const out = item.output;
  if (out == null) return item.status === 'failed' ? 'failed' : '';
  if (typeof out === 'string') return item.status === 'failed' ? out.slice(0, 400) : '';
  const err = out.error || (FAILED_PROGRAM.includes(out.status) ? out.message || out.status : null);
  if (!err) return '';
  return (typeof err === 'string' ? err : JSON.stringify(err)).slice(0, 400);
}

function unionMs(intervals) {
  intervals = intervals.filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
  let total = 0, cur = null;
  for (const [a, b] of intervals) {
    if (cur && a <= cur[1]) cur[1] = Math.max(cur[1], b);
    else { if (cur) total += cur[1] - cur[0]; cur = [a, b]; }
  }
  return cur ? total + cur[1] - cur[0] : total;
}

function promptText(prompt) {
  return prompt.map(p => p.text ?? (p.resource?.text) ?? (p.uri ? `[${p.type}: ${p.uri}]` : `[${p.type}]`)).join('\n');
}

function splitContext(text) {
  const contexts = [];
  const body = text.replace(/<m-agent-context>([\s\S]*?)<\/m-agent-context>/g, (_, inner) => {
    try { contexts.push(JSON.parse(inner).text ?? inner); } catch { contexts.push(inner); }
    return '';
  }).trim();
  return { body, contexts };
}

function mentionChips(text) {
  return text.replace(/<m-([a-z-]+)>(\{[\s\S]*?\})<\/m-\1>/g, (_, kind, json) => {
    let label = kind.replace(/-mention$/, '');
    try {
      const v = JSON.parse(json);
      label = v.label || v.displayFormat || v.documentName || v.name || v.text || v.title || v.email || v.url || v.userId || v.id || label;
    } catch {}
    return `<span class="chip" title="${esc(kind)}">${esc(label)}</span>`;
  });
}

function escapedWithChips(text) {
  const mention = /<m-([a-z-]+)>(\{[\s\S]*?\})<\/m-\1>/g;
  let html = '', last = 0, match;
  while ((match = mention.exec(text))) {
    html += esc(text.slice(last, match.index)) + mentionChips(match[0]);
    last = mention.lastIndex;
  }
  return html + esc(text.slice(last));
}

function markdown(text) {
  // Rendered markdown only when it can be sanitized; agent text never reaches
  // innerHTML unescaped.
  if (!window.marked || !window.DOMPurify) return `<pre>${esc(text)}</pre>`;
  return DOMPurify.sanitize(marked.parse(mentionChips(text)));
}

function oneLine(value, limit = 160) {
  const s = typeof value === 'string' ? value : JSON.stringify(value);
  return s.length > limit ? s.slice(0, limit) + '…' : s;
}

function jsonBlock(value) {
  const text = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  const wrap = el('div');
  const pre = el('pre', { class: 'json' });
  pre.textContent = text.length > INLINE_LIMIT ? text.slice(0, INLINE_LIMIT) : text;
  wrap.append(pre);
  if (text.length > INLINE_LIMIT) {
    const more = el('div', { class: 'more' }, `<button>show all ${(text.length / 1024).toFixed(0)} KB</button>`);
    more.querySelector('button').onclick = () => { pre.textContent = text; more.remove(); };
    wrap.append(more);
  }
  return wrap;
}

function toolBody(item) {
  const body = el('div', { class: 'body' });
  if (Object.keys(item.input).length) { body.append(el('h4', {}, 'Arguments')); body.append(jsonBlock(item.input)); }
  if (item.source) {
    body.append(el('h4', {}, `Code · ${item.source.split('\n').length} lines`));
    const pre = el('pre', { class: 'code' }), code = el('code', { class: `language-${CODE_LANGUAGES[item.name] || 'javascript'}` });
    code.textContent = item.source;
    pre.append(code); body.append(pre);
    if (window.hljs) hljs.highlightElement(code);
  }
  const out = item.output !== undefined ? item.output : item.content;
  body.append(el('h4', {}, `Result · ${esc(item.status)}${item.softFail ? ' (reported failure)' : ''}`));
  if (out === undefined || out === null) body.append(el('div', { class: 'event' }, 'no output recorded'));
  else body.append(...codeResult(out), jsonBlock(out));
  return body;
}

// The parts of a code run's result worth reading first: its error, and a
// shell's output streams. The whole result follows them.
function codeResult(out) {
  if (!out || typeof out !== 'object') return [];
  const parts = [];
  const block = (label, text, cls = '') => {
    if (text === undefined || text === null || text === '') return;
    const wrap = el('div', { class: `stream ${cls}` }, `<div class="label">${esc(label)}</div>`);
    const pre = el('pre', { class: 'json' });
    pre.textContent = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
    wrap.append(pre);
    parts.push(wrap);
  };
  block('error', out.error, 'bad');
  const shell = out.content && typeof out.content === 'object' && !Array.isArray(out.content) ? out.content : null;
  if (shell && ('stdout' in shell || 'stderr' in shell)) {
    block(`stdout${shell.return_code != null ? ` · exit ${shell.return_code}` : ''}`, shell.stdout);
    block('stderr', shell.stderr, 'bad');
  }
  return parts;
}

function renderTool(item) {
  const ms = item.end - item.start;
  const status = item.status === 'failed' ? 'failed' : item.softFail ? 'soft' : item.status === 'completed' ? 'ok' : 'pending';
  const node = el('details', { class: `tool ${status}`, id: item.dom });
  node.dataset.tool = item.name;
  node.dataset.code = item.source ? '1' : '';
  node.dataset.failed = status === 'failed' || status === 'soft' ? '1' : '';
  node.append(el('summary', {}, `<span class="dot"></span><span class="num">#${item.n}</span>${roundTag(item)}<span class="name">${esc(item.name)}</span>` +
    `<span class="args-inline">${esc(item.source ? item.source.replace(/\s+/g, ' ').slice(0, 160) : oneLine(item.input))}</span>` +
    (item.resultBytes != null ? `<span class="args-inline" title="result size${item.resultCut ? '; the model read only its beginning' : ''}">${(item.resultBytes / 1000).toFixed(1)} KB${item.resultCut ? ' cut' : ''}</span>` : '') +
    `<span class="dur ${ms > SLOW_TOOL_MS ? 'slow' : ''}" title="tool / SDK execution: deterministic, no model"><span class="exec">⚙ ran</span> ${secs(ms)}</span>`));
  if (item.errorText) node.append(el('div', { class: 'err' }, esc(item.errorText)));
  let rendered = false;
  node.addEventListener('toggle', () => { if (node.open && !rendered) { node.append(toolBody(item)); rendered = true; } });
  node.searchText = [item.name, item.title, JSON.stringify(item.input), item.source, item.errorText].join(' ').toLowerCase();
  let output = null;
  node.lazyText = () => output ??= JSON.stringify(item.output ?? item.content ?? '').toLowerCase();
  return node;
}

function renderTimeline(turn) {
  const span = Math.max(turn.totalMs, 1);
  const bar = el('div', { class: 'timeline', title: 'purple: model · green: tool · red: failed · blue: reply' });
  const pct = t => `${((t - turn.start) / span * 100).toFixed(3)}%`;
  const width = (a, b) => `${Math.max((b - a) / span * 100, 0.15).toFixed(3)}%`;
  for (const item of turn.items) {
    if (item.kind === 'tool') {
      const seg = el('div', { class: `seg tool ${item.status === 'failed' ? 'failed' : item.softFail ? 'soft' : ''}`, title: `#${item.n} ${item.name} · ${secs(item.end - item.start)}` });
      seg.style.left = pct(item.start); seg.style.width = width(item.start, item.end);
      seg.onclick = e => { e.stopPropagation(); const target = document.getElementById(item.dom); target.open = true; target.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      bar.append(seg);
    } else if (item.kind === 'message') {
      const seg = el('div', { class: 'seg msg', title: 'reply text' });
      seg.style.left = pct(item.start); seg.style.width = width(item.start, item.end);
      bar.append(seg);
    }
  }
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800].find(s => span / 1000 / s <= 8) || 3600;
  for (let s = step; s * 1000 < span; s += step) {
    const tick = el('div', { class: 'tick' }, s >= 60 ? `${s / 60}m` : `${s}s`);
    tick.style.left = `${(s * 1000 / span * 100).toFixed(3)}%`;
    bar.append(tick);
  }
  return bar;
}

// One segment per model call, under the turn's timeline.
function renderModelLane(turn) {
  const span = Math.max(turn.totalMs, 1);
  const lane = el('div', { class: 'timeline models', title: 'model calls (chat_streaming spans)' });
  const pct = t => `${Math.max((t - turn.start) / span * 100, 0).toFixed(3)}%`;
  const width = (a, b) => `${Math.max((b - a) / span * 100, 0.15).toFixed(3)}%`;
  for (const call of turn.calls) {
    const seg = el('div', { class: `seg call ${call.failed ? 'failed' : ''}`, title: `${call.model} · ${secs(call.end_ms - call.start_ms)} · first chunk ${secs(call.first_chunk_ms)} ${call.first_chunk_kind || ''}` });
    seg.style.left = pct(call.start_ms); seg.style.width = width(call.start_ms, call.end_ms);
    lane.append(seg);
  }
  return lane;
}

const BILLING_STATUS = {
  matched: ['ok', 'billed'], partial: ['warn', 'partial'], 'no usage': ['warn', 'no usage'],
  'not billed': ['bad', 'not billed'], 'from telemetry': ['muted', 'telemetry only'],
};
const BILLING_TITLE = {
  matched: 'its ai_usage row matched these spans exactly',
  partial: 'its ai_usage row does not add up to its spans (one is missing or reported no usage)',
  'no usage': 'the span reported no token usage',
  'not billed': 'no ai_usage row covers this span',
  'from telemetry': 'no ai_usage rows in this export: tokens from the span, cost unknown',
};

// One row per model call (chat_streaming span), its tokens as four disjoint
// counters. Cost only where one billed row covers exactly this call.
function renderModelCalls(turn) {
  const scale = Math.max(...turn.calls.map(call => promptTotal(call.prompt_bytes)), 1);
  const details = el('details', { class: 'ctx' }, `<summary>${turn.calls.length} model calls · ${secs(turn.calls.reduce((a, c) => a + c.end_ms - c.start_ms, 0))}</summary>`);
  const rows = turn.calls.map(call => {
    const usage = call.usage, tokens = usage?.tokens;
    const largest = Object.entries(call.prompt_bytes || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([name, bytes]) => `${esc(name)} ${(bytes / 1000).toFixed(0)} KB`).join(', ');
    const [klass, text] = BILLING_STATUS[usage?.status] || ['muted', usage?.status || '?'];
    const sharedRow = usage?.row && usage.cost == null && usage.status === 'matched';
    const costCell = usage?.cost != null ? dollars(usage.cost) : sharedRow ? '<span class="muted" title="one billed row covers several rounds; its cost is on the turn">in turn</span>' : '<span class="muted">—</span>';
    return `<tr${usage?.cache_miss ? ' style="background:var(--fail-soft)" title="cache miss: the whole context was written to the cache again"' : ''}><td>${call.round ?? '–'}</td><td>+${secs(call.start_ms - turn.start)}</td><td>${secs(call.end_ms - call.start_ms)}</td><td>${secs(call.first_chunk_ms)} ${esc(call.first_chunk_kind || '')}</td><td>${esc(call.model)}${usage?.opener ? ' <span class="muted">opener</span>' : ''}</td>` +
      (tokens ? `<td>${count(tokens.uncached)}</td><td>${count(tokens.cache_read)}</td><td>${count(tokens.cache_write)}</td><td>${count(tokens.output)}</td><td><b>${count(usage.context)}</b></td>` : `<td colspan="5" class="muted">no usage reported</td>`) +
      `<td>${costCell}</td><td><span class="status ${klass}" title="${esc(BILLING_TITLE[usage?.status] || '')}">${esc(text)}</span></td>` +
      `<td>${count(call.eager_tools)}${call.loaded_tools ? ' + ' + count(call.loaded_tools) : ''}</td><td>${promptStack(call.prompt_bytes, scale, true).outerHTML}</td><td>${largest}</td></tr>`;
  }).join('');
  details.append(el('div', { class: 'calls' }, `<table class="calls"><tr><th>round</th><th>at</th><th>took</th><th>first chunk</th><th>model</th><th title="input not served from the cache">uncached in</th><th title="tokens re-read from the prompt cache">cache read</th><th title="tokens written to the prompt cache">cache write</th><th>output</th><th title="tokens the model read: uncached + cache read + cache write">context</th><th>cost</th><th>billing</th><th>tools</th><th title="prompt parts in BYTES, not tokens">prompt BYTES</th><th>largest prompt parts (bytes)</th></tr>${rows}</table>`));
  return details;
}

// Context size per call as dots on a line, one colour per model; a cache
// miss (whole context written again) is red.
const MODEL_COLORS = ['var(--model)', 'var(--msg)', 'var(--tool)', 'var(--warn)', 'var(--p-results)', 'var(--p-system)'];
function sparkline(calls, { width = 560, height = 64, labels = true } = {}) {
  const points = calls.filter(call => call.usage?.context != null && !call.usage.opener);
  if (!points.length) return null;
  const max = Math.max(...points.map(call => call.usage.context), 1);
  const models = [...new Set(points.map(call => call.model))];
  const pad = labels ? 34 : 2, top = 6, bottom = labels ? 14 : 2;
  const x = i => pad + (points.length === 1 ? 0 : i / (points.length - 1) * (width - pad - 4));
  const y = v => top + (1 - v / max) * (height - top - bottom);
  const line = models.map((model, m) => {
    const own = points.map((call, i) => [call, i]).filter(([call]) => call.model === model);
    return `<polyline fill="none" stroke="${MODEL_COLORS[m % MODEL_COLORS.length]}" stroke-width="1.2" opacity=".6" points="${own.map(([call, i]) => `${x(i).toFixed(1)},${y(call.usage.context).toFixed(1)}`).join(' ')}"/>`;
  }).join('');
  const dots = points.map((call, i) => {
    const miss = call.usage.cache_miss;
    const color = miss ? 'var(--fail)' : MODEL_COLORS[models.indexOf(call.model) % MODEL_COLORS.length];
    const title = `${call.model} · context ${count(call.usage.context)} tokens${miss ? ` · cache miss: whole context written again${call.usage.cost != null ? ', ' + dollars(call.usage.cost) : ''}` : ''}`;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(call.usage.context).toFixed(1)}" r="${miss ? 3.5 : 2}" fill="${color}"><title>${esc(title)}</title></circle>`;
  }).join('');
  const axis = labels ? `<line class="axis" x1="${pad}" x2="${width - 4}" y1="${y(0)}" y2="${y(0)}"/><text x="0" y="${top + 4}">${short(max)}</text><text x="0" y="${y(0)}">0</text><text x="${pad}" y="${height - 2}">call 1</text><text x="${width - 4}" y="${height - 2}" text-anchor="end">call ${points.length}</text>` : '';
  return `<svg class="spark" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="context size per model call">${axis}${line}${dots}</svg>`;
}

const TOKEN_HEADS = `<th>uncached input</th><th>cache read</th><th>cache write</th><th title="billed output includes reasoning tokens">output</th>`;
const tokenCells = tokens => `<td>${count(tokens.uncached)}</td><td>${count(tokens.cache_read)}</td><td>${count(tokens.cache_write)}</td><td>${count(tokens.output)}</td>`;

// The session's tokens and cost: a plain explanation first, then the per-model
// table, then how the billed rows and the spans line up.
function renderTokens() {
  if (!TOKENS) return null;
  const billed = TOKENS.source === 'ai_usage';
  const section = el('section', { class: 'tokens', id: 'tokens' }, `<h2>Tokens & cost <span class="muted" style="font-weight:400;font-size:12.5px">${billed ? 'from ai_usage (billing)' : 'from telemetry spans · cost unknown'}</span></h2>`);
  const main = TOKENS.models.filter(model => model.label !== 'opener (fast first line)' && model.spans >= 2).sort((a, b) => b.tokens.cache_read - a.tokens.cache_read);
  section.append(el('p', {}, 'Every model call sends the whole conversation again. <b>Cache read</b> counts those re-sent tokens on every call, so its total is the same history counted once per call, not the size of the context.'));
  const lines = main.filter(model => model.tokens.cache_read).map(model => {
    const readCost = model.cache_read_cost != null ? ` (${dollars(model.cache_read_cost)})` : '';
    const miss = model.cache_misses ? ` <span style="color:var(--fail)"><b>${model.cache_misses} missed the cache</b></span> and wrote the whole context again${model.cache_miss_cost != null ? `: <b>${dollars(model.cache_miss_cost)}</b>${model.cost != null ? ` of its ${dollars(model.cost)}` : ''}` : ''}.` : '';
    return `<li><b>${esc(model.model)}</b>: ${model.spans} calls read <b>${short(model.context_avg)}</b> tokens of context each on average, growing from ${short(model.context_first)} to ${short(model.context_max)}; the ${short(model.tokens.cache_read)} cache read${readCost} is that history counted ${model.spans} times.${miss}</li>`;
  });
  if (lines.length) section.append(el('ul', {}, lines.join('')));
  const spark = sparkline(MODEL_CALLS);
  if (spark) section.append(el('div', { title: 'context size of each model call, in tokens' }, spark));
  section.append(el('div', { class: 'legend' }, TOKENS.models.filter(model => model.contexts.length && model.label !== 'opener (fast first line)').map(model => {
    const models = [...new Set(MODEL_CALLS.filter(call => call.usage?.context != null && !call.usage.opener).map(call => call.model))];
    return `<span><i style="background:${MODEL_COLORS[models.indexOf(model.model) % MODEL_COLORS.length]}"></i>${esc(model.model)}</span>`;
  }).join('') + `<span><i style="background:var(--fail)"></i>cache miss</span>`));

  const rows = TOKENS.models.map(model => `<tr><td>${esc(model.label)}${model.label !== model.model ? ` <span class="muted">${esc(model.model)}</span>` : ''}${model.pricing?.length ? ` <span class="muted" title="ai_usage price key suffix">priced ${esc(model.pricing.map(key => ':' + key).join(', '))}</span>` : ''}</td><td>${billed ? model.rows : '–'}</td><td>${model.spans}</td>${tokenCells(model.tokens)}<td>${billed ? (dollars(model.cost) ?? 'unpriced') : 'cost unknown'}</td></tr>`).join('');
  const sum = TOKENS.models.reduce((a, model) => { for (const k of ['uncached', 'cache_read', 'cache_write', 'output']) a[k] += model.tokens[k]; return a; }, { uncached: 0, cache_read: 0, cache_write: 0, output: 0 });
  const side = TOKENS.side.map(entry => `<tr class="side"><td>side: ${esc(entry.feature)} <span class="muted">${esc(entry.models.join(', '))}</span></td><td>${entry.rows}</td><td>–</td><td colspan="4"></td><td>${dollars(entry.cost) ?? 'unpriced'}</td></tr>`).join('');
  section.append(el('div', { class: 'tokens-scroll' }, `<table class="tokens"><tr><th>model</th><th title="ai_usage rows">billed calls</th><th title="chat_streaming spans">spans</th>${TOKEN_HEADS}<th>cost</th></tr>${rows}` +
    `<tr class="sum"><td>agent model calls</td><td>${billed ? TOKENS.rows.length : '–'}</td><td>${TOKENS.calls.length}</td>${tokenCells(sum)}<td>${billed ? (dollars(TOKENS.agent_cost) ?? 'unpriced') : 'cost unknown'}</td></tr>${side}` +
    (billed ? `<tr class="sum"><td>session</td><td>${TOKENS.rows.length + TOKENS.side.reduce((a, e) => a + e.rows, 0)}</td><td></td><td colspan="4"></td><td>${dollars(TOKENS.cost) ?? 'unpriced'}</td></tr>` : '') + `</table>`));

  const c = TOKENS.coverage;
  const parts = c.have_usage
    ? [`${c.billed} billed calls`, `${c.matched} matched to spans`, c.partial && `<span class="warn-text">${c.partial} partial</span>`, c.billed_no_span && `${c.billed_no_span} billed without a span`,
       c.spans_no_usage && `${c.spans_no_usage} span${c.spans_no_usage > 1 ? 's' : ''} with no usage`, c.spans_not_billed && `<span style="color:var(--fail)">${c.spans_not_billed} spans not billed</span>`, `${c.side} side calls`]
    : [`${c.spans} spans`, 'no ai_usage rows in this export: totals from telemetry, cost unknown'];
  section.append(el('div', { class: 'coverage' }, `<b>Coverage</b> · ${parts.filter(Boolean).join(' · ')}`));
  section.append(el('ul', { class: 'semantics' },
    '<li>Uncached input, cache read and cache write never overlap; context = all three. Anthropic reports them that way; Gemini and OpenAI count cached tokens inside input, shown here as uncached = input − cache read.</li>' +
    '<li>Billed output includes reasoning tokens; Gemini spans count output without them, so a turn&#39;s billed output can exceed its calls&#39;.</li>' +
    '<li>Some models are billed one row per model call (Opus), others one row per turn (Gemini, Sonnet): their cost is on the turn, not split across calls. Totals come from ai_usage when present, never added to span totals.</li>' +
    '<li>The opener is the fast model writing a turn&#39;s first line (<code>opener.rs</code>), identified by model, no tools and ≤64 output tokens.</li>'));
  return section;
}

function renderTurnTokens(turn) {
  const t = turn.tokens;
  if (!t) return null;
  const billed = TOKENS.source === 'ai_usage';
  const chips = t.mix.map(entry => `<span class="chip ${entry.label.startsWith('opener') ? 'opener' : 'model'}">${esc(entry.label.replace(' (fast first line)', ''))} ×${entry.calls}</span>`).join(' ') +
    (t.billed_without_span || []).map(entry => ` <span class="chip nospan" title="billed in ai_usage, no chat_streaming span">${esc(entry.label.replace(' (fast first line)', ''))} ×${entry.rows} billed, no span</span>`).join('');
  const contexts = t.contexts;
  const spark = sparkline(turn.calls, { width: 120, height: 22, labels: false });
  const cost = billed ? (t.cost != null ? `<b>${dollars(t.cost)}</b>` : '<span class="muted">unpriced</span>') : '<span class="muted">cost unknown</span>';
  return el('div', { class: 'turn-tokens' },
    `<span>${chips || '<span class="muted">no model calls recorded</span>'}</span>` +
    `<span title="${billed ? 'billed (ai_usage)' : 'from spans'}">uncached ${short(t.tokens.uncached)} · cache read ${short(t.tokens.cache_read)} · cache write ${short(t.tokens.cache_write)} · output ${short(t.tokens.output)} · ${cost}</span>` +
    (contexts.length ? `<span title="tokens the model read per call">context ${short(Math.min(...contexts))} → ${short(Math.max(...contexts))}</span>${spark || ''}` : '') +
    (t.cache_misses ? `<span class="miss" title="calls that wrote their whole context to the cache again">${t.cache_misses} cache miss${t.cache_misses > 1 ? 'es' : ''}</span>` : ''));
}

// Which model call (round) produced a step, from the frame it streamed in.
function roundTag(item) {
  const call = item.round == null ? null : MODEL_CALLS[item.round];
  if (!DATA.spans?.model_calls) return '';
  return call
    ? `<span class="round" title="streamed during this model call">${call.round == null ? '' : `round ${call.round} · `}${esc(callLabel(call))}</span>`
    : `<span class="round none" title="no model call span covers this step's first frame">unattributed</span>`;
}

// Prompt parts by group, as turn_context.PROMPT_GROUPS stacks them.
const PROMPT_GROUPS = [
  ['system', 'var(--p-system)', ['preamble', 'identity', 'session_instructions', 'session_note', 'opener_note', 'memory', 'model_id', 'connected_integrations', 'unsectioned']],
  ['macro prompt + area guides', 'var(--p-guides)', ['macro_prompt']],
  ['<macro_sdk>', 'var(--p-sdk)', ['sdk_docs']],
  ['tools', 'var(--p-tools)', ['tools.eager', 'tools.loaded']],
  ['history', 'var(--p-history)', ['history']],
  ['tool results', 'var(--p-results)', ['tool_results']],
];
// A span value as text: numbers from an export are not trusted to be numbers.
const num = value => value == null ? '?' : esc(value);
const kb = bytes => bytes == null ? '? KB' : `${(bytes / 1000).toFixed(1)} KB`;
const promptTotal = parts => Object.values(parts || {}).reduce((a, b) => a + b, 0);

// A stacked bar of a model call's prompt parts, scaled to `scale` bytes.
function promptStack(parts, scale, mini = false) {
  const bar = el('div', { class: `stack${mini ? ' mini' : ''}` });
  for (const [group, color, names] of PROMPT_GROUPS) {
    for (const name of names) {
      const bytes = parts?.[name];
      if (!bytes) continue;
      const part = el('i', { title: `${name} (${group}) · ${kb(bytes)}` });
      part.style.background = color; part.style.width = `${(bytes / Math.max(scale, 1) * 100).toFixed(2)}%`;
      bar.append(part);
    }
  }
  return bar;
}

function jumpTo(dom) {
  const target = document.getElementById(dom);
  if (!target) return;
  target.closest('.step')?.classList.remove('hidden');
  target.open = true;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
}

function renderFlags(turn) {
  const row = el('div', { class: 'flags' });
  for (const found of turn.flags) {
    const badge = el('button', { class: `flag ${found.level}`, title: found.level === 'warn' ? 'warning' : 'note' }, `<code>${esc(found.id)}</code><span class="sep">—</span>${esc(found.text)}`);
    if (found.tools?.length) {
      badge.dataset.tools = found.tools.join(',');
      badge.innerHTML += ` <span class="muted">→ ${found.tools.map(n => '#' + n).join(' ')}</span>`;
      badge.onclick = () => {
        const strip = document.getElementById(`strip-${turn.n}`);
        strip?.querySelectorAll('button').forEach(b => b.classList.toggle('lit', found.tools.includes(Number(b.dataset.n))));
        jumpTo(`tool-${turn.n}-${found.tools[0]}`);
      };
    }
    row.append(badge);
  }
  return row;
}

function nameChips(names, used) {
  return `<div class="names">${names.map(name => `<span class="chip ${used.has(name) ? 'used' : ''}" title="${used.has(name) ? 'called this turn' : 'not called'}">${esc(name)}</span>`).join('')}</div>`;
}

// What the model had: the docs Jev selected, the tools offered, and the
// prompt's parts. Names, counts and sizes only; prompt text is not logged.
function renderContext(turn) {
  const context = turn.context;
  const wrap = el('div', { class: 'context' });
  const docs = context.documentation;
  wrap.append(el('div', { class: 'card' }, docs
    ? `<h5>SDK docs (select_documentation)</h5><div class="big ${docs.selected === 0 || docs.status !== 'selected' ? 'bad' : ''}">${num(docs.selected)} entities selected</div>` +
      `<div>status <b>${esc(docs.status)}</b> · &lt;macro_sdk&gt; ${kb(docs.bytes)} · guidance ${esc(docs.guidance)}</div>` +
      `<div class="muted">trace <code>${esc(docs.trace_id)}</code></div>` +
      (docs.entities.length ? `<div class="names">${docs.entities.map(name => `<span class="chip">${esc(name)}</span>`).join('')}</div>` : `<div class="muted">catalog only: no entity index in the prompt</div>`)
    : `<h5>SDK docs</h5><div class="muted">no select_documentation span for this turn</div>`));

  const tools = context.tools, eager = tools.eager;
  const used = new Set(turn.tools.map(item => item.name));
  const eagerNames = eager.names == null
    ? `<div class="big bad">names unknown</div><div>the eager lists in the source could not be read</div>`
    : nameChips(eager.names, used) + (eager.count != null && eager.names.length !== eager.count ? `<div class="muted">${eager.names.length} of ${num(eager.count)} named from the source's eager lists</div>` : '');
  const loaded = tools.loaded.length
    ? `<div class="names">${tools.loaded.map(entry => `<a class="chip ${used.has(entry.name) ? 'used' : ''}" href="#tool-${turn.n}-${entry.tool}" data-dom="tool-${turn.n}-${entry.tool}" title="loaded by ${esc(entry.via)} #${entry.tool}">${esc(entry.name)}</a>`).join('')}</div>`
    : `<div class="muted">none loaded this turn</div>`;
  const card = el('div', { class: 'card' },
    `<h5>Tools</h5><div><b>${num(eager.count)}</b> eager, full schema · ${kb(eager.bytes)}</div>${eagerNames}` +
    `<div><b>${num(tools.loaded_count)}</b> loaded · ${kb(tools.loaded_bytes)}</div>${loaded}` +
    (tools.deferred == null
      ? `<div class="muted">deferred tools unknown: ${num(tools.offered)} listed, eager not named</div>`
      : `<details><summary>${tools.deferred.length} deferred MCP tools of ${num(tools.offered)} listed${tools.offered_cut ? ' (listing cut short)' : ''}</summary>${nameChips(tools.deferred, used)}</details>`));
  card.querySelectorAll('a[data-dom]').forEach(a => a.onclick = e => { e.preventDefault(); jumpTo(a.dataset.dom); });
  wrap.append(card);
  if (context.literal) wrap.append(renderLiteral(context.literal));

  const largest = context.prompt.largest;
  if (largest) {
    const parts = Object.assign({}, ...largest.map(group => group.parts));
    const total = promptTotal(parts);
    const promptCard = el('div', { class: 'card' }, `<h5>Largest prompt of ${context.prompt.calls} model calls · bytes, not tokens</h5><div><b>${kb(total)}</b> in all</div>`);
    promptCard.append(promptStack(parts, total));
    promptCard.append(el('div', { class: 'parts' }, PROMPT_GROUPS.map(([group, color, names]) => {
      const bytes = names.reduce((a, name) => a + (parts[name] || 0), 0);
      return `<i style="background:${color}"></i><span>${esc(group)}</span><span>${kb(bytes)}</span>`;
    }).join('')));
    wrap.append(promptCard);
  }
  return wrap;
}

const LITERAL_STATUS = {
  verified: ['ok', '✓ verified'], mismatch: ['bad', '✕ MISMATCH'], unverified: ['warn', 'unverified'], 'not reconstructed': ['muted', 'not reconstructed'],
};

// The turn's prompt parts as rebuilt from source at the commit that served
// it, each checked against the bytes and hash the span recorded.
function renderLiteral(literal) {
  const card = el('div', { class: 'card literal' });
  const commit = literal.commit;
  const where = commit
    ? `reconstructed from source at <code>${esc(commit.sha.slice(0, 11))}</code> · ${commit.exact ? 'exact' : '<b class="warn-text">inferred</b>'}: ${esc(commit.reason)}`
    : '';
  card.innerHTML = `<h5>Literal prompt parts</h5><div class="muted">${where}</div>`;
  if (literal.error) {
    card.append(el('div', { class: 'literal-error' }, `Not rebuilt: ${esc(literal.error)}`));
    return card;
  }
  const wrong = literal.parts.filter(part => part.status === 'mismatch');
  if (wrong.length) card.append(el('div', { class: 'literal-error' }, `MISMATCH: ${wrong.map(part => esc(part.label)).join(', ')} differ from what the span recorded`));
  for (const part of literal.parts) {
    const [tone, label] = LITERAL_STATUS[part.status] || ['muted', esc(part.status)];
    const size = part.bytes == null
      ? `span ${kb(part.span_bytes)}`
      : `${kb(part.bytes)}${part.span_bytes != null && part.span_bytes !== part.bytes ? ` vs span ${kb(part.span_bytes)}` : ''}${part.span_hash ? ` · hash ${esc(part.hash)}${part.span_hash !== part.hash ? ` vs span ${esc(part.span_hash)}` : ''}` : ''}`;
    const head = `<span class="status ${tone}">${label}</span> <b>${esc(part.label)}</b> <span class="muted">${size}${part.note ? ' · ' + esc(part.note) : ''}</span>`;
    const text = part.hash ? DATA.literal_texts?.[part.hash] : null;
    if (text == null) { card.append(el('div', { class: 'part' }, head)); continue; }
    const details = el('details', { class: 'part' }, `<summary>${head}</summary>`);
    let shown = false;
    details.addEventListener('toggle', () => {
      if (!details.open || shown) return;
      const pre = el('pre', { class: 'json literal-text' });
      pre.textContent = text;
      details.append(pre);
      shown = true;
    });
    card.append(details);
  }
  return card;
}

// A sticky bar per turn: its number, flags and one square per tool call,
// so a long turn can be scanned and jumped through.
function renderTurnBar(turn) {
  const bar = el('div', { class: 'turn-bar' });
  const warnings = turn.flags.filter(found => found.level === 'warn').length;
  bar.append(el('a', { class: 'title', href: `#turn-${turn.n}` }, `Turn ${turn.n}`));
  bar.append(el('span', { class: 'took' }, `${secs(turn.totalMs)} · ${turn.tools.length} tools${turn.failures ? ` · <span style="color:var(--fail)">${turn.failures} failed</span>` : ''}`));
  if (warnings) bar.append(el('span', { class: 'badge', title: 'warning flags' }, `⚑ ${warnings}`));
  const strip = el('div', { class: 'strip', id: `strip-${turn.n}` });
  for (const item of turn.tools) {
    const status = item.status === 'failed' ? 'failed' : item.softFail ? 'soft' : '';
    const square = el('button', { class: `${status} ${item.source ? 'code' : ''}`, title: `#${item.n} ${item.name} · ${secs(item.end - item.start)}${item.errorText ? ' · ' + item.errorText.slice(0, 100) : ''}` });
    square.dataset.n = item.n;
    square.onclick = () => jumpTo(item.dom);
    strip.append(square);
  }
  bar.append(strip);
  if (turn.failures) {
    const next = el('button', { class: 'jump', title: 'next failed tool call in this turn' }, 'next failure ↓');
    next.onclick = () => jumpFailure(1, turn.n);
    bar.append(next);
  }
  return bar;
}

// The next (or previous) failed tool call below (or above) the middle of the
// screen, in `turnNumber` only when given.
function jumpFailure(direction, turnNumber) {
  const selector = turnNumber ? `#turn-${turnNumber} details.tool[data-failed="1"]` : 'details.tool[data-failed="1"]';
  const failed = [...document.querySelectorAll(selector)].filter(node => !node.closest('.step')?.classList.contains('hidden'));
  const middle = window.innerHeight / 2 + 1;
  const ordered = direction > 0 ? failed : failed.reverse();
  const target = ordered.find(node => direction > 0 ? node.getBoundingClientRect().top > middle : node.getBoundingClientRect().top < middle - 2) || ordered[0];
  if (target) jumpTo(target.id);
}

function jumpTurn(direction) {
  const turns = [...document.querySelectorAll('section.turn')];
  const offset = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 160) + 4;
  const ordered = direction > 0 ? turns : turns.reverse();
  const target = ordered.find(node => direction > 0 ? node.getBoundingClientRect().top > offset + 2 : node.getBoundingClientRect().top < offset - 2);
  if (target) window.scrollTo({ top: window.scrollY + target.getBoundingClientRect().top - offset + 4, behavior: 'smooth' });
}

function renderTurn(turn) {
  const section = el('section', { class: 'turn', id: `turn-${turn.n}` });
  const { body, contexts } = splitContext(promptText(turn.prompt));
  const modelMs = Math.max(turn.totalMs - turn.toolMs, 0);
  const head = el('div', { class: 'turn-head' });
  head.append(el('h2', {}, `Turn ${turn.n} <span class="when">${new Date(turn.start).toISOString().replace('T', ' ').slice(0, 19)}Z${turn.user ? ' · ' + esc(turn.user) : ''}</span>`));
  const prompt = el('div', { class: 'prompt' });
  prompt.innerHTML = escapedWithChips(body);
  head.append(prompt);
  for (const context of contexts) {
    const details = el('details', { class: 'ctx' }, `<summary>agent context</summary>`);
    const pre = el('pre'); pre.textContent = context; details.append(pre); head.append(details);
  }
  head.append(el('div', { class: 'turn-stats' },
    `<span><b>${secs(turn.totalMs)}</b> total</span><span>gaps ${secs(modelMs)} (${Math.round(modelMs / Math.max(turn.totalMs, 1) * 100)}%)</span>` +
    `<span>recorded tool time ${secs(turn.toolMs)}</span><span>${turn.tools.length} tool calls</span>` +
    `<span style="color:var(--fail)">${turn.failures ? turn.failures + ' failed' : ''}</span><span>${turn.stop ? 'stop: ' + esc(turn.stop) : 'no stop frame (still running or crashed)'}</span>`));
  const turnTokens = renderTurnTokens(turn);
  if (turnTokens) head.append(turnTokens);
  if (turn.flags.length) head.append(renderFlags(turn));
  if (turn.context) head.append(renderContext(turn));
  head.append(renderTimeline(turn));
  if (turn.calls.length) head.append(renderModelLane(turn), renderModelCalls(turn));
  head.append(el('div', { class: 'legend' }, `<span><i style="background:var(--model-soft);border:1px solid var(--model)"></i>model / unrecorded</span><span><i style="background:var(--tool)"></i>tool</span><span><i class="exec"></i>⚙ tool / SDK execution (deterministic)</span><span><i style="background:transparent;border:1px solid var(--model)"></i>round N: model generation</span><span><i style="background:var(--warn)"></i>tool reported failure</span><span><i style="background:var(--fail)"></i>tool failed</span><span><i style="background:var(--msg);opacity:.5"></i>reply</span>`));
  section.append(renderTurnBar(turn), head);

  const items = el('div', { class: 'items' });
  let previousEnd = turn.start;
  for (const item of turn.items) {
    const gapMs = item.start - previousEnd;
    const wrapper = el('div', { class: 'step' });
    if (gapMs > 300) wrapper.append(el('div', { class: `gap ${gapMs > SLOW_MODEL_MS ? 'slow' : ''}`, title: 'Time between steps: model latency, and anything not recorded as a step.' }, `${secs(gapMs)} gap · +${secs(item.start - turn.start)}`));
    if (item.kind === 'thought') {
      const details = el('details', { class: 'thought' });
      const first = item.text.trim().split('\n').find(Boolean) || '';
      details.append(el('summary', {}, `${roundTag(item)}<b>Thinking</b> · ${esc(first.replace(/\*\*/g, ''))} <span style="opacity:.7">· ${item.text.length.toLocaleString()} chars</span>`));
      const textBody = el('div', { class: 'body' }); textBody.textContent = item.text.trim();
      details.append(textBody);
      wrapper.append(details);
      wrapper.dataset.kind = 'thought';
      wrapper.searchText = item.text.toLowerCase();
    } else if (item.kind === 'message') {
      const message = el('div', { class: 'message' }, markdown(item.text));
      const tag = roundTag(item);
      if (tag) message.prepend(el('div', {}, tag));
      wrapper.append(message);
      wrapper.dataset.kind = 'message';
      wrapper.searchText = item.text.toLowerCase();
    } else if (item.kind === 'tool') {
      const node = renderTool(item);
      wrapper.append(node);
      wrapper.dataset.kind = 'tool';
      wrapper.dataset.tool = item.name;
      wrapper.dataset.failed = node.dataset.failed;
      wrapper.searchText = node.searchText;
      wrapper.lazyText = node.lazyText;
    } else if (item.kind === 'error') {
      wrapper.append(el('div', { class: 'error-frame' }, esc(JSON.stringify(item.error, null, 2))));
      wrapper.dataset.kind = 'error'; wrapper.dataset.failed = '1';
      wrapper.searchText = JSON.stringify(item.error).toLowerCase();
    } else {
      wrapper.append(el('div', { class: 'event' }, esc(item.text)));
      wrapper.dataset.kind = 'event';
      wrapper.searchText = item.text.toLowerCase();
    }
    items.append(wrapper);
    previousEnd = Math.max(previousEnd, item.end ?? item.start);
  }
  items.append(el('div', { class: 'end' }, `Turn ended at +${secs(turn.totalMs)}${turn.stop ? ' (' + esc(turn.stop) + ')' : ''}`));
  section.append(items);
  return section;
}

function render() {
  const session = DATA.session || {};
  const turns = buildTurns(DATA.frames || []);
  document.title = `${session.name || 'Agent session'} · Agent Session View`;
  document.getElementById('title').textContent = session.name || 'Untitled agent session';
  document.getElementById('meta').innerHTML = [
    `<code>${esc(session.id)}</code>`, session.model && `model <b>${esc(session.model)}</b>`, session.owner_id && `owner ${esc(session.owner_id)}`,
    session.harness && `harness ${esc(session.harness)}`, session.created_at && `created ${esc(String(session.created_at).slice(0, 19))}`,
  ].filter(Boolean).map(s => `<span>${s}</span>`).join('');

  const allTools = turns.flatMap(t => t.tools);
  const active = turns.reduce((a, t) => a + t.totalMs, 0), toolMs = turns.reduce((a, t) => a + t.toolMs, 0);
  const failures = allTools.filter(i => i.status === 'failed' || i.softFail).length;
  document.getElementById('stats').innerHTML = [
    [turns.length, 'turns'], [allTools.length, 'tool calls'], [failures, 'failed'], [secs(active), 'active time'],
    [`${Math.round((active - toolMs) / Math.max(active, 1) * 100)}%`, 'outside recorded tool time'], [(DATA.frames || []).length, 'log frames'],
    ...(DATA.turn_context?.length ? [[turns.reduce((a, t) => a + t.flags.filter(f => f.level === 'warn').length, 0), 'warning flags']] : []),
    ...(TOKENS ? [[TOKENS.source === 'ai_usage' ? (dollars(TOKENS.cost) ?? 'unpriced') : 'cost unknown', TOKENS.source === 'ai_usage' ? '<a href="#tokens">billed</a>' : '<a href="#tokens">tokens</a>']] : []),
  ].map(([v, l]) => `<div class="stat"><b>${v}</b> ${l}</div>`).join('');

  const counts = {};
  for (const item of allTools) { const c = counts[item.name] ||= { n: 0, bad: 0 }; c.n++; if (item.status === 'failed' || item.softFail) c.bad++; }
  const histogram = document.getElementById('histogram');
  for (const [name, c] of Object.entries(counts).sort((a, b) => b[1].n - a[1].n)) {
    const button = el('button', {}, `${esc(name)} ${c.n}${c.bad ? ` <span class="bad">✕${c.bad}</span>` : ''}`);
    button.onclick = () => { button.classList.toggle('active'); applyFilters(); };
    button.dataset.tool = name;
    histogram.append(button);
  }

  const nav = document.getElementById('nav'), main = document.getElementById('main');
  const tokens = renderTokens();
  if (tokens) main.append(tokens);
  for (const turn of turns) {
    const { body } = splitContext(promptText(turn.prompt));
    nav.append(el('a', { href: `#turn-${turn.n}` }, `<span class="n">Turn ${turn.n}</span><span class="d">${secs(turn.totalMs)}</span>` +
      `<span class="p">${esc(body.replace(/<m-[a-z-]+>[\s\S]*?<\/m-[a-z-]+>/g, '[…]').slice(0, 90)) || '(empty)'}</span>` +
      `<span class="p">${turn.tools.length} tools${turn.failures ? ` · <span class="f">${turn.failures} failed</span>` : ''}` +
      `${turn.flags.some(f => f.level === 'warn') ? ` · <span class="badge" title="${esc(turn.flags.filter(f => f.level === 'warn').map(f => f.id).join(', '))}">⚑ ${turn.flags.filter(f => f.level === 'warn').length}</span>` : ''}</span>`));
    main.append(renderTurn(turn));
  }
  if (!turns.length) main.append(el('p', {}, 'No prompts in this session log.'));
  const header = document.getElementById('top');
  const setHeader = () => document.documentElement.style.setProperty('--header-h', `${header.offsetHeight}px`);
  setHeader(); window.addEventListener('resize', setHeader);
}

function applyFilters() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const onlyFailures = document.getElementById('onlyFailures').checked;
  const hideThinking = document.getElementById('hideThinking').checked;
  const tools = [...document.querySelectorAll('#histogram button.active')].map(b => b.dataset.tool);
  for (const step of document.querySelectorAll('.step')) {
    let show = true;
    if (hideThinking && step.dataset.kind === 'thought') show = false;
    if (onlyFailures && !step.dataset.failed) show = false;
    if (tools.length && !(step.dataset.kind === 'tool' && tools.includes(step.dataset.tool))) show = false;
    if (show && query) show = (step.searchText || '').includes(query) || (step.lazyText ? step.lazyText().includes(query) : false);
    step.classList.toggle('hidden', !show);
  }
}

render();
document.getElementById('search').addEventListener('input', () => { clearTimeout(window.searchTimer); window.searchTimer = setTimeout(applyFilters, 200); });
for (const id of ['onlyFailures', 'hideThinking']) document.getElementById(id).addEventListener('change', applyFilters);
document.getElementById('expandThinking').addEventListener('change', e => document.querySelectorAll('details.thought').forEach(d => d.open = e.target.checked));
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const keys = { n: () => jumpFailure(1), p: () => jumpFailure(-1), j: () => jumpTurn(1), k: () => jumpTurn(-1) };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});
// Light or dark on request, else the system's; remembered per browser.
function setTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('hljs-light').media = dark ? 'not all' : 'all';
  document.getElementById('hljs-dark').media = dark ? 'all' : 'not all';
}
try { setTheme(localStorage.getItem('asv-theme')); } catch { setTheme(null); }
document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  setTheme(next);
  try { localStorage.setItem('asv-theme', next); } catch {}
};
const openCode = open => document.querySelectorAll('details.tool[data-code="1"]').forEach(d => d.open = open);
openCode(document.getElementById('expandCode').checked);
document.getElementById('expandCode').addEventListener('change', e => openCode(e.target.checked));
document.getElementById('expandTools').addEventListener('change', e => document.querySelectorAll('details.tool').forEach(d => d.open = e.target.checked));
</script>
