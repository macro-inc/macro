[package]
edition = "2024"
name = "ai_projections"
publish = false
version = "0.1.0"

[features]
default = ["inbound", "outbound", "ports", "sqs"]
inbound = ["ports", "dep:axum", "dep:model_user", "dep:tracing", "dep:utoipa"]
outbound = [
  "ports",
  "dep:agent",
  "dep:ai_tools",
  "dep:ai_usage",
  "dep:futures",
  "dep:sqlx",
  "dep:tokio",
  "dep:tracing",
]
ports = []
sqs = ["dep:aws-sdk-sqs", "dep:tokio", "dep:tracing"]

[dependencies]
agent = { path = "../agent", optional = true }
ai_tools = { path = "../ai_tools", optional = true }
ai_usage = { path = "../ai_usage", optional = true }
anyhow = { workspace = true }
aws-sdk-sqs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
futures = { workspace = true, optional = true }
hex = { workspace = true }
macro_user_id = { path = "../macro_user_id" }
model_user = { path = "../model_user", features = ["axum"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"], optional = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true }
