type GraphqlUser {
	"""
	Stable id of the authenticated user.
	"""
	id: ID!
	"""
	Fetch a page of Soup items using the existing Soup filter AST format.
	"""
	soup(input: SoupInput!): SoupPage!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

"""
Input for `Query.soup`.
"""
input SoupInput {
	"""
	Maximum number of items to return. Defaults to 20, max 500.
	"""
	limit: Int
	"""
	Whether to return expanded Soup items. Defaults to true.
	"""
	expand: Boolean
	"""
	Simple timestamp sort. Defaults to VIEWED_AT. Frecency is intentionally
	not supported by this initial GraphQL adapter.
	"""
	sortMethod: GraphqlSimpleSortMethod
	"""
	Opaque cursor returned by a previous GraphQL Soup response.
	"""
	cursor: String
	"""
	Email preview view used when hydrating email Soup items.
	"""
	emailView: GraphqlEmailView
	"""
	AST-shaped filters applied to each Soup entity type.
	"""
	filters: GraphqlEntityFilterAst
}

"""
Page returned by `Query.soup`.
"""
type SoupPage {
	"""
	Items in the current page.
	"""
	items: [GraphqlSoupItem!]!
	"""
	Opaque cursor for the next page, if one exists.
	"""
	nextCursor: String
	"""
	Whether more items are available after this page.
	"""
	hasMore: Boolean!
}

type SoupQueryRoot {
	"""
	The authenticated user.
	"""
	user: GraphqlUser!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its field be provided)
"""
directive @oneOf on INPUT_OBJECT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: SoupQueryRoot
}

