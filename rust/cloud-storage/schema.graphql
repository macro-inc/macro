	"""
	propertyDefinitionId: ID!
	displayName: String!
	dataType: GraphqlSoupDataType!
	isMultiSelect: Boolean!
	specificEntityType: GraphqlSoupPropertyEntityType
	isSystem: Boolean!
	isMetadata: Boolean!
