[package]
description = "xtask workflows: generate/verify the repo's GitHub Actions workflows from Rust"
edition = "2024"
name = "xtask-workflows"
publish = false
version = "0.1.0"

[[bin]]
name = "xtask-workflows"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
# Define GitHub Actions workflows in Rust.
gh-workflow = "0.8"
indoc = "2"
serde_yaml = "0.9"
xtask-paths = { path = "../xtask-paths" }
