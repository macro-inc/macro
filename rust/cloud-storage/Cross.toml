[build]
default-target = "x86_64-unknown-linux-gnu" # use this target if none is explicitly provided

[build.env]
passthrough = ["SQLX_OFFLINE=true"]

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge"
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get -y upgrade",
    "apt-get --assume-yes install libssl-dev:$CROSS_DEB_ARCH gcc-10 g++-10 && update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 60 && update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 60",
]
