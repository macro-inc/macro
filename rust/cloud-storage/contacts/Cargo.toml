[package]
edition = "2024"
name = "contacts"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_auth",
  "dep:macro_middleware",
  "dep:macro_user_id",
  "dep:model_user",
  "dep:rate_limit",
  "dep:redis",
  "dep:utoipa",
]

[dependencies]
anyhow = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
connection_gateway_client = { path = "../connection_gateway_client" }
contacts_db_client = { path = "../contacts_db_client" }
macro_auth = { path = "../macro_auth", optional = true }
macro_middleware = { path = "../macro_middleware", default-features = false, features = [
  "auth",
], optional = true }
macro_user_id = { path = "../macro_user_id", optional = true }
model = { path = "../model" }
model_user = { path = "../model_user", features = ["axum"], optional = true }
rate_limit = { path = "../rate_limit", features = ["axum"], optional = true }
redis = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_worker = { path = "../sqs_worker" }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
http-body-util = { workspace = true }
macro_auth = { path = "../macro_auth", features = ["testing"] }
rate_limit = { path = "../rate_limit", features = ["axum", "testing"] }
rootcause = { workspace = true }
tower = { workspace = true }
