  # ============================================================================
  # document_storage_service (Port 8086)
  # Main document storage API
  # ============================================================================
  document_storage_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: document_storage_service
    ports:
      - "8086:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${MACRODB_URL}
      - DOCUMENT_STORAGE_BUCKET=${DOCUMENT_STORAGE_BUCKET}
      - DOCX_DOCUMENT_UPLOAD_BUCKET=${DOCX_DOCUMENT_UPLOAD_BUCKET}
      - DOCUMENT_DELETE_QUEUE=${DOCUMENT_DELETE_QUEUE}
      - CLOUDFRONT_DISTRIBUTION_URL=${DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_DISTRIBUTION_URL}
      - CLOUDFRONT_SIGNER_PUBLIC_KEY_ID=${DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_SIGNER_PUBLIC_KEY_ID}
      - CLOUDFRONT_SIGNER_PRIVATE_KEY_SECRET_NAME=${DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_SIGNER_PRIVATE_KEY_SECRET_NAME}
      - DOCUMENT_PERMISSION_JWT_SECRET_KEY=${DOCUMENT_PERMISSION_JWT_SECRET_KEY}
      - REDIS_URI=redis://redis:6379
      - NOTIFICATION_QUEUE=${NOTIFICATION_QUEUE}
      - SEARCH_EVENT_QUEUE=${SEARCH_EVENT_QUEUE}
      - COMMS_SERVICE_URL=http://comms_service:8080
      - CONNECTION_GATEWAY_URL=http://connection_gateway:8080
      - BULK_UPLOAD_REQUESTS_TABLE=${BULK_UPLOAD_REQUEST_TABLE}
      - UPLOAD_STAGING_BUCKET=${UPLOAD_STAGING_BUCKET}
      - SYNC_SERVICE_URL=${SYNC_SERVICE_URL}
      - SYNC_SERVICE_AUTH_KEY=${SYNC_SERVICE_AUTH_KEY}
      - AUTHENTICATION_SERVICE_SECRET_KEY=local
      - DOCUMENT_STORAGE_SERVICE_AUTH_KEY=local
      - INTERNAL_API_SECRET_KEY=local
      - DOCUMENT_LIMIT=${DOCUMENT_LIMIT}
      - PRESIGNED_URL_EXPIRY_SECONDS=${DOCUMENT_STORAGE_SERVICE_PRESIGNED_URL_EXPIRY_SECONDS}
      - PRESIGNED_URL_BROWSER_CACHE_EXPIRY_SECONDS=${DOCUMENT_STORAGE_SERVICE_PRESIGNED_URL_BROWSER_CACHE_EXPIRY_SECONDS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - EMAIL_SERVICE_URL=bogus
      - AUTHENTICATION_SERVICE_URL=http://authentication_service:8080
      - AUDIENCE=${AUDIENCE}
      - ISSUER=${ISSUER}
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}
    depends_on:
      - redis
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # ============================================================================
  # email_service (Port 8087)
  # Email processing and management
  # ============================================================================
  email_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: email_service
    ports:
      - "8087:8080"
    environment:
      - PORT=8080
      - MACRO_DB_URL=${MACRODB_URL}
      - REDIS_URI=redis://redis:6379
      - LINK_MANAGER_QUEUE=${EMAIL_SERVICE_LINK_MANAGER_QUEUE}
      - EMAIL_SCHEDULED_QUEUE=${EMAIL_SCHEDULED_QUEUE}
      - GMAIL_INBOX_SYNC_QUEUE=${GMAIL_INBOX_SYNC_QUEUE}
