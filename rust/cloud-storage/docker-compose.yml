  # ============================================================================
  # static_file_service (Port 8094)
  # Static file serving - DynamoDB
  # ============================================================================
  static_file_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: static_file_service
    ports:
      - "8094:8080"
    environment:
      - PORT=8080
      - DYNAMODB_TABLE_NAME=${STATIC_FILE_SERVICE_DYNAMODB_TABLE_NAME}
      - STATIC_STORAGE_BUCKET=${STATIC_FILE_SERVICE_STATIC_STORAGE_BUCKET}
      - SERVICE_URL=${STATIC_FILE_SERVICE_SERVICE_URL}
      - S3_EVENT_QUEUE_URL=${STATIC_FILE_SERVICE_S3_EVENT_QUEUE_URL}
      - INTERNAL_API_SECRET_KEY=local
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - AUDIENCE=${AUDIENCE}
      - ISSUER=${ISSUER}
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}

    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # ============================================================================
  # unfurl_service (Port 8095)
  # URL unfurling - no dependencies
  # ============================================================================
  unfurl_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: unfurl_service
    ports:
      - "8095:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=local
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cloud-storage-network:
    driver: bridge
