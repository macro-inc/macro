      - SFS_UPLOADER_QUEUE=${EMAIL_SERVICE_SFS_UPLOADER_QUEUE}
      - SFS_DELETE_QUEUE=${EMAIL_SERVICE_SFS_DELETE_QUEUE}
      - ATTACHMENT_BUCKET=${EMAIL_SERVICE_ATTACHMENT_BUCKET}
      - NOTIFICATIONS_ENABLED=${EMAIL_SERVICE_NOTIFICATIONS_ENABLED}
      - AUTHENTICATION_SERVICE_URL=http://authentication_service:8080
      - AUTHENTICATION_SERVICE_SECRET_KEY=local
      - STATIC_FILE_SERVICE_URL=http://static_file_service:8080
      - CONNECTION_GATEWAY_URL=http://connection_gateway:8080
      - DOCUMENT_STORAGE_SERVICE_URL=http://document_storage_service:8080
      - CLOUDFRONT_DISTRIBUTION_URL=${EMAIL_SERVICE_CLOUDFRONT_DISTRIBUTION_URL}
      - CLOUDFRONT_SIGNER_PUBLIC_KEY_ID=${EMAIL_SERVICE_CLOUDFRONT_SIGNER_PUBLIC_KEY_ID}
      - CLOUDFRONT_SIGNER_PRIVATE_KEY=${EMAIL_SERVICE_CLOUDFRONT_SIGNER_PRIVATE_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - AUDIENCE=${AUDIENCE}
      - CONNECTION_GATEWAY_TABLE=${CONNECTION_GATEWAY_TABLE}
      - ISSUER=${ISSUER}
      - MACRO_DB_URL=${MACRODB_URL}
      - INTERNAL_API_SECRET_KEY=local
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}
    depends_on:
      - authentication_service
      - document_storage_service
      - connection_gateway
      - static_file_service
      - redis
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # ============================================================================
  # experiment_service (Port 8088)
  # Feature flags and experiments
  # ============================================================================
  experiment_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: experiment_service
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${MACRODB_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - AUDIENCE=${AUDIENCE}
      - CONNECTION_GATEWAY_TABLE=${CONNECTION_GATEWAY_TABLE}
      - ISSUER=${ISSUER}
      - MACRO_DB_URL=${MACRODB_URL}
      - INTERNAL_API_SECRET_KEY=local
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}

    networks:
      - cloud-storage-network
