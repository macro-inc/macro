# Cloud Storage Services - Local Development
services:
  redis:
    image: 'redis/redis-stack:latest'
    ports:
      - '6379:6379' # Expose Redis on the default port
      - '8001:8001' # Expose Redis Stack Server UI/tools
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - cloud-storage-network 
  # ============================================================================
  # authentication_service (Port 8080)
  # Primary auth service - depends on FusionAuth, Redis, MacroDB
  # ============================================================================
  authentication_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: authentication_service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${MACRODB_URL}
      - REDIS_URI=${REDIS_URI}
      - BASE_URL=http://authentication_service:8080
      - FUSIONAUTH_API_KEY_SECRET_KEY=${FUSIONAUTH_API_KEY_SECRET_KEY}
      - FUSIONAUTH_CLIENT_ID=${FUSIONAUTH_CLIENT_ID}
      - FUSIONAUTH_CLIENT_SECRET_KEY=${FUSIONAUTH_CLIENT_SECRET_KEY}
      - FUSIONAUTH_APPLICATION_ID=${FUSIONAUTH_APPLICATION_ID}
      - FUSIONAUTH_BASE_URL=${FUSIONAUTH_BASE_URL}
      - FUSIONAUTH_OAUTH_REDIRECT_URI=${FUSIONAUTH_OAUTH_REDIRECT_URI}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET_KEY=${GOOGLE_CLIENT_SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET_KEY=${STRIPE_WEBHOOK_SECRET_KEY}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - SERVICE_INTERNAL_AUTH_KEY=local
      - INTERNAL_API_SECRET_KEY=local
      - COMMS_SERVICE_URL=http://comms_service:8080
      - DOCUMENT_STORAGE_SERVICE_URL=http://document_storage_service:8080
      - NOTIFICATION_SERVICE_URL=http://notification_service:8079
      - NOTIFICATION_QUEUE=${NOTIFICATION_QUEUE}
      - SEARCH_EVENT_QUEUE=${SEARCH_EVENT_QUEUE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - MACRO_API_TOKEN_PRIVATE_SECRET_KEY=${MACRO_API_TOKEN_PRIVATE_SECRET_KEY}
      - AUDIENCE=${AUDIENCE}
      - ISSUER=${ISSUER}
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}
      - MACRO_API_TOKEN_EXPIRY_SECONDS=${MACRO_API_TOKEN_EXPIRY_SECONDS}
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # comms_service (Port 8081)
  # Communications/messaging service
  # ============================================================================
  comms_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: comms_service
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - MACRO_DB_URL=${MACRODB_URL}
      - DATABASE_URL=${MACRODB_URL}
      - CONNECTION_GATEWAY_URL=http://connection_gateway:8080
      - NOTIFICATION_QUEUE=${NOTIFICATION_QUEUE}
      - DOCUMENT_STORAGE_SERVICE_URL=http://document_storage_service:8080
      - CONTACTS_QUEUE=${CONTACTS_QUEUE}
      - AUTHENTICATION_SERVICE_URL=http://authentication_service:8080
      - AUTHENTICATION_SERVICE_SECRET_KEY=${AUTHENTICATION_SERVICE_SECRET_KEY}
      - SEARCH_EVENT_QUEUE=${SEARCH_EVENT_QUEUE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - AUDIENCE=${AUDIENCE}
      - ISSUER=${ISSUER}
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}
      - INTERNAL_API_SECRET_KEY=local
      - DOCUMENT_PERMISSION_JWT_SECRET_KEY=${DOCUMENT_PERMISSION_JWT_SECRET_KEY}
    depends_on:
      - authentication_service
      - connection_gateway
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # connection_gateway (Port 8082)
  # WebSocket gateway - Redis only
  # ============================================================================
  connection_gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: connection_gateway_service
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - REDIS_HOST=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - AUDIENCE=${AUDIENCE}
      - CONNECTION_GATEWAY_TABLE=${CONNECTION_GATEWAY_TABLE}
      - ISSUER=${ISSUER}
      - MACRO_DB_URL=${MACRODB_URL}
      - INTERNAL_API_SECRET_KEY=local
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}
    depends_on:
      - redis
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # contacts_service (Port 8083)
  # Contact management - ContactsDB
  # ============================================================================
  contacts_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: contacts_service
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${CONTACTS_DB_URL}
      - CONTACTS_QUEUE=${CONTACTS_QUEUE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ENVIRONMENT=local
      - AUDIENCE=${AUDIENCE}
      - CONNECTION_GATEWAY_TABLE=${CONNECTION_GATEWAY_TABLE}
      - ISSUER=${ISSUER}
      - MACRO_DB_URL=${MACRODB_URL}
      - INTERNAL_API_SECRET_KEY=local
      - MACRO_API_TOKEN_ISSUER=${MACRO_API_TOKEN_ISSUER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MACRO_API_TOKEN_PUBLIC_KEY=${MACRO_API_TOKEN_PUBLIC_KEY}
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # ============================================================================
  # convert_service (Port 8084)
  # Document format conversion - requires LibreOffice
  # ============================================================================
  convert_service:
    build:
      context: .
      dockerfile: Dockerfile.convert_service
    ports:
      - "8084:8080"
    environment:
      - PORT=8080
      - CONVERT_QUEUE=${CONVERT_QUEUE}
      - LOK_PATH=${LOK_PATH}
      - DATABASE_URL=${MACRODB_URL}
      - DOCUMENT_STORAGE_BUCKET=${DOCUMENT_STORAGE_BUCKET}
      - WEB_SOCKET_RESPONSE_LAMBDA=${WEB_SOCKET_RESPONSE_LAMBDA}
      - INTERNAL_API_SECRET_KEY=local
      - ENVIRONMENT=local
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
    networks:
      - cloud-storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
