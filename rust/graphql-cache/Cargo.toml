[workspace]
resolver = "2"
members = ["cache-core", "cache-idb", "cache-sqlite"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
apollo-parser = "0.8"
apollo-compiler = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
lru = "0.16"
sha2 = "0.10"
toml = "0.9"
