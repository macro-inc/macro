# Entity key policy for the normalized GraphQL cache.
#
# Every *output object type* in the schema must appear either in [keys]
# (a normalized entity, stored as its own record, referenced by
# `Typename:keyValue`) or in `embedded` (stored inline in the parent
# record). The build fails if a type is missing from both — this is
# deliberate: when the schema grows a new type, someone must decide how it
# caches.
#
# Rules of thumb:
#   - key fields must be selected by every query that fetches the type
#     (the build can't check this; reviews must).
#   - a type is only keyable if its key identifies THE SAME LOGICAL VALUE
#     everywhere it appears. GraphqlSoupProperty is the canonical
#     counter-example: `id` is the property *definition* id, but `value` is
#     per-entity — keying it would merge property values across entities.

# The identity witness: when a record of this type is written, its key id is
# compared against the identity bound to this cache. A mismatch means the
# session user changed → the engine wipes and rebinds (silent restart).
identity_witness = "GraphqlUser"

embedded = [
  # Participant rows have no id of their own.
  "GraphqlSoupCallParticipant",
  "GraphqlSoupChannelParticipant",
  # Plain value objects.
  "GraphqlSoupDocumentSubType",
  # Property values are entity-specific; `id` is the shared definition id.
  "GraphqlSoupProperty",
  "GraphqlSoupPropertyEntityReference",
  "GraphqlSoupPropertyValue",
  # Query-scoped page wrapper (cursor/hasMore are argument-dependent).
  "SoupPage",
]

[keys]
GraphqlSoupCall = ["id"]
GraphqlSoupChannel = ["id"]
GraphqlSoupChannelMessage = ["messageId"]
GraphqlSoupChannelThread = ["id"]
GraphqlSoupChat = ["id"]
GraphqlSoupCrmCompany = ["id"]
GraphqlSoupDocument = ["id"]
GraphqlSoupEmailAttachment = ["id"]
GraphqlSoupEmailLabel = ["id"]
GraphqlSoupEmailParticipant = ["id"]
GraphqlSoupEmailThread = ["id"]
GraphqlSoupForeignEntity = ["id"]
GraphqlSoupItem = ["id"]
GraphqlSoupNotification = ["id"]
GraphqlSoupProject = ["id"]
GraphqlUser = ["id"]
