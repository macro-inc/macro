# ast-grep configuration — custom structural rules for repo conventions.
#
# These rules are consumed by:
#   - CI            (ast-grep scan)
#   - local runs    (bunx @ast-grep/cli scan)
#   - CodeRabbit    (reviews.tools.ast-grep.rule_dirs in .coderabbit.yaml)
#
# Rules encode conventions from docs/STYLE_GUIDE.md (repo root). severity: error
# rules are CI-blocking (zero existing violations); severity: warning rules
# surface on changed code via CodeRabbit without failing CI while existing
# violations are burned down.
#
# TypeScript rules declare `language: tsx` and `languageGlobs` routes `.ts`
# files to that parser too, so one `ts-*` rule covers both extensions — the
# tsx grammar is a superset. CodeRabbit reads `rule_dirs` and not this file,
# so its ast-grep pass only sees `.tsx`; CI and local runs cover both.
ruleDirs:
  - rules/ast-grep
languageGlobs:
  tsx:
    - "*.ts"
