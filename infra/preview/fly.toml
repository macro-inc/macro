# Fly config for per-PR preview apps. The workflow overrides the app name
# (`--app macro-pr-<N>`) and supplies the image (`--image`); this file carries
# everything else. See infra/preview/README.md.
app = "macro-preview-template"
primary_region = "ewr"

# Everything (frontend, APIs, WebSockets, Mailpit) is behind the stack's
# single-origin Caddy proxy.
[http_service]
  internal_port = 8090
  force_https = true
  # The whole point: an idle preview suspends to ~zero cost and the fly-proxy
  # wakes it on the next request.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    # First boot loads the baked images and restores the init snapshot before
    # the backend answers — give it room.
    grace_period = "5m"
    method = "GET"
    path = "/auth/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 8
  memory = "16gb"

[[restart]]
  policy = "on-failure"
