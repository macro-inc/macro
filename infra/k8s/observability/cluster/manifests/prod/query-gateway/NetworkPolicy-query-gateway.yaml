apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-gateway
  namespace: observability
spec:
  egress:
    - ports:
        - port: 3100
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 3200
          protocol: TCP
      to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8081
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: query-gateway
  policyTypes:
    - Ingress
    - Egress
