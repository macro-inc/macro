apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: query-gateway
  name: query-gateway
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: query-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: 4f1a9044e56f720561030086ff02638c8a1976db5a1ec13d5e518a2a89baf17e
      labels:
        app.kubernetes.io/name: query-gateway
        observability.macro.com/telemetry-read: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - nginx
            - -c
            - /etc/nginx/conf/nginx.conf
            - -g
            - daemon off;
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          name: nginx
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/nginx/conf
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: query-gateway
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: query-gateway
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - configMap:
            name: query-gateway
          name: config
        - emptyDir: {}
          name: tmp
