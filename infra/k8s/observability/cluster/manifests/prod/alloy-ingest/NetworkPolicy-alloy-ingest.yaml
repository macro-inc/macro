apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-ingest
  namespace: observability
spec:
  egress:
    - ports:
        - port: 3100
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 4317
          protocol: TCP
      to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge
      ports:
        - port: 4318
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - port: 12345
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: alloy-ingest
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
    - Egress
