          `set(attributes["macro.ingest.nested"], true) where attributes["macro.ingest.scan"] == true and (cache["json"] == nil or IsMatch(cache["json"], "\":\\[") or IsMatch(cache["json"], "\":\\{"))`,
        ]
      }
      log_statements {
        context = "log"
        statements = [`replace_all_patterns(attributes, "value", "([\\p{L}\\p{M}\\p{N}._%+'!#$&*^~{}-]+(?:@|%40)(?:[\\p{L}\\p{M}\\p{N}-]+\\.)+\\p{L}[\\p{L}\\p{M}\\p{N}-]*)", "$1", SHA256) where attributes["macro.ingest.scan"] == true`]
      }
      log_statements {
        context = "log"
        error_mode = "ignore"
        statements = [
          `delete_key(attributes, "macro.ingest.nested") where attributes["macro.ingest.nested"] == true and not IsMatch(attributes, "([\\p{L}\\p{M}\\p{N}._%+'!#$&*^~{}-]+(?:@|%40)(?:[\\p{L}\\p{M}\\p{N}-]+\\.)+\\p{L}[\\p{L}\\p{M}\\p{N}-]*)")`,
