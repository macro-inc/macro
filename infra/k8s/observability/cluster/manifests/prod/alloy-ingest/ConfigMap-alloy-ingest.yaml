        statements = [`replace_pattern(body, "([\\p{L}\\p{M}\\p{N}._%+'!#$&*^~{}-]+(?:@|%40)(?:[\\p{L}\\p{M}\\p{N}-]+\\.)+\\p{L}[\\p{L}\\p{M}\\p{N}-]*)", "$1", SHA256) where IsString(body) and (IsMatch(body, "@") or IsMatch(body, "%40"))`]
