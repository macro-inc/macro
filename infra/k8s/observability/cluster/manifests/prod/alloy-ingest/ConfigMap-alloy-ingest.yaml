      log_statements {
        context = "log"
        error_mode = "ignore"
        statements = [`set(body, String(body)) where (IsMap(body) or IsList(body)) and IsMatch(body, "([\\p{L}\\p{M}\\p{N}._%+'!#$&*^~{}-]+(?:@|%40)(?:[\\p{L}\\p{M}\\p{N}-]+\\.)+\\p{L}[\\p{L}\\p{M}\\p{N}-]*)")`]
