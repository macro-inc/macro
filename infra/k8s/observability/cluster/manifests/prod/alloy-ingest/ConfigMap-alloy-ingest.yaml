      log_statements {
        context = "log"
        statements = [
          `replace_all_patterns(attributes, "value", "([\\p{L}\\p{M}\\p{N}._%+'!#$&*^~{}-]+(?:@|%40)(?:[\\p{L}\\p{M}\\p{N}-]+\\.)+\\p{L}[\\p{L}\\p{M}\\p{N}-]*)", "$1", SHA256) where attributes["macro.ingest.nested"] == true`,
