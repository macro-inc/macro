apiVersion: v1
data:
  config.alloy: |-
    local.file "otlp_token" {
      filename = sys.env("CREDENTIALS_DIRECTORY") + "/otlp_token"
      is_secret = true
    }

    otelcol.auth.bearer "ingest" {
      token = local.file.otlp_token.content
    }

    otelcol.receiver.otlp "ingest" {
      http {
        endpoint = "0.0.0.0:4318"
        auth = otelcol.auth.bearer.ingest.handler
        max_request_body_size = "8MiB"
      }
      output {
        logs = [otelcol.processor.memory_limiter.ingest.input]
        traces = [otelcol.processor.memory_limiter.ingest.input]
        metrics = [otelcol.processor.memory_limiter.ingest.input]
      }
    }

    otelcol.processor.memory_limiter "ingest" {
      check_interval = "1s"
      limit = "768MiB"
      spike_limit = "128MiB"
      output {
        logs = [otelcol.processor.filter.local_logs.input]
        traces = [otelcol.processor.transform.ai_content.input]
        metrics = [otelcol.processor.batch.ingest.input]
      }
    }

    // Local stacks forward their logs here (docker/grafana-forwarder), and one
    // service failing in a loop sent more than every other sender together, nearly
    // all of it error-level. Only local-telemetry's run events are kept; the rest
    // stay in the stack's own Loki.
    otelcol.processor.filter "local_logs" {
      error_mode = "ignore"
      logs {
        log_record = [
          `(resource.attributes["deployment.environment"] == "local" or resource.attributes["deployment.environment.name"] == "local") and resource.attributes["service.name"] != "local-telemetry"`,
        ]
      }
      output { logs = [otelcol.processor.batch.ingest.input] }
    }

    // What people and models wrote never reaches storage. Token counts, models,
    // operations, outcomes and the macro.genai.* sizes stay. A failed statement
    // fails the batch, so content can't slip through.
    otelcol.processor.transform "ai_content" {
      error_mode = "propagate"
      trace_statements {
        context = "span"
        statements = [
          `delete_matching_keys(attributes, "^gen_ai\\.(input|output|prompt|completion|choice|system_instructions|(system|user|assistant|tool)\\.message|tool\\.definitions|tool\\.call\\.(arguments|result))(\\.|$)")`,
          // A harness's own title for a tool call, often its command line. Where it
          // gave no tool name, the title is the name and part of the span's.
          `delete_key(attributes, "macro.genai.tool.title")`,
          `set(name, "execute_tool") where IsMatch(attributes["gen_ai.tool.name"], "[^A-Za-z0-9_:-]")`,
          `delete_key(attributes, "gen_ai.tool.name") where IsMatch(attributes["gen_ai.tool.name"], "[^A-Za-z0-9_:-]")`,
          // A provider's error can quote the request, and a tool's is its output.
          // error.type stays.
          `set(status.message, "") where attributes["gen_ai.operation.name"] != nil`,
        ]
      }
      trace_statements {
        context = "spanevent"
        statements = [
          `delete_matching_keys(attributes, "^gen_ai\\.(input|output|prompt|completion|choice|system_instructions|(system|user|assistant|tool)\\.message|tool\\.definitions|tool\\.call\\.(arguments|result))(\\.|$)")`,
          `delete_matching_keys(attributes, "^(error|exception\\.(message|stacktrace))$") where span.attributes["gen_ai.operation.name"] != nil`,
          // The model client's events carry responses it couldn't parse, in the
          // event's name or its fields.
          `set(name, "rig") where IsMatch(attributes["target"], "^rig")`,
          `keep_keys(attributes, ["level", "target"]) where IsMatch(attributes["target"], "^rig")`,
        ]
      }
      output { traces = [otelcol.processor.batch.ingest.input] }
    }

    otelcol.processor.batch "ingest" {
      timeout = "1s"
      send_batch_size = 512
      send_batch_max_size = 1024
      output {
        logs = [otelcol.exporter.otlphttp.loki.input]
<<<<<<< HEAD
        traces = [otelcol.exporter.otlp.tempo.input, otelcol.processor.filter.derived.input]
||||||| parent of c4e4c29d465 (feat(observability): sample whole traces before storage)
        traces = [otelcol.exporter.otlp.tempo.input]
=======
        traces = [otelcol.exporter.loadbalancing.sampler.input]
>>>>>>> c4e4c29d465 (feat(observability): sample whole traces before storage)
        metrics = [otelcol.exporter.prometheus.metrics.input]
      }
    }

    otelcol.exporter.otlphttp "loki" {
      client { endpoint = "http://loki.observability.svc.cluster.local:3100/otlp" }
      sending_queue { queue_size = 256 }
    }

    // Every span of a trace to the same sampler (modules/sampler in
    // infra/k8s/observability/cluster), which keeps or drops whole traces. The
    // queue is in front of the routing, so a span waiting here goes to a sampler
    // that is up when it leaves; a full one holds senders back instead of dropping.
    otelcol.exporter.loadbalancing "sampler" {
      timeout = "10s"
      resolver {
        dns {
          hostname = "alloy-sampler.observability.svc.cluster.local"
          interval = "5s"
        }
      }
      protocol {
        otlp {
          timeout = "2s"
          queue { enabled = false }
          retry { enabled = false }
          client {
            tls { insecure = true }
          }
        }
      }
      sending_queue {
        queue_size = 256
        block_on_overflow = true
      }
      retry_on_failure { max_elapsed_time = "2m" }
    }

    otelcol.exporter.prometheus "metrics" {
      forward_to = [prometheus.remote_write.local.receiver]
    }

    prometheus.remote_write "local" {
      endpoint { url = "http://mimir.observability.svc.cluster.local:8080/api/v1/push" }
    }

    // Generated by infra/k8s/observability/cluster/modules/derived-metrics.
    otelcol.processor.filter "derived" {
      error_mode = "ignore"
      traces {
        span      = [`not ((name == "chat_streaming" and resource.attributes["service.name"] == "agent-harness-service") or (name == "agent.acp.prompt" and resource.attributes["service.name"] == "agent-harness-service") or (attributes["gen_ai.operation.name"] == "execute_tool" and attributes["gen_ai.conversation.id"] != nil and resource.attributes["service.name"] == "agent-harness-service") or (name == "agent.turn" and resource.attributes["service.name"] == "agent-harness-service") or (name == "firecracker_host.launch" and resource.attributes["service.name"] == "firecracker-host") or (attributes["outlook.throttle_origin"] != nil) or (IsMatch(name, "^outlook[.]sync[.]")) or (attributes["outlook.token_cache"] != nil) or (name == "ai.provider_account_unavailable") or (name == "agent.runtime.reattach" and resource.attributes["service.name"] == "agent-harness-service") or (attributes["macro.sampling.class"] == "perf" and resource.attributes["service.name"] == "web-app"))`]
        spanevent = [`true`]
      }
      output { traces = [otelcol.processor.transform.derived.input] }
    }

    otelcol.processor.transform "derived" {
      error_mode = "ignore"
      trace_statements {
        context    = "resource"
        statements = [`keep_keys(attributes, ["gen_ai.usage.cache_read.input_tokens", "gen_ai.usage.cache_creation.input_tokens", "gen_ai.usage.input_tokens", "macro.genai.prompt.connected_integrations.bytes", "macro.genai.prompt.history.bytes", "macro.genai.prompt.identity.bytes", "macro.genai.prompt.macro_prompt.bytes", "macro.genai.prompt.memory.bytes", "macro.genai.prompt.model_id.bytes", "macro.genai.prompt.opener_note.bytes", "macro.genai.prompt.preamble.bytes", "macro.genai.prompt.sdk_docs.bytes", "macro.genai.prompt.session_instructions.bytes", "macro.genai.prompt.session_note.bytes", "macro.genai.prompt.tool_results.bytes", "macro.genai.prompt.tools.eager.bytes", "macro.genai.prompt.tools.loaded.bytes", "macro.genai.tool.result_bytes", "agent.turn.code_executions", "agent.turn.code_failures", "agent.turn.compaction_wait_ms", "agent.stream.model_calls", "agent.runtime.reattach_eager", "agent.runtime.reattach_failures", "agent.runtime.reattach_lazy", "agent.runtime.reattach_sessions", "agent.runtime.reattach_skipped", "outlook.notification_lag_ms", "ui.long_animation_frame_blocking_ms", "ui.elapsed_ms", "graphql.body_ms", "http.body_ms", "runtime.long_animation_frame.blocking_ms", "macro.memory.js_heap.used_bytes", "typing.event_duration_p95_ms", "deployment.environment", "deployment.environment.name", "gen_ai.provider.name", "gen_ai.tool.name", "agent.model", "harness", "ai.provider", "ai.account_unavailable", "host.name", "source", "http.response.status_code", "http.status_code", "outlook.throttle_origin", "outlook.outcome", "outlook.defer_reason", "http.request.method", "outlook.token_cache", "app.platform", "flow.kind", "os.type", "route.id", "ui.outcome", "flow.root", "app.runtime", "typing.surface", "service.name", "gen_ai.operation.name", "gen_ai.conversation.id", "macro.sampling.class", "macro.genai.tool.result_cut", "graphql.body_outcome", "http.body_outcome", "flow.outcome"])`, `truncate_all(attributes, 256)`]
      }
      trace_statements {
        context    = "scope"
        statements = [`keep_keys(attributes, [])`]
      }
      trace_statements {
        context    = "span"
        statements = [`keep_keys(attributes, ["gen_ai.usage.cache_read.input_tokens", "gen_ai.usage.cache_creation.input_tokens", "gen_ai.usage.input_tokens", "macro.genai.prompt.connected_integrations.bytes", "macro.genai.prompt.history.bytes", "macro.genai.prompt.identity.bytes", "macro.genai.prompt.macro_prompt.bytes", "macro.genai.prompt.memory.bytes", "macro.genai.prompt.model_id.bytes", "macro.genai.prompt.opener_note.bytes", "macro.genai.prompt.preamble.bytes", "macro.genai.prompt.sdk_docs.bytes", "macro.genai.prompt.session_instructions.bytes", "macro.genai.prompt.session_note.bytes", "macro.genai.prompt.tool_results.bytes", "macro.genai.prompt.tools.eager.bytes", "macro.genai.prompt.tools.loaded.bytes", "macro.genai.tool.result_bytes", "agent.turn.code_executions", "agent.turn.code_failures", "agent.turn.compaction_wait_ms", "agent.stream.model_calls", "agent.runtime.reattach_eager", "agent.runtime.reattach_failures", "agent.runtime.reattach_lazy", "agent.runtime.reattach_sessions", "agent.runtime.reattach_skipped", "outlook.notification_lag_ms", "ui.long_animation_frame_blocking_ms", "ui.elapsed_ms", "graphql.body_ms", "http.body_ms", "runtime.long_animation_frame.blocking_ms", "macro.memory.js_heap.used_bytes", "typing.event_duration_p95_ms", "deployment.environment", "deployment.environment.name", "gen_ai.provider.name", "gen_ai.tool.name", "agent.model", "harness", "ai.provider", "ai.account_unavailable", "host.name", "source", "http.response.status_code", "http.status_code", "outlook.throttle_origin", "outlook.outcome", "outlook.defer_reason", "http.request.method", "outlook.token_cache", "app.platform", "flow.kind", "os.type", "route.id", "ui.outcome", "flow.root", "app.runtime", "typing.surface", "service.name", "gen_ai.operation.name", "gen_ai.conversation.id", "macro.sampling.class", "macro.genai.tool.result_cut", "graphql.body_outcome", "http.body_outcome", "flow.outcome"])`, `truncate_all(attributes, 256)`, `set(status.message, "")`, `set(trace_state, "")`, `set(links, nil)`]
      }
      output { traces = [otelcol.exporter.otlp.derived.input] }
    }

    otelcol.exporter.otlp "derived" {
      client {
        endpoint = "derived-metrics.observability.svc.cluster.local:4317"
        tls { insecure = true }
      }
      sending_queue {
        sizer      = "bytes"
        queue_size = 4194304
      }
      retry_on_failure { max_elapsed_time = "1m" }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/instance: alloy-ingest
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/version: v1.22.0
    helm.sh/chart: alloy-1.16.0
  name: alloy-ingest
  namespace: observability
