    // that is up when it leaves; a full one holds senders back instead of dropping.
    otelcol.exporter.loadbalancing "sampler" {
      timeout = "10s"
      resolver {
        dns {
          hostname = "alloy-sampler.observability.svc.cluster.local"
          interval = "5s"
        }
      }
      protocol {
        otlp {
          timeout = "2s"
          queue { enabled = false }
          retry { enabled = false }
          client {
            tls { insecure = true }
          }
        }
      }
      sending_queue {
