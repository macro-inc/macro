apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: alloy-ingest
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/version: v1.22.0
    helm.sh/chart: alloy-1.16.0
  name: alloy-ingest
  namespace: observability
spec:
  minReadySeconds: 10
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: alloy-ingest
      app.kubernetes.io/name: alloy
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alloy
      labels:
        app.kubernetes.io/instance: alloy-ingest
        app.kubernetes.io/name: alloy
        observability.macro.com/telemetry-write: "true"
    spec:
      containers:
        - args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --server.http.ui-path-prefix=/
            - --disable-reporting
            - --stability.level=generally-available
          env:
            - name: ALLOY_DEPLOY_MODE
              value: helm
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CREDENTIALS_DIRECTORY
              value: /etc/alloy/credentials
          image: docker.io/grafana/alloy:v1.22.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          name: alloy
          ports:
            - containerPort: 12345
              name: http-metrics
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
          resources:
            limits:
              memory: 1536Mi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/alloy
              name: config
            - mountPath: /etc/alloy/credentials
              name: credentials
              readOnly: true
            - mountPath: /var/lib/alloy
              name: data
        - args:
            - --watched-dir=/etc/alloy
            - --reload-url=http://localhost:12345/-/reload
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
          imagePullPolicy: IfNotPresent
          name: config-reloader
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/alloy
              name: config
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroup: 473
        runAsGroup: 473
        runAsNonRoot: true
        runAsUser: 473
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: alloy-ingest
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: alloy-ingest
              app.kubernetes.io/name: alloy
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: alloy-ingest
              app.kubernetes.io/name: alloy
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - configMap:
            name: alloy-ingest
          name: config
        - name: credentials
          secret:
            secretName: alloy-ingest
        - emptyDir: {}
          name: data
