apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  namespace: observability
spec:
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: tempo
              app.kubernetes.io/name: tempo
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: tempo
              app.kubernetes.io/name: tempo
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - port: 3200
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: tempo
      app.kubernetes.io/name: tempo
  policyTypes:
    - Ingress
    - Egress
