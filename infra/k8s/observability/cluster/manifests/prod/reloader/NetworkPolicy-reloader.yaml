apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader
  namespace: observability
spec:
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  policyTypes:
    - Ingress
    - Egress
