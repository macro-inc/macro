      grpc { endpoint = "0.0.0.0:4317" }
      output { traces = [otelcol.processor.memory_limiter.spans.input] }
    }

    otelcol.processor.memory_limiter "spans" {
      check_interval = "1s"
      limit          = "256MiB"
      spike_limit    = "64MiB"
      output { traces = [otelcol.processor.transform.spans.input] }
    }

