apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-node-egress
  namespace: alloy
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 10250
          protocol: TCP
  podSelector: {}
  policyTypes:
    - Egress
