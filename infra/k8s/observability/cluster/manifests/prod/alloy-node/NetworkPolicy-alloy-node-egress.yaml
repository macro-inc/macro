apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-node-egress
  namespace: alloy
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 10250
          protocol: TCP
    - ports:
        - port: 3100
          protocol: TCP
        - port: 3200
          protocol: TCP
        - port: 8080
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - loki
                  - tempo
                  - mimir
  podSelector: {}
  policyTypes:
    - Egress
