apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  labels:
    external-secrets.io/component: controller
  name: gitlabdeploytokens.generators.external-secrets.io
spec:
  group: generators.external-secrets.io
  names:
    categories:
      - external-secrets
      - external-secrets-generators
    kind: GitlabDeployToken
    listKind: GitlabDeployTokenList
    plural: gitlabdeploytokens
    singular: gitlabdeploytoken
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                auth:
                  properties:
                    token:
                      properties:
                        secretRef:
                          properties:
                            key:
                              maxLength: 253
                              minLength: 1
                              pattern: ^[-._a-zA-Z0-9]+$
                              type: string
                            name:
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                            namespace:
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                          type: object
                      required:
                        - secretRef
                      type: object
                  required:
                    - token
                  type: object
                expiresAt:
                  format: date-time
                  type: string
                groupID:
                  minLength: 1
                  type: string
                name:
                  minLength: 1
                  type: string
                projectID:
                  minLength: 1
                  type: string
                scopes:
                  items:
                    enum:
                      - read_repository
                      - read_registry
                      - write_registry
                      - read_package_registry
                      - write_package_registry
                      - read_virtual_registry
                      - write_virtual_registry
                    type: string
                  minItems: 1
                  type: array
                url:
                  type: string
                username:
                  type: string
              required:
                - auth
                - name
                - scopes
              type: object
              x-kubernetes-validations:
                - message: exactly one of projectID or groupID must be set
                  rule: has(self.projectID) != has(self.groupID)
          type: object
      served: true
      storage: true
      subresources:
        status: {}
