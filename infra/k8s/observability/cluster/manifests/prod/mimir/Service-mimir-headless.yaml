apiVersion: v1
kind: Service
metadata:
  name: mimir-headless
  namespace: observability
spec:
  clusterIP: None
  ports:
    - name: memberlist
      port: 7946
      targetPort: memberlist
    - name: grpc
      port: 9095
      targetPort: grpc
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
