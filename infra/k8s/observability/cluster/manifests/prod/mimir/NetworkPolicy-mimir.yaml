apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mimir
  namespace: observability
spec:
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mimir
              app.kubernetes.io/name: mimir
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mimir
              app.kubernetes.io/name: mimir
    - from:
        - podSelector:
            matchLabels:
              observability.macro.com/telemetry-write: "true"
        - podSelector:
            matchLabels:
              observability.macro.com/telemetry-read: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: metrics-generator
              app.kubernetes.io/name: tempo
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mimir
      app.kubernetes.io/name: mimir
  policyTypes:
    - Ingress
    - Egress
