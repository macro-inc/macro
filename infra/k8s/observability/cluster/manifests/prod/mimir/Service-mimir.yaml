apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: grpc
      port: 9095
      targetPort: grpc
  selector:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
