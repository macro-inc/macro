apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: edge-basic-auth
spec:
  data:
    - remoteRef:
        key: observability/prod
        property: otlp_token
      secretKey: otlp_token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets-manager
  target:
    creationPolicy: Owner
    name: edge-basic-auth
    template:
      data:
        metrics.htpasswd: |
          metrics:{PLAIN}{{ .otlp_token }}
      engineVersion: v2
