apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
  namespace: observability
spec:
  egress:
    - ports:
        - port: 3000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
    - ports:
        - port: 4318
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: alloy-ingest
              app.kubernetes.io/name: alloy
    - ports:
        - port: 3100
          protocol: TCP
        - port: 8080
          protocol: TCP
      to:
        - podSelector: {}
  ingress:
    - from:
        - ipBlock:
            cidr: 10.88.0.0/24
        - ipBlock:
            cidr: 10.88.1.0/24
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge
  policyTypes:
    - Ingress
    - Egress
