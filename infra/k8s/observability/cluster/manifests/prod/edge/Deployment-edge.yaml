apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: edge
  name: edge
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: 6cdd48af38ad0b7143136f3cc45865f4e301be2699c9ef8fb5f420e3769e7b3c
        observability.macro.com/alb-readiness-gate: "true"
      labels:
        app.kubernetes.io/name: edge
        observability.macro.com/telemetry-write: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - us-east-2a
                      - us-east-2b
      automountServiceAccountToken: false
      containers:
        - command:
            - nginx
            - -c
            - /etc/nginx/conf/nginx.conf
            - -g
            - daemon off;
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          lifecycle:
            preStop:
              sleep:
                seconds: 25
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          name: nginx
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/nginx/conf
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/nginx/auth
              name: auth
              readOnly: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - configMap:
            name: edge
          name: config
        - emptyDir: {}
          name: tmp
        - name: auth
          secret:
            secretName: edge-basic-auth
