apiVersion: v1
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 1024;
    }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server_tokens off;
      # Backends are resolved per request, so nginx starts even before the
      # Services it proxies to exist, and follows them if they change.
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
      log_format safe '$remote_addr $host $request_method $uri $status';
      access_log /dev/stdout safe;
    client_max_body_size 8m;
    map $host $observability_host {
      default denied;
        grafana.macro-internal.com grafana;
        otlp.macro-internal.com otlp;
      }
    limit_req_zone $server_name zone=ingest:1m rate=100r/s;
    map $http_upgrade $connection_upgrade {
      default upgrade;
      "" close;
    }
    server {
      listen 8080 default_server;
      server_name _;
      add_header Strict-Transport-Security "max-age=31536000" always;
      # The ALB health check: this pod is up. Grafana's own health is its
      # readiness probe; a Grafana outage shows as 5xx on the target group.
      location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

      location / {
        if ($observability_host != grafana) { return 404; }
        set $upstream http://grafana.observability.svc.cluster.local:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

      }
      location ~ ^/v1/(traces|logs|metrics)$ {
        if ($observability_host != otlp) { return 404; }
    limit_except POST { deny all; }
    limit_req zone=ingest burst=200 nodelay;
    limit_req_status 429;
    proxy_read_timeout 30s;

    set $upstream http://alloy-ingest.observability.svc.cluster.local:4318;
    proxy_pass $upstream;

      }
      location = /api/v1/write {
        if ($observability_host != otlp) { return 404; }
    limit_except POST { deny all; }
    limit_req zone=ingest burst=200 nodelay;
    limit_req_status 429;
    proxy_read_timeout 30s;
    auth_basic "metrics";
    auth_basic_user_file /etc/nginx/auth/metrics.htpasswd;
    proxy_set_header Authorization "";

    set $upstream http://mimir.observability.svc.cluster.local:8080/api/v1/push;
    proxy_pass $upstream;

      }
      location = /loki/api/v1/push {
        if ($observability_host != otlp) { return 404; }
    limit_except POST { deny all; }
    limit_req zone=ingest burst=200 nodelay;
    limit_req_status 429;
    proxy_read_timeout 30s;
    auth_basic "metrics";
    auth_basic_user_file /etc/nginx/auth/metrics.htpasswd;
    proxy_set_header Authorization "";

    set $upstream http://loki.observability.svc.cluster.local:3100/loki/api/v1/push;
    proxy_pass $upstream;

      }
    }
    # Argo CD, which checks sign-in itself (Google through its Dex). Its UI
    # streams application changes, so responses aren't buffered.
    server {
      listen 8080;
      server_name argo.macro-internal.com;
      add_header Strict-Transport-Security "max-age=31536000" always;
      location / {
        set $upstream http://argocd-server.argocd.svc.cluster.local:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

      }
    }


    }
kind: ConfigMap
metadata:
  name: edge
  namespace: observability
