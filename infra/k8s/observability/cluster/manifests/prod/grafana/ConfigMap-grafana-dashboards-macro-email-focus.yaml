},"description":"The 95th percentile from an inbox joining the rollout to its whole window filled was {{ humanize $values.B.Value }} s over the last hour. The go/stop number is under 15 minutes. Inboxes the worker finds at its start are not timed. Each point covers 60 minutes, as rules email-focus-backfill-time-warn (orange) and email-focus-backfill-time-crit (red) read it in prod.","fieldConfig":{"defaults":{"custom":{"thresholdsStyle":{"mode":"dashed"}},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":600},{"color":"red","value":900}]},"unit":"s"}},"gridPos":{"h":8,"w":12,"x":0,"y":25},"id":7,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"id":"filled","matchExact":true,"metricEditorMode":0,"metricName":"BackfillFilledSeconds","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"3600","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"p95"}],"title":"Email Focus new inbox backfill time (p95)","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"The 95th percentile of one stale-thread page read was {{ humanize $values.B.Value }} s over the last hour. The go/stop number is under 500 ms; a slower read means the sweep and backfill load MacroDB. Each point covers 60 minutes, as rules email-focus-stale-threads-warn (orange) and email-focus-stale-threads-crit (red) read it in prod.","fieldConfig":{"defaults":{"custom":{"thresholdsStyle":{"mode":"dashed"}},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":0.3},{"color":"red","value":0.5}]},"unit":"s"}},"gridPos":{"h":8,"w":12,"x":12,"y":25},"id":8,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"id":"read","matchExact":true,"metricEditorMode":0,"metricName":"StaleThreadsSeconds","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"3600","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"p95"}],"title":"Email Focus stale-thread read slow (p95)","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"The worker started {{ humanize $values.B.Value }} times in 30 minutes: a crash loop. A deploy starts it once or twice. With no value, the worker has published nothing for 30 minutes: it is down or stuck. Each point covers 30 minutes, as rules email-focus-restarts-warn (orange) and email-focus-restarts-crit (red) read it in prod.","fieldConfig":{"defaults":{"custom":{"thresholdsStyle":{"mode":"dashed"}},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2},{"color":"red","value":3}]},"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":33},"id":9,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"id":"starts","matchExact":true,"metricEditorMode":0,"metricName":"WorkerStarts","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"1800","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Sum"}],"title":"Email Focus worker restarting","type":"timeseries"},{"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":41},"id":200,"panels":[],"title":"Context","type":"row"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"Inboxes whose owner is in the rollout, at each minute''s look.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":42},"id":101,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"id":"a","matchExact":true,"metricEd