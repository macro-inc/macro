matchExact":true,"metricEditorMode":0,"metricName":"ClassifierRejected","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"3600","queryMode":"Metrics","refId":"rejected","region":"us-east-1","statistic":"Sum"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"hide":true,"id":"calls","matchExact":true,"metricEditorMode":0,"metricName":"ClassifierCalls","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"3600","queryMode":"Metrics","refId":"calls","region":"us-east-1","statistic":"Sum"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"expression":"IF(calls > 0, 100 * (unavailable + rejected) / calls, 0)","id":"value","metricEditorMode":1,"metricQueryType":0,"period":"3600","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Sum"}],"title":"Email Focus classifier unavailable or rejecting","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"{{ humanize $values.B.Value }}% of due date asks to the agent harness failed or timed out in the last hour, at least 3 of them. The go/stop number is under 5%. A thread whose ask failed is stored without a date. Each point covers 60 minutes, as rules email-focus-due-date-failures-warn (orange) and email-focus-due-date-failures-crit (red) read it in prod.","fieldConfig":{"defaults":{"custom":{"thresholdsStyle":{"mode":"dashed"}},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2.5},{"color":"red","value":5}]},"unit":"percent"}},"gridPos":{"h":8,"w":12,"x":0,"y":9},"id":3,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"hide":true,"id":"failures","matchExact":true,"metricEditorMode":0,"metricName":"DueDateFailures","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"3600","queryMode":"Metrics","refId":"failures","region":"us-east-1","statistic":"Sum"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"hide":true,"id":"calls","matchExact":true,"metricEditorMode":0,"metricName":"DueDateCalls","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"3600","queryMode":"Metrics","refId":"calls","region":"us-east-1","statistic":"Sum"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"expression":"IF(calls > 0, 100 * failures / calls, 0)","id":"value","metricEditorMode":1,"metricQueryType":0,"period":"3600","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Sum"}],"title":"Email Focus due dates failing","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"The 95th percentile from an email event to its thread''s classification was {{ humanize $values.B.Value }} s over 15 minutes. The go/stop number is under 2 minutes. Each point covers 15 minutes, as rules email-focus-event-to-classified-warn (orange) and email-focus-event-to-classified-crit (red) read it in prod.","fieldConfig":{"defaults":{"custom":{"thresholdsStyle":{"mode":"dashed"}},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":60},{"color":"red","value":120}]},"unit":"s"}},"gridPos":{"h":8,"w":12,"x":12,"y":9},"id":4,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"id":"wait","matchExact":true,"metricEditorMode":0,"metricName":"EventToClassifiedSeconds","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"900","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"p95"}],"title":"Email Focus mail waiting to be classified (p95)","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"A sweep in the last 2 hours took {{ humanize $values.B.Value }} s. The go/stop number is under 30 minut