  email-focus-rollout.json: '{"description":"The Email Focus rollout''s go/stop numbers, from the worker''s CloudWatch metrics (Macro/EmailFocus) in us-east-1. Hold the next rollout step while any is orange or red. Runbook: docs/runbooks/email-focus.md.","editable":false,"links":[{"targetBlank":true,"title":"PostHog: Focus tab opens","type":"link","url":"https://us.posthog.com/"},{"targetBlank":true,"title":"Runbook","type":"link","url":"https://github.com/macro-inc/macro/blob/main/docs/runbooks/email-focus.md"}],"panels":[{"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"panels":[],"title":"Go/stop","type":"row"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"description":"Jev and the due date cost {{ humanize $values.B.Value }} dollars per enrolled inbox over the last day. The go/stop number is at most 0.03. The day a rollout step''s inboxes are backfilled costs more. Each point covers 1440 minutes, as rules email-focus-cost-warn (orange) and email-focus-cost-crit (red) read it in prod.","fieldConfig":{"defaults":{"custom":{"thresholdsStyle":{"mode":"dashed"}},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":0.02},{"color":"red","value":0.03}]},"unit":"currencyUSD"}},"gridPos":{"h":8,"w":12,"x":0,"y":1},"id":1,"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true}},"targets":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"hide":true,"id":"jev","matchExact":true,"metricEditorMode":0,"metricName":"JevCostUsd","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"86400","queryMode":"Metrics","refId":"jev","region":"us-east-1","statistic":"Sum"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"dimensions":{"Environment":["$env"]},"hide":true,"id":"due","matchExact":true,"metricEditorMode":0,"metricName":"DueDateCostUsd","metricQueryType":0,"namespace":"Macro/EmailFocus","period":"86400","queryMode":"Metrics",