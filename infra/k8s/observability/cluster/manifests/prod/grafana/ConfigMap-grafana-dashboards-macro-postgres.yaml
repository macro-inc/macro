apiVersion: v1
data:
  postgres.json: '{"description":"Dev writer and replica collected directly from PostgreSQL. Start with connection health and collection errors. Open the query dashboard for statement costs, normalized SQL and sampled waits. Plans are disabled. Missing data means collection needs attention, not that the database is healthy.","editable":false,"links":[{"title":"Query costs, SQL and sampled waits","type":"link","url":"/d/macro-postgres-queries"},{"title":"AWS database health","type":"link","url":"/d/macro-database"}],"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"pg_up{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\"}","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Database connection healthy (1 = yes)","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"pg_exporter_last_scrape_error{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\"}","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Exporter collection errors (1 = error)","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":8},"id":3,"targets":[{"expr":"pg_stat_database_numbackends{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"}","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Database connections","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"ops"}},"gridPos":{"h":8,"w":12,"x":12,"y":8},"id":4,"targets":[{"expr":"sum by (db_instance, datname) (rate(pg_stat_database_xact_commit{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"}[5m]) + rate(pg_stat_database_xact_rollback{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"}[5m]))","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Transactions per second","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":16},"id":5,"targets":[{"expr":"increase(pg_stat_database_deadlocks{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"}[5m])","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Deadlocks in five minutes","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"Bps"}},"gridPos":{"h":8,"w":12,"x":12,"y":16},"id":6,"targets":[{"expr":"rate(pg_stat_database_temp_bytes{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"}[5m])","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Temporary data written per second","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":24},"id":7,"targets":[{"expr":"sum by (db_instance, mode) (pg_locks_count{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"})","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Locks by mode","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":24},"id":8,"targets":[{"expr":"sum by (db_instance) (pg_stat_user_tables_n_dead_tup{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\"})","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Dead tuples (vacuum backlog indicator)","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"s"}},"gridPos":{"h":8,"w":12,"x":0,"y":32},"id":9,"targets":[{"expr":"time() - timestamp(pg_up{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\"})","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Database scrape freshness","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":32},"id":10,"targets":[{"expr":"prometheus_remote_storage_samples_pending{job=\"observability/database-collector\",deployment_environment=\"dev\"}","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Remote-write pending samples","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":40},"id":11,"targets":[{"expr":"up{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\"}","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Scrape target healthy (1 = yes)","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"ops"}},"gridPos":{"h":8,"w":12,"x":12,"y":40},"id":12,"targets":[{"expr":"rate(prometheus_remote_storage_samples_failed_total{job=\"observability/database-collector\",deployment_environment=\"dev\"}[5m])","legendFormat":"{{db_instance}} {{datname}} {{mode}}","refId":"A"}],"title":"Remote-write failed samples per second","type":"timeseries"}],"refresh":"1m","schemaVersion":39,"tags":["macro","postgres"],"templating":{"list":[{"allValue":"macro-db-dev.*","current":{"text":"All","value":"$__all"},"includeAll":true,"label":"Database instance","multi":false,"name":"database","options":[],"query":"macro-db-dev,macro-db-dev-read-replica","type":"custom"}]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"Macro PostgreSQL","uid":"macro-postgres","version":1}'
