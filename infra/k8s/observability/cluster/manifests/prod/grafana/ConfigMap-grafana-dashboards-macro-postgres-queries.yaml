ryType":"range","refId":"A"}],"title":"Normalized SQL for selected queries","type":"logs"},{"datasource":{"type":"loki","uid":"loki"},"description":"Activity sampled every 15 seconds, emitted when an observed query ends or changes state. Raw SQL is omitted. These records do not represent every execution.","gridPos":{"h":9,"w":12,"x":0,"y":43},"id":8,"options":{"showCommonLabels":false,"showTime":true,"sortOrder":"Descending","wrapLogMessage":true},"targets":[{"expr":"{job=\"integrations/postgres-queries\",deployment_environment=\"dev\",db_instance=~\"$database\",op=\"query_sample\"} | logfmt | user=~\"${dbuser:regex}\" | queryid=~\"$queryid\" | __error__=\"\"","queryType":"range","refId":"A"}],"title":"Sampled query activity","type":"logs"},{"datasource":{"type":"loki","uid":"loki"},"gridPos":{"h":9,"w":12,"x":12,"y":43},"id":9,"options":{"showCommonLabels":false,"showTime":true,"sortOrder":"Descending","wrapLogMessage":true},"targets":[{"expr":"{job=\"integrations/postgres-queries\",deployment_environment=\"dev\",db_instance=~\"$database\",op=\"wait_event\"} | logfmt | user=~\"${dbuser:regex}\" | queryid=~\"$queryid\" | __error__=\"\"","queryType":"range","refId":"A"}],"title":"Sampled waits and blocking sessions","type":"logs"},{"datasource":{"type":"loki","uid":"loki"},"description":"Hourly upstream checks, including requirements for features we leave disabled. Also inspect database health: a healthy metric exporter alone does not prove query-detail collection works.","gridPos":{"h":9,"w":12,"x":0,"y":52},"id":10,"options":{"showCommonLabels":false,"showTime":true,"sortOrder":"Descending","wrapLogMessage":true},"targets":[{"expr":"{job=\"integrations/postgres-queries\",deployment_environment=\"dev\",db_instance=~\"$database\",op=\"health_status\"}","queryType":"range","refId":"A"}],"title":"Query collector health checks","type":"logs"},{"datasource":{"type":"loki","uid":"loki"},"description":"Counts emitted wait observations. This is not time-weighted database load or a count of every wait. Short waits may be missed.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":9,"w":12,"x":0,"y":61},"id":15,"targets":[{"expr":"sum by (wait_event_type) (count_over_time({job=\"integrations/postgres-queries\",deployment_environment=\"dev\",db_instance=~\"$database\",op=\"wait_event\"} | logfmt | user=~\"${dbuser:regex}\" | queryid=~\"$queryid\" | wait_event_type!=\"\" | __error__=\"\" [1m]))","legendFormat":"{{wait_event_type}}","queryType":"range","refId":"A"}],"title":"Observed wait events per minute","type":"timeseries"},{"datasource":{"type":"loki","uid":"loki"},"description":"Historical sampled blocking relationships, emitted when observed activity changes or ends. Not a live list of all sessions.","gridPos":{"h":9,"w":12,"x":12,"y":61},"id":16,"options":{"showCommonLabels":false,"showTime":true,"sortOrder":"Descending","wrapLogMessage":true},"targets":[{"expr":"{job=\"integrations/postgres-queries\",deployment_environment=\"dev\",db_instance=~\"$database\",op=\"wait_event\"} | logfmt | user=~\"${dbuser:regex}\" | queryid=~\"$queryid\" | blocked_by_pids!=\"[]\" | blocked_by_pids!=\"\" | __error__=\"\" | line_format \"Query {{.queryid}} · blocked PID {{.pid}} · blockers {{.blocked_by_pids}} · {{.wait_event_type}}/{{.wait_event}} · observed wait {{.wait_time}}\"","queryType":"range","refId":"A"}],"title":"Observed blocking chains — blocked session and blocker PIDs","type":"logs"}],"refresh":"1m","schemaVersion":39,"tags":["macro","postgres","queries"],"templating":{"list":[{"current":{"text":"macro-db-dev","value":"macro-db-dev"},"includeAll":false,"label":"Database instance","multi":false,"name":"database","options":[],"query":"macro-db-dev,macro-db-dev-read-replica","type":"custom"},{"allValue":".*","current":{"text":"All","value":"$__all"},"datasource":{"type":"prometheus","uid":"prometheus"},"includeAll":true,"label":"Database user","multi":true,"name":"dbuser","options":[],"query":"label_values(pg_stat_statements_calls_