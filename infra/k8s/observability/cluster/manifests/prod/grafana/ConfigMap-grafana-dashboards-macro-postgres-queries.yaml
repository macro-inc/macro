data:
  postgres-queries.json: '{"description":"Dev query statistics and sampled activity. Select an instance and database user, filter the SQL column, then click a query ID to investigate. All workload totals cover the collected statement set, not every query on the server. The collector retains up to 200 statements per endpoint ranked by cumulative execution time; this is not every execution. Means are not percentiles. SQL is sensitive even when normalized. Activity samples can miss short queries; plans are disabled.","editable":false,"links":[{"title":"Database health and collection errors","type":"link","url":"/d/macro-postgres"}],"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Selected queries within the bounded collected statement set. Missing data is not replaced by zero. These summaries are not health thresholds.","fieldConfig":{"defaults":{"color":{"fixedColor":"blue","mode":"fixed"},"unit":"s"}},"gridPos":{"h":4,"w":6,"x":0,"y":0},"id":11,"options":{"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"expr":"sum(sum by (queryid) (increase(pg_stat_statements_seconds_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__range])))","format":"table","instant":true,"range":false,"refId":"A"}],"title":"Observed execution time","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Selected queries within the bounded collected statement set. Missing data is not replaced by zero. These summaries are not health thresholds.","fieldConfig":{"defaults":{"color":{"fixedColor":"blue","mode":"fixed"},"unit":"short"}},"gridPos":{"h":4,"w":6,"x":6,"y":0},"id":12,"options":{"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"target