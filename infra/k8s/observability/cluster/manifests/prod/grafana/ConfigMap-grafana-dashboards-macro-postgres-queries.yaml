ets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"expr":"count(sum by (queryid) (increase(pg_stat_statements_calls_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__range])) > 0)","format":"table","instant":true,"range":false,"refId":"A"}],"title":"Query shapes observed in period","type":"stat"},{"datasource":{"type":"datasource","uid":"-- Mixed --"},"description":"Query shapes ranked by observed execution time, bounded by the selected row limit. SQL column filters apply to these ranked rows. SQL is looked up near the end of the selected period and may be missing for evicted statements or collector outages. User filters apply to counters; identical query IDs across users are combined. Share is of the selected collected workload. Counter increases are extrapolated estimates, so call and row counts may be fractional. These are execution durations, not CPU time or latency percentiles.","fieldConfig":{"defaults":{"custom":{"cellOptions":{"type":"auto"},"filterable":true},"noValue":"—"},"overrides":[{"matcher":{"id":"byName","options":"queryid"},"properties":[{"id":"custom.width","value":200},{"id":"links","value":[{"title":"Investigate query","url":"/d/macro-postgres-queries?var-database=$database&${dbuser:queryparam}&var-top=$top&var-queryid=${__value.raw}&${__url_time_range}"}]}]},{"matcher":{"id":"byName","options":"SQL"},"properties":[{"id":"custom.width","value":500},{"id":"custom.cellOptions","value":{"type":"auto","wrapText":true}}]},{"matcher":{"id":"byName","options":"Execution time"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Average time"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byName","options":"Workload share"},"properties":[{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"Calls"},"properties":[{"id":"unit","value":"short"},{"id":"decimals","value":0}]}