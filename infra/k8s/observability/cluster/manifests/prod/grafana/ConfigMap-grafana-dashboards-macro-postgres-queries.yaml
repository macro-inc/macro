ueryid=~\"$queryid\"}[$__range])) > 0)","format":"table","instant":true,"range":false,"refId":"C"},{"datasource":{"type":"prometheus","uid":"prometheus"},"expr":"100 * topk($top, sum by (queryid) (increase(pg_stat_statements_seconds_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__range])) > 0) / scalar(sum(sum by (queryid) (increase(pg_stat_statements_seconds_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__range]))))","format":"table","instant":true,"range":false,"refId":"D"},{"datasource":{"type":"prometheus","uid":"prometheus"},"expr":"sum by (queryid) (increase(pg_stat_statements_rows_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__range])) and on(queryid) topk($top, sum by (queryid) (increase(pg_stat_statements_seconds_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__range])) > 0)","format":"table","instant":true,"range":false,"refId":"E"},{"datasource":{"type":"loki","uid":"loki"},"expr":"topk by (queryid) (1, sum by (queryid, querytext) (count_over_time({job=\"integrations/postgres-queries\",deployment_environment=\"dev\",db_instance=~\"$database\",op=\"query_association\"} | logfmt | queryid=~\"$queryid\" | querytext!=\"\" | __error__=\"\" [5m])))","queryType":"instant","refId":"SQL"}],"title":"Query overview — filter SQL, sort any metric, click a query ID","transformations":[{"id":"labelsToFields","options":{"mode":"columns"}},{"id":"joinByField","options":{"byField":"queryid","mode":"outerTabular"}},{"id":"filterByValue","options":{"filters":[{"config":{"id":"isNotNull"},"fieldName":"Value #A"}],"match":"all","type":"include"}},{"id":"organize","options":{"excludeByName":{"Time":true,"Time 1":true,"Time 2":true,"Time 3":true,"Time 4":true,"Time 5":true,"Time 6":true,"Value #SQL":true},"indexByName":{"Value #A":2,"Value #B":4,"Value #C":5,"Value #D":3,"Value #E":6,"queryid":0,"querytext":1},"renameByName":{"Value #A":"Execution time","Value #B":"Calls","Value #C":"Average time","Value #D":"Workload share","Value #E":"Rows","querytext":"SQL"}}}],"type":"table"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"ms"}},"gridPos":{"h":9,"w":12,"x":0,"y":16},"id":2,"targets":[{"expr":"1000 * rate(pg_stat_statements_seconds_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__rate_interval]) / (rate(pg_stat_statements_calls_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__rate_interval]) > 0)","legendFormat":"{{db_instance}} {{user}} {{queryid}}","refId":"A"}],"title":"Average execution time per call","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"ops"}},"gridPos":{"h":9,"w":12,"x":12,"y":16},"id":3,"targets":[{"expr":"rate(pg_stat_statements_calls_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"macrodb\",user=~\"${dbuser:regex}\",queryid=~\"$queryid\"}[$__rate_interval])","legendFormat":"{{db_instance}} {{user}} {{queryid}}","refId":"A"}],"title":"Calls per second","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":9,"w":12,"x":0,"y":25},"id":4,"targets":[{"expr":"rate(pg_stat_statements_rows_total{job=\"integrations/postgres\",deployment_environment=\"dev\",db_instance=~\"$database\",datname=\"mac