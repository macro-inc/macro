apiVersion: v1
data:
  run-local.json: '{"description":"Where `just run_local` time goes, from the local telemetry events (on by default) in Loki (service_name=local-telemetry, kept 30 days) and each run''s trace in Tempo (kept 7 days). Set the range to a day or more for percentiles; the Machine variable narrows every panel. The last row shows the local stacks'' own traces and logs from machines that turned on `services = true`.","editable":false,"panels":[{"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"panels":[],"title":"Time to ready","type":"row"},{"datasource":{"type":"loki","uid":"loki"},"description":"Bring-ups (attached, detached and run_dev) from the first step to a backend answering through the proxy with Vite started.","fieldConfig":{"defaults":{"color":{"fixedColor":"text","mode":"fixed"}},"overrides":[{"matcher":{"id":"byFrameRefID","options":"A"},"properties":[{"id":"displayName","value":"Runs"},{"id":"unit","value":"short"}]},{"matcher":{"id":"byFrameRefID","options":"B"},"properties":[{"id":"displayName","value":"p50"},{"id":"unit","value":"s"}]},{"matcher":{"id":"byFrameRefID","options":"C"},"properties":[{"id":"displayName","value":"p90"},{"id":"unit","value":"s"}]},{"matcher":{"id":"byFrameRefID","options":"D"},"properties":[{"id":"displayName","value":"Ready"},{"id":"unit","value":"percentunit"}]},{"matcher":{"id":"byFrameRefID","options":"E"},"properties":[{"id":"displayName","value":"Machines"},{"id":"unit","value":"short"}]}]},"gridPos":{"h":4,"w":12,"x":0,"y":1},"id":1,"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"vertical","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum(count_over_time({service_name=\"local-telemetry\"} | event=\"run\" | kind=\"up\" | label_format machine=\"{{ or .machine .host_name .host }}\" | machine=~\"$machine\" [$__range]))","legendFormat":"Runs","queryType":"instant