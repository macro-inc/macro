unit","value":"s"}]},{"matcher":{"id":"byName","options":"Max"},"properties":[{"id":"unit","value":"s"}]}]},"gridPos":{"h":8,"w":8,"x":8,"y":31},"id":13,"options":{"cellHeight":"sm","showHeader":true},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap queue_seconds | __error__=\"\" [$__range]) by (workflow, job)","legendFormat":"p50","queryType":"instant","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap queue_seconds | __error__=\"\" [$__range]) by (workflow, job)","legendFormat":"p90","queryType":"instant","refId":"B"},{"datasource":{"type":"loki","uid":"loki"},"expr":"max_over_time({service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap queue_seconds | __error__=\"\" [$__range]) by (workflow, job)","legendFormat":"Max","queryType":"instant","refId":"C"}],"title":"Longest-queued PR jobs","transformations":[{"id":"merge","options":{}},{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{"job":1,"workflow":0},"renameByName":{"Value #A":"p50","Value #B":"p90","Value #C":"Max"}}},{"id":"sortBy","options":{"sort":[{"desc":true,"field":"p90"}]}},{"id":"limit","options":{"limitField":15}}],"type":"table"},{"datasource":{"type":"loki","uid":"loki"},"description":"Jobs that set up the Nix dev shell, on PRs. Cold means the step took 30 s or more, which an empty cache volume causes.","fieldConfig":{"defaults":{"custom":{"minWidth":60}},"overrides":[{"matcher":{"id":"byName","options":"Jobs"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byName","options":"Dev shell p50"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byNam