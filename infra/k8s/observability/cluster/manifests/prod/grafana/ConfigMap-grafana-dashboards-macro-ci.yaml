apiVersion: v1
data:
  ci.json: '{"description":"Where CI time goes. The top section reads the exporter''s push, job and step events in Loki, kept 30 days, over the selected range; set it to a day or more for percentiles. The bottom section searches the run traces in Tempo, kept 7 days: open a trace for its execution waterfall. Trace tables are bounded search results, not complete counts.","editable":false,"panels":[{"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"panels":[],"title":"Wall time and where it goes, from Loki events","type":"row"},{"datasource":{"type":"loki","uid":"loki"},"description":"Successful pushes on PRs that aren''t drafts, experiments or reruns, where more than one workflow ran: a lone CLA run means CI didn''t run, as on a PR into another branch. Wall time runs from the push, or opening the PR, to the last check finishing. PR CI hours sum every PR job''s run time.","fieldConfig":{"defaults":{"color":{"fixedColor":"text","mode":"fixed"}},"overrides":[{"matcher":{"id":"byFrameRefID","options":"A"},"properties":[{"id":"displayName","value":"Pushes"},{"id":"unit","value":"short"}]},{"matcher":{"id":"byFrameRefID","options":"B"},"properties":[{"id":"displayName","value":"p50"},{"id":"unit","value":"s"},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":180},{"color":"red","value":300}]}},{"id":"color","value":{"mode":"thresholds"}}]},{"matcher":{"id":"byFrameRefID","options":"C"},"properties":[{"id":"displayName","value":"p90"},{"id":"unit","value":"s"},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":180},{"color":"red","value":300}]}},{"id":"color","value":{"mode":"thresholds"}}]},{"matcher":{"id":"byFrameRefID","options":"D"},"properties":[{"id":"displayName","value":"Under 5 min"},{"id":"unit","value":"percentunit"}]},{"matcher":{"id":"byFrameRefID","options":"E"},"properties":[{"id":"displayName","value":"Under 3 min"},{"id":"unit","value":"percentunit"}]},{"matcher":{"id":"byFrameRefID","options":"F"},"properties":[{"id":"displayName","value":"PR CI hours"},{"id":"unit","value":"suffix: h"}]}]},"gridPos":{"h":4,"w":24,"x":0,"y":1},"id":5,"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"vertical","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))","legendFormat":"Pushes","queryType":"instant","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [$__range]) by ()","legendFormat":"p50","queryType":"instant","refId":"B"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [$__range]) by ()","legendFormat":"p90","queryType":"instant","refId":"C"},{"datasource":{"type":"loki","uid":"loki"},"expr":"(sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | wall_seconds <= 300 [$__range])) or 0 * sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))) / sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))","legendFormat":"Under 5 min","queryType":"instant","refId":"D"},{"datasource":{"type":"loki","uid":"loki"},"expr":"(sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | wall_seconds <= 180 [$__range])) or 0 * sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))) / sum(count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))","legendFormat":"Under 3 min","queryType":"instant","refId":"E"},{"datasource":{"type":"loki","uid":"loki"},"expr":"sum(sum_over_time({service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range])) / 3600","legendFormat":"PR CI hours","queryType":"instant","refId":"F"}],"title":"Real PR pushes: are we under 5 minutes?","type":"stat"},{"datasource":{"type":"loki","uid":"loki"},"description":"Real PR pushes as above, by what the PR changed. Rust size counts changed crates: small is up to 2, medium up to 9, large more or a root manifest.","fieldConfig":{"defaults":{"custom":{"minWidth":60}},"overrides":[{"matcher":{"id":"byName","options":"Pushes"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byName","options":"p50"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"p90"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Max"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Under 5 min"},"properties":[{"id":"unit","value":"percentunit"}]}]},"gridPos":{"h":8,"w":12,"x":0,"y":5},"id":6,"options":{"cellHeight":"sm","showHeader":true},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (pr_type) (count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))","legendFormat":"Pushes","queryType":"instant","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [$__range]) by (pr_type)","legendFormat":"p50","queryType":"instant","refId":"B"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [$__range]) by (pr_type)","legendFormat":"p90","queryType":"instant","refId":"C"},{"datasource":{"type":"loki","uid":"loki"},"expr":"max_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [$__range]) by (pr_type)","legendFormat":"Max","queryType":"instant","refId":"D"},{"datasource":{"type":"loki","uid":"loki"},"expr":"(sum by (pr_type) (count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | wall_seconds <= 300 [$__range])) or 0 * sum by (pr_type) (count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))) / sum by (pr_type) (count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))","legendFormat":"Under 5 min","queryType":"instant","refId":"E"}],"title":"Wall time by PR type","transformations":[{"id":"merge","options":{}},{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{"pr_type":0},"renameByName":{"Value #A":"Pushes","Value #B":"p50","Value #C":"p90","Value #D":"Max","Value #E":"Under 5 min"}}},{"id":"sortBy","options":{"sort":[{"desc":true,"field":"p90"}]}}],"type":"table"},{"datasource":{"type":"loki","uid":"loki"},"description":"Each point covers the 24 hours before it. Red line: the 5 minute target.","fieldConfig":{"defaults":{"custom":{"showPoints":"never","spanNulls":true,"thresholdsStyle":{"mode":"line"}},"thresholds":{"mode":"absolute","steps":[{"color":"transparent","value":null},{"color":"red","value":300}]},"unit":"s"}},"gridPos":{"h":8,"w":12,"x":12,"y":5},"id":7,"interval":"15m","maxDataPoints":200,"options":{"legend":{"displayMode":"list","placement":"bottom"}},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [1d]) by ()","legendFormat":"p50","queryType":"range","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [1d]) by ()","legendFormat":"p90","queryType":"range","refId":"B"}],"title":"Real PR wall time, rolling 24 h","type":"timeseries"},{"datasource":{"type":"loki","uid":"loki"},"description":"Real PR pushes only; a type with few pushes moves in steps.","fieldConfig":{"defaults":{"custom":{"showPoints":"never","spanNulls":true},"unit":"s"}},"gridPos":{"h":8,"w":12,"x":0,"y":13},"id":8,"interval":"15m","maxDataPoints":200,"options":{"legend":{"displayMode":"list","placement":"bottom"}},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [1d]) by (pr_type)","legendFormat":"{{pr_type}}","queryType":"range","refId":"A"}],"title":"p90 wall time by PR type, rolling 24 h","type":"timeseries"},{"datasource":{"type":"loki","uid":"loki"},"description":"The job each push waited for, leaving out roll-up status checks. Its p50 run time is the job''s own; queue and earlier jobs come on top.","fieldConfig":{"defaults":{"custom":{"minWidth":60}},"overrides":[{"matcher":{"id":"byName","options":"Pushes"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byName","options":"Push p50"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Job p50"},"properties":[{"id":"unit","value":"s"}]}]},"gridPos":{"h":8,"w":12,"x":12,"y":13},"id":9,"options":{"cellHeight":"sm","showHeader":true},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (last_workflow, last_job) (count_over_time({service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 [$__range]))","legendFormat":"Pushes","queryType":"instant","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap wall_seconds | __error__=\"\" [$__range]) by (last_workflow, last_job)","legendFormat":"Push p50","queryType":"instant","refId":"B"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"push\" | experiment=\"false\" | rerun=\"false\" | pr_draft=\"false\" | conclusion=\"success\" | workflows > 1 | unwrap last_job_seconds | __error__=\"\" [$__range]) by (last_workflow, last_job)","legendFormat":"Job p50","queryType":"instant","refId":"C"}],"title":"What finished last on real pushes","transformations":[{"id":"merge","options":{}},{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{"last_job":1,"last_workflow":0},"renameByName":{"Value #A":"Pushes","Value #B":"Push p50","Value #C":"Job p50"}}},{"id":"sortBy","options":{"sort":[{"desc":true,"field":"Pushes"}]}},{"id":"limit","options":{"limitField":15}}],"type":"table"},{"datasource":{"type":"loki","uid":"loki"},"description":"Run time of each job on PRs, experiments left out, excluding queue time. Sorted by total hours, so a rare slow job doesn''t crowd out a common one.","fieldConfig":{"defaults":{"custom":{"minWidth":60}},"overrides":[{"matcher":{"id":"byName","options":"Runs"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byName","options":"p50"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"p90"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Hours"},"properties":[{"id":"unit","value":"suffix: h"}]}]},"gridPos":{"h":10,"w":12,"x":0,"y":21},"id":10,"options":{"cellHeight":"sm","showHeader":true},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (workflow, job) (count_over_time({service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" [$__range]))","legendFormat":"Runs","queryType":"instant","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range]) by (workflow, job)","legendFormat":"p50","queryType":"instant","refId":"B"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range]) by (workflow, job)","legendFormat":"p90","queryType":"instant","refId":"C"},{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (workflow, job) (sum_over_time({service_name=\"ci-telemetry\"} | event=\"job\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range])) / 3600","legendFormat":"Hours","queryType":"instant","refId":"D"}],"title":"PR jobs by CI time","transformations":[{"id":"merge","options":{}},{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{"job":1,"workflow":0},"renameByName":{"Value #A":"Runs","Value #B":"p50","Value #C":"p90","Value #D":"Hours"}}},{"id":"sortBy","options":{"sort":[{"desc":true,"field":"Hours"}]}},{"id":"limit","options":{"limitField":20}}],"type":"table"},{"datasource":{"type":"loki","uid":"loki"},"description":"Steps of a second or more in PR jobs, sorted by total hours. Open a run''s trace from Tempo below for the full waterfall.","fieldConfig":{"defaults":{"custom":{"minWidth":60}},"overrides":[{"matcher":{"id":"byName","options":"Runs"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byName","options":"p50"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"p90"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Hours"},"properties":[{"id":"unit","value":"suffix: h"}]}]},"gridPos":{"h":10,"w":12,"x":12,"y":21},"id":11,"options":{"cellHeight":"sm","showHeader":true},"targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (workflow, job, step) (count_over_time({service_name=\"ci-telemetry\"} | event=\"step\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" [$__range]))","legendFormat":"Runs","queryType":"instant","refId":"A"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.5, {service_name=\"ci-telemetry\"} | event=\"step\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range]) by (workflow, job, step)","legendFormat":"p50","queryType":"instant","refId":"B"},{"datasource":{"type":"loki","uid":"loki"},"expr":"quantile_over_time(0.9, {service_name=\"ci-telemetry\"} | event=\"step\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range]) by (workflow, job, step)","legendFormat":"p90","queryType":"instant","refId":"C"},{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (workflow, job, step) (sum_over_time({service_name=\"ci-telemetry\"} | event=\"step\" | event_name=~\"pull_request|pull_request_target\" | experiment=\"false\" | unwrap run_seconds | __error__=\"\" [$__range])) / 3600","legendFormat":"Hours","queryType":"instant","refId":"D"}],"title":"PR steps by CI time","transformations":[{"id":"merge","options":{}},{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{"job":1,"step":2,"workflow":0},"renameByName":{"Value #A":"Runs","Value #B":"p50","Value #C":"p90","Value #D":"Hours"}}},{"id":"sortBy","options":{"sort":[{"desc":true,"field":"Hours"}]}},{"id":"limit","options":{"limitField":20}}],"type":"table"},{"datasource":{"type":"loki","uid":"loki"},"description":"From a job''s creation to a runner picking it up, on PRs. Copied jobs of a partial rerun have no queue time.","fieldConfig":{"defaults":{"custom":{"minWidth":60}},"overrides":[{"matcher":{"id":"byName","options":"Jobs"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byName","options":"p50"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"p90"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"Max"},"properties":[{"id":"unit","value":"s"}]}]},"gridPos":{"h":8,"w"