apiVersion: v1
data:
  computers-fleet.json: '{"description":"Firecracker hosts and the computers on them, from each host''s cgroups (no agent in guests). Rows: capacity (panels 1-4), noisy neighbours (5-8), overcommit tuning (9-12). The watermarks and ratios a host is held to are its row in hosted_runtime_host; see docs/runbooks/computer-overcommit.md. Alerts stay in Datadog.","editable":false,"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Share of the host''s memory not available. Defaults: relief stops under 70 %, the host stops admitting at 80 %, nothing may take it over 90 %.","fieldConfig":{"defaults":{"unit":"percent"}},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"100 * (1 - node_memory_MemAvailable_bytes{job=\"firecracker-host/host\",host=~\"$host\"} / node_memory_MemTotal_bytes{job=\"firecracker-host/host\",host=~\"$host\"})","legendFormat":"{{host}}","refId":"A"}],"title":"Host memory in use","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Every VM''s cgroup together, against the host''s memory.","fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"container_memory_usage_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id=\"\"}","legendFormat":"{{host}} computers","refId":"A"},{"expr":"node_memory_MemTotal_bytes{job=\"firecracker-host/host\",host=~\"$host\"}","legendFormat":"{{host}} total","refId":"B"}],"title":"Memory held by computers","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Hibernated and stopped computers have no VM.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":8},"id":3,"targets":[{"expr":"count by (host) (container_memory_usage_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"})","legendFormat":"{{host}}","refId":"A"}],"title":"Computers with a running VM","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"The vCPUs of every running VM (their CPU limits) over the host''s cores: the CPU overcommit actually in use.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":8},"id":4,"targets":[{"expr":"sum by (host) (container_spec_cpu_quota{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"} / container_spec_cpu_period{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}) / count by (host) (node_cpu_seconds_total{job=\"firecracker-host/host\",host=~\"$host\",mode=\"idle\"})","legendFormat":"{{host}}","refId":"A"}],"title":"Awake vCPUs per host core","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Cores in use, top 10.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":16},"id":5,"targets":[{"expr":"topk(10, sum by (host, computer_id) (rate(container_cpu_usage_seconds_total{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}[5m])))","legendFormat":"{{host}} {{computer_id}}","refId":"A"}],"title":"Busiest computers: CPU","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Memory charged to the VM, top 10.","fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":12,"y":16},"id":6,"targets":[{"expr":"topk(10, sum by (host, computer_id) (container_memory_usage_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}))","legendFormat":"{{host}} {{computer_id}}","refId":"A"}],"title":"Largest computers: memory","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Seconds per second a VM wanted CPU and its limit refused, top 10.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":24},"id":7,"targets":[{"expr":"topk(10, sum by (host, computer_id) (rate(container_cpu_cfs_throttled_seconds_total{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}[5m])))","legendFormat":"{{host}} {{computer_id}}","refId":"A"}],"title":"Computers held back by their CPU limit","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Share of time something on the host waited for CPU, memory or IO (PSI), and CPU the hypervisor took (steal). Rising CPU waiting with few busy computers means the CPU ratio is too high.","fieldConfig":{"defaults":{"unit":"percentunit"}},"gridPos":{"h":8,"w":12,"x":12,"y":24},"id":8,"targets":[{"expr":"rate(node_pressure_cpu_waiting_seconds_total{job=\"firecracker-host/host\",host=~\"$host\"}[5m])","legendFormat":"{{host}} cpu waiting","refId":"A"},{"expr":"rate(node_pressure_memory_waiting_seconds_total{job=\"firecracker-host/host\",host=~\"$host\"}[5m])","legendFormat":"{{host}} memory waiting","refId":"B"},{"expr":"rate(node_pressure_io_waiting_seconds_total{job=\"firecracker-host/host\",host=~\"$host\"}[5m])","legendFormat":"{{host}} io waiting","refId":"C"},{"expr":"avg by (host) (rate(node_cpu_seconds_total{job=\"firecracker-host/host\",host=~\"$host\",mode=\"steal\"}[5m]))","legendFormat":"{{host}} steal","refId":"D"}],"title":"Host pressure","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"The memory limits of running VMs over the memory they hold: how far memory could be overcommitted with today''s use.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":32},"id":9,"targets":[{"expr":"sum by (host) (container_spec_memory_limit_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}) / sum by (host) (container_memory_usage_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"})","legendFormat":"{{host}}","refId":"A"}],"title":"Memory sold to running computers per byte they hold","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Median and 90th percentile of what one VM holds.","fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":12,"y":32},"id":10,"targets":[{"expr":"quantile by (host) (0.5, sum by (host, computer_id) (container_memory_usage_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}))","legendFormat":"{{host}} p50","refId":"A"},{"expr":"quantile by (host) (0.9, sum by (host, computer_id) (container_memory_usage_bytes{job=\"firecracker-host/computers\",host=~\"$host\",computer_id!=\"\"}))","legendFormat":"{{host}} p90","refId":"B"}],"title":"Memory per computer","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Swap in use (idle computers squeezed into zram) and memory KSM shares.","fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":0,"y":40},"id":11,"targets":[{"expr":"node_memory_SwapTotal_bytes{job=\"firecracker-host/host\",host=~\"$host\"} - node_memory_SwapFree_bytes{job=\"firecracker-host/host\",host=~\"$host\"}","legendFormat":"{{host}} swap","refId":"A"},{"expr":"node_ksmd_pages_sharing{job=\"firecracker-host/host\",host=~\"$host\"} * 4096","legendFormat":"{{host}} KSM shared","refId":"B"}],"title":"Squeezed and shared memory","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Above 1 the host has more runnable work than cores.","fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":40},"id":12,"targets":[{"expr":"sum by (host) (node_load1{job=\"firecracker-host/host\",host=~\"$host\"}) / count by (host) (node_cpu_seconds_total{job=\"firecracker-host/host\",host=~\"$host\",mode=\"idle\"})","legendFormat":"{{host}}","refId":"A"}],"title":"Load per core","type":"timeseries"}],"refresh":"1m","schemaVersion":39,"tags":["macro","computers"],"templating":{"list":[{"allValue":".*","current":{"text":"All","value":"$__all"},"datasource":{"type":"prometheus","uid":"prometheus"},"includeAll":true,"label":"Host","multi":true,"name":"host","query":"label_values(node_memory_MemTotal_bytes{job=\"firecracker-host/host\"}, host)","refresh":2,"type":"query"}]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"Macro computers fleet","uid":"macro-computers-fleet","version":1}'
kind: ConfigMap
metadata:
  name: grafana-dashboards-macro-computers-fleet
  namespace: observability
