$env\",host=~\"$host\",computer_id=\"\"}[2m]))) or (group by (host, deployment_environment) (last_over_time(container_memory_usage_bytes{job=\"firecracker-host/computers\",deployment_environment=~\"$env\",host=~\"$host\",computer_id=\"\"}[2m])) * 0 unless on (host) count by (host, deployment_environment) (last_over_time(container_memory_usage_bytes{job=\"firecracker-host/computers\",deployment_environment=~\"$env\",host=~\"$host\",computer_id!=\"\"}[2m])))))","instant":true,"range":false,"refId":"A"}],"title":"Running VMs","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"Logical CPUs of the reporting hosts (node_exporter).","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"match":"null+nan","result":{"color":"text","index":0,"text":"No firecracker-host series in Mimir"}},"type":"special"}],"noValue":"No firecracker-host series in Mimir","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]},"unit":"short"}},"gridPos":{"h":4,"w":4,"x":16,"y":4},"id":14,"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value"},"targets":[{"expr":"sum(count by (host, deployment_environment) (last_over_time(node_cpu_seconds_total{job=\"firecracker-host/host\",deployment_environment=~\"$env\",host=~\"$host\",mode=\"idle\"}[2m])))","instant":true,"range":false,"refId":"A"}],"title":"Host cores","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"description":"MemTotal of the reporting hosts (node_exporter).","fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"match":"null+nan","result":{"color":"text","index":0,"text":"No firecracker-host series in Mimir"}},"type":"special"}],"noValue":"No firecracker-host series in Mimir","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]},"unit":"bytes"}},"gridPos":{"h":4,"w":4,"x":20,"y":4},"