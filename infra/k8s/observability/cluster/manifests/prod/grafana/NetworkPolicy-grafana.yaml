apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: observability
spec:
  egress:
    - ports:
        - port: 8081
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: query-gateway
    - ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: grafana
              app.kubernetes.io/name: grafana
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.88.10.0/24
        - ipBlock:
            cidr: 10.88.16.0/20
        - ipBlock:
            cidr: 10.88.32.0/20
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: grafana
              app.kubernetes.io/name: grafana
      ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
