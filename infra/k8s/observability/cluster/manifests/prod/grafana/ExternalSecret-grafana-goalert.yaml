apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: grafana-goalert
spec:
  data:
    - remoteRef:
        key: observability/prod
        property: goalert_grafana_integration_key
      secretKey: goalert_grafana_integration_key
    - remoteRef:
        key: observability/prod
        property: goalert_grafana_notify_integration_key
      secretKey: goalert_grafana_notify_integration_key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets-manager
  target:
    creationPolicy: Owner
    name: grafana-goalert
