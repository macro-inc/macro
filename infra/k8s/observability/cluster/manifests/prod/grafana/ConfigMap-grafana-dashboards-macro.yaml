  database.json: '{"description":"Native AWS metrics. Query-level database monitoring and Datadog anomaly detection are separate migration work.","editable":false,"panels":[{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"fieldConfig":{"defaults":{"unit":"percent"}},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"dimensions":{"DBInstanceIdentifier":"$database"},"matchExact":true,"metricEditorMode":0,"metricName":"CPUUtilization","metricQueryType":0,"namespace":"AWS/RDS","period":"300","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Average"}],"title":"Database CPU","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"dimensions":{"DBInstanceIdentifier":"$database"},"matchExact":true,"metricEditorMode":0,"metricName":"DatabaseConnections","metricQueryType":0,"namespace":"AWS/RDS","period":"300","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Average"}],"title":"Database connections","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":0,"y":8},"id":3,"targets":[{"dimensions":{"DBInstanceIdentifier":"$database"},"matchExact":true,"metricEditorMode":0,"metricName":"FreeableMemory","metricQueryType":0,"namespace":"AWS/RDS","period":"300","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Average"}],"title":"Freeable memory","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":12,"y":8},"id":4,"targets":[{"dimensions":{"DBInstanceIdentifier":"$database"},"matchExact":true,"metricEditorMode":0,"metricName":"FreeStorageSpace","metricQueryType":0,"namespace":"AWS/RDS","period":"300","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Average"}],"title":"Free storage","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":16},"id":5,"targets":[{"dimensions":{"FunctionName":["document-text-extractor-dev"]},"matchExact":true,"metricEditorMode":0,"metricName":"Errors","metricQueryType":0,"namespace":"AWS/Lambda","period":"300","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Sum"}],"title":"Text extractor errors","type":"timeseries"},{"datasource":{"type":"cloudwatch","uid":"cloudwatch"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":16},"id":6,"targets":[{"dimensions":{"FunctionName":["document-text-extractor-dev"]},"matchExact":true,"metricEditorMode":0,"metricName":"Invocations","metricQueryType":0,"namespace":"AWS/Lambda","period":"300","queryMode":"Metrics","refId":"A","region":"us-east-1","statistic":"Sum"}],"title":"Text extractor invocations","type":"timeseries"}],"refresh":"1m","schemaVersion":39,"tags":["macro","migration"],"templating":{"list":[{"current":{"text":"macro-db-dev","value":"macro-db-dev"},"label":"Database","name":"database","options":[],"query":"macro-db-dev,macro-db-dev-read-replica,macro-db-prod,macro-db-prod-read-replica,fusionauth-db-dev,fusionauthdb-prod","type":"custom"}]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"Macro database and Lambda health","uid":"macro-database","version":1}'
  dev.json: '{"description":"Choose a dev service to inspect its logs and ECS resources. Use Drilldown for log patterns, trace latency/errors, and metric exploration. Trace-to-log links show service logs around the span; individual logs link to traces when they carry a trace ID.","editable":false,"links":[{"title":"Logs Drilldown","type":"link","url":"/a/grafana-lokiexplore-app/explore?var-ds=loki&var-primary_label=service_name%7C%3D~%7C${service:percentencode}"},{"title":"Traces Drilldown","type":"link","url":"/a/grafana-exploretraces-app/explore?var-ds=tempo&var-primarySignal=true&var-filters=resource.service.name%7C%3D~%7C${service:percentencode}"},{"title":"Metrics Drilldown","type":"link","url":"/a/grafana-metricsdrilldown-app/drilldown?var-ds=prometheus"}],"panels":[{"datasource":{"type":"loki","uid":"loki"},"fieldConfig":{"defaults":{"unit":"ops"}},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"sum by (service_name) (rate({deployment_environment=~\"dev|development\", service_name=~\"$service\"}[1m]))","refId":"A"}],"title":"Logs per second by service","type":"timeseries"},{"datasource":{"type":"loki","uid":"loki"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"sum by (service_name) (count_over_time({deployment_environment=~\"dev|development\", service_name=~\"$service\"} | json parsed_level=\"level\" | drop __error__, __error_details__ | parsed_level=~\"(?i)error|fatal|critical\" or severity_text=~\"(?i)error|fatal|critical\" [5m]))","refId":"A"}],"title":"Error logs in five minutes","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":8,"w":12,"x":0,"y":8},"id":3,"targets":[{"expr":"sum by (job) (ecs_task_cpu_usage_vcpu_vCPU{deployment_environment=~\"dev|development\", job=~\"$service\"})","refId":"A"}],"title":"Task CPU usage","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"bytes"}},"gridPos":{"h":8,"w":12,"x":12,"y":8},"id":4,"targets":[{"expr":"sum by (job) (ecs_task_memory_usage_Bytes{deployment_environment=~\"dev|development\", job=~\"$service\"})","refId":"A"}],"title":"Task memory usage","type":"timeseries"},{"datasource":{"type":"loki","uid":"loki"},"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":14,"w":24,"x":0,"y":16},"id":5,"targets":[{"expr":"{deployment_environment=~\"dev|development\", service_name=~\"$service\"}","refId":"A"}],"title":"Recent dev logs","type":"logs"}],"refresh":"1m","schemaVersion":39,"tags":["macro","migration"],"templating":{"list":[{"allValue":".+","current":{"text":"All","value":"$__all"},"datasource":{"type":"loki","uid":"loki"},"includeAll":true,"label":"Service","multi":false,"name":"service","query":"label_values({deployment_environment=~\"dev|development\"}, service_name)","refresh":2,"sort":1,"type":"query"}]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"Macro dev telemetry","uid":"macro-dev-telemetry","version":1}'
