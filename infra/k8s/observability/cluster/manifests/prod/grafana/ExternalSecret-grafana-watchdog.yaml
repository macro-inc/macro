apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: grafana-watchdog
spec:
  data:
    - remoteRef:
        key: observability/prod
        property: goalert_cluster_heartbeat_id
      secretKey: goalert_cluster_heartbeat_id
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets-manager
  target:
    creationPolicy: Owner
    name: grafana-watchdog
