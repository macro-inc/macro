      name = "none"
      type = "string_attribute"
    string_attribute {
      key = "service.name"
      values = ["agent-harness-service","ai-editing-worker","authentication-service","calendar-service","github-actions","cloud-storage-service","connection-gateway","contacts-service","convert-service","email-focus-worker","email-service","gitai-service","notification-service","search-freshness-probe","search-processing-service","static-file-service","sync-service","web-app","whatsapp-session-service","agent_harness_service","authentication_service","calendar_service","connection_gateway_service","contacts_service","document_storage_service","document_upload_finalizer_local_worker","email_service","image_proxy_service","notification_service","pubsub_workers","search_processing_service","static_file_service","unfurl_service","whatsapp_session_service"]
      invert_match = true
    }
    }
    and_sub_policy {
      name = "absent"
      type = "string_attribute"
    string_attribute {
      key = "macro.sampling.root"
      values = [".+"]
      enabled_regex_matching = true
      cache_max_size = 100
      invert_match = true
    }
    }
    and_sub_policy {
      name = "match"
      type = "ottl_condition"
    ottl_condition {
      error_mode = "ignore"
      span = [`(IsMatch(resource.attributes["deployment.environment"], "^(dev|development|ci|local)$") or IsMatch(attributes["deployment.environment"], "^(dev|development|ci|local)$"))`]
    }
    }
    and_sub_policy {
      name = "budget"
      type = "rate_limiting"
    rate_limiting {
      spans_per_second = 83
      burst_capacity = 20000
    }
    }

      }
    }

      output { traces = [otelcol.processor.transform.unmark.input] }
    }

    otelcol.processor.transform "unmark" {
      error_mode = "ignore"
      trace_statements {
        context = "span"
        statements = [`delete_key(attributes, "macro.sampling.root")`]
      }
      output { traces = [otelcol.processor.batch.kept.input] }
    }

    otelcol.processor.batch "kept" {
      timeout = "1s"
      send_batch_size = 512
      send_batch_max_size = 1024
      output { traces = [otelcol.exporter.otlp.tempo.input] }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo-distributor.observability.svc.cluster.local:4317"
        tls { insecure = true }
      }
      sending_queue { queue_size = 512 }
    }
