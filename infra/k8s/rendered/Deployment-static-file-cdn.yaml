apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: static-file-cdn
    app.kubernetes.io/name: static-file-cdn
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: static-file-cdn
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: static-file-cdn
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app: static-file-cdn
        app.kubernetes.io/name: static-file-cdn
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env: []
          envFrom: []
          image: localhost:32550/macro/static-file-cdn:build.jcy0kqm00lpqzb5bzyczbrr9bmdb7s3j
          imagePullPolicy: IfNotPresent
          name: static-file-cdn
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 1
            tcpSocket:
              port: 80
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      initContainers: []
      securityContext: {}
      terminationGracePeriodSeconds: 2
      volumes:
        - emptyDir: {}
          name: tmp
