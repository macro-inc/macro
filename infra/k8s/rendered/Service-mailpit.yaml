apiVersion: v1
kind: Service
metadata:
  labels:
    app: mailpit
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: mailpit
  namespace: macro-kube-reference
spec:
  ports:
    - name: p1025
      port: 1025
      protocol: TCP
      targetPort: 1025
    - name: p8025
      port: 8025
      protocol: TCP
      targetPort: 8025
  publishNotReadyAddresses: false
  selector:
    app: mailpit
