apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: redis
  namespace: macro-kube-reference
spec:
  ports:
    - name: p6379
      port: 6379
      protocol: TCP
      targetPort: 6379
    - name: p8001
      port: 8001
      protocol: TCP
      targetPort: 8001
  publishNotReadyAddresses: false
  selector:
    app: redis
