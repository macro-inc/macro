apiVersion: v1
kind: Service
metadata:
  labels:
    app: fusionauth
    app.kubernetes.io/name: fusionauth
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: fusionauth
  namespace: macro-kube-reference
spec:
  ports:
    - name: p9011
      port: 9011
      protocol: TCP
      targetPort: 9011
  publishNotReadyAddresses: false
  selector:
    app: fusionauth
