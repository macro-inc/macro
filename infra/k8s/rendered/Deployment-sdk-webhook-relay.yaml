apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sdk-webhook-relay
    app.kubernetes.io/name: sdk-webhook-relay
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: sdk-webhook-relay
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: sdk-webhook-relay
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app: sdk-webhook-relay
        app.kubernetes.io/name: sdk-webhook-relay
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env: []
          envFrom: []
          image: localhost:32550/macro/sdk-webhook-relay:build.wxvz0hbz0ylfx0qg7yas980g2q10r81r
          imagePullPolicy: IfNotPresent
          name: sdk-webhook-relay
          ports:
            - containerPort: 22
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 1
            tcpSocket:
              port: 22
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /keys
              name: file-keys
              readOnly: true
      enableServiceLinks: false
      initContainers: []
      securityContext: {}
      terminationGracePeriodSeconds: 2
      volumes:
        - emptyDir: {}
          name: tmp
        - name: file-keys
          secret:
            secretName: sdk-webhook-keys
