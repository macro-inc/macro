apiVersion: v1
kind: Service
metadata:
  labels:
    app: sdk-webhook-relay
    app.kubernetes.io/name: sdk-webhook-relay
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: sdk-webhook-relay
  namespace: macro-kube-reference
spec:
  ports:
    - name: p22
      port: 22
      protocol: TCP
      targetPort: 22
  publishNotReadyAddresses: false
  selector:
    app: sdk-webhook-relay
