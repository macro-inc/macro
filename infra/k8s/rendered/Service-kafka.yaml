apiVersion: v1
kind: Service
metadata:
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: kafka
  namespace: macro-kube-reference
spec:
  ports:
    - name: p29092
      port: 29092
      protocol: TCP
      targetPort: 29092
    - name: p29093
      port: 29093
      protocol: TCP
      targetPort: 29093
  publishNotReadyAddresses: true
  selector:
    app: kafka
