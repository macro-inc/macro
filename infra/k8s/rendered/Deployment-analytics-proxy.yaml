apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: analytics-proxy
    app.kubernetes.io/name: analytics-proxy
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: analytics-proxy
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: analytics-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        macro.com/env-revision: reference
      labels:
        app: analytics-proxy
        app.kubernetes.io/name: analytics-proxy
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env: []
          envFrom:
            - secretRef:
                name: macro-env
          image: localhost:32550/macro/analytics-proxy:build.9s72radzpri53zfc3a1i9rmyrrywv50c
          imagePullPolicy: IfNotPresent
          name: analytics-proxy
          ports:
            - containerPort: 8098
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 1
            tcpSocket:
              port: 8098
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /state
              name: vol-state
      enableServiceLinks: false
      initContainers: []
      securityContext: {}
      terminationGracePeriodSeconds: 2
      volumes:
        - emptyDir: {}
          name: tmp
        - name: vol-state
          persistentVolumeClaim:
            claimName: analytics-proxy-wrangler
