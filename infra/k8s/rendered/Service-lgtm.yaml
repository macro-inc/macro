apiVersion: v1
kind: Service
metadata:
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: lgtm
  namespace: macro-kube-reference
spec:
  ports:
    - name: p3000
      port: 3000
      protocol: TCP
      targetPort: 3000
    - name: p4317
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: p4318
      port: 4318
      protocol: TCP
      targetPort: 4318
    - name: p3100
      port: 3100
      protocol: TCP
      targetPort: 3100
    - name: p3200
      port: 3200
      protocol: TCP
      targetPort: 3200
    - name: p9090
      port: 9090
      protocol: TCP
      targetPort: 9090
  publishNotReadyAddresses: false
  selector:
    app: otel-collector
