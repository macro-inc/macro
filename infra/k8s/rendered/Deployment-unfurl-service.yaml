apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: unfurl-service
    app.kubernetes.io/name: unfurl-service
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: unfurl-service
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: unfurl-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        macro.com/env-revision: reference
      labels:
        app: unfurl-service
        app.kubernetes.io/name: unfurl-service
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env:
            - name: DD_SERVICE
              value: unfurl-service
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: macro-env
          image: localhost:32550/macro/unfurl-service:build.adxrvn46ncw9hj1hkfnpfbdysqq39s30
          imagePullPolicy: IfNotPresent
          name: unfurl-service
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              until kubectl get job kafka-topics-6b294d8b7c >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/kafka-topics-6b294d8b7c --timeout=600s

              until kubectl get job migrate-b1d851739c >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/migrate-b1d851739c --timeout=600s

              until kubectl get job search-indices-2e66d41f77 >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/search-indices-2e66d41f77 --timeout=600s

              for endpoint in fusionauth:9011 localstack:4566 redis:6379; do
                until nc -z -w 1 "${endpoint%:*}" "${endpoint#*:}"; do sleep 0.2; done
              done
          image: localhost:32550/macro/readiness:build.smghxgld6q7kd9samdjm65jjgd5zm50c
          name: dependencies
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: tmp
