apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: image-proxy-service
    app.kubernetes.io/name: image-proxy-service
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: image-proxy-service
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: image-proxy-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        macro.com/env-revision: reference
      labels:
        app: image-proxy-service
        app.kubernetes.io/name: image-proxy-service
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env:
            - name: DD_SERVICE
              value: image-proxy-service
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: macro-env
          image: localhost:32550/macro/image-proxy-service:build.9vq7cg2ws7c6f5pl5xjcdwcc4n9is6gv
          imagePullPolicy: IfNotPresent
          name: image-proxy-service
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              until kubectl get job kafka-topics-3499b6de8b >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/kafka-topics-3499b6de8b --timeout=600s

              until kubectl get job migrate-ac72207dc7 >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/migrate-ac72207dc7 --timeout=600s

              until kubectl get job search-indices-c2bd22515d >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/search-indices-c2bd22515d --timeout=600s

              for endpoint in fusionauth:9011 localstack:4566 redis:6379; do
                until nc -z -w 1 "${endpoint%:*}" "${endpoint#*:}"; do sleep 0.2; done
              done
          image: localhost:32550/macro/readiness:build.smghxgld6q7kd9samdjm65jjgd5zm50c
          name: dependencies
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: tmp
