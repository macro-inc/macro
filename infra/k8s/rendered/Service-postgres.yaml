apiVersion: v1
kind: Service
metadata:
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: postgres
  namespace: macro-kube-reference
spec:
  ports:
    - name: p5432
      port: 5432
      protocol: TCP
      targetPort: 5432
  publishNotReadyAddresses: false
  selector:
    app: postgres
