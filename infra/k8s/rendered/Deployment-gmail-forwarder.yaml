apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gmail-forwarder
    app.kubernetes.io/name: gmail-forwarder
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: gmail-forwarder
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: gmail-forwarder
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        macro.com/env-revision: reference
      labels:
        app: gmail-forwarder
        app.kubernetes.io/name: gmail-forwarder
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args:
            - gmail
            - forward
            - --target
            - http://email-service:8080/gmail/webhook
            - --subscription
            - projects/macro-email-testing/subscriptions/gmail-local-watch-reference
          command: []
          env:
            - name: DD_SERVICE
              value: gmail-forwarder
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: macro-env
          image: localhost:32550/macro/gmail-forwarder:build.83zq3hg5zwwa3a4a0jmlbi8dw63cc4g8
          imagePullPolicy: IfNotPresent
          name: gmail-forwarder
          ports: []
          readinessProbe:
            exec:
              command:
                - /bin/true
            failureThreshold: 3
            periodSeconds: 1
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              until kubectl get job kafka-topics-59c0df1286 >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/kafka-topics-59c0df1286 --timeout=600s

              until kubectl get job migrate-6dd9be5873 >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/migrate-6dd9be5873 --timeout=600s

              until kubectl get job search-indices-c2bd22515d >/dev/null 2>&1; do sleep 0.2; done
              kubectl wait --for=condition=complete job/search-indices-c2bd22515d --timeout=600s

              for endpoint in fusionauth:9011 localstack:4566 redis:6379; do
                until nc -z -w 1 "${endpoint%:*}" "${endpoint#*:}"; do sleep 0.2; done
              done
          image: localhost:32550/macro/readiness:build.smghxgld6q7kd9samdjm65jjgd5zm50c
          name: dependencies
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: tmp
