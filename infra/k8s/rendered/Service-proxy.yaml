apiVersion: v1
kind: Service
metadata:
  labels:
    app: proxy
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: proxy
  namespace: macro-kube-reference
spec:
  ports:
    - name: p8443
      nodePort: 30443
      port: 8443
      protocol: TCP
      targetPort: 8443
  publishNotReadyAddresses: false
  selector:
    app: proxy
  type: NodePort
