apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: websocket-service
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: websocket-service
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: websocket-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app: websocket-service
        app.kubernetes.io/name: websocket-service
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: app
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env: []
          envFrom: []
          image: localhost:32550/macro/websocket:build.cvsf3k22gpq2l8qx9wvz54bg473b6rwz
          imagePullPolicy: IfNotPresent
          name: websocket-service
          ports:
            - containerPort: 6969
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 1
            tcpSocket:
              port: 6969
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      initContainers: []
      securityContext: {}
      terminationGracePeriodSeconds: 2
      volumes:
        - emptyDir: {}
          name: tmp
