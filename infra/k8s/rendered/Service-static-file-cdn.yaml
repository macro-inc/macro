apiVersion: v1
kind: Service
metadata:
  labels:
    app: static-file-cdn
    app.kubernetes.io/name: static-file-cdn
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: app
    macro.local/managed: "true"
  name: static-file-cdn
  namespace: macro-kube-reference
spec:
  ports:
    - name: p80
      port: 80
      protocol: TCP
      targetPort: 80
  publishNotReadyAddresses: false
  selector:
    app: static-file-cdn
