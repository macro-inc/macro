apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: macro
    macro.com/instance: reference
    macro.com/tier: infra
    macro.local/managed: "true"
  name: otel-collector
  namespace: macro-kube-reference
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: otel-collector
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: macro
        macro.com/instance: reference
        macro.com/tier: infra
        macro.local/managed: "true"
    spec:
      containers:
        - args: []
          command: []
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: https://localhost:32443/traces/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          envFrom: []
          image: localhost:32550/macro/lgtm:build.7yn2kp7hbm8pr2fnapqfcv178042a4zl
          imagePullPolicy: IfNotPresent
          name: otel-collector
          ports:
            - containerPort: 3000
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
            - containerPort: 3100
              protocol: TCP
            - containerPort: 3200
              protocol: TCP
            - containerPort: 9090
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - curl -fsS http://127.0.0.1:3000/traces/api/health >/dev/null && curl -fsS http://127.0.0.1:3200/ready >/dev/null && curl -sS http://127.0.0.1:4318/ >/dev/null
            failureThreshold: 3
            periodSeconds: 1
            timeoutSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /data
              name: vol-data
            - mountPath: /otel-lgtm/tempo-config.yaml
              name: file-tempo
              readOnly: true
              subPath: tempo-config.yaml
      enableServiceLinks: false
      initContainers: []
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: tmp
        - name: vol-data
          persistentVolumeClaim:
            claimName: otel-collector-data
        - configMap:
            name: lgtm-tempo
          name: file-tempo
