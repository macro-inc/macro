apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    macro.local/managed: "true"
  name: bootstrap-reader
  namespace: macro-kube-reference
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
