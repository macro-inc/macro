# Values for one Macro environment. `cargo x env up` renders `workloads`,
# `configMaps`, and the images from the resolved local compose project, so a
# cluster environment runs exactly what `just run_local` runs. Hand-written
# values files only set the cluster-specific keys below.

# Public hostname the ingress serves (e.g. `demo.localhost`,
# `demo.env.macro-internal.com`).
host: ""

ingress:
  className: traefik
  # Secret holding the TLS certificate for `host`. Empty when the ingress
  # controller's load balancer terminates TLS itself (EKS: ACM on the NLB).
  tlsSecret: ""
  annotations: {}

# Secret every app workload loads with `envFrom` (`sharedEnv: true`). Written
# by `cargo x env up` from the same resolved environment `run_local` uses.
envSecret: macro-env

# Install only the workloads marked `infra: true` (first phase of `env up`,
# before migrations and provisioning).
onlyInfra: false

# StorageClass for workload volumes; empty uses the cluster default.
storageClass: ""

imagePullPolicy: IfNotPresent

# name -> { file name -> contents }.
configMaps: {}

# Each workload becomes a Deployment (Recreate strategy), plus a Service when it
# has ports, one extra Service per alias, and a PVC per volume.
#   name: DNS-1035 name; also the Service name
#   infra: started in the infra phase
#   image, command, args, env (map), sharedEnv (bool)
#   ports: [int]
#   aliases: [string] extra Service names for the same pods
#   probe: { exec: [string], periodSeconds, failureThreshold } (readiness)
#   volumes: [{ name, mountPath, size }]
#   files: [{ configMap, mountPath, subPath? }]
#   terminationGracePeriodSeconds, resources
workloads: []
