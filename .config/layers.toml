# Crate layering rules, checked by `cargo x deps` (report-only for now).
#
# A crate's layer is the [[layer]] whose `paths` glob matches its directory
# (`*` stays inside one directory, `**` spans several). Each layer lists
# the layers it may depend on, its own included. The rules cover normal and
# build dependencies between workspace crates; dev-dependencies are exempt,
# except that only dev-dependencies may point at a `dev_only` layer.
#
# Paths name both today's flat directories and the planned group
# directories (`crates/<group>/`), so a crate keeps its layer when it moves.
# `[[allow]]` entries name packages, not paths, and record edges that break
# the rules today, with the reason. See docs/development/rust.md.

ignore = ["crates/workspace-hack"]

# Leaf ids and wire models: no I/O. Third-party deps are not checked here.
[[layer]]
name = "types"
paths = [
  "crates/types/**",
]
may_depend_on = ["types"]

# Service plumbing: config, env, middleware, events, auth.
[[layer]]
name = "platform"
paths = [
  "crates/platform/**",
]
may_depend_on = ["types", "platform"]

# AWS SDK adapters.
[[layer]]
name = "aws"
paths = [
  "crates/aws/**",
]
may_depend_on = ["types", "platform", "aws"]

# HTTP and SDK clients with no domain dependencies.
[[layer]]
name = "clients"
paths = [
  "crates/clients/**",
]
may_depend_on = ["types", "platform", "aws", "clients"]

# Format engines; they compile to wasm.
[[layer]]
name = "engines"
paths = [
  "crates/engines/**",
]
may_depend_on = ["types", "engines"]

# Browser, Tauri and wasm crates. agent_fold is the wasm-safe exception.
[[layer]]
name = "client"
paths = [
  "crates/client/**",
  "crates/item_filter_index",
  "crates/predicate_index",
  "crates/soup_filter_cache_adapter",
  "crates/soup_filter_projection",
]
may_depend_on = ["types", "client"]
may_depend_on_packages = ["agent_fold"]

# Feature crates (future groups under crates/<group>/), plus macro_db_client and its migrator.
[[layer]]
name = "domain"
paths = [
  "crates/macro_db_client",
  "crates/macro_db_migrator",
  "crates/agents/**",
  "crates/ai/**",
  "crates/billing/**",
  "crates/comms/**",
  "crates/whatsapp/**",
  "crates/email/**",
  "crates/calendar/**",
  "crates/databases/**",
  "crates/documents/**",
  "crates/entities/**",
  "crates/search/**",
  "crates/projects/**",
  "crates/accounts/**",
  "crates/notifications/**",
  "crates/integrations/**",
  "crates/coding_agent_worker",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain"]

# GraphQL adapters and the composed schema.
[[layer]]
name = "graphql"
paths = [
  "crates/graphql/**",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql"]

# Test support; only dev-dependencies may point here.
[[layer]]
name = "testing"
paths = [
  "crates/testing/**",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql", "testing", "services"]
dev_only = true

# Deployables. Nothing outside services/ and tooling/ depends on them, and services do not depend on each other.
[[layer]]
name = "services"
paths = [
  "services/**",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql"]

# Developer tools and xtask.
[[layer]]
name = "tooling"
paths = [
  "tooling/**",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql", "testing", "services", "tooling"]

