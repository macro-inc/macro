# Crate layering rules, checked by `cargo x deps` (report-only for now).
#
# A crate's layer is the [[layer]] whose `paths` glob matches its directory
# (`*` stays inside one directory, `**` spans several). Each layer lists
# the layers it may depend on, its own included. The rules cover normal and
# build dependencies between workspace crates; dev-dependencies are exempt,
# except that only dev-dependencies may point at a `dev_only` layer.
#
# Paths name both today's flat directories and the planned group
# directories (`crates/<group>/`), so a crate keeps its layer when it moves.
# `[[allow]]` entries name packages, not paths, and record edges that break
# the rules today, with the reason. See docs/development/rust.md.

ignore = ["crates/workspace-hack"]

# Leaf ids and wire models: no I/O. Third-party deps are not checked here.
[[layer]]
name = "types"
paths = [
  "crates/types/**",
  "crates/bot_id",
  "crates/bot_token",
  "crates/channel_sender",
  "crates/connection_gateway_models",
  "crates/cowlike",
  "crates/document_sub_type",
  "crates/filter_ast",
  "crates/harness_id",
  "crates/harness_token",
  "crates/macro_sync_service_jwt",
  "crates/macro_user_id",
  "crates/macro_uuid",
  "crates/maybe_send",
  "crates/model",
  "crates/model_entity",
  "crates/model_error_response",
  "crates/model_file_type",
  "crates/model_owner",
  "crates/model_user",
  "crates/natural_time",
  "crates/models_ai_projection",
  "crates/models_bulk_upload",
  "crates/models_databases",
  "crates/models_dcs",
  "crates/models_email",
  "crates/models_entity_access_management",
  "crates/models_forms",
  "crates/models_grouping",
  "crates/models_opensearch",
  "crates/models_pagination",
  "crates/models_permissions",
  "crates/models_properties",
  "crates/models_search_cursor",
  "crates/models_sfs",
  "crates/models_team",
  "crates/non_empty",
  "crates/notification_state",
  "crates/s3_key",
  "crates/trigger_context",
  "crates/user_quota",
]
may_depend_on = ["types"]

