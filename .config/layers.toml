  "crates/ip_extractor",
  "crates/kafka_util",
  "crates/macro_auth",
  "crates/macro_authorization",
  "crates/macro_axum_utils",
  "crates/macro_config",
  "crates/macro_config_derive",
  "crates/macro_cors",
  "crates/macro_entrypoint",
  "crates/macro_env",
  "crates/macro_env_var",
  "crates/macro_event_broker",
  "crates/macro_event_topics",
  "crates/macro_middleware",
  "crates/macro_queues",
