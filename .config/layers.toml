[[layer]]
name = "clients"
paths = [
  "crates/clients/**",
  "crates/analytics_client",
  "crates/anthropic",
  "crates/authentication_service_client",
  "crates/connect_client",
  "crates/connection_gateway_client",
  "crates/document_storage_service_client",
  "crates/email_service_client",
  "crates/fusionauth",
  "crates/gmail_client",
  "crates/lexical_client",
  "crates/loops_client",
  "crates/macro_cache_client",
  "crates/macro_redis",
  "crates/macro_sha_count_client",
  "crates/mcp_client",
  "crates/opensearch_client",
  "crates/opensearch_query_builder",
  "crates/search_service_client",
  "crates/static_file_service_client",
  "crates/sync_service_client",
]
may_depend_on = ["types", "platform", "aws", "clients"]

# Format engines; they compile to wasm.
[[layer]]
name = "engines"
paths = [
  "crates/engines/**",
  "crates/ai_engine",
  "crates/docx_engine",
  "crates/fig_engine",
  "crates/pptx_engine",
  "crates/psd_engine",
]
may_depend_on = ["types", "engines"]

# Browser, Tauri and wasm crates. agent_fold is the wasm-safe exception.
[[layer]]
name = "client"
paths = [
  "crates/client/**",
  "crates/item_filter_index",
  "crates/predicate_index",
  "crates/soup_filter_cache_adapter",
  "crates/soup_filter_projection",
]
may_depend_on = ["types", "client"]
may_depend_on_packages = ["agent_fold"]

