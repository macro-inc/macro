# Test support; only dev-dependencies may point here.
[[layer]]
name = "testing"
paths = [
  "crates/testing/**",
  "crates/integration_tests/**",
  "crates/local_e2e_test_support",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql", "testing", "services"]
dev_only = true

# Deployables. Nothing outside services/ and tooling/ depends on them, and services do not depend on each other.
[[layer]]
name = "services"
paths = [
  "services/**",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql"]

# Developer tools and xtask.
[[layer]]
name = "tooling"
paths = [
  "tooling/**",
]
may_depend_on = ["types", "platform", "aws", "clients", "engines", "client", "domain", "graphql", "testing", "services", "tooling"]

# Baseline: edges that violated the rules when the check was added.
# Delete an entry when its edge is cut; the report lists stale ones.

[[allow]]
from = "agent_harness_service"
to = "connection_gateway"
reason = "AHS mounts the gateway's library half; move it into crates/"

[[allow]]
from = "agent_harness_service"
to = "mcp_auth_proxy"
reason = "library-only crate under services/; the plan moves it to crates/agents/"

[[allow]]
from = "agent_harness_service"
to = "unfurl_service"
reason = "AHS mounts the unfurl service's library half; move it into crates/"

[[allow]]
from = "anthropic"
to = "ai_billing"
reason = "`toolset` feature admits tool calls through ai_billing; move the toolset adapter out of the client"

[[allow]]
from = "anthropic"
to = "ai_toolset"
reason = "`toolset` feature implements ai_toolset traits; move the toolset adapter out of the client"

[[allow]]
from = "anthropic"
to = "ai_usage"
reason = "`toolset` feature records usage through ai_usage; move the toolset adapter out of the client"

[[allow]]
from = "document_storage_service_client"
to = "shared_entity_registry"
reason = "uses RegisteredEntityType; move it to a types crate"

[[allow]]
from = "email_service_client"
to = "email"
reason = "reuses email::service response models; move them to models_email"

[[allow]]
from = "item-filter-index"
to = "item_filters"
reason = "uses the item_filters AST and NotificationState; needs a wasm-safe types crate"

[[allow]]
from = "lexical_client"
to = "agent_fold"
reason = "uses agent_fold MessageId and ActivityCard; move them to a types crate"

[[allow]]
from = "macro_cache_client"
to = "email_validator"
reason = "uses normalize_email; move email_validator to types or the cache client to accounts"

[[allow]]
from = "macro_middleware"
to = "entity_access_db_utils"
reason = "middleware writes entity access rows; move the DB-backed extractors to their domain"

[[allow]]
from = "macro_middleware"
to = "macro_db_client"
reason = "middleware reads documents and thread permissions; move the DB-backed extractors to their domain"

[[allow]]
from = "mcp_client"
to = "ai_toolset"
reason = "implements ai_toolset traits; it may belong in ai/, not clients/"

[[allow]]
from = "models_email"
to = "email_utils"
reason = "computes parsed bodies and token cache keys with email_utils; move those helpers to types or out of the model crate"

[[allow]]
from = "search_service_client"
to = "models_search"
reason = "models_search is a search domain crate because it depends on models_soup and opensearch_client (plan N14)"

[[allow]]
from = "soup-filter-cache-adapter"
to = "graphql_soup_filter_input"
reason = "uses materialize_graphql_filter; move it to a wasm-safe crate"

[[allow]]
from = "soup-filter-projection"
to = "models_soup"
reason = "projects Soup DTOs in the client; models_soup depends on domains until plan N10"

[[allow]]
from = "soup-filter-projection"
to = "soup"
reason = "uses SoupProjectionHydration and SoupDocumentServerFacts; move them to a types crate"

[[allow]]
from = "sync_router"
to = "sync_service_bebop_schema"
reason = "the bebop schema lives under services/sync-service; plan PR 16 moves it to crates/documents/"

[[allow]]
from = "sync_service"
to = "sync_service_bebop_schema"
reason = "the bebop schema lives under services/sync-service; plan PR 16 moves it to crates/documents/"

[[allow]]
from = "sync_service_client"
to = "sync_service_hex"
reason = "implements the SyncWakeupService port; move the adapter into sync_service_hex's outbound"

[[allow]]
from = "whatsapp_e2e"
to = "whatsapp_session_service"
reason = "e2e crate drives the session service library; move it to testing/ and make the edge a dev-dependency"
