# The end-to-end email suite starts real service processes and needs an SQS
# server besides Postgres and Redis, so it runs by itself: `just email-e2e`
# (profile `email-e2e`), not with the workspace's tests.
[profile.default]
default-filter = "not package(email_e2e)"

[profile.email-e2e]
default-filter = "package(email_e2e)"
# A scenario that hangs is a failure, not something to wait an hour for.
slow-timeout = { period = "120s", terminate-after = 3 }
failure-output = "immediate-final"
fail-fast = false
# A scenario that fails is tried once more, so that one that only sometimes
# fails is told from one that always does. Passing on the second try still
# counts against the suite: the coverage report lists every scenario that
# needed it.
retries = 1

# The results as JUnit XML (target/nextest/email-e2e/junit.xml), which the
# coverage report reads: only a scenario that passed is evidence.
[profile.email-e2e.junit]
path = "junit.xml"

# Each scenario runs two service processes, or three when it serves the
# GraphQL API, with their own connection pools.
[test-groups.email-e2e]
max-threads = 6

# The search scenarios share one search cluster and one consumer group for
# the indexer, so only one of them runs at a time. First, because the first
# override that matches a test decides its group.
[test-groups.email-e2e-search]
max-threads = 1

[[profile.email-e2e.overrides]]
filter = "package(email_e2e) & binary(search)"
test-group = "email-e2e-search"

[[profile.email-e2e.overrides]]
filter = "package(email_e2e)"
test-group = "email-e2e"
