# Real protocol server for local integration tests; never mount in a deploy.
auth_allow_cleartext = no
ssl = required
ssl_server {
  cert_file = /etc/dovecot/lab-tls/server.pem
  key_file = /etc/dovecot/lab-tls/server.key
}
submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_ssl = no
submission_relay_rawlog_dir = /tmp/macro-relay-rawlog
namespace inbox {
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
