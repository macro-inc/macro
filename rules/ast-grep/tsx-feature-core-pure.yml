id: tsx-feature-core-pure
language: tsx
# Twin of ts-feature-core-pure — ast-grep rules are single-language, and
# `typescript` only scans .ts files.
severity: warning
message: Feature core modules stay pure TypeScript — no Solid, urql, queries, generated GraphQL, app modules, or sibling layers.
note: |-
  Rule FE-31 in docs/STYLE_GUIDE.md. `core/` owns the feature's vocabulary
  and the functions that describe, group, and summarize it. Wire types,
  clients, reactivity, and UI stay outside so a schema rename or a
  framework upgrade cannot churn core tests. Decode lives in `queries/`,
  reactive view models in `state/`. The `dateBucket` import from next-soup
  is the documented exception for feed labels that must match soup views.
files:
  - apps/web/src/features/activity/core/**
rule:
  kind: string
  regex: ^['"](solid-js|@urql|urql|@app/lib/urql|@queries/|@service-storage/|@core/|@property/|@components/|@ui|@entity/|(\.\./)+(queries|state|components|views)/|(\.\./)+(deps|app-deps))
  any:
    - inside:
        kind: import_statement
        field: source
    - inside:
        kind: export_statement
        field: source
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            kind: import
