utils:
  device-check:
    any:
      - kind: call_expression
        has:
          field: function
          regex: (^|\.)(isTouchDevice|isMobile|isMobileWidth|isTouch)$
      - has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            regex: (^|\.)(isTouchDevice|isMobile|isMobileWidth|isTouch)$
  jsx-value:
    any:
      - kind: jsx_element
      - kind: jsx_self_closing_element
      - kind: parenthesized_expression
        has:
          any:
            - kind: jsx_element
            - kind: jsx_self_closing_element
rule:
  any:
    - kind: jsx_attribute
      all:
        - has:
            kind: property_identifier
            regex: ^when$
        - has:
            stopBy: end
            kind: call_expression
            has:
              field: function
              regex: (^|\.)(isTouchDevice|isMobile|isMobileWidth|isTouch)$
        - inside:
            any:
              - kind: jsx_opening_element
              - kind: jsx_self_closing_element
            has:
              field: name
              regex: ^(Show|Match)$
    - kind: binary_expression
      all:
        - has:
            field: left
            matches: device-check
        - has:
            field: right
            matches: jsx-value
    - kind: ternary_expression
      all:
        - has:
            field: condition
            matches: device-check
        - has:
            matches: jsx-value
    - kind: string_fragment
      any:
        - regex: (^|\s)(not-touch|touch|mobile):hidden(\s|$)
        - all:
            - regex: (^|\s)hidden(\s|$)
            - regex: (^|\s)(not-touch|touch|mobile):(block|flex|inline|inline-flex|inline-block|grid|contents)(\s|$)
    - kind: string
      regex: ^['"](.*/)?(ResponsiveBlockToolbar|split-layout/components/HeaderIsland)['"]$
      inside:
        kind: import_statement
        field: source
