id: tsx-no-device-composition
language: tsx
severity: error
message: Only a view's entry decides by device what exists. Move this branch into the desktop view (views/<name>.tsx) or the mobile view (views/mobile/<name>.tsx).
note: |-
  Rule FE-70 in .agents/rules/web/mobile.md. A `Show` / `Match` on
  `isTouchDevice()` / `isMobile()`, a device check that yields JSX, or a
  `touch:hidden`-style class makes one component build both the desktop and
  the mobile view, so a desktop change reaches mobile unnoticed. Give the view
  a desktop and a mobile composition instead, switched once in its entry.
  Size, spacing, hover and event handling may still adapt to touch.

  The ignore list has two parts. "Entries" is permanent: the one file per
  view that holds the device switch. "Not yet split" is a baseline of files
  that predate the rule; delete a file's line when you split its view, and
  never add one.
files:
  - apps/web/src/features/**
ignores:
  - '**/*.test.tsx'
  - '**/browser-test/**'
  # A mobile view may branch on isMobile() / mobile: for phone versus tablet.
  - apps/web/src/**/views/mobile/**
