id: tsx-element-size-owner
language: tsx
severity: error
message: Import createElementSize from @core/util/createElementSize; its observer entries avoid forced layout reads.
files:
  - apps/web/src/**
rule:
  kind: import_statement
  regex: \bcreateElementSize\b
  has:
    kind: string
    field: source
    regex: '@solid-primitives/resize-observer'
