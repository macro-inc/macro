id: tsx-no-cursor-pointer
language: tsx
severity: warning
message: Don't add cursor-pointer to clickable elements.
note: |-
  Rule FE-27 in STYLE_GUIDE.md (also js/app/AGENTS.md, Styling). The
  app deliberately does not use pointer cursors on clickable elements.
files:
  - js/app/**
rule:
  kind: string_fragment
  regex: (^|[^-\w])cursor-pointer([^-\w]|$)
