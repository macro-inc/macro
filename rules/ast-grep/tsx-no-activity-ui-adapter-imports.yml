id: tsx-no-activity-ui-adapter-imports
language: tsx
# Twin of ts-no-activity-ui-adapter-imports — ast-grep rules are
# single-language, and `typescript` only scans .ts files.
severity: warning
message: Activity UI leaves must not import adapters or shared query factories. Views compose those.
note: |-
  Rule FE-31 in docs/STYLE_GUIDE.md. `features/activity/ui` takes domain
  values (and resolved display) and returns JSX. Query factories, decode,
  and click-to-open (`openDocument`, `useSplitNavigationHandler`) live
  in `adapters/` / `views/`. The one sanctioned adapter import is
  `property-value`, which parses untyped wire JSON for property-changed
  rows. Do not add adapter or navigation imports to leave components.
files:
  - apps/web/src/features/activity/ui/**
rule:
  any:
    - kind: string
      regex: ^['"]@queries/
      any:
        - inside:
            kind: import_statement
            field: source
        - inside:
            kind: export_statement
            field: source
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: import
    - kind: string
      regex: ^['"]@core/(util/useSplitNavigationHandler|component/LexicalMarkdown/component/core/BlockLink)
      any:
        - inside:
            kind: import_statement
            field: source
        - inside:
            kind: export_statement
            field: source
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: import
    - kind: string
      regex: ^['"]((\.\./)+adapters/|@app/features/activity/adapters/)
      not:
        regex: property-value
      any:
        - inside:
            kind: import_statement
            field: source
        - inside:
            kind: export_statement
            field: source
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: import
