id: rust-no-sqlx-in-domain
language: rust
severity: warning
message: Domain modules must not reference sqlx — database access belongs in outbound adapters behind a port.
note: |-
  Hexagonal architecture: the domain layer depends only on its own models and
  port traits. Move the query into an outbound repo (e.g. outbound/pg_*_repo.rs)
  and expose it through a port. Domain errors should be domain-shaped, not
  wrap sqlx::Error. DB-backed tests (#[sqlx::test]) in domain test.rs files
  are exempt. ~13 legacy uses exist (PgPool in memory's domain service,
  sqlx::Type on notification's device model, sqlx::Error in port error enums)
  — don't add new ones.
files:
  - crates/**/src/domain/**
ignores:
  - '**/test.rs'
  - '**/tests.rs'
  - '**/test/**'
  - '**/tests/**'
rule:
  any:
    - kind: scoped_identifier
      regex: ^sqlx\b
      not:
        inside:
          kind: scoped_identifier
    - kind: scoped_type_identifier
      regex: ^sqlx\b
    - kind: use_declaration
      regex: ^use sqlx\b
