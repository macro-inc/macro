id: ts-feature-core-pure
language: typescript
# Twin of tsx-feature-core-pure — ast-grep rules are single-language, and
# `tsx` only scans .tsx files.
severity: warning
message: Feature core modules stay pure TypeScript — no Solid, urql, queries, generated GraphQL, app modules, or sibling layers.
note: |-
  Rule FE-33 in docs/STYLE_GUIDE.md. `core/` owns the feature's vocabulary
  and the functions that describe, group, and summarize it. Wire types,
  clients, reactivity, and UI stay outside so a schema rename or a
  framework upgrade cannot churn core tests. Decode lives in `queries/`,
  reactive view models in `primitives/`. The `dateBucket` import from
  `soup/collection/date-buckets` (a pure date-fns module, not the soup barrel)
  is the documented exception for feed labels that must match soup views.
  The shared @core/util/base64 codec, cron helpers, and dateSearch/parseTime parser are pure utilities and may be reused.
  Block-agent names its rendering layers `ui/` and `component/`.
files:
  - apps/web/src/features/calendar-team/core/**
  - apps/web/src/features/routines/core/**
  - apps/web/src/features/scheduling/core/**
  - apps/web/src/features/usage/core/**
  - apps/web/src/features/crm/core/**
  - apps/web/src/features/slack-import/core/**
  - apps/web/src/features/channel/core/channel-invite*
  - apps/web/src/features/projects/core/**
  - apps/web/src/features/channel/Call/chat/core/**
  - apps/web/src/features/block-agent/core/**
  - apps/web/src/features/block-ai/core/**
  - apps/web/src/features/meetings/core/**
  - apps/web/src/features/block-spreadsheet/core/**
  - apps/web/src/features/property/tags/core/**
  - apps/web/src/features/claude-connection/core/**
  - apps/web/src/features/activity/core/**
  - apps/web/src/features/drive-view/core/**
  - apps/web/src/features/email-message/core/**
  - apps/web/src/features/email-thread/core/**
  - apps/web/src/features/email-compose/core/**
  - apps/web/src/features/changes/core/**
  - apps/web/src/features/block-write/core/**
  - apps/web/src/features/onboarding/core/**
  - apps/web/src/features/auth/core/**
  - apps/web/src/features/block-form/core/**
rule:
  kind: string
  regex: ^['"](solid-js|@urql|urql|@app/lib/urql|@queries/|@service-storage/|@core/|@property/|@components/|@ui|@entity/|(\.\./)+(queries|primitives|components|views|ui|component|context)(/|['"]))
  not:
    regex: ^['"]@core/util/(base64|cron|dateSearch/parseTime)['"]
  any:
    - inside:
        kind: import_statement
        field: source
    - inside:
        kind: export_statement
        field: source
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            kind: import
