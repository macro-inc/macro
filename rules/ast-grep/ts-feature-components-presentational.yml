id: ts-feature-components-presentational
language: typescript
# Twin of tsx-feature-components-presentational — ast-grep rules are
# single-language, and `tsx` only scans .ts files.
severity: warning
message: Feature components take resolved values and return JSX. Data, reactivity wiring, and navigation belong to primitives/ and views/.
note: |-
  Rule FE-33 in docs/STYLE_GUIDE.md. `components/` never imports
  `queries/`, `primitives/`, `views/`, `@queries/*`, urql, or the split
  navigation helpers. It renders what views hand it: domain values from
  `core/`, resolved display (typed in `context/`), and event handlers. The
  one sanctioned `queries/` import is `property-value`, which parses
  untyped wire JSON for property-changed rows.
files:
  - apps/web/src/features/activity/components/**
rule:
  any:
    - kind: string
      regex: ^['"](@queries/|@urql|urql|@app/lib/urql|@core/util/useSplitNavigationHandler|(\.\./)+(primitives|views)/)
      any:
        - inside:
            kind: import_statement
            field: source
        - inside:
            kind: export_statement
            field: source
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: import
    - kind: string
      regex: ^['"](\.\./)+queries/
      not:
        regex: property-value
      any:
        - inside:
            kind: import_statement
            field: source
        - inside:
            kind: export_statement
            field: source
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: import
