id: rust-access-no-wildcard-arm
language: rust
severity: error
message: An `EventAccess::access` match has a catch-all arm; list every variant so a new one must be classified.
note: |-
  `EventAccess::access` has no default so that every broker event declares who
  may receive it. A `_ =>`, bare-binding or `x @ _` arm (alone or as one
  alternative of an `|` pattern) would silently classify a future variant
  (usually as internal, sometimes as public). Name each variant, grouping
  variants that share a declaration with `|`. See
  `crates/event_access/ACCESS_MODEL.md`.
files:
  - crates/**
  - services/**
rule:
  kind: match_arm
  has:
    field: pattern
    kind: match_pattern
    # A whole arm, or one top-level alternative of it, that is `_`, a bare
    # binding, or `name @ _`: `_`, `other`, `Self::A(_) | _`, `x @ _`.
    regex: '(^|\|)\s*(_|[a-z][A-Za-z0-9_]*(\s*@\s*_)?)\s*(\||\s+if\b[\s\S]*|$)'
  inside:
    kind: function_item
    stopBy: end
    any:
      # `fn access` in an `impl EventAccess for ...` block.
      - all:
          - has:
              field: name
              regex: '^access$'
          - inside:
              kind: impl_item
              stopBy: end
              has:
                field: trait
                regex: '(^|::)EventAccess$'
      # A helper that builds an access declaration (`-> Result<Access<'_, P>,
      # AccessError>`), such as one an `access` impl delegates to.
      - has:
          field: return_type
          regex: '\bAccess<'
