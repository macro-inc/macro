id: rust-cache-turso-no-runtime-static-text
language: rust
severity: error
message: The cache engine must not turn run-time text into a `&'static str`.
note: |-
  Slow-query telemetry sends a statement's text because `Sql` templates and
  `Template`s are built only from `&'static str` fragments, which the
  compiler then treats as text written in this crate's source (see
  `crates/client/cache-turso/src/sql.rs`). Leaking a `String`, or keeping text
  in a `static` that can be set at run time (`static mut`, or a static whose
  type is anything but a number, `bool`, `char`, `&'static str` text, or an
  atomic integer or bool named by its full `std::sync::atomic::` path, such
  as `OnceLock`, `LazyLock` or an alias or struct around one), makes run-time
  text, such as a record field or a search term, look like source text and
  lets it reach telemetry. Bind the value as a parameter instead, or run a
  statement that must embed outside text as an `UnreportedSql`. Tests are
  exempt.
files:
  - crates/client/cache-turso/src/**
ignores:
  - '**/test.rs'
  - '**/test/**'
rule:
  any:
    - pattern: $VALUE.leak()
    - pattern: Box::leak($$$ARGS)
    - pattern: String::leak($$$ARGS)
    # A static is fixed at compile time only when it cannot be written and its
    # type holds no cell or lock. Allow only plain types by name, so an alias
    # or a wrapper struct around a cell fails closed. Atomics need their full
    # path: a local type can take an atomic's bare name.
    - kind: static_item
      has:
        kind: mutable_specifier
    # A local type, alias or module spelled like a primitive or `std` would
    # pass the name check below.
    - any:
        - kind: type_item
        - kind: struct_item
        - kind: enum_item
        - kind: union_item
        - kind: mod_item
      has:
        field: name
        regex: "^(r#)?(bool|char|[ui](8|16|32|64|128|size)|f(32|64)|str|std)$"
    - kind: use_as_clause
      has:
        field: alias
        regex: "^(r#)?(bool|char|[ui](8|16|32|64|128|size)|f(32|64)|str|std)$"
    - kind: static_item
      not:
        has:
          field: type
          regex: "^(std::sync::atomic::Atomic(Bool|[UI](8|16|32|64|size))|bool|char|[ui](8|16|32|64|128|size)|f(32|64)|&('static )?str|&('static )?\\[&('static )?str\\]|\\[&('static )?str; *[A-Z0-9_]+\\])$"
