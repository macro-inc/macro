id: ts-no-switch
language: typescript
# Legacy findings remain warnings in a full scan. check-new-switches.ts makes
# new or modified statements blocking in both just check and CI.
severity: warning
message: "FE-20: Use match from ts-pattern instead of switch."
note: |-
  Use .exhaustive() for a closed union, or .otherwise() for an open input.
  See docs/STYLE_GUIDE.md FE-20.
ignores:
  - "**/generated/**"
  - "**/__generated__/**"
  - "**/*.gen.ts"
  - "**/*.generated.ts"
  - "**/vendor/**"
  - "**/vendored/**"
rule:
  kind: switch_statement
