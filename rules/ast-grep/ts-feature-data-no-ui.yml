id: ts-feature-data-no-ui
language: typescript
# Twin of tsx-feature-data-no-ui — ast-grep rules are single-language, and
# `tsx` only scans .tsx files.
severity: warning
message: Feature queries/ and primitives/ never import components, views, or UI primitives. They produce data and view-state; views render it.
note: |-
  Rule FE-33 in docs/STYLE_GUIDE.md. `queries/` adapts wire types and
  builds query factories; `primitives/` consumes feature-owned capabilities
  to produce state and actions with Solid primitives but no JSX. Test adapters
  with fake clients and controllers with fake capabilities; neither imports
  rendering code, including block-agent’s `ui/` and `component/` layers.
files:
  - apps/web/src/features/block-agent/queries/**
  - apps/web/src/features/block-agent/primitives/**
  - apps/web/src/features/block-spreadsheet/queries/**
  - apps/web/src/features/block-spreadsheet/primitives/**
  - apps/web/src/features/property/tags/queries/**
  - apps/web/src/features/property/tags/primitives/**
  - apps/web/src/features/claude-connection/primitives/**
  - apps/web/src/features/activity/queries/**
  - apps/web/src/features/drive-view/queries/**
  - apps/web/src/features/activity/primitives/**
  - apps/web/src/features/drive-view/primitives/**
  - apps/web/src/features/email-message/queries/**
  - apps/web/src/features/email-message/primitives/**
  - apps/web/src/features/email-thread/queries/**
  - apps/web/src/features/email-thread/primitives/**
  - apps/web/src/features/email-compose/queries/**
  - apps/web/src/features/email-compose/primitives/**
  - apps/web/src/features/agent-changes/queries/**
  - apps/web/src/features/agent-changes/primitives/**
rule:
  kind: string
  regex: ^['"](solid-js/web|@ui|@components/|(\.\./)+(components|views|ui|component)(/|['"]))
  any:
    - inside:
        kind: import_statement
        field: source
    - inside:
        kind: export_statement
        field: source
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            kind: import
