id: tsx-keyboard-viewport-reader-follows
valid:
  - |
    <div ref={followKeyboardViewport} class="max-h-[calc(32*var(--dvh,1dvh))]" />
  - |
    <div
      ref={(element) => {
        containerRef = element;
        followKeyboardViewport(element);
      }}
    >
      <div classList={{ 'max-h-[calc(32*var(--dvh,1dvh))] overflow-y-auto': props.multiline }} />
    </div>
  - |
    <MobileDrawer.Content>
      <div class="max-h-[calc(50*var(--dvh))] overflow-y-auto" />
    </MobileDrawer.Content>
  - |
    <Dialog class="max-h-[calc(100dvh-var(--virtual-keyboard-height,0px)-16px)]">body</Dialog>
  - |
    <div class="h-dvh" />
invalid:
  - |
    <div class="max-h-[calc(32*var(--dvh,1dvh))] overflow-y-auto" />
  - |
    <div class="fixed bottom-(--virtual-keyboard-height,0)">sheet</div>
  - |
    <div ref={setComposer}>
      <div style={{ 'max-height': 'calc(var(--dvh, 1dvh) * 32)' }} />
    </div>
  - |
    <div ref={followViewportHeight}>
      <div class="max-h-[calc(32*var(--dvh,1dvh))]" />
    </div>
