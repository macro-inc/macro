id: rust-cache-turso-no-runtime-static-text
valid:
  - |
    const TABLE: &str = "records";
  - |
    static NAMES: [&str; 2] = ["records", "meta"];
  - |
    static NEXT: AtomicU64 = AtomicU64::new(1);
  - |
    static READY: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);
  - |
    static TABLES: &[&str] = &["records", "meta"];
  - |
    static LIMIT: usize = 4_096;
  - |
    fn f(sql: &mut Sql) { sql.push("SELECT 1"); }
  - |
    fn f(text: String) -> UnreportedSql { UnreportedSql::new(text) }
invalid:
  - |
    fn f(text: String) -> &'static str { text.leak() }
  - |
    fn f(text: String) -> &'static str { Box::leak(text.into_boxed_str()) }
  - |
    fn f(text: String) -> &'static str { String::leak(text) }
  - |
    static TEXT: LazyLock<String> = LazyLock::new(|| std::env::args().collect());
  - |
    static TEXT: OnceLock<String> = OnceLock::new();
  - |
    static mut TEXT: String = String::new();
  - |
    static TEXT: OnceLock<Box<str>> = OnceLock::new();
  - |
    static TEXT: Mutex<Option<Cow<'static, str>>> = Mutex::new(None);
  - |
    static mut TEXT: &str = "";
  - |
    type Slot = OnceLock<Box<str>>;
    static SQL: Slot = Slot::new();
  - |
    struct Holder(OnceLock<String>);
    static SQL: Holder = Holder(OnceLock::new());
  - |
    type AtomicText = OnceLock<String>;
    static SQL: AtomicText = AtomicText::new();
  - |
    static SQL: AtomicPtr<u8> = AtomicPtr::new(std::ptr::null_mut());
