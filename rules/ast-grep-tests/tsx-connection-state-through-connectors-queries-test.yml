    import { cognitionApiServiceClient } from '@service-cognition/client';
    const chat = await cognitionApiServiceClient.getChatPermissions({ chat_id });
  - |
    import type { GetChatResponse } from '@service-cognition/client';
  - |
    import { enableDesktopTabs } from '@core/constant/featureFlags';
  - |
    const id = 'macro-connection-1';
invalid:
  - |
    import { isFeatureEnabled, macroConnect } from '@core/constant/featureFlags';
  - |
    const on = flags.isEnabled('macro-connect');
  - |
    const servers = await cognitionApiServiceClient.listMcpServers();
  - |
    await cognitionApiServiceClient.listPipedreamConnections();
  - |
    const all = await cognitionApiServiceClient.listConnectors();
  - |
    const step = await cognitionApiServiceClient.startConnect({ key });
