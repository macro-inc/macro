id: css-viewport-inset-readers
valid:
  - |
    .content { padding-top: var(--mobile-content-inset-top, 0px); }
  - |
    @property --mobile-content-inset-bottom { syntax: "*"; inherits: false; }
  - |
    .sheet { max-height: calc(100dvh - 16px); }
invalid:
  - |
    .list { padding-bottom: var(--mobile-content-inset-bottom, 0px); }
  - |
    .composer { max-height: calc(var(--dvh, 1dvh) * 32); }
  - |
    .sheet { bottom: var(--virtual-keyboard-height, 0px); }
