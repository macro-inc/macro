id: rust-workflows-no-yaml-patching
valid:
  - |
    fn f(text: &str) -> serde_yaml::Value { serde_yaml::from_str(text).unwrap() }
invalid:
  - |
    fn f(root: &serde_yaml::Value) -> String { serde_yaml::to_string(root).unwrap() }
  - |
    fn f(root: &mut serde_yaml::Value) { root.as_mapping_mut(); }
