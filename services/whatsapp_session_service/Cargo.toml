[package]
default-run = "whatsapp_session_service"
edition = "2024"
name = "whatsapp_session_service"
publish = false
version = "0.1.0"

[[bin]]
name = "whatsapp_session_service"
path = "src/main.rs"

[[bin]]
name = "whatsapp_session_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
async-trait = { workspace = true }
aws-sdk-kms = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
database_env_vars = { workspace = true }
doppler-config = { workspace = true }
macro_aws_config = { workspace = true }
macro_config = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
nom = { workspace = true }
rootcause = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
whatsapp_store_pg = { workspace = true }
whatsmeow = { workspace = true }
whatsmeow_signal = { workspace = true }
whatsapp_linked = { workspace = true, features = ["outbound"] }
external_chat = { workspace = true, features = ["outbound"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
service_url = { workspace = true }

[dev-dependencies]
macro_db_migrator = { workspace = true }
sha2 = { workspace = true }
tracing-subscriber = { workspace = true }
whatsapp_fake_server = { workspace = true }
whatsapp_store_pg = { workspace = true, features = ["fake-kms"] }
