[package]
edition = "2024"
name = "image_proxy_service"
publish = false
version = "0.1.0"
default-run = "image_proxy_service"

[[bin]]
name = "image_proxy_service"
path = "src/main.rs"

[[bin]]
name = "image_proxy_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "image_proxy_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
axum = { workspace = true, features = ["macros"] }
doppler-config = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true }
macro_aws_config = { workspace = true }
macro_config = { workspace = true }
macro_cors = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_middleware = { workspace = true, features = [
  "tracking",
] }
shared_types = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
url = { workspace = true }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
macro_auth = { workspace = true, features = ["testing"] }
