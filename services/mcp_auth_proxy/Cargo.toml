[package]
edition = "2024"
name = "mcp_auth_proxy"
publish = false
readme = "README.md"
version = "0.1.0"

[features]
default = ["inbound", "outbound"]
inbound = [
  "dep:ai_toolset",
  "dep:askama",
  "dep:axum",
  "dep:axum-extra",
  "dep:macro_auth",
  "dep:macro_user_id",
  "dep:tower",
  "dep:tower-http",
]
outbound = [
  "dep:chrono",
  "dep:cursor_api_key",
  "dep:fusionauth",
  "dep:macro_tower_layers",
  "dep:shared_types",
  "dep:reqwest",
  "dep:sqlx",
  "dep:upstream_error",
  "dep:zeroize",
]

[dependencies]
anyhow = { workspace = true }
askama = { workspace = true, optional = true }
ai_toolset = { workspace = true, optional = true }
axum = { workspace = true, features = ["tower-log"], optional = true }
axum-extra = { workspace = true, features = ["cookie"], optional = true }
base64 = { workspace = true }
bot_id = { workspace = true }
chrono = { workspace = true, optional = true }
cursor_api_key = { workspace = true, optional = true }
fusionauth = { workspace = true, optional = true }
macro_auth = { workspace = true, optional = true }
macro_tower_layers = { workspace = true, optional = true }
macro_user_id = { workspace = true, optional = true }
shared_types = { workspace = true, optional = true }
rand = { workspace = true }
redis = { workspace = true, features = ["aio", "tokio-comp"] }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true, features = ["util"], optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
upstream_error = { workspace = true, optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
macro_auth = { workspace = true, features = ["testing"] }
macro_db_migrator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
