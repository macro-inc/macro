<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in to Macro</title>
    <style>
      {% include "broker_page.css" %}
    </style>
  </head>
  <body>
    <main>
      <div class="intro">
        {% include "macro_mark.html" %}
        <h1>Sign in to Macro</h1>
        <p class="lede">to connect your app to your workspace</p>
      </div>
      <form method="get" action="authorize">
        {% for (name, value) in params %}
        <input type="hidden" name="{{ name }}" value="{{ value }}" />
        {% endfor %}
        <div class="stack">
          <button class="approve" type="submit" name="sign_in" value="google" autofocus>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="m12.361 10.57v3.9663h4.6219c-0.4078 0.80304-1.004 1.4955-1.7375 2.0182l3.1612 2.5282c2.0047-1.8044 3.1501-4.3737 3.1519-7.0704v-0.72113c0-0.39827-0.32296-0.72113-0.72138-0.72113z" />
              <path d="m6.4089 12.012a5.5531 5.5512 0 0 1 0.33738-1.8936l-3.1977-2.5572a9.505 9.5024 0 0 0 0 8.9014l3.1977-2.5572a5.5531 5.5512 0 0 1-0.33738-1.8936z" />
              <path d="m12 6.4232a5.5538 5.5519 0 0 1 3.2881 1.0786l2.9289-2.7325a9.5329 9.5294 0 0 0-14.668 2.7918l3.1977 2.5572a5.595 5.5932 0 0 1 5.2532-3.6952z" />
              <path d="m18.399 19.077-3.1528-2.5214a5.5868 5.585 0 0 1-8.5006-2.6502l-3.1977 2.5572a9.5539 9.5504 0 0 0 14.851 2.6144z" />
            </svg>
            Continue with Google
          </button>
          <button class="deny" type="submit" name="sign_in" value="email">Continue with email</button>
          <button class="deny" type="submit" name="sign_in" value="login">Continue with a password</button>
        </div>
        {% if offers_manual_delivery %}
        <label class="option">
          <input type="checkbox" name="delivery" value="manual" />
          <span>
            The app I'm connecting runs on another machine, such as over SSH or
            in a container. Give me a link to finish there.
          </span>
        </label>
        {% endif %}
      </form>
      <p class="legal">
        By continuing, you agree to our
        <a href="https://macro.com/terms">terms</a> and
        <a href="https://macro.com/privacy">privacy policy</a>.
      </p>
    </main>
  </body>
</html>
