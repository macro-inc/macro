<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Macro</title>
<style>
body {{ font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }}
main {{ width: 20rem; padding: 1rem; }}
h1 {{ font-size: 1.25rem; font-weight: 600; }}
a {{ display: block; padding: .75rem; margin-top: .75rem; border: 1px solid #8888; border-radius: .5rem; color: inherit; text-align: center; text-decoration: none; }}
</style>
</head>
<body>
<main>
<h1>Sign in to Macro</h1>
<a href="{google}">Continue with Google</a>
<a href="{login}">Continue with email and password</a>
</main>
</body>
</html>
