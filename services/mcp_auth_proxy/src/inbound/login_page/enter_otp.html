<h1 id="login-heading">Check your email</h1>
<p class="subtitle">Enter the six-digit code sent to {{email}}.</p>
<p class="error" role="alert" {{error_hidden}}>{{error}}</p>
<p class="local-code" {{local_hidden}}>Local code: <code>{{local_otp}}</code></p>
<form action="/login/{{session_id}}" method="post">
  <input type="hidden" name="action" value="otp">
  <label for="code">One-time code</label>
  <input
    id="code"
    name="code"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    pattern="[0-9]{6}"
    maxlength="6"
    required
    autofocus
  >
  <button class="field-action" type="submit">Continue</button>
</form>
<div class="link-row">
  <form action="/login/{{session_id}}" method="post">
    <input type="hidden" name="action" value="email">
    <input type="hidden" name="email" value="{{email}}">
    <button type="submit">Resend code</button>
  </form>
  <form action="/login/{{session_id}}" method="post">
    <input type="hidden" name="action" value="back">
    <button type="submit">Back</button>
  </form>
</div>
