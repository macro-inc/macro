[package]
edition = "2024"
name = "agent_harness_service"
publish = false
version = "0.1.0"

[[bin]]
name = "agent_harness_service"
path = "src/main.rs"

[dependencies]
agent_fold = { path = "../../crates/agent_fold" }
agent_harness = { path = "../../crates/agent_harness" }
agent_session = { path = "../../crates/agent_session" }
agent_trigger = { path = "../../crates/agent_trigger" }
aws-sdk-sqs = { workspace = true }
bot_id = { path = "../../crates/bot_id" }
bots = { path = "../../crates/bots" }
connection_gateway_client = { path = "../../crates/connection_gateway_client" }
database_env_vars = { path = "../../crates/database_env_vars" }
contacts = { path = "../../crates/contacts" }
macro_aws_config = { path = "../../crates/macro_aws_config" }
macro_event_broker = { path = "../../crates/macro_event_broker", features = ["outbound"] }
macro_queues = { path = "../../crates/macro_queues" }
lexical_client = { path = "../../crates/lexical_client" }
macro_service_urls = { path = "../../crates/macro_service_urls" }
notification = { path = "../../crates/notification" }
rdkafka = { workspace = true }
channels = { path = "../../crates/channels", features = ["ports", "outbound"] }
anyhow = { workspace = true }
kafka_util = { path = "../../crates/kafka_util" }
macro_config = { path = "../../crates/macro_config" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_env_var = { path = "../../crates/macro_env_var" }
macro_uuid = { path = "../../crates/macro_uuid" }
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
