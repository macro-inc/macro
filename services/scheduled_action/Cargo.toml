[package]
name = "scheduled_action"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "service"
path = "src/bins/service.rs"

[[bin]]
name = "scheduled_action_openapi"
path = "src/bins/openapi.rs"

[[bin]]
name = "scheduled_action_doppler_config"
path = "src/doppler_config.rs"

[features]
default = []
local_auth = ["macro_authorization/local_auth"]

[dependencies]
ai_routines = { path = "../../crates/ai_routines" }
anyhow = { workspace = true }
axum = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
database_env_vars = { path = "../../crates/database_env_vars" }
doppler-config = { workspace = true }
entity_registry_db_utils = { path = "../../crates/entity_registry/entity_registry_db_utils" }
futures = { workspace = true }
macro_auth = { path = "../../crates/macro_auth" }
macro_authorization = { path = "../../crates/macro_authorization", features = [
  "postgres",
] }
macro_aws_config = { path = "../../crates/macro_aws_config" }
macro_config = { path = "../../crates/macro_config" }
macro_cors = { path = "../../crates/macro_cors" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_env_var = { path = "../../crates/macro_env_var" }
# Publishes run requests to Kafka; the default `outbound` feature brings the
# Kafka publisher adapter.
macro_event_broker = { path = "../../crates/macro_event_broker" }
macro_user_id = { path = "../../crates/macro_user_id" }
macro_uuid = { path = "../../crates/macro_uuid" }
model = { path = "../../crates/model" }
model_owner = { path = "../../crates/model_owner" }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../../crates/macro_db_migrator" }
