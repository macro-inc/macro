[package]
name = "scheduled_action"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "service"
path = "src/bins/service.rs"

[[bin]]
name = "scheduled_action_openapi"
path = "src/bins/openapi.rs"

[[bin]]
name = "scheduled_action_doppler_config"
path = "src/doppler_config.rs"

[features]
default = []
local_auth = ["macro_authorization/local_auth"]

[dependencies]
ai_billing = { path = "../../crates/ai_billing" }
roles_and_permissions = { path = "../../crates/roles_and_permissions", default-features = false, features = ["outbound"] }
teams = { path = "../../crates/teams", default-features = false, features = ["outbound"] }
activity = { path = "../../crates/activity", default-features = false }
agent_runtime_protocol = { path = "../../crates/agent_runtime_protocol", default-features = false }
agent_session = { path = "../../crates/agent_session", default-features = false, features = ["admission"] }
bot_id = { path = "../../crates/bot_id" }
bots = { path = "../../crates/bots", default-features = false, features = ["outbound"] }
channel_sender = { path = "../../crates/channel_sender" }
channels = { path = "../../crates/channels", default-features = false }
documents = { path = "../../crates/documents", default-features = false }
entity_access = { path = "../../crates/entity_access", default-features = false, features = ["inbound", "outbound"] }
entity_access_db_utils = { path = "../../crates/entity_access_db_utils" }
kafka_util = { path = "../../crates/kafka_util" }
macro_event_broker = { path = "../../crates/macro_event_broker", features = ["outbound"] }
macro_event_topics = { path = "../../crates/macro_event_topics" }
messages = { path = "../../crates/messages", features = ["broker"] }
rdkafka = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
macro_env_var = { path = "../../crates/macro_env_var" }
macro_queues = { path = "../../crates/macro_queues" }
macro_config = { path = "../../crates/macro_config" }
macro_authorization = { path = "../../crates/macro_authorization", features = [
  "postgres",
] }
database_env_vars = { path = "../../crates/database_env_vars" }
doppler-config = { workspace = true }
sqlx = { workspace = true }
macro_user_id = { path = "../../crates/macro_user_id"}
cron = { workspace = true }
anyhow = { workspace = true }
macro_uuid = { path = "../../crates/macro_uuid"}
chrono = { workspace = true}
chrono-tz = { workspace = true }
agent = { path = "../../crates/agent" }
ai_usage = { path = "../../crates/ai_usage" }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
ai_tools = { path = "../../crates/ai_tools" }
ai_toolset = { path = "../../crates/ai_toolset" }
aws-sdk-sqs = { workspace = true }
chat = { path = "../../crates/chat" }
connection_gateway_client = { path = "../../crates/connection_gateway_client" }
share_permission_db_utils = { path = "../../crates/share_permission_db_utils" }
models_permissions = { path = "../../crates/models_permissions" }
macro_db_client = { path = "../../crates/macro_db_client" }
memory = { path = "../../crates/memory" }
model = { path = "../../crates/model" }
model-entity = { path = "../../crates/model-entity" }
model_owner = { path = "../../crates/model_owner" }
entity_registry = { path = "../../crates/entity_registry/entity_registry", features = ["axum"] }
entity_registry_db_utils = { path = "../../crates/entity_registry/entity_registry_db_utils" }
model_notifications = { path = "../../crates/model_notifications" }
notification = { path = "../../crates/notification" }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { workspace = true }
tower = { workspace = true }

macro_aws_config = { path = "../../crates/macro_aws_config" }
macro_cors = { path = "../../crates/macro_cors" }
macro_auth = { path = "../../crates/macro_auth" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
aws-sdk-secretsmanager = { workspace = true }

macro_service_urls = { path = "../../crates/macro_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
bot_id = { path = "../../crates/bot_id", features = ["test-utils"] }
macro_db_migrator = { path = "../../crates/macro_db_migrator" }
