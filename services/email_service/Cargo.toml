[package]
default-run = "email_service"
edition = "2024"
name = "email_service"
publish = false
version = "0.1.0"

[[bin]]
name = "email_service"
path = "src/main.rs"

[[bin]]
name = "backfill_contacts"
path = "src/bin/backfill_contacts/backfill_contacts.rs"

[[bin]]
name = "backfill_calendar_flags"
path = "src/bin/backfill_calendar_flags/backfill_calendar_flags.rs"

[[bin]]
name = "backfill_signal_flags"
path = "src/bin/backfill_signal_flags/backfill_signal_flags.rs"

[[bin]]
name = "backfill_outlook_snippets"
path = "src/bin/backfill_outlook_snippets/backfill_outlook_snippets.rs"

[[bin]]
name = "backfill_gmail_attachments"
path = "src/bin/backfill_gmail_attachments/backfill_gmail_attachments.rs"

[[bin]]
name = "backfill_sfs_attachments"
path = "src/bin/backfill_sfs_attachments/backfill_sfs_attachments.rs"

[[bin]]
name = "pubsub_workers"
path = "src/bin/pubsub_workers/pubsub_workers.rs"

[[bin]]
name = "find_used_sfs_ids"
path = "src/bin/find_used_sfs_ids/find_used_sfs_ids.rs"

[[bin]]
name = "find_unused_sfs_ids"
path = "src/bin/find_unused_sfs_ids/find_unused_sfs_ids.rs"

[[bin]]
name = "cleanup_unused_sfs"
path = "src/bin/cleanup_unused_sfs/cleanup_unused_sfs.rs"

[[bin]]
name = "reverse_sfs_mappings"
path = "src/bin/reverse_sfs_mappings/reverse_sfs_mappings.rs"

[[bin]]
name = "email_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "email_service_doppler_config"
path = "src/doppler_config.rs"


# Built only by the `build-service-bins` CI job, which needs the real binaries;
# `test = false` keeps it out of the test job.
[[test]]
name = "service_binary_builds"
path = "tests/service_binary_builds.rs"
test = false

[features]
attachment_upload = []
connection_gateway = []
contacts_sync = []
default = [
  "attachment_upload",
  "connection_gateway",
  "contacts_sync",
  "gmail_webhook_auth",
  "sfs_map",
  "sfs_delete",
]
gmail_webhook_auth = []
local_auth = ["macro_authorization/local_auth"]
local_queue = []
sfs_map = []
sfs_delete = []

[dependencies]
agent_correlation = { workspace = true, features = ["http", "postgres"] }
calendar_events = { workspace = true, features = ["google", "inbound", "postgres", "schema"] }
anyhow = { workspace = true }
authentication_service_client = { workspace = true }
email_thread_id = { workspace = true }
macro_aws_config = { workspace = true, features = ["s3", "sqs"] }
aws-sdk-s3 = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
cloudfront_sign = { workspace = true }
connection_gateway_client = { workspace = true }
crm = { workspace = true, default-features = true }
unfurl = { workspace = true, features = ["outbound"] }
document_storage_service_client = { workspace = true }
doppler-config = { workspace = true }
ego-tree = { workspace = true }
email = { workspace = true, features = ["axum", "calendar_invitations", "gmail_token", "inbound", "outbound", "mailbox", "sqs"] }
entity_access = { workspace = true }
entity_access_outbound = { workspace = true }
entity_access_management = { workspace = true, default-features = true }
email_db_client = { workspace = true }
email_utils = { workspace = true }
filter_ast = { workspace = true }
frecency = { workspace = true, features = ["postgres"] }
futures = { workspace = true }
gmail_client = { workspace = true }
google_token = { workspace = true }
html-escape = { workspace = true }
http-body-util = { workspace = true }
infer = { workspace = true }
item_filters = { workspace = true, default-features = true }
lol_html = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_cors = { workspace = true }
macro_config = { workspace = true }
macro_db_client = { workspace = true, default-features = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_event_broker = { workspace = true, default-features = true }
macro_env_var = { workspace = true }
macro_queues = { workspace = true }
macro_middleware = { workspace = true }
notification = { workspace = true, default-features = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
mime_guess = "2.0.5"
channels = { workspace = true, features = ["outbound"] }
contacts = { workspace = true, default-features = true }
generic_email_domains = { workspace = true }
model = { workspace = true }
model_entity = { workspace = true }
model_file_type = { workspace = true }
model_notifications = { workspace = true }
models_email = { workspace = true }
models_pagination = { workspace = true, features = ["axum"] }
models_properties = { workspace = true }
rand = { workspace = true }
redis = { workspace = true, features = [
  "cluster-async",
  "connection-manager",
  "tokio-rustls-comp",
] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rootcause = { workspace = true }
s3_client = { workspace = true }
scraper = { workspace = true }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
sqlx-core = { workspace = true }
sqs_client = { workspace = true, features = [
  "email",
  "gmail",
  "sfs_delete",
  "sfs_uploader"
] }
sqs_worker = { workspace = true }
static_file_service_client = { workspace = true }
strum_macros = { workspace = true }
system_properties = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-retry.workspace = true
tower = { workspace = true }
tower-http = { workspace = true, features = [
  "compression-gzip",
] }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

auth_service_url = { workspace = true }
connection_gateway_url = { workspace = true }
document_storage_service_url = { workspace = true }
email_service_url = { workspace = true }
static_file_service_url = { workspace = true }
email_api_client_core = { workspace = true, features = ["ports"] }
email_api_client_outbound = { workspace = true, features = ["outbound-gmail", "outbound-outlook", "microsoft-gate"] }

[dev-dependencies]
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
macro_auth = { workspace = true, features = ["testing"] }
macro_db_migrator = { workspace = true }
