version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws-sdk-sqs = { workspace = true }
macro_aws_config = { workspace = true }
aws_lambda_events = { workspace = true, features = ["eventbridge"] }
chrono = { workspace = true }
email = { workspace = true, features = ["ports"] }
futures = { workspace = true }
lambda_runtime = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_queues = { workspace = true }
models_email = { workspace = true }
sqlx = { workspace = true }
