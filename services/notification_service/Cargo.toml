[package]
default-run = "notification_service"
edition = "2024"
name = "notification_service"
publish = false
version = "0.1.0"

[[bin]]
name = "notification_service"
path = "src/main.rs"

[[bin]]
name = "notification_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "notification_service_doppler_config"
path = "src/doppler_config.rs"

[features]
default = ["push_notification_event_handler"]
local_queue = []
push_notification_event_handler = []

[dependencies]
attention_feed = { path = "../../crates/attention_feed", features = ["outbound"] }
agent_correlation = { path = "../../crates/agent_correlation", features = ["http", "postgres"] }
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sns = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
bot_id = { path = "../../crates/bot_id" }
bots = { path = "../../crates/bots", default-features = false, features = ["outbound"] }
chrono = { workspace = true }
database_env_vars = { path = "../../crates/database_env_vars" }
email_formatting = { path = "../../crates/email_formatting" }
entity_access = { path = "../../crates/entity_access", default-features = false, features = ["outbound"] }
hmac = { workspace = true }
http-body-util = { workspace = true }
itertools = { workspace = true }
last_online_tracker = { path = "../../crates/last_online_tracker" }
macro_auth = { path = "../../crates/macro_auth" }
macro_authorization = { path = "../../crates/macro_authorization", features = [
  "postgres",
] }
macro_aws_config = { path = "../../crates/macro_aws_config" }
macro_config = { path = "../../crates/macro_config" }
doppler-config = { workspace = true }
macro_cors = { path = "../../crates/macro_cors" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_env_var = { path = "../../crates/macro_env_var" }
macro_event_broker = { path = "../../crates/macro_event_broker" }
macro_middleware = { path = "../../crates/macro_middleware", default-features = false }
macro_queues = { path = "../../crates/macro_queues" }
macro_tower_layers = { path = "../../crates/macro_tower_layers" }
macro_user_id = { path = "../../crates/macro_user_id" }
strum = { workspace = true }
model = { path = "../../crates/model" }
model-entity = { path = "../../crates/model-entity" }
model-error-response = { path = "../../crates/model-error-response" }
model_notifications = { path = "../../crates/model_notifications" }
models_pagination = { path = "../../crates/models_pagination", features = [
  "axum",
] }
notification = { path = "../../crates/notification", features = ["axum"] }
notification_db_client = { path = "../../crates/notification_db_client" }
notification_inbox = { path = "../../crates/notification_inbox" }
call = { path = "../../crates/call", default-features = false, features = ["outbound", "ports"] }
channels = { path = "../../crates/channels", features = ["outbound"] }
crm = { path = "../../crates/crm" }
email = { path = "../../crates/email", features = ["outbound"] }
entity_access_management = { path = "../../crates/entity_access_management" }
foreign_entity = { path = "../../crates/foreign_entity" }
frecency = { path = "../../crates/frecency", features = ["outbound", "postgres"] }
github_pull_requests = { path = "../../crates/github_pull_requests" }
readonly_pool = { path = "../../crates/readonly_pool" }
soup = { path = "../../crates/soup", features = ["outbound"] }
rate_limit = { path = "../../crates/rate_limit", features = ["axum"] }
redis = { workspace = true }
rootcause = { workspace = true }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sns_client = { path = "../../crates/sns_client" }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["chrono"] }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
work_feed = { path = "../../crates/work_feed" }

macro_service_urls = { path = "../../crates/macro_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
attention_feed = { path = "../../crates/attention_feed", features = ["outbound", "test-utils"] }
macro_auth = { path = "../../crates/macro_auth", features = ["testing"] }
macro_db_migrator = { path = "../../crates/macro_db_migrator" }
