[package]
default-run = "notification_service"
edition = "2024"
name = "notification_service"
publish = false
version = "0.1.0"

[[bin]]
name = "notification_service"
path = "src/main.rs"

[[bin]]
name = "notification_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "notification_service_doppler_config"
path = "src/doppler_config.rs"

[features]
default = ["push_notification_event_handler"]
local_queue = []
push_notification_event_handler = []

[dependencies]
agent_correlation = { workspace = true, features = ["http", "postgres"] }
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sns = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
datastore_env_vars = { workspace = true }
email_formatting = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
itertools = { workspace = true }
last_online_tracker = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_aws_config = { workspace = true }
macro_config = { workspace = true }
doppler-config = { workspace = true }
macro_cors = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_event_broker = { workspace = true, default-features = true }
macro_middleware = { workspace = true }
macro_queues = { workspace = true }
macro_tower_layers = { workspace = true }
macro_user_id = { workspace = true }
shared_types = { workspace = true, features = ["axum"] }
entity_kind = { workspace = true }
model_error_response = { workspace = true }
model_notifications = { workspace = true }
pagination_types = { workspace = true, features = [
  "axum",
] }
notification = { workspace = true }
notification_inbound = { workspace = true, features = ["axum"] }
notification_outbound = { workspace = true }
notification_db_client = { workspace = true }
rate_limit = { workspace = true }
redis = { workspace = true }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sns_client = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["chrono"] }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

connection_gateway_url = { workspace = true }
notification_service_url = { workspace = true }

[dev-dependencies]
macro_auth = { workspace = true, features = ["testing"] }
