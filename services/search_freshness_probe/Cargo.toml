[package]
default-run = "search_freshness_probe"
edition = "2024"
name = "search_freshness_probe"
publish = false
version = "0.1.0"

[[bin]]
name = "search_freshness_probe"
path = "src/main.rs"

[[bin]]
name = "search_freshness_probe_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
axum = { workspace = true }
channels = { path = "../../crates/channels", default-features = false }
doppler-config = { workspace = true }
futures = { workspace = true }
item_filters = { path = "../../crates/item_filters" }
macro_config = { path = "../../crates/macro_config" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_env_var = { path = "../../crates/macro_env_var" }
macro_service_urls = { path = "../../crates/macro_service_urls" }
macro_tower_layers = { path = "../../crates/macro_tower_layers" }
messages = { path = "../../crates/messages", default-features = false, features = ["ports"] }
model = { path = "../../crates/model" }
models_permissions = { path = "../../crates/models_permissions" }
models_properties = { path = "../../crates/models_properties" }
models_search = { path = "../../crates/models_search" }
opentelemetry = { workspace = true, features = ["metrics"] }
rand = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
chrono = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
