[package]
edition = "2024"
name = "connection_gateway"
publish = false
version = "0.1.0"

[lib]
name = "connection_gateway"
path = "src/lib.rs"

[[bin]]
name = "connection_gateway_service"
path = "src/main.rs"

[[bin]]
name = "connection_gateway_doppler_config"
path = "src/doppler_config.rs"


[[bin]]
name = "stale_connections"
path = "scripts/stale_connections.rs"

[[bin]]
name = "connection_gateway_openapi"
path = "src/openapi.rs"

[features]
local_auth = ["macro_authorization/local_auth"]

[dependencies]
agent_correlation = { workspace = true, features = ["http", "postgres"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
axum = { workspace = true, features = ["macros", "tower-log", "ws"] }
chrono = { workspace = true }
connection_gateway_client = { workspace = true }
connection_gateway_models = { workspace = true }
cowlike = { workspace = true }
dashmap = { workspace = true }
ensure_exists = { workspace = true, features = ["dynamodb"] }
entity_access = { workspace = true }
entity_access_outbound = { workspace = true }
frecency = { workspace = true, features = [
  "inbound",
  "outbound",
  "postgres",
] }
futures = { workspace = true }
http-body-util = { workspace = true }
itertools = { workspace = true }
last_online_tracker = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_user_id = { workspace = true }
macro_aws_config = { workspace = true }
macro_config = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_tower_layers = { workspace = true }
postcard = { workspace = true }
model = { workspace = true }
model_entity = { workspace = true }
models_bulk_upload = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
redis = { workspace = true, features = [
  "aio",
  "tokio-comp",
  "tokio-rustls-comp",
] }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_dynamo = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true, features = ["derive"] }
stream = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
doppler-config = { workspace = true }

[dev-dependencies]
cool_asserts = "2"
macro_auth = { workspace = true, features = ["testing"] }
