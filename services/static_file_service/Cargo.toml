[package]
edition = "2024"
name = "static_file_service"
publish = false
version = "0.1.0"

[[bin]]
name = "static_file_service"
path = "src/main.rs"

[[bin]]
name = "static_file_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "static_file_service_doppler_config"
path = "src/doppler_config.rs"

[features]
dynamodb_client_test = []
local_auth = ["macro_authorization/local_auth"]
tree_trace = []

[dependencies]
anyhow = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs.workspace = true
axum = { workspace = true, features = ["tower-log", "ws"] }
chrono = { workspace = true }
doppler-config = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true }
macro_aws_config = { workspace = true, features = ["s3"] }
macro_config = { workspace = true }
macro_cors = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_queues = { workspace = true }
model = { workspace = true }
models_sfs = { workspace = true }
s3_key = { workspace = true }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_dynamo = { workspace = true }
serde_json = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["limit", "timeout"] }
tracing.workspace = true
tracing-tree = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid.workspace = true

macro_service_urls = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
