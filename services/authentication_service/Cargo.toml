[package]
default-run = "authentication_service"
edition = "2024"
name = "authentication_service"
publish = false
version = "0.1.0"

[[bin]]
name = "authentication_service"
path = "src/main.rs"

[[bin]]
name = "generate_keys"
path = "src/bin/generate_keys.rs"

[[bin]]
name = "authentication_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "authentication_service_doppler_config"
path = "src/doppler_config.rs"


# Built only by the `build-service-bins` CI job, which needs the real binaries;
# `test = false` keeps it out of the test job.
[[test]]
name = "service_binary_builds"
path = "tests/service_binary_builds.rs"
test = false

[features]
default = ["rate_limit"]
local = []
# Local opt-out for the throttles `rate_limit` installs — additive, so local
# builds stay in the one unified `cargo` invocation. See `RATE_LIMIT_ENABLED`.
no_rate_limit = []
rate_limit = []
return_passwordless_code = []

