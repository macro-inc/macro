[package]
default-run = "calendar_service"
edition = "2024"
name = "calendar_service"
publish = false
version = "0.1.0"

[[bin]]
name = "calendar_service"
path = "src/main.rs"

[[bin]]
name = "calendar_service_openapi"
path = "src/openapi.rs"

[features]
connection_gateway = []
default = ["connection_gateway"]

[dependencies]
agent_correlation = { workspace = true, features = ["http", "postgres"] }
anyhow = { workspace = true }
authentication_service_client = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
calendar_events = { workspace = true, features = [
  "google",
  "inbound",
  "postgres",
] }
calendar_scheduling = { workspace = true, features = ["calendar", "inbound", "postgres"] }
chrono = { workspace = true }
connection_gateway_client = { workspace = true }
email_db_client = { workspace = true }
email_utils = { workspace = true }
futures = { workspace = true }
google_token = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_aws_config = { workspace = true }
macro_config = { workspace = true }
macro_cors = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_event_broker = { workspace = true, default-features = true }
macro_queues = { workspace = true }
email_types = { workspace = true }
redis = { workspace = true, features = ["tokio-rustls-comp"] }
reqwest = { workspace = true }
rootcause = { workspace = true }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_worker = { workspace = true }
subtle = { workspace = true }
teams = { workspace = true, features = ["outbound", "ports"] }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
app_service_url = { workspace = true }
auth_service_url = { workspace = true }
connection_gateway_url = { workspace = true }
document_storage_service_url = { workspace = true }
email_api_client_core = { workspace = true, features = ["ports"] }
email_api_client_outbound = { workspace = true, features = ["outbound-outlook", "microsoft-gate"] }
