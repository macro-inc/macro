[package]
name = "sync_service"
version = "0.1.0"
edition = "2024"
authors = ["synoet <teonys@nyu.edu>"]
build = "build.rs"
publish = false

[features]
# Activate only after the always-on chunk reader has reached every room.
# Default-off reader-only deployments remain safe to roll back to legacy code.
chunked-operation-writes = []

default = ["owned", "do-sqlite-snapshot-storage", "search-service"]
no-network-deps = []
# Test-only persistence fault injection; never enable in deployed workers.
migration-test-hooks = []
# Test-only ordered boundary capture; never enable in deployed workers.
transcript = []
do-sqlite-snapshot-storage = []
kv-snapshot-storage = []
r2-snapshot-storage = []
search-service = []
owned = ["sync_protocol/owned"]
create-default-state = []
alarm-keep-alive = []
openapi = ["dep:utoipa", "sync_server_core/openapi"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sync_service_openapi"
path = "src/bins/openapi.rs"
required-features = ["openapi"]

[package.metadata.release]
release = false

[package.metadata.wasm-pack.profile.release]
# https://github.com/rustwasm/wasm-pack/issues/1247
wasm-opt = true

[dependencies]
macro_document_model = { workspace = true, default-features = false }
strum.workspace = true
worker = { workspace = true, features = ['d1', 'http', 'axum'] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  'time',
] }
tracing-web = "0.1"
web-time.workspace = true
time = { workspace = true, features = ['wasm-bindgen'] }
bebop.workspace = true
sync_protocol = { workspace = true }
sync_server_core = { workspace = true, features = ["in-process-gate"] }
serde_json.workspace = true
serde.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen.workspace = true
uuid = { workspace = true, features = ["js"] }
macro_sync_service_jwt = { path = "../../crates/macro_sync_service_jwt" }
worker-rs-otel = { path = "../../crates/worker-rs-otel" }
subtle = { workspace = true }
base64.workspace = true
futures.workspace = true

# Workers cannot enable the workspace's native Tokio/compression features.
[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { workspace = true }
# Keep native-only schema generation out of the worker build.
utoipa = { version = "5.4.0", optional = true }

[dependencies.tower-service]
workspace = true

[package.metadata.cargo-shear]
# `time` activates the wasm-bindgen clock for OffsetDateTime::now_utc.
ignored = ["time"]
