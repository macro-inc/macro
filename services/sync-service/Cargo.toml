[package]
name = "sync_service"
version = "0.1.0"
edition = "2024"
authors = ["synoet <teonys@nyu.edu>"]
build = "build.rs"
publish = false

[features]
default = ["bebop-owned-all", "do-sqlite-snapshot-storage", "search-service"]
no-network-deps = []
# Test-only persistence fault injection; never enable in deployed workers.
migration-test-hooks = []
do-sqlite-snapshot-storage = []
kv-snapshot-storage = []
r2-snapshot-storage = []
search-service = []
bebop-owned-all = ["sync_service_bebop_schema/bebop-owned-all"]
create-default-state = []
alarm-keep-alive = []
openapi = ["dep:utoipa"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sync_service_openapi"
path = "src/bins/openapi.rs"
required-features = ["openapi"]

[package.metadata.release]
release = false

[package.metadata.wasm-pack.profile.release]
# https://github.com/rustwasm/wasm-pack/issues/1247
wasm-opt = true

[dependencies]
worker = { workspace = true, features = ['d1', 'http', 'axum'] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  'time',
] }
tracing-web = "0.1"
web-time.workspace = true
time = { workspace = true, features = ['wasm-bindgen'] }
bebop.workspace = true
sync_service_bebop_schema = { path = "bebop-schema" }
serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen.workspace = true
uuid = { workspace = true, features = ["js"] }
loro.workspace = true
macro_sync_service_jwt = { path = "../../crates/macro_sync_service_jwt" }
worker-rs-otel = { path = "../../crates/worker-rs-otel" }
subtle = { workspace = true }
base64.workspace = true
futures.workspace = true
thiserror.workspace = true

# Workers cannot enable the workspace's native Tokio/compression features.
[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { workspace = true }
# Keep native-only schema generation out of the worker build.
utoipa = { version = "5.4.0", optional = true }

[dependencies.tower-service]
workspace = true
