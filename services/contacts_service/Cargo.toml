[package]
default-run = "contacts_service"
edition = "2024"
name = "contacts_service"
publish = false
version = "0.1.0"

[[bin]]
name = "contacts_service"
path = "src/main.rs"

[[bin]]
name = "contacts_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "contacts_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
agent_correlation = { workspace = true, features = ["http", "postgres"] }
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
contacts = { workspace = true, default-features = true, features = ["axum"] }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_aws_config = { workspace = true }
macro_cors = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
rate_limit = { workspace = true, features = ["axum"] }
redis = { workspace = true }
secretsmanager_client = { workspace = true }
sqlx = { workspace = true }
sqs_worker = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
macro_env_var = { workspace = true }
macro_queues = { workspace = true }
macro_config = { workspace = true }
database_env_vars = { workspace = true }
doppler-config = { workspace = true }
connection_gateway_url = { workspace = true }

[features]
mock = []

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true }
macro_user_id = { workspace = true }
serde_json = { workspace = true }
