[package]
edition = "2024"
name = "agent_trigger_service"
publish = false
version = "0.1.0"

[[bin]]
name = "agent_trigger_service"
path = "src/main.rs"

[dependencies]
ai_billing = { workspace = true, features = ["pg-admission"] }
initiative = { workspace = true, features = ["messages", "postgres"] }
crm = { workspace = true, features = ["lookup"] }
call = { workspace = true, features = ["outbound"] }
agent_session = { workspace = true, default-features = true }
agent_trigger = { workspace = true, features = ["outbound"] }
jev = { workspace = true, features = ["outbound"] }
ai_usage = { workspace = true }
anyhow = { workspace = true }
bots = { workspace = true, features = ["outbound", "ports"] }
channels = { workspace = true, features = ["outbound", "ports"] }
connection_gateway_client = { workspace = true }
database_env_vars = { workspace = true }
document_storage_service_client = { workspace = true }
entity_access = { workspace = true, default-features = true }
entity_access_outbound = { workspace = true }
entity_registry = { workspace = true }
entity_registry_db_utils = { workspace = true }
kafka_util = { workspace = true }
lexical_client = { workspace = true }
macro_config = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env_var = { workspace = true }
macro_event_broker = { workspace = true, default-features = true, features = ["outbound"] }
messages = { workspace = true, features = ["broker", "delivery", "outbound"] }
properties = { workspace = true, features = ["outbound"] }
rdkafka = { workspace = true }
rootcause = { workspace = true }
system_properties = { workspace = true }
sqlx = { workspace = true }
static_file = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
teams = { workspace = true, features = ["ai_billing"] }
connection_gateway_url = { workspace = true }
document_storage_service_url = { workspace = true }
lexical_service_url = { workspace = true }
static_file_service_url = { workspace = true }
