[package]
default-run = "search_processing_service"
edition = "2024"
name = "search_processing_service"
publish = false
version = "0.1.0"

[features]
default = ["processing", "service", "pdf"]
processing = [
  "dep:call",
  "dep:channels",
  "dep:chat",
  "dep:documents",
  "dep:email",
  "dep:kafka_util",
  "dep:macro_event_broker",
  "dep:macro_event_topics",
  "dep:models_properties",
  "dep:projects",
  "dep:properties",
  "dep:rdkafka",
  "dep:rootcause",
  "dep:tokio-retry",
]
service = [
  "dep:documents",
  "dep:macro_event_broker",
  "macro_db_client",
  "dep:models_properties",
  "dep:properties",
]
pdf = ["dep:pdfium-render"]

[[bin]]
name = "search_processing_service"
path = "src/main.rs"
required-features = ["processing", "service"]

[[bin]]
name = "search_processing_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
agent_session = { workspace = true, features = ["outbound"] }
bots = { workspace = true, features = ["outbound", "ports"] }
entity_registry = { workspace = true }
entity_registry_db_utils = { workspace = true }
agent_fold = { workspace = true, default-features = true }
anyhow = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
call = { workspace = true, optional = true }
channels = { workspace = true, optional = true }
messages = { workspace = true, features = ["broker"] }
chat = { workspace = true, optional = true }
chrono = { workspace = true }
comms_db_client = { workspace = true }
email = { workspace = true, optional = true }
email_db_client = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
kafka_util = { workspace = true, optional = true }
lexical_client = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_aws_config = { workspace = true, features = ["s3"] }
macro_cors = { workspace = true }
macro_config = { workspace = true }
macro_db_client = { workspace = true, default-features = true, optional = true } # Make this optional
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
calendar_events = { workspace = true }
macro_event_broker = { workspace = true, features = [
  "outbound",
], optional = true }
macro_event_topics = { workspace = true, optional = true }
macro_queues = { workspace = true }
macro_middleware = { workspace = true }
macro_user_id = { workspace = true }
macro_uuid = { workspace = true }
mention_utils = { workspace = true }
document_sub_type = { workspace = true, default-features = true }
documents = { workspace = true, optional = true }
ai_engine = { workspace = true }
fig_engine = { workspace = true, default-features = true }
psd_engine = { workspace = true }
doppler-config = { workspace = true }
model = { workspace = true }
model_owner = { workspace = true }
s3_key = { workspace = true }
models_email = { workspace = true }
model_file_type = { workspace = true }
models_properties = { workspace = true, optional = true }
models_search = { workspace = true }
nom = { workspace = true }
opensearch_client = { workspace = true }
ensure_exists = { workspace = true, features = ["dynamodb"] }
pdfium-render = { workspace = true, optional = true }
properties = { workspace = true, features = [
  "outbound",
], optional = true }
projects = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
rust-embed = "8.6.0"
s3_client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_client = { workspace = true, features = [
  "search",
] }
sqs_worker = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tokio-retry = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

lexical_service_url = { workspace = true }
