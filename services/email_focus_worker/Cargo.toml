[package]
edition = "2024"
name = "email_focus_worker"
publish = false
version = "0.1.0"

[[bin]]
name = "email_focus_worker"
path = "src/main.rs"

[[bin]]
name = "email_focus_worker_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
ai_usage = { workspace = true }
calendar_events = { workspace = true, features = ["postgres"] }
chrono = { workspace = true }
connection_gateway_client = { workspace = true }
doppler-config = { workspace = true }
email = { workspace = true, features = ["outbound", "ports"] }
jev = { workspace = true, features = ["outbound"] }
kafka_util = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, features = ["axum"] }
macro_config = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_event_broker = { workspace = true, default-features = true, features = ["outbound"] }
macro_tower_layers = { workspace = true }
macro_user_id = { workspace = true }
memory = { workspace = true }
models_email = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
rdkafka = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
universal_input = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
agent_harness_service_url = { workspace = true }
connection_gateway_url = { workspace = true }

[dev-dependencies]
macro_db_migrator = { workspace = true }
wiremock = { workspace = true }
