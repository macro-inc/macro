[package]
edition = "2024"
name = "document_text_extractor"
publish = false
version = "0.1.0"

[features]
local = []
local-extract = []
macos = []

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
macro_aws_config = { workspace = true, features = ["s3"] }
aws_lambda_events = { workspace = true, features = [
  "eventbridge",
  "s3",
  "sqs",
] }
lambda_runtime = { workspace = true }
macro_entrypoint = { workspace = true }
macro_env_var = { workspace = true }
mockall = { workspace = true }
shared_types = { workspace = true }
s3_key = { workspace = true }
pdfium-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tiktoken-rs = "0.5.9"
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
macro_db_migrator = { workspace = true }
