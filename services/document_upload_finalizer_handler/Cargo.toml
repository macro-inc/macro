[package]
edition = "2024"
name = "document_upload_finalizer_handler"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws_lambda_events = { workspace = true, features = ["eventbridge"] }
aws-sdk-s3 = { workspace = true }
aws-sdk-sqs = { workspace = true }
bots = { workspace = true, features = ["outbound"] }
documents = { workspace = true, features = [
  "markdown_init",
  "outbound",
  "ports",
] }
entity_registry = { workspace = true }
entity_registry_db_utils = { workspace = true }
lambda_runtime = { workspace = true }
lexical_client = { workspace = true }
macro_aws_config = { workspace = true, features = ["s3"] }
macro_entrypoint = { workspace = true }
macro_env_var = { workspace = true }
macro_queues = { workspace = true }
macro_uuid = { workspace = true }
model = { workspace = true }
model_owner = { workspace = true }
s3_key = { workspace = true }
macro_service_urls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
sqs_client = { workspace = true, default-features = true }
sync_service_client = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[[bin]]
name = "document_upload_finalizer_local_worker"
path = "src/bin/local_worker.rs"
