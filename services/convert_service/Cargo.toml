[package]
default-run = "convert_service"
edition = "2024"
name = "convert_service"
publish = false
version = "0.1.0"

[[bin]]
name = "convert_service_doppler_config"
path = "src/doppler_config.rs"

[features]
disable_cleanup = []
disable_worker = []
local_queue = []

[dependencies]
anyhow = { workspace = true }
aws-sdk-lambda = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
database_env_vars = { workspace = true }
doppler-config = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
lambda_client = { workspace = true }
macro_auth = { workspace = true }
macro_authorization = { workspace = true, default-features = true, features = [
  "postgres",
] }
macro_aws_config = { workspace = true, features = ["s3"] }
macro_cors = { workspace = true }
macro_config = { workspace = true }
macro_db_client = { workspace = true, default-features = true }
macro_entrypoint = { workspace = true }
macro_env = { workspace = true }
macro_env_var = { workspace = true }
macro_middleware = { workspace = true }
macro_queues = { workspace = true }
macro_uuid = { workspace = true }
model = { workspace = true }
s3_key = { workspace = true }
nix = { version = "0.29.0", features = ["process", "signal"] }
remote_env_var = { workspace = true }
rs-libreoffice-bindings = { git = "https://github.com/macro-inc/rs-libreoffice-bindings", rev = "056a40ddfac1d9650be30b9f0b4b934e9266c7dc" }
s3_client = { workspace = true }
secretsmanager_client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_client = { workspace = true, default-features = true }
sqs_worker = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
zip = { workspace = true, features = ["bzip2"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
docx_engine = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
pptx_engine = { workspace = true, default-features = true }
tempfile = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
