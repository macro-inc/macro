[package]
edition = "2024"
name = "queue_gateway"
publish = false
version = "0.1.0"

[[bin]]
name = "queue_gateway"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
http = { workspace = true }
kafka_util = { path = "../../crates/kafka_util" }
macro_config = { path = "../../crates/macro_config" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_tower_layers = { path = "../../crates/macro_tower_layers" }
md-5 = { workspace = true }
rdkafka = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
