"""
Mutation root combining independent domain GraphQL adapters.
"""
type CompleteMutationRoot {
	"""
	Set or attach one property on an entity.
	"""
	setEntityProperty(input: SetEntityPropertyInput!): GraphqlProperty!
	"""
	Add and remove options across one entity's multi-select properties.
	"""
	updateEntityPropertyOptions(input: UpdateEntityPropertyOptionsInput!): [GraphqlProperty!]!
	"""
	Rename heterogeneous entities in one request.
	"""
	renameEntities(inputs: [RenameEntityInput!]!): EntityMutationPayload!
	"""
	Move heterogeneous entities to a project or to the root.
	"""
	moveEntities(inputs: [MoveEntityInput!]!): EntityMutationPayload!
	"""
	Update link and channel share policies across supported entity kinds.
	"""
	updateEntitySharePolicies(inputs: [UpdateEntitySharePolicyInput!]!): EntityMutationPayload!
	"""
	Soft-delete entities with a reversible trash lifecycle.
	"""
	trashEntities(entities: [EntityRefInput!]!): EntityMutationPayload!
	"""
	Restore reversibly deleted entities.
	"""
	restoreEntities(entities: [EntityRefInput!]!): EntityMutationPayload!
	"""
	Irreversibly delete entities.
	"""
	deleteEntitiesPermanently(entities: [EntityRefInput!]!): EntityMutationPayload!
	"""
	Duplicate supported entities.
	"""
	duplicateEntities(inputs: [DuplicateEntityInput!]!): EntityMutationPayload!
	"""
	Add or remove an entity from the actor's favorites.
	"""
	setEntityFavorite(entity: EntityRefInput!, favorite: Boolean!): GraphqlEntityMutationResult!
	"""
	Persist the authenticated user's complete favorites order and return the authoritative list.
	"""
	reorderFavorites(input: ReorderFavoritesInput!): [GraphqlFavorite!]!
	"""
	Record a view or interaction in the authenticated user's channel activity.
	"""
	recordChannelActivity(input: RecordChannelActivityInput!): GraphqlChannelActivity!
	"""
	Update authenticated user-owned notifications and return authoritative rows.
	"""
	updateNotifications(input: UpdateNotificationsInput!): [GraphqlNotification!]!
	"""
	Update all notifications associated with the requested entities for the authenticated user.
	"""
	updateNotificationsForEntity(input: UpdateNotificationsForEntityInput!): [GraphqlNotification!]!
	"""
	Mark an accessible email thread as seen and return its authoritative cache record.
	"""
	markEmailThreadSeen(input: MarkEmailThreadSeenInput!): GraphqlSoupEmailThread!
	"""
	Add or remove one label from an accessible email thread and return its authoritative cache record.
	"""
	updateEmailThreadLabel(input: UpdateEmailThreadLabelInput!): GraphqlSoupEmailThread!
}

