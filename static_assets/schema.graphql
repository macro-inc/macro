"""
Mutation root combining independent domain GraphQL adapters.
"""
type CompleteMutationRoot {
	"""
	Remove a property assignment and identify its normalized cache record.
	"""
	deleteEntityProperty(entityType: GraphqlPropertyTargetEntityType!, entityId: String!, entityPropertyId: ID!): GraphqlCacheDeletion!
	"""
	Set or attach one property on an entity.
	"""
	setEntityProperty(input: SetEntityPropertyInput!): GraphqlProperty!
	"""
	Add and remove options across one entity's multi-select properties.
	"""
	updateEntityPropertyOptions(input: UpdateEntityPropertyOptionsInput!): [GraphqlProperty!]!
	"""
	Rename heterogeneous entities in one request.
	"""
	renameEntities(inputs: [RenameEntityInput!]!): EntityMutationPayload!
	"""
	Move heterogeneous entities to a project or to the root.
	"""
	moveEntities(inputs: [MoveEntityInput!]!): EntityMutationPayload!
	"""
	Update link, explicit team, and channel share policies across supported entity kinds.
	"""
	updateEntitySharePolicies(inputs: [UpdateEntitySharePolicyInput!]!): EntityMutationPayload!
	"""
	Soft-delete entities with a reversible trash lifecycle.
	"""
	trashEntities(entities: [EntityRefInput!]!): EntityMutationPayload!
	"""
	Restore reversibly deleted entities.
	"""
	restoreEntities(entities: [EntityRefInput!]!): EntityMutationPayload!
	"""
	Irreversibly delete entities.
	"""
	deleteEntitiesPermanently(entities: [EntityRefInput!]!): EntityMutationPayload!
	"""
	Duplicate supported entities.
	"""
	duplicateEntities(inputs: [DuplicateEntityInput!]!): EntityMutationPayload!
	"""
	Add or remove an entity and return the generic entity mutation result.
	"""
	setEntityFavorite(entity: EntityRefInput!, favorite: Boolean!): GraphqlEntityMutationResult!
	"""
	Add or remove an entity and return the persisted favorite record.
	"""
	setFavorite(entity: EntityRefInput!, favorite: Boolean!): SetFavoritePayload!
	"""
	Persist the authenticated user's complete favorites order and return the authoritative list.
	"""
	reorderFavorites(input: ReorderFavoritesInput!): [GraphqlFavorite!]!
	"""
	Record a view or interaction in the authenticated user's channel activity.
	"""
	recordChannelActivity(input: RecordChannelActivityInput!): GraphqlChannelActivity!
	"""
	Update authenticated user-owned notifications and return authoritative rows.
	"""
	updateNotifications(input: UpdateNotificationsInput!): [GraphqlNotification!]!
	"""
	Update all notifications associated with the requested entities for the authenticated user.
	"""
	updateNotificationsForEntity(input: UpdateNotificationsForEntityInput!): [GraphqlNotification!]!
	"""
	Mark an accessible email thread as seen and return its authoritative cache record.
	"""
	markEmailThreadSeen(input: MarkEmailThreadSeenInput!): GraphqlSoupEmailThread!
	"""
	Mark an accessible email thread unread and return its authoritative cache record.
	"""
	markEmailThreadUnread(input: MarkEmailThreadUnreadInput!): GraphqlSoupEmailThread!
	"""
	Set archive-based Done and return the primary-backed canonical thread.
	"""
	setEmailThreadArchived(input: SetEmailThreadArchivedInput!): GraphqlSoupEmailThread!
	"""
	Add or remove one label from an accessible email thread and return its authoritative cache record.
	"""
	updateEmailThreadLabel(input: UpdateEmailThreadLabelInput!): GraphqlSoupEmailThread!
	"""
	Create or update an email draft and return its thread's authoritative
	cache record. The client-generated handle resolves through a
	caller-scoped mapping to a server-minted row, so a save replayed from
	the offline mutation queue converges instead of duplicating.
	"""
	saveEmailDraft(input: SaveEmailDraftInput!): SaveEmailDraftPayload!
	"""
	Delete an email draft. Idempotent: deleting an ID that is already
	gone succeeds with `deleted: false`, so a delete replayed from the
	offline mutation queue lands cleanly however late it arrives.
	Deleting a draft that has since been sent fails with
	`DRAFT_ALREADY_SENT`.
	"""
	deleteEmailDraft(input: DeleteEmailDraftInput!): DeleteEmailDraftPayload!
	"""
	Create an initiative owned by the authenticated user.
	"""
	createInitiative(input: CreateInitiativeInput!): GraphqlSoupInitiative!
	"""
	Update project fields; owner-only sharing and membership policy remains in the domain.
	"""
	updateInitiative(initiativeId: ID!, input: UpdateInitiativeInput!): GraphqlSoupInitiative!
	"""
	Idempotently ensure the collaborative description surface of an initiative the viewer
	can see, returning its id, which is the initiative's id. Call before connecting.
	"""
	ensureInitiativeDescriptionSurface(initiativeId: ID!): ID!
	"""
	Delete an initiative after its owner capability has been verified.
	"""
	deleteInitiative(initiativeId: ID!): Boolean!
	"""
	Create an event on one of the viewer's writable calendars.
	"""
	createCalendarEvent(input: CreateCalendarEventInput!): GraphqlCalendarMutationPayload!
	"""
	Patch an event, the whole series or one occurrence.
	"""
	updateCalendarEvent(input: UpdateCalendarEventInput!): GraphqlCalendarMutationPayload!
	"""
	Delete an event, one occurrence, or an occurrence onward.
	"""
	deleteCalendarEvent(input: DeleteCalendarEventInput!): GraphqlCalendarMutationPayload!
	"""
	Set the viewer's RSVP on an event, the whole series or one occurrence.
	"""
	respondToCalendarEvent(input: RespondToCalendarEventInput!): GraphqlCalendarMutationPayload!
}

"""
Root subscription object combining realtime Soup, notification, and
activity adapters.
"""
type CompleteSubscriptionRoot {
	"""
	Subscribe to realtime Soup updates for the authenticated user.
	"""
	soupUpdates: [SoupPatch!]!
	"""
	Frames appended to one accessible agent session's log from now on,
	one run per flush, in log order. Each entry is the row `agentSession.log`
	serves, so a subscriber folds the same bytes a reader of the log does.
	The stream ends with an error when the subscriber falls behind: rows
	were missed, and the log must be refetched.
	"""
	agentSessionLogAppended(sessionId: ID!): [GraphqlAgentSessionLogEntry!]!
	"""
	Subscribe to realtime notifications for the authenticated user.
	"""
	notificationUpdates: GraphqlNotificationPatch!
	"""
	Subscribe to realtime activity for the authenticated user.
	"""
	activityUpdates: GraphqlActivityPatch!
}

