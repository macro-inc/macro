"""
The typed activity-action vocabulary. One member per durable action, plus
[`GraphqlActivityUnknownAction`]: rows written by a newer deployment (or
with an undecodable payload) surface with their raw tag and payload
instead of failing the page.
"""
union GraphqlActivityAction = GraphqlActivityCreated | GraphqlActivityEdited | GraphqlActivityOpened | GraphqlActivityDeleted | GraphqlActivityMessaged | GraphqlActivitySent | GraphqlActivityPropertyChanged | GraphqlActivityParticipantAdded | GraphqlActivityParticipantRemoved | GraphqlActivityCallStarted | GraphqlActivityTaskAdded | GraphqlActivityTaskRemoved | GraphqlActivityUnknownAction

"""
A call was started in the entity.
"""
type GraphqlActivityCallStarted {
	"""
	The started call.
	"""
	callId: ID!
}

"""
The entity was created.
"""
type GraphqlActivityCreated {
	"""
	this object has nothing as a field but we need at least 1 field
	"""
	nothing: Boolean!
}

"""
One local date with activity.
"""
type GraphqlActivityDay {
	"""
	Local date in `YYYY-MM-DD` form.
	"""
	date: String!
	"""
	Number of activities on that date.
	"""
	count: Int!
}

"""
The entity was soft-deleted.
"""
type GraphqlActivityDeleted {
	"""
	this object has nothing as a field but we need at least 1 field
	"""
	nothing: Boolean!
}

"""
The entity's content or metadata was edited.
"""
type GraphqlActivityEdited {
	"""
	this object has nothing as a field but we need at least 1 field
	"""
	nothing: Boolean!
}

"""
One entity ranked by its activity count.
"""
type GraphqlActivityEntityRank {
	"""
	Kind of entity.
	"""
	entityType: GraphqlEntityType!
	"""
	Entity identifier.
	"""
	entityId: ID!
	"""
	Number of activities that touched the entity.
	"""
	count: Int!
}

"""
One activity: a principal did something to an entity at a time.

Carries an entity *reference* only (`entityType`/`entityId`) — clients
resolve names and metadata from their normalized Soup cache.
"""
type GraphqlActivityEvent {
	"""
	The activity's stable identifier.
	"""
	id: ID!
	"""
	The principal that mechanically acted, as a prefix-parseable string
	(`macro|<email>` for users, `bot|<uuid>` for bots).
	"""
	actorId: String!
	"""
	Whose activity this is: the delegating user when the actor acted on
	someone's behalf, otherwise the actor itself.
	"""
	subjectId: String!
	"""
	The kind of entity acted on.
	"""
	entityType: GraphqlEntityType!
	"""
	The entity acted on.
	"""
	entityId: ID!
	"""
	What the principal did.
	"""
	action: GraphqlActivityAction!
	"""
	When it happened, in RFC 3339 format.
	"""
	occurredAt: String!
}

"""
A content-free signal to refresh activity through authorized queries.
"""
type GraphqlActivityInvalidation {
	"""
	True when mounted activity queries need a fresh read.
	"""
	refresh: Boolean!
}

"""
A message was sent in the entity.
"""
type GraphqlActivityMessaged {
	"""
	this object has nothing as a field but we need at least 1 field
	"""
	nothing: Boolean!
}

"""
The entity was opened by its subject.
"""
type GraphqlActivityOpened {
	"""
	this object has nothing as a field but we need at least 1 field
	"""
	nothing: Boolean!
}

