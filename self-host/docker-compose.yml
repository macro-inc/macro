# GENERATED by `just self-host-generate` — do not edit by hand.
# Source: tooling/xtask/crates/xtask_local/src/local/self_host.rs
#
# A single-box, single-origin Macro deployment. Everything the browser touches
# arrives through Caddy on 443; no other container publishes a host port.
name: macro-selfhost

x-env: &env
  env_file:
    - .env

x-service: &service
  <<: *env
  image: ${MACRO_IMAGE_SERVICES:-ghcr.io/macro-inc/macro-services}:${MACRO_VERSION:-latest}
  restart: unless-stopped

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ==========================================================================
  # Edge. The only container with published ports. Terminates TLS for
  # ${MACRO_DOMAIN} (app + API, single origin) and ${S3_DOMAIN} (presigned
  # object URLs, which are signed for that exact host).
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      MACRO_DOMAIN: ${MACRO_DOMAIN:?set MACRO_DOMAIN in .env}
      S3_DOMAIN: ${S3_DOMAIN:?set S3_DOMAIN in .env}
      FUSIONAUTH_DOMAIN: ${FUSIONAUTH_DOMAIN:?set FUSIONAUTH_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_assets:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web_assets:
        condition: service_completed_successfully
    networks:
      services:
        aliases:
          # Containers resolve the public hostnames to the proxy rather than
          # hairpinning through public DNS. The S3 alias is load-bearing:
          # presigned URLs are signed for ${S3_DOMAIN}, so a service fetching
          # its own object has to use that host or the signature won't verify.
          - ${MACRO_DOMAIN}
          - ${S3_DOMAIN}
      databases:
      auth:

  # One-shot: unpack the built frontend bundle into the volume Caddy serves.
  web_assets:
    image: ${MACRO_IMAGE_WEB:-ghcr.io/macro-inc/macro-web}:${MACRO_VERSION:-latest}
    command: ["sh", "-c", "rm -rf /out/* && cp -a /srv/frontend/. /out/"]
    volumes:
      - web_assets:/out
    restart: "no"

  # One-shot: create databases, run migrations, provision object storage,
  # queues, tables, search indices and Kafka topics. Idempotent — it runs on
  # every `macroctl up` and is a no-op once the stack is provisioned.
  init:
    <<: *env
    image: ${MACRO_IMAGE_INIT:-ghcr.io/macro-inc/macro-init}:${MACRO_VERSION:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - databases

  # One-shot: create the event topics. Uses the Kafka image's own CLI rather
  # than putting a second Kafka client in the init image.
  kafka_init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./init/kafka-topics.json:/topics.json:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for i in $$(seq 1 60); do
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1 && break
          sleep 2
        done
        # `--if-not-exists` makes this safe on every restart.
        for topic in $$(grep -oE '"[^"]+"' /topics.json | tr -d '"'); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 6 --replication-factor 1
        done
    networks:
      - databases

  # ==========================================================================
  # Data plane
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-macrodb}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-macro} -d ${POSTGRES_DB:-macrodb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - databases

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - databases

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      # The cluster is unreachable from outside the compose network (no
      # published port), so the demo security plugin is disabled rather than
      # configured. Do not publish 9200.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      databases:
        aliases:
          # Services read OPENSEARCH_URL=http://search:9200 (the name the dev
          # stack uses); keep the alias so one env value works in both.
          - search

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MacroSelfHostCluster1}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - databases

  # S3, SQS, DynamoDB and KMS. See self-host/README.md — this is the known
  # weak point of the stack and the first thing to replace with managed
  # services if you have them. PERSISTENCE keeps state across restarts.
  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs,dynamodb,kms
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-1}
      DEBUG: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      databases:
        aliases:
          - localstack

  # ==========================================================================
  # Identity
  # ==========================================================================
  fusionauth_db:
    image: postgres:16.0-bookworm
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${FUSIONAUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${FUSIONAUTH_DB_PASSWORD:?set FUSIONAUTH_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FUSIONAUTH_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fusionauth_db_data:/var/lib/postgresql/data
    networks:
      - auth-internal

  fusionauth:
    image: fusionauth/fusionauth-app:1.62.1
    restart: unless-stopped
    depends_on:
      fusionauth_db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://fusionauth_db:5432/fusionauth
      DATABASE_ROOT_USERNAME: ${FUSIONAUTH_DB_USER:-postgres}
      DATABASE_ROOT_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      DATABASE_USERNAME: ${FUSIONAUTH_DB_USER:-postgres}
      DATABASE_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.json
      FUSIONAUTH_APP_MEMORY: ${FUSIONAUTH_MEMORY:-512M}
      FUSIONAUTH_APP_RUNTIME_MODE: production
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SEARCH_TYPE: database
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9011/api/status | grep -q '\"status\":\"Ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - fusionauth_config:/usr/local/fusionauth/config
      # Written by `macroctl init` from kickstart/kickstart.json.template.
      - ./generated/kickstart:/usr/local/fusionauth/kickstart:ro
    networks:
      - auth-internal
      - auth

  # ==========================================================================
  # Application services
  # ==========================================================================
  authentication-service:
    <<: *service
    command: ["/app/out/authentication_service"]
    depends_on:
      postgres:
        condition: service_healthy
      fusionauth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth
      - databases
      - services
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  connection_gateway:
    <<: *service
    command: ["/app/out/connection_gateway_service"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      databases:
      services:
        aliases:
          - connection-gateway
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  contacts_service:
    <<: *service
    command: ["/app/out/contacts_service"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      databases:
      services:
        aliases:
          - contacts-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  document_cognition_service:
    <<: *service
    command: ["/app/out/document_cognition_service"]
    environment:
      OVERRIDE_DOCUMENT_STORAGE_SERVICE_URL: http://document-storage-service:8080
      OVERRIDE_AI_EDITING_WORKER_URL: http://ai-editing-worker:8933
      OVERRIDE_SYNC_SERVICE_URL: http://sync-service:8787
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
      OVERRIDE_CONNECTION_GATEWAY_URL: http://connection-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
      document_storage_service:
        condition: service_started
      sync_service:
        condition: service_started
      lexical_service:
        condition: service_started
    networks:
      databases:
      services:
        aliases:
          - document-cognition-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  document_storage_service:
    <<: *service
    command: ["/app/out/document_storage_service"]
    environment:
      OVERRIDE_SYNC_SERVICE_URL: http://sync-service:8787
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      connection_gateway:
        condition: service_started
      authentication-service:
        condition: service_started
      sync_service:
        condition: service_started
      lexical_service:
        condition: service_started
    networks:
      databases:
      services:
        aliases:
          - document-storage-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  document_upload_finalizer:
    <<: *service
    command: ["/app/out/document_upload_finalizer_local_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      sync_service:
        condition: service_started
      lexical_service:
        condition: service_started
    networks:
      - databases
      - services

  email_service:
    <<: *service
    command: ["/app/out/email_service"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentication-service:
        condition: service_started
      document_storage_service:
        condition: service_started
      connection_gateway:
        condition: service_started
      static_file_service:
        condition: service_started
    networks:
      databases:
      services:
        aliases:
          - email-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  email_pubsub_workers:
    <<: *service
    command: ["/app/out/pubsub_workers"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      email_service:
        condition: service_started
    networks:
      - databases
      - services

  notification_service:
    <<: *service
    command: ["/app/out/notification_service"]
    environment:
      OVERRIDE_CONNECTION_GATEWAY_URL: http://connection-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      connection_gateway:
        condition: service_started
    networks:
      databases:
      services:
        aliases:
          - notification-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  search_processing_service:
    <<: *service
    command: ["/app/out/search_processing_service"]
    environment:
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      localstack:
        condition: service_healthy
      lexical_service:
        condition: service_started
    networks:
      databases:
      services:
        aliases:
          - search-processing-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  static_file_service:
    <<: *service
    command: ["/app/out/static_file_service"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      databases:
      services:
        aliases:
          - static-file-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]

  unfurl_service:
    <<: *service
    command: ["/app/out/unfurl_service"]
    networks:
      services:
        aliases:
          - unfurl-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  image_proxy_service:
    <<: *service
    command: ["/app/out/image_proxy_service"]
    networks:
      services:
        aliases:
          - image-proxy-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  mcp_service:
    <<: *service
    command: ["/app/out/mcp_service"]
    environment:
      # rmcp only answers requests whose Host is on this URL's allowed-host
      # list, and its clients dial it in-network as `mcp-service`.
      MCP_PUBLIC_URL: http://mcp-service:8080
      APP_BASE_URL: https://${MACRO_DOMAIN}/app
      REDIS_URL: ${REDIS_URI:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fusionauth:
        condition: service_healthy
    networks:
      auth:
      databases:
      services:
        aliases:
          - mcp-service

  # Agent sandboxes run as siblings on the host Docker daemon, so this service
  # gets the daemon socket — root-equivalent on the host. Opt in deliberately:
  #   macroctl up --profile agents
  agent_harness_service:
    <<: *service
    profiles: ["agents"]
    command: ["/app/out/agent_harness_service"]
    # The only service that does not run as the image's unprivileged user: it
    # drives the host's Docker daemon through the socket below, which the
    # `macro` account has no access to. Another reason this is opt-in.
    user: root
    environment:
      OVERRIDE_CONNECTION_GATEWAY_URL: http://connection-gateway:8080
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
      LOCAL_CONTAINER_NETWORK: macro-selfhost_services
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      connection_gateway:
        condition: service_started
      lexical_service:
        condition: service_started
    networks:
      databases:
      services:
        aliases:
          - agent-harness-service

  # ==========================================================================
  # Workers (Cloudflare Workers running on workerd, via wrangler)
  # ==========================================================================
  sync_service:
    <<: *env
    image: ${MACRO_IMAGE_SYNC:-ghcr.io/macro-inc/macro-sync-service}:${MACRO_VERSION:-latest}
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET_KEY: ${INTERNAL_API_SECRET_KEY}
      DOCUMENT_PERMISSIONS_SECRET: ${DOCUMENT_PERMISSION_JWT}
      DSS_INTERNAL_AUTH_KEY: ${DOCUMENT_STORAGE_SERVICE_AUTH_KEY}
    volumes:
      # Durable Object + D1 state. Document snapshots are also published to
      # document-storage-service, so this is a working set rather than the
      # system of record — but losing it drops edits not yet flushed.
      - sync_state:/app/.wrangler
    networks:
      services:
        aliases:
          - sync-service
      databases:
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  lexical_service:
    <<: *env
    image: ${MACRO_IMAGE_LEXICAL:-ghcr.io/macro-inc/macro-lexical-service}:${MACRO_VERSION:-latest}
    restart: unless-stopped
    environment:
      PORT: 8096
      INTERNAL_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
      SYNC_SERVICE_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
      SYNC_SERVICE_URL: http://sync-service:8787
    depends_on:
      sync_service:
        condition: service_started
    networks:
      services:
        aliases:
          - lexical-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8096/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  ai_editing_worker:
    <<: *env
    image: ${MACRO_IMAGE_AI_EDITING:-ghcr.io/macro-inc/macro-ai-editing-worker}:${MACRO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      sync_service:
        condition: service_started
    volumes:
      - ai_editing_state:/app/.wrangler
    networks:
      services:
        aliases:
          - ai-editing-worker

  websocket_service:
    image: ${MACRO_IMAGE_WEBSOCKET:-ghcr.io/macro-inc/macro-websocket-service}:${MACRO_VERSION:-latest}
    restart: unless-stopped
    networks:
      services:
        aliases:
          - websocket-service

  # Telemetry proxy. Only useful if you point it at your own PostHog/OTLP
  # collector; the app works without it.
  analytics_proxy:
    <<: *env
    profiles: ["analytics"]
    image: ${MACRO_IMAGE_ANALYTICS:-ghcr.io/macro-inc/macro-analytics-proxy}:${MACRO_VERSION:-latest}
    restart: unless-stopped
    networks:
      services:
        aliases:
          - analytics-proxy

networks:
  services:
    driver: bridge
  databases:
    driver: bridge
  auth:
    driver: bridge
  auth-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  kafka_data:
  localstack_data:
  fusionauth_db_data:
  fusionauth_config:
  caddy_data:
  caddy_config:
  web_assets:
  sync_state:
  ai_editing_state:
