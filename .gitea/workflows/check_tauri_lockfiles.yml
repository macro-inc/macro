name: check tauri lockfiles
on:
  pull_request:
    branches:
    - main
    paths:
    - apps/web/tauri/**
    - crates/**/Cargo.toml
    - Cargo.toml
    - nix/tauri-desktop.nix
    - flake.nix
    - flake.lock
    - .github/workflows/check_tauri_lockfiles.yml
permissions:
  contents: read
jobs:
  check-tauri-lockfiles:
    name: check Tauri lockfiles
    runs-on: linux-ci
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Resolve Tauri lockfiles offline
      run: nix build --no-link -L .#checks.x86_64-linux.tauri-cargo-lockfiles
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
