# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/check_node_modules_nix.rs
name: check node_modules nix
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  check-linux-node-modules-nix:
    name: check Linux node_modules nix
    runs-on: linux-ci
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: verify js node_modules derivation is up to date
      run: |
        # A fixed-output derivation already in the store is accepted without
        # running it, whatever bun.lock now says, so only then does the check
        # need a rebuild. On a store without it, the first build is the check.
        out=$(nix eval --raw .#js-node-modules.outPath)
        if nix-store --check-validity "$out" 2>/dev/null; then
          nix build .#js-node-modules --no-link --rebuild
        else
          nix build .#js-node-modules --no-link
        fi
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
