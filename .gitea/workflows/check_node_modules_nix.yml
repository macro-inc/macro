# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/check_node_modules_nix.rs
name: check node_modules nix
on:
  pull_request:
    branches:
    - main
    paths:
    - bun.lock
    - package.json
    - apps/**/package.json
    - packages/**/package.json
    - services/**/package.json
    - apps/web/patches/**
    - nix-support/node_modules.nix
    - nix-support/node_modules-hashes.json
    - nix/tauri-desktop.nix
    - tooling/scripts/update-node-modules-hash.sh
    - flake.nix
    - flake.lock
    - .github/workflows/check_node_modules_nix.yml
permissions:
  contents: read
jobs:
  check-linux-node-modules-nix:
    name: check Linux node_modules nix
    runs-on: linux-ci
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: verify js node_modules derivation is up to date
      run: |
        # The first build ensures the output exists. The rebuild then forces Nix
        # to validate it instead of accepting a cached fixed-output derivation
        # whose hash predates a bun.lock or package manifest change.
        nix build .#js-node-modules --no-link
        nix build .#js-node-modules --no-link --rebuild
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
