# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/cargo_deny.rs
name: cargo deny check
on:
  pull_request:
    paths:
    - Cargo.toml
    - crates/**/Cargo.toml
    - services/**/Cargo.toml
    - tooling/xtask/**/Cargo.toml
    - Cargo.lock
    - deny.toml
    - .github/workflows/cargo_deny.yml
    branches:
    - main
jobs:
  cargo-deny:
    runs-on: linux-ci
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: cargo deny
      uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe
      with:
        manifest-path: Cargo.toml
concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true
