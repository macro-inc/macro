# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/web_app_check_main.rs
name: Web App Pr Checks
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
jobs:
  path-check:
    runs-on: linux-ci
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      codegen_changed: ${{ steps.filter.outputs.codegen_changed }}
      i18n_changed: ${{ steps.filter.outputs.i18n_changed }}
      database_grid_changed: ${{ steps.filter.outputs.database_grid_changed }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - 'services/lexical-service/**'
            - 'packages/sdk/**'
            - 'packages/sdk-docs/**'
            - 'services/ai-editing-worker/**'
            - 'packages/code-mode-sdk/**'
            - 'crates/code_execution/src/outbound/deno/*.mjs'
            - 'crates/agent_code_mode/src/domain/documentation.json'
            - 'crates/agent_code_mode/SKILL.md'
            - 'crates/ai_tools/src/display_results/schema.generated.json'
            - 'crates/dynamic_ui/src/present_view.schema.generated.json'
            - '.github/actions/setup-reqs-web/**'
          codegen_changed:
            - 'crates/**/*.rs'
            - 'services/**/*.rs'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'apps/web/scripts/generate-api-schema.ts'
            - 'apps/web/scripts/services.ts'
            - 'packages/sdk/**'
            - 'apps/docs/**'
            - '.github/actions/setup-reqs-web/**'
          i18n_changed:
            - 'apps/web/src/lib/i18n/**'
            - 'apps/web/src/lib/core/component/ContextMenu.tsx'
            - 'apps/web/src/lib/core/constant/settingsTabsConfig.tsx'
            - 'apps/web/src/components/ui/components/Dropdown.tsx'
            - 'apps/web/src/features/settings/**'
          database_grid_changed:
            - 'apps/web/src/features/database/**'
  android-native-check:
    name: Android Native Check
    runs-on: linux-ci
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
    - name: Checkout PR merge commit
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - id: labels
      name: Read the PR's current labels
      run: |
        set -euo pipefail
        labels=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name] | join(",")')
        echo "labels: ${labels:-<none>}"
        if [[ ",${labels}," == *",skip-android-update,"* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - id: android-version
      name: Require an Android version bump for native changes
      if: steps.labels.outputs.skip != 'true'
      run: |
        set -euo pipefail
        base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -1)
        echo "Comparing the merge result with its base ${base:0:10}"
        git fetch -q --depth=1 origin "$base"
        bun scripts/android-version-check.mjs "$base"
      shell: bash
      working-directory: apps/web
    - name: Keep the Android native build floor without a release
      if: steps.labels.outputs.skip == 'true'
      run: |
        set -euo pipefail
        base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -1)
        git fetch -q --depth=1 origin "$base"
        bun scripts/android-version-check.mjs --skip-release "$base"
      shell: bash
      working-directory: apps/web
    - id: auth
      name: Authenticate to Google Play
      if: steps.android-version.outputs.changed == 'true' && steps.labels.outputs.skip != 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/androidpublisher
        create_credentials_file: 'false'
        export_environment_variables: 'false'
    - name: Require the Play release to be live
      if: steps.android-version.outputs.changed == 'true' && steps.labels.outputs.skip != 'true'
      run: |
        # --- authenticated fetch ------------------------------------------------------
        # gh_fetch <sha|ref>: make a commit that is not in this checkout (the base
        # commit, a moved PR head, GitHub's test merge commit) available. Checkouts
        # may persist credentials, so clear inherited headers before supplying one
        # explicitly. Keep Nix build libraries out of the host Git HTTPS helper.
        # Fails if the commit is unreachable (a force-pushed-away head).
        gh_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          LD_LIBRARY_PATH= git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ------------------------------------------------------------------------------
        # --- PR merge result ----------------------------------------------------------
        # pr_merge_commit: print the sha of GitHub's test merge commit for $PR_NUMBER —
        # the merge result the native gates hash. GitHub computes it lazily
        # (mergeable=UNKNOWN until it has), so poll a little; a PR that really
        # conflicts with its base cannot merge anyway. Needs GH_TOKEN, GH_REPO,
        # PR_NUMBER. Progress goes to stderr so `merge=$(pr_merge_commit)` works.
        pr_merge_commit() {
          local deadline pr_json mergeable merge
          deadline=$(( $(date +%s) + 120 ))
          while true; do
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json mergeable,potentialMergeCommit)
            mergeable=$(jq -r '.mergeable' <<<"$pr_json")
            merge=$(jq -r '.potentialMergeCommit.oid // empty' <<<"$pr_json")
            if [[ -n "$merge" ]]; then
              echo "$merge"
              return 0
            fi
            if [[ "$mergeable" == "CONFLICTING" ]]; then
              echo "PR #${PR_NUMBER} conflicts with its base branch, so GitHub has no merge result for it." >&2
              return 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "GitHub has not computed PR #${PR_NUMBER}'s merge commit yet (mergeable=${mergeable})." >&2
              return 1
            fi
            echo "Merge commit not computed yet (mergeable=${mergeable}); waiting." >&2
            sleep 10
          done
        }
        # ------------------------------------------------------------------------------
        set -euo pipefail
        merge=$(pr_merge_commit)
        gh_fetch "$merge"
        native_hash=$(bun scripts/android-native.mjs hash "$merge")
        echo "Merge result ${merge:0:10}: Android native hash ${native_hash}"
        bun scripts/android-play-status.mjs --version-code "$VERSION_CODE" --require-live \
          --native-hash "$native_hash" --pr "$PR_NUMBER"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
        GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      working-directory: apps/web
    - name: Skipped via label
      if: steps.labels.outputs.skip == 'true'
      run: echo "The skip-android-update label says this PR's Android native changes don't break the native/web contract — skipping the version bump and Play release gate."
  typescript:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Typecheck
    runs-on: linux-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup Prereqs
      uses: ./.github/actions/setup-reqs-web
    - name: Check Dynamic UI Schema
      run: bun run check-dynamic-ui-schema
      working-directory: apps/web
    - name: Check Types
      run: bun run type-check
      working-directory: apps/web
    - name: Check Floating Promises
      run: bun run lint:oxlint --quiet
    - name: Check Functional Test Types
      run: bun run --bun --silent tsc --project tests/functional/tsconfig.json
      working-directory: apps/web
    - name: Check Collaboration Package Types
      run: bun run type-check
      working-directory: packages/collaboration
    - name: Check Lexical Service Types
      run: bun run check
      working-directory: services/lexical-service
    - name: Test Lexical Service Endpoints
      run: bun test src
      working-directory: services/lexical-service
    - name: Install SDK Documentation Dependencies
      run: bun install --frozen-lockfile
      working-directory: packages/sdk
    - name: Check SDK Documentation
      run: bun run type-check && bun run test
      working-directory: packages/sdk-docs
    - name: Check Editing Worker
      run: bun run type-check
      working-directory: services/ai-editing-worker
    - name: Check Code Mode SDK
      run: bun run type-check && bun run test
      working-directory: packages/code-mode-sdk
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  generated-code:
    needs:
    - path-check
    if: needs.path-check.outputs.codegen_changed == 'true'
    name: Generated Code Check
    runs-on: linux-ci
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup Prereqs
      uses: ./.github/actions/setup-reqs-web
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build schema binaries
      run: |
        set -euo pipefail
        read -ra openapi_bins <<< "$(cd apps/web && bun scripts/generate-api-schema.ts --print-cargo-bins)"
        SQLX_OFFLINE=true cargo build "${openapi_bins[@]}" --bin gen_tool_schemas
    - name: Generate API Types
      run: bun run gen-api -- --check
      working-directory: apps/web
    - name: Regenerate SDK code
      run: |
        bun install --frozen-lockfile
        bun run sync-specs
        bun run generate
      working-directory: packages/sdk
    - name: Verify SDK generated code is fresh
      run: |
        if [ -n "$(git status --porcelain -- packages/sdk)" ]; then
          echo "packages/sdk generated code is stale. Run 'just update-generated' in packages/sdk and commit the result."
          git status --porcelain -- packages/sdk
          git diff -- packages/sdk | head -200
          exit 1
        fi
    - name: Regenerate MCP tool pages
      run: bun run generate:tools
      working-directory: apps/docs
    - name: Verify docs tool reference is fresh
      run: |
        if [ -n "$(git status --porcelain -- apps/docs)" ]; then
          echo "apps/docs tool reference is stale. Run 'bun run generate:tools' in apps/docs and commit the result."
          git status --porcelain -- apps/docs
          git diff -- apps/docs | head -200
          exit 1
        fi
    - name: Check Specta Types
      run: |
        just gen-agent-fold-types
        just gen-database-sql-types
        if ! git diff --exit-code -- src/lib/service-clients/service-agent-fold/generated src/lib/core/database-sql/generated; then
          echo "Generated wasm wire types are stale. Run 'just gen-agent-fold-types' and 'just gen-database-sql-types' in apps/web and commit the result."
          exit 1
        fi
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  biome-check:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Biome Check
    runs-on: linux-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: '0'
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell
    - name: Run Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: apps/web
    - name: Run Collaboration Package Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: packages/collaboration
    - name: Check Browser Floor and Native Permissions
      run: bunx --yes @ast-grep/cli@0.44.1 scan --filter '^(tsx?-browser-floor-apis|plist-media-.+)$'
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  test:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Test
    runs-on: linux-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup
      uses: ./.github/actions/setup-reqs-web
      with:
        playwright: 'true'
    - name: Build agent-fold WASM for tests
      run: just build-agent-fold-wasm
      timeout-minutes: 15
      working-directory: apps/web
    - name: Test
      run: bun run test
      env:
        VITEST_MODULE_CACHE_DIR: /home/runner/.cache/vitest-modules
      working-directory: apps/web
    - name: Sign-up Browser Tests
      run: just test-signup-browser
      working-directory: apps/web
    - name: Interface Language Browser Tests
      if: needs.path-check.outputs.i18n_changed == 'true'
      run: |-
        bunx playwright install-deps chromium
        just test-i18n-browser
      working-directory: apps/web
    - name: Database Grid Browser Tests
      if: needs.path-check.outputs.database_grid_changed == 'true'
      run: |-
        bunx playwright install-deps chromium
        just test-database-browser
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  cycles:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Cycles Import Check
    runs-on: linux-ci
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell
    - name: Cycles Import Check
      run: biome lint --changed --no-errors-on-unmatched --only=suspicious/noImportCycles
      working-directory: apps/web
    - name: Collaboration Package Cycles Import Check
      run: biome lint --changed --no-errors-on-unmatched --only=suspicious/noImportCycles
      working-directory: packages/collaboration
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  build:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Build
    runs-on: linux-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup
      uses: ./.github/actions/setup-reqs-web
      with:
        playwright: 'true'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Start sccache server
      run: sccache --start-server
    - name: Build
      run: just build-dev
      env:
        WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs
      working-directory: apps/web
    - name: Test Optimistic Mutations in Chromium
      run: bun run test:functional
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  status-check:
    needs:
    - path-check
    - android-native-check
    - typescript
    - generated-code
    - biome-check
    - test
    - cycles
    - build
    if: always()
    name: Web App Status Check
    runs-on: linux-ci
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "android-native-check: ${{ needs.android-native-check.result }}"
        echo "typescript: ${{ needs.typescript.result }}"
        echo "generated-code: ${{ needs.generated-code.result }}"
        echo "biome-check: ${{ needs.biome-check.result }}"
        echo "test: ${{ needs.test.result }}"
        echo "cycles: ${{ needs.cycles.result }}"
        echo "build: ${{ needs.build.result }}"
        echo "ios-native-check: ${{ needs.ios-native-check.result }}"

        # Fail if any job failed (skipped and success are both OK). The iOS
        # gate is the merge gate, so a cancelled gate is not OK either.
        if [[ "${{ needs.android-native-check.result }}" != "success" ]] || \
           [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.typescript.result }}" == "failure" ]] || \
           [[ "${{ needs.generated-code.result }}" == "failure" ]] || \
           [[ "${{ needs.biome-check.result }}" == "failure" ]] || \
           [[ "${{ needs.test.result }}" == "failure" ]] || \
           [[ "${{ needs.cycles.result }}" == "failure" ]] || \
           [[ "${{ needs.build.result }}" == "failure" ]] || \
           [[ "${{ needs.ios-native-check.result }}" == "failure" ]] || \
           [[ "${{ needs.ios-native-check.result }}" == "cancelled" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi

        echo "All jobs passed or were skipped"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check
  cancel-in-progress: true
