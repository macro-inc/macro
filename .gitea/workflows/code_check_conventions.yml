# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/code_check_conventions.rs
name: conventions code check
on:
  pull_request: {}
permissions:
  contents: read
jobs:
  path-check:
    runs-on: linux-ci
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        fetch-depth: '0'
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'crates/**'
            - 'services/**'
            - 'tooling/xtask/**'
            - 'apps/web/**'
            - 'packages/**'
            - 'rules/**'
            - 'sgconfig.yml'
            - '.github/actions/teardown-nix/**'
            - '.github/workflows/code_check_conventions.yml'
        token: ''
  ast-grep:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: ast-grep Conventions
    runs-on: linux-ci
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
    - name: Restore caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      continue-on-error: true
      with:
        path: /home/runner/.bun/install/cache
        key: forge-ast-grep-${{ github.run_id }}
        restore-keys: forge-ast-grep-
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell
    - name: Run ast-grep
      run: bunx --yes @ast-grep/cli@0.44.1 scan
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  status-check:
    needs:
    - path-check
    - ast-grep
    if: always()
    name: Conventions Status Check
    runs-on: linux-ci
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "ast-grep: ${{ needs.ast-grep.result }}"

        # Fail if any job failed, or ast-grep was cancelled (skipped and
        # success are both OK; cancelled means it started and didn't finish)
        if [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.ast-grep.result }}" == "failure" ]] || \
           [[ "${{ needs.ast-grep.result }}" == "cancelled" ]]; then
          echo "❌ One or more jobs failed"
          exit 1
        fi

        echo "✅ All jobs passed or were skipped"
