# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/sdk_check.rs
name: SDK Check
on:
  pull_request:
    paths:
    - packages/sdk/**
    - .github/workflows/sdk-check.yml
jobs:
  check-package:
    name: SDK Package Check
    runs-on: linux-ci
    steps:
    - name: Put Cargo on PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.5
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install dependencies
      run: bun install --frozen-lockfile
      working-directory: packages/sdk
    - name: Typecheck SDK
      run: bun run check
      working-directory: packages/sdk
    - name: Test SDK
      run: bun test
      working-directory: packages/sdk
    - name: Check endpoint coverage
      run: bun run coverage
      working-directory: packages/sdk
    - name: Check packed SDK
      run: bun run build && bun run check:pack
      working-directory: packages/sdk
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
