# Cargo aliases for the repository Rust workspace.
#
# `cargo x <subcommand>` runs xtask from anywhere in the repository:
#   cargo x workflows [--check]      # regenerate / verify .github/workflows
#   cargo x deps [--check]           # regenerate / verify workspace-hack + dep closures
#   cargo x nextest-filter <file> <base-revision> # affected packages for changed files
#   cargo x doppler-bins <file>      # Doppler config-validation bins affected by changed files
#   cargo x graphql-soup-schema <file> # export GraphQL Soup SDL to a file
#   cargo x cache-wasm [--force]     # build the browser cache wasm package
#   cargo x kafka-topics [--check]   # regenerate / verify kafka-cluster-topics.json
#   (anything else)                  # local/dev orchestration (xtask_local)
#
# `xtask` is a dependency-free launcher: it maps the subcommand to its own
# command crate under tooling/xtask/crates/ and re-invokes `cargo run -p
# xtask_<command>`, so each command compiles only its own dependency set
# (e.g. `cargo x cache-wasm` never builds guppy/hakari/aws-sdk/tokio).
[alias]
x = "run -p xtask --"

# worker-rs-otel (wasm32-unknown-unknown) pulls getrandom 0.3 via OTLP types;
# getrandom 0.3 needs its backend selected at
# build time. Harmless for wasm crates that don't use getrandom 0.3.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
