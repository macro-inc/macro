# Sidebar presence only. Never use this witness as the complete mark-read input.
query ChannelUnreadPresence($input: SoupInput!) {
	user {
		id
		soup(input: $input) {
			items {
				__typename
				id
				... on GraphqlSoupChannel {
					unreadNotifications: notifications(
						filter: {
							states: [UNSEEN]
							topLevelMessagesOnly: true
						}
						limit: 1
					) {
						id
						state
					}
				}
			}
		}
	}
}
