# Forms are not Soup entities: ask only for the outcome. They have no Soup
# record for an effect to patch.
fragment FormEntityMutationResultFields on GraphqlEntityMutationResult {
  __typename
  ... on GraphqlMutationError {
    errorCode
    message
  }
}

mutation RenameForm($id: ID!, $displayName: String!) {
  renameEntities(
    inputs: [{ entity: { type: FORM, id: $id }, displayName: $displayName }]
  ) {
    results {
      ...FormEntityMutationResultFields
    }
  }
}

mutation TrashForm($id: ID!) {
  trashEntities(entities: [{ type: FORM, id: $id }]) {
    results {
      ...FormEntityMutationResultFields
    }
  }
}
