# Small per-card evidence. Completion uses the entity mutation, not these IDs.
query ChannelThreadActivity($input: SoupInput!) {
	user {
		id
		soup(input: $input) {
			items {
				__typename
				id
				... on GraphqlSoupChannelMessage {
					pendingThreadNotifications: notifications(
						filter: { states: [UNSEEN, SEEN] }
						limit: 1
					) {
						id
						state
					}
					unreadThreadNotifications: notifications(
						filter: { states: [UNSEEN] }
						limit: 1
					) {
						id
						state
						eventType
					}
					unreadThreadImportant: notifications(
						filter: { states: [UNSEEN], eventTypes: ["channel_mention", "channel_message_reply"] }
						limit: 1
					) {
						id
						state
						eventType
					}
				}
			}
		}
	}
}
