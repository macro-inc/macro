# Chips and previews must not select counts, task ids, members, or sharing:
# those fields check access to every task in the project.
fragment InitiativeIdentityFields on GraphqlSoupInitiative {
  __typename
  id
  displayName
  viewerPermission {
    __typename
    ... on GraphqlAccessLevelPermission {
      accessLevel
    }
  }
}

# Quick Access reads cached projects by key after a cache search hit. Select
# only fields every initiative write includes (create and update replies carry
# no viewedAt), so a new or renamed project stays complete.
fragment InitiativeQuickAccessFields on GraphqlSoupInitiative {
  __typename
  displayName
  metadata {
    ownerId
    createdAt
    updatedAt
  }
}

fragment InitiativeDetailFields on GraphqlSoupInitiative {
  __typename
  id
  displayName
  metadata {
    ownerId
    createdAt
    updatedAt
  }
  viewerPermission {
    __typename
    ... on GraphqlAccessLevelPermission {
      accessLevel
    }
  }
  properties {
    ...SoupPropertyFields
  }
  taskCount
  completedTaskCount
  memberIds
  taskIds
  sharePermission {
    __typename
    id
    owner
    linkShare
    linkShareAccessLevel
    teamShareAccessLevel
    channelSharePermissions {
      channelId
      accessLevel
    }
  }
}

# A project reads at the root, so a public or team link opens it signed in or
# not. A signed-in read also selects the viewer's id: the cache binds its
# records to that account, and the project view drops a result read for
# another one.
query Initiative($initiativeId: ID!, $signedIn: Boolean = false) {
  user @include(if: $signedIn) {
    id
  }
  initiative(initiativeId: $initiativeId) {
    ...InitiativeDetailFields
  }
}

query InitiativeIdentity($initiativeId: ID!, $signedIn: Boolean = false) {
  user @include(if: $signedIn) {
    id
  }
  initiative(initiativeId: $initiativeId) {
    ...InitiativeIdentityFields
  }
}

# The tasks a project read found visible to the viewer, hydrated without
# another access check. A visitor with no account lists a project's tasks
# this way; the Tasks list needs an account.
query InitiativeTasks($initiativeId: ID!) {
  initiative(initiativeId: $initiativeId) {
    id
    tasks {
      __typename
      id
      displayName
      properties {
        ...SoupPropertyFields
      }
    }
  }
}

mutation CreateInitiative($input: CreateInitiativeInput!) {
  createInitiative(input: $input) {
    ...InitiativeDetailFields
  }
}

mutation UpdateInitiative($initiativeId: ID!, $input: UpdateInitiativeInput!) {
  updateInitiative(initiativeId: $initiativeId, input: $input) {
    ...InitiativeDetailFields
  }
}

mutation EnsureInitiativeDescriptionSurface($initiativeId: ID!) {
  ensureInitiativeDescriptionSurface(initiativeId: $initiativeId)
}

mutation DeleteInitiative($initiativeId: ID!) {
  deleteInitiative(initiativeId: $initiativeId)
}
