# Also used as a typed entrypoint for optimistic property-list links.
# soupEntity reads the primary, so a just-created or just-edited entity is not
# hidden behind a lagging replica.
query EntityProperties($input: SoupEntityInput!) {
  user {
    id
    soupEntity(input: $input) {
      __typename
      id
      properties {
        ...SoupPropertyFields
      }
    }
  }
}

query GroupEntityProperties($input: GroupedSoupInput!) {
  user {
    id
    groupSoup(input: $input) {
      bins {
        key
        items {
          __typename
          id
          properties {
            ...SoupPropertyFields
          }
        }
      }
    }
  }
}
