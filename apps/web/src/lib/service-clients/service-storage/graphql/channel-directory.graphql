# The fields the channel directory reads from a cached channel record. A record
# missing any of them is omitted from directory reads, so SoupItemPreviewFields,
# which every channel write uses, selects each of them; keep the two in step.
fragment ChannelDirectoryFields on GraphqlSoupChannel {
	__typename
	id
	name
	channelType
	ownerId
	organizationId
	teamId
	autoJoinTeam
	createdAt
	updatedAt
	viewedAt
	interactedAt
	isParticipant
	frecencyScore
	participants {
		channelId
		userId
		role
		joinedAt
		leftAt
	}
	botParticipants {
		channelId
		botId
		role
		joinedAt
		leftAt
	}
	agentDm {
		botId
		name
		avatarUrl
	}
	latestMessage {
		...SoupChannelMessageFields
	}
	latestNonThreadMessage {
		...SoupChannelMessageFields
	}
}

# The channel backfill lane's page. scopeIds lists the page's channels so a
# finished pass can tell which cached channels it no longer returned.
query SoupChannelDirectoryBackfill($input: SoupInput!) {
	user {
		id @cacheOnly
		soup(input: $input) {
			items @cacheOnly { ...SoupItemFields }
			scopeIds: items { __typename id }
			nextCursor
		}
	}
}

# The directory's page when the device cache is off: the lane's input, read
# from the network into memory.
query ChannelDirectoryPage($input: SoupInput!) {
	user {
		id
		soup(input: $input) {
			items {
				__typename
				id
				... on GraphqlSoupChannel { ...ChannelDirectoryFields }
			}
			nextCursor
		}
	}
}

# The viewer's DM with one person, the one a first message to them would reuse.
# Asking never creates one.
query DirectMessageChannelId($userId: ID!) {
	user {
		id
		directMessageChannelId(userId: $userId)
	}
}

# When the viewer last viewed one channel, for a channel the directory does not
# hold: one they left or never joined. Null when they never viewed it.
query ViewerChannelViewedAt($channelId: ID!) {
	user {
		id
		channelViewedAt(channelId: $channelId)
	}
}

# One channel read from the primary right after the viewer changed it: the
# in-memory pages read a replica and the cache waits for the server's soup
# update, so the directory shows this until they catch up. Null when the viewer
# can no longer read the channel.
query ChannelDirectoryEntity($input: SoupEntityInput!) {
	user {
		id
		soupEntity(input: $input) {
			__typename
			id
			... on GraphqlSoupChannel { ...ChannelDirectoryFields }
		}
	}
}
