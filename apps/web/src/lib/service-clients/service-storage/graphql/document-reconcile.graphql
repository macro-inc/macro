# One document read from the primary, to confirm a cached document is gone
# before it is deleted from the cache. Null when the document is in the Trash
# or the viewer can no longer read it; a readable document's name fields are
# written back. Only the fields local name search reads, so the read skips the
# property and notification edges.
query DocumentReconcileEntity($input: SoupEntityInput!) {
	user {
		id
		soupEntity(input: $input) {
			__typename
			id
			... on GraphqlSoupDocument {
				...GraphqlDocumentQuickAccessName
			}
		}
	}
}
