# Databases are not Soup entities: ask only for the outcome. They have no Soup
# record for an effect to patch.
fragment DatabaseEntityMutationResultFields on GraphqlEntityMutationResult {
  __typename
  ... on GraphqlMutationError {
    errorCode
    message
  }
}

mutation RenameDatabase($id: ID!, $displayName: String!) {
  renameEntities(
    inputs: [{ entity: { type: DATABASE, id: $id }, displayName: $displayName }]
  ) {
    results {
      ...DatabaseEntityMutationResultFields
    }
  }
}

mutation TrashDatabase($id: ID!) {
  trashEntities(entities: [{ type: DATABASE, id: $id }]) {
    results {
      ...DatabaseEntityMutationResultFields
    }
  }
}
