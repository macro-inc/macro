fragment FavoriteFields on GraphqlFavorite {
  __typename
  id
  entityType
  entityId
  sortOrder
  createdAt
  fileType
  documentSubType
  channelType
  channelId
}

query Favorites($filter: FavoritesFilterInput) {
  user {
    id
    favorites(filter: $filter) {
      ...FavoriteFields
    }
  }
}

# Presence only: bounded witnesses are not inputs to bulk notification reads.
# favoritesOnly restricts the Soup page before pagination, not after it.
query FavoriteUnreadPresence($input: SoupInput!) {
  user {
    id
    soup(input: $input) {
      items {
        __typename
        id
        unreadNotifications: notifications(filter: { states: [UNSEEN] }, limit: 1) {
          id
          state
        }
      }
      nextCursor
    }
  }
}

mutation SetFavorite($entity: EntityRefInput!, $favorite: Boolean!) {
  setFavorite(entity: $entity, favorite: $favorite) {
    __typename
    result {
      __typename
      ... on GraphqlMutationSuccess {
        effects {
          __typename
          ... on SoupUpdated {
            item {
              __typename
              id
              isFavorited
            }
          }
        }
      }
      ... on GraphqlMutationError {
        errorCode
        message
      }
    }
    favorite {
      ...FavoriteFields
    }
  }
}

mutation ReorderFavorites($input: ReorderFavoritesInput!) {
  reorderFavorites(input: $input) {
    __typename
    id
    entityType
    entityId
    sortOrder
  }
}
