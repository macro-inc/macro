query SoupNotifications($input: SoupInput!) {
	user {
		id
		soup(input: $input) {
			items {
				...SoupNotificationsEntityFields
			}
			nextCursor
		}
	}
}

fragment SoupNotificationsEntityFields on GraphqlSoupEntity {
	__typename
	id
	notifications {
		...SoupNotificationFields
	}
}

# One entity's complete unread edge, for marking the messages on screen read.
# Read notifications are left out, as on an open channel: the unfiltered edge
# keeps one seen row per notified message.
query SoupUnseenNotifications($input: SoupInput!) {
	user {
		id
		soup(input: $input) {
			items {
				__typename
				id
				notifications(filter: { states: [UNSEEN] }) {
					...SoupNotificationFields
				}
			}
			nextCursor
		}
	}
}
