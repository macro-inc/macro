subscription NotificationUpdates {
	notificationUpdates {
		__typename
		... on GraphqlNotification {
			id
			eventType
			entityType
			notificationEntityId: entityId
			sent
			done
			seen
			createdAt
			viewedAt
			updatedAt
			senderId
			metadata {
				...SoupNotificationMetadataFields
			}
		}
		... on GraphqlCacheDeletion {
			graphqlTypeName
			entityId
		}
	}
}
