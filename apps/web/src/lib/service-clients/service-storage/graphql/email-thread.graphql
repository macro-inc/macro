query EmailThreadPage($threadId: ID!, $offset: Int!, $limit: Int!) {
	user {
		id
		emailThread(input: { threadId: $threadId }) {
			...EmailThreadPageFields
		}
	}
}

fragment EmailThreadPageFields on GraphqlSoupEmailThread {
	...SoupItemFields
	__typename
	id
	providerId
	linkId
	inboxVisible
	isRead
	projectId
	latestInboundMessageTs
	createdAt
	updatedAt
	viewerPermission {
		__typename
		... on GraphqlAccessLevelPermission {
			accessLevel
		}
	}
	labels {
		__typename
		id
		linkId
		providerLabelId
		name
		createdAt
		messageListVisibility
		labelListVisibility
		type
	}
	messages(offset: $offset, limit: $limit) {
		...EmailThreadMessageFields
	}
}

fragment EmailThreadMessageFields on GraphqlSoupEmailMessage {
  draftGeneration
  operationStatus { state revision remoteVersion issue }
	__typename
	id
	providerId
	threadId
	replyingToId
	linkId
	subject
	snippet
	internalDateTs
	sentAt
	isRead
	isStarred
	isSent
	isDraft
	hasAttachments
	scheduledSendTime
	scheduledSendStatus
	from {
		email
		name
		photoUrl
	}
	to {
		email
		name
		photoUrl
	}
	cc {
		email
		name
		photoUrl
	}
	bcc {
		email
		name
		photoUrl
	}
	labels {
		providerLabelId
		name
	}
	bodyText
	bodyHtmlSanitized
	bodyMacro
	calendarInvitations
	bodyReplyless
	attachments {
		__typename
		id
		providerId
		filename
		mimeType
		sizeBytes
		sfsId
		contentId
		referenceUrl
	}
	attachmentsDraft {
		__typename
		id
		draftId
		fileName
		contentType
		sha
		size
		s3Key
		uploadPending
		contentId
		isInline
	}
	attachmentsForwarded {
		__typename
		attachmentId
		draftId
		providerAttachmentId
		messageProviderId
		filename
		mimeType
		sizeBytes
	}
	createdAt
	updatedAt
}

# Explicit identity read follows durable redirects without requiring a cached page.
fragment EmailThreadIdentityFields on GraphqlSoupEmailThread {
    id
    cacheProjection @cacheOnly
}

# Compact cached Quick Access rows: no snippets or message bodies.
fragment EmailQuickAccessFields on GraphqlSoupEmailThread {
    __typename
    id
    name
    ownerId
    createdAt
    updatedAt
    viewedAt
    senderName
    senderEmail
    senders { name email }
    isRead
    isDraft
    isImportant
    inboxVisible
    linkId
}
