fragment SoupPatchFields on SoupPatch {
	__typename
	... on SoupUpdated {
		item {
			...SoupItemFields
		}
	}
	... on GraphqlCacheDeletion {
		graphqlTypeName
		entityId
	}
}

subscription SoupUpdates {
	soupUpdates {
		...SoupPatchFields
	}
}

# Only written to the cache. The transport still uses SoupUpdates.
subscription SoupChannelListCacheWrite {
	soupUpdates {
		...SoupPatchFields
		... on SoupUpdated {
			item {
				... on GraphqlSoupChannel {
					...ChannelListUnreadFields
				}
			}
		}
	}
}
