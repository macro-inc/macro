# The aliased selection is unread evidence, never a complete list for bulk reads.
query ChannelListSoup($input: SoupInput!) {
	user {
		id
		emailLinks @cacheOnly { id emailAddress photoUrl }
		soup(input: $input) {
			items { ...ChannelListItemFields }
			nextCursor
		}
	}
}

fragment ChannelListItemFields on GraphqlSoupEntity {
	...SoupItemPreviewFields
	... on GraphqlSoupChannel {
		unreadNotifications: notifications(
			filter: {
				states: [UNSEEN]
				topLevelMessagesOnly: true
			}
			limit: 1
		) {
			id
			state
			createdAt
		}
		# Counts unread mentions, threads included; the row shows 9+ past nine.
		unreadMentions: notifications(
			filter: {
				states: [UNSEEN]
				eventTypes: ["channel_mention"]
			}
			limit: 10
		) {
			id
			state
		}
	}
}

# Retained for decoding legacy notification projections, not used by the bounded list.
fragment ChannelListNotificationFields on GraphqlNotification {
	...SoupNotificationStateFields
	metadata { ...SoupNotificationNavigationMetadataFields }
}
