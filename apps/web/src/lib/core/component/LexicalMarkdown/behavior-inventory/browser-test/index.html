<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor behavior regression fixture</title>
    <style>
      body { font: 16px system-ui; margin: 24px; }
      [role="textbox"] { border: 1px solid #777; min-height: 40px; padding: 12px; margin-block: 16px; }
      button { min-height: 44px; margin: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div id="title" role="textbox" aria-label="Title" aria-multiline="false"></div>
      <div id="body" role="textbox" aria-label="Body" aria-multiline="true"></div>
      <button id="readonly">Read only</button>
      <button id="editable">Editable</button>
      <button id="save">Save state</button>
      <button id="reopen">Reopen saved state</button>
      <output id="saved" aria-label="Saved state"></output>
    </main>
    <script type="module" src="./fixture.ts"></script>
  </body>
</html>
