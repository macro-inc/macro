<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round">
  <style>
    .calendar-shadow { animation: calendar-fade .5s ease-out both }
    .calendar-tile { animation: calendar-drop .55s cubic-bezier(.25,.8,.4,1) both }
    .calendar-lens { animation: calendar-drop .55s .13s cubic-bezier(.25,.8,.4,1) both }
    @keyframes calendar-drop { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes calendar-fade { from { opacity: 0 } to { opacity: .5 } }
    @media (prefers-reduced-motion: reduce) { .calendar-shadow, .calendar-tile, .calendar-lens { animation: none } }
  </style>
  <path d="M5 30 32 44 59 30 32 16Z" opacity=".12" transform="translate(0 3)"/>
  <path class="calendar-shadow" d="M5 30 32 44 59 30 32 16Z" stroke-dasharray="2 2"/>
  <g class="calendar-tile">
    <path d="M11 20 32 9 53 20 53 26 32 37 11 26Z" fill="var(--color-surface)"/>
    <path d="M11 20 32 31 53 20 32 9Z" fill="var(--color-surface)"/>
    <path d="M11 20 32 31 32 37 11 26Z" fill="currentColor" fill-opacity=".045"/>
    <path d="M32 31 53 20 53 26 32 37Z" fill="currentColor" fill-opacity=".07"/>
    <path d="m18 20 14 7 14-7-14-7Z" stroke-opacity=".35"/>
    <path d="m22 18 14 7m-11-9 14 7m-14 7 14-7" stroke-opacity=".2"/>
    <circle cx="28" cy="21" r="1.3" fill="currentColor" fill-opacity=".45" stroke="none"/>
    <circle cx="35" cy="20" r="1.3" fill="currentColor" fill-opacity=".45" stroke="none"/>
    <path d="m18 16 14 7 14-7" stroke-opacity=".4"/>
  </g>
  <g class="calendar-lens">
    <circle cx="46" cy="10" r="5.5" fill="var(--color-surface)"/>
    <circle cx="46" cy="10" r="3.6" stroke-opacity=".6"/>
    <path d="m50.1 14.1 5 5" stroke-width="1.5"/>
  </g>
</svg>
