<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="background: transparent">
  <style>
    .macro-grid-pixel-shape { fill: currentColor; pointer-events: none; }
    /* Cell periods and phases share a 200ms cadence while keeping varied flicker. */
    .macro-grid-pixel {
      animation: macro-grid-flick 0.8s step-end infinite;
      animation-play-state: var(--animation-play-state, running);
    }
    @keyframes macro-grid-flick {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .macro-grid-pixel { animation: none; }
    }
  </style>

  <defs>
    <rect id="pixel" width="10" height="10" class="macro-grid-pixel-shape" rx="7.5" ry="7.5" />
  </defs>

  <!-- Row 0 -->
  <use href="#pixel" x="0" y="0" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.4s"/>
  <use href="#pixel" x="11" y="0" class="macro-grid-pixel" style="animation-duration: 1.6s; animation-delay: 0.0s"/>
  <use href="#pixel" x="22" y="0" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <!-- Row 1 -->
  <use href="#pixel" x="0" y="11" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.4s"/>
  <use href="#pixel" x="11" y="11" class="macro-grid-pixel" style="animation-duration: 1.6s; animation-delay: 0.4s"/>
  <use href="#pixel" x="22" y="11" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
  <!-- Row 2 -->
  <use href="#pixel" x="0" y="22" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.4s"/>
  <use href="#pixel" x="11" y="22" class="macro-grid-pixel" style="animation-duration: 1.6s; animation-delay: 0.0s"/>
  <use href="#pixel" x="22" y="22" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
</svg>
