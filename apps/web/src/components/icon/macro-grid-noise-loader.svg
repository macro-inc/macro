<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="background: transparent">
  <style>
    .macro-grid-pixel-shape { fill: currentColor; pointer-events: none; }
    /* Cell periods and phases share a 200ms cadence while keeping varied flicker. */
    .macro-grid-pixel {
      animation: macro-grid-flick 0.8s step-end infinite;
      animation-play-state: var(--animation-play-state, running);
    }
    @keyframes macro-grid-flick {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .macro-grid-pixel { animation: none; }
    }
  </style>

  <defs>
    <rect id="pixel" width="3.6" height="3.6" class="macro-grid-pixel-shape" rx="5" ry="5" />
  </defs>

  <!-- Row 0 -->
  <use href="#pixel" x="0.2"  y="0.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="4.2"  y="0.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="8.2"  y="0.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="12.2" y="0.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="16.2" y="0.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="20.2" y="0.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="0.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.4s"/>
  <use href="#pixel" x="28.2" y="0.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>

  <!-- Row 1 -->
  <use href="#pixel" x="0.2"  y="4.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="4.2"  y="4.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="8.2"  y="4.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="12.2" y="4.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
  <use href="#pixel" x="16.2" y="4.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="20.2" y="4.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="4.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="28.2" y="4.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>

  <!-- Row 2 -->
  <use href="#pixel" x="0.2"  y="8.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="4.2"  y="8.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="8.2"  y="8.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="12.2" y="8.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.4s"/>
  <use href="#pixel" x="16.2" y="8.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="20.2" y="8.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="8.2"  class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="28.2" y="8.2"  class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>

  <!-- Row 3 -->
  <use href="#pixel" x="0.2"  y="12.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="4.2"  y="12.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="8.2"  y="12.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="12.2" y="12.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="16.2" y="12.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="20.2" y="12.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="12.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.4s"/>
  <use href="#pixel" x="28.2" y="12.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>

  <!-- Row 4 -->
  <use href="#pixel" x="0.2"  y="16.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="4.2"  y="16.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="8.2"  y="16.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="12.2" y="16.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
  <use href="#pixel" x="16.2" y="16.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="20.2" y="16.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="16.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="28.2" y="16.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>

  <!-- Row 5 -->
  <use href="#pixel" x="0.2"  y="20.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="4.2"  y="20.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
  <use href="#pixel" x="8.2"  y="20.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="12.2" y="20.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
  <use href="#pixel" x="16.2" y="20.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="20.2" y="20.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="20.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="28.2" y="20.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>

  <!-- Row 6 -->
  <use href="#pixel" x="0.2"  y="24.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.4s"/>
  <use href="#pixel" x="4.2"  y="24.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="8.2"  y="24.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="12.2" y="24.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="16.2" y="24.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="20.2" y="24.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="24.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="28.2" y="24.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>

  <!-- Row 7 -->
  <use href="#pixel" x="0.2"  y="28.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="4.2"  y="28.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.0s"/>
  <use href="#pixel" x="8.2"  y="28.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="12.2" y="28.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="16.2" y="28.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.0s"/>
  <use href="#pixel" x="20.2" y="28.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
  <use href="#pixel" x="24.2" y="28.2" class="macro-grid-pixel" style="animation-duration: 0.8s; animation-delay: 0.2s"/>
  <use href="#pixel" x="28.2" y="28.2" class="macro-grid-pixel" style="animation-duration: 1.2s; animation-delay: 0.2s"/>
</svg>
