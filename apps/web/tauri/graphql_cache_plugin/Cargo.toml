[package]
name = "graphql_cache_plugin"
version = "0.1.0"
edition.workspace = true

[dependencies]
cache-core = { path = "../../../../crates/client/cache-core" }
cache-turso = { path = "../../../../crates/client/cache-turso" }
predicate-index = { path = "../../../../crates/predicate_index" }
soup-filter-cache-adapter = { path = "../../../../crates/soup_filter_cache_adapter" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tauri = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
apollo-compiler = "1.32"
pollster = { workspace = true }
tempfile = "3"
soup-filter-projection = { path = "../../../../crates/soup_filter_projection", default-features = false }
apollo-parser = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "graphql_queries"
harness = false
