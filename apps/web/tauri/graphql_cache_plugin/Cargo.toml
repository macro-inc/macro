[package]
name = "graphql_cache_plugin"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait = "0.1"
cache-core = { path = "../../../../crates/client/cache-core" }
cache-turso = { path = "../../../../crates/client/cache-turso" }
flate2 = "1"
predicate-index = { path = "../../../../crates/predicate_index" }
soup-filter-cache-adapter = { path = "../../../../crates/soup_filter_cache_adapter" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
pollster = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tempfile = "3"
soup-filter-projection = { path = "../../../../crates/soup_filter_projection", default-features = false }
