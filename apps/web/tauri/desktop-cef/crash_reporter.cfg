# Chromium's crash reporter (Crashpad), bundled as Contents/Resources/crash_reporter.cfg.
# With no ServerURL, dumps stay on this Mac. The app reads a signature from each
# on its next start and deletes the dump: see ../src-tauri/README.md#native-crash-reports.
[Config]
ProductName=Macro
# Keep the macOS crash dialog and DiagnosticReports log for the app's own process.
BrowserCrashForwardingEnabled=true
MaxDatabaseSizeInMb=20
MaxDatabaseAgeInDays=7
