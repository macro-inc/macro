[workspace]
members = [
  "callkit_plugin",
  "edit_menu_plugin",
  "graphql_cache_plugin",
  "input_accessory_plugin",
  "logger",
  "macro_bundle_updater_plugin",
  "navigation_plugin",
  "network_status_plugin",
  "pasteboard_plugin",
  "photo_library_plugin",
  "staged_upload_constants",
  "src-tauri",
]
package.edition = "2024"
resolver = "2"

# Run the latency-critical SQL VM like production while keeping the app and
# cache adapters debuggable. Turso's debug-only per-cell validation makes large
# read-only temporary sets orders of magnitude slower than release execution.
[profile.dev.package.turso_core]
opt-level = 3
debug-assertions = false

[workspace.dependencies]
pollster = "0.4"
reqwest = "0.13"
rootcause = "0.12"
semver = "1"
serde = "1"
tauri = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
thiserror = "2"
tokio = "1"
tracing = "0.1"
url = "2.5.4"

[patch.crates-io]
# Backport tao#1257 plus nullable launch-option accessors; see the fork's FORK.md.
tao = { git = "https://github.com/macro-inc/tao", rev = "6cbc7628f91db2c5ce588719bf8ba6f2dd6fc1c8" }
tauri = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
tauri-runtime = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
tauri-runtime-wry = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
tauri-utils = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
tauri-macros = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
tauri-codegen = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
tauri-build = { git = "https://github.com/macro-inc/tauri", rev = "957785f5" }
