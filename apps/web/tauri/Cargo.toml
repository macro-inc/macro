[workspace]
members = [
  "callkit_plugin",
  "edit_menu_plugin",
  "graphql_cache_plugin",
  "input_accessory_plugin",
  "logger",
  "macro_bundle_updater_plugin",
  "navigation_plugin",
  "network_status_plugin",
  "pasteboard_plugin",
  "photo_library_plugin",
  "staged_upload_constants",
  "src-tauri",
]
package.edition = "2024"
resolver = "2"

[workspace.dependencies]
pollster = "0.4"
reqwest = "0.13"
rootcause = "0.12"
semver = "1"
serde = "1"
tauri = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
thiserror = "2"
tokio = "1"
tracing = "0.1"
url = "2.5.4"

[patch.crates-io]
tauri = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
tauri-runtime = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
tauri-runtime-wry = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
tauri-utils = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
tauri-macros = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
tauri-codegen = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
tauri-build = { git = "https://github.com/seanaye/tauri", rev = "957785f5" }
