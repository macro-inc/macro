    <!--
      Boot shell: a static likeness of the app frame (rail, view sidebar, Home's
      composer), painted with the HTML so the screen is never blank while the
      bundle downloads and starts. The inline script in <body> fills it in from
      the saved theme and layout; the app fades it out once its own frame mounts
      (see dismissBootShell). Geometry mirrors the sidebar rail, ViewSidebar, and
      the Agents new-chat layout.
    -->
    <style>
      #boot-shell {
        --bs-page: oklch(0.17 0 0);
        --bs-panel: oklch(0.1949 0 0);
        --bs-ink: oklch(1 0 0);
        --bs-muted: color-mix(in oklch, var(--bs-ink) 62%, transparent);
        --bs-bar: color-mix(in oklch, var(--bs-ink) 10%, transparent);
        --bs-shine: color-mix(in oklch, var(--bs-ink) 18%, transparent);
        --bs-edge: color-mix(in oklch, var(--bs-ink) 8%, transparent);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        overflow: hidden;
        background: var(--bs-panel);
        color: var(--bs-ink);
        font-family: -apple-system, BlinkMacSystemFont, "Inter Variable", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        transition: opacity 180ms ease-out;
        pointer-events: none;
      }
      @media (prefers-color-scheme: light) {
        #boot-shell {
          --bs-page: oklch(0.964 0 0);
          --bs-panel: oklch(1 0 0);
          --bs-ink: oklch(0.16 0 0);
        }
      }
      #boot-shell[data-leaving] {
        opacity: 0;
      }
      #boot-shell svg {
        flex: none;
        fill: currentColor;
      }
      .bs-bar {
        flex: none;
        height: 10px;
        border-radius: 999px;
        /* One fixed-position gradient shared by every bar, so the shimmer
           sweeps across the whole frame as a single band. */
        background: linear-gradient(
            100deg,
            transparent 40%,
            var(--bs-shine) 50%,
            transparent 60%
          )
          var(--bs-bar);
        background-size: 200vw 100%;
        background-attachment: fixed;
        animation: bs-shimmer 1.6s linear infinite;
      }
      @keyframes bs-shimmer {
        from {
          background-position: 100vw 0;
        }
        to {
          background-position: -100vw 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bs-bar {
          animation: none;
        }
      }
      /* Rail: SidebarRail's 56px column of 40px icon buttons. */
      .bs-rail {
        display: flex;
        width: 56px;
        flex: none;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 12px;
        border-right: 1px solid var(--bs-edge);
      }
      .bs-btn {
        display: flex;
        width: 40px;
        height: 40px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        color: var(--bs-muted);
      }
      .bs-btn svg {
        width: 20px;
        height: 20px;
      }
      .bs-btn[data-active] {
        background: color-mix(in oklch, var(--bs-ink) 7%, transparent);
        color: var(--bs-ink);
      }
      .bs-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 16px;
      }
      /* View sidebar: ViewSidebar's 256px aside. */
      .bs-aside {
        display: flex;
        width: 256px;
        flex: none;
        flex-direction: column;
        border-right: 1px solid var(--bs-edge);
      }
      .bs-head {
        display: flex;
        height: 48px;
        flex: none;
        align-items: center;
        gap: 6px;
        padding: 0 12px 0 16px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .bs-head svg {
        width: 16px;
        height: 16px;
        color: var(--bs-muted);
      }
      .bs-head > :last-child {
        margin-left: auto;
      }
      .bs-row {
        display: flex;
        height: 32px;
        flex: none;
        align-items: center;
        gap: 8px;
        margin: 0 8px 2px;
        padding: 0 8px;
        font-size: 14px;
      }
      .bs-row svg {
        width: 16px;
        height: 16px;
        margin: 0 2px;
        color: var(--bs-muted);
      }
      .bs-ico {
        width: 16px;
        height: 16px;
        margin: 0 2px;
        border-radius: 4px;
      }
      .bs-row > .bs-time {
        width: 28px;
        height: 8px;
        margin-left: auto;
      }
      .bs-label {
        display: flex;
        height: 28px;
        align-items: center;
        margin: 14px 8px 2px;
        padding: 0 8px;
      }
      .bs-label > .bs-bar {
        width: 76px;
        height: 8px;
      }
      .bs-main {
        position: relative;
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }
      /* Home's composer: the Agents new-chat grid, under the 48px top bar. */
      .bs-newchat {
        display: grid;
        flex: 1;
        grid-template-rows: max(0px, calc(40% - 60px)) auto 1fr;
        justify-items: center;
        padding: 72px 24px 64px;
      }
      /* Without the Agents flag, Home centers a smaller greeting (HomeChatStart). */
      .bs-newchat[data-legacy] {
        grid-template-rows: 1fr auto 1fr;
        padding: 0 24px 64px;
      }
      .bs-newchat[data-legacy] .bs-col {
        display: contents;
      }
      .bs-newchat[data-legacy] .bs-composer {
        max-width: 720px;
        grid-row: 2;
      }
      .bs-newchat[data-legacy] .bs-greeting {
        align-self: end;
        grid-row: 1;
        margin-bottom: 24px;
        font-size: 24px;
        font-weight: 400;
        letter-spacing: normal;
        line-height: 42px;
      }
      .bs-col {
        display: flex;
        width: 100%;
        max-width: 720px;
        grid-row: 2;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .bs-greeting {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.2;
      }
      .bs-composer {
        display: flex;
        width: 100%;
        height: 48px;
        align-items: center;
        gap: 12px;
        padding: 0 8px 0 18px;
        border: 1px solid var(--bs-edge);
        border-radius: 999px;
        background: color-mix(in oklch, var(--bs-ink) 3%, var(--bs-panel));
        color: var(--bs-muted);
      }
      .bs-composer svg {
        width: 18px;
        height: 18px;
      }
      .bs-composer > .bs-bar {
        height: 8px;
      }
      .bs-send {
        display: flex;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: color-mix(in oklch, var(--bs-ink) 8%, transparent);
      }
      .bs-send svg {
        width: 16px;
        height: 16px;
      }
      /* Any other view: a header and content lines. */
      .bs-page {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px 32px;
      }
      .bs-page > .bs-bar:first-child {
        width: 160px;
        height: 12px;
        margin-bottom: 18px;
      }
      .bs-mark {
        width: 44px;
        height: 44px;
        margin: auto;
        color: color-mix(in oklch, var(--bs-ink) 18%, transparent);
      }
      /* Narrow windows overlay the view sidebar, so it starts hidden. */
      @media (max-width: 800px) {
        .bs-aside {
          display: none;
        }
      }
      /* Touch devices: no rail; a full-width list and the floating dock. */
      .bs-dock {
        display: none;
      }
      @media (pointer: coarse) {
        #boot-shell {
          background: var(--bs-page);
          padding: env(safe-area-inset-top) env(safe-area-inset-right) 0
            env(safe-area-inset-left);
        }
        .bs-rail,
        .bs-newchat,
        .bs-head,
        .bs-head + .bs-row {
          display: none;
        }
        .bs-aside {
          display: flex;
          width: auto;
          flex: 1;
          padding-top: 48px;
          border: 0;
        }
        .bs-main {
          display: none;
        }
        .bs-row {
          height: 60px;
          gap: 12px;
          margin: 0 4px;
        }
        .bs-ico {
          width: 32px;
          height: 32px;
          margin: 0;
          border-radius: 999px;
        }
        .bs-dock {
          position: absolute;
          bottom: calc(env(safe-area-inset-bottom) + 12px);
          left: 50%;
          display: flex;
          gap: 20px;
          padding: 12px 22px;
          border: 1px solid var(--bs-edge);
          border-radius: 999px;
          background: var(--bs-panel);
          transform: translateX(-50%);
        }
        .bs-dock > .bs-bar {
          width: 24px;
          height: 24px;
        }
      }
    </style>
  </head>

  <body>

    <script>
      // Draw the boot shell for this route in the saved theme and layout.

      try {
        const shell = document.getElementById("boot-shell");

          try {
            return JSON.parse(localStorage.getItem(key) || "null");
          } catch {
            return null;

        if (theme && theme.color) {
          document.body.style.backgroundColor = theme.color;
          shell.style.setProperty("--bs-page", theme.color);

          // Saves from older builds have no ink; infer it from page lightness.
          const lightness = parseFloat(/oklch\(\s*([\d.]+)/.exec(theme.color)?.[1]);
          const ink = theme.ink || (lightness > 0.6 ? "oklch(0.16 0 0)" : lightness >= 0 ? "oklch(1 0 0)" : "");
          if (ink) shell.style.setProperty("--bs-ink", ink);
