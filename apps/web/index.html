<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <script id="first-paint-appearance">
      (function () {
        var FALLBACK = {
          light: "oklch(0.964 0 59deg)",
          dark: "oklch(0.14 0 59deg)",
        };
        function read(key) {
          try {
            var raw = localStorage.getItem(key);
            if (raw === null) return null;
            try {
              return JSON.parse(raw);
            } catch {
              return raw;
            }
          } catch {
            return null;
          }
        }

        var storedMode = read("macro-theme-mode");
        var mode =
          storedMode === "light" ||
          storedMode === "dark" ||
          storedMode === "system"
            ? storedMode
            : "system";
        var scheme =
          mode === "light" || mode === "dark"
            ? mode
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        var cached = read("html-color-theme");
        var cachedSurface =
          cached &&
          typeof cached === "object" &&
          !Array.isArray(cached) &&
          typeof cached[scheme] === "string" &&
          cached[scheme].trim()
            ? cached[scheme]
            : null;
        var surface = cachedSurface || FALLBACK[scheme];

        document.documentElement.style.colorScheme = scheme;
        document.documentElement.style.backgroundColor = surface;
        if (document.body) document.body.style.backgroundColor = surface;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", surface);
      })();
    </script>
    <meta name="description" content="Macro AI Workspace" />
    <meta name="macro-bundle-build" content="__MACRO_BUNDLE_BUILD__" />
    <link
      rel="shortcut icon"
      href="%ASSETS_PATH%/macro-favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%ASSETS_PATH%/macro-favicon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%ASSETS_PATH%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="h-[calc(var(--dvh,1dvh)*100)]"></div>
    <div id="modal" class="z-modal"></div>
    <!--
      Entrypoint
    -->
    <script type="module" src="/src/index.tsx"></script>
    <script>
      window.__START_TIME__ = performance.now();
    </script>
  </body>
</html>
