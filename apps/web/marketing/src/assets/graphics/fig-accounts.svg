    <ellipse id="front-hole-ring" class="corner" cx="715" cy="605.7" rx="23.1" ry="15"/>
    <path id="front-hole-rim" class="corner" d="M715,620.7c-12.8,0-21.7-7.6-20.6-10.3,3.5-8.3,11.1-12.8,20.7-12.8s17.1,4.6,20.7,12.8-8,10.3-20.8,10.3Z"/>
