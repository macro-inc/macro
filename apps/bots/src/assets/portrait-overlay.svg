    <path d="M30 39 Q44 37.5 58 39 M32 42.5 Q44 41.2 56 42.5" stroke="#1a110c" stroke-width="0.95" opacity="0.58"/>
    <path d="M31 39.8 Q44 38.4 57 39.8" stroke="#f0d4b8" stroke-width="0.55" opacity="0.24" style="mix-blend-mode:soft-light"/>
    <path d="M35.5 72 Q32.5 79 33.5 86 M52.5 72 Q55.5 79 54.5 86" stroke="#180e09" stroke-width="1.2" opacity="0.62"/>
