<svg viewBox="0 0 96 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="ov-flush-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d45c52" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#d45c52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ov-flush-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d45c52" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#d45c52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ov-jaw-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="ov-beard-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2017" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#2e2017" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#2e2017" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="ov-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
    <filter id="ov-micro" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>
  <ellipse id="ov-under-wash" cx="46" cy="64" rx="28" ry="34" fill="#d88a4a" opacity="0" style="mix-blend-mode:soft-light"/>
