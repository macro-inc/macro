    <circle cx="46" cy="68" r="0.55"/><circle cx="52" cy="68" r="0.6"/><circle cx="57" cy="69" r="0.6"/>
    <circle cx="64" cy="68" r="0.6"/><circle cx="36" cy="64" r="0.5"/><circle cx="54" cy="64" r="0.5"/>
  </g>
  <g id="ov-freckles-dense" fill="#542b16" opacity="0">
