    <circle cx="42" cy="69" r="0.55"/><circle cx="48" cy="70" r="0.55"/><circle cx="54" cy="71" r="0.6"/>
    <circle cx="61" cy="71" r="0.6"/><circle cx="66" cy="66" r="0.6"/><circle cx="45" cy="64" r="0.55"/>
