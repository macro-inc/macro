    <path id="ov-hair-style" d="M19 42 C17 20 30 10 48 10 C67 10 78 21 76 42 C72 30 61 24 48 24 C34 24 23 30 19 42 Z" fill="#2e2017" opacity="0"/>
  </g>
  <g id="ov-beard" filter="url(#ov-soft)" opacity="0.14">
    <path id="ov-beard-path" d="M25 76 C26 91 34 100 46 101 C58 100 66 91 67 76 C63 85 56 90 46 90 C36 90 29 85 25 76 Z M35 80 Q44 77 53 80 Q44 82.5 35 80 Z" fill="url(#ov-beard-grad)"/>
  </g>
  <g id="ov-outfit" filter="url(#ov-micro)">
    <path id="ov-outfit-body" d="M2 120 L8 109 Q26 105 34 105 Q46 114 60 105 Q70 105 88 109 L94 120 Z" fill="#2a2c30" opacity="0.82"/>
    <path id="ov-outfit-trim" d="M33 105 Q46 115 61 105" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
