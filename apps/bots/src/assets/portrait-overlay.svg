    <ellipse cx="62" cy="69" rx="10" ry="7.5" fill="url(#ov-flush-r)"/>
  </g>
  <!-- Independent Gender facial structure layer -->
  <g id="ov-gender-masc" opacity="0" filter="url(#ov-soft)">
