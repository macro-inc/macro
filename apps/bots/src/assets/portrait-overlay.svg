      <ellipse id="ov-iris-r" cx="56.2" cy="57.2" rx="3.8" ry="2.3" fill="#665432" style="mix-blend-mode:color" opacity="0.64" filter="url(#ov-micro)"/>
      <circle id="ov-glint-r" cx="55.1" cy="56.4" r="0.9" fill="#ffffff" opacity="0.44"/>
    </g>
  </g>
