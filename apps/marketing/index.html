    <script data-bridge-guard>
// Instagram and Facebook's Android browser reports "Java object is gone"
// when its injected navigation logger calls a collected Java bridge.
(function () {
  if (window.__TAURI_INTERNALS__) return;
  var mark = '__macroAndroidBridgeGuard';
  if (window[mark]) return;
  window[mark] = true;
  var bridgeName = 'navigationPerformanceLoggerJavascriptInterface';
  var methods = [
    'postMessage',
    'postEvent',
    'enableDidUserTypeOnKeyboardLogging',
    'enableButtonsClickedMetaDataLogging',
  ];
  function isGone(error) {
    var message = error && error.message ? error.message : String(error);
    return message.indexOf('Java object is gone') !== -1;
  }
  function wrapMethod(bridge, name, original) {
    try {
      bridge[name] = function () {
        try {
          return original.apply(bridge, arguments);
        } catch (error) {
          if (isGone(error)) return;
          throw error;
        }
      };
    } catch (error) {
      return;
    }
  }
  function wrapBridge() {
    var bridge;
    try {
      bridge = window[bridgeName];
    } catch (error) {
      return;
    }
    if (!bridge) return;
    try {
      if (bridge[mark]) return;
    } catch (error) {
      return;
    }
    for (var i = 0; i < methods.length; i++) {
      var name = methods[i];
      var original;
      try {
        original = bridge[name];
      } catch (error) {
        continue;
      }
      if (typeof original !== 'function') continue;
      wrapMethod(bridge, name, original);
    }
    try {
      bridge[mark] = true;
    } catch (error) {
      return;
    }
  }
  wrapBridge();
  window.addEventListener('load', wrapBridge, { once: true });
  window.addEventListener(
    'error',
    function (event) {
      if (!event.message || event.message.indexOf('Java object is gone') === -1)
        return;
      event.preventDefault();
      event.stopImmediatePropagation();
    },
    true
  );
})();
    </script>

    <script>
      // First-paint palette for every public website route.
      // Mirrors src/features/setup/sitePalette.ts.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        var cream = theme === 'cream' || (theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        if (!cream) return;
        var root = document.documentElement;
        root.dataset.palette = 'cream';
        root.dataset.themeLight = 'true';
        document.querySelector('meta[name="theme-color"]').content = '#f5f1e8';
      })();
    </script>
