<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="270" fill="none"/>
  <defs>
    <linearGradient id="grl-cover-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(from var(--a0) calc(l + 0.06) calc(c * 0.9) h)"/>
      <stop offset="52%" stop-color="oklch(from var(--a0) calc(l + 0.01) calc(c * 0.9) h)"/>
      <stop offset="100%" stop-color="oklch(from var(--a0) calc(l - 0.04) calc(c * 0.9) h)"/>
    </linearGradient>
  </defs>

  <!-- A queue of inbox operations -->
  <rect x="96" y="50" width="140" height="140" rx="32" fill="#121212" stroke="#2e2e2e"/>
  <g stroke="url(#grl-cover-sheen)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M140,96 h34 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-34 a4,4 0 0 1 -4,-4 v-14 a4,4 0 0 1 4,-4 Z"/>
    <path d="M152,126 h34 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-34 a4,4 0 0 1 -4,-4 v-14 a4,4 0 0 1 4,-4 Z"/>
    <path d="M136,100 l21,12 21,-12"/>
  </g>
  <text x="166" y="222" fill="#6f6f6f" font-size="14" text-anchor="middle">Queue</text>

  <path d="M254,120 H298 M290,113 l8,7 -8,7" stroke="#4a4a4a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A cost-based sliding-window limiter in front of the API -->
  <rect x="310" y="50" width="140" height="140" rx="32" fill="#121212" stroke="#2e2e2e"/>
  <g stroke="url(#grl-cover-sheen)" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="380" cy="120" r="30"/>
    <path d="M380,98 v22 l16,10"/>
  </g>
  <text x="380" y="222" fill="#6f6f6f" font-size="14" text-anchor="middle">Usage limiter</text>

  <path d="M468,120 H512 M504,113 l8,7 -8,7" stroke="#4a4a4a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 429s become retries, not failures -->
  <rect x="524" y="50" width="140" height="140" rx="32" fill="#121212" stroke="#2e2e2e"/>
  <g stroke="url(#grl-cover-sheen)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M566,120 a28,28 0 0 1 46,-21"/>
    <path d="M622,120 a28,28 0 0 1 -46,21"/>
    <path d="M604,92 l10,6 -6,10"/>
    <path d="M584,148 l-10,-6 6,-10"/>
  </g>
  <text x="594" y="222" fill="#6f6f6f" font-size="14" text-anchor="middle">Auto-retry</text>
</svg>
