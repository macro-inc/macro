  <style>
    #fig-crates .line, #fig-crates .detail, #fig-crates .dash { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    #fig-crates .line { opacity: .5; stroke-width: .9px; }
    #fig-crates .detail { opacity: .5; stroke-width: .75px; }
    #fig-crates .dash { stroke-width: .9px; stroke-dasharray: 2.5 2.5; }
    #fig-crates .dot { fill: currentColor; opacity: .85; }
    #fig-crates .silhouette { fill: none; opacity: 1; stroke: currentColor; stroke-linejoin: round; stroke-width: .9px; vector-effect: non-scaling-stroke; }
    #fig-crates .face { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1)) 11%, var(--b0) 89%); }
    #fig-crates .shade { fill: color-mix(in srgb, currentColor 12%, var(--b0)); }
  </style>
