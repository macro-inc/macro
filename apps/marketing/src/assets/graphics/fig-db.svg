  </defs>
  <!-- Parts are grouped so each moveable object owns the shading that belongs to
       it: `crate-*` and `puck-*` carry their own shade fills, so they can be
       translated without leaving their shadow behind. The three drum rings share
       one shading path spanning the full body, so `#drum` only moves as a unit.
       Wires stay anchored — they read as motion through the dashed cadence
       (stroke-dashoffset), not by moving. Draw order is unchanged: the pucks and
       their shading come last so they mask the connector paths running under them. -->
