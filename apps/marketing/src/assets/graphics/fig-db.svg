<svg id="fig-db" xmlns="http://www.w3.org/2000/svg" viewBox="330 210 1010 1040">
  <style>
    #fig-db .silhouette, #fig-db .edge, #fig-db .guide, #fig-db .hidden-guide { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: .9px; vector-effect: non-scaling-stroke; }
    #fig-db .edge { opacity: .5; }
    #fig-db .hidden-guide { opacity: .5; }
    /* Solid face and shadow fills keep the stacked forms fully opaque. */
    #fig-db .face { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1)) 11%, var(--b0)); }
    #fig-db .shadow { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1)) 2%, var(--b0)); }
    #fig-db .pill { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1)) 11%, var(--b0)); stroke: currentColor; stroke-linejoin: round; stroke-width: .9px; vector-effect: non-scaling-stroke; }
    #fig-db .connector { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: .9px; vector-effect: non-scaling-stroke; }
    #fig-db .connector-dash { fill: none; stroke: currentColor; stroke-linejoin: round; stroke-width: .9px; vector-effect: non-scaling-stroke; }
    /* Each dash cadence follows its matching path in the original artwork. */
    #fig-db .dash-89 { stroke-dasharray: 2.97 2.97; }
    #fig-db .dash-103 { stroke-dasharray: 3.43 3.43; }
    #fig-db .dash-11 { stroke-dasharray: 3.67 3.67; }
    #fig-db .dash-116 { stroke-dasharray: 3.87 3.87; }
    #fig-db .dash-12 { stroke-dasharray: 4 4; }
    #fig-db .dash-122 { stroke-dasharray: 4.07 4.07; }
    #fig-db .dash-123 { stroke-dasharray: 4.1 4.1; }
    #fig-db .dash-13 { stroke-dasharray: 4.33 4.33; }
    #fig-db .dash-138 { stroke-dasharray: 4.6 4.6; }
  </style>
