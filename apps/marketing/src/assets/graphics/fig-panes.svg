  <style>
    #fig-panes .silhouette, #fig-panes .edge, #fig-panes .dash { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: .9px; vector-effect: non-scaling-stroke; }
    #fig-panes .edge { opacity: .5; }
    #fig-panes .dash { opacity: .5; stroke-dasharray: 2.5 2.5; }
    #fig-panes .face { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1)) 11%, var(--b0) 89%); }
    #fig-panes .shade { fill: color-mix(in srgb, currentColor 12%, var(--b0)); }
  </style>
