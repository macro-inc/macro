<?xml version="1.0" encoding="UTF-8"?>
<svg id="fig-speed" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="170 400 1300 830">
  <defs>
    <style>
      /* Strokes take currentColor; weight = stroke-width (constant on screen). */
      .line, .hidden, .guide {
        fill: none;
        stroke: currentColor;
        stroke-linejoin: round;
        stroke-width: 0.9px;
        vector-effect: non-scaling-stroke;
      }
      .hidden { opacity: .5; stroke-linecap: round; } /* occluded / far edges       */
      .guide  { stroke-linecap: round; }              /* trajectory / motion axis   */
      .dash   { stroke-dasharray: 2.5 2.5; }          /* dashed modifier            */
      /* Body fills (faint neutral): `.face-lit` = lit mass over the whole silhouette;
         `.face-shade` = darker, painted over the lit body but gradient-masked so it
         only shows on each form's underside — smooth cylindrical shading. Tune %s. */
      .face-lit, .face-shade { stroke: none; }
      .face-lit   { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1)) 11%, color-mix(in srgb, var(--b0) 85%, transparent)); }
      .face-shade { fill: color-mix(in srgb, color-mix(in srgb, currentColor 30%, var(--c1))  2%, color-mix(in srgb, var(--b0) 92%, transparent)); }
    </style>
    <!-- Underside-shading masks: black (no shade) at the top of each form, white
         (full shade) at the bottom, so the shade fades in toward the lower edge. -->
    <linearGradient id="grad-sh-casing" x1="0" y1="560" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="sh-casing" maskUnits="userSpaceOnUse" x="0" y="0" width="1544" height="1544"><rect width="1544" height="1544" fill="url(#grad-sh-casing)"/></mask>
    <linearGradient id="grad-sh-cone" x1="0" y1="610" x2="0" y2="965" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="sh-cone" maskUnits="userSpaceOnUse" x="0" y="0" width="1544" height="1544"><rect width="1544" height="1544" fill="url(#grad-sh-cone)"/></mask>
    <linearGradient id="grad-sh-tip" x1="0" y1="915" x2="0" y2="1135" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="sh-tip" maskUnits="userSpaceOnUse" x="0" y="0" width="1544" height="1544"><rect width="1544" height="1544" fill="url(#grad-sh-tip)"/></mask>
  </defs>


  <!-- Casing (cartridge case) -->
