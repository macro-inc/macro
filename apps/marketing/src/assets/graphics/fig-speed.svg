    <path id="casing-outline" class="line" d="M763.8,692.3c1.1-31.5-1.5-68.8-29.4-88.7-37.3-21.5-75.3-43.5-112.6-65-19.8-11.4-40.8-23.6-60.6-35-14.7-9.8-32.5-16.7-50.4-14.2-32.1,6.3-62.4,25.1-86.7,46.6-54,51.1-82.1,137.3-52.9,207.9,7.7,14,21.9,23.6,35.8,30.7,16.9,9.7,35.1,20.3,52,30,37.7,21.8,76.1,43.9,113.8,65.7,31,19.4,68,3.1,95.7-14.9"/>
    <path id="casing-rim" class="line" d="M453.3,514.2c-15-13.9-38.6-36.5-59.1-39.5-34.8-1.2-62.5,26.8-80.7,53.6-19.2,31.2-35.2,72.9-18.6,108.3,12.4,20.6,43.3,30.4,65.4,36.7"/>
