  <!-- Trajectory / motion axis the parts fly along -->
  <g id="axis">
    <line class="guide dash" x1="315.6" y1="524.7" x2="243.2" y2="482"/>
    <line class="guide dash" x1="682" y1="743" x2="605.9" y2="698.1"/>
    <line class="guide dash" x1="993.8" y1="929.7" x2="860.6" y2="851.1"/>
