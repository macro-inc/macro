    <path id="casing-base-a" class="hidden" d="M351.4,669.8c-25.6-14.8-25.3-63,.5-107.8,25.9-44.8,67.5-69.1,93.1-54.4"/>
    <path id="casing-base-b" class="hidden" d="M327.7,661.7c-26.9-15.5-26.7-66.4.6-113.6,27.2-47.2,71.2-72.8,98.1-57.3"/>
    <path id="casing-base-c" class="hidden" d="M361.8,655.4c-6-20.2-.8-50,15.5-78.2,16.3-28.2,39.5-47.6,59.9-52.6"/>
    <path id="casing-detail" class="hidden" d="M421.5,740.8l-41.6-24.4c-4.9-18.2-2.3-36.5-2.3-36.5l41.6,24.4s-2.8,11,2.3,36.5Z"/>
  </g>

