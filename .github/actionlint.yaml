# shellcheck findings kept on purpose, one file and check per entry. A new
# finding of another kind, or in another file, still fails.
paths:
  .github/workflows/android-play-publish.yml:
    ignore:
      # The GraphQL query passed to `gh api` is single-quoted so gh, not bash, binds $owner.
      - 'SC2016:'
  .github/workflows/android-release-drift.yml:
    ignore:
      # The GraphQL query passed to `gh api` is single-quoted so gh, not bash, binds $owner.
