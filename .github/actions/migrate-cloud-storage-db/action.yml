name: Migrate Cloud Storage Database
description: Run database migrations for cloud storage services

inputs:
  environment:
    description: 'Environment to run migrations for (dev, prod)'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with: # zizmor: ignore[artipacked] the calling deploy job may use the persisted token; dropping it needs that job audited
        sparse-checkout: |
          .github/
          crates/macro_db_client
    
    - name: Get database URL from Secrets Manager
      id: get-db-url
      shell: bash
      env:
        MIGRATION_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ "$MIGRATION_ENVIRONMENT" = "prod" ]; then
          SECRET_NAME="macro-db-prod"
        else
          SECRET_NAME="macro-db-dev"
        fi

        DATABASE_URL=$(aws secretsmanager get-secret-value \
          --secret-id "$SECRET_NAME" \
          --query SecretString \
          --output text)

        # Ensure SSL is used for remote connections
        if [[ "$DATABASE_URL" != *"sslmode="* ]]; then
          if [[ "$DATABASE_URL" == *"?"* ]]; then
            DATABASE_URL="${DATABASE_URL}&sslmode=require"
          else
            DATABASE_URL="${DATABASE_URL}?sslmode=require"
          fi
        fi

        echo "::add-mask::$DATABASE_URL"
        echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

    - name: Run database migrations
      shell: bash
      working-directory: crates/macro_db_client
      env:
        DATABASE_URL: ${{ steps.get-db-url.outputs.database_url }}
        MIGRATION_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "Running migrations for $MIGRATION_ENVIRONMENT environment..."
        if [ "$MIGRATION_ENVIRONMENT" = "dev" ]; then
          cargo sqlx migrate run --ignore-missing
        else
          cargo sqlx migrate run
        fi
