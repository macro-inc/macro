name: Provision search indices
description: Apply canonical mappings and verify aliases before deploying search consumers

inputs:
  environment:
    description: Target environment (dev or prod)
    required: true
  index:
    description: Canonical index alias to provision and verify
    required: true
  aws-access-key:
    description: AWS access key
    required: true
  aws-secret-key:
    description: AWS secret key
    required: true

runs:
  using: composite
  steps:
    # This action must run on db-migrator, which can reach the production VPC.
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
        sparse-checkout: |
          .github/
          infra/stacks/opensearch/helpers
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        aws-access-key-id: ${{ inputs.aws-access-key }}
        aws-secret-access-key: ${{ inputs.aws-secret-key }}
        aws-region: us-east-1
    - name: Install OpenSearch helper dependencies
      shell: bash
      working-directory: infra/stacks/opensearch/helpers
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Provision and verify search schema
      shell: bash
      working-directory: infra/stacks/opensearch/helpers
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        INDEX: ${{ inputs.index }}
        DRY_RUN: 'false'
      run: |
        set -euo pipefail
        case "$ENVIRONMENT" in
          dev|prod) ;;
          *) echo 'Unsupported search environment'; exit 1 ;;
        esac
        endpoint=$(aws opensearch describe-domain \
          --domain-name "macro-opensearch-$ENVIRONMENT" \
          --query 'DomainStatus.Endpoint || DomainStatus.Endpoints.vpc || DomainStatus.EndpointV2' \
          --output text)
        if [[ -z "$endpoint" || "$endpoint" == 'None' ]]; then
          echo 'OpenSearch domain has no endpoint'
          exit 1
        fi
        OPENSEARCH_PASSWORD=$(aws secretsmanager get-secret-value \
          --secret-id "macro-opensearch-password-$ENVIRONMENT" \
          --query SecretString --output text)
        echo "::add-mask::$OPENSEARCH_PASSWORD"
        export OPENSEARCH_PASSWORD
        export OPENSEARCH_URL="https://$endpoint"
        export OPENSEARCH_USERNAME=macrouser
        bun scripts/create_indices.ts
        bun scripts/verify_mappings.ts
        bun scripts/verify_aliases.ts
