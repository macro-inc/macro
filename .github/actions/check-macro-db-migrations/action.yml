name: Check Macro Database Migrations
description: Fail unless every migration in the checked-out commit is applied to the environment's database. Applies nothing.

inputs:
  environment:
    description: 'Environment whose database is checked (dev, prod)'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/
          crates/macro_db_client

    - name: Get database URL from Secrets Manager
      id: get-db-url
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        if [ "$ENVIRONMENT" = "prod" ]; then
          SECRET_NAME="macro-db-prod"
        else
          SECRET_NAME="macro-db-dev"
        fi

        DATABASE_URL=$(aws secretsmanager get-secret-value \
          --secret-id "$SECRET_NAME" \
          --query SecretString \
          --output text)

        # Ensure SSL is used for remote connections
        if [[ "$DATABASE_URL" != *"sslmode="* ]]; then
          if [[ "$DATABASE_URL" == *"?"* ]]; then
            DATABASE_URL="${DATABASE_URL}&sslmode=require"
          else
            DATABASE_URL="${DATABASE_URL}?sslmode=require"
          fi
        fi

        echo "::add-mask::$DATABASE_URL"
        echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"

    - name: Check that every migration is applied
      shell: bash
      working-directory: crates/macro_db_client
      env:
        DATABASE_URL: ${{ steps.get-db-url.outputs.database_url }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        "$GITHUB_ACTION_PATH/check-migrations-applied.sh"
