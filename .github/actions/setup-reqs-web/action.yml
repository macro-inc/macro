name: Setup Prereqs Web
description: Checkout and Setup Prerequisite Dependencies for web app
inputs:
  playwright:
    description: Install Playwright and cache
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell

    - name: Setup bunfig.toml
      shell: bash
      run: |
        echo "[run]" >> bunfig.toml
        echo "bun = true" >> bunfig.toml

    # The web PR checks keep the root node_modules on their cache volume
    # (NODE_MODULES_VOLUME_DIR in xtask_workflows), so there this only checks
    # the tree against bun.lock. Bun adds and updates packages but never removes
    # one the lockfile dropped, so a tree another lockfile installed is emptied
    # first: a package left over from another PR must not make imports resolve.
    # node_modules can be a mount point, so it is emptied rather than removed.
    - name: Install Dependencies
      shell: bash
      run: |
        set -euo pipefail
        key=$( { bun --version; cat bun.lock apps/web/patches/*; } | sha256sum | cut -d" " -f1)
        marker=node_modules/.macro-install-key
        if [ -d node_modules ] && [ "$(cat "$marker" 2>/dev/null)" != "$key" ]; then
          find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi
        rm -f "$marker"
        bun install --frozen-lockfile
        echo "$key" > "$marker"

    - name: Get Playwright version (for caching)
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: apps/web
      run: echo "PW_VERSION=$(bunx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV
    - name: Restore Playwright browsers
      if: inputs.playwright == 'true'
      id: pw-browsers
      uses: runs-on/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-browsers-${{ runner.os }}-${{ env.PW_VERSION }}
    - name: Install Playwright Browsers
      if: inputs.playwright == 'force' || (inputs.playwright == 'true' && steps.pw-browsers.outputs.cache-hit != 'true')
      shell: bash
      working-directory: apps/web
      run: bunx playwright install --with-deps chromium
    - name: Save Playwright browsers to cache
      if: inputs.playwright == 'force' || (inputs.playwright == 'true' && steps.pw-browsers.outputs.cache-hit != 'true')
      uses: runs-on/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-browsers-${{ runner.os }}-${{ env.PW_VERSION }}
