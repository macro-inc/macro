name: Setup Prereqs Web
description: Checkout and Setup Prerequisite Dependencies for web app
inputs:
  playwright:
    description: Install Playwright and cache
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell

    - name: Setup bunfig.toml
      shell: bash
      run: |
        echo "[run]" >> bunfig.toml
        echo "bun = true" >> bunfig.toml

    - name: Install Dependencies
      shell: bash
      env:
        # Bun fetches `github:` dependencies from this API. On the self-hosted forge
        # the runner points it at the forge, which does not have them.
        GITHUB_API_URL: https://api.github.com
      run: bun install --frozen-lockfile

    - name: Get Playwright version (for caching)
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: apps/web
      run: echo "PW_VERSION=$(bunx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV
    - name: Restore Playwright browsers
      if: inputs.playwright == 'true'
      id: pw-browsers
      uses: runs-on/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-browsers-${{ runner.os }}-${{ env.PW_VERSION }}
    - name: Install Playwright Browsers
      if: inputs.playwright == 'force' || (inputs.playwright == 'true' && steps.pw-browsers.outputs.cache-hit != 'true')
      shell: bash
      working-directory: apps/web
      run: bunx playwright install chromium
    # Separate from the browser, which may come from the cache: a clean job container
    # has neither. Its apt-get is the image's, and must not load the dev shell's libraries.
    - name: Install Playwright system dependencies
      if: inputs.playwright == 'force' || inputs.playwright == 'true'
      shell: bash
      working-directory: apps/web
      run: env -u LD_LIBRARY_PATH bunx playwright install-deps chromium
    - name: Save Playwright browsers to cache
      if: inputs.playwright == 'force' || (inputs.playwright == 'true' && steps.pw-browsers.outputs.cache-hit != 'true')
      uses: runs-on/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-browsers-${{ runner.os }}-${{ env.PW_VERSION }}
