name: infra code check
'on':
  workflow_call: {}
jobs:
  biome-check:
    name: Biome Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    timeout-minutes: 15
    steps:
    - name: Checkout Repo
      uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e
      with:
        fetch-depth: '0'
    - name: Mount /nix cache volume
