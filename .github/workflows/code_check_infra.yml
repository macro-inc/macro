# Source: tooling/xtask/crates/xtask_workflows/src/workflows/code_check_infra.rs
name: infra code check
on:
  workflow_call: {}
jobs:
  biome-check:
    name: Biome Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    timeout-minutes: 15
    steps:
      - name: Checkout Repo # zizmor: ignore[artipacked] bun and Pulumi tooling run from the checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: '0'
          filter: blob:none
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Prepare the blobless checkout
        run: |
          if git config extensions.partialclone >/dev/null; then git config --unset extensions.partialclone; fi
          git config diff.renames false
      - name: Mount /nix cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: nix
        continue-on-error: true
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell
      - name: Run Biome
        run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
        working-directory: infra
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
  check:
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    timeout-minutes: 15
    steps:
      - name: Checkout Repo # zizmor: ignore[artipacked] bun and Pulumi tooling run from the checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: nix
          path: /home/runner/.bun/install/cache
        continue-on-error: true
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell
      - name: install
        run: bun install --frozen-lockfile
        working-directory: infra
      - name: check
        run: bun run check
        working-directory: infra
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
