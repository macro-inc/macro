# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/code_check_infra.rs
name: infra code check
'on':
  workflow_call: {}
jobs:
  path-check:
    runs-on: namespace-profile-linux-small
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    timeout-minutes: 10
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'infra/**'
            - 'flake.nix'
            - 'flake.lock'
            - '.github/actions/setup-nix-dev-shell/**'
            - '.github/actions/teardown-nix/**'
            - '.github/workflows/code_check_infra.yml'
  biome-check:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Biome Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    timeout-minutes: 15
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: '0'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Run Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: infra
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  check:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    timeout-minutes: 15
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: /home/runner/.bun/install/cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: install
      run: bun install --frozen-lockfile
      working-directory: infra
    - name: check
      run: bun run check
      working-directory: infra
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  status-check:
    needs:
    - path-check
    - biome-check
    - check
    if: always()
    name: Infra Status Check
    runs-on: namespace-profile-linux-small
    timeout-minutes: 5
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "biome-check: ${{ needs.biome-check.result }}"
        echo "check: ${{ needs.check.result }}"

        # Only success and skipped are OK. A job that hits its timeout reports
        # cancelled, and passing on that would merge code whose checks never ran.
        for result in \
          "${{ needs.path-check.result }}" \
          "${{ needs.biome-check.result }}" \
          "${{ needs.check.result }}"; do
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "❌ One or more jobs failed or were cancelled"
            exit 1
          fi
        done

        echo "✅ All jobs passed or were skipped"
