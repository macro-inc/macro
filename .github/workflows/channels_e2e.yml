name: Channels end-to-end
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: limited
  CARGO_PROFILE_TEST_DEBUG: limited
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
'on':
  push:
    branches:
    - main
    paths:
    - services/**
    - crates/**
    - apps/web/**
    - packages/**
    - Cargo.toml
    - Cargo.lock
    - bun.lock
    - rust-toolchain.toml
    - flake.nix
    - flake.lock
    - tooling/seed_cli/**
    - tooling/xtask/crates/xtask_local/**
    - tooling/just/**
    - infra/local/**
    - docker/**
    - justfile
    - package.json
    - '.github/workflows/channels_e2e.yml'
  schedule:
  - cron: '0 4 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  suite:
    name: Channels end-to-end
    runs-on: namespace-profile-linux-large-build;overrides.cache-tag=sccache-ci
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-Dwarnings -C link-arg=-fuse-ld=mold'
      SQLX_OFFLINE: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
      CHANNELS_E2E_INSTANCE: channels-e2e
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: '10000'
        GIT_HTTP_LOW_SPEED_TIME: '60'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: |-
          /nix
          ./target
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cargo/.global-cache
      continue-on-error: true
    - id: reuse
      name: Reuse the kept cargo target
      run: "node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'\n// Lets cargo reuse the `target` directory a CI job keeps on its cache\n// volume. Cargo counts a workspace crate as built when none of its\n// sources is newer than its last build, and a checkout stamps every file with\n// the current time, so without this every workspace crate rebuilds.\n//\n// The volume keeps, next to `target`, the time each tracked path's current\n// contents were first seen (`RECORD`). A path whose mode and object match the\n// record keeps that time; a changed or added path, and every directory above a\n// change (its tree object changes), gets the current time. A build made while\n// the contents were what they are now is newer than that time and stays fresh.\n// A build of other contents is older than it: units only an earlier, different\n// build left behind (other features, other dependencies) rebuild too.\n//\n// Some changes cargo can't see:\n// - sqlx reads `.sqlx` query data without telling rustc. A new query's data\n//   comes with the query's new source, so only changed data dates every path\n//   now and rebuilds every workspace crate. Removed data is not: another\n//   pull request's query, missing from this tree, is the common case. A job\n//   rebuilds everything when its own pull request changes data (see\n//   `CARGO_TARGET_REBUILD_ALL` below); data that the base branch removed while\n//   an unchanged query still needs it fails only a full build.\n// - rustc lists the file a symlink pointed to when it built, so a symlink that\n//   changed, appeared or went away dates the files it pointed to, before and\n//   after, now. A link is resolved by its text alone: one through another\n//   symlinked directory, or out of the repository, dates nothing.\n// Migrations need nothing here: `sqlx::migrate!` includes each file and\n// `macro_db_migrator`'s build script watches the directory. A build that checks\n// queries against a live database depends on the schema too; Cloud Storage's\n// test job dates those crates itself.\n//\n// A job sets `CARGO_TARGET_REBUILD_ALL` to a reason to rebuild every workspace\n// crate anyway: Cloud Storage's jobs do when the pull request changes query\n// data.\n//\n// Units dated after now (another clock, or anything else writing `target`)\n// would look fresh against every change, so `target` starts over then.\n//\n// A job that builds into `target` without dating its checkout first (one whose\n// workflow predates this step, or a re-run of one) leaves units the record\n// doesn't describe. So the last step of a job that did date it writes `SEAL`,\n// and a unit newer than the seal rebuilds every workspace crate.\n//\n// It runs on a fresh checkout: it dates the index, not the work tree.\n\nimport { execFileSync } from \"node:child_process\";\nimport {\n\texistsSync,\n\tlutimesSync,\n\tmkdirSync,\n\treaddirSync,\n\treadFileSync,\n\treadlinkSync,\n\trmSync,\n\tstatfsSync,\n\tstatSync,\n\twriteFileSync,\n} from \"node:fs\";\nimport { dirname, join, posix } from \"node:path\";\n\nexport const TARGET = \"target\";\nexport const RECORD = `${TARGET}/.macro-source-times`;\n// Written by the last step of a job that dated its checkout; a unit newer than\n// it was built by a job that did not.\nexport const SEAL = `${TARGET}/.macro-sealed`;\n// Dependency upgrades leave old artifacts in `target`; start over if the volume\n// is nearly full. Namespace grows a volume as it fills (about 97 GB free at any\n// use, up to 100 GB used), so this guards a full disk, not the volume's size.\nconst MIN_FREE_BYTES = 20 * 1024 ** 3;\nconst SYMLINK = \"120000 \";\n// Directories under a profile that hold build outputs, not more profiles.\nconst UNIT_OUTPUTS = new Set([\"deps\", \"incremental\", \"examples\", \"doc\"]);\n\n/** Path to `<mode> <type> <object>`. */\nexport type Tree = Map<string, string>;\n/** Path to its signature and the time (seconds) those contents were first seen. */\nexport type SourceTimes = Map<string, { signature: string; time: number }>;\n\nexport type Plan = {\n\t/** What to date each tracked path, and to keep for the next run. */\n\trecord: SourceTimes;\n\tchanged: number;\n\t/** Why every path is dated now, when it is. */\n\trebuildAll?: string;\n};\n\n/** `git ls-tree -r -t -z` output. */\nexport function parseTree(output: string): Tree {\n\tconst tree: Tree = new Map();\n\tfor (const entry of output.split(\"\\0\")) {\n\t\tconst tab = entry.indexOf(\"\\t\");\n\t\tif (tab > 0) tree.set(entry.slice(tab + 1), entry.slice(0, tab));\n\t}\n\treturn tree;\n}\n\nexport function parseRecord(text: string): SourceTimes {\n\tconst record: SourceTimes = new Map();\n\tfor (const entry of text.split(\"\\0\")) {\n\t\tconst tab = entry.indexOf(\"\\t\");\n\t\tconst space = entry.indexOf(\" \");\n\t\tif (tab < 0 || space < 0 || space > tab) continue;\n\t\trecord.set(entry.slice(tab + 1), {\n\t\t\ttime: Number(entry.slice(0, space)),\n\t\t\tsignature: entry.slice(space + 1, tab),\n\t\t});\n\t}\n\treturn record;\n}\n\nexport function formatRecord(record: SourceTimes): string {\n\treturn [...record]\n\t\t.map(([path, { time, signature }]) => `${time} ${signature}\\t${path}\\0`)\n\t\t.join(\"\");\n}\n\n/** A symlink's signature carries what it points to, which the next run needs. */\nfunction signatureOf(mode: string, link: string | undefined): string {\n\treturn link === undefined ? mode : `${mode} ${JSON.stringify(link)}`;\n}\n\n/** The repository path a symlink at `path` resolves to, when it stays inside. */\nfunction linkTarget(path: string, signature: string): string | undefined {\n\tif (!signature.startsWith(SYMLINK)) return;\n\tconst quoted = signature.indexOf(' \"');\n\tif (quoted < 0) return;\n\tconst target = posix.normalize(\n\t\tposix.join(posix.dirname(path), JSON.parse(signature.slice(quoted + 1))),\n\t);\n\treturn target.startsWith(\"../\") || posix.isAbsolute(target)\n\t\t? undefined\n\t\t: target;\n}\n\n/** `links` holds what each tracked symlink in `tree` points to. */\nexport function plan(\n\tprevious: SourceTimes | undefined,\n\ttree: Tree,\n\tlinks: Map<string, string>,\n\tnow: number,\n\tforced?: string,\n): Plan {\n\tconst record: SourceTimes = new Map();\n\tconst linkedTo = new Set<string>();\n\tconst linked = (path: string, signature: string) => {\n\t\tconst target = linkTarget(path, signature);\n\t\tif (target !== undefined) linkedTo.add(target);\n\t};\n\tlet changed = 0;\n\tlet rebuildAll =\n\t\tforced || (previous ? undefined : \"no record of earlier builds\");\n\tfor (const [path, mode] of tree) {\n\t\tconst signature = signatureOf(mode, links.get(path));\n\t\tconst before = previous?.get(path);\n\t\tif (before?.signature === signature) {\n\t\t\trecord.set(path, before);\n\t\t\tcontinue;\n\t\t}\n\t\tchanged++;\n\t\trecord.set(path, { signature, time: now });\n\t\tlinked(path, signature);\n\t\tif (before) linked(path, before.signature);\n\t\tif (before && /(^|\\/)\\.sqlx\\//.test(path)) {\n\t\t\trebuildAll ??= `${path} (sqlx query data) changed`;\n\t\t}\n\t}\n\tfor (const [path, { signature }] of previous ?? []) {\n\t\tif (tree.has(path)) continue;\n\t\tchanged++;\n\t\tlinked(path, signature);\n\t}\n\tconst targets = [...linkedTo];\n\tfor (const [path, { signature, time }] of record) {\n\t\tconst dated =\n\t\t\trebuildAll !== undefined ||\n\t\t\ttargets.some(\n\t\t\t\t(target) => path === target || path.startsWith(`${target}/`),\n\t\t\t);\n\t\tif (dated && time !== now) record.set(path, { signature, time: now });\n\t}\n\treturn { record, changed, rebuildAll };\n}\n\nfunction git(...args: string[]): string {\n\treturn execFileSync(\"git\", args, { encoding: \"utf8\", maxBuffer: 1024 ** 3 });\n}\n\n/**\n * The newest time cargo compares sources against: a unit's fingerprint files\n * and, for a build script's `rerun-if-changed`, its `output`. Profiles sit in\n * `target/<profile>`, and deeper under another `CARGO_TARGET_DIR` inside it or\n * a `--target` triple (`target/cache-wasm/wasm32-unknown-unknown/release`).\n */\nfunction newestUnit(): number {\n\tlet newest = 0;\n\tconst consider = (path: string) => {\n\t\tif (existsSync(path)) {\n\t\t\tnewest = Math.max(newest, statSync(path).mtimeMs / 1000);\n\t\t}\n\t};\n\tconst children = (dir: string) => (existsSync(dir) ? readdirSync(dir) : []);\n\tconst subdirectories = (dir: string) =>\n\t\texistsSync(dir)\n\t\t\t? readdirSync(dir, { withFileTypes: true })\n\t\t\t\t\t.filter((entry) => entry.isDirectory())\n\t\t\t\t\t.map((entry) => entry.name)\n\t\t\t: [];\n\tconst walk = (dir: string, depth: number) => {\n\t\tfor (const name of subdirectories(dir)) {\n\t\t\tconst path = join(dir, name);\n\t\t\tif (name === \".fingerprint\") {\n\t\t\t\tfor (const unit of children(path)) {\n\t\t\t\t\tfor (const file of children(join(path, unit))) {\n\t\t\t\t\t\tconsider(join(path, unit, file));\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else if (name === \"build\") {\n\t\t\t\tfor (const unit of children(path)) consider(join(path, unit, \"output\"));\n\t\t\t} else if (depth > 0 && !UNIT_OUTPUTS.has(name)) {\n\t\t\t\twalk(path, depth - 1);\n\t\t\t}\n\t\t}\n\t};\n\twalk(TARGET, 3);\n\treturn newest;\n}\n\nfunction emptyTarget(why: string) {\n\tconsole.log(`Emptying ${TARGET}: ${why}`);\n\tfor (const entry of readdirSync(TARGET))\n\t\trmSync(join(TARGET, entry), { recursive: true, force: true });\n}\n\nexport async function main() {\n\tconst now = Date.now() / 1000;\n\tmkdirSync(TARGET, { recursive: true });\n\tconst sealed = existsSync(SEAL) ? Number(readFileSync(SEAL, \"utf8\")) : 0;\n\trmSync(SEAL, { force: true });\n\tconst { bavail, bsize } = statfsSync(TARGET);\n\tconsole.log(\n\t\t`${Math.round((bavail * bsize) / 1024 ** 3)} GB free on the cache volume`,\n\t);\n\tconst newest = newestUnit();\n\tif (bavail * bsize < MIN_FREE_BYTES) {\n\t\temptyTarget(\"the cache volume is running out of space\");\n\t} else if (newest > now) {\n\t\temptyTarget(\"a unit in it is dated after now\");\n\t}\n\n\tconst tree = parseTree(\n\t\tgit(\"ls-tree\", \"-r\", \"-t\", \"-z\", git(\"write-tree\").trim()),\n\t);\n\tconst links = new Map<string, string>();\n\tfor (const [path, mode] of tree) {\n\t\tif (mode.startsWith(SYMLINK) && existsSync(dirname(path))) {\n\t\t\tlinks.set(path, readlinkSync(path));\n\t\t}\n\t}\n\tconst previous = existsSync(RECORD)\n\t\t? parseRecord(readFileSync(RECORD, \"utf8\"))\n\t\t: undefined;\n\tconst { record, changed, rebuildAll } = plan(\n\t\tprevious,\n\t\ttree,\n\t\tlinks,\n\t\tnow,\n\t\tprocess.env.CARGO_TARGET_REBUILD_ALL ||\n\t\t\t(previous && !(newest <= sealed)\n\t\t\t\t? \"a job built into it without dating its checkout\"\n\t\t\t\t: undefined),\n\t);\n\tfor (const [path, { time }] of record) {\n\t\ttry {\n\t\t\tlutimesSync(path, time, time);\n\t\t} catch (error) {\n\t\t\t// Paths outside a sparse checkout are not in the work tree.\n\t\t\tif ((error as NodeJS.ErrnoException).code !== \"ENOENT\") throw error;\n\t\t}\n\t}\n\twriteFileSync(RECORD, formatRecord(record));\n\tconsole.log(\n\t\trebuildAll\n\t\t\t? `Every workspace crate rebuilds: ${rebuildAll}`\n\t\t\t: `Reusing ${TARGET}: ${changed} paths differ from the last run`,\n\t);\n}\n\n/** The last step of a job that ran `main`: every unit it built is older than this. */\nexport async function seal() {\n\twriteFileSync(SEAL, String(Date.now() / 1000));\n\tconsole.log(`Sealed ${TARGET} for the next run`);\n}\n\nawait main();\nNODE_SCRIPT\n"
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        seed-cache: sccache-ci
    - name: Setup
      uses: './.github/actions/setup-reqs-web'
      with:
        playwright: 'true'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # The server checks the WebDAV backend before it reports ready, and the
          # client's default 10s wait can run out. This limit has no env var.
          sccache_conf="$RUNNER_TEMP/sccache.toml"
          echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
          echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Start sccache server
      run: sccache --start-server
    - name: Build code-mode assets
      run: |
        set -euo pipefail

        # Build the code-mode assets once per SDK state, not once per job. Cache volumes
        # are forks of past jobs, so most jobs miss the store path another job just built.
        # The key is the store path, which covers every input of the build.
        assets="$(nix eval --raw .#code-mode-assets.outPath)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

        if nix-store --check-validity "$assets" 2>/dev/null; then
          echo "Code-mode assets already in the store"
          exit 0
        fi

        # Forks have no remote cache credentials.
        if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          nix build --no-link --print-build-logs .#code-mode-assets
          exit 0
        fi

        cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

        # The token goes through a config descriptor so it stays out of curl's arguments.
        cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
        }

        if cache_request "$cache_url" | gunzip | nix-store --import; then
          echo "Code-mode assets restored from the remote cache"
          exit 0
        fi

        # Installing node_modules is most of a build and changes far less often than the SDK,
        # so it has its own entry.
        modules="$(nix eval --raw .#macro-js-node-modules.outPath)"
        modules_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$modules").zst"
        save_modules=false

        if ! nix-store --check-validity "$modules" 2>/dev/null; then
          # No retries: a retry would restart the stream into the same pipe, and past the limit
          # a rebuild is faster.
          if cache_request --retry 0 --max-time 60 "$modules_url" | zstd -d | nix-store --import; then
            echo "node_modules restored from the remote cache"
          else
            save_modules=true
          fi
        fi

        nix build --no-link --print-build-logs .#code-mode-assets

        if [ "$save_modules" = true ] \
          && ! nix-store --export "$modules" | zstd -T0 -3 | cache_request --max-time 120 --upload-file - "$modules_url"; then
          echo "::warning::Could not save node_modules to the remote cache"
        fi

        # Losing the upload costs the next job a rebuild, not a failure.
        if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
          echo "Code-mode assets saved to the remote cache"
        else
          echo "::warning::Could not save code-mode assets to the remote cache"
        fi
    - name: run the channels suite
      run: |
        set -euo pipefail

        # Builds every service and the web app, starts the stack and returns once it
        # answers.
        # A service built without optimization exhausts a worker thread's default stack
        # on a Soup request (docs/development/running-locally.md), which every page of
        # the suite makes.
        stack_env=$(mktemp)
        echo 'RUST_MIN_STACK=16777216' > "$stack_env"
        # No test starts an agent sandbox, and building the sandbox image is the one
        # stage of the bring-up nothing here caches: it clones the repository and
        # realizes its dev shell over the network, which has taken from one minute to
        # longer than the whole job. With local sandboxes off the stack skips it, and
        # the harness service starts without a sandbox provider.
        echo 'DEV_DANGEROUS_LOCAL_CONTAINERS=false' >> "$stack_env"

        started=$(date +%s)
        just stack up --no-doppler --instance "$CHANNELS_E2E_INSTANCE" --traces off --no-computers \
          --env-file "$stack_env"
        echo "Local stack up: $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"

        just seed-scenario --instance "$CHANNELS_E2E_INSTANCE" apply --file seed/scenarios/channels-e2e.json

        failed=0
        started=$(date +%s)
        (cd apps/web && just test-channels-e2e "$CHANNELS_E2E_INSTANCE") || failed=1
        echo "Channels suite: $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"

        # The ledger against the tests and the run: every test listed, every outcome
        # the one the ledger expects, and the intermittent defects that showed.
        (cd apps/web && bun tests/channels-e2e/ledger/check.ts \
          --report tests/channels-e2e/.run/playwright-report.json) 2>&1 |
          tee -a "$GITHUB_STEP_SUMMARY" || failed=1
        exit "$failed"
      env:
        CARGO_PROFILE_FIG_ENGINE_WASM_LTO: 'off'
        CARGO_PROFILE_FIG_ENGINE_WASM_CODEGEN_UNITS: '16'
        CARGO_PROFILE_PSD_ENGINE_WASM_LTO: 'off'
        CARGO_PROFILE_PSD_ENGINE_WASM_CODEGEN_UNITS: '16'
        CARGO_PROFILE_AI_ENGINE_WASM_LTO: 'off'
        CARGO_PROFILE_AI_ENGINE_WASM_CODEGEN_UNITS: '16'
        WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs
        WASM_PKG_HTTP_CACHE: '1'
      timeout-minutes: 35
    - name: collect the stack's logs
      if: failure() || cancelled()
      run: |-
        mkdir -p target/channels-e2e
        docker compose -p macro-channels-e2e logs --no-color > target/channels-e2e/containers.log 2>&1 || true
        cp infra/local/generated/channels-e2e/run/*.log target/channels-e2e/ 2>/dev/null || true
    - name: Upload channels-e2e-stack-logs artifact
      if: failure() || cancelled()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: channels-e2e-stack-logs
        path: target/channels-e2e
        if-no-files-found: ignore
        retention-days: '7'
        include-hidden-files: 'true'
    - name: Upload channels-e2e-results artifact
      if: failure() || cancelled()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: channels-e2e-results
        path: apps/web/tests/channels-e2e/.run
        if-no-files-found: ignore
        retention-days: '7'
        include-hidden-files: 'true'
    - name: Upload channels-e2e-report artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: channels-e2e-report
        path: apps/web/tests/channels-e2e/.run/playwright-report.json
        if-no-files-found: ignore
        retention-days: '7'
        include-hidden-files: 'true'
        overwrite: 'true'
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
    - name: Seal the kept cargo target
      if: always() && steps.reuse.outcome == 'success'
      run: "node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'\n// Lets cargo reuse the `target` directory a CI job keeps on its cache\n// volume. Cargo counts a workspace crate as built when none of its\n// sources is newer than its last build, and a checkout stamps every file with\n// the current time, so without this every workspace crate rebuilds.\n//\n// The volume keeps, next to `target`, the time each tracked path's current\n// contents were first seen (`RECORD`). A path whose mode and object match the\n// record keeps that time; a changed or added path, and every directory above a\n// change (its tree object changes), gets the current time. A build made while\n// the contents were what they are now is newer than that time and stays fresh.\n// A build of other contents is older than it: units only an earlier, different\n// build left behind (other features, other dependencies) rebuild too.\n//\n// Some changes cargo can't see:\n// - sqlx reads `.sqlx` query data without telling rustc. A new query's data\n//   comes with the query's new source, so only changed data dates every path\n//   now and rebuilds every workspace crate. Removed data is not: another\n//   pull request's query, missing from this tree, is the common case. A job\n//   rebuilds everything when its own pull request changes data (see\n//   `CARGO_TARGET_REBUILD_ALL` below); data that the base branch removed while\n//   an unchanged query still needs it fails only a full build.\n// - rustc lists the file a symlink pointed to when it built, so a symlink that\n//   changed, appeared or went away dates the files it pointed to, before and\n//   after, now. A link is resolved by its text alone: one through another\n//   symlinked directory, or out of the repository, dates nothing.\n// Migrations need nothing here: `sqlx::migrate!` includes each file and\n// `macro_db_migrator`'s build script watches the directory. A build that checks\n// queries against a live database depends on the schema too; Cloud Storage's\n// test job dates those crates itself.\n//\n// A job sets `CARGO_TARGET_REBUILD_ALL` to a reason to rebuild every workspace\n// crate anyway: Cloud Storage's jobs do when the pull request changes query\n// data.\n//\n// Units dated after now (another clock, or anything else writing `target`)\n// would look fresh against every change, so `target` starts over then.\n//\n// A job that builds into `target` without dating its checkout first (one whose\n// workflow predates this step, or a re-run of one) leaves units the record\n// doesn't describe. So the last step of a job that did date it writes `SEAL`,\n// and a unit newer than the seal rebuilds every workspace crate.\n//\n// It runs on a fresh checkout: it dates the index, not the work tree.\n\nimport { execFileSync } from \"node:child_process\";\nimport {\n\texistsSync,\n\tlutimesSync,\n\tmkdirSync,\n\treaddirSync,\n\treadFileSync,\n\treadlinkSync,\n\trmSync,\n\tstatfsSync,\n\tstatSync,\n\twriteFileSync,\n} from \"node:fs\";\nimport { dirname, join, posix } from \"node:path\";\n\nexport const TARGET = \"target\";\nexport const RECORD = `${TARGET}/.macro-source-times`;\n// Written by the last step of a job that dated its checkout; a unit newer than\n// it was built by a job that did not.\nexport const SEAL = `${TARGET}/.macro-sealed`;\n// Dependency upgrades leave old artifacts in `target`; start over if the volume\n// is nearly full. Namespace grows a volume as it fills (about 97 GB free at any\n// use, up to 100 GB used), so this guards a full disk, not the volume's size.\nconst MIN_FREE_BYTES = 20 * 1024 ** 3;\nconst SYMLINK = \"120000 \";\n// Directories under a profile that hold build outputs, not more profiles.\nconst UNIT_OUTPUTS = new Set([\"deps\", \"incremental\", \"examples\", \"doc\"]);\n\n/** Path to `<mode> <type> <object>`. */\nexport type Tree = Map<string, string>;\n/** Path to its signature and the time (seconds) those contents were first seen. */\nexport type SourceTimes = Map<string, { signature: string; time: number }>;\n\nexport type Plan = {\n\t/** What to date each tracked path, and to keep for the next run. */\n\trecord: SourceTimes;\n\tchanged: number;\n\t/** Why every path is dated now, when it is. */\n\trebuildAll?: string;\n};\n\n/** `git ls-tree -r -t -z` output. */\nexport function parseTree(output: string): Tree {\n\tconst tree: Tree = new Map();\n\tfor (const entry of output.split(\"\\0\")) {\n\t\tconst tab = entry.indexOf(\"\\t\");\n\t\tif (tab > 0) tree.set(entry.slice(tab + 1), entry.slice(0, tab));\n\t}\n\treturn tree;\n}\n\nexport function parseRecord(text: string): SourceTimes {\n\tconst record: SourceTimes = new Map();\n\tfor (const entry of text.split(\"\\0\")) {\n\t\tconst tab = entry.indexOf(\"\\t\");\n\t\tconst space = entry.indexOf(\" \");\n\t\tif (tab < 0 || space < 0 || space > tab) continue;\n\t\trecord.set(entry.slice(tab + 1), {\n\t\t\ttime: Number(entry.slice(0, space)),\n\t\t\tsignature: entry.slice(space + 1, tab),\n\t\t});\n\t}\n\treturn record;\n}\n\nexport function formatRecord(record: SourceTimes): string {\n\treturn [...record]\n\t\t.map(([path, { time, signature }]) => `${time} ${signature}\\t${path}\\0`)\n\t\t.join(\"\");\n}\n\n/** A symlink's signature carries what it points to, which the next run needs. */\nfunction signatureOf(mode: string, link: string | undefined): string {\n\treturn link === undefined ? mode : `${mode} ${JSON.stringify(link)}`;\n}\n\n/** The repository path a symlink at `path` resolves to, when it stays inside. */\nfunction linkTarget(path: string, signature: string): string | undefined {\n\tif (!signature.startsWith(SYMLINK)) return;\n\tconst quoted = signature.indexOf(' \"');\n\tif (quoted < 0) return;\n\tconst target = posix.normalize(\n\t\tposix.join(posix.dirname(path), JSON.parse(signature.slice(quoted + 1))),\n\t);\n\treturn target.startsWith(\"../\") || posix.isAbsolute(target)\n\t\t? undefined\n\t\t: target;\n}\n\n/** `links` holds what each tracked symlink in `tree` points to. */\nexport function plan(\n\tprevious: SourceTimes | undefined,\n\ttree: Tree,\n\tlinks: Map<string, string>,\n\tnow: number,\n\tforced?: string,\n): Plan {\n\tconst record: SourceTimes = new Map();\n\tconst linkedTo = new Set<string>();\n\tconst linked = (path: string, signature: string) => {\n\t\tconst target = linkTarget(path, signature);\n\t\tif (target !== undefined) linkedTo.add(target);\n\t};\n\tlet changed = 0;\n\tlet rebuildAll =\n\t\tforced || (previous ? undefined : \"no record of earlier builds\");\n\tfor (const [path, mode] of tree) {\n\t\tconst signature = signatureOf(mode, links.get(path));\n\t\tconst before = previous?.get(path);\n\t\tif (before?.signature === signature) {\n\t\t\trecord.set(path, before);\n\t\t\tcontinue;\n\t\t}\n\t\tchanged++;\n\t\trecord.set(path, { signature, time: now });\n\t\tlinked(path, signature);\n\t\tif (before) linked(path, before.signature);\n\t\tif (before && /(^|\\/)\\.sqlx\\//.test(path)) {\n\t\t\trebuildAll ??= `${path} (sqlx query data) changed`;\n\t\t}\n\t}\n\tfor (const [path, { signature }] of previous ?? []) {\n\t\tif (tree.has(path)) continue;\n\t\tchanged++;\n\t\tlinked(path, signature);\n\t}\n\tconst targets = [...linkedTo];\n\tfor (const [path, { signature, time }] of record) {\n\t\tconst dated =\n\t\t\trebuildAll !== undefined ||\n\t\t\ttargets.some(\n\t\t\t\t(target) => path === target || path.startsWith(`${target}/`),\n\t\t\t);\n\t\tif (dated && time !== now) record.set(path, { signature, time: now });\n\t}\n\treturn { record, changed, rebuildAll };\n}\n\nfunction git(...args: string[]): string {\n\treturn execFileSync(\"git\", args, { encoding: \"utf8\", maxBuffer: 1024 ** 3 });\n}\n\n/**\n * The newest time cargo compares sources against: a unit's fingerprint files\n * and, for a build script's `rerun-if-changed`, its `output`. Profiles sit in\n * `target/<profile>`, and deeper under another `CARGO_TARGET_DIR` inside it or\n * a `--target` triple (`target/cache-wasm/wasm32-unknown-unknown/release`).\n */\nfunction newestUnit(): number {\n\tlet newest = 0;\n\tconst consider = (path: string) => {\n\t\tif (existsSync(path)) {\n\t\t\tnewest = Math.max(newest, statSync(path).mtimeMs / 1000);\n\t\t}\n\t};\n\tconst children = (dir: string) => (existsSync(dir) ? readdirSync(dir) : []);\n\tconst subdirectories = (dir: string) =>\n\t\texistsSync(dir)\n\t\t\t? readdirSync(dir, { withFileTypes: true })\n\t\t\t\t\t.filter((entry) => entry.isDirectory())\n\t\t\t\t\t.map((entry) => entry.name)\n\t\t\t: [];\n\tconst walk = (dir: string, depth: number) => {\n\t\tfor (const name of subdirectories(dir)) {\n\t\t\tconst path = join(dir, name);\n\t\t\tif (name === \".fingerprint\") {\n\t\t\t\tfor (const unit of children(path)) {\n\t\t\t\t\tfor (const file of children(join(path, unit))) {\n\t\t\t\t\t\tconsider(join(path, unit, file));\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else if (name === \"build\") {\n\t\t\t\tfor (const unit of children(path)) consider(join(path, unit, \"output\"));\n\t\t\t} else if (depth > 0 && !UNIT_OUTPUTS.has(name)) {\n\t\t\t\twalk(path, depth - 1);\n\t\t\t}\n\t\t}\n\t};\n\twalk(TARGET, 3);\n\treturn newest;\n}\n\nfunction emptyTarget(why: string) {\n\tconsole.log(`Emptying ${TARGET}: ${why}`);\n\tfor (const entry of readdirSync(TARGET))\n\t\trmSync(join(TARGET, entry), { recursive: true, force: true });\n}\n\nexport async function main() {\n\tconst now = Date.now() / 1000;\n\tmkdirSync(TARGET, { recursive: true });\n\tconst sealed = existsSync(SEAL) ? Number(readFileSync(SEAL, \"utf8\")) : 0;\n\trmSync(SEAL, { force: true });\n\tconst { bavail, bsize } = statfsSync(TARGET);\n\tconsole.log(\n\t\t`${Math.round((bavail * bsize) / 1024 ** 3)} GB free on the cache volume`,\n\t);\n\tconst newest = newestUnit();\n\tif (bavail * bsize < MIN_FREE_BYTES) {\n\t\temptyTarget(\"the cache volume is running out of space\");\n\t} else if (newest > now) {\n\t\temptyTarget(\"a unit in it is dated after now\");\n\t}\n\n\tconst tree = parseTree(\n\t\tgit(\"ls-tree\", \"-r\", \"-t\", \"-z\", git(\"write-tree\").trim()),\n\t);\n\tconst links = new Map<string, string>();\n\tfor (const [path, mode] of tree) {\n\t\tif (mode.startsWith(SYMLINK) && existsSync(dirname(path))) {\n\t\t\tlinks.set(path, readlinkSync(path));\n\t\t}\n\t}\n\tconst previous = existsSync(RECORD)\n\t\t? parseRecord(readFileSync(RECORD, \"utf8\"))\n\t\t: undefined;\n\tconst { record, changed, rebuildAll } = plan(\n\t\tprevious,\n\t\ttree,\n\t\tlinks,\n\t\tnow,\n\t\tprocess.env.CARGO_TARGET_REBUILD_ALL ||\n\t\t\t(previous && !(newest <= sealed)\n\t\t\t\t? \"a job built into it without dating its checkout\"\n\t\t\t\t: undefined),\n\t);\n\tfor (const [path, { time }] of record) {\n\t\ttry {\n\t\t\tlutimesSync(path, time, time);\n\t\t} catch (error) {\n\t\t\t// Paths outside a sparse checkout are not in the work tree.\n\t\t\tif ((error as NodeJS.ErrnoException).code !== \"ENOENT\") throw error;\n\t\t}\n\t}\n\twriteFileSync(RECORD, formatRecord(record));\n\tconsole.log(\n\t\trebuildAll\n\t\t\t? `Every workspace crate rebuilds: ${rebuildAll}`\n\t\t\t: `Reusing ${TARGET}: ${changed} paths differ from the last run`,\n\t);\n}\n\n/** The last step of a job that ran `main`: every unit it built is older than this. */\nexport async function seal() {\n\twriteFileSync(SEAL, String(Date.now() / 1000));\n\tconsole.log(`Sealed ${TARGET} for the next run`);\n}\n\nawait seal();\nNODE_SCRIPT\n"
  email-e2e-alert:
    needs:
    - suite
    if: '!cancelled() && github.ref == ''refs/heads/main'' && (github.event_name == ''push'' || github.event_name == ''schedule'')'
    name: Tell Macro Alerts
    runs-on: namespace-profile-linux-small
    permissions:
      actions: read
      contents: read
    concurrency:
      group: email-e2e-alert-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
    - name: download the coverage report
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: channels-e2e-report
        path: ${{ runner.temp }}/email-e2e-reports
      continue-on-error: true
    - id: decide
      name: decide what to post
      run: |
        node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
        // Tells the Macro Alerts channel when an email end-to-end workflow turns red
        // on `main`, and when it turns green again. The last job of `email_e2e.yml`,
        // `email_e2e_browser.yml` and `email_e2e_full_stack.yml` runs it after every
        // other job, as does that of `channels_e2e.yml`, on a push to `main` and in
        // the daily sweep; never on a run by hand.
        //
        // A run posts only when its result differs from what the channel was last
        // told about its stream: the workflow's runs on the same branch for the same
        // event (the pushes, or the sweep). A red run posts the failure when the
        // channel shows the stream passing; a green run posts that it passes again
        // when the channel shows it failing; any other run posts nothing. Pushes and
        // the sweep are apart because only the sweep runs the tests kept for known
        // bugs: one of those that passes would otherwise turn the stream red at every
        // sweep and green at the next push.
        //
        // The job records what the channel shows in its last step, "the channel shows
        // it failing" or "the channel shows it passing", which runs only once a post
        // succeeded or none was needed. The newest such step among the stream's recent
        // runs, read through the jobs API, is what the channel shows; with none, it
        // shows the stream passing. A stream's alert jobs run one at a time (a
        // concurrency group), so each reads what the one before it left. A run posts
        // nothing once a newer run has ended, since its result is not the branch's
        // latest; the newer run's own alert job tells the channel, or, if that job
        // never runs, the next run does. A failed post records nothing, so the next
        // run posts again, as does a re-run of this job while no newer run has ended.
        //
        // A push that waited for the run before it and was replaced by a newer push
        // (the workflows queue as the dev deploys do) ends as a cancelled run with no
        // jobs, and a stream can hold several for each run that ended. Having no jobs,
        // it neither records nor passes, and the job reads past it without counting it
        // toward LOOK_BACK; the run after it tests the newer tree, and that run's
        // failure names the last pass before it, so the changes since span its
        // commit. A run is judged by its jobs, never by its conclusion: one whose job
        // ran out of time is cancelled too, yet ran this job.
        //
        // A failure names the commit, each failed job with the step it failed at, and
        // what the run's coverage report (downloaded to EMAIL_E2E_REPORTS) says
        // failed: gating tests, tests kept for known bugs that now pass, or the
        // coverage check itself. The step writes the message to
        // EMAIL_E2E_ALERT_MESSAGE, `post=true` when there is one, and `shows=failing`
        // or `shows=passing` to its outputs; the next steps post the message and record
        // what the channel then shows. The message, or why there is none, goes to the
        // job summary.

        import { appendFileSync, existsSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';

        /**
         * Conclusions of a finished job that mean it failed. A cancelled job counts:
         * this job runs only in a run that was not cancelled, so such a job ran out of
         * time.
         */
        const RED = new Set(['failure', 'timed_out', 'cancelled']);

        /** The most runs with jobs of the stream the job reads. */
        export const LOOK_BACK = 30;

        /**
         * How many of the stream's newest runs the job lists, the most a page holds:
         * runs replaced while they waited have no jobs, and are read past.
         */
        const LISTED = 100;

        /** How many runs' jobs the job reads at once. */
        const BATCH = 5;

        /** How many failed tests a message names before it counts the rest. */
        const NAMED = 8;

        /** Where the alert sends a reader. */
        export const WHAT_TO_DO = 'docs/development/ci.md#when-an-email-end-to-end-alert-fires';

        /** A line of the browser suite's coverage check about a test kept for a known bug. */
        const KNOWN_BUG_PASSES = 'a test kept for a known bug passes: remove its @known-bug tag and its waiver: ';

        /** The Rust suite's coverage gap for a scenario kept for a known bug that passes. */
        const KNOWN_BUG_SCENARIO = /^scenario `(.+)`, kept for a known bug, passes/;

        /** The Rust suite's coverage gap for a scenario that failed. */
        const FAILED_SCENARIO = /^scenario `.+` failed$/;

        /** A run of the workflow, as the runs API lists it. */
        export type StreamRun = { id: number; run_number: number; head_sha: string };

        /** A job of a run, as the jobs API lists it. */
        export type Job = {
          id: number;
          name: string;
          status: string;
          conclusion: string | null;
          run_attempt?: number;
          steps?: { name: string; conclusion: string | null; completed_at?: string | null }[];
        };

        /** A run and the jobs of all its attempts. */
        export type Entry = { run: StreamRun; jobs: Job[] };

        /** The names of the alert job and of its steps the script reads. */
        export type Names = {
          job: string;
          post: string;
          /** The step that records that the channel shows the stream failing. */
          failing: string;
          /** The step that records that the channel shows the stream passing. */
          passing: string;
        };

        /** What one alert job recorded. */
        export type Told = { run: StreamRun; failing: boolean; posted: boolean; at: string };

        export type FailedJob = { name: string; step: string | null };

        export type Decision = (
          | { post: 'failure'; lastGreen: StreamRun | null }
          | { post: 'recovery'; failingSince: StreamRun | null }
          | { post: null; why: string }
        ) & {
          /** Whether the channel shows the stream failing once this job is done. */
          failing: boolean;
        };

        /** What the run's coverage report says failed. */
        export type Findings = {
          /** Gating tests that failed. */
          failedTests: string[];
          /** Tests kept for known bugs that passed: the known-bug report, not a gating test. */
          knownBugsPassing: string[];
          /** Everything else the coverage check fails on. */
          otherProblems: string[];
        };

        /** What the message says about the run. */
        export type Context = {
          runId: number;
          workflow: string;
          event: string;
          branch: string;
          sha: string;
          /** The first line of the head commit's message. */
          title: string;
          /** `https://github.com/<owner>/<repo>`. */
          repoUrl: string;
          runUrl: string;
        };

        function env(name: string): string {
          const value = process.env[name];
          if (!value) {
            throw new Error(`${name} is not set`);
          }
          return value;
        }

        /**
         * The jobs that failed, each with the first step that failed, in the order the
         * run started them: the suite's before the coverage job that reads their
         * results. Jobs still running, this one among them, are left out.
         */
        export function failedJobs(jobs: Job[]): FailedJob[] {
          const failed = (conclusion: string | null) => RED.has(conclusion ?? '');
          return jobs
            .filter((job) => job.status === 'completed' && failed(job.conclusion))
            .sort((a, b) => a.id - b.id)
            .map((job) => ({
              name: job.name,
              step: job.steps?.find((step) => failed(step.conclusion))?.name ?? null,
            }));
        }

        /** What each alert job of a run, in any attempt, recorded. */
        export function records(entry: Entry, names: Names): Told[] {
          const done = (job: Job, name: string) =>
            job.steps?.find((step) => step.name === name && step.conclusion === 'success');
          return entry.jobs.flatMap((job) => {
            const shown = job.name === names.job ? (done(job, names.failing) ?? done(job, names.passing)) : undefined;
            return shown?.completed_at
              ? [
                  {
                    run: entry.run,
                    failing: shown.name === names.failing,
                    posted: done(job, names.post) !== undefined,
                    at: shown.completed_at,
                  },
                ]
              : [];
          });
        }

        /**
         * Whether a run passed, from the latest attempt of each of its jobs but the
         * alert job; null while one of them is still going.
         */
        export function passed(entry: Entry, alertJob: string): boolean | null {
          const latest = new Map<string, Job>();
          for (const job of entry.jobs) {
            const seen = latest.get(job.name);
            if (job.name !== alertJob && (!seen || (job.run_attempt ?? 1) > (seen.run_attempt ?? 1))) {
              latest.set(job.name, job);
            }
          }
          const suite = [...latest.values()];
          if (suite.length === 0 || suite.some((job) => job.status !== 'completed')) {
            return null;
          }
          return failedJobs(suite).length === 0;
        }

        /**
         * Reads the stream's runs, newest first, a few at a time with `jobsOf`, until
         * the decision `judge` makes of them would not change or, by the end of a
         * batch, LOOK_BACK runs with jobs were read. A push replaced while it waited
         * has none: it is read but not counted, so replaced pushes do not crowd out
         * the runs that ended.
         */
        export async function readStream(
          stream: StreamRun[],
          names: Names,
          judge: (entries: Entry[]) => Decision,
          jobsOf: (run: StreamRun) => Promise<Job[]>,
        ): Promise<Decision> {
          const entries: Entry[] = [];
          const ran = () => entries.filter((entry) => entry.jobs.length > 0).length;
          let decision = judge(entries);
          for (
            let start = 0;
            start < stream.length && ran() < LOOK_BACK && readMore(decision, entries, names);
            start += BATCH
          ) {
            const batch = stream.slice(start, start + BATCH);
            entries.push(...(await Promise.all(batch.map(async (run) => ({ run, jobs: await jobsOf(run) })))));
            decision = judge(entries);
          }
          return decision;
        }

        const short = (sha: string) => sha.slice(0, 7);

        const newestFirst = (a: { run: StreamRun }, b: { run: StreamRun }) => b.run.run_number - a.run.run_number;

        /**
         * Whether this run posts, from its result and the stream's recent runs
         * (`entries`, which may hold this run's earlier attempts).
         */
        export function decide({
          run,
          red,
          entries,
          names,
        }: {
          run: StreamRun;
          red: boolean;
          entries: Entry[];
          names: Names;
        }): Decision {
          const recorded = entries.flatMap((entry) => records(entry, names)).sort((a, b) => b.at.localeCompare(a.at));
          const shown = recorded[0];
          const failing = shown?.failing ?? false;

          // A newer run that ended tells the channel itself, or has already; its
          // alert job may wait behind this one.
          const newer = entries
            .filter(
              (entry) =>
                entry.run.run_number > run.run_number &&
                (records(entry, names).length > 0 || passed(entry, names.job) !== null),
            )
            .sort(newestFirst)[0];
          if (newer) {
            return {
              post: null,
              failing,
              why: `run #${newer.run.run_number}, which is newer, has ended, so this result is not the branch's latest`,
            };
          }
          if (red && !failing) {
            const lastGreen = entries
              .filter((entry) => entry.run.run_number < run.run_number && passed(entry, names.job) === true)
              .sort(newestFirst)[0];
            return { post: 'failure', failing: true, lastGreen: lastGreen?.run ?? null };
          }
          if (!red && failing) {
            const since = recorded.find((record) => record.failing && record.posted);
            return { post: 'recovery', failing: false, failingSince: since?.run ?? null };
          }
          const as = shown ? ` (since run #${shown.run.run_number}, at ${short(shown.run.head_sha)})` : '';
          return {
            post: null,
            failing,
            why: red
              ? `the channel already shows it failing${as}`
              : shown
                ? `it passed, and the channel already shows it passing${as}`
                : 'it passed, and the channel was never told otherwise',
          };
        }

        /** Whether a decision would change if the job read more runs. */
        export function readMore(decision: Decision, entries: Entry[], names: Names): boolean {
          return (
            !entries.some((entry) => records(entry, names).length > 0) ||
            (decision.post === 'failure' && decision.lastGreen === null) ||
            (decision.post === 'recovery' && decision.failingSince === null)
          );
        }

        type PlaywrightSpec = {
          title: string;
          file: string;
          line: number;
          tests: { status: string; expectedStatus?: string }[];
        };
        type PlaywrightSuite = { specs?: PlaywrightSpec[]; suites?: PlaywrightSuite[] };

        /** `file:line title` of each spec that failed in a Playwright JSON report. */
        export function failedSpecs(report: { suites?: PlaywrightSuite[] }): string[] {
          const walk = (suites: PlaywrightSuite[] = []): string[] =>
            suites.flatMap((suite) => [
              ...(suite.specs ?? [])
                .filter((spec) => spec.tests.some((test) => test.status === 'unexpected'))
                .map((spec) => `${spec.file}:${spec.line} ${spec.title}`),
              ...walk(suite.suites),
            ]);
          return walk(report.suites);
        }

        /** What the Rust suite's `coverage.json` says failed. */
        export function rustFindings(coverage: {
          suite: { failed: string[] };
          broken: string[];
          gaps: string[];
        }): Findings {
          const knownBugsPassing = coverage.gaps.flatMap((gap) => KNOWN_BUG_SCENARIO.exec(gap)?.[1] ?? []);
          return {
            failedTests: coverage.suite.failed,
            knownBugsPassing,
            otherProblems: [
              ...coverage.broken,
              ...coverage.gaps.filter((gap) => !FAILED_SCENARIO.test(gap) && !KNOWN_BUG_SCENARIO.test(gap)),
            ],
          };
        }

        /**
         * What the browser suite's `ledger.json` and the Playwright reports beside it
         * (`playwright-<run>[-<shard>].json`) say failed.
         */
        export function browserFindings(
          ledger: { failures: string[] },
          reports: { name: string; report: { suites?: PlaywrightSuite[] } }[],
        ): Findings {
          const gating = reports.filter(({ name }) => /^playwright-(gating|full-stack)(-\d+)?\.json$/.test(name));
          return {
            // A test that ran on both stacks failed once for each.
            failedTests: [...new Set(gating.flatMap(({ report }) => failedSpecs(report)))],
            knownBugsPassing: ledger.failures
              .filter((line) => line.startsWith(KNOWN_BUG_PASSES))
              .map((line) => line.slice(KNOWN_BUG_PASSES.length)),
            otherProblems: ledger.failures.filter((line) => !line.startsWith(KNOWN_BUG_PASSES)),
          };
        }

        /** What a message says of a spec marked to fail (`test.fail()`) that passed. */
        const MARKED_TO_FAIL = ' (marked as a known defect, and now passes)';

        /**
         * What the one Playwright report of a suite with no coverage check says failed
         * (the channels suite's `playwright-report.json`). Its tests for known defects
         * run in every run, marked to fail, so one that passes fails the run: it is
         * named with the failed tests, and said to be that.
         */
        export function suiteFindings(report: { suites?: PlaywrightSuite[] }): Findings {
          const unexpected = (spec: PlaywrightSpec) => spec.tests.filter((test) => test.status === 'unexpected');
          const walk = (suites: PlaywrightSuite[] = []): string[] =>
            suites.flatMap((suite) => [
              ...(suite.specs ?? [])
                .filter((spec) => unexpected(spec).length > 0)
                .map((spec) => {
                  const marked = unexpected(spec).some((test) => test.expectedStatus === 'failed');
                  return `${spec.file}:${spec.line} ${spec.title}${marked ? MARKED_TO_FAIL : ''}`;
                }),
              ...walk(suite.suites),
            ]);
          return { failedTests: walk(report.suites), knownBugsPassing: [], otherProblems: [] };
        }

        /** What the coverage report in `dir` says failed, or null when there is none. */
        export function readFindings(dir: string): Findings | null {
          const read = (name: string) => JSON.parse(readFileSync(`${dir}/${name}`, 'utf8'));
          if (existsSync(`${dir}/coverage.json`)) {
            return rustFindings(read('coverage.json'));
          }
          if (existsSync(`${dir}/ledger.json`)) {
            const reports = readdirSync(dir)
              .filter((name) => /^playwright-.*\.json$/.test(name))
              .map((name) => ({ name, report: read(name) }));
            return browserFindings(read('ledger.json'), reports);
          }
          if (existsSync(`${dir}/playwright-report.json`)) {
            return suiteFindings(read('playwright-report.json'));
          }
          return null;
        }

        /** A code span; a name holds no backtick, but one would end the span early. */
        const code = (text: string) => `\`${text.replace(/`/g, "'")}\``;

        /** Text the channel would otherwise read as a tag. */
        const plain = (text: string) => text.replace(/</g, '‹').replace(/>/g, '›');

        function names(items: string[]): string {
          const shown = items.slice(0, NAMED).map(code).join(', ');
          return items.length > NAMED ? `${shown} and ${items.length - NAMED} more` : shown;
        }

        /**
         * The failed jobs, by the part of their name after the workflow's ("1/3",
         * "coverage"), with those that failed at the same step together.
         */
        export function jobsLine(workflow: string, jobs: FailedJob[]): string {
          const part = (name: string) =>
            name.startsWith(`${workflow} `) ? name.slice(workflow.length + 1).replace(/^\((.*)\)$/, '$1') : name;
          const byStep = new Map<string | null, string[]>();
          for (const job of jobs) {
            byStep.set(job.step, [...(byStep.get(job.step) ?? []), part(job.name)]);
          }
          return [...byStep]
            .map(([step, parts]) => (step ? `${parts.join(', ')} at “${step}”` : parts.join(', ')))
            .join('; ');
        }

        /** Which run: the push of a commit, with its PR, or the sweep at a commit. */
        function which(context: Context): string {
          const pr = /\(#(\d+)\)$/.exec(context.title)?.[1];
          const title = plain(context.title.replace(/\s*\(#\d+\)$/, ''));
          const commit = `${code(short(context.sha))} ${title}`;
          if (context.event === 'schedule') {
            return `daily sweep, at ${commit}`;
          }
          return pr ? `push of ${commit} ([#${pr}](${context.repoUrl}/pull/${pr}))` : `push of ${commit}`;
        }


        export function failureMessage(
          context: Context,
          jobs: FailedJob[],
          findings: Findings | null,
          lastGreen: StreamRun | null,
        ): string {
          const lines = [`🚨 · **${context.workflow} failed on ${context.branch}** · ${which(context)}`];
          lines.push(`Failed jobs: ${jobsLine(context.workflow, jobs)}`);
          if (findings === null) {
            lines.push('No coverage report was written: the failed step’s log says what went wrong.');
          } else {
            const { failedTests, knownBugsPassing, otherProblems } = findings;
            if (failedTests.length > 0) {
              lines.push(`Failed tests (${failedTests.length}): ${names(failedTests)}`);
            }
            if (knownBugsPassing.length > 0) {
              lines.push(
                `Kept for a known bug and now passing, from the known-bug report rather than a gating test (${knownBugsPassing.length}): ${names(knownBugsPassing)}`,
              );
            }
            if (failedTests.length === 0 && knownBugsPassing.length === 0) {
              lines.push(
                otherProblems.length > 0
                  ? `The coverage check failed: ${plain(otherProblems[0])}${otherProblems.length > 1 ? ` (and ${otherProblems.length - 1} more)` : ''}`
                  : 'No test failed in the coverage report: the failed step’s log says what went wrong.',
              );
            }
          }
          if (lastGreen?.head_sha === context.sha) {
            lines.push('This commit passed in an earlier run: the failure may be flaky.');
          } else if (lastGreen) {
            lines.push(
              `Last passed at ${code(short(lastGreen.head_sha))} · [changes since](${context.repoUrl}/compare/${lastGreen.head_sha}...${context.sha})`,
            );
          }
          lines.push(`[Run](${context.runUrl}) · [What to do](${context.repoUrl}/blob/main/${WHAT_TO_DO})`);
          return lines.join('\n');
        }

        export function recoveryMessage(context: Context, failingSince: StreamRun | null): string {
          const since =
            failingSince === null
              ? ''
              : failingSince.id === context.runId
                ? 'It failed on an earlier attempt of this run. '
                : `It had failed since ${code(short(failingSince.head_sha))}. `;
          return [
            `✅ Resolved · **${context.workflow} passes again on ${context.branch}** · ${which(context)}`,
            `${since}[Run](${context.runUrl})`,
          ].join('\n');
        }

        /**
         * GETs a GitHub API path. Network errors, server errors and rate limits are
         * tried three times, waiting as long as GitHub asks when that fits in the job.
         */
        async function github(path: string): Promise<any> {
          for (let attempt = 1; ; attempt++) {
            const { response, body } = await fetch(`${process.env.GITHUB_API_URL ?? 'https://api.github.com'}${path}`, {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${env('GH_TOKEN')}`,
                'x-github-api-version': '2022-11-28',
              },
            })
              .then(async (response) => ({ response, body: await response.text() }))
              .catch((error: unknown) => ({ response: null, body: String(error) }));
            if (response?.ok) {
              try {
                return JSON.parse(body);
              } catch {
                // A body cut short: try again.
              }
            }
            const limited = response?.status === 429 || (response?.status === 403 && /rate limit/i.test(body));
            const retried = response === null || response.ok || response.status >= 500 || limited;
            if (attempt === 3 || !retried) {
              throw new Error(`GET ${path}: ${response ? `HTTP ${response.status} ` : ''}${body}`);
            }
            const retryAfter = Number(response?.headers.get('retry-after'));
            const reset = Number(response?.headers.get('x-ratelimit-reset')) - Date.now() / 1000;
            const exhausted = response?.headers.get('x-ratelimit-remaining') === '0';
            const seconds = retryAfter > 0 ? retryAfter : !limited ? 5 * attempt : exhausted && reset > 0 ? reset : 60;
            // The job's own time limit is ten minutes; a longer wait would not end in time.
            if (seconds > 120) {
              throw new Error(`GET ${path}: rate limited for ${Math.round(seconds)}s`);
            }
            await new Promise((resolve) => setTimeout(resolve, seconds * 1000));
          }
        }

        async function jobsOf(repo: string, run: number, filter: 'latest' | 'all'): Promise<Job[]> {
          return (await github(`/repos/${repo}/actions/runs/${run}/jobs?filter=${filter}&per_page=100`)).jobs;
        }

        export async function main() {
          const repo = env('GITHUB_REPOSITORY');
          const id = Number(env('GITHUB_RUN_ID'));
          const names: Names = {
            job: env('EMAIL_E2E_ALERT_JOB'),
            post: env('EMAIL_E2E_ALERT_POST_STEP'),
            failing: env('EMAIL_E2E_ALERT_FAILING_STEP'),
            passing: env('EMAIL_E2E_ALERT_PASSING_STEP'),
          };
          const [run, jobs] = await Promise.all([github(`/repos/${repo}/actions/runs/${id}`), jobsOf(repo, id, 'latest')]);
          const failed = failedJobs(jobs.filter((job) => job.name !== names.job));

          const query = new URLSearchParams({ branch: run.head_branch, event: run.event, per_page: `${LISTED}` });
          const stream: StreamRun[] = (await github(`/repos/${repo}/actions/workflows/${run.workflow_id}/runs?${query}`))
            .workflow_runs;
          const decision = await readStream(
            stream,
            names,
            (entries) => decide({ run, red: failed.length > 0, entries, names }),
            (each) => jobsOf(repo, each.id, 'all'),
          );

          const context: Context = {
            runId: id,
            workflow: run.name,
            event: run.event,
            branch: run.head_branch,
            sha: run.head_sha,
            title: String(run.head_commit?.message ?? '').split('\n')[0],
            repoUrl: `${env('GITHUB_SERVER_URL')}/${repo}`,
            runUrl: run.html_url,
          };
          const outputs = [`shows=${decision.failing ? 'failing' : 'passing'}`];
          let summary: string;
          if (decision.post === null) {
            summary = `Nothing posted to Macro Alerts: ${decision.why}.`;
            outputs.push('post=false');
          } else {
            const message =
              decision.post === 'failure'
                ? failureMessage(context, failed, readFindings(env('EMAIL_E2E_REPORTS')), decision.lastGreen)
                : recoveryMessage(context, decision.failingSince);
            writeFileSync(env('EMAIL_E2E_ALERT_MESSAGE'), message);
            outputs.push('post=true');
            summary = `Posting to Macro Alerts:\n\n${message
              .split('\n')
              .map((line) => `> ${line}`)
              .join('\n')}`;
          }
          appendFileSync(env('GITHUB_OUTPUT'), `${outputs.join('\n')}\n`);
          console.log(summary);
          appendFileSync(env('GITHUB_STEP_SUMMARY'), `### Macro Alerts\n\n${summary}\n`);
        }

        await main();
        NODE_SCRIPT
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EMAIL_E2E_REPORTS: ${{ runner.temp }}/email-e2e-reports
        EMAIL_E2E_ALERT_MESSAGE: ${{ runner.temp }}/email-e2e-alert.md
        EMAIL_E2E_ALERT_JOB: Tell Macro Alerts
        EMAIL_E2E_ALERT_POST_STEP: post to Macro Alerts
        EMAIL_E2E_ALERT_FAILING_STEP: the channel shows it failing
        EMAIL_E2E_ALERT_PASSING_STEP: the channel shows it passing
    - name: post to Macro Alerts
      if: steps.decide.outputs.post == 'true'
      run: |
        set -euo pipefail
        message=$(cat "$EMAIL_E2E_ALERT_MESSAGE")
        if [[ -z "$MACRO_WEBHOOK_URL" || -z "$MACRO_BOT_TOKEN" ]]; then
          echo 'Configure the Macro Alerts webhook URL and bot token' >&2
          exit 1
        fi
        jq -n --arg content "$message" '{content: $content}' |
          curl --fail-with-body --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --header "x-macro-channel-bot-token: $MACRO_BOT_TOKEN" \
            --data-binary @- "$MACRO_WEBHOOK_URL"
      shell: bash
      env:
        MACRO_WEBHOOK_URL: ${{ vars.MACRO_BUILD_ALERT_WEBHOOK_URL }}
        MACRO_BOT_TOKEN: ${{ secrets.MACRO_BUILD_ALERT_BOT_TOKEN }}
        EMAIL_E2E_ALERT_MESSAGE: ${{ runner.temp }}/email-e2e-alert.md
    - name: the channel shows it failing
      if: steps.decide.outputs.shows == 'failing'
      run: echo 'Macro Alerts now shows this workflow failing on this branch.'
    - name: the channel shows it passing
      if: steps.decide.outputs.shows == 'passing'
      run: echo 'Macro Alerts now shows this workflow passing on this branch.'
concurrency:
  group: channels-e2e-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && github.run_id || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false
