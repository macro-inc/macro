# DO NOT EDIT — regenerate with `cargo x workflows` (from rust/cloud-storage).
# Source: rust/cloud-storage/tools/xtask/crates/xtask-workflows/src/workflows/assign_labels.rs
name: Auto Label PRs
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
jobs:
  label:
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        fetch-depth: '0'
        persist-credentials: 'false'
    - id: changed-files
      name: Get changed files
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
      with:
        json: 'true'
        escape_json: 'false'
    - name: Label based on paths
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const changedFiles = JSON.parse(process.env.CHANGED_FILES_JSON || '[]');
          const labels = new Set();

          // Define path-to-label mappings
          const pathMappings = [
            { path: 'rust/cloud-storage', label: 'cloud-storage' },
            { path: 'js/app', label: 'web-app' },
            { path: 'infra', label: 'infra' }
          ];

          // Check each changed file against path mappings
          for (const file of changedFiles) {
            for (const mapping of pathMappings) {
              if (file.startsWith(mapping.path)) {
                labels.add(mapping.label);
              }
            }
          }

          // Add labels to the PR
          if (labels.size > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: Array.from(labels)
            });

            console.log(`Added labels: ${Array.from(labels).join(', ')}`);
          } else {
            console.log('No matching labels found for changed files');
          }
      env:
        CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.all_changed_files }}
