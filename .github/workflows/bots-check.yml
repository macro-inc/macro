# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/bots_check.rs
name: Bots Check
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  check-package:
    name: Bots Package Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @macro-inc/bots
      - name: Check import boundary
        run: bun run --filter @macro-inc/bots check:boundary
      - name: Typecheck
        run: bun run --filter @macro-inc/bots type-check
      - name: Lint
        run: bun run --filter @macro-inc/bots lint
      - name: Test
        run: bun run --filter @macro-inc/bots test
      - name: Build
        run: bun run --filter @macro-inc/bots build
