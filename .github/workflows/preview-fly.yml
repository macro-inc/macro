# DO NOT EDIT — regenerate with `cargo x workflows` (from rust/cloud-storage).
# Source: rust/cloud-storage/tools/xtask/crates/xtask_workflows/src/workflows/preview_fly.rs
name: Fly Preview
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - labeled
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: macro-pr-${{ github.event.pull_request.number }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: |-
          /home/runner/.cache/sccache
          /nix
          ${{ github.workspace }}/rust/cloud-storage/target
      continue-on-error: true
    - name: Set up Namespace Docker builder
      uses: namespacelabs/nscloud-setup-buildx-action@d059ed7184f0bc7c8b27e8810cea153d02bcc6dd
    - name: Build compose service images (fail fast)
      run: docker compose -p macro -f docker-compose.yml build search sync_service websocket_service lexical_service ai_editing_worker
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup dev shell + web deps
      uses: './.github/actions/setup-reqs-web'
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Point sccache at the cache volume
      run: |-
        echo "SCCACHE_DIR=/home/runner/.cache/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=20G" >> "$GITHUB_ENV"
    - name: Build service binaries
      run: |
        cargo x zigbuild
        sccache --show-stats
      working-directory: rust/cloud-storage
    - name: Build xtask_local (runs inside the preview VM)
      run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.36 -p xtask_local
      working-directory: rust/cloud-storage
    - name: Build frontend bundle (same-origin)
      run: bun run --bun build
      env:
        MODE: development
        NODE_ENV: production
        VITE_LOCAL_SERVERS: ALL
        VITE_LOCAL_BACKEND_ORIGIN: same-origin
      working-directory: js/app/packages/app
    - name: Bake init snapshot
      run: |
        just stack up --infra-only --no-doppler --no-build
        just stack snapshot --json
    - name: Dump stack diagnostics
      if: failure()
      run: |
        docker compose -p macro ps --all || true
        for svc in authentication-service proxy fusionauth postgres kafka \
                   connection_gateway document_storage_service email_service \
                   notification_service contacts_service; do
          echo "==================== $svc ===================="
          docker compose -p macro logs --no-color --tail 80 "$svc" 2>&1 || true
        done
    - name: Bake image preload tars
      run: |
        set -euo pipefail
        mkdir -p preview-ctx/preload/images
        docker pull alpine:3
        images=$(docker compose -p macro \
          -f docker-compose.yml \
          -f infra/local/generated/macro/docker-compose.override.yml \
          --env-file infra/local/generated/macro/local.generated.env \
          config --images | sort -u)
        echo "baking images:" $images
        # The infra-only bake never starts the app layer, so images only it
        # runs (proxy, mailpit) haven't been pulled yet.
        for img in $images; do
          docker image inspect "$img" >/dev/null 2>&1 || docker pull "$img"
        done
        # One tar per image, saved concurrently: a single 6GB tar made the
        # VM's boot-time docker load serial and single-threaded (observed
        # 15+ minutes on shared cores) — per-image tars let the entrypoint
        # load them in parallel. Shared base layers get duplicated across
        # tars; that costs a little disk, not boot time. The manifest maps
        # tag -> image ID -> tar so the entrypoint can skip images already
        # present in the machine's persistent /var/lib/docker volume.
        : > preview-ctx/preload/manifest.txt
        pids=""
        for img in $images alpine:3; do
          tarname="$(echo "$img" | tr '/:' '__').tar"
          echo "$(docker image inspect -f '{{.Id}}' "$img") $img $tarname" \
            >> preview-ctx/preload/manifest.txt
          docker save -o "preview-ctx/preload/images/$tarname" "$img" &
          pids="$pids $!"
        done
        for pid in $pids; do wait "$pid"; done
        ls -lh preview-ctx/preload/images/
    - name: Stage preview build context
      run: |
        set -euo pipefail
        # The dev-shell env (BASH_ENV) exports a Nix LD_LIBRARY_PATH; host
        # binaries like rsync then resolve Nix-store libs whose deps drag in
        # Nix glibc mid-process and crash on glibc symbol versions. This step
        # is pure file shuffling — drop it.
        unset LD_LIBRARY_PATH
        ctx=preview-ctx
        mkdir -p "$ctx/repo" "$ctx/artifacts/binaries" "$ctx/bin"
        # The minimal repo layout xtask reads at runtime — including every
        # snapshot-key input, byte-identical to this checkout, so the VM's
        # key matches the snapshot baked above.
        rsync -a --relative --exclude node_modules \
          docker-compose.yml \
          docker-compose-databases.yml \
          infra/stacks/fusionauth-instance/docker-compose.yml \
          infra/local/nginx \
          infra/local/opensearch \
          infra/stacks/opensearch/helpers \
          rust/cloud-storage/macro_db_client/migrations \
          "$ctx/repo/"
        # Service binaries only — the target dir also holds gigabytes of
        # build intermediates.
        find rust/cloud-storage/target/x86_64-unknown-linux-gnu/debug \
          -maxdepth 1 -type f -executable ! -name '*.d' ! -name '*.so' \
          -exec cp {} "$ctx/artifacts/binaries/" \;
        cp -r js/app/packages/app/dist "$ctx/artifacts/frontend-dist"
        cp -r infra/local/generated/.snapshots "$ctx/artifacts/snapshots"
        cp rust/cloud-storage/target/x86_64-unknown-linux-gnu/release/xtask_local "$ctx/bin/xtask"
        cp infra/preview/entrypoint.sh "$ctx/entrypoint.sh"
        cp infra/preview/Dockerfile "$ctx/Dockerfile"
    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
    - name: Deploy to Fly
      run: |
        set -euo pipefail
        if [ -z "$DOPPLER_PREVIEW_TOKEN" ]; then
          echo "DOPPLER_PREVIEW_TOKEN secret is not set (a Doppler service token scoped to the preview config)" >&2
          exit 1
        fi
        if [ -z "$FLY_ORG" ]; then
          echo "FLY_ORG is not set (repo variable or secret with the Fly org slug)" >&2
          exit 1
        fi
        # `|| true`: the create fails once the app exists; real failures
        # (auth, org) surface on the very next flyctl call.
        flyctl apps create "$APP_NAME" --org "$FLY_ORG" || true
        flyctl secrets set --app "$APP_NAME" --stage "DOPPLER_TOKEN=$DOPPLER_PREVIEW_TOKEN"
        # The volume behind fly.toml's /var/lib/docker mount (see the
        # comment there). `volumes create` is not idempotent — guard it.
        if ! flyctl volumes list --app "$APP_NAME" --json \
             | jq -e 'map(select(.name == "docker_data")) | length > 0' >/dev/null; then
          flyctl volumes create docker_data --app "$APP_NAME" --region ewr --size 40 --yes
        fi
        # Machines created before the volume existed can't take the
        # [mounts] config update — recreate them.
        flyctl machine list --app "$APP_NAME" --json \
          | jq -r '.[] | select((.config.mounts // []) | length == 0) | .id' \
          | while read -r id; do
              [ -z "$id" ] || flyctl machine destroy "$id" --app "$APP_NAME" --force || true
            done
        flyctl auth docker
        image="registry.fly.io/$APP_NAME:${{ github.sha }}"
        docker build -t "$image" preview-ctx
        # The preload layer is multi-GB and the Fly registry occasionally
        # aborts such uploads ("s3aws: append to zero-size path
        # unsupported") — retry; layers that made it are reused.
        pushed=""
        for _ in 1 2 3; do
          if docker push "$image"; then pushed=1; break; fi
          echo "docker push failed, retrying" >&2
          sleep 15
        done
        [ -n "$pushed" ]
        # Keep the machine in demand while it boots: with zero inbound
        # traffic, fly-proxy counts a health-failing machine as excess
        # capacity and suspends it mid-boot (observed mid-docker-load).
        # Any response status counts as traffic, and a request also
        # resumes an already-suspended machine.
        (while :; do
          curl -s -o /dev/null --max-time 10 "https://$APP_NAME.fly.dev/" || true
          sleep 15
        done) &
        keepalive=$!
        # First boot does real work before 8090 opens (docker load of the
        # preload tar, snapshot restore, compose up, FusionAuth's JVM) —
        # give the health check more runway than flyctl's default wait.
        rc=0
        flyctl deploy --app "$APP_NAME" \
          --config infra/preview/fly.toml \
          --image "$image" \
          --wait-timeout 1800 \
          --yes || rc=$?
        kill "$keepalive" 2>/dev/null || true
        exit "$rc"
      env:
        FLY_ORG: ${{ vars.FLY_ORG || secrets.FLY_ORG }}
        DOPPLER_PREVIEW_TOKEN: ${{ secrets.DOPPLER_PREVIEW_TOKEN }}
    - name: Dump Fly diagnostics
      if: failure()
      run: |
        flyctl machine list --app "$APP_NAME" || true
        flyctl logs --app "$APP_NAME" --no-tail || true
    - name: Comment preview URL
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const app = process.env.APP_NAME;
          const url = `https://${app}.fly.dev`;
          const marker = '<!-- fly-preview -->';
          const body = [
            marker,
            `🚀 **Full-stack preview**: ${url}`,
            '',
            `- Suspended when idle — the first request wakes it (a few seconds).`,
            `- Log in with any email; the passwordless code lands in [Mailpit](${url}/mailpit/).`,
            `- Deployed from ${context.payload.pull_request.head.sha.slice(0, 7)}.`,
          ].join('\n');
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
concurrency:
  group: fly-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
