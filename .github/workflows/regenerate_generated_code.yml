# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/regenerate_generated_code.rs
name: Regenerate Generated Code
'on':
  push:
    branches:
    - synoet/ci-regen-exp
jobs:
  regenerate:
    if: github.ref == 'refs/heads/synoet/ci-regen-exp'
    name: Regenerate and propose
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    permissions:
      contents: write
      pull-requests: write
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        token: ${{ secrets.GENERATED_CODE_BOT_TOKEN || github.token }}
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build code-mode assets
      run: |
        assets="$(nix build --no-link --print-out-paths --print-build-logs .#code-mode-assets)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"
    - name: Build schema binaries
      run: |
        set -euo pipefail
        read -ra openapi_bins <<< "$(cd apps/web && bun scripts/generate-api-schema.ts --print-cargo-bins)"
        SQLX_OFFLINE=true cargo build "${openapi_bins[@]}" --bin gen_tool_schemas
    - name: Generate API Types
      run: bun run gen-api
      working-directory: apps/web
    - name: Regenerate SDK code
      run: |
        bun install --frozen-lockfile
        bun run sync-specs
        bun run generate
      working-directory: packages/sdk
    - name: Regenerate MCP tool pages
      run: bun run generate:tools
      working-directory: apps/docs
    - name: Regenerate Specta Types
      run: |
        just gen-agent-fold-types
        just gen-database-sql-types
        just gen-dynamic-ui-types
        just gen-agent-review-types
      working-directory: apps/web
    - name: Open or update the pull request
      run: |
        set -euo pipefail
        branch=synoet/ci-regen-bot
        paths=(apps/web/src/lib/service-clients \
          apps/web/src/lib/core/database-sql/generated \
          apps/web/src/features/dynamic-ui/generated \
          packages/lexical-core/generated \
          packages/sdk \
          apps/docs)
        open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
          echo "Generated code on main is up to date."
          if [ -n "$open_pr" ]; then
            gh pr close "$open_pr" --delete-branch --comment "Generated code on main is up to date again."
          fi
          exit 0
        fi
        git status --porcelain -- "${paths[@]}"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -C "$branch"
        git add -- "${paths[@]}"
        git commit -m "chore(generated): regenerate from main at ${GITHUB_SHA:0:10}"
        git push --force origin "$branch"
        if [ -z "$open_pr" ]; then
          gh pr create --base synoet/ci-regen-exp --head "$branch"     --title "[ci-speed] [no preview] bot pull request from the regeneration experiment"     --body "Generated code on main differs from what its Rust sources produce. Created by the Regenerate Generated Code workflow, which keeps this branch current as main moves and closes the pull request once main matches."
        fi
      env:
        GH_TOKEN: ${{ secrets.GENERATED_CODE_BOT_TOKEN || github.token }}
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
