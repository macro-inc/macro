# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/alert_native_build_failures.rs
name: Alert native build failures
on:
  workflow_run:
    types:
      - completed
    workflows:
      - Build Desktop on Tag
      - iOS Preview
      - Release Android App Bundle
permissions:
  actions: read
jobs:
  alert:
    if: contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) || (github.event.workflow_run.conclusion == 'cancelled' && (github.event.workflow_run.name == 'Build Desktop on Tag' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Notify Macro Alerts about failed native builds
        run: |
          set -euo pipefail

          if [[ "$SOURCE_CONCLUSION" == cancelled ]]; then
            # Only a tag's desktop run gets here. A newer run for the same tag cancels
            # the one it replaces (the workflow's concurrency group); that one reports.
            # A dispatch building the tag runs on the branch it was started from, so
            # any newer dispatch counts too; Desktop Release Watch still checks the
            # release's installers.
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/$SOURCE_WORKFLOW_ID/runs?per_page=20"
            newer=$({
              gh api "$runs&branch=$SOURCE_REF"
              gh api "$runs&event=workflow_dispatch"
            } | jq -s --argjson id "$SOURCE_RUN_ID" '[.[].workflow_runs[] | select(.id > $id)] | length')
            if [[ "$newer" != 0 ]]; then
              echo "A newer run may have replaced this one"
              exit 0
            fi
          fi

          failed_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" --paginate |
            jq -sr --arg workflow "$SOURCE_WORKFLOW" '
              [.[].jobs[]
                | select(
                    if $workflow == "Build Desktop on Tag" then
                      # Every job matters: the publish jobs attach the installers and
                      # promote the update feed. A job that ran out of time is cancelled.
                      .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"
                    elif $workflow == "iOS Preview" then
                      (.conclusion == "failure" or .conclusion == "timed_out")
                        and .name == "Build iOS simulator app and publish to Appetize"
                    elif $workflow == "Release Android App Bundle" then
                      (.conclusion == "failure" or .conclusion == "timed_out")
                        and .name == "Build signed Android App Bundle"
                    else false end
                  )
                | .name] | unique | join(", ")
            ')
          echo "Failed jobs: ${failed_jobs:-none}"

          # An iOS or Android release may fail in a deploy or publish job without a
          # native build failing.
          if [[ -z "$failed_jobs" ]]; then
            exit 0
          fi

          if [[ -z "$MACRO_WEBHOOK_URL" || -z "$MACRO_BOT_TOKEN" ]]; then
            echo 'Configure the Macro Alerts webhook URL and bot token' >&2
            exit 1
          fi
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
          case "$SOURCE_CONCLUSION" in
            cancelled) outcome='was cancelled' ;;
            timed_out) outcome='timed out' ;;
            *) outcome=failed ;;
          esac
          message="🚨 $SOURCE_WORKFLOW build $outcome on $SOURCE_REF. Failed jobs: $failed_jobs."
          if [[ "$failed_jobs" == *"QA macOS release app"* ]]; then
            message="$message The macOS release app failed QA, so this version was not promoted to desktop-stable."
          fi
          message="$message $run_url"
          jq -n --arg content "$message" '{content: $content}' |
            curl --fail-with-body --silent --show-error --retry 3 \
              --header 'Content-Type: application/json' \
              --header "x-macro-channel-bot-token: $MACRO_BOT_TOKEN" \
              --data-binary @- "$MACRO_WEBHOOK_URL"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
          MACRO_WEBHOOK_URL: ${{ vars.MACRO_BUILD_ALERT_WEBHOOK_URL }}
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BUILD_ALERT_BOT_TOKEN }}
