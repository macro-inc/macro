# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/test_macrod_update.rs
name: Test macrod update
'on':
  pull_request:
    branches:
    - main
    paths:
    - crates/coding_agent_worker/**
    - '.github/workflows/test_macrod_update.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: macrod update (linux)
    runs-on: namespace-profile-linux-rust-ci
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        nix-cache-url: ${{ vars.NIX_CACHE_URL }}
        nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
      with:
        shell: agent-daemon
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build two tagged releases
      run: crates/coding_agent_worker/e2e/build_releases.sh "$RUNNER_TEMP/releases" v2000.1.1.1 v2000.1.1.2
      shell: bash
      env:
        SQLX_OFFLINE: 'true'
        TARGET: x86_64-unknown-linux-musl
        CARGO_BUILD: cargo zigbuild
        AWS_LC_SYS_CMAKE_BUILDER: '1'
    - name: Self-update end to end
      run: python3 crates/coding_agent_worker/e2e/update_e2e.py --releases "$RUNNER_TEMP/releases" --v1 v2000.1.1.1 --v2 v2000.1.1.2
      shell: bash
    - name: Installer in bash, zsh and fish
      run: nix shell nixpkgs#zsh nixpkgs#fish --command crates/coding_agent_worker/e2e/installer_test.sh "$RUNNER_TEMP/releases" v2000.1.1.1
      shell: bash
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  macos:
    name: macrod update (macos)
    runs-on: nscloud-macos-sequoia-arm64-6x14
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Rust
      uses: './.github/actions/setup-rust'
      with:
        sccache: 'false'
        rust-cache: 'false'
    - name: Build two tagged releases
      run: crates/coding_agent_worker/e2e/build_releases.sh "$RUNNER_TEMP/releases" v2000.1.1.1 v2000.1.1.2
      shell: bash
      env:
        SQLX_OFFLINE: 'true'
    - name: Self-update end to end
      run: python3 crates/coding_agent_worker/e2e/update_e2e.py --releases "$RUNNER_TEMP/releases" --v1 v2000.1.1.1 --v2 v2000.1.1.2
      shell: bash
    - name: Installer in bash and zsh
      run: crates/coding_agent_worker/e2e/installer_test.sh "$RUNNER_TEMP/releases" v2000.1.1.1
      shell: bash
      env:
        INSTALLER_TEST_SHELLS: bash zsh
  windows:
    name: macrod update (windows)
    runs-on: nscloud-windows-2022-amd64-8x16
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Rust
      uses: './.github/actions/setup-rust'
      with:
        sccache: 'false'
        rust-cache: 'false'
    - name: Build two tagged releases
      run: crates/coding_agent_worker/e2e/build_releases.sh "$RUNNER_TEMP/releases" v2000.1.1.1 v2000.1.1.2
      shell: bash
      env:
        SQLX_OFFLINE: 'true'
        AWS_LC_SYS_PREBUILT_NASM: '1'
    - name: Launcher layout and install.ps1
      run: '& ./crates/coding_agent_worker/e2e/windows_test.ps1 -Releases "$env:RUNNER_TEMP/releases" -V1 v2000.1.1.1 -V2 v2000.1.1.2'
      shell: pwsh
    - name: Self-update end to end
      run: '& ./crates/coding_agent_worker/e2e/windows_update_test.ps1 -Releases "$env:RUNNER_TEMP/releases" -V1 v2000.1.1.1 -V2 v2000.1.1.2'
      shell: pwsh
