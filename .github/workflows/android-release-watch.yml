# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/android_release_watch.rs
name: Android Release Watch
'on':
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write
  id-token: write
jobs:
  watch:
    name: Re-run the Android Native Check once the Play release is live
    runs-on: namespace-profile-linux-tiny-no-cache
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    timeout-minutes: 15
    steps:
    - id: prs
      name: Find PRs waiting on a Play release
      run: |
        set -euo pipefail
        prs=$(gh pr list --repo "$GH_REPO" --label android-update --state open \
          --json number,headRefOid,potentialMergeCommit \
          --jq 'map({number, sha: .headRefOid, merge: .potentialMergeCommit.oid})' | jq -c .)
        count=$(jq 'length' <<<"$prs")
        echo "Open PRs labeled android-update: ${count}"
        echo "prs=${prs}" >> "$GITHUB_OUTPUT"
        echo "count=${count}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Checkout
      if: steps.prs.outputs.count != '0'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Bun
      if: steps.prs.outputs.count != '0'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - id: auth
      name: Authenticate to Google Play
      if: steps.prs.outputs.count != '0'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/androidpublisher
        create_credentials_file: 'false'
        export_environment_variables: 'false'
    - name: Re-run the check on PRs whose release is live
      if: steps.prs.outputs.count != '0'
      run: |
        # --- authenticated fetch ------------------------------------------------------
        # gh_fetch <sha|ref>: make a commit that is not in this checkout (the base
        # commit, a moved PR head, GitHub's test merge commit) available. Checkouts
        # may persist credentials, so clear inherited headers before supplying one
        # explicitly. Keep Nix build libraries out of the host Git HTTPS helper.
        # Fails if the commit is unreachable (a force-pushed-away head).
        gh_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          LD_LIBRARY_PATH= git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ------------------------------------------------------------------------------
        # The latest `PR CI` run that ran for commit $1, as {databaseId, status, url},
        # or nothing. Every label starts a `PR CI` run, and runs for labels other than
        # run-ci skip every job, so only a run whose Start job ran counts.
        pr_ci_run() {
          local id
          for id in $(gh api "repos/${GH_REPO}/actions/workflows/pr-ci.yml/runs?head_sha=$1&event=pull_request&per_page=30" \
              --jq '.workflow_runs[].id'); do
            if [[ -n "$(gh api "repos/${GH_REPO}/actions/runs/${id}/jobs" \
                --jq '.jobs[] | select(.name == "Start" and .conclusion != "skipped") | .id')" ]]; then
              gh api "repos/${GH_REPO}/actions/runs/${id}" --jq '{databaseId: .id, status, url: .html_url}'
              return 0
            fi
          done
        }
        # --- Android Play commit statuses ---------------------------------------------
        # Only workflows that run main's copy may sign in to Google Play, so they
        # record what they learn as commit statuses on the PR's commits, where the
        # PR-side jobs (the merge gate, the drift check) read it:
        #
        #   android-play/release  set by Android Play Publish on the commit it built:
        #                         pending just before the production promotion, then
        #                         success or failure.
        #   android-play/live     set by Android Release Watch on the PR head once the
        #                         release is live on production.
        #
        # Readers match the descriptions exactly, so they are built only here.
        # Needs GH_TOKEN and GH_REPO; pr_commit_statuses also PR_NUMBER.

        # android_release_description <version code> <native hash>
        android_release_description() {
          printf 'Version code %s (native tree %s)' "$1" "$2"
        }

        # android_live_description <version code> <native hash> <PR number>
        android_live_description() {
          printf 'Version code %s is live on Google Play (native tree %s, PR #%s)' "$1" "$2" "$3"
        }

        # commit_status <sha> <context>: `<state> <description>` of the commit's latest
        # status with that context, or nothing.
        commit_status() {
          gh api "repos/${GH_REPO}/commits/$1/status" \
            --jq ".statuses[] | select(.context == \"$2\") | \"\(.state) \(.description)\""
        }

        # pr_commit_statuses <context>: `<sha> <state> <description>` for each of PR
        # #PR_NUMBER's last 100 commits that has a status with that context (its
        # latest one), states in lower case like the REST API's.
        pr_commit_statuses() {
          gh api graphql -F owner="${GH_REPO%%/*}" -F name="${GH_REPO#*/}" -F pr="$PR_NUMBER" -F context="$1" \
            -f query='query($owner: String!, $name: String!, $pr: Int!, $context: String!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  commits(last: 100) { nodes { commit { oid status { context(name: $context) { state description } } } } }
                }
              }
            }' \
            --jq '.data.repository.pullRequest.commits.nodes[].commit
              | select(.status.context != null)
              | "\(.oid) \(.status.context.state | ascii_downcase) \(.status.context.description)"'
        }

        # set_commit_status <sha> <context> <state> <description>, linking this run.
        set_commit_status() {
          gh api "repos/${GH_REPO}/statuses/$1" -f context="$2" -f state="$3" -f description="$4" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
        }
        # ------------------------------------------------------------------------------
        set -euo pipefail
        # For each open PR labeled `android-update` (PRS: [{number, sha, merge}]), ask
        # Google Play whether the version code committed at the PR head is live on
        # production, built from the Android native code of the PR's merge result
        # (`merge` is GitHub's test merge commit; the gate hashes the same). When it
        # is, mark the PR head `android-play/live` (the gate cannot ask Play, so it
        # reads that status), and if the PR's latest `Android Native Check` job (of
        # the PR CI run) failed — it fails until the release is live — re-run the
        # run's failed jobs so the gate, and the `CI gate` status that depends on it,
        # go green without anyone clicking "Re-run". GH_TOKEN needs actions:write,
        # pull-requests:write and statuses:write; GOOGLE_PLAY_ACCESS_TOKEN the
        # androidpublisher scope.
        cd apps/web
        conf_path="apps/web/tauri/src-tauri/tauri.android.conf.json"

        check_pr() {
          local pr=$1 number sha merge native_hash version_code live run run_id status run_url job conclusion job_id reruns
          number=$(jq -r '.number' <<<"$pr")
          sha=$(jq -r '.sha' <<<"$pr")
          merge=$(jq -r '.merge // empty' <<<"$pr")
          if [[ -z "$merge" ]]; then
            echo "PR #${number}: no merge commit (conflicts with main?); cannot check the merge result"
            return 0
          fi
          version_code=$(gh api "repos/${GH_REPO}/contents/${conf_path}?ref=${sha}" --jq '.content' | base64 --decode | jq -r '.bundle.android.versionCode')
          gh_fetch "$merge"
          native_hash=$(bun scripts/android-native.mjs hash "$merge")
          echo "PR #${number}: Android version code ${version_code} at ${sha:0:10}, merge-result native hash ${native_hash:0:10}"

          if ! bun scripts/android-play-status.mjs --version-code "$version_code" --require-live \
              --native-hash "$native_hash" --pr "$number" >"$RUNNER_TEMP/status-${number}.log" 2>&1; then
            echo "  not live yet:"
            sed 's/^/    /' "$RUNNER_TEMP/status-${number}.log"
            return 0
          fi
          echo "  live on Google Play production"
          live=$(android_live_description "$version_code" "$native_hash" "$number")
          if [[ "$(commit_status "$sha" android-play/live)" == "success ${live}" ]]; then
            echo "  ${sha:0:10} already marked android-play/live"
          else
            set_commit_status "$sha" android-play/live success "$live"
            echo "  marked ${sha:0:10} android-play/live"
          fi

          run=$(pr_ci_run "$sha")
          if [[ -z "$run" ]]; then
            echo "  no PR CI run for this commit; skipping"
            return 0
          fi
          run_id=$(jq -r '.databaseId' <<<"$run")
          status=$(jq -r '.status' <<<"$run")
          run_url=$(jq -r '.url' <<<"$run")
          if [[ "$status" != "completed" ]]; then
            echo "  PR CI run ${run_id} is ${status}; skipping"
            return 0
          fi
          job=$(gh run view "$run_id" --json jobs \
            --jq '.jobs[] | select(.name == "Web App / Android Native Check") | {id: .databaseId, conclusion}')
          if [[ -z "$job" ]]; then
            echo "  run ${run_id} has no Android Native Check job; skipping"
            return 0
          fi
          job_id=$(jq -r '.id' <<<"$job")
          conclusion=$(jq -r '.conclusion' <<<"$job")
          if [[ "$conclusion" == "success" ]]; then
            echo "  Android Native Check already passed"
            return 0
          fi
          if [[ "$conclusion" != "failure" ]]; then
            echo "  Android Native Check job concluded ${conclusion}; leaving it alone"
            return 0
          fi
          # If our re-run also fails something else is wrong (the job's log says
          # what), so stop after two rather than retrying every half hour forever.
          reruns=$(gh pr view "$number" --json comments --jq \
            "[.comments[].body | select(contains(\"Re-ran the **Android Native Check**\")) | select(contains(\"version code ${version_code}\"))] | length")
          if (( reruns >= 2 )); then
            echo "  Android Native Check already re-run ${reruns} times and still failing; not re-running again — see ${run_url}"
            return 0
          fi
          # Re-run the failed jobs, not just this one: the CI gate job that sets the
          # required status depends on it from outside the called web workflow.
          echo "  re-running Android Native Check (job ${job_id} of run ${run_id}; ${reruns} automatic re-runs so far)"
          gh run rerun "$run_id" --failed
          gh pr comment "$number" --body "🤖 Android version code ${version_code} is live on Google Play. Re-ran the **Android Native Check** ([run](${run_url})); this PR can merge once it passes."
        }

        # One PR's API hiccup must not stop the others from being checked this
        # half hour: each PR runs in its own errexit subshell.
        failed=0
        while read -r pr; do
          set +e
          ( set -e; check_pr "$pr" )
          rc=$?
          set -e
          if (( rc != 0 )); then
            echo "  error while checking PR $(jq -r '.number' <<<"$pr") (exit ${rc}); continuing"
            failed=1
          fi
        done < <(jq -c '.[]' <<<"$PRS")
        exit $failed
      shell: bash
      env:
        PRS: ${{ steps.prs.outputs.prs }}
        GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
