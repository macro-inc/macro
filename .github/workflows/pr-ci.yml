              'GET',
              `/repos/${repo()}/commits/${sha}/statuses?per_page=100&page=${page}`,
            );
            statuses.push(...batch);
            if (batch.length < 100) {
              return statuses;
            }
          }
        }

        async function pagedJobs(path: string): Promise<RunJob[]> {
