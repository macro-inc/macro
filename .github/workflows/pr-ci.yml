# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/pr_ci.rs
name: PR CI
on:
  pull_request:
    types:
    - labeled
    branches:
    - main
jobs:
  start:
    if: github.event.label.name == 'run-ci'
    name: Start
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      attested: ${{ steps.attestations.outputs.attested }}
      audited: ${{ steps.attestations.outputs.audited }}
      sources: ${{ steps.attestations.outputs.sources }}
      infra: ${{ steps.filter.outputs.infra }}
      conventions: ${{ steps.filter.outputs.conventions }}
      cargo_deny: ${{ steps.filter.outputs.cargo_deny }}
      workspace_dependencies: ${{ steps.filter.outputs.workspace_dependencies }}
      generated_workflows: ${{ steps.filter.outputs.generated_workflows }}
      node_modules_nix: ${{ steps.filter.outputs.node_modules_nix }}
      tauri_lockfiles: ${{ steps.filter.outputs.tauri_lockfiles }}
      sdk: ${{ steps.filter.outputs.sdk }}
      observability_image: ${{ steps.filter.outputs.observability_image }}
      macrod_update: ${{ steps.filter.outputs.macrod_update }}
    timeout-minutes: 5
    steps:
    - name: Take the request
      run: |
        node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
        // Sets the commit status `main` requires before a merge: it is green only on a
        // commit that a requested `PR CI` run passed. `CI_GATE_MODE` picks the step:
        //
        //   remind  a new commit: pending "not run" with the command to run it, unless
        //           the commit already has a gate status
        //   start   a requested run begins: remove the label, check the merge commit
        //           holds the PR head, set pending
        //   attestations  after start: which attested checks this run skips
        //   finish  the run ends: success when every job passed or was skipped
        //   label   the label goes on a PR: fail when it can't start PR CI, because the
        //           PR conflicts with main or its merge commit predates PR CI
        //   fork-request  the label goes on a fork PR: what start does with a write
        //                 token, from a trusted run of `main`'s workflow
        //   fork    after a fork PR's run, whose read-only token could not set the status
        //
        // Statuses go on the PR head commit, so a later push starts without one.
        //
        // An attested check is a job its author ran on their own machine with
        // `cargo x attest`, which posts an `attested/<check>` status on the head. Only
        // someone who can push to the repository can post a status. The status names
        // the check as it was defined (`fp`) and a hash of the paths it read (`src`).
        // Start hashes the same paths in the merge commit this run tests and accepts a
        // status that names both, so a pass stands for exactly the files it ran on.
        // Each accepted check has one chance in `AUDIT_ONE_IN` of running on a runner
        // anyway; one that fails there is withdrawn for those files, and `finish`
        // names it. `finish` reads the statuses again, because a re-run of failed jobs
        // keeps what Start decided.
        //
        // A fork PR's run uses the workflow files of its merge commit, so a fork that
        // edits them decides its own verdict. Both fork steps fail closed instead: the
        // fork's CI sources must be the trees it branched from (`ciSourceChanges`).

        import { execFileSync } from 'node:child_process';
        import { createHash, randomInt } from 'node:crypto';
        import { appendFileSync, mkdtempSync, readFileSync } from 'node:fs';
        import { tmpdir } from 'node:os';
        import { join } from 'node:path';

        const API = 'https://api.github.com';
        const DESCRIPTION_LIMIT = 140;
        // For a request that is safe to repeat: a read, or posting a status.
        const ATTEMPTS = 3;
        // How many attested checks a failing verdict names; the log has them all.
        const NAMED_CHECKS = 2;
        // An open request. Only trusted runs set statuses: a fork's token can't.
        const RUNNING = 'Running on';
        // Job names in `PR CI`; the fork step reads them back from the finished run.
        export const START_JOB = 'Start';
        export const GATE_JOB = 'CI gate';
        // The workflow whose jobs the fork step trusts, and the trees that define it:
        // the generated workflows and the Rust that generates them.
        export const PR_CI_PATH = '.github/workflows/pr-ci.yml';
        export const CI_SOURCES = ['.github', 'tooling/xtask/crates/xtask_workflows'] as const;
        export const STALE_MERGE =
          "PR CI can't start: this PR's merge commit predates PR CI. Merge main in, push, and add the run-ci label again.";
        export const CONFLICTS =
          "PR CI can't start: this PR conflicts with main. Merge main in, push, and add the run-ci label again.";
        export const FORK_CHANGES_CI =
          'fork changes CI workflows: a maintainer must review and run CI from a branch';

        type State = 'pending' | 'success' | 'failure' | 'error';
        export type Needs = Record<string, { result: string }>;
        export type RunJob = { name: string; conclusion: string | null; run_attempt?: number };
        type Outcome = { state: State; description: string } | null;
        export type CommitStatus = { context: string; state: string; description: string | null };
        /// A job that can be attested, as Start accepts it: the paths it reads are
        /// hashed in the merge commit. `.` is the whole tree.
        export type AttestableCheck = { id: string; fingerprint: string; inputs: string[] };
        /// A job that can be attested, as the gate finds it in a run.
        export type GateCheck = { id: string; name: string };
        /// The git object at each path of a commit's tree; absent where there is none.
        export type Objects = Record<string, string>;
        /// The hash of each check's inputs in the merge commit a run tests.
        export type Sources = Record<string, string>;
        /// Git tree SHA of each CI source at a commit; null where the path is missing.
        export type CiTrees = Record<string, string | null>;

        function env(name: string): string {
          const value = process.env[name];
          if (!value) {
            throw new Error(`${name} is not set`);
          }
          return value;
        }

        /// Whether a path exists at a ref.
        async function exists(path: string, ref: string): Promise<boolean> {
          const response = await fetch(`${API}/repos/${repo()}/contents/${path}?ref=${ref}`, {
            method: 'HEAD',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${env('GH_TOKEN')}`,
              'x-github-api-version': '2022-11-28',
            },
          });
          if (response.status === 404) {
            return false;
          }
          if (!response.ok) {
            throw new Error(`HEAD contents/${path}?ref=${ref}: HTTP ${response.status}`);
          }
          return true;
        }

        /// One request, tried again up to `attempts` times when GitHub or the network
        /// fails it.
        async function request(
          method: string,
          path: string,
          body: unknown,
          attempts: number,
        ): Promise<Response> {
          for (let attempt = 1; ; attempt++) {
            const last = attempt >= attempts;
            try {
              const response = await fetch(`${API}${path}`, {
                method,
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${env('GH_TOKEN')}`,
                  'x-github-api-version': '2022-11-28',
                },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              if (response.status < 500 || last) {
                return response;
              }
            } catch (error) {
              if (last) {
                throw error;
              }
            }
            await new Promise((resolve) => setTimeout(resolve, attempt * 2_000));
          }
        }

        async function github(
          method: string,
          path: string,
          body?: unknown,
          attempts = method === 'GET' ? ATTEMPTS : 1,
        ): Promise<any> {
          const response = await request(method, path, body, attempts);
          // Removing a label that is already gone is the outcome we wanted.
          if (method === 'DELETE' && response.status === 404) {
            return null;
          }
          if (!response.ok) {
            throw new Error(`${method} ${path}: HTTP ${response.status} ${await response.text()}`);
          }
          return response.status === 204 ? null : response.json();
        }

        const repo = () => env('GITHUB_REPOSITORY');
        const context = () => env('CI_GATE_CONTEXT');
        const label = () => env('CI_GATE_LABEL');

        /// REST, because `gh pr edit` fails on older gh releases.
        export function runCommand(repository: string, pr: string, labelName: string): string {
          return `gh api repos/${repository}/issues/${pr}/labels -f "labels[]=${labelName}"`;
        }

        /// The finished run's verdict from `toJSON(needs)`. Start must have succeeded;
        /// a called workflow may be skipped, because its path filter did not match.
        /// Null when start failed: it already set a status that says why.
        export function gateOutcome(needs: Needs, head: string): Outcome {
          if (needs.start?.result !== 'success') {
            return null;
          }

          const failed = Object.entries(needs)
            .filter(([, need]) => need.result !== 'success' && need.result !== 'skipped')
            .map(([job]) => job);

          if (failed.length > 0) {
            return { state: 'failure', description: `Failed: ${failed.join(', ')}` };
          }

          return { state: 'success', description: `Passed on ${head.slice(0, 7)}` };
        }

        /// GitHub treats status contexts that differ only in case as one.
        const sameContext = (left: string, right: string) => left.toLowerCase() === right.toLowerCase();

        /// What identifies the files a check read: each input path with the git
        /// object it holds, hashed. `cargo x attest` computes the same over the
        /// working tree's commit (`inputs_hash` in `xtask_attest`); both tests pin
        /// one value.
        export function inputsHash(inputs: string[], objects: Objects): string {
          const lines = [...inputs].sort().map((path) => `${path}\t${objects[path] ?? '-'}\n`);
          return createHash('sha256').update(lines.join('')).digest('hex').slice(0, 16);
        }

        /// The check and the files a status vouches for, or null for a status
        /// `cargo x attest` did not write.
        function claim(status: CommitStatus): { fingerprint: string; source: string } | null {
          const stated = /^fp=([0-9a-f]{16}) src=([0-9a-f]{16})(?: |$)/.exec(status.description ?? '');
          return stated ? { fingerprint: stated[1], source: stated[2] } : null;
        }

        /// The checks a run may skip. A check counts when some status says it passed
        /// as this run defines it (its fingerprint) on the files this run tests (the
        /// hash of its inputs in `sources`), and no status says it failed on them: a
        /// failure is final for those files, whatever was posted before or after.
        export function acceptedAttestations(
          statuses: CommitStatus[],
          checks: AttestableCheck[],
          prefix: string,
          sources: Sources,
        ): string[] {
          return checks
            .filter((check) => {
              const source = sources[check.id];
              const mine = statuses.filter((status) => {
                const stated = sameContext(status.context, `${prefix}${check.id}`) ? claim(status) : null;
                return stated?.fingerprint === check.fingerprint && stated.source === source;
              });
              return (
                source !== undefined &&
                mine.some((status) => status.state === 'success') &&
                mine.every((status) => status.state === 'success')
              );
            })
            .map((check) => check.id);
        }

        /// Which accepted checks run on a runner anyway. Each is drawn by itself, so
        /// every run with attestations checks a few of them and none checks all.
        export function drawAudits(
          accepted: string[],
          oneIn: number,
          roll: (below: number) => number,
        ): { attested: string[]; audited: string[] } {
          const audited = accepted.filter(() => roll(oneIn) === 0);
          return { attested: accepted.filter((id) => !audited.includes(id)), audited };
        }

        function jobsOf(check: GateCheck, jobs: RunJob[]): RunJob[] {
          return jobs.filter((job) => job.name === check.name);
        }

        /// The accepted checks whose jobs this run skipped.
        export function skippedAttested(entries: string[], checks: GateCheck[], jobs: RunJob[]): string[] {
          return checks
            .filter((check) => entries.includes(check.id))
            .filter((check) => {
              const own = jobsOf(check, jobs);
              return own.length > 0 && own.every((job) => job.conclusion === 'skipped');
            })
            .map((check) => check.id);
        }

        /// The attested checks an audit ran here and did not see pass: a job that
        /// failed, timed out or was cancelled. A skipped job is one the change does
        /// not select.
        export function auditFailures(audited: string[], checks: GateCheck[], jobs: RunJob[]): string[] {
          const passed = (job: RunJob) => job.conclusion === 'success' || job.conclusion === 'skipped';
          return checks
            .filter((check) => audited.includes(check.id))
            .filter((check) => jobsOf(check, jobs).some((job) => !passed(job)))
            .map((check) => check.id);
        }

        /// The checks Start accepted on an attestation that no longer holds: withdrawn
        /// since. `current` is what Start would accept now. Whether the job was
        /// skipped is not asked: a later attempt does not list every job of an
        /// earlier one.
        export function withdrawnAttestations(entries: string[], current: string[]): string[] {
          return entries.filter((entry) => !current.includes(entry));
        }

        /// The entries a run took on trust: those whose check did not also run and
        /// pass here.
        export function trustedEntries(entries: string[], checks: GateCheck[], jobs: RunJob[]): string[] {
          const ranAndPassed = (id: string) => {
            const check = checks.find((each) => each.id === id);
            const own = check ? jobsOf(check, jobs) : [];
            return own.length > 0 && own.every((job) => job.conclusion === 'success');
          };
          return entries.filter((entry) => !ranAndPassed(entry));
        }

        /// Each job of a run as its newest attempt left it. A re-run of some jobs
        /// keeps the others' results from the attempt that ran them. Of two records
        /// of a job that no attempt number tells apart, the one that vouches for
        /// less is kept, whatever order GitHub lists them in: not passed, then
        /// skipped, then passed.
        export function newestJobs(jobs: RunJob[]): RunJob[] {
          const vouches = (job: RunJob) =>
            job.conclusion === 'success' ? 2 : job.conclusion === 'skipped' ? 1 : 0;
          const newest = new Map<string, RunJob>();
          for (const job of jobs) {
            const known = newest.get(job.name);
            const attempt = job.run_attempt ?? 0;
            const knownAttempt = known?.run_attempt ?? 0;
            if (
              !known ||
              attempt > knownAttempt ||
              (attempt === knownAttempt && vouches(job) < vouches(known))
            ) {
              newest.set(job.name, job);
            }
          }
          return [...newest.values()];
        }

        /// The first few of a list by name, and how many more there are: a status
        /// description is cut at `DESCRIPTION_LIMIT`.
        function named(ids: string[]): string {
          const rest = ids.length - NAMED_CHECKS;
          return rest > 0 ? `${ids.slice(0, NAMED_CHECKS).join(', ')} and ${rest} more` : ids.join(', ');
        }

        /// The verdict with what attestation did to it: the checks a passing run took
        /// on trust, or the attested checks an audit caught failing.
        export function withAttestations(
          outcome: { state: State; description: string },
          skipped: string[],
          failures: string[],
        ): { state: State; description: string } {
          if (outcome.state === 'success' && skipped.length > 0) {
            return {
              state: outcome.state,
              description: `${outcome.description}, ${skipped.length} attested: ${skipped.join(', ')}`,
            };
          }
          if (outcome.state !== 'success' && failures.length > 0) {
            return {
              state: outcome.state,
              description: `Attested but failed here: ${named(failures)}. ${outcome.description}`,
            };
          }
          return outcome;
        }

        /// A fork run's verdict from its jobs. Null when the run was not a request
        /// (unrelated label) or did not finish (cancelled).
        export function forkOutcome(jobs: RunJob[], head: string, labelName: string): Outcome {
          const start = jobs.find((job) => job.name === START_JOB);
          const gate = jobs.find((job) => job.name === GATE_JOB);

          if (!start || start.conclusion === 'skipped' || start.conclusion === 'cancelled') {
            return null;
          }

          if (start.conclusion !== 'success') {
            return {
              state: 'failure',
              description: `Could not start on ${head.slice(0, 7)}. Add the ${labelName} label again.`,
            };
          }

          if (gate?.conclusion === 'success') {
            return { state: 'success', description: `Passed on ${head.slice(0, 7)}` };
          }

          if (gate?.conclusion === 'failure') {
            return { state: 'failure', description: 'Failed: see the PR CI run' };
          }

          return null;
        }

        /// The CI sources whose tree differs between a fork head and the commit it
        /// branched from. A source missing from either side counts as changed.
        export function ciSourceChanges(head: CiTrees, base: CiTrees): string[] {
          return CI_SOURCES.filter((path) => !head[path] || !base[path] || head[path] !== base[path]);
        }

        /// Why a finished fork run can't be trusted, or null. The workflow is matched
        /// by name, so a fork can add another file named `PR CI`; and even `pr-ci.yml`
        /// is the fork's copy unless the CI sources are unchanged.
        export function forkRunDistrust(runPath: string, changes: string[]): string | null {
          if (changes.length > 0) {
            return FORK_CHANGES_CI;
          }
          if (runPath !== PR_CI_PATH) {
            return `The run came from ${runPath}, not ${PR_CI_PATH}`;
          }
          return null;
        }

        /// Why the label can't start PR CI, or null. GitHub runs no `pull_request`
        /// workflow on a conflicting PR, and takes the workflow files from the PR's
        /// merge commit, which it refreshes on a push but not when main moves on.
        export function labelBlocker(mergeable: boolean | null, mergeHasPrCi: boolean): string | null {
          if (mergeable === false) {
            return CONFLICTS;
          }
          if (!mergeHasPrCi) {
            return STALE_MERGE;
          }
          return null;
        }

        async function postStatus(
          sha: string,
          statusContext: string,
          state: State,
          description: string,
          targetUrl: string,
        ) {
          // A status posted twice reads the same as one posted once.
          await github(
            'POST',
            `/repos/${repo()}/statuses/${sha}`,
            {
              state,
              context: statusContext,
              description: description.slice(0, DESCRIPTION_LIMIT),
              target_url: targetUrl,
            },
            ATTEMPTS,
          );
          console.log(`${statusContext} on ${sha.slice(0, 10)}: ${state}: ${description}`);
        }

        const setStatus = (sha: string, state: State, description: string, targetUrl: string) =>
          postStatus(sha, context(), state, description, targetUrl);

        /// Every status on a commit, newest first.
        async function commitStatuses(sha: string): Promise<CommitStatus[]> {
          const statuses: CommitStatus[] = [];
          for (let page = 1; ; page++) {
            const batch: CommitStatus[] = await github(
              'GET',
              `/repos/${repo()}/commits/${sha}/statuses?per_page=100&page=${page}`,
            );
            statuses.push(...batch);
            if (batch.length < 100) {
              return statuses;
            }
          }
        }

        async function pagedJobs(path: string): Promise<RunJob[]> {
          const jobs: RunJob[] = [];
          for (let page = 1; ; page++) {
            const { jobs: batch } = await github(
              'GET',
              `/repos/${repo()}/actions/runs/${path}per_page=100&page=${page}`,
            );
            jobs.push(...batch);
            if (batch.length < 100) {
              return jobs;
            }
          }
        }

        /// Every job of one attempt of a run.
        const runJobs = (run: string, attempt: string) => pagedJobs(`${run}/attempts/${attempt}/jobs?`);

        /// Every job of a run, as the newest attempt that ran it left it.
        const latestRunJobs = async (run: string) => newestJobs(await pagedJobs(`${run}/jobs?filter=all&`));

        /// The newest gate status on a commit (GitHub lists statuses newest first).
        async function gateStatus(sha: string): Promise<{ state: string; description: string } | undefined> {
          const statuses: { context: string; state: string; description: string | null }[] = await github(
            'GET',
            `/repos/${repo()}/commits/${sha}/statuses?per_page=100`,
          );
          const status = statuses.find((each) => each.context === context());
          return status && { state: status.state, description: status.description ?? '' };
        }

        /// Whether a trusted step opened a request on this commit that no result has
        /// closed yet.
        export function isOpenRequest(status: { state: string; description: string } | undefined): boolean {
          return status?.state === 'pending' && status.description.startsWith(RUNNING);
        }

        /// The tree SHA at `path` in a commit, walking one directory at a time.
        async function treeAt(commit: string, path: string): Promise<string | null> {
          let tree: string = (await github('GET', `/repos/${repo()}/git/commits/${commit}`)).tree.sha;
          for (const part of path.split('/')) {
            const { tree: entries }: { tree: { path: string; type: string; sha: string }[] } = await github(
              'GET',
              `/repos/${repo()}/git/trees/${tree}`,
            );
            const entry = entries.find((each) => each.path === part && each.type === 'tree');
            if (!entry) {
              return null;
            }
            tree = entry.sha;
          }
          return tree;
        }

        async function ciTrees(commit: string): Promise<CiTrees> {
          const trees: CiTrees = {};
          for (const path of CI_SOURCES) {
            trees[path] = await treeAt(commit, path);
          }
          return trees;
        }

        /// The CI sources a fork head changed since it branched from `base`.
        async function forkCiChanges(base: string, head: string): Promise<string[]> {
          const compare = await github('GET', `/repos/${repo()}/compare/${base}...${head}`);
          const changes = ciSourceChanges(await ciTrees(head), await ciTrees(compare.merge_base_commit.sha));
          if (changes.length > 0) {
            console.log(`${head.slice(0, 10)} changes ${changes.join(', ')}`);
          }
          return changes;
        }

        async function removeLabel(pr: string) {
          await github('DELETE', `/repos/${repo()}/issues/${pr}/labels/${encodeURIComponent(label())}`);
        }

        /// Why a label on the PR can't start PR CI, from GitHub's view of it now.
        /// GitHub computes mergeability in the background, so wait briefly for it.
        async function labelProblem(pr: string): Promise<string | null> {
          let pull = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          for (let attempt = 0; pull.mergeable === null && attempt < 6; attempt++) {
            await new Promise((resolve) => setTimeout(resolve, 5_000));
            pull = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          }
          const merge: string | null = pull.merge_commit_sha;
          const hasPrCi = merge !== null && (await exists(PR_CI_PATH, merge));
          return labelBlocker(pull.mergeable, hasPrCi);
        }

        async function labelCheck() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');
          const problem = await labelProblem(pr);
          if (!problem) {
            console.log(`#${pr}'s merge commit holds ${PR_CI_PATH}; PR CI takes it from here.`);
            return;
          }
          // The label stays otherwise, and adding it again must fire a new event.
          await removeLabel(pr);
          await setStatus(head, 'failure', problem, env('CI_GATE_DOCS_URL'));
        }

        async function remind() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');

          // A re-open or leaving draft keeps the head, so it may have a result already.
          if (await gateStatus(head)) {
            console.log(`${head.slice(0, 10)} already has a ${context()} status`);
            return;
          }

          await setStatus(
            head,
            'pending',
            `Not run on this commit. Run: ${runCommand(repo(), pr, label())}`,
            env('CI_GATE_DOCS_URL'),
          );
        }

        async function start() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');
          const runUrl = env('RUN_URL');
          const sameRepo = env('SAME_REPO') === 'true';

          // Fork tokens are read-only; the fork request step did both already.
          if (sameRepo) {
            await removeLabel(pr);
          }

          // A label added right after a push can carry the previous head, or a merge
          // commit GitHub has not rebuilt yet. Either would test an old commit.
          const pull = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          if (pull.head.sha !== head) {
            const description = `The PR moved on from ${head.slice(0, 7)} to ${pull.head.sha.slice(0, 7)}. Run again: ${runCommand(repo(), pr, label())}`;
            if (sameRepo) {
              await setStatus(head, 'failure', description, runUrl);
            }
            throw new Error(description);
          }

          const merge = await github('GET', `/repos/${repo()}/commits/${env('MERGE_SHA')}`);
          const parents: string[] = merge.parents.map((parent: { sha: string }) => parent.sha);

          if (!parents.includes(head)) {
            const description = `The merge commit did not include ${head.slice(0, 7)} yet. Run again: ${runCommand(repo(), pr, label())}`;
            if (sameRepo) {
              await setStatus(head, 'failure', description, runUrl);
            }
            throw new Error(description);
          }

          if (sameRepo) {
            await setStatus(head, 'pending', `${RUNNING} ${head.slice(0, 7)}`, runUrl);
          }
        }

        function git(directory: string, args: string[]): string {
          return execFileSync('git', ['-C', directory, ...args], { encoding: 'utf8' });
        }

        /// The git object at each path in a commit. Only the commit's trees are
        /// fetched, which is all a path's object id needs.
        function objectsAt(commit: string, paths: string[]): Objects {
          const directory = mkdtempSync(join(tmpdir(), 'attested-inputs-'));
          const login = Buffer.from(`x-access-token:${env('GH_TOKEN')}`).toString('base64');
          git(directory, ['init', '--quiet']);
          git(directory, [
            '-c',
            `http.extraheader=AUTHORIZATION: basic ${login}`,
            'fetch',
            '--quiet',
            '--depth=1',
            '--filter=blob:none',
            `${env('GITHUB_SERVER_URL')}/${repo()}.git`,
            commit,
          ]);

          const objects: Objects = {};
          const below = paths.filter((path) => path !== '.');
          if (below.length > 0) {
            for (const entry of git(directory, ['ls-tree', '-z', 'FETCH_HEAD', '--', ...below]).split('\0')) {
              const [described, path] = entry.split('\t');
              if (path) {
                objects[path] = described.split(' ')[2];
              }
            }
          }
          if (paths.includes('.')) {
            objects['.'] = git(directory, ['rev-parse', 'FETCH_HEAD^{tree}']).trim();
          }
          return objects;
        }

        /// The hash of each check's inputs in a commit.
        function sourcesAt(commit: string, checks: AttestableCheck[]): Sources {
          const objects = objectsAt(commit, [...new Set(checks.flatMap((check) => check.inputs))]);
          return Object.fromEntries(checks.map((check) => [check.id, inputsHash(check.inputs, objects)]));
        }

        /// Which attested checks the run skips, and which of them it runs anyway. A
        /// fork's statuses are not read: its run is trusted only through the fork
        /// steps. The merge commit is read only when the head carries an attestation,
        /// so an ordinary run does nothing new here. A lookup that fails leaves
        /// nothing attested, and every job runs as it would without attestation.
        async function attestations() {
          const head = env('HEAD_SHA');
          const prefix = env('ATTESTED_PREFIX');
          const checks: AttestableCheck[] = JSON.parse(env('ATTESTABLE_CHECKS'));

          let sources: Sources = {};
          let accepted: string[] = [];
          if (env('SAME_REPO') === 'true') {
            try {
              const statuses = await commitStatuses(head);
              if (statuses.some((status) => status.context.toLowerCase().startsWith(prefix))) {
                sources = sourcesAt(env('MERGE_SHA'), checks);
                accepted = acceptedAttestations(statuses, checks, prefix, sources);
              }
            } catch (error) {
              console.log(`::warning::Could not read this commit's attestations, so every job runs: ${error}`);
              accepted = [];
            }
          }

          const { attested, audited } = drawAudits(accepted, Number(env('AUDIT_ONE_IN')), randomInt);
          console.log(`Attested: ${attested.join(', ') || 'none'}`);
          if (audited.length > 0) {
            console.log(`Attested, and run here too as an audit: ${audited.join(', ')}`);
          }

          const relied = Object.fromEntries(accepted.map((id) => [id, sources[id]]));
          appendFileSync(
            env('GITHUB_OUTPUT'),
            `attested=${JSON.stringify(attested)}\naudited=${JSON.stringify(audited)}\nsources=${JSON.stringify(relied)}\n`,
          );
        }

        /// Why a run that took checks on attestation can no longer pass, or null.
        /// Start decided what to skip, and a re-run of failed jobs keeps that decision
        /// while the commit's statuses move on: an attestation is withdrawn, by its
        /// author or by another run's audit. When GitHub can't say, nothing is
        /// vouched for.
        async function attestationsLapsed(
          head: string,
          entries: string[],
          sources: Sources,
        ): Promise<string | null> {
          let statuses: CommitStatus[];
          try {
            statuses = await commitStatuses(head);
          } catch (error) {
            console.log(`::warning::Could not read this commit's attestations again: ${error}`);
            return `Could not read the attestations again. Add the ${label()} label again.`;
          }

          const current = acceptedAttestations(
            statuses,
            JSON.parse(env('ATTESTABLE_CHECKS')),
            env('ATTESTED_PREFIX'),
            sources,
          );
          const withdrawn = withdrawnAttestations(entries, current);
          if (withdrawn.length > 0) {
            console.log(`No longer attested: ${withdrawn.join(', ')}`);
            return `No longer attested: ${named(withdrawn)}. Add the ${label()} label again.`;
          }
          return null;
        }

        /// What a runner contradicted stops counting, for any run that asks: each
        /// failed check gets a failure for the definition and the files it failed
        /// on. The gate is failing already, so a write GitHub refuses only warns.
        async function withdrawFailedAudits(head: string, failures: string[], sources: Sources) {
          const checks: AttestableCheck[] = JSON.parse(env('ATTESTABLE_CHECKS'));
          for (const id of failures) {
            const fingerprint = checks.find((check) => check.id === id)?.fingerprint;
            await postStatus(
              head,
              `${env('ATTESTED_PREFIX')}${id}`,
              'failure',
              `fp=${fingerprint} src=${sources[id]} failed on a runner`,
              env('RUN_URL'),
            ).catch((error) => console.log(`::warning::Could not withdraw ${id}: ${error}`));
          }
        }

        /// What attestation did to a finished run's verdict. Throws when GitHub can't
        /// list the run's jobs.
        async function attestedOutcome(
          head: string,
          verdict: { state: State; description: string },
          entries: string[],
          audited: string[],
          sources: Sources,
        ): Promise<{ state: State; description: string }> {
          const checks: GateCheck[] = JSON.parse(env('GATE_CHECKS'));
          const jobs = await latestRunJobs(env('RUN_ID'));
          const failures = auditFailures(audited, checks, jobs);
          if (failures.length > 0) {
            console.log(`Attested but failed here: ${failures.join(', ')}`);
            await withdrawFailedAudits(head, failures, sources);
          }

          const trusted = trustedEntries(entries, checks, jobs);
          const lapsed = trusted.length > 0 ? await attestationsLapsed(head, trusted, sources) : null;
          if (lapsed) {
            return { state: 'failure', description: lapsed };
          }
          return withAttestations(verdict, skippedAttested(entries, checks, jobs), failures);
        }

        async function finish() {
          const head = env('HEAD_SHA');
          const verdict = gateOutcome(JSON.parse(env('NEEDS')), head);

          if (!verdict) {
            console.log('Start did not succeed; its status stands.');
            process.exitCode = 1;
            return;
          }

          // Start's outputs are empty when it ran before attestation existed.
          const entries: string[] = JSON.parse(process.env.ATTESTED || '[]');
          const audited: string[] = JSON.parse(process.env.AUDITED || '[]');
          const sources: Sources = JSON.parse(process.env.SOURCES || '{}');
          let outcome = verdict;
          if (entries.length + audited.length > 0) {
            // The gate must end on a verdict. A failing one stands as it is; a
            // passing one that took checks on trust can't be confirmed.
            outcome = await attestedOutcome(head, verdict, entries, audited, sources).catch((error) => {
              console.log(`::warning::Could not read this run's jobs: ${error}`);
              return verdict.state === 'success' && entries.length > 0
                ? {
                    state: 'failure' as const,
                    description: `Could not confirm what this run skipped. Add the ${label()} label again.`,
                  }
                : verdict;
            });
          }

          if (env('SAME_REPO') === 'true') {
            await setStatus(head, outcome.state, outcome.description, env('RUN_URL'));
          }

          if (outcome.state !== 'success') {
            console.log(`::error::${outcome.description}`);
            process.exitCode = 1;
          }
        }

        async function forkRequest() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');

          await removeLabel(pr);

          const problem = await labelProblem(pr);
          if (problem) {
            await setStatus(head, 'failure', problem, env('CI_GATE_DOCS_URL'));
            return;
          }

          // The run the label starts would use the fork's own workflow files.
          if ((await forkCiChanges(env('BASE_REF'), head)).length > 0) {
            await setStatus(head, 'failure', FORK_CHANGES_CI, env('PR_CHECKS_URL'));
            return;
          }

          await setStatus(head, 'pending', `${RUNNING} ${head.slice(0, 7)}`, env('PR_CHECKS_URL'));
        }

        async function fork() {
          const event = JSON.parse(readFileSync(env('GITHUB_EVENT_PATH'), 'utf8'));
          const run = event.workflow_run;
          const head: string = run.head_sha;

          // The request step opened this on the head the label was added at. A run on
          // any other commit, such as one the fork pushed with a rewritten workflow,
          // or a run after the result is in, finds no open request.
          if (!isOpenRequest(await gateStatus(head))) {
            console.log(`${head.slice(0, 10)} has no open ${context()} request; nothing to report.`);
            return;
          }

          // Checked again here, from the run itself: the request step's view could be
          // stale, and the run's path is only known now.
          const distrust = forkRunDistrust(run.path, await forkCiChanges(env('BASE_REF'), head));
          if (distrust) {
            await setStatus(head, 'failure', distrust, run.html_url);
            return;
          }

          const jobs = await runJobs(run.id, run.run_attempt);

          const outcome = forkOutcome(jobs, head, label());
          if (outcome) {
            await setStatus(head, outcome.state, outcome.description, run.html_url);
          }
        }

        export async function main() {
          const modes: Record<string, () => Promise<void>> = {
            remind,
            label: labelCheck,
            start,
            attestations,
            finish,
            'fork-request': forkRequest,
            fork,
          };
          const mode = modes[env('CI_GATE_MODE')];
          if (!mode) {
            throw new Error(`unknown CI_GATE_MODE ${process.env.CI_GATE_MODE}`);
          }
          await mode();
        }

        await main();
        NODE_SCRIPT
      shell: bash
      env:
        CI_GATE_MODE: start
        CI_GATE_CONTEXT: CI gate
        CI_GATE_LABEL: run-ci
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        MERGE_SHA: ${{ github.sha }}
    - id: attestations
      name: Read the head's attestations
      run: |
        node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
        // Sets the commit status `main` requires before a merge: it is green only on a
        // commit that a requested `PR CI` run passed. `CI_GATE_MODE` picks the step:
        //
        //   remind  a new commit: pending "not run" with the command to run it, unless
        //           the commit already has a gate status
        //   start   a requested run begins: remove the label, check the merge commit
        //           holds the PR head, set pending
        //   attestations  after start: which attested checks this run skips
        //   finish  the run ends: success when every job passed or was skipped
        //   label   the label goes on a PR: fail when it can't start PR CI, because the
        //           PR conflicts with main or its merge commit predates PR CI
        //   fork-request  the label goes on a fork PR: what start does with a write
        //                 token, from a trusted run of `main`'s workflow
        //   fork    after a fork PR's run, whose read-only token could not set the status
        //
        // Statuses go on the PR head commit, so a later push starts without one.
        //
        // An attested check is a job its author ran on their own machine with
        // `cargo x attest`, which posts an `attested/<check>` status on the head. Only
        // someone who can push to the repository can post a status. The status names
        // the check as it was defined (`fp`) and a hash of the paths it read (`src`).
        // Start hashes the same paths in the merge commit this run tests and accepts a
        // status that names both, so a pass stands for exactly the files it ran on.
        // Each accepted check has one chance in `AUDIT_ONE_IN` of running on a runner
        // anyway; one that fails there is withdrawn for those files, and `finish`
        // names it. `finish` reads the statuses again, because a re-run of failed jobs
        // keeps what Start decided.
        //
        // A fork PR's run uses the workflow files of its merge commit, so a fork that
        // edits them decides its own verdict. Both fork steps fail closed instead: the
        // fork's CI sources must be the trees it branched from (`ciSourceChanges`).

        import { execFileSync } from 'node:child_process';
        import { createHash, randomInt } from 'node:crypto';
        import { appendFileSync, mkdtempSync, readFileSync } from 'node:fs';
        import { tmpdir } from 'node:os';
        import { join } from 'node:path';

        const API = 'https://api.github.com';
        const DESCRIPTION_LIMIT = 140;
        // For a request that is safe to repeat: a read, or posting a status.
        const ATTEMPTS = 3;
        // How many attested checks a failing verdict names; the log has them all.
        const NAMED_CHECKS = 2;
        // An open request. Only trusted runs set statuses: a fork's token can't.
        const RUNNING = 'Running on';
        // Job names in `PR CI`; the fork step reads them back from the finished run.
        export const START_JOB = 'Start';
        export const GATE_JOB = 'CI gate';
        // The workflow whose jobs the fork step trusts, and the trees that define it:
        // the generated workflows and the Rust that generates them.
        export const PR_CI_PATH = '.github/workflows/pr-ci.yml';
        export const CI_SOURCES = ['.github', 'tooling/xtask/crates/xtask_workflows'] as const;
        export const STALE_MERGE =
          "PR CI can't start: this PR's merge commit predates PR CI. Merge main in, push, and add the run-ci label again.";
        export const CONFLICTS =
          "PR CI can't start: this PR conflicts with main. Merge main in, push, and add the run-ci label again.";
        export const FORK_CHANGES_CI =
          'fork changes CI workflows: a maintainer must review and run CI from a branch';

        type State = 'pending' | 'success' | 'failure' | 'error';
        export type Needs = Record<string, { result: string }>;
        export type RunJob = { name: string; conclusion: string | null; run_attempt?: number };
        type Outcome = { state: State; description: string } | null;
        export type CommitStatus = { context: string; state: string; description: string | null };
        /// A job that can be attested, as Start accepts it: the paths it reads are
        /// hashed in the merge commit. `.` is the whole tree.
        export type AttestableCheck = { id: string; fingerprint: string; inputs: string[] };
        /// A job that can be attested, as the gate finds it in a run.
        export type GateCheck = { id: string; name: string };
        /// The git object at each path of a commit's tree; absent where there is none.
        export type Objects = Record<string, string>;
        /// The hash of each check's inputs in the merge commit a run tests.
        export type Sources = Record<string, string>;
        /// Git tree SHA of each CI source at a commit; null where the path is missing.
        export type CiTrees = Record<string, string | null>;

        function env(name: string): string {
          const value = process.env[name];
          if (!value) {
            throw new Error(`${name} is not set`);
          }
          return value;
        }

        /// Whether a path exists at a ref.
        async function exists(path: string, ref: string): Promise<boolean> {
          const response = await fetch(`${API}/repos/${repo()}/contents/${path}?ref=${ref}`, {
            method: 'HEAD',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${env('GH_TOKEN')}`,
              'x-github-api-version': '2022-11-28',
            },
          });
          if (response.status === 404) {
            return false;
          }
          if (!response.ok) {
            throw new Error(`HEAD contents/${path}?ref=${ref}: HTTP ${response.status}`);
          }
          return true;
        }

        /// One request, tried again up to `attempts` times when GitHub or the network
        /// fails it.
        async function request(
          method: string,
          path: string,
          body: unknown,
          attempts: number,
        ): Promise<Response> {
          for (let attempt = 1; ; attempt++) {
            const last = attempt >= attempts;
            try {
              const response = await fetch(`${API}${path}`, {
                method,
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${env('GH_TOKEN')}`,
                  'x-github-api-version': '2022-11-28',
                },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              if (response.status < 500 || last) {
                return response;
              }
            } catch (error) {
              if (last) {
                throw error;
              }
            }
            await new Promise((resolve) => setTimeout(resolve, attempt * 2_000));
          }
        }

        async function github(
          method: string,
          path: string,
          body?: unknown,
          attempts = method === 'GET' ? ATTEMPTS : 1,
        ): Promise<any> {
          const response = await request(method, path, body, attempts);
          // Removing a label that is already gone is the outcome we wanted.
          if (method === 'DELETE' && response.status === 404) {
            return null;
          }
          if (!response.ok) {
            throw new Error(`${method} ${path}: HTTP ${response.status} ${await response.text()}`);
          }
          return response.status === 204 ? null : response.json();
        }

        const repo = () => env('GITHUB_REPOSITORY');
        const context = () => env('CI_GATE_CONTEXT');
        const label = () => env('CI_GATE_LABEL');

        /// REST, because `gh pr edit` fails on older gh releases.
        export function runCommand(repository: string, pr: string, labelName: string): string {
          return `gh api repos/${repository}/issues/${pr}/labels -f "labels[]=${labelName}"`;
        }

        /// The finished run's verdict from `toJSON(needs)`. Start must have succeeded;
        /// a called workflow may be skipped, because its path filter did not match.
        /// Null when start failed: it already set a status that says why.
        export function gateOutcome(needs: Needs, head: string): Outcome {
          if (needs.start?.result !== 'success') {
            return null;
          }

          const failed = Object.entries(needs)
            .filter(([, need]) => need.result !== 'success' && need.result !== 'skipped')
            .map(([job]) => job);

          if (failed.length > 0) {
            return { state: 'failure', description: `Failed: ${failed.join(', ')}` };
          }

          return { state: 'success', description: `Passed on ${head.slice(0, 7)}` };
        }

        /// GitHub treats status contexts that differ only in case as one.
        const sameContext = (left: string, right: string) => left.toLowerCase() === right.toLowerCase();

        /// What identifies the files a check read: each input path with the git
        /// object it holds, hashed. `cargo x attest` computes the same over the
        /// working tree's commit (`inputs_hash` in `xtask_attest`); both tests pin
        /// one value.
        export function inputsHash(inputs: string[], objects: Objects): string {
          const lines = [...inputs].sort().map((path) => `${path}\t${objects[path] ?? '-'}\n`);
          return createHash('sha256').update(lines.join('')).digest('hex').slice(0, 16);
        }

        /// The check and the files a status vouches for, or null for a status
        /// `cargo x attest` did not write.
        function claim(status: CommitStatus): { fingerprint: string; source: string } | null {
          const stated = /^fp=([0-9a-f]{16}) src=([0-9a-f]{16})(?: |$)/.exec(status.description ?? '');
          return stated ? { fingerprint: stated[1], source: stated[2] } : null;
        }

        /// The checks a run may skip. A check counts when some status says it passed
        /// as this run defines it (its fingerprint) on the files this run tests (the
        /// hash of its inputs in `sources`), and no status says it failed on them: a
        /// failure is final for those files, whatever was posted before or after.
        export function acceptedAttestations(
          statuses: CommitStatus[],
          checks: AttestableCheck[],
          prefix: string,
          sources: Sources,
        ): string[] {
          return checks
            .filter((check) => {
              const source = sources[check.id];
              const mine = statuses.filter((status) => {
                const stated = sameContext(status.context, `${prefix}${check.id}`) ? claim(status) : null;
                return stated?.fingerprint === check.fingerprint && stated.source === source;
              });
              return (
                source !== undefined &&
                mine.some((status) => status.state === 'success') &&
                mine.every((status) => status.state === 'success')
              );
            })
            .map((check) => check.id);
        }

        /// Which accepted checks run on a runner anyway. Each is drawn by itself, so
        /// every run with attestations checks a few of them and none checks all.
        export function drawAudits(
          accepted: string[],
          oneIn: number,
          roll: (below: number) => number,
        ): { attested: string[]; audited: string[] } {
          const audited = accepted.filter(() => roll(oneIn) === 0);
          return { attested: accepted.filter((id) => !audited.includes(id)), audited };
        }

        function jobsOf(check: GateCheck, jobs: RunJob[]): RunJob[] {
          return jobs.filter((job) => job.name === check.name);
        }

        /// The accepted checks whose jobs this run skipped.
        export function skippedAttested(entries: string[], checks: GateCheck[], jobs: RunJob[]): string[] {
          return checks
            .filter((check) => entries.includes(check.id))
            .filter((check) => {
              const own = jobsOf(check, jobs);
              return own.length > 0 && own.every((job) => job.conclusion === 'skipped');
            })
            .map((check) => check.id);
        }

        /// The attested checks an audit ran here and did not see pass: a job that
        /// failed, timed out or was cancelled. A skipped job is one the change does
        /// not select.
        export function auditFailures(audited: string[], checks: GateCheck[], jobs: RunJob[]): string[] {
          const passed = (job: RunJob) => job.conclusion === 'success' || job.conclusion === 'skipped';
          return checks
            .filter((check) => audited.includes(check.id))
            .filter((check) => jobsOf(check, jobs).some((job) => !passed(job)))
            .map((check) => check.id);
        }

        /// The checks Start accepted on an attestation that no longer holds: withdrawn
        /// since. `current` is what Start would accept now. Whether the job was
        /// skipped is not asked: a later attempt does not list every job of an
        /// earlier one.
        export function withdrawnAttestations(entries: string[], current: string[]): string[] {
          return entries.filter((entry) => !current.includes(entry));
        }

        /// The entries a run took on trust: those whose check did not also run and
        /// pass here.
        export function trustedEntries(entries: string[], checks: GateCheck[], jobs: RunJob[]): string[] {
          const ranAndPassed = (id: string) => {
            const check = checks.find((each) => each.id === id);
            const own = check ? jobsOf(check, jobs) : [];
            return own.length > 0 && own.every((job) => job.conclusion === 'success');
          };
          return entries.filter((entry) => !ranAndPassed(entry));
        }

        /// Each job of a run as its newest attempt left it. A re-run of some jobs
        /// keeps the others' results from the attempt that ran them. Of two records
        /// of a job that no attempt number tells apart, the one that vouches for
        /// less is kept, whatever order GitHub lists them in: not passed, then
        /// skipped, then passed.
        export function newestJobs(jobs: RunJob[]): RunJob[] {
          const vouches = (job: RunJob) =>
            job.conclusion === 'success' ? 2 : job.conclusion === 'skipped' ? 1 : 0;
          const newest = new Map<string, RunJob>();
          for (const job of jobs) {
            const known = newest.get(job.name);
            const attempt = job.run_attempt ?? 0;
            const knownAttempt = known?.run_attempt ?? 0;
            if (
              !known ||
              attempt > knownAttempt ||
              (attempt === knownAttempt && vouches(job) < vouches(known))
            ) {
              newest.set(job.name, job);
            }
          }
          return [...newest.values()];
        }

        /// The first few of a list by name, and how many more there are: a status
        /// description is cut at `DESCRIPTION_LIMIT`.
        function named(ids: string[]): string {
          const rest = ids.length - NAMED_CHECKS;
          return rest > 0 ? `${ids.slice(0, NAMED_CHECKS).join(', ')} and ${rest} more` : ids.join(', ');
        }

        /// The verdict with what attestation did to it: the checks a passing run took
        /// on trust, or the attested checks an audit caught failing.
        export function withAttestations(
          outcome: { state: State; description: string },
          skipped: string[],
          failures: string[],
        ): { state: State; description: string } {
          if (outcome.state === 'success' && skipped.length > 0) {
            return {
              state: outcome.state,
              description: `${outcome.description}, ${skipped.length} attested: ${skipped.join(', ')}`,
            };
          }
          if (outcome.state !== 'success' && failures.length > 0) {
            return {
              state: outcome.state,
              description: `Attested but failed here: ${named(failures)}. ${outcome.description}`,
            };
          }
          return outcome;
        }

        /// A fork run's verdict from its jobs. Null when the run was not a request
        /// (unrelated label) or did not finish (cancelled).
        export function forkOutcome(jobs: RunJob[], head: string, labelName: string): Outcome {
          const start = jobs.find((job) => job.name === START_JOB);
          const gate = jobs.find((job) => job.name === GATE_JOB);

          if (!start || start.conclusion === 'skipped' || start.conclusion === 'cancelled') {
            return null;
          }

          if (start.conclusion !== 'success') {
            return {
              state: 'failure',
