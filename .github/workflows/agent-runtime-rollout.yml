# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/agent_runtime_rollout.rs
name: Agent runtime rollout
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Development only
        required: true
        type: choice
        options:
          - dev
      source_sha:
        description: Full commit SHA on main
        required: true
        type: string
      computer:
        description: One agent teammate computer id
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: Validate the inputs
    runs-on: namespace-profile-linux-small
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          fetch-depth: '0'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Validate dev, main and one computer id
        run: |
          set -euo pipefail
          [[ $ENVIRONMENT == dev && $GITHUB_REF == refs/heads/main ]] || {
            echo 'Runtime rollout only accepts a dispatch from main to dev' >&2
            exit 1
          }
          [[ $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Supply one full main commit SHA' >&2
            exit 1
          }
          [[ $COMPUTER =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || {
            echo 'Supply a single computer id' >&2
            exit 1
          }
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPUTER: ${{ inputs.computer }}
  build:
    needs:
      - validate
    name: Build and publish the runtime
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=firecracker-image
    outputs:
      cli_sha256: ${{ steps.build-cli.outputs.sha256 }}
    env:
      ARTIFACT_DIR: target/agent-runtime
      CLI_DIR: target/agent-runtime-cli
    timeout-minutes: 120
    steps:
      - name: Checkout the workflow's commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount /nix cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: nix
        continue-on-error: true
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-cache-url: ${{ vars.NIX_CACHE_URL }}
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell
        with:
          shell: agent-daemon
      - name: Configure Namespace remote sccache
        if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          set -euo pipefail
          env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
          trap 'rm -f "$env_file"' EXIT
          if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
            # Register credential values as masked BEFORE exporting: GitHub only
            # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
            # ~24h Namespace workspace token (registry + cache write) — printed
            # verbatim in every subsequent step's env dump. Masking is selective by
            # key name: masking non-secrets like the endpoint URL or key prefix
            # would redact those strings everywhere in the logs.
            while IFS= read -r line; do
              k="${line%%=*}"
              v="${line#*=}"
              [ -n "$v" ] && [ "$k" != "$line" ] || continue
              case "$k" in
                *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
              esac
            done < "$env_file"
            cat "$env_file" >> "$GITHUB_ENV"
            # The server checks the WebDAV backend before it reports ready, and the
            # client's default 10s wait can run out. This limit has no env var.
            sccache_conf="$RUNNER_TEMP/sccache.toml"
            echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
            echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
            # Force the next compiler invocation to start a server with the new remote
            # backend even if a setup hook happened to launch one already.
            sccache --stop-server >/dev/null 2>&1 || true
          else
            echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
          fi
      - id: build-cli
        name: Build the rollout CLI
        run: |
          set -euo pipefail
          export SQLX_OFFLINE=true

          # A static binary works on the migrator without the build runner's libraries.
          target=x86_64-unknown-linux-musl
          # The billing dependency uses OpenSSL. Take the musl headers and archives
          # from the same locked Nix input as the build tools.
          openssl_dev=$(nix build --inputs-from . --no-link --print-out-paths 'nixpkgs#pkgsStatic.openssl^dev')
          openssl_out=$(nix build --inputs-from . --no-link --print-out-paths 'nixpkgs#pkgsStatic.openssl^out')
          export X86_64_UNKNOWN_LINUX_MUSL_OPENSSL_INCLUDE_DIR="$openssl_dev/include"
          export X86_64_UNKNOWN_LINUX_MUSL_OPENSSL_LIB_DIR="$openssl_out/lib"
          export X86_64_UNKNOWN_LINUX_MUSL_OPENSSL_STATIC=1
          cargo zigbuild --release --locked --target "$target" -p hosted_runtimes \
            --features "$CLI_FEATURE" --bin "$CLI_BIN"

          binary="${CARGO_TARGET_DIR:-target}/$target/release/$CLI_BIN"
          headers=$(readelf -lW "$binary")
          if grep -qE '^[[:space:]]*INTERP[[:space:]]' <<<"$headers"; then
            echo '::error::the rollout CLI depends on shared libraries'
            exit 1
          fi
          "$binary" --help
          mkdir -p "$CLI_DIR"
          install -m 0755 "$binary" "$CLI_DIR/$CLI_BIN"
          digest=$(sha256sum "$CLI_DIR/$CLI_BIN" | cut -d ' ' -f1)
          printf 'sha256=%s\n' "$digest" >>"$GITHUB_OUTPUT"
        shell: bash
        env:
          CLI_BIN: agent-runtime-update
          CLI_FEATURE: runtime-update-cli
      - name: Upload agent-runtime-cli artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          path: target/agent-runtime-cli
          name: agent-runtime-cli
          if-no-files-found: error
          retention-days: '30'
      - name: Checkout the bundle commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: 'false'
          clean: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Build, hash and publish the runtime
        run: |
          set -euo pipefail
          [[ $ENVIRONMENT == dev && $(git rev-parse HEAD) == "$SOURCE_SHA" ]]
          [[ $NIX_CACHE_URL =~ ^s3://([a-z0-9.-]+)\?(.*\&)?region=([a-z0-9-]+) ]]
          bucket=${BASH_REMATCH[1]}
          export AWS_DEFAULT_REGION=${BASH_REMATCH[3]}
          prefix="agent-runtime-bundles/$SOURCE_SHA"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tool() { nix shell --inputs-from . nixpkgs#awscli2 nixpkgs#zstd nixpkgs#jq -c "$@"; }
          jq() { tool jq "$@"; }

          nix build --print-build-logs --out-link "$work/runtime" .#macro-agent-runtime
          tar --hard-dereference --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C "$work/runtime" -cf "$work/runtime.tar" bun.lock template.json node_modules
          tool zstd -q -T1 -10 "$work/runtime.tar" -o "$work/runtime.tar.zst"
          digest=$(sha256sum "$work/runtime.tar.zst" | cut -d' ' -f1)
          mkdir -p "$ARTIFACT_DIR"
          modules="$work/runtime/node_modules/@macro-inc"
          jq -nS --arg version "$SOURCE_SHA" --arg digest "$digest" \
            --slurpfile muppet "$modules/muppet/package.json" \
            --slurpfile sdk "$modules/sdk/package.json" \
            --slurpfile observability "$modules/observability/package.json" \
            '{version: $version, digest: $digest, muppetApi: $muppet[0].apiLevel,
              muppetVersion: $muppet[0].version, sdkVersion: $sdk[0].version,
              observabilityVersion: $observability[0].version}' >"$ARTIFACT_DIR/manifest.json"

          publish() {
            local path=$1 name=$2
            if tool aws s3api put-object --bucket "$bucket" --key "$prefix/$name" \
              --if-none-match '*' --body "$path" >/dev/null; then
              return
            fi
            # The key cannot be overwritten. A retry succeeds only if the bytes
            # already published to the immutable key are exactly the same.
            tool aws s3api get-object --bucket "$bucket" --key "$prefix/$name" "$work/published" >/dev/null
            cmp --silent "$work/published" "$path" || {
              echo "$SOURCE_SHA already has different $name bytes" >&2
              exit 1
            }
          }
          publish "$work/runtime.tar.zst" runtime.tar.zst
          publish "$ARTIFACT_DIR/manifest.json" manifest.json
          echo "Published runtime $SOURCE_SHA (SHA-256 $digest)"
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPUTER: ${{ inputs.computer }}
          NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Upload agent-runtime-manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          path: target/agent-runtime
          name: agent-runtime-manifest
          if-no-files-found: error
          retention-days: '30'
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
  roll-out:
    needs:
      - build
    name: Activate on the selected dev teammate
    runs-on: db-migrator
    env:
      ARTIFACT_DIR: target/agent-runtime
      CLI_DIR: target/agent-runtime-cli
    timeout-minutes: 120
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: agent-runtime-manifest
          path: target/agent-runtime
          merge-multiple: 'true'
      - name: Download Rollout CLI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: agent-runtime-cli
          path: target/agent-runtime-cli
      - name: Request the runtime update and wait for verification
        run: |
          set -euo pipefail
          [[ $ENVIRONMENT == dev && $GITHUB_REF == refs/heads/main ]]

          fail() {
            echo "::error::$1"
            exit 1
          }

          bin="$CLI_DIR/agent-runtime-update"
          [[ ${CLI_SHA256:-} =~ ^[0-9a-f]{64}$ ]] || fail "the rollout CLI checksum is missing or invalid"
          printf '%s  %s\n' "$CLI_SHA256" "$bin" | sha256sum --check --strict - \
            || fail "the rollout CLI checksum could not be verified"
          # Artifact downloads discard executable permissions.
          chmod +x "$bin"

          [[ $NIX_CACHE_URL =~ ^s3://([a-z0-9.-]+)\?(.*\&)?region=([a-z0-9-]+) ]]
          bucket=${BASH_REMATCH[1]}
          region=${BASH_REMATCH[3]}
          secrets=$(mktemp -d "$RUNNER_TEMP/runtime-update.XXXXXX")
          chmod 700 "$secrets"
          trap 'rm -rf "$secrets"' EXIT

          manifest="$ARTIFACT_DIR/manifest.json"
          digest=$(jq -er --arg version "$SOURCE_SHA" \
            'select(.version == $version) | .digest | select(test("^[a-f0-9]{64}$"))' "$manifest")
          url=$(AWS_DEFAULT_REGION=$region aws s3 presign --expires-in 7200 \
            "s3://$bucket/agent-runtime-bundles/$SOURCE_SHA/runtime.tar.zst")
          echo "::add-mask::$url"
          jq -n --arg version "$SOURCE_SHA" --arg digest "$digest" --arg url "$url" \
            '{version:$version,digest:$digest,url:$url}' >"$secrets/request.json"

          database_url=$(env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY \
            aws secretsmanager get-secret-value --secret-id macro-db-dev --query SecretString --output text)
          if [[ $database_url != *sslmode=* ]]; then
            if [[ $database_url == *"?"* ]]; then database_url="$database_url&sslmode=require"; else database_url="$database_url?sslmode=require"; fi
          fi
          echo "::add-mask::$database_url"
          printf '%s' "$database_url" >"$secrets/database.url"

          "$bin" --environment dev --database-url-file "$secrets/database.url" \
            --request "$secrets/request.json" --computer "$COMPUTER" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        env:
          CLI_SHA256: ${{ needs.build.outputs.cli_sha256 }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPUTER: ${{ inputs.computer }}
          NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
concurrency:
  group: agent-runtime-rollout-${{ inputs.computer }}
  cancel-in-progress: false
