# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/check_generated.rs
name: check generated workflows
on:
  workflow_call: {}
jobs:
  check-workflows:
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          sccache: 'false'
          rust-cache: 'false'
      - name: verify workflows are up to date
        run: cargo run --manifest-path tooling/xtask/Cargo.toml -- workflows --check
      - name: verify kafka cluster topics are up to date
        run: cargo run --manifest-path tooling/xtask/Cargo.toml -- kafka-topics --check
  lint-workflows:
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount /nix cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: nix
        continue-on-error: true
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell
        with:
          shell: workflow-lint
      - name: actionlint
        run: actionlint
      - name: zizmor
        run: zizmor --offline .github
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
