# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/check_generated.rs
name: check generated workflows
on:
  workflow_call:
    inputs:
      attested:
        description: JSON list of the checks PR CI accepted an attestation for, by id
        type: string
        required: false
        default: '[]'
jobs:
  check-workflows:
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: '10000'
        GIT_HTTP_LOW_SPEED_TIME: '60'
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        sccache: 'false'
        rust-cache: 'false'
    - name: verify workflows are up to date
      run: cargo run --manifest-path tooling/xtask/Cargo.toml -- workflows --check
    - name: verify kafka cluster topics are up to date
      run: cargo run --manifest-path tooling/xtask/Cargo.toml -- kafka-topics --check
    if: '!contains(fromJSON(inputs.attested || ''[]''), ''generated-workflows/check-workflows'')'
