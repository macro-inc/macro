# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/sdk_check.rs
name: SDK Check
'on':
  push:
    branches:
    - main
    paths:
    - packages/sdk/**
    - packages/sdk-calls/**
    - '.github/workflows/sdk-check.yml'
  workflow_call: {}
jobs:
  check-package:
    name: SDK Package Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.5'
    - name: Install dependencies
      run: bun install --frozen-lockfile
      working-directory: packages/sdk
    - name: Typecheck SDK
      run: bun run check
      working-directory: packages/sdk
    - name: Test SDK
      run: bun test
      working-directory: packages/sdk
    - name: Check endpoint coverage
      run: bun run coverage
      working-directory: packages/sdk
    - name: Build SDK
      run: bun run build
      working-directory: packages/sdk
    - name: Install sdk-calls dependencies
      run: bun install --frozen-lockfile
      working-directory: packages/sdk-calls
    - name: Check sdk-calls
      run: bun run check && bun test && bun run build && bun run check:pack
      working-directory: packages/sdk-calls
concurrency:
  group: sdk-check-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true
