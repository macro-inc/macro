# Experiment only. Builds binaries and discards them: no nix cache push, no image, no Pulumi, no migration.
# AWS credentials only let the nix daemon read the existing substituter, as in deploy jobs.
name: ci-speed service build arms
on:
  pull_request:
    paths: ['.github/ci-speed/**', '.github/workflows/ci_speed_dss_profile.yml', 'nix/cloud-storage.nix']
permissions: { contents: read }
env:
  RUNNER_NOTE: private cache tag ci-speed-deploy-nix
jobs:
  warm:
    name: warm volume
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=ci-speed-deploy-nix
    timeout-minutes: 90
    env: { ATTEMPT: warm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with: { cache: nix }
        continue-on-error: true
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-url: ${{ vars.NIX_CACHE_URL }}
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - run: bash .github/ci-speed/nix-arm.sh exp-dss-control
      - run: bash .github/ci-speed/nix-arm.sh exp-ahs-control
      - if: always()
        uses: ./.github/actions/teardown-nix
  arm:
    needs: warm
    name: ${{ matrix.service }} ${{ matrix.arm }} ${{ matrix.attempt }}
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=ci-speed-deploy-nix
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service: [dss]
        arm: [control, o2, o1, cgu64, cgu256]
        attempt: [1, 2, 3, 4, 5]
    env: { ATTEMPT: "${{ matrix.attempt }}" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with: { cache: nix }
        continue-on-error: true
      - uses: ./.github/actions/setup-nix
        with:
          nix-cache-url: ${{ vars.NIX_CACHE_URL }}
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - run: bash .github/ci-speed/nix-arm.sh "exp-${{ matrix.service }}-${{ matrix.arm }}"
      - if: always()
        uses: ./.github/actions/teardown-nix
