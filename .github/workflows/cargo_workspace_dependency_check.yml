name: cargo workspace dependency check
on:
  workflow_call:
    inputs:
      attested:
        description: JSON list of the checks PR CI accepted an attestation for, by id
        type: string
        default: '[]'
jobs:
  dependency-check:
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    timeout-minutes: 15
    steps:
      - name: Checkout Repo # zizmor: ignore[artipacked] cargo metadata fetches git dependencies
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          path: |-
            /nix
            ./target
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            /home/runner/.cargo/.global-cache
        continue-on-error: true
      - name: Reuse the kept cargo target
