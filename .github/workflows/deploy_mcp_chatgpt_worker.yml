# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_mcp_chatgpt_worker.rs
name: Deploy MCP ChatGPT Worker
on:
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to. e.g. (dev, prod)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: namespace-profile-linux-small
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile && (cd packages/sdk && bun install --frozen-lockfile)
      - name: Check required secrets
        run: node scripts/check-deploy-secrets.mjs "$DEPLOY_ENVIRONMENT"
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/mcp-chatgpt-worker
      - name: Deploy with wrangler
        run: bunx wrangler deploy --env "$DEPLOY_ENVIRONMENT"
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/mcp-chatgpt-worker
concurrency:
  group: deploy-mcp-chatgpt-worker-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
