# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/web_app_check_main.rs
name: Web App Pr Checks
'on':
  workflow_call: {}
jobs:
  path-check:
    runs-on: namespace-profile-linux-tiny-no-cache
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      codegen_changed: ${{ steps.codegen.outputs.codegen_changed }}
      web_artifact_changed: ${{ steps.filter.outputs.web_artifact_changed }}
      i18n_changed: ${{ steps.filter.outputs.i18n_changed }}
      database_grid_changed: ${{ steps.filter.outputs.database_grid_changed }}
      calendar_details_changed: ${{ steps.filter.outputs.calendar_details_changed }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        filter: blob:none
        sparse-checkout: '.github'
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'crates/natural_time/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - 'services/lexical-service/**'
            - 'packages/sdk/**'
            - 'packages/sdk-docs/**'
            - 'services/ai-editing-worker/**'
            - 'services/mcp-chatgpt-worker/**'
            - 'packages/code-mode-sdk/**'
            - 'crates/agent_code_mode/SKILL.md'
            - '.github/actions/setup-reqs-web/**'
          web_artifact_changed:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'crates/natural_time/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
          codegen_inputs:
            - 'apps/web/scripts/generate-api-schema.ts'
            - 'apps/web/scripts/services.ts'
            - 'packages/sdk/**'
            - 'apps/docs/**'
            - '.github/actions/setup-reqs-web/**'
          i18n_changed:
            - 'apps/web/src/lib/i18n/**'
            - 'apps/web/src/lib/core/component/ContextMenu.tsx'
            - 'apps/web/src/lib/core/constant/settingsTabsConfig.tsx'
            - 'apps/web/src/components/ui/components/Dropdown.tsx'
            - 'apps/web/src/features/settings/**'
          database_grid_changed:
            - 'apps/web/src/features/database/**'
          calendar_details_changed:
            - 'apps/web/src/features/calendar-view/**'
            - 'apps/web/src/features/calendar/**'
            - 'apps/web/src/lib/queries/calendar/**'
    - id: codegen
      name: Detect schema changes
      run: |
        set -euo pipefail
        result() {
          echo "$1"
          echo "codegen_changed=$2" >> "$GITHUB_OUTPUT"
          exit 0
        }
        [ "$CODEGEN_INPUTS" = true ] && result "A generator input changed." true
        # The merge commit's first parent is the main this merge result was
        # built on; a fresh fetch of main could be newer.
        base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | sed -n 1p)
        [ -n "$base" ] || result "No base commit to compare with." true
        git fetch -q --depth=1 origin "$base"
        names='utoipa|ToSchema|IntoParams|specta|schemars|JsonSchema'
        manifests=$(git diff "$base" HEAD -- Cargo.toml Cargo.lock)
        if grep -E "^[-+].*($names)" <<< "$manifests"; then
          result "A schema crate's version changed." true
        fi
        changed=$(git diff --name-only --no-renames "$base" HEAD -- 'crates/*.rs' 'services/*.rs')
        while IFS= read -r file; do
          [ -n "$file" ] || continue
          for revision in HEAD "$base"; do
            [ -n "$(git ls-tree "$revision" -- "$file")" ] || continue
            contents=$(git show "$revision:$file")
            if grep -E "$names" <<< "$contents" > /dev/null; then
              result "$file names a schema item." true
            fi
          done
        done <<< "$changed"
        result "No changed Rust file names a schema item." false
      env:
        CODEGEN_INPUTS: ${{ steps.filter.outputs.codegen_inputs }}
  android-native-check:
    name: Android Native Check
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
    - name: Checkout PR merge commit
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - id: labels
      name: Read the PR's current labels
      run: |
        set -euo pipefail
        labels=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name] | join(",")')
        echo "labels: ${labels:-<none>}"
        if [[ ",${labels}," == *",skip-android-update,"* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - id: android-version
      name: Require an Android version bump for native changes
      if: steps.labels.outputs.skip != 'true'
      run: |
        set -euo pipefail
        base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -1)
        echo "Comparing the merge result with its base ${base:0:10}"
        git fetch -q --depth=1 origin "$base"
        bun scripts/android-version-check.mjs "$base"
      shell: bash
      working-directory: apps/web
    - name: Keep the Android native build floor without a release
      if: steps.labels.outputs.skip == 'true'
      run: |
        set -euo pipefail
        base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -1)
        git fetch -q --depth=1 origin "$base"
        bun scripts/android-version-check.mjs --skip-release "$base"
      shell: bash
      working-directory: apps/web
    - name: Require the Play release to be live
      if: steps.android-version.outputs.changed == 'true' && steps.labels.outputs.skip != 'true'
      run: |
        # --- authenticated fetch ------------------------------------------------------
        # gh_fetch <sha|ref>: make a commit that is not in this checkout (the base
        # commit, a moved PR head, GitHub's test merge commit) available. Checkouts
        # may persist credentials, so clear inherited headers before supplying one
        # explicitly. Keep Nix build libraries out of the host Git HTTPS helper.
        # Fails if the commit is unreachable (a force-pushed-away head).
        gh_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          LD_LIBRARY_PATH= git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ------------------------------------------------------------------------------
        # --- PR merge result ----------------------------------------------------------
        # pr_merge_commit: print the sha of GitHub's test merge commit for $PR_NUMBER —
        # the merge result the native gates hash. GitHub computes it lazily
        # (mergeable=UNKNOWN until it has), so poll a little; a PR that really
        # conflicts with its base cannot merge anyway. Needs GH_TOKEN, GH_REPO,
        # PR_NUMBER. Progress goes to stderr so `merge=$(pr_merge_commit)` works.
        pr_merge_commit() {
          local deadline pr_json mergeable merge
          deadline=$(( $(date +%s) + 120 ))
          while true; do
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json mergeable,potentialMergeCommit)
            mergeable=$(jq -r '.mergeable' <<<"$pr_json")
            merge=$(jq -r '.potentialMergeCommit.oid // empty' <<<"$pr_json")
            if [[ -n "$merge" ]]; then
              echo "$merge"
              return 0
            fi
            if [[ "$mergeable" == "CONFLICTING" ]]; then
              echo "PR #${PR_NUMBER} conflicts with its base branch, so GitHub has no merge result for it." >&2
              return 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "GitHub has not computed PR #${PR_NUMBER}'s merge commit yet (mergeable=${mergeable})." >&2
              return 1
            fi
            echo "Merge commit not computed yet (mergeable=${mergeable}); waiting." >&2
            sleep 10
          done
        }
        # ------------------------------------------------------------------------------
        # --- Android Play commit statuses ---------------------------------------------
        # Only workflows that run main's copy may sign in to Google Play, so they
        # record what they learn as commit statuses on the PR's commits, where the
        # PR-side jobs (the merge gate, the drift check) read it:
        #
        #   android-play/release  set by Android Play Publish on the commit it built:
        #                         pending just before the production promotion, then
        #                         success or failure.
        #   android-play/live     set by Android Release Watch on the PR head once the
        #                         release is live on production.
        #
        # Readers match the descriptions exactly, so they are built only here.
        # Needs GH_TOKEN and GH_REPO; pr_commit_statuses also PR_NUMBER.

        # android_release_description <version code> <native hash>
        android_release_description() {
          printf 'Version code %s (native tree %s)' "$1" "$2"
        }

        # android_live_description <version code> <native hash> <PR number>
        android_live_description() {
          printf 'Version code %s is live on Google Play (native tree %s, PR #%s)' "$1" "$2" "$3"
        }

        # commit_status <sha> <context>: `<state> <description>` of the commit's latest
        # status with that context, or nothing.
        commit_status() {
          gh api "repos/${GH_REPO}/commits/$1/status" \
            --jq ".statuses[] | select(.context == \"$2\") | \"\(.state) \(.description)\""
        }

        # pr_commit_statuses <context>: `<sha> <state> <description>` for each of PR
        # #PR_NUMBER's last 100 commits that has a status with that context (its
        # latest one), states in lower case like the REST API's.
        pr_commit_statuses() {
          gh api graphql -F owner="${GH_REPO%%/*}" -F name="${GH_REPO#*/}" -F pr="$PR_NUMBER" -F context="$1" \
            -f query='query($owner: String!, $name: String!, $pr: Int!, $context: String!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  commits(last: 100) { nodes { commit { oid status { context(name: $context) { state description } } } } }
                }
              }
            }' \
            --jq '.data.repository.pullRequest.commits.nodes[].commit
              | select(.status.context != null)
              | "\(.oid) \(.status.context.state | ascii_downcase) \(.status.context.description)"'
        }

        # set_commit_status <sha> <context> <state> <description>, linking this run.
        set_commit_status() {
          gh api "repos/${GH_REPO}/statuses/$1" -f context="$2" -f state="$3" -f description="$4" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
        }
        # ------------------------------------------------------------------------------
        set -euo pipefail
        # The Android merge gate proper: version code $VERSION_CODE must be live on
        # Google Play production, built from the Android native code of PR
        # #PR_NUMBER's *current* merge result (fetched through the API: a re-run
        # checks out the merge commit of the run's original event, which may predate
        # native code landing on main). This job cannot sign in to Play — only
        # workflows that run main's copy can — so it reads the `android-play/live`
        # status that Android Release Watch sets once the release is live. Any of the
        # PR's commits counts: web-only pushes after the release keep it valid, and
        # the native hash in the description pins it to this merge result.
        merge=$(pr_merge_commit)
        gh_fetch "$merge"
        native_hash=$(bun scripts/android-native.mjs hash "$merge")
        echo "Merge result ${merge:0:10}: Android native hash ${native_hash}"
        want=$(android_live_description "$VERSION_CODE" "$native_hash" "$PR_NUMBER")
        statuses=$(pr_commit_statuses android-play/live)
        while read -r sha state description; do
          if [[ "$state" == success && "$description" == "$want" ]]; then
            echo "${sha:0:10} is marked android-play/live: ${description}."
            exit 0
          fi
        done <<<"$statuses"
        echo "Android native changes require version code ${VERSION_CODE} to be live on Google Play before merging," \
          "built from native tree ${native_hash}, but no commit of this PR is marked so (android-play/live)." >&2
        if [[ -n "$statuses" ]]; then
          echo "android-play/live statuses on this PR's commits:" >&2
          while read -r sha state description; do
            echo "  ${sha:0:10} ${state}: ${description}" >&2
          done <<<"$statuses"
        fi
        cat >&2 <<'EOF'
          - Not started yet? Add the `android-update` label to the PR to build, upload
            and promote it.
          - Promoted? Wait for Google review; the `Android Release Watch` workflow marks
            the PR and re-runs this check within half an hour of the release.
          - Native code changed since the release (pushed to the PR, or landed on main)?
            Bump (`just android-bump`), commit, re-add `android-update`.
          - If the native change doesn't break the native/web contract, add the
            `skip-android-update` label instead.
        EOF
        exit 1
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
      working-directory: apps/web
    - name: Skipped via label
      if: steps.labels.outputs.skip == 'true'
      run: echo "The skip-android-update label says this PR's Android native changes don't break the native/web contract — skipping the version bump and Play release gate."
  typescript:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Typecheck
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: /home/runner/.bun/install/cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        seed-cache: sccache-ci
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
    - name: Install SDK Documentation Dependencies
      run: bun install --frozen-lockfile
      working-directory: packages/sdk
    - name: Run checks
      run: |
        set -uo pipefail
        logs="$RUNNER_TEMP/typecheck"
        mkdir -p "$logs"
        names=()
        pids=()
        check() {
          local name="$1" directory="$2" command="$3"
          ( cd "$directory" && eval "$command" ) > "$logs/${#names[@]}.log" 2>&1 &
          names+=("$name")
          pids+=("$!")
        }
        check 'Check Types' 'apps/web' 'bun run type-check'
        check 'Check Floating Promises' '.' 'bun run lint:oxlint --quiet'
        check 'Check Functional Test Types' 'apps/web' 'bun ../../node_modules/typescript-native/bin/tsc --noEmit --skipLibCheck --project tests/functional/tsconfig.json'
        check 'Check Collaboration Package Types' 'packages/collaboration' 'bun run type-check'
        check 'Check Lexical Service Types' 'services/lexical-service' 'bun run check'
        check 'Test Lexical Service Endpoints' 'services/lexical-service' 'bun test src'
        check 'Check SDK Documentation' 'packages/sdk-docs' 'bun run type-check && bun run test'
        check 'Check Editing Worker' 'services/ai-editing-worker' 'bun run type-check'
        check 'Check Code Mode SDK' 'packages/code-mode-sdk' 'bun run type-check && bun run test'
        check 'Check SDK MCP Tools' 'packages/sdk-mcp' 'bun run type-check && bun run test'
        check 'Check MCP ChatGPT Worker' 'services/mcp-chatgpt-worker' 'bun run type-check && bun run test'
        failed=0
        for index in "${!names[@]}"; do
          status=0
          wait "${pids[$index]}" || status=$?
          echo "::group::${names[$index]} (exit $status)"
          cat "$logs/$index.log"
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            echo "::error::${names[$index]} failed with exit code $status"
            failed=1
          fi
        done
        exit "$failed"
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  generated-code:
    needs:
    - path-check
    if: needs.path-check.outputs.codegen_changed == 'true'
    name: Generated Code Check
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    timeout-minutes: 45
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        seed-cache: sccache-ci
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
      timeout-minutes: 15
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # The server checks the WebDAV backend before it reports ready, and the
          # client's default 10s wait can run out. This limit has no env var.
          sccache_conf="$RUNNER_TEMP/sccache.toml"
          echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
          echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build code-mode assets
      run: |
        set -euo pipefail

        # Build the code-mode assets once per SDK state, not once per job. Cache volumes
        # are forks of past jobs, so most jobs miss the store path another job just built.
        # The key is the store path, which covers every input of the build.
        assets="$(nix eval --raw .#code-mode-assets.outPath)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

        if nix-store --check-validity "$assets" 2>/dev/null; then
          echo "Code-mode assets already in the store"
          exit 0
        fi

        # Forks have no remote cache credentials.
        if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          nix build --no-link --print-build-logs .#code-mode-assets
          exit 0
        fi

        cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

        # The token goes through a config descriptor so it stays out of curl's arguments.
        cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
        }

        if cache_request "$cache_url" | gunzip | nix-store --import; then
          echo "Code-mode assets restored from the remote cache"
          exit 0
        fi

        # Installing node_modules is most of a build and changes far less often than the SDK,
        # so it has its own entry.
        modules="$(nix eval --raw .#macro-js-node-modules.outPath)"
        modules_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$modules").zst"
        save_modules=false

        if ! nix-store --check-validity "$modules" 2>/dev/null; then
          # No retries: a retry would restart the stream into the same pipe, and past the limit
          # a rebuild is faster.
          if cache_request --retry 0 --max-time 60 "$modules_url" | zstd -d | nix-store --import; then
            echo "node_modules restored from the remote cache"
          else
            save_modules=true
          fi
        fi

        nix build --no-link --print-build-logs .#code-mode-assets

        if [ "$save_modules" = true ] \
          && ! nix-store --export "$modules" | zstd -T0 -3 | cache_request --max-time 120 --upload-file - "$modules_url"; then
          echo "::warning::Could not save node_modules to the remote cache"
        fi

        # Losing the upload costs the next job a rebuild, not a failure.
        if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
          echo "Code-mode assets saved to the remote cache"
        else
          echo "::warning::Could not save code-mode assets to the remote cache"
        fi
    - name: Build schema binaries
      run: |
        set -euo pipefail
        read -ra openapi_bins <<< "$(cd apps/web && bun scripts/generate-api-schema.ts --print-cargo-bins)"
        SQLX_OFFLINE=true cargo build "${openapi_bins[@]}" --bin gen_tool_schemas \
          --bin agent_fold_types --bin export_review_types
    - name: Generate API Types
      run: bun run gen-api -- --check
      working-directory: apps/web
    - name: Regenerate SDK code
      run: |
        bun install --frozen-lockfile
        bun run sync-specs
        bun run generate
      working-directory: packages/sdk
    - name: Verify SDK generated code is fresh
      run: |
        if [ -n "$(git status --porcelain -- packages/sdk)" ]; then
          echo "packages/sdk generated code is stale. Run 'just update-generated' in packages/sdk and commit the result."
          git status --porcelain -- packages/sdk
          git diff -- packages/sdk | head -200
          exit 1
        fi
    - name: Regenerate MCP tool pages
      run: bun run generate:tools
      working-directory: apps/docs
    - name: Verify docs tool reference is fresh
      run: |
        if [ -n "$(git status --porcelain -- apps/docs)" ]; then
          echo "apps/docs tool reference is stale. Run 'bun run generate:tools' in apps/docs and commit the result."
          git status --porcelain -- apps/docs
          git diff -- apps/docs | head -200
          exit 1
        fi
    - name: Check Specta Types
      run: |
        just gen-agent-fold-types
        just gen-database-sql-types
        just gen-dynamic-ui-types
        just gen-agent-review-types
        if ! git diff --exit-code -- src/lib/service-clients/service-agent-fold/generated src/lib/core/database-sql/generated src/features/dynamic-ui/generated ../../packages/lexical-core/generated src/lib/service-clients/service-agent-reviews/generated ../../packages/sdk/generated/agent-reviews; then
          echo "Generated specta types are stale. Run 'just gen-agent-fold-types', 'just gen-database-sql-types', 'just gen-dynamic-ui-types' and 'just gen-agent-review-types' in apps/web and commit the result."
