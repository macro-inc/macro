        PREVIEW_BUCKET: macro-preview-assets-dev
      continue-on-error: true
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  ios-native-check:
    name: iOS Native Check
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      pull-requests: write
    steps:
    - id: checkout
      name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: native-filter
      name: Detect native iOS changes
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        predicate-quantifier: every
        filters: |
          ios_native:
            - 'apps/web/tauri/**'
            - '!apps/web/tauri/**/android/**'
            - '!apps/web/tauri/**/android_*'
            - '!apps/web/tauri/**/android_*/**'
            - '!apps/web/tauri/**/android.*'
            - '!apps/web/tauri/**/*.android.*'
            - '!apps/web/tauri/**/macos/**'
            - '!apps/web/tauri/**/macos_*'
            - '!apps/web/tauri/**/macos_*/**'
            - '!apps/web/tauri/**/macos.*'
            - '!apps/web/tauri/**/*.macos.*'
            - '!apps/web/tauri/**/linux_*'
            - '!apps/web/tauri/**/linux_*/**'
            - '!apps/web/tauri/**/desktop/**'
            - '!apps/web/tauri/**/desktop-*'
            - '!apps/web/tauri/**/desktop-*/**'
            - '!apps/web/tauri/**/desktop.*'
            - '!apps/web/tauri/desktop-release.json'
            - '!apps/web/tauri/.helix/**'
            - '!apps/web/tauri/**/*.md'
    - id: cache-wasm
      name: Detect a client cache wasm version bump
      run: |
        set -euo pipefail
        manifest=crates/client/cache-wasm/Cargo.toml
        version() { git show "$1:$manifest" 2>/dev/null | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1 | grep . || echo none; }
        # The merge commit's first parent is the main this merge result was
        # built on; a fresh fetch of main could be newer and misattribute
        # its bumps to the PR.
        base_sha=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -1)
        git fetch -q --depth=1 origin "$base_sha"
        echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
        base=$(version "$base_sha")
        head=$(version HEAD)
        echo "cache-wasm version: base ${base} (${base_sha:0:10}), merge result ${head}"
        if [[ "$base" != "$head" ]]; then
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "The client cache wasm version moved; the native app compiles that cache, so this counts as a native change."
        else
          echo "bumped=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - id: labels
      name: Read the PR's current labels
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true')
      run: |
        set -euo pipefail
        labels=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name] | join(",")')
        echo "labels: ${labels:-<none>}"
        if [[ ",${labels}," == *",skip-ios-update,"* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - id: bun
      name: Setup Bun
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - id: bump
      name: Verify iOS release numbers were bumped
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      run: bun scripts/ios-verify-native-bump.mjs
      env:
        BASE_REF: ${{ steps.cache-wasm.outputs.base_sha }}
      working-directory: apps/web
    - id: credentials
      name: Fetch App Store Connect credentials from Doppler
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      run: |
        set -euo pipefail
        # Fetch the App Store Connect credentials from Doppler (ios-release/prd) —
        # the same shape as the DMG workflow's notarization step — and hand them to
        # later steps the way the iOS scripts expect them:
        #   APPLE_API_KEY / APPLE_API_ISSUER            exported via GITHUB_ENV
        #   ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8   the private key, where
        #     altool, tauri (APPLE_API_KEY_PATH default) and ios-app-store.mjs look
        # With IOS_DISTRIBUTION_CERTIFICATE=1 the optional Apple Distribution .p12 is
        # decoded to $RUNNER_TEMP and exported as APPLE_DISTRIBUTION_CERTIFICATE_PATH
        # / _PASSWORD for the signing step.
        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "DOPPLER_TOKEN is empty: the IOS_RELEASE_DOPPLER_TOKEN secret is missing, or this is a fork PR (secrets are not available to forks; a maintainer must run the release from a branch in this repository, or add skip-ios-update if the change is non-breaking)." >&2
          exit 1
        fi

        umask 077
        secrets=$(mktemp)
        trap 'rm -f "$secrets"' EXIT
        curl --fail --silent --show-error --retry 3 \
          --header "Authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/configs/config/secrets/download?project=ios-release&config=prd&format=json' \
          > "$secrets"

        required() {
          jq -er --arg name "$1" '.[$name] | strings | select(length > 0)' "$secrets" \
            || { echo "ios-release/prd is missing $1" >&2; exit 1; }
        }
        key_id=$(required APPLE_API_KEY_ID)
        issuer=$(required APPLE_API_ISSUER)

        key_dir="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$key_dir"
        key_path="$key_dir/AuthKey_${key_id}.p8"
        required APPLE_API_PRIVATE_KEY > "$key_path"
        echo "::add-mask::$issuer"
        {
          echo "APPLE_API_KEY=$key_id"
          echo "APPLE_API_ISSUER=$issuer"
        } >> "$GITHUB_ENV"
        echo "Wrote App Store Connect API key $key_id to $key_path"

        if [ "${IOS_DISTRIBUTION_CERTIFICATE:-}" = "1" ]; then
          certificate=$(jq -r '.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 // empty' "$secrets")
          if [ -z "$certificate" ]; then
            echo "No APPLE_DISTRIBUTION_CERTIFICATE_BASE64 in ios-release/prd; the build will" \
              "rely on Xcode cloud signing via the API key."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          printf '%s' "$certificate" | base64 --decode > "$certificate_path" 2>/dev/null \
            || printf '%s' "$certificate" | base64 -D > "$certificate_path"
          password=$(jq -r '.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD // empty' "$secrets")
          [ -z "$password" ] || echo "::add-mask::$password"
          {
            echo "APPLE_DISTRIBUTION_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          echo "Wrote Apple Distribution certificate to $certificate_path"
        fi
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ secrets.IOS_RELEASE_DOPPLER_TOKEN }}
    - id: live
      name: Require Apple's approval of the App Store release
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      run: |
        # --- native tree ------------------------------------------------------------
        # Hash identifying "the iOS native code" at a commit: every tracked blob under
        # apps/web/tauri except the paths that never reach the iOS binary, recognised
        # by the same naming convention the Android gate uses (android-native.mjs,
        # which excludes iOS/macOS/linux/windows/apple/desktop-named paths): a path
        # component that is `android`, `macos`, `linux` or `windows` or starts with
        # that name plus `_`, `.` or `-`; one that is `desktop` or starts with
        # `desktop.` / `desktop-` (not `desktop_`: desktop_update and its Status type
        # compile into mobile, only desktop_update/desktop/ is cfg(desktop)); or an
        # extension-style `.android.` / `.macos.` / `.linux.` / `.windows.` infix (the
        # android_* plugins, tauri.android.conf.json and tauri.macos.conf.json,
        # src/desktop/, desktop-cef, linux_notification, the macos icons; the Rust
        # ones are all behind cfg(target_os) / cfg(desktop)) — plus the desktop
        # updater manifest, editor config and Markdown docs. `apple`/`ios` paths
        # stay included: gen/apple is the Xcode project. Plus one thing outside that tree: the
        # version of the client cache wasm package
        # (crates/client/cache-wasm/Cargo.toml). The app compiles the cache crates
        # natively, and the team bumps that version when a cache change must ship, so
        # the bump — not every edit under crates/client — is the native signal. The
        # release stamps uploaded builds with the hash, the merge gate compares the
        # approved build's stamp against the merge result's, and the drift / head guards
        # compare commits with it. Must match nativeTreeHash() in
        # apps/web/scripts/ios-app-store.mjs and the iOS Native Check's change
        # detection (web_app_check_main/ios_native_check.rs).
        NATIVE_TREE_PATH=apps/web/tauri
        CACHE_WASM_MANIFEST=crates/client/cache-wasm/Cargo.toml
        export NATIVE_TREE_EXCLUDE='(^|/)(android|macos|linux|windows)([_./-]|$)|(^|/)desktop([./-]|$)|\.(android|macos|linux|windows)\.|\.md$|^desktop-release\.json$|^\.helix/'

        # native_tree_listing <commit>: what the hash covers — the filtered ls-tree
        # lines plus the cache wasm version — fails if the path is missing.
        # (--full-tree: ls-tree otherwise narrows its output to the current directory,
        # which would silently hash nothing when run from apps/web.)
        native_tree_listing() {
          git rev-parse -q --verify "$1:${NATIVE_TREE_PATH}" >/dev/null || return 1
          git ls-tree -r --full-tree "$1:${NATIVE_TREE_PATH}" \
            | awk -F'\t' '$2 !~ ENVIRON["NATIVE_TREE_EXCLUDE"]'
          echo "cache-wasm-version $(cache_wasm_version "$1")"
        }

        # native_tree_hash <commit>: prints the hash of the listing, and fails when the
        # listing does (a pipe would hash nothing and succeed).
        native_tree_hash() {
          local listing
          listing=$(native_tree_listing "$1") || return 1
          git hash-object --stdin <<<"$listing"
        }

        # cache_wasm_version <commit>: the `version` of the client cache wasm package
        # at that commit ("none" before the package existed).
        cache_wasm_version() {
          git show "$1:${CACHE_WASM_MANIFEST}" 2>/dev/null \
            | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1 | grep . || echo none
        }

        # native_tree_fetch <sha>: make a commit that is not in this checkout (a new
        # PR head, GitHub's test merge commit, the pre-push head) available to
        # native_tree_hash. Some callers persist actions/checkout credentials; clear
        # inherited headers before adding ours so Git sends Authorization exactly once.
        # Fails if the commit is unreachable (a force-pushed-away head).
        native_tree_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ----------------------------------------------------------------------------
        # --- PR merge result ----------------------------------------------------------
        # pr_merge_commit: print the sha of GitHub's test merge commit for $PR_NUMBER —
        # the merge result the native gates hash. GitHub computes it lazily
        # (mergeable=UNKNOWN until it has), so poll a little; a PR that really
        # conflicts with its base cannot merge anyway. Needs GH_TOKEN, GH_REPO,
        # PR_NUMBER. Progress goes to stderr so `merge=$(pr_merge_commit)` works.
        pr_merge_commit() {
          local deadline pr_json mergeable merge
          deadline=$(( $(date +%s) + 120 ))
          while true; do
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json mergeable,potentialMergeCommit)
            mergeable=$(jq -r '.mergeable' <<<"$pr_json")
            merge=$(jq -r '.potentialMergeCommit.oid // empty' <<<"$pr_json")
            if [[ -n "$merge" ]]; then
              echo "$merge"
              return 0
            fi
            if [[ "$mergeable" == "CONFLICTING" ]]; then
              echo "PR #${PR_NUMBER} conflicts with its base branch, so GitHub has no merge result for it." >&2
              return 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "GitHub has not computed PR #${PR_NUMBER}'s merge commit yet (mergeable=${mergeable})." >&2
              return 1
            fi
            echo "Merge commit not computed yet (mergeable=${mergeable}); waiting." >&2
            sleep 10
          done
        }
        # ------------------------------------------------------------------------------
        set -euo pipefail
        # The gate proper: Apple must have approved the committed version + build
        # (held for release or live), built from the native code of the PR's current
        # merge result.
        merge=$(pr_merge_commit)
        native_tree_fetch "$merge"
        native_tree=$(native_tree_hash "$merge")
        echo "Merge result ${merge:0:10}: native tree ${native_tree}"
        bun scripts/ios-app-store.mjs status --require-approved --native-tree "$native_tree"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      working-directory: apps/web
    - name: Skipped via label
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip == 'true'
      run: echo "Native iOS changes detected, but the skip-ios-update label says they don't break the native/web contract — skipping the App Store release gate."
    - name: Update iOS gate status on the PR
      if: '!cancelled() && github.event.pull_request.head.repo.full_name == github.repository'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          const marker = '<!-- ios-native-check-status -->';
          const steps = JSON.parse(process.env.IOS_GATE_STEPS);
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
          // A rerun uses the original event. Never replace the current head's status
          // with an older commit's result, or create comments after the PR has closed.
          if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) return;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find((comment) =>
            comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
          const native = steps['native-filter']?.outputs?.ios_native === 'true'
            || steps['cache-wasm']?.outputs?.bumped === 'true';
          const detectionComplete = steps['native-filter']?.outcome === 'success'
            && steps['cache-wasm']?.outcome === 'success';
          const failed = Object.entries(steps).filter(([, step]) => step.outcome === 'failure');
          if (!native && failed.length === 0 && !existing) return;

          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT ?? "1"}`;
          const guideUrl = `${context.serverUrl}/${owner}/${repo}/blob/${pr.head.sha}/apps/web/docs/ios-releases.md`;
          const release = steps.live?.outputs?.gate_result
            ? JSON.parse(steps.live.outputs.gate_result) : null;
          const labels = pr.labels.map((label) => label.name);
          const lines = [marker];
          if (failed.length && !release) {
            const names = {
              checkout: 'Checkout Repo',
              bun: 'Setup Bun',
              'native-filter': 'Detect native iOS changes',
              'cache-wasm': 'Detect a client cache wasm version bump',
              labels: "Read the PR's labels",
              bump: 'Verify iOS release numbers were bumped',
              credentials: 'Fetch App Store Connect credentials',
              live: 'Fetch the merge result and check App Store status',
            };
            lines.push('### iOS release check could not complete', '',
              `Failed step: **${failed.map(([id]) => names[id] ?? id).join(', ')}**.`, '',
              `See the [workflow logs](${runUrl}) for the error, fix it, then rerun the check.`,
              'This failure does not establish whether Apple approved the App Store release.');
          } else if (!native && detectionComplete) {
            lines.push('### iOS release not required', '', 'This PR no longer changes native iOS code.');
          } else if (steps.labels?.outputs?.skip === 'true') {
            lines.push('### iOS release gate bypassed', '',
              'The `skip-ios-update` label bypasses this check. App Store availability has not been verified.');
          } else if (release) {
            const name = `iOS ${release.version} (build ${release.build})`;
            if (release.kind === 'approved') {
              lines.push(`### ${name} is approved and verified`, '',
                'Apple approved the App Store build, and it matches this PR’s current merge result. The iOS release requirement is satisfied; other checks and approvals still apply.');
              if (release.state) lines.push('', `App Store state: \`${release.state}\`.`);
            } else {
              lines.push(`### ${name} must be approved before this PR can merge`, '', release.reason);
              if (release.state) lines.push('', `App Store state: \`${release.state}\`.`);
              if (release.kind === 'waiting') {
                lines.push('', 'Wait for Apple to approve the release.');
              } else if (release.kind === 'mismatch') {
                lines.push('', 'Bump the release numbers, commit, push, then remove and re-add `ios-update` to release the current native code. Use `--no-min` for a release that does not need a higher native build floor.');
              } else {
                lines.push('', labels.includes('ios-update')
                  ? 'The `ios-update` label is already present. Follow the **iOS App Store Release** run; if it failed, fix the reported problem, then remove and re-add the label to retry. Resolve any rejection or metadata issue in App Store Connect first.'
                  : 'Once the other checks pass and the PR is ready, add **`ios-update`** to build, upload, and submit it for App Review.');
              }
              lines.push('', 'After approval, **iOS Release Watch** reruns this check within 30 minutes. You can also rerun it manually. Optionally enable **auto-merge** to merge once all requirements pass.');
            }
            lines.push('', `The next prod deploy releases ${name} on the App Store and makes the web bundle require iOS build **${release.floor}** or later, as committed in this PR.`,
              '', `[App Store Connect](${release.distributionUrl})`);
          } else {
            // No structured result means verification never completed; never infer an
            // Apple state from an exit code or unstructured log text.
            lines.push('### iOS release status unavailable', '',
              `The check produced no App Store result. Inspect the [workflow logs](${runUrl}) and rerun it.`);
          }
          lines.push('', `[Workflow run](${runUrl}) · [Release guide](${guideUrl})`);
          const body = lines.join('\n');
          await core.summary.addRaw(body.replace(`${marker}\n`, '')).write();
          if (existing) {
            if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
      env:
        IOS_GATE_STEPS: ${{ toJSON(steps) }}
  status-check:
    needs:
    - path-check
    - android-native-check
    - typescript
    - generated-code
    - biome-check
    - test
    - functional
    - browser
    - cycles
    - build
    - ios-native-check
    if: always()
    name: Web App Status Check
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "android-native-check: ${{ needs.android-native-check.result }}"
        echo "typescript: ${{ needs.typescript.result }}"
        echo "generated-code: ${{ needs.generated-code.result }}"
        echo "biome-check: ${{ needs.biome-check.result }}"
        echo "test: ${{ needs.test.result }}"
        echo "functional: ${{ needs.functional.result }}"
        echo "browser: ${{ needs.browser.result }}"
        echo "cycles: ${{ needs.cycles.result }}"
        echo "build: ${{ needs.build.result }}"
        echo "ios-native-check: ${{ needs.ios-native-check.result }}"

        # Fail if any job failed (skipped and success are both OK). The iOS
        # gate is the merge gate, so a cancelled gate is not OK either. The same
        # goes for generated code: a job that hits its timeout reports cancelled.
        if [[ "${{ needs.android-native-check.result }}" != "success" ]] || \
           [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.typescript.result }}" == "failure" ]] || \
           [[ "${{ needs.generated-code.result }}" == "failure" ]] || \
           [[ "${{ needs.generated-code.result }}" == "cancelled" ]] || \
           [[ "${{ needs.biome-check.result }}" == "failure" ]] || \
           [[ "${{ needs.test.result }}" == "failure" ]] || \
           [[ "${{ needs.functional.result }}" == "failure" ]] || \
           [[ "${{ needs.browser.result }}" == "failure" ]] || \
           [[ "${{ needs.cycles.result }}" == "failure" ]] || \
           [[ "${{ needs.build.result }}" == "failure" ]] || \
           [[ "${{ needs.ios-native-check.result }}" == "failure" ]] || \
           [[ "${{ needs.ios-native-check.result }}" == "cancelled" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi

        echo "All jobs passed or were skipped"
