      env:
        PREVIEW_BUCKET: macro-preview-assets-dev
      continue-on-error: true
    - id: preview-deploy
      name: Deploy to S3
      if: needs.path-check.outputs.web_artifact_changed == 'true' && !contains(github.event.pull_request.title, '[no preview]') && github.event.pull_request.head.repo.full_name == github.repository && steps.preview-bucket.outcome == 'success'
      run: |
