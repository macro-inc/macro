      working-directory: apps/web
    - name: Comment on PR
      if: needs.path-check.outputs.web_artifact_changed == 'true' && !contains(github.event.pull_request.title, '[no preview]') && github.event.pull_request.head.repo.full_name == github.repository && steps.preview-deploy.outcome == 'success'
      run: |
        bun scripts/preview/post-comment.ts \
          --pr ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --preview-id ${{ steps.preview-id.outputs.id }} \
          --sha ${{ github.sha }}
