          --repo ${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --branch "${{ github.head_ref }}")
        echo "id=$PREVIEW_ID" >> $GITHUB_OUTPUT
        echo "Preview ID: $PREVIEW_ID"
      env:
        PREVIEW_BUCKET: macro-preview-assets-dev
      continue-on-error: true
      working-directory: apps/web
    - id: preview-bucket
      name: Validate bucket name
      if: needs.path-check.outputs.web_artifact_changed == 'true' && !contains(github.event.pull_request.title, '[no preview]') && github.event.pull_request.head.repo.full_name == github.repository && steps.preview-id.outcome == 'success'
