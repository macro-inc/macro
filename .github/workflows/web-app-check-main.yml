# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/web_app_check_main.rs
name: Web App Pr Checks
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
jobs:
  path-check:
    runs-on: namespace-profile-linux-tiny-no-cache
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      codegen_changed: ${{ steps.filter.outputs.codegen_changed }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - 'services/lexical-service/**'
            - 'crates/ai_tools/src/display_results/schema.generated.json'
            - '.github/actions/setup-reqs-web/**'
          codegen_changed:
            - 'crates/**/*.rs'
            - 'services/**/*.rs'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'apps/web/scripts/generate-api-schema.ts'
            - 'apps/web/scripts/services.ts'
            - 'packages/sdk/**'
            - 'apps/docs/**'
            - '.github/actions/setup-reqs-web/**'
  android-version:
    name: Android Version Code
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
    steps:
    - name: Checkout PR merge commit
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Require an Android version bump for native changes
      run: |
        set -euo pipefail
        git fetch -q --depth=1 origin "$BASE_SHA"
        bun scripts/android-version-check.mjs "$BASE_SHA"
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      working-directory: apps/web
  typescript:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Typecheck
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: /home/runner/.bun/install/cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
    - name: Check Dynamic UI Schema
      run: bun run check-dynamic-ui-schema
      working-directory: apps/web
    - name: Check Types
      run: bun run type-check
      working-directory: apps/web
    - name: Check Functional Test Types
      run: bun run --bun --silent tsc --project tests/functional/tsconfig.json
      working-directory: apps/web
    - name: Check Collaboration Package Types
      run: bun run type-check
      working-directory: packages/collaboration
    - name: Check Lexical Service Types
      run: bun run check
      working-directory: services/lexical-service
    - name: Test Lexical Service Endpoints
      run: bun test src
      working-directory: services/lexical-service
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  generated-code:
    needs:
    - path-check
    if: needs.path-check.outputs.codegen_changed == 'true'
    name: Generated Code Check
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build schema binaries
      run: |
        set -euo pipefail
        read -ra openapi_bins <<< "$(cd apps/web && bun scripts/generate-api-schema.ts --print-cargo-bins)"
        SQLX_OFFLINE=true cargo build "${openapi_bins[@]}" --bin gen_tool_schemas
    - name: Generate API Types
      run: bun run gen-api -- --check
      working-directory: apps/web
    - name: Regenerate SDK code
      run: |
        bun install --frozen-lockfile
        bun run sync-specs
        bun run generate
      working-directory: packages/sdk
    - name: Verify SDK generated code is fresh
      run: |
        if [ -n "$(git status --porcelain -- packages/sdk)" ]; then
          echo "packages/sdk generated code is stale. Run 'just update-generated' in packages/sdk and commit the result."
          git status --porcelain -- packages/sdk
          git diff -- packages/sdk | head -200
          exit 1
        fi
    - name: Regenerate MCP tool pages
      run: bun run generate:tools
      working-directory: apps/docs
    - name: Verify docs tool reference is fresh
      run: |
        if [ -n "$(git status --porcelain -- apps/docs)" ]; then
          echo "apps/docs tool reference is stale. Run 'bun run generate:tools' in apps/docs and commit the result."
          git status --porcelain -- apps/docs
          git diff -- apps/docs | head -200
          exit 1
        fi
    - name: Check Specta Types
      run: |
        just gen-agent-fold-types
        just gen-database-sql-types
        if ! git diff --exit-code -- src/lib/service-clients/service-agent-fold/generated src/lib/core/database-sql/generated; then
          echo "Generated wasm wire types are stale. Run 'just gen-agent-fold-types' and 'just gen-database-sql-types' in apps/web and commit the result."
          exit 1
        fi
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  biome-check:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Biome Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: '0'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Run Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: apps/web
    - name: Run Collaboration Package Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: packages/collaboration
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  test:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Test
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cache/vitest-modules
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup
      uses: './.github/actions/setup-reqs-web'
      with:
        playwright: 'true'
    - name: Build agent-fold WASM for tests
      run: just build-agent-fold-wasm
      timeout-minutes: 15
      working-directory: apps/web
    - name: Test
      run: bun run test
      env:
        VITEST_MODULE_CACHE_DIR: /home/runner/.cache/vitest-modules
      working-directory: apps/web
    - name: Sign-up Browser Tests
      run: just test-signup-browser
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  cycles:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Cycles Import Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Cycles Import Check
      run: biome lint --changed --no-errors-on-unmatched --only=suspicious/noImportCycles
      working-directory: apps/web
    - name: Collaboration Package Cycles Import Check
      run: biome lint --changed --no-errors-on-unmatched --only=suspicious/noImportCycles
      working-directory: packages/collaboration
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  build:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Build
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cache/.wasm-pack
          /home/runner/.cache/wasm-pkgs
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup
      uses: './.github/actions/setup-reqs-web'
      with:
        playwright: 'true'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Start sccache server
      run: sccache --start-server
    - name: Build
      run: just build-dev
      env:
        WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs
      working-directory: apps/web
    - name: Test Optimistic Mutations in Chromium
      run: bun run test:functional
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  ios-native-check:
    name: iOS Native Check
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: native-filter
      name: Detect native iOS changes
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        predicate-quantifier: every
        filters: |
          ios_native:
            - 'apps/web/tauri/**'
            - '!apps/web/tauri/**/android/**'
            - '!apps/web/tauri/**/android_*'
            - '!apps/web/tauri/**/android_*/**'
            - '!apps/web/tauri/**/android.*'
            - '!apps/web/tauri/**/*.android.*'
            - '!apps/web/tauri/desktop-release.json'
            - '!apps/web/tauri/.helix/**'
    - id: cache-wasm
      name: Detect a client cache wasm version bump
      run: |
        set -euo pipefail
        manifest=crates/client/cache-wasm/Cargo.toml
        version() { git show "$1:$manifest" 2>/dev/null | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1 | grep . || echo none; }
        git fetch -q --depth=1 origin "$BASE_BRANCH"
        base=$(version "origin/$BASE_BRANCH")
        head=$(version HEAD)
        echo "cache-wasm version: base ${base}, merge result ${head}"
        if [[ "$base" != "$head" ]]; then
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "The client cache wasm version moved; the native app compiles that cache, so this counts as a native change."
        else
          echo "bumped=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        BASE_BRANCH: ${{ github.base_ref }}
    - id: labels
      name: Read the PR's current labels
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true')
      run: |
        set -euo pipefail
        labels=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name] | join(",")')
        echo "labels: ${labels:-<none>}"
        if [[ ",${labels}," == *",skip-ios-update,"* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - name: Setup Bun
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Verify iOS release numbers were bumped
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      run: |
        set -euo pipefail
        git fetch --depth=1 origin "$BASE_BRANCH"
        bun scripts/ios-verify-native-bump.mjs
      shell: bash
      env:
        BASE_BRANCH: ${{ github.base_ref }}
        BASE_REF: origin/${{ github.base_ref }}
      working-directory: apps/web
    - name: Fetch App Store Connect credentials from Doppler
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      run: |
        set -euo pipefail
        # Fetch the App Store Connect credentials from Doppler (ios-release/prd) —
        # the same shape as the DMG workflow's notarization step — and hand them to
        # later steps the way the iOS scripts expect them:
        #   APPLE_API_KEY / APPLE_API_ISSUER            exported via GITHUB_ENV
        #   ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8   the private key, where
        #     altool, tauri (APPLE_API_KEY_PATH default) and ios-app-store.mjs look
        # With IOS_DISTRIBUTION_CERTIFICATE=1 the optional Apple Distribution .p12 is
        # decoded to $RUNNER_TEMP and exported as APPLE_DISTRIBUTION_CERTIFICATE_PATH
        # / _PASSWORD for the signing step.
        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "DOPPLER_TOKEN is empty: the IOS_RELEASE_DOPPLER_TOKEN secret is missing, or this is a fork PR (secrets are not available to forks; a maintainer must run the release from a branch in this repository, or add skip-ios-update if the change is non-breaking)." >&2
          exit 1
        fi

        umask 077
        secrets=$(mktemp)
        trap 'rm -f "$secrets"' EXIT
        curl --fail --silent --show-error --retry 3 \
          --header "Authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/configs/config/secrets/download?project=ios-release&config=prd&format=json' \
          > "$secrets"

        required() {
          jq -er --arg name "$1" '.[$name] | strings | select(length > 0)' "$secrets" \
            || { echo "ios-release/prd is missing $1" >&2; exit 1; }
        }
        key_id=$(required APPLE_API_KEY_ID)
        issuer=$(required APPLE_API_ISSUER)

        key_dir="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$key_dir"
        key_path="$key_dir/AuthKey_${key_id}.p8"
        required APPLE_API_PRIVATE_KEY > "$key_path"
        echo "::add-mask::$issuer"
        {
          echo "APPLE_API_KEY=$key_id"
          echo "APPLE_API_ISSUER=$issuer"
        } >> "$GITHUB_ENV"
        echo "Wrote App Store Connect API key $key_id to $key_path"

        if [ "${IOS_DISTRIBUTION_CERTIFICATE:-}" = "1" ]; then
          certificate=$(jq -r '.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 // empty' "$secrets")
          if [ -z "$certificate" ]; then
            echo "No APPLE_DISTRIBUTION_CERTIFICATE_BASE64 in ios-release/prd; the build will" \
              "rely on Xcode cloud signing via the API key."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          printf '%s' "$certificate" | base64 --decode > "$certificate_path" 2>/dev/null \
            || printf '%s' "$certificate" | base64 -D > "$certificate_path"
          password=$(jq -r '.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD // empty' "$secrets")
          [ -z "$password" ] || echo "::add-mask::$password"
          {
            echo "APPLE_DISTRIBUTION_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          echo "Wrote Apple Distribution certificate to $certificate_path"
        fi
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ secrets.IOS_RELEASE_DOPPLER_TOKEN }}
    - name: Require the App Store release to be live
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip != 'true'
      run: |
        # --- native tree ------------------------------------------------------------
        # Hash identifying "the iOS native code" at a commit: every tracked blob under
        # apps/web/tauri except the paths that never reach the iOS binary. Android-only
        # code is recognised by Tauri's naming convention — a path component that is
        # `android`, starts with `android_` / `android.`, or contains `.android.`
        # (the android_* plugins, every android/ directory, android.rs / android.json,
        # android_tls.rs, tauri.android.conf.json; the Rust ones are all behind
        # cfg(target_os = "android")) — plus the desktop updater manifest and editor
        # config. Plus one thing outside that tree: the version of the client cache
        # wasm package (crates/client/cache-wasm/Cargo.toml). The app compiles the
        # cache crates natively, and the team bumps that version when a cache change
        # must ship, so the bump — not every edit under crates/client — is the native
        # signal. The release stamps uploaded builds with the hash, the merge gate
        # compares the live build's stamp against the merge result's, and the drift /
        # head guards compare commits with it. Must match nativeTreeHash() in
        # apps/web/scripts/ios-app-store.mjs and the iOS Native Check's change
        # detection (web_app_check_main/ios_native_check.rs).
        NATIVE_TREE_PATH=apps/web/tauri
        CACHE_WASM_MANIFEST=crates/client/cache-wasm/Cargo.toml
        export NATIVE_TREE_EXCLUDE='(^|/)android([_./]|$)|\.android\.|^desktop-release\.json$|^\.helix/'

        # native_tree_hash <commit>: prints the hash, fails if the path is missing.
        # (--full-tree: ls-tree otherwise narrows its output to the current directory,
        # which would silently hash nothing when run from apps/web.)
        native_tree_hash() {
          git rev-parse -q --verify "$1:${NATIVE_TREE_PATH}" >/dev/null || return 1
          {
            git ls-tree -r --full-tree "$1:${NATIVE_TREE_PATH}" \
              | awk -F'\t' '$2 !~ ENVIRON["NATIVE_TREE_EXCLUDE"]'
            echo "cache-wasm-version $(cache_wasm_version "$1")"
          } | git hash-object --stdin
        }

        # cache_wasm_version <commit>: the `version` of the client cache wasm package
        # at that commit ("none" before the package existed).
        cache_wasm_version() {
          git show "$1:${CACHE_WASM_MANIFEST}" 2>/dev/null \
            | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1 | grep . || echo none
        }

        # native_tree_fetch <sha>: make a commit that is not in this checkout (a new
        # PR head, GitHub's test merge commit, the pre-push head) available to
        # native_tree_hash. Checkouts here don't persist credentials, so authenticate
        # the way actions/checkout does. Fails if the commit is unreachable (a
        # force-pushed-away head).
        native_tree_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ----------------------------------------------------------------------------
        set -euo pipefail
        # The gate proper: the committed version + build must be live, built from the
        # native code of the PR's current merge result. GitHub computes that merge
        # commit lazily (mergeable=UNKNOWN until it has), so poll for it a little; a
        # PR that really conflicts with main cannot merge anyway.
        deadline=$(( $(date +%s) + 120 ))
        while true; do
          pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json mergeable,potentialMergeCommit)
          mergeable=$(jq -r '.mergeable' <<<"$pr_json")
          merge=$(jq -r '.potentialMergeCommit.oid // empty' <<<"$pr_json")
          [[ -n "$merge" ]] && break
          if [[ "$mergeable" == "CONFLICTING" ]]; then
            echo "::error::PR #${PR_NUMBER} conflicts with its base branch, so there is no merge result to check; resolve the conflicts first." >&2
            exit 1
          fi
          if (( $(date +%s) > deadline )); then
            echo "::error::GitHub has not computed PR #${PR_NUMBER}'s merge commit yet (mergeable=${mergeable}); re-run this job in a minute." >&2
            exit 1
          fi
          echo "Merge commit not computed yet (mergeable=${mergeable}); waiting."
          sleep 10
        done
        native_tree_fetch "$merge"
        native_tree=$(native_tree_hash "$merge")
        echo "Merge result ${merge:0:10}: native tree ${native_tree}"
        bun scripts/ios-app-store.mjs status --require-live --native-tree "$native_tree"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      working-directory: apps/web
    - name: Skipped via label
      if: (steps.native-filter.outputs.ios_native == 'true' || steps.cache-wasm.outputs.bumped == 'true') && steps.labels.outputs.skip == 'true'
      run: echo "Native iOS changes detected, but the skip-ios-update label says they don't break the native/web contract — skipping the App Store release gate."
  status-check:
    needs:
    - path-check
    - android-version
    - typescript
    - generated-code
    - biome-check
    - test
    - cycles
    - build
    - ios-native-check
    if: always()
    name: Web App Status Check
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "android-version: ${{ needs.android-version.result }}"
        echo "typescript: ${{ needs.typescript.result }}"
        echo "generated-code: ${{ needs.generated-code.result }}"
        echo "biome-check: ${{ needs.biome-check.result }}"
        echo "test: ${{ needs.test.result }}"
        echo "cycles: ${{ needs.cycles.result }}"
        echo "build: ${{ needs.build.result }}"
        echo "ios-native-check: ${{ needs.ios-native-check.result }}"

        # Fail if any job failed (skipped and success are both OK). The iOS
        # gate is the merge gate, so a cancelled gate is not OK either.
        if [[ "${{ needs.android-version.result }}" != "success" ]] || \
           [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.typescript.result }}" == "failure" ]] || \
           [[ "${{ needs.generated-code.result }}" == "failure" ]] || \
           [[ "${{ needs.biome-check.result }}" == "failure" ]] || \
           [[ "${{ needs.test.result }}" == "failure" ]] || \
           [[ "${{ needs.cycles.result }}" == "failure" ]] || \
           [[ "${{ needs.build.result }}" == "failure" ]] || \
           [[ "${{ needs.ios-native-check.result }}" == "failure" ]] || \
           [[ "${{ needs.ios-native-check.result }}" == "cancelled" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi

        echo "All jobs passed or were skipped"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check
  cancel-in-progress: true
