# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/web_app_check_main.rs
name: Web App Pr Checks
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
jobs:
  path-check:
    runs-on: namespace-profile-linux-tiny-no-cache
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      codegen_changed: ${{ steps.filter.outputs.codegen_changed }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - 'services/lexical-service/**'
            - 'crates/ai_tools/src/display_results/schema.generated.json'
            - '.github/actions/setup-reqs-web/**'
          codegen_changed:
            - 'crates/**/*.rs'
            - 'services/**/*.rs'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'apps/web/scripts/generate-api-schema.ts'
            - 'apps/web/scripts/services.ts'
            - 'packages/sdk/**'
            - 'apps/docs/**'
            - '.github/actions/setup-reqs-web/**'
  typescript:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Typecheck
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: /home/runner/.bun/install/cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
    - name: Check Dynamic UI Schema
      run: bun run check-dynamic-ui-schema
      working-directory: apps/web
    - name: Check Types
      run: bun run type-check
      working-directory: apps/web
    - name: Check Functional Test Types
      run: bun run --bun --silent tsc --project tests/functional/tsconfig.json
      working-directory: apps/web
    - name: Check Collaboration Package Types
      run: bun run type-check
      working-directory: packages/collaboration
    - name: Check Lexical Service Types
      run: bun run check
      working-directory: services/lexical-service
    - name: Test Lexical Service Endpoints
      run: bun test src
      working-directory: services/lexical-service
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  generated-code:
    needs:
    - path-check
    if: needs.path-check.outputs.codegen_changed == 'true'
    name: Generated Code Check
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build schema binaries
      run: |
        set -euo pipefail
        read -ra openapi_bins <<< "$(cd apps/web && bun scripts/generate-api-schema.ts --print-cargo-bins)"
        SQLX_OFFLINE=true cargo build "${openapi_bins[@]}" --bin gen_tool_schemas
    - name: Generate API Types
      run: bun run gen-api -- --check
      working-directory: apps/web
    - name: Regenerate SDK code
      run: |
        bun install --frozen-lockfile
        bun run sync-specs
        bun run generate
      working-directory: packages/sdk
    - name: Verify SDK generated code is fresh
      run: |
        if [ -n "$(git status --porcelain -- packages/sdk)" ]; then
          echo "packages/sdk generated code is stale. Run 'just update-generated' in packages/sdk and commit the result."
          git status --porcelain -- packages/sdk
          git diff -- packages/sdk | head -200
          exit 1
        fi
    - name: Regenerate MCP tool pages
      run: bun run generate:tools
      working-directory: apps/docs
    - name: Verify docs tool reference is fresh
      run: |
        if [ -n "$(git status --porcelain -- apps/docs)" ]; then
          echo "apps/docs tool reference is stale. Run 'bun run generate:tools' in apps/docs and commit the result."
          git status --porcelain -- apps/docs
          git diff -- apps/docs | head -200
          exit 1
        fi
    - name: Check Specta Types
      run: |
        just gen-agent-fold-types
        just gen-database-sql-types
        if ! git diff --exit-code -- src/lib/service-clients/service-agent-fold/generated src/lib/core/database-sql/generated; then
          echo "Generated wasm wire types are stale. Run 'just gen-agent-fold-types' and 'just gen-database-sql-types' in apps/web and commit the result."
          exit 1
        fi
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  biome-check:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Biome Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: '0'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Run Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: apps/web
    - name: Run Collaboration Package Biome
      run: biome ci --changed --no-errors-on-unmatched --error-on-warnings
      working-directory: packages/collaboration
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  test:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Test
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cache/vitest-modules
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup
      uses: './.github/actions/setup-reqs-web'
      with:
        playwright: 'true'
    - name: Build agent-fold WASM for tests
      run: just build-agent-fold-wasm
      timeout-minutes: 15
      working-directory: apps/web
    - name: Test
      run: bun run test
      env:
        VITEST_MODULE_CACHE_DIR: /home/runner/.cache/vitest-modules
      working-directory: apps/web
    - name: Sign-up Browser Tests
      run: just test-signup-browser
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  cycles:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Cycles Import Check
    runs-on: namespace-profile-linux-small;overrides.cache-tag=web-ci
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Cycles Import Check
      run: biome lint --changed --no-errors-on-unmatched --only=suspicious/noImportCycles
      working-directory: apps/web
    - name: Collaboration Package Cycles Import Check
      run: biome lint --changed --no-errors-on-unmatched --only=suspicious/noImportCycles
      working-directory: packages/collaboration
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  build:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true'
    name: Build
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cache/.wasm-pack
          /home/runner/.cache/wasm-pkgs
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup
      uses: './.github/actions/setup-reqs-web'
      with:
        playwright: 'true'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Start sccache server
      run: sccache --start-server
    - name: Build
      run: just build-dev
      env:
        WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs
      working-directory: apps/web
    - name: Test Optimistic Mutations in Chromium
      run: bun run test:functional
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  status-check:
    needs:
    - path-check
    - typescript
    - generated-code
    - biome-check
    - test
    - cycles
    - build
    if: always()
    name: Web App Status Check
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "typescript: ${{ needs.typescript.result }}"
        echo "generated-code: ${{ needs.generated-code.result }}"
        echo "biome-check: ${{ needs.biome-check.result }}"
        echo "test: ${{ needs.test.result }}"
        echo "cycles: ${{ needs.cycles.result }}"
        echo "build: ${{ needs.build.result }}"

        # Fail if any job failed (skipped and success are both OK)
        if [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.typescript.result }}" == "failure" ]] || \
           [[ "${{ needs.generated-code.result }}" == "failure" ]] || \
           [[ "${{ needs.biome-check.result }}" == "failure" ]] || \
           [[ "${{ needs.test.result }}" == "failure" ]] || \
           [[ "${{ needs.cycles.result }}" == "failure" ]] || \
           [[ "${{ needs.build.result }}" == "failure" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi

        echo "All jobs passed or were skipped"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check
  cancel-in-progress: true
