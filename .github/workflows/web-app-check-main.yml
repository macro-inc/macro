        run: bun run test --shard="${SHARD}/6"
        env:
          SHARD: ${{ matrix.shard }}
          VITEST_MODULE_CACHE_DIR: /home/runner/.cache/vitest-modules
        working-directory: apps/web
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
