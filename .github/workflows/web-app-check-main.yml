        run: just build-agent-fold-wasm
        env:
          WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs
          WASM_PKG_HTTP_CACHE: '1'
        timeout-minutes: 15
        working-directory: apps/web
      - name: Build natural-time WASM for tests
        run: just build-natural-time-wasm
        env:
          WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs
          WASM_PKG_HTTP_CACHE: '1'
        timeout-minutes: 15
        working-directory: apps/web
