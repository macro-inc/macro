# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/main_rust_check.rs
name: cloud storage main check
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: limited
  CARGO_PROFILE_TEST_DEBUG: limited
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
'on':
  push:
    branches:
    - main
    paths:
    - Cargo.toml
    - Cargo.lock
    - Cross.toml
    - clippy.toml
    - deny.toml
    - rust-toolchain.toml
    - '.cargo/**'
    - '.config/**'
    - '.sqlx/**'
    - crates/**
    - services/**
    - tooling/xtask/**
    - static_assets/**
    - nix/**
    - nix-support/node_modules*
    - flake.nix
    - flake.lock
    - bun.lock
    - packages/sdk/**
    - packages/sdk-docs/**
    - packages/code-mode-sdk/**
    - '.github/actions/setup-nix/**'
    - '.github/actions/setup-nix-dev-shell/**'
    - '.github/actions/teardown-nix/**'
    - '.github/actions/setup-sccache/**'
    - '.github/services-config.json'
    - '.github/workflows/main_rust_check.yml'
jobs:
  check:
    runs-on: namespace-profile-linux-large-build;overrides.cache-tag=sccache-ci-int-check
    env:
      RUSTFLAGS: '-Dwarnings -Dclippy::disallowed_methods -C link-arg=-fuse-ld=mold'
      RUSTDOCFLAGS: '-Dwarnings'
      SQLX_OFFLINE: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: |-
          /nix
          ./target
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cargo/.global-cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build code-mode assets
      run: |
        set -euo pipefail

        # Build the code-mode assets once per SDK state, not once per job. Cache volumes
        # are forks of past jobs, so most jobs miss the store path another job just built.
        # The key is the store path, which covers every input of the build.
        assets="$(nix eval --raw .#code-mode-assets.outPath)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

        if nix-store --check-validity "$assets" 2>/dev/null; then
          echo "Code-mode assets already in the store"
          exit 0
        fi

        # Forks have no remote cache credentials.
        if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          nix build --no-link --print-build-logs .#code-mode-assets
          exit 0
        fi

        cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

        cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            --header "Authorization: Bearer $SCCACHE_WEBDAV_TOKEN" "$@"
        }

        if cache_request "$cache_url" | gunzip | nix-store --import; then
          echo "Code-mode assets restored from the remote cache"
          exit 0
        fi

        nix build --no-link --print-build-logs .#code-mode-assets

        # Losing the upload costs the next job a rebuild, not a failure.
        if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
          echo "Code-mode assets saved to the remote cache"
        else
          echo "::warning::Could not save code-mode assets to the remote cache"
        fi
    - name: fmt
      run: cargo fmt --check
    - name: clippy
      run: |
        set -euo pipefail

        # Mirrors run_tests.sh package selection so clippy only lints the crates this
        # PR can actually affect. `all` keeps the historical workspace invocation,
        # including sync_service's special-cased feature set.

        packages="${RUST_PACKAGES:-}"

        clippy_sync_service() {
          cargo clippy -p sync_service -- \
            -A clippy::unnecessary_map_or \
            -A clippy::collapsible_if
        }

        # Most of soup's dependents build it without `outbound` (no features, or
        # `ports` alone), where helpers only the service or the Postgres repository
        # call are dead code that --all-features hides.
        clippy_soup_without_outbound() {
          cargo clippy -p soup --no-default-features
          cargo clippy -p soup --no-default-features --features ports
        }

        if [ -z "$packages" ] || [ "$packages" = "all" ]; then
          cargo clippy --workspace --all-features --exclude sync_service
          clippy_sync_service
          clippy_soup_without_outbound
          exit 0
        fi

        if [ "$packages" = "none" ]; then
          echo "No Rust packages to lint"
          exit 0
        fi

        sync=false
        soup=false
        pkg_args=()
        for p in $packages; do
          if [ "$p" = "sync_service" ]; then
            sync=true
          else
            pkg_args+=(-p "$p")
          fi
          if [ "$p" = "soup" ]; then
            soup=true
          fi
        done

        if [ "${#pkg_args[@]}" -gt 0 ]; then
          cargo clippy --all-features "${pkg_args[@]}"
        fi

        if [ "$sync" = true ]; then
          clippy_sync_service
        fi

        if [ "$soup" = true ]; then
          clippy_soup_without_outbound
        fi
      env:
        RUST_PACKAGES: all
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  test:
    runs-on: namespace-profile-linux-large-build;overrides.cache-tag=sccache-ci-int
    env:
      RUST_PACKAGES: all
      NEXTEST_TEST_THREADS: '32'
      RUSTFLAGS: '-Dwarnings -C link-arg=-fuse-ld=mold'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SCCACHE_IDLE_TIMEOUT: '0'
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports:
        - '5432:5432'
        options: '--health-cmd pg_isready --health-interval 1s --health-timeout 5s --health-retries 30 --shm-size 1g'
      redis:
        image: redis:7
        ports:
        - '6379:6379'
        options: '--health-cmd "redis-cli ping" --health-interval 1s --health-timeout 5s --health-retries 30'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: |-
          /nix
          ./target
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cargo/.global-cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name sccache-ci-int > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
