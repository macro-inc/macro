        cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            --header "Authorization: Bearer $SCCACHE_WEBDAV_TOKEN" "$@"
        }

        if cache_request "$cache_url" | gunzip | nix-store --import; then
          echo "Code-mode assets restored from the remote cache"
          exit 0
        fi

        nix build --no-link --print-build-logs .#code-mode-assets

        # Losing the upload costs the next job a rebuild, not a failure.
        if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
          echo "Code-mode assets saved to the remote cache"
        else
          echo "::warning::Could not save code-mode assets to the remote cache"
        fi
    - name: configure postgres for concurrent tests
      run: |
        postgres_container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "pgvector/pgvector:pg14" { print $1; exit }')"
        if [ -z "$postgres_container" ]; then
          echo "pgvector/pgvector:pg14 service container not found" >&2
          docker ps
          exit 1
        fi

        docker exec -i "$postgres_container" psql -U user -d macrodb <<'SQL'
        ALTER SYSTEM SET fsync = off;
        ALTER SYSTEM SET synchronous_commit = off;
        ALTER SYSTEM SET full_page_writes = off;
        ALTER SYSTEM SET max_wal_size = '4GB';
        ALTER SYSTEM SET checkpoint_timeout = '30min';
        ALTER SYSTEM SET max_locks_per_transaction = 8192;
        SQL
        docker restart "$postgres_container"
        until docker exec "$postgres_container" pg_isready -U user -d macrodb; do
          sleep 1
        done
        docker exec "$postgres_container" psql -U user -d macrodb -c "SHOW max_locks_per_transaction;"
    - name: prepare tests
      run: just setup_test_envs && just initialize_dbs && just setup_test_template
    - name: run tests
      run: |
        set -euo pipefail

        # --no-tests=pass: a package filter can legitimately select a crate with no
        # tests; treat that as success, not nextest's default error.
        # sync-service is not part of this suite, and its storage backends are mutually
        # exclusive under --all-features.
        #
        # Package selection uses `cargo nextest run -p`, not `--workspace -E rdeps(...)`.
        # The filterset only decides which tests *run* after a workspace build; `-p`
        # is what keeps an unrelated crate's test binary from being compiled.
        #
        # `--lib --bins --tests` is safe with `--workspace` (cargo skips packages that
        # lack a given target type) but fails with `-p` when any selected package has
        # no lib — xtask binaries such as xtask_nextest_filter / xtask_workflows.
        # Unconstrained `-p` still runs that package's tests.

        : "${RUST_PACKAGES:?RUST_PACKAGES is required}"
        # Dependencies build without debug info, which cuts compile, link and disk cost.
        # Workspace crates keep CARGO_PROFILE_*_DEBUG=limited, so backtraces still carry
        # line numbers in our own code.
        common=(
          --config 'profile.dev.package."*".debug=false'
          --all-features --no-tests=pass
        )

        # The Deno tests are ignored by default because they need the pinned runtime. They
        # run from this same script so cargo sees identical flags and selection and reuses
        # what the first run compiled. Only tests in packages this PR selected can match.
        if [ "${NEXTEST_RUN_DENO_TESTS:-}" = "true" ]; then
          common+=(
            --run-ignored only --test-threads 2
            -E 'package(code_execution) or (package(agent_harness_service) and test(authenticated_mcp_runs_javascript_and_persists_source_and_result))'
          )
        else
          common+=(--test-threads "$NEXTEST_TEST_THREADS")
        fi

        if [ "$RUST_PACKAGES" = "all" ]; then
          cargo nextest run --workspace --exclude sync_service --lib --bins --tests "${common[@]}"
          exit 0
        fi

        pkg_args=()
        for package in $RUST_PACKAGES; do
          [ "$package" = "sync_service" ] || pkg_args+=(-p "$package")
        done

        if [ "${#pkg_args[@]}" -eq 0 ]; then
          echo "No packages in the test suite were affected"
          exit 0
        fi

        cargo nextest run "${common[@]}" "${pkg_args[@]}"
    - name: Set up code execution runtime
      if: env.RUST_PACKAGES == 'all' || contains(env.RUST_PACKAGES, 'code_execution') || contains(env.RUST_PACKAGES, 'agent_code_mode') || contains(env.RUST_PACKAGES, 'agent_harness_service')
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      with:
        deno-version: '2.9.6'
    - name: Test Deno sandbox and authenticated SDK execution
      if: env.RUST_PACKAGES == 'all' || contains(env.RUST_PACKAGES, 'code_execution') || contains(env.RUST_PACKAGES, 'agent_code_mode') || contains(env.RUST_PACKAGES, 'agent_harness_service')
      run: |
        set -euo pipefail

        # --no-tests=pass: a package filter can legitimately select a crate with no
        # tests; treat that as success, not nextest's default error.
        # sync-service is not part of this suite, and its storage backends are mutually
        # exclusive under --all-features.
        #
        # Package selection uses `cargo nextest run -p`, not `--workspace -E rdeps(...)`.
        # The filterset only decides which tests *run* after a workspace build; `-p`
        # is what keeps an unrelated crate's test binary from being compiled.
        #
        # `--lib --bins --tests` is safe with `--workspace` (cargo skips packages that
        # lack a given target type) but fails with `-p` when any selected package has
        # no lib — xtask binaries such as xtask_nextest_filter / xtask_workflows.
        # Unconstrained `-p` still runs that package's tests.

        : "${RUST_PACKAGES:?RUST_PACKAGES is required}"
        # Dependencies build without debug info, which cuts compile, link and disk cost.
        # Workspace crates keep CARGO_PROFILE_*_DEBUG=limited, so backtraces still carry
