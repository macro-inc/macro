        NEXTEST_RUN_DENO_TESTS: 'true'
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
