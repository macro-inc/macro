        set -euo pipefail
        # The android-update label means "release this and merge it when it is live",
        # so refuse to start unless the PR is in a mergeable state: not a draft, the
        # Android native code actually changed with a version code bump, and every
        # other check on the head commit passing (pending ones are waited on). Our own
        # checks are excluded: the native check is expected to be red until the
        # release is live.
        pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft,headRefOid,baseRefOid)
        if [[ "$(jq -r '.isDraft' <<<"$pr_json")" == "true" ]]; then
          echo "PR #${PR_NUMBER} is a draft; mark it ready for review before adding android-update." >&2
          exit 1
        fi
        head_sha=$(jq -r '.headRefOid' <<<"$pr_json")
        base_sha=$(jq -r '.baseRefOid' <<<"$pr_json")
        if [[ "$head_sha" != "$HEAD_SHA" ]]; then
          # Pushed since the label event. Web-only commits are fine (they ship over
          # the air after the merge); native ones would make this build stale.
          gh_fetch "$head_sha"
          if [[ "$(bun scripts/android-native.mjs hash "$head_sha")" != "$(bun scripts/android-native.mjs hash HEAD)" ]]; then
            echo "PR #${PR_NUMBER} got Android native changes since this run started (${HEAD_SHA:0:10} → ${head_sha:0:10});" \
              "re-add android-update on the current head." >&2
            exit 1
          fi
          echo "PR #${PR_NUMBER} moved to ${head_sha:0:10} since this run started, but its Android native code is unchanged; continuing."
        fi

        # The version code must be bumped against the base, and something native
        # must actually have changed — there is nothing to release otherwise.
        gh_fetch "$base_sha"
        outputs=$(mktemp)
        GITHUB_OUTPUT="$outputs" bun scripts/android-version-check.mjs "$base_sha"
        if [[ "$(sed -n 's/^changed=//p' "$outputs")" != "true" ]]; then
          echo "PR #${PR_NUMBER} has no Android native changes against its base; nothing to release (remove the android-update label)." >&2
          exit 1
        fi
        version_code=$(sed -n 's/^version_code=//p' "$outputs")

        # The gate compares the release stamp with the native hash of the PR's merge
        # result, not of its head. A head that lacks Android native code main gained
        # since the PR branched would be released but could never pass the gate — and
        # a Play release cannot be withdrawn. Refuse before the build instead.
        if ! merge_result_native_check "bun scripts/android-native.mjs hash" "bun scripts/android-native.mjs listing" gh_fetch; then
          echo "A bundle from this head could never pass the merge gate. Merge ${BASE_BRANCH} into the PR," \
            "bump (cd apps/web && just android-bump), commit, and re-add android-update." >&2
          exit 1
        fi
        echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
        echo "Releasing Android version code ${version_code}."

        # (`gh pr checks` names are job names, not workflow names.)
        ours='^(Android Native Check|Android Play Release|Re-run the native check|Web App Status Check|Android Release Drift|iOS Native Check)'
        deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
        while true; do
          checks=$(gh pr checks "$PR_NUMBER" --repo "$GH_REPO" --json name,bucket \
            | jq -c --arg ours "$ours" '[.[] | select(.name | test($ours) | not)]')
          failing=$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' <<<"$checks")
          pending=$(jq -r '[.[] | select(.bucket == "pending") | .name] | join(", ")' <<<"$checks")
          if [[ -n "$failing" ]]; then
            echo "PR #${PR_NUMBER} has failing checks: ${failing}. Get the PR green, then re-add android-update." >&2
            exit 1
          fi
          if [[ -z "$pending" ]]; then
            echo "All other checks on ${head_sha:0:10} pass ($(jq 'length' <<<"$checks") checks)."
            exit 0
          fi
          if (( $(date +%s) > deadline )); then
            echo "Checks still pending after ${WAIT_MINUTES} minutes: ${pending}. Re-add android-update once they pass." >&2
            exit 1
          fi
          echo "Waiting for: ${pending}"
          sleep 60
        done
      shell: bash
      env:
        LOGGED_STEP: Require the PR to be ready to merge
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        WAIT_MINUTES: '30'
      working-directory: apps/web
    - name: Install Android SDK components
      run: |
        set -euo pipefail
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
        echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      shell: bash
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup prerequisites
      uses: './.github/actions/setup-reqs-web'
    - id: metadata
      name: Prepare version and signing
      run: |
        set -euo pipefail
        filename=$(bun scripts/android-release.ts metadata "vc${VERSION_CODE}" "$RUNNER_TEMP/android-release.json")
        echo "filename=$filename" >> "$GITHUB_OUTPUT"
        echo "release_name=$(jq -r .version tauri/src-tauri/tauri.android.conf.json) (${VERSION_CODE})" >> "$GITHUB_OUTPUT"
        bun scripts/android-release.ts signing "$RUNNER_TEMP/android-signing" \
          tauri/src-tauri/gen/android/keystore.properties
        bun scripts/android-firebase.ts build --doppler "$RUNNER_TEMP/android-google-services.json"
      shell: bash
      env:
        VERSION_CODE: ${{ steps.preconditions.outputs.version_code }}
        DOPPLER_TOKEN: ${{ secrets.ANDROID_RELEASE_DOPPLER_TOKEN }}
      working-directory: apps/web
    - name: Build production App Bundle
      run: |
        set -euo pipefail
        # The Nix environment is already loaded. Do not reload it in nested
        # bash processes and re-enable its local-development sccache wrapper.
        # This ephemeral runner has no compiler cache/server to reuse.
        unset BASH_ENV
        export RUSTC_WRAPPER=""
        cargo tauri --version
        # Tauri has shipped both switch-only and value-taking APK/AAB flags.
        # Nix and local installations can differ; build only the AAB with either CLI.
        android_help=$(cargo tauri android build --help)
        artifact_args=(--aab)
        if [[ "$android_help" == *'--apk <APK>'* ]]; then
          artifact_args=(--apk false --aab true)
        fi
        just android-build --firebase-config "$RUNNER_TEMP/android-google-services.json" \
          "${artifact_args[@]}" --ci --config "$RUNNER_TEMP/android-release.json" \
          2>&1 | tee "$RUNNER_TEMP/android-build.log"
      shell: bash
      env:
        VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        VITE_OTEL_EXPORTER_URL: https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces
        VITE_OTEL_ENV: prod
      working-directory: apps/web
    - name: Preserve Android build log
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-build-log
        path: ${{ runner.temp }}/android-build.log
        if-no-files-found: ignore
        retention-days: '7'
    - id: artifact
      name: Verify and collect App Bundle
      run: |
        printf '%s\n' "$LOGGED_STEP" > "$RUNNER_TEMP/last-step.name"
        exec > >(tee "$RUNNER_TEMP/last-step.log") 2>&1
        set -euo pipefail
        curl --fail --location --retry 3 \
          https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
          --output "$RUNNER_TEMP/bundletool.jar"
        echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
        mapfile -t bundles < <(find tauri/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*-release.aab')
        if [ "${#bundles[@]}" -ne 1 ]; then
          echo "Expected exactly one signed release AAB, found ${#bundles[@]}" >&2
          exit 1
        fi
        bun scripts/android-bundle.ts "vc${VERSION_CODE}" "${bundles[0]}" \
          "$RUNNER_TEMP/bundletool.jar" "$RUNNER_TEMP/android-signing/certificate-sha256"
        bundle_filename="${RELEASE_FILENAME%.*}.aab"
        mkdir -p "$GITHUB_WORKSPACE/android-artifacts"
        cp "${bundles[0]}" "$GITHUB_WORKSPACE/android-artifacts/$bundle_filename"
        # R8 mapping belongs to this exact binary; preserve it for Play crash reports.
        bundle_variant=$(basename "$(dirname "${bundles[0]}")")
        mapping="tauri/src-tauri/gen/android/app/build/outputs/mapping/$bundle_variant/mapping.txt"
        if [[ ! -s "$mapping" ]]; then
          echo "Missing R8 mapping for bundle variant $bundle_variant" >&2
          exit 1
        fi
        mapping_filename="${bundle_filename%.aab}-mapping.txt"
        cp "$mapping" "$GITHUB_WORKSPACE/android-artifacts/$mapping_filename"
        \cd "$GITHUB_WORKSPACE/android-artifacts"
        sha256sum "$bundle_filename" > "$bundle_filename.sha256"
        sha256sum "$mapping_filename" > "$mapping_filename.sha256"
        echo "bundle=$GITHUB_WORKSPACE/android-artifacts/$bundle_filename" >> "$GITHUB_OUTPUT"
        echo "mapping=$GITHUB_WORKSPACE/android-artifacts/$mapping_filename" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        LOGGED_STEP: Verify and collect App Bundle
        VERSION_CODE: ${{ steps.preconditions.outputs.version_code }}
        RELEASE_FILENAME: ${{ steps.metadata.outputs.filename }}
      working-directory: apps/web
    - name: Require the PR's Android native code to be unchanged since the build
      run: |
        printf '%s\n' "$LOGGED_STEP" > "$RUNNER_TEMP/last-step.name"
        exec > >(tee "$RUNNER_TEMP/last-step.log") 2>&1
        # --- authenticated fetch ------------------------------------------------------
        # gh_fetch <sha|ref>: make a commit that is not in this checkout (the base
        # commit, a moved PR head, GitHub's test merge commit) available. Checkouts
        # here don't persist credentials, so authenticate the way actions/checkout
        # does. Fails if the commit is unreachable (a force-pushed-away head).
        gh_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ------------------------------------------------------------------------------
        # --- PR merge result ----------------------------------------------------------
        # pr_merge_commit: print the sha of GitHub's test merge commit for $PR_NUMBER —
        # the merge result the native gates hash. GitHub computes it lazily
        # (mergeable=UNKNOWN until it has), so poll a little; a PR that really
        # conflicts with its base cannot merge anyway. Needs GH_TOKEN, GH_REPO,
        # PR_NUMBER. Progress goes to stderr so `merge=$(pr_merge_commit)` works.
        pr_merge_commit() {
          local deadline pr_json mergeable merge
          deadline=$(( $(date +%s) + 120 ))
          while true; do
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json mergeable,potentialMergeCommit)
            mergeable=$(jq -r '.mergeable' <<<"$pr_json")
            merge=$(jq -r '.potentialMergeCommit.oid // empty' <<<"$pr_json")
            if [[ -n "$merge" ]]; then
              echo "$merge"
              return 0
            fi
            if [[ "$mergeable" == "CONFLICTING" ]]; then
              echo "PR #${PR_NUMBER} conflicts with its base branch, so GitHub has no merge result for it." >&2
              return 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "GitHub has not computed PR #${PR_NUMBER}'s merge commit yet (mergeable=${mergeable})." >&2
              return 1
            fi
            echo "Merge commit not computed yet (mergeable=${mergeable}); waiting." >&2
            sleep 10
          done
        }
        # ------------------------------------------------------------------------------
        # --- merge result native check ------------------------------------------------
        # merge_result_native_check <hash> <listing> <fetch>: is the native code of
        # PR #PR_NUMBER's merge result the native code of HEAD, the code this run
        # built or is about to build? The merge gate hashes the merge result, so a
        # build that differs from it could never pass the gate. <hash> / <listing>
        # print a commit's native hash / the listing behind it; <fetch> makes a
        # commit available (the iOS and Android helpers differ). Needs GH_TOKEN,
        # GH_REPO, PR_NUMBER, BASE_BRANCH, and pr_merge_commit.
        #
        # GitHub's test merge commit answers directly when it exists. It doesn't for
        # a PR that conflicts with its base, but the question still has an answer:
        # if the base's native code hasn't moved since the PR branched, merging can
        # only carry HEAD's native code, whatever files the conflicts are in. A
        # refusal lists the native files the base changed.
        merge_result_native_check() {
          local hash=$1 listing=$2 fetch=$3 built merge tip merge_base why files
          built=$(git rev-parse HEAD)
          merge=""
