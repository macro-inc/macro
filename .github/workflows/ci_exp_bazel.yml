name: ci-exp-bazel
"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
concurrency:
  group: ci-exp-bazel-${{ github.ref }}
  cancel-in-progress: false
env:
  BAZEL_PROTO_DB_URL: postgres://user:password@localhost:5432/macrodb
  DATABASE_URL: postgres://user:password@localhost:5432/macrodb
  REDIS_URL: redis://localhost:6379
jobs:
  test:
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=ci-exp-bazel
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports: ['5432:5432']
        options: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 --shm-size 1g'
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: |
          /nix
          /home/runner/.cache/bazel
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Build code-mode assets
      run: |
        assets="$(nix build --no-link --print-out-paths --print-build-logs .#code-mode-assets)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"
    - name: Install Bazel
      run: |
        bzl="$(nix build --no-link --print-out-paths nixpkgs#bazel_8)"
        echo "$bzl/bin" >> "$GITHUB_PATH"
    - name: configure postgres for concurrent tests
      run: |
        postgres_container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "pgvector/pgvector:pg14" { print $1; exit }')"
        docker exec -i "$postgres_container" psql -U user -d macrodb <<'SQL'
        ALTER SYSTEM SET fsync = off;
        ALTER SYSTEM SET synchronous_commit = off;
        ALTER SYSTEM SET full_page_writes = off;
        ALTER SYSTEM SET max_wal_size = '4GB';
        ALTER SYSTEM SET checkpoint_timeout = '30min';
        ALTER SYSTEM SET max_locks_per_transaction = 8192;
        SQL
        docker restart "$postgres_container"
        until docker exec "$postgres_container" pg_isready -U user -d macrodb; do sleep 1; done
    - name: prepare tests
      run: just setup_test_envs && just initialize_dbs && just setup_test_template
    - name: generate Bazel files
      run: time tooling/bazel-proto/generate.sh
    - name: bazel analysis
      run: |
        set -euo pipefail
        time bazel --output_user_root=/home/runner/.cache/bazel/root --host_jvm_args=-Xmx3g build --nobuild //crates/... //services/... //tooling/xtask/... 2>&1 | tail -3
    - name: bazel compile
      id: compile
      run: |
        set -euo pipefail
        time bazel --output_user_root=/home/runner/.cache/bazel/root --host_jvm_args=-Xmx3g build --keep_going --jobs=8 --profile=/tmp/compile.profile.gz //crates/... //services/... //tooling/xtask/... 2>&1 | grep -vE '^\[[0-9,]+ / [0-9,]+\]' | tail -60 | cut -c1-240
        bazel --output_user_root=/home/runner/.cache/bazel/root analyze-profile /tmp/compile.profile.gz 2>&1 | tail -15 | cut -c1-160 || true
    - name: bazel test
      if: always()
      run: |
        set -uo pipefail
        time bazel --output_user_root=/home/runner/.cache/bazel/root --host_jvm_args=-Xmx3g test --keep_going --jobs=8 --local_test_jobs=4 --test_timeout=600 --test_env=RUST_TEST_THREADS=8 --test_output=summary --build_tests_only --test_summary=short //crates/... //services/... //tooling/xtask/... > /tmp/test.log 2>&1
        code=$?
        grep -vE '^\[[0-9,]+ / [0-9,]+\]' /tmp/test.log | grep -v ' PASSED ' | tail -70 | cut -c1-200
        grep -cE ' \(cached\) PASSED ' /tmp/test.log || true
        python3 tooling/bazel-proto/test_counts.py bazel-testlogs | tail -3
        exit $code
    - name: disk use
      if: always()
      run: du -sh /home/runner/.cache/bazel /nix 2>/dev/null; df -h /home/runner | tail -1
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
