name: ci-exp-bazel
"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
concurrency:
  group: ci-exp-bazel-${{ github.ref }}
  cancel-in-progress: false
env:
  BAZEL_PROTO_DB_URL: postgres://user:password@localhost:5432/macrodb
  DATABASE_URL: postgres://user:password@localhost:5432/macrodb
  REDIS_URL: redis://localhost:6379
  BZ_ROOT: /home/runner/.cache/bazel/root
jobs:
  test:
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=ci-exp-bazel
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports: ['5432:5432']
        options: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 --shm-size 1g'
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: |
          /nix
          /home/runner/.cache/bazel
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Build code-mode assets
      run: |
        assets="$(nix build --no-link --print-out-paths --print-build-logs .#code-mode-assets)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"
    - name: Install Bazel
      run: |
        bzl="$(nix build --no-link --print-out-paths nixpkgs#bazel_8)"
        echo "$bzl/bin" >> "$GITHUB_PATH"
        # The runner's git can't load its https helper under the dev shell's library path.
        git_pkg="$(nix build --no-link --print-out-paths nixpkgs#git)"
        echo "$git_pkg/bin" >> "$GITHUB_PATH"
    - name: configure postgres for concurrent tests
      run: |
        postgres_container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "pgvector/pgvector:pg14" { print $1; exit }')"
        docker exec -i "$postgres_container" psql -U user -d macrodb <<'SQL'
        ALTER SYSTEM SET fsync = off;
        ALTER SYSTEM SET synchronous_commit = off;
        ALTER SYSTEM SET full_page_writes = off;
        ALTER SYSTEM SET max_wal_size = '4GB';
        ALTER SYSTEM SET checkpoint_timeout = '30min';
        ALTER SYSTEM SET max_locks_per_transaction = 8192;
        SQL
        docker restart "$postgres_container"
        until docker exec "$postgres_container" pg_isready -U user -d macrodb; do sleep 1; done
    - name: prepare tests
      run: just setup_test_envs && just initialize_dbs && just setup_test_template
    - name: generate Bazel files
      run: time tooling/bazel-proto/generate.sh
    - name: probe Namespace Bazel cache
      continue-on-error: true
      run: nsc bazel setup --remote=false --bazelrc /tmp/namespace.bazelrc 2>&1 | tail -5 | cut -c1-300
    - name: bazel analysis
      run: |
        time bazel --output_user_root=$BZ_ROOT --host_jvm_args=-Xmx3g build --nobuild //crates/... //services/... //tooling/... > /tmp/analysis.log 2>&1 || { grep -E '^(ERROR|FATAL)' /tmp/analysis.log | head -30 | cut -c1-400; exit 1; }
        tail -2 /tmp/analysis.log | cut -c1-200
    - name: bazel compile
      run: |
        code=0
        time bazel --output_user_root=$BZ_ROOT --host_jvm_args=-Xmx3g build --keep_going --jobs=8 --profile=/tmp/compile.profile.gz //crates/... //services/... //tooling/... > /tmp/compile.log 2>&1 || code=$?
        grep -E '^(ERROR|FATAL)' /tmp/compile.log | head -40 | cut -c1-300
        grep -E '^INFO: (Elapsed|[0-9,]+ processes|Build)' /tmp/compile.log | cut -c1-200
        bazel --output_user_root=$BZ_ROOT analyze-profile /tmp/compile.profile.gz 2>&1 | tail -12 | cut -c1-140 || true
        exit $code
    - name: bazel test
      if: always()
      run: |
        code=0
        time bazel --output_user_root=$BZ_ROOT --host_jvm_args=-Xmx3g test --keep_going --jobs=8 --local_test_jobs=4 --test_timeout=900 --test_env=RUST_TEST_THREADS=8 --test_env=PER_TEST_TIMEOUT=300 --run_under=$PWD/tooling/bazel-proto/per_test_runner.py --test_output=summary --test_summary=short --build_tests_only -- //crates/... //services/... //tooling/... -//tooling/xtask/crates/xtask_workflows:xtask_workflows_bin_test > /tmp/test.log 2>&1 || code=$?
        grep -E '^(ERROR|FATAL|FAIL:)|TIMEOUT' /tmp/test.log | head -40 | cut -c1-200
        grep -E '^INFO: (Elapsed|[0-9,]+ processes)|^Executed' /tmp/test.log | cut -c1-200
        echo "cached test targets: $(grep -cE '\(cached\) PASSED' /tmp/test.log || true)"
        python3 tooling/bazel-proto/test_counts.py bazel-testlogs | tail -3
        mkdir -p /tmp/bazel-testlogs-copy
        python3 - <<'PY'
        import os,re
        for base,_,files in os.walk("bazel-testlogs",followlinks=True):
            if "test.log" in files:
                s=open(os.path.join(base,"test.log"),errors="replace").read()
                if re.search(r"^test result: FAILED",s,re.M):
                    print("=====",base)
                    for m in re.finditer(r"^---- (\S+) stdout ----\n(.*?)(?=^test |\Z)",s,re.M|re.S):
                        print("--",m.group(1)); print(m.group(2)[:1500])
        PY
        exit $code
    - name: disk use
      if: always()
      run: du -sh /home/runner/.cache/bazel /nix 2>/dev/null; df -h /home/runner | tail -1
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
