name: adopt datadog monitors

# One-off, manually triggered. Brings the monitors that were created by hand in
# the Datadog UI under Pulumi management by writing them into the `monitoring`
# stack's state.
#
# `pulumi import` reads from Datadog and writes to Pulumi state. It does not
# create, modify, or pause anything in Datadog. Nothing here runs `pulumi up`.
#
# Run this BEFORE the monitoring stack is ever deployed. Deploying first would
# create 35 duplicate monitors, because the program declares monitors that
# Pulumi does not yet know already exist.

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: preview
        options:
          - preview
          - import
        description: >-
          preview: report what the program would do (safe, read-only, and
          meaningless before an import has run). import: write the existing
          monitors into state.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: namespace-profile-linux-mid
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Mount Namespace Nix cache
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1.4.3
        with:
          cache: nix
      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - name: install infra dependencies
        run: cd infra && bun install

      - name: Import or preview
        working-directory: infra/stacks/monitoring
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_HOST: https://api.us5.datadoghq.com/
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          pulumi stack select macro-inc/prod --create
          if [ "$MODE" = "import" ]; then
            # --skip-preview because the import plan is the file under review;
            # --protect matches the `adopted()` helper so the two agree.
            pulumi import \
              --file import.json \
              --out imported.generated.ts \
              --protect \
              --skip-preview \
              --yes
            echo '--- generated code (compare against monitors/*.ts) ---'
            cat imported.generated.ts
          fi
          echo '--- preview ---'
          pulumi preview --diff

      - name: Teardown Nix
        if: ${{ always() }}
        uses: ./.github/actions/teardown-nix
