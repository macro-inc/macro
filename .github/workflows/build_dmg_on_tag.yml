# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/build_dmg_on_tag.rs
name: Build macOS DMG
'on':
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and build
        required: true
        type: string
jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on:
    - nscloud-macos-sequoia-arm64-6x14-with-cache
    - nscloud-cache-tag-macro-desktop-macos
    - nscloud-cache-size-50gb
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: 'false'
    - name: Assert arm64 runner
      run: |
        set -euo pipefail
        if [ "$(uname -m)" != "arm64" ]; then
          echo "macOS DMG builds must run on an arm64/aarch64 runner, got $(uname -m)" >&2
          exit 1
        fi
      shell: bash
    - name: Mount macOS Nix binary cache
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: ~/.cache/macro-desktop-nix
      continue-on-error: true
    - name: Install Nix
      run: |
        set -euo pipefail
        if ! command -v nix >/dev/null 2>&1; then
          curl --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | \
            sh -s -- install macos --no-confirm \
            --extra-conf "experimental-features = nix-command flakes" \
            --extra-conf "sandbox = false" \
            --extra-conf "trusted-users = root runner"
        fi
        echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
        echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"
        export PATH="/nix/var/nix/profiles/default/bin:$PATH"
        export NIX_REMOTE=daemon
        nix --version
      shell: bash
    - id: nix-cache
      name: Configure macOS Nix binary cache
      run: |
        set -euo pipefail

        # The Apple linker/SDK live outside Nix. Do not reuse their outputs after the
        # runner image changes its macOS or Xcode version.
        toolchain_key=$(
          { xcodebuild -version && sw_vers -buildVersion; } |
            shasum -a 256 | awk '{print $1}'
        )
        cache_dir="$HOME/.cache/macro-desktop-nix/$toolchain_key"
        mkdir -p "$cache_dir"
        cache_url="file://$cache_dir?compression=zstd&trusted=true&priority=10"

        # Initialize an empty cache before adding it as a substituter. Only this local,
        # repository-specific cache accepts unsigned paths; public caches still require
        # signatures. Keep the normal /nix store and its daemon-managed permissions.
        nix store info --store "$cache_url" --json
        {
          echo "DESKTOP_NIX_CACHE_URL=$cache_url"
          echo "NIX_CONFIG<<DESKTOP_NIX_CONFIG_EOF"
          printf '%s\n' "${NIX_CONFIG:-}"
          echo "extra-substituters = $cache_url"
          echo "DESKTOP_NIX_CONFIG_EOF"
        } >> "$GITHUB_ENV"
      shell: bash
      continue-on-error: true
    - name: Configure signing identity
      run: |
        set -euo pipefail
        if [ -z "${MACOS_DEVELOPER_ID_CERTIFICATE_BASE64}" ] || [ -z "${MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD}" ]; then
          echo "Developer ID certificate secrets are not configured; using ad-hoc signing for build validation."
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          exit 0
        fi

        certificate_path="$RUNNER_TEMP/developer-id-application.p12"
        printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null \
          || printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"

        # Nix's macOS daemon builds as _nixbld users, not the runner user.
        # Put the Developer ID identity in the system keychain so codesign can
        # find it from inside the Nix build without embedding certificate
        # secrets into the derivation.
        sudo security import "$certificate_path" \
          -k /Library/Keychains/System.keychain \
          -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
          -A \
          -T /usr/bin/codesign \
          -T /usr/bin/security
        sudo security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k "" \
          /Library/Keychains/System.keychain || true

        identity=$(security find-identity -v -p codesigning /Library/Keychains/System.keychain \
          | awk -F '"' '/Developer ID Application/ { print $2; exit }')
        if [ -z "$identity" ]; then
          echo "No Developer ID Application identity found in System.keychain" >&2
          security find-identity -v -p codesigning /Library/Keychains/System.keychain >&2 || true
          exit 1
        fi
        echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
        echo "Using signing identity: $identity"
      shell: bash
      env:
        MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
        MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
    - id: metadata
      name: Derive artifact metadata
      run: |
        set -euo pipefail
        tag="${RAW_REF#refs/tags/}"
        if [ -z "$tag" ]; then
          tag="${GITHUB_REF_NAME:-untagged}"
        fi
        safe_tag=$(printf '%s' "$tag" | sed 's#[/\\:*?"<>|]#-#g' | tr -d '\r\n')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        RAW_REF: ${{ inputs.ref }}
    - name: Build DMG with Nix
      run: |
        set -euo pipefail

        # Record the derivations before building so completed dependencies can be saved
        # even if a later compilation or packaging step fails.
        nix path-info --derivation --impure \
          ".#packages.aarch64-darwin.tauri-desktop-apple-linker-smoke" \
          ".#packages.aarch64-darwin.tauri-desktop-dmg" \
          > "$RUNNER_TEMP/desktop-cache-roots"

        nix build --impure --option sandbox false --print-build-logs \
          ".#packages.aarch64-darwin.tauri-desktop-apple-linker-smoke"
        nix build --impure --option sandbox false --print-build-logs \
          ".#packages.aarch64-darwin.tauri-desktop-dmg"
      shell: bash
    - name: Save macOS Nix build dependencies
      if: '!cancelled() && steps.nix-cache.outcome == ''success'''
      run: |
        set -euo pipefail

        roots_file="$RUNNER_TEMP/desktop-cache-roots"
        if [ ! -s "$roots_file" ]; then
          exit 0
        fi

        # A DMG's runtime closure omits build-only inputs such as Cargo artifacts and
        # the toolchain. Walk its derivation closure and include every existing output,
        # including successful dependencies of an otherwise failed build.
        while IFS= read -r derivation; do
          nix-store --query --requisites --include-outputs "$derivation"
        done < "$roots_file" |
          awk '!/\.drv$/' |
          sort -u |
          nix copy --stdin --to "$DESKTOP_NIX_CACHE_URL"
      shell: bash
      continue-on-error: true
    - name: Collect DMG artifact
      run: |
        set -euo pipefail
        mkdir -p artifacts
        shopt -s nullglob
        dmgs=(result/*.dmg)
        if [ "${#dmgs[@]}" -eq 0 ]; then
          echo "No DMG files found in nix build result" >&2
          find -L result -maxdepth 2 -type f -print >&2 || true
          exit 1
        fi
        cp -v "${dmgs[@]}" artifacts/
        # Nix outputs are read-only; stapler must write Apple's ticket into the copy.
        chmod u+w artifacts/*.dmg
      shell: bash
    - name: Validate signed DMG
      run: |
        set -euo pipefail
        dmg=$(find artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)
        if [ -z "$dmg" ]; then
          echo "No DMG found to validate" >&2
          exit 1
        fi
        codesign --verify --strict --verbose=2 "$dmg"

        mount_dir=$(mktemp -d)
        hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
        trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
        app=$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' -print -quit)
        if [ -z "$app" ] && [ -d "$mount_dir/Contents" ]; then
          app="$mount_dir"
        fi
        if [ -z "$app" ]; then
          echo "No app bundle found in DMG" >&2
          find "$mount_dir" -maxdepth 2 -print >&2 || true
          exit 1
        fi
        codesign --verify --deep --strict --verbose=2 "$app"

        dylib_refs=$(mktemp)
        search_roots=("$app/Contents/MacOS")
        if [ -d "$app/Contents/Frameworks" ]; then
          search_roots+=("$app/Contents/Frameworks")
        fi
        while IFS= read -r -d '' file; do
          otool -L "$file" 2>/dev/null \
            | awk -v file="$file" 'NR > 1 && $1 ~ "^/nix/store/.*\\.dylib$" { print file ": " $1 }' \
            >> "$dylib_refs" || true
        done < <(find "${search_roots[@]}" -type f -print0)
        if [ -s "$dylib_refs" ]; then
          echo "App bundle contains absolute Nix dylib references:" >&2
          cat "$dylib_refs" >&2
          exit 1
        fi
      shell: bash
    - name: Notarize and staple DMG
      run: |
        set -euo pipefail

        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "MACOS_RELEASE_DOPPLER_TOKEN must grant read access to macos-release/prd" >&2
          exit 1
        fi
        dmg=$(find artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)
        if [ -z "$dmg" ]; then
          echo "No DMG found to notarize" >&2
          exit 1
        fi

        umask 077
        credentials_dir=$(mktemp -d)
        trap 'rm -rf "$credentials_dir"' EXIT
        curl --fail --silent --show-error --retry 3 \
          --header "Authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/configs/config/secrets/download?project=macos-release&config=prd&format=json&secrets=APPLE_API_PRIVATE_KEY,APPLE_API_KEY_ID,APPLE_API_ISSUER' \
          > "$credentials_dir/secrets.json"
        jq -er '.APPLE_API_PRIVATE_KEY | strings | select(length > 0)' \
          "$credentials_dir/secrets.json" > "$credentials_dir/AuthKey.p8"
        key_id=$(jq -er '.APPLE_API_KEY_ID | strings | select(length > 0)' "$credentials_dir/secrets.json")
        issuer=$(jq -er '.APPLE_API_ISSUER | strings | select(length > 0)' "$credentials_dir/secrets.json")

        # Submission failure, rejection, or timeout must prevent publishing this build.
        xcrun notarytool submit "$dmg" \
          --key "$credentials_dir/AuthKey.p8" --key-id "$key_id" --issuer "$issuer" \
          --wait --timeout 30m --output-format json > "$credentials_dir/submission.json"
        cat "$credentials_dir/submission.json"
        jq -e '.status == "Accepted"' "$credentials_dir/submission.json" > /dev/null
        xcrun stapler staple "$dmg"
        xcrun stapler validate "$dmg"
        spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

        # Stapling changes the DMG bytes, so checksum the final distributable.
        (cd artifacts && shasum -a 256 -- *.dmg > macro-dmg-SHA256SUMS)
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ secrets.MACOS_RELEASE_DOPPLER_TOKEN }}
    - name: Upload macro-dmg-${{ steps.metadata.outputs.safe_tag }} artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macro-dmg-${{ steps.metadata.outputs.safe_tag }}
        path: artifacts/*
        if-no-files-found: error
        retention-days: '30'
  publish-dmg:
    needs:
    - build-dmg
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - id: metadata
      name: Derive artifact metadata
      run: |
        set -euo pipefail
        tag="${RAW_REF#refs/tags/}"
        if [ -z "$tag" ]; then
          tag="${GITHUB_REF_NAME:-untagged}"
        fi
        safe_tag=$(printf '%s' "$tag" | sed 's#[/\\:*?"<>|]#-#g' | tr -d '\r\n')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        RAW_REF: ${{ inputs.ref }}
    - name: Download Build Artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        path: release-artifacts
        merge-multiple: 'true'
    - name: Upload Release Artifacts
      if: startsWith(steps.metadata.outputs.tag, 'v')
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        tag_name: ${{ steps.metadata.outputs.tag }}
        files: release-artifacts/*
        fail_on_unmatched_files: 'true'
