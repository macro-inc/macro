name: Release Android App Bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published production release to build (vYYYY.M.D or vYYYY.M.D.N)
        required: true
        type: string
      operation:
        description: Release after deployment, or force a recovery build without uploading to Play
        type: choice
        default: rebuild
        options:
          - rebuild
          - release
      publish_android:
        description: Recovery builds only — attach verified artifacts to the existing release
        default: false
        type: boolean

# Android builds have their own cancellation lifecycle and never hold the
# production deployment lock. Serialize them so release detection sees the
# artifacts published by the preceding Android build.
concurrency:
  group: android-native-release
  cancel-in-progress: false

env:
  MODE: "production"

jobs:
  android-changes:
    name: Check for native Android changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    outputs:
      build: ${{ steps.changes.outputs.build || steps.recovery.outputs.build }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false'
      - name: Allow explicit recovery build
        id: recovery
        if: inputs.operation == 'rebuild'
        run: echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Checkout release history
        if: inputs.operation == 'release'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare Tauri with last published Android bundle
        id: changes
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/web/scripts/android-release-needed.mjs

  build-android:
    name: Build signed Android App Bundle
    needs: [android-changes]
    if: needs.android-changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      CI: "true"
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}
          persist-credentials: false
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup prerequisites
        uses: ./.github/actions/setup-reqs-web
      - name: Prepare version and signing
        id: metadata
        working-directory: apps/web
        env:
          DOPPLER_TOKEN: ${{ secrets.ANDROID_RELEASE_DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          filename=$(bun scripts/android-release.ts metadata "$RELEASE_TAG" "$RUNNER_TEMP/android-release.json")
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          bun scripts/android-release.ts signing "$RUNNER_TEMP/android-signing" \
            tauri/src-tauri/gen/android/keystore.properties
          bun scripts/android-firebase.ts build --doppler "$RUNNER_TEMP/android-google-services.json"
      - name: Build production App Bundle
        working-directory: apps/web
        env:
          VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_OTEL_EXPORTER_URL: https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces
          VITE_OTEL_ENV: prod
        run: |
          set -euo pipefail
          # The Nix environment is already loaded. Do not reload it in nested
          # bash processes and re-enable its local-development sccache wrapper.
          # This ephemeral runner has no compiler cache/server to reuse.
          unset BASH_ENV
          export RUSTC_WRAPPER=""
          cargo tauri --version
          # Tauri has shipped both switch-only and value-taking APK/AAB flags.
          # Nix and local installations can differ; build only the AAB with either CLI.
          android_help=$(cargo tauri android build --help)
          artifact_args=(--aab)
          if [[ "$android_help" == *'--apk <APK>'* ]]; then
            artifact_args=(--apk false --aab true)
          fi
          just android-build --firebase-config "$RUNNER_TEMP/android-google-services.json" \
            "${artifact_args[@]}" --ci --config "$RUNNER_TEMP/android-release.json" \
            2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Preserve Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify and collect App Bundle
        working-directory: apps/web
        env:
          RELEASE_FILENAME: ${{ steps.metadata.outputs.filename }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          mapfile -t bundles < <(find tauri/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*-release.aab')
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one signed release AAB, found ${#bundles[@]}" >&2
            exit 1
          fi
          bun scripts/android-bundle.ts "$RELEASE_TAG" "${bundles[0]}" \
            "$RUNNER_TEMP/bundletool.jar" "$RUNNER_TEMP/android-signing/certificate-sha256"
          # Recovery builds can check out older tags whose metadata names an APK.
          bundle_filename="${RELEASE_FILENAME%.*}.aab"
          mkdir -p "$GITHUB_WORKSPACE/android-artifacts"
          cp "${bundles[0]}" "$GITHUB_WORKSPACE/android-artifacts/$bundle_filename"
          # R8 mapping belongs to this exact binary; preserve it for Play crash reports.
          bundle_variant=$(basename "$(dirname "${bundles[0]}")")
          mapping="tauri/src-tauri/gen/android/app/build/outputs/mapping/$bundle_variant/mapping.txt"
          if [[ ! -s "$mapping" ]]; then
            echo "Missing R8 mapping for bundle variant $bundle_variant" >&2
            exit 1
          fi
          mapping_filename="${bundle_filename%.aab}-mapping.txt"
          cp "$mapping" "$GITHUB_WORKSPACE/android-artifacts/$mapping_filename"
          \cd "$GITHUB_WORKSPACE/android-artifacts"
          sha256sum "$bundle_filename" > "$bundle_filename.sha256"
          sha256sum "$mapping_filename" > "$mapping_filename.sha256"
      - name: Upload verified Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release
          path: android-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: |
          rm -f apps/web/tauri/src-tauri/gen/android/keystore.properties \
            apps/web/tauri/src-tauri/gen/android/app/google-services.json \
            "$RUNNER_TEMP/android-google-services.json"
          rm -rf "$RUNNER_TEMP/android-signing"
      # This hosted runner has no separate /nix cache mount to detach. The cache
      # teardown action's fuser -km /nix can kill the runner on its root filesystem.

  upload-android:
    name: Publish Android release artifact
    needs: [build-android]
    if: inputs.operation == 'release' || inputs.publish_android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download verified Android artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-release
          path: android-artifacts
      - name: Attach Android artifacts and checksums to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag }}
          files: android-artifacts/*
          fail_on_unmatched_files: true
      - name: Release to Google Play internal testers
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Dispatch from main to retain the existing restricted Google OIDC identity.
          gh workflow run publish-android-play.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=upload-internal -f release_tag="$RELEASE_TAG" -f status=completed
          printf 'Queued Google Play internal testing upload for `%s`. Check the Publish Android to Google Play workflow for its result.\n' \
            "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
