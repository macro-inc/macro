# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/ci_gate_reminder.rs
name: CI Gate Reminder
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
jobs:
  remind:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: CI not run yet
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    timeout-minutes: 5
    steps:
    - name: Mark the commit as not run
      run: |
        node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
        // Sets the commit status `main` requires before a merge: it is green only on a
        // commit that a requested `PR CI` run passed. `CI_GATE_MODE` picks the step:
        //
        //   remind  a new commit: pending "not run" with the command to run it, unless
        //           the commit already has a gate status
        //   start   a requested run begins: remove the label, check the merge commit
        //           holds the PR head, set pending
        //   finish  the run ends: success when every job passed or was path-skipped
        //   label   the label goes on a PR: fail when it can't start PR CI, because the
        //           PR conflicts with main or its merge commit predates PR CI
        //   fork-request  the label goes on a fork PR: what start does with a write
        //                 token, from a trusted run of `main`'s workflow
        //   fork    after a fork PR's run, whose read-only token could not set the status
        //   sweep   on a schedule: close every request nothing else will, so the status
        //           never stays pending on a run that isn't coming
        //
        // A request is the label, then a `Running on` status. The other steps close it
        // only if GitHub starts and finishes their run. It doesn't always: a label can
        // start nothing (GitHub dropped the event, or the PR began to conflict after
        // the label check looked), and a cancelled run skips its gate job. Sweep fails
        // those commits with the command to run again. `CI_GATE_DRY_RUN=true` logs
        // what it would do instead.
        //
        // Statuses go on the PR head commit, so a later push starts without one.
        //
        // A fork PR's run uses the workflow files of its merge commit, so a fork that
        // edits them decides its own verdict. Both fork steps fail closed instead: the
        // fork's CI sources must be the trees it branched from (`ciSourceChanges`).

        import { readFileSync } from 'node:fs';

        const API = 'https://api.github.com';
        const DESCRIPTION_LIMIT = 140;
        // An open request. Only trusted runs set statuses: a fork's token can't.
        const RUNNING = 'Running on';
        // Job names in `PR CI`; the fork step reads them back from the finished run.
        export const START_JOB = 'Start';
        export const GATE_JOB = 'CI gate';
        // The workflow whose jobs the fork step trusts, and the trees that define it:
        // the generated workflows and the Rust that generates them.
        export const PR_CI_PATH = '.github/workflows/pr-ci.yml';
        export const CI_SOURCES = ['.github', 'tooling/xtask/crates/xtask_workflows'] as const;
        export const STALE_MERGE =
          "PR CI can't start: this PR's merge commit predates PR CI. Merge main in, push, and add the run-ci label again.";
        export const CONFLICTS =
          "PR CI can't start: this PR conflicts with main. Merge main in, push, and add the run-ci label again.";
        export const FORK_CHANGES_CI =
          'fork changes CI workflows: a maintainer must review and run CI from a branch';

        export const NOT_STARTED = 'PR CI did not start.';
        export const NO_RESULT = 'PR CI gave no result in time.';
        /// Start removes the label within seconds, so one still on after this started
        /// nothing.
        const STALE_LABEL_MS = 10 * 60_000;
        /// A finished run's gate job has already reported; allow for a re-run starting.
        const ENDED_RUN_GRACE_MS = 5 * 60_000;
        /// Far longer than any run takes.
        const LOST_REQUEST_MS = 3 * 60 * 60_000;
        /// A fork's request links to no run to watch, and its run may wait on approval.
        const LOST_FORK_REQUEST_MS = 24 * 60 * 60_000;
        /// A run still without a result after this is one GitHub lost.
        const LOST_RUN_MS = 60 * 60_000;

        type State = 'pending' | 'success' | 'failure' | 'error';
        export type Needs = Record<string, { result: string }>;
        export type RunJob = { name: string; conclusion: string | null };
        export type GateStatus = {
          state: string;
          description: string;
          targetUrl?: string | null;
          createdAt?: string;
        };
        export type SweptRun = { status: string; conclusion: string | null; updatedAt: string };
        /// A PR as sweep sees it. `labelledAt` is undefined without the label, and null
        /// when the label is on but was added too long ago to find.
        export type Swept = {
          labelledAt: string | null | undefined;
          status: GateStatus | undefined;
          run: SweptRun | null;
        };
        type Outcome = { state: State; description: string } | null;
        /// Git tree SHA of each CI source at a commit; null where the path is missing.
        export type CiTrees = Record<string, string | null>;

        function env(name: string): string {
          const value = process.env[name];
          if (!value) {
            throw new Error(`${name} is not set`);
          }
          return value;
        }

        /// Whether a path exists at a ref.
        async function exists(path: string, ref: string): Promise<boolean> {
          const response = await fetch(`${API}/repos/${repo()}/contents/${path}?ref=${ref}`, {
            method: 'HEAD',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${env('GH_TOKEN')}`,
              'x-github-api-version': '2022-11-28',
            },
          });
          if (response.status === 404) {
            return false;
          }
          if (!response.ok) {
            throw new Error(`HEAD contents/${path}?ref=${ref}: HTTP ${response.status}`);
          }
          return true;
        }

        async function github(method: string, path: string, body?: unknown): Promise<any> {
          const response = await fetch(`${API}${path}`, {
            method,
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${env('GH_TOKEN')}`,
              'x-github-api-version': '2022-11-28',
            },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          // Removing a label that is already gone is the outcome we wanted.
          if (method === 'DELETE' && response.status === 404) {
            return null;
          }
          if (!response.ok) {
            throw new Error(`${method} ${path}: HTTP ${response.status} ${await response.text()}`);
          }
          return response.status === 204 ? null : response.json();
        }

        const dryRun = () => process.env.CI_GATE_DRY_RUN === 'true';
        const repo = () => env('GITHUB_REPOSITORY');
        const context = () => env('CI_GATE_CONTEXT');
        const label = () => env('CI_GATE_LABEL');

        /// REST, because `gh pr edit` fails on older gh releases.
        export function runCommand(repository: string, pr: string, labelName: string): string {
          return `gh api repos/${repository}/issues/${pr}/labels -f "labels[]=${labelName}"`;
        }

        /// The finished run's verdict from `toJSON(needs)`. Start must have succeeded;
        /// a called workflow may be skipped, because its path filter did not match.
        /// Null when start failed: it already set a status that says why.
        export function gateOutcome(needs: Needs, head: string): Outcome {
          if (needs.start?.result !== 'success') {
            return null;
          }

          const failed = Object.entries(needs)
            .filter(([, need]) => need.result !== 'success' && need.result !== 'skipped')
            .map(([job]) => job);

          if (failed.length > 0) {
            return { state: 'failure', description: `Failed: ${failed.join(', ')}` };
          }

          return { state: 'success', description: `Passed on ${head.slice(0, 7)}` };
        }

        /// A fork run's verdict from its jobs. Null when the run was not a request
        /// (unrelated label) or did not finish (cancelled).
        export function forkOutcome(jobs: RunJob[], head: string, labelName: string): Outcome {
          const start = jobs.find((job) => job.name === START_JOB);
          const gate = jobs.find((job) => job.name === GATE_JOB);

          if (!start || start.conclusion === 'skipped' || start.conclusion === 'cancelled') {
            return null;
          }

          if (start.conclusion !== 'success') {
            return {
              state: 'failure',
              description: `Could not start on ${head.slice(0, 7)}. Add the ${labelName} label again.`,
            };
          }

          if (gate?.conclusion === 'success') {
            return { state: 'success', description: `Passed on ${head.slice(0, 7)}` };
          }

          if (gate?.conclusion === 'failure') {
            return { state: 'failure', description: 'Failed: see the PR CI run' };
          }

          return null;
        }

        /// The CI sources whose tree differs between a fork head and the commit it
        /// branched from. A source missing from either side counts as changed.
        export function ciSourceChanges(head: CiTrees, base: CiTrees): string[] {
          return CI_SOURCES.filter((path) => !head[path] || !base[path] || head[path] !== base[path]);
        }

        /// Why a finished fork run can't be trusted, or null. The workflow is matched
        /// by name, so a fork can add another file named `PR CI`; and even `pr-ci.yml`
        /// is the fork's copy unless the CI sources are unchanged.
        export function forkRunDistrust(runPath: string, changes: string[]): string | null {
          if (changes.length > 0) {
            return FORK_CHANGES_CI;
          }
          if (runPath !== PR_CI_PATH) {
            return `The run came from ${runPath}, not ${PR_CI_PATH}`;
          }
          return null;
        }

        /// Why the label can't start PR CI, or null. GitHub runs no `pull_request`
        /// workflow on a conflicting PR, and takes the workflow files from the PR's
        /// merge commit, which it refreshes on a push but not when main moves on.
        export function labelBlocker(mergeable: boolean | null, mergeHasPrCi: boolean): string | null {
          if (mergeable === false) {
            return CONFLICTS;
          }
          if (!mergeHasPrCi) {
            return STALE_MERGE;
          }
          return null;
        }

        async function setStatus(sha: string, state: State, description: string, targetUrl: string) {
          if (dryRun()) {
            console.log(`would set ${context()} on ${sha.slice(0, 10)}: ${state}: ${description}`);
            return;
          }
          await github('POST', `/repos/${repo()}/statuses/${sha}`, {
            state,
            context: context(),
            description: description.slice(0, DESCRIPTION_LIMIT),
            target_url: targetUrl,
          });
          console.log(`${context()} on ${sha.slice(0, 10)}: ${state}: ${description}`);
        }

        /// The newest gate status on a commit (GitHub lists statuses newest first).
        async function gateStatus(sha: string): Promise<{ state: string; description: string } | undefined> {
          const statuses: { context: string; state: string; description: string | null }[] = await github(
            'GET',
            `/repos/${repo()}/commits/${sha}/statuses?per_page=100`,
          );
          const status = statuses.find((each) => each.context === context());
          return status && { state: status.state, description: status.description ?? '' };
        }

        /// Whether a trusted step opened a request on this commit that no result has
        /// closed yet.
        export function isOpenRequest(status: { state: string; description: string } | undefined): boolean {
          return status?.state === 'pending' && status.description.startsWith(RUNNING);
        }

        /// Whether the label has been on too long for start to still take it.
        export function labelIsStale(labelledAt: string | null, now: number): boolean {
          return labelledAt === null || now - Date.parse(labelledAt) >= STALE_LABEL_MS;
        }

        /// The run a status links to; a fork's request links to the PR checks instead.
        export function runIdOf(targetUrl: string | null | undefined): string | null {
          return targetUrl?.match(/\/actions\/runs\/(\d+)/)?.[1] ?? null;
        }

        /// Why an open request will get no result, or null while it still may.
        export function lostRun(status: GateStatus | undefined, run: SweptRun | null, now: number): string | null {
          if (!status || !isOpenRequest(status)) {
            return null;
          }
          if (run?.status === 'completed' && now - Date.parse(run.updatedAt) >= ENDED_RUN_GRACE_MS) {
            return `PR CI ended (${run.conclusion}) without a result.`;
          }
          const limit = runIdOf(status.targetUrl) ? LOST_REQUEST_MS : LOST_FORK_REQUEST_MS;
          if (status.createdAt && now - Date.parse(status.createdAt) >= limit) {
            return NO_RESULT;
          }
          return null;
        }

        /// Whether a PR CI run on the head may still take the label or set a status,
        /// such as one waiting for a runner.
        export function runMayReport(run: { status: string; createdAt: string }, now: number): boolean {
          return run.status !== 'completed' && now - Date.parse(run.createdAt) < LOST_RUN_MS;
        }

        /// Whether the gate status is still the one sweep decided on.
        export function sameStatus(
          before: { state: string; description: string } | undefined,
          after: { state: string; description: string } | undefined,
        ): boolean {
          return before?.state === after?.state && before?.description === after?.description;
        }

        /// What sweep does to a PR head, or null to leave it. A stale label comes off
        /// so adding it again fires a new event; it fails the commit unless the commit
        /// holds a verdict that still stands or a run that will report.
        export function sweepAction(
          pr: Swept,
          now: number,
        ): { removeLabel: boolean; failure: string | null } | null {
          if (pr.labelledAt !== undefined) {
            if (!labelIsStale(pr.labelledAt, now)) {
              return null;
            }
            const keep = pr.status?.state === 'success' || isOpenRequest(pr.status);
            return { removeLabel: true, failure: keep ? null : NOT_STARTED };
          }
          const lost = lostRun(pr.status, pr.run, now);
          return lost ? { removeLabel: false, failure: lost } : null;
        }

        /// The tree SHA at `path` in a commit, walking one directory at a time.
        async function treeAt(commit: string, path: string): Promise<string | null> {
          let tree: string = (await github('GET', `/repos/${repo()}/git/commits/${commit}`)).tree.sha;
          for (const part of path.split('/')) {
            const { tree: entries }: { tree: { path: string; type: string; sha: string }[] } = await github(
              'GET',
              `/repos/${repo()}/git/trees/${tree}`,
            );
            const entry = entries.find((each) => each.path === part && each.type === 'tree');
            if (!entry) {
              return null;
            }
            tree = entry.sha;
          }
          return tree;
        }

        async function ciTrees(commit: string): Promise<CiTrees> {
          const trees: CiTrees = {};
          for (const path of CI_SOURCES) {
            trees[path] = await treeAt(commit, path);
          }
          return trees;
        }

        /// The CI sources a fork head changed since it branched from `base`.
        async function forkCiChanges(base: string, head: string): Promise<string[]> {
          const compare = await github('GET', `/repos/${repo()}/compare/${base}...${head}`);
          const changes = ciSourceChanges(await ciTrees(head), await ciTrees(compare.merge_base_commit.sha));
          if (changes.length > 0) {
            console.log(`${head.slice(0, 10)} changes ${changes.join(', ')}`);
          }
          return changes;
        }

        async function removeLabel(pr: string) {
          if (dryRun()) {
            console.log(`would remove ${label()} from #${pr}`);
            return;
          }
          await github('DELETE', `/repos/${repo()}/issues/${pr}/labels/${encodeURIComponent(label())}`);
        }

        /// Why a label on the PR can't start PR CI, from GitHub's view of it now.
        /// GitHub computes mergeability in the background, so wait briefly for it.
        async function labelProblem(pr: string): Promise<string | null> {
          let pull = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          for (let attempt = 0; pull.mergeable === null && attempt < 6; attempt++) {
            await new Promise((resolve) => setTimeout(resolve, 5_000));
            pull = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          }
          const merge: string | null = pull.merge_commit_sha;
          const hasPrCi = merge !== null && (await exists(PR_CI_PATH, merge));
          console.log(`#${pr}: mergeable ${pull.mergeable}, merge commit ${merge}, holds PR CI: ${hasPrCi}`);
          return labelBlocker(pull.mergeable, hasPrCi);
        }

        async function labelCheck() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');
          const problem = await labelProblem(pr);
          if (!problem) {
            console.log(`#${pr}'s merge commit holds ${PR_CI_PATH}; PR CI takes it from here.`);
            return;
          }
          // The label stays otherwise, and adding it again must fire a new event.
          await removeLabel(pr);
          await setStatus(head, 'failure', problem, env('CI_GATE_DOCS_URL'));
        }

        async function remind() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');

          // A re-open or leaving draft keeps the head, so it may have a result already.
          if (await gateStatus(head)) {
            console.log(`${head.slice(0, 10)} already has a ${context()} status`);
            return;
          }

          await setStatus(
            head,
            'pending',
            `Not run on this commit. Run: ${runCommand(repo(), pr, label())}`,
            env('CI_GATE_DOCS_URL'),
          );
        }

        async function start() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');
          const runUrl = env('RUN_URL');
          const sameRepo = env('SAME_REPO') === 'true';

          // Fork tokens are read-only; the fork request step did both already.
          if (sameRepo) {
            await removeLabel(pr);
          }

          // A label added right after a push can carry the previous head, or a merge
          // commit GitHub has not rebuilt yet. Either would test an old commit.
          const pull = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          if (pull.head.sha !== head) {
            const description = `The PR moved on from ${head.slice(0, 7)} to ${pull.head.sha.slice(0, 7)}. Run again: ${runCommand(repo(), pr, label())}`;
            if (sameRepo) {
              await setStatus(head, 'failure', description, runUrl);
            }
            throw new Error(description);
          }

          const merge = await github('GET', `/repos/${repo()}/commits/${env('MERGE_SHA')}`);
          const parents: string[] = merge.parents.map((parent: { sha: string }) => parent.sha);

          if (!parents.includes(head)) {
            const description = `The merge commit did not include ${head.slice(0, 7)} yet. Run again: ${runCommand(repo(), pr, label())}`;
            if (sameRepo) {
              await setStatus(head, 'failure', description, runUrl);
            }
            throw new Error(description);
          }

          if (sameRepo) {
            await setStatus(head, 'pending', `${RUNNING} ${head.slice(0, 7)}`, runUrl);
          }
        }

        async function finish() {
          const head = env('HEAD_SHA');
          const outcome = gateOutcome(JSON.parse(env('NEEDS')), head);

          if (!outcome) {
            console.log('Start did not succeed; its status stands.');
            process.exitCode = 1;
            return;
          }

          if (env('SAME_REPO') === 'true') {
            await setStatus(head, outcome.state, outcome.description, env('RUN_URL'));
          }

          if (outcome.state !== 'success') {
            console.log(outcome.description);
            process.exitCode = 1;
          }
        }

        async function forkRequest() {
          const head = env('HEAD_SHA');
          const pr = env('PR_NUMBER');

          await removeLabel(pr);

          const problem = await labelProblem(pr);
          if (problem) {
            await setStatus(head, 'failure', problem, env('CI_GATE_DOCS_URL'));
            return;
          }

          // The run the label starts would use the fork's own workflow files.
          if ((await forkCiChanges(env('BASE_REF'), head)).length > 0) {
            await setStatus(head, 'failure', FORK_CHANGES_CI, env('PR_CHECKS_URL'));
            return;
          }

          await setStatus(head, 'pending', `${RUNNING} ${head.slice(0, 7)}`, env('PR_CHECKS_URL'));
        }

        async function fork() {
          const event = JSON.parse(readFileSync(env('GITHUB_EVENT_PATH'), 'utf8'));
          const run = event.workflow_run;
          const head: string = run.head_sha;

          // The request step opened this on the head the label was added at. A run on
          // any other commit, such as one the fork pushed with a rewritten workflow,
          // or a run after the result is in, finds no open request.
          if (!isOpenRequest(await gateStatus(head))) {
            console.log(`${head.slice(0, 10)} has no open ${context()} request; nothing to report.`);
            return;
          }

          // Checked again here, from the run itself: the request step's view could be
          // stale, and the run's path is only known now.
          const distrust = forkRunDistrust(run.path, await forkCiChanges(env('BASE_REF'), head));
          if (distrust) {
            await setStatus(head, 'failure', distrust, run.html_url);
            return;
          }

          const jobs: RunJob[] = [];
          for (let page = 1; ; page++) {
            const { jobs: batch } = await github(
              'GET',
              `/repos/${repo()}/actions/runs/${run.id}/attempts/${run.run_attempt}/jobs?per_page=100&page=${page}`,
            );
            jobs.push(...batch);
            if (batch.length < 100) {
              break;
            }
          }

          const outcome = forkOutcome(jobs, head, label());
          if (outcome) {
            await setStatus(head, outcome.state, outcome.description, run.html_url);
          }
        }

        type SweptPull = {
          number: number;
          headRefOid: string;
          labels: { nodes: { name: string }[] };
          timelineItems: { nodes: { createdAt: string; label: { name: string } }[] };
          commits: {
            nodes: {
              commit: {
                oid: string;
                status: {
                  context: { state: string; description: string | null; targetUrl: string | null; createdAt: string } | null;
                } | null;
              };
            }[];
          };
        };

        const SWEEP_QUERY = `
          query ($owner: String!, $name: String!, $context: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, baseRefName: "main", first: 50, after: $cursor) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number
                  headRefOid
                  labels(first: 100) { nodes { name } }
                  timelineItems(itemTypes: [LABELED_EVENT], last: 30) {
                    nodes { ... on LabeledEvent { createdAt label { name } } }
                  }
                  commits(last: 1) {
                    nodes { commit { oid status { context(name: $context) { state description targetUrl createdAt } } } }
                  }
                }
              }
            }
          }`;

        async function openPulls(): Promise<SweptPull[]> {
          const [owner, name] = repo().split('/');
          const pulls: SweptPull[] = [];
          for (let cursor: string | null = null; ; ) {
            const response = await github('POST', '/graphql', {
              query: SWEEP_QUERY,
              variables: { owner, name, context: context(), cursor },
            });
            if (response.errors) {
              throw new Error(`GraphQL: ${JSON.stringify(response.errors)}`);
            }
            const page = response.data.repository.pullRequests;
            pulls.push(...page.nodes);
            if (!page.pageInfo.hasNextPage) {
              return pulls;
            }
            cursor = page.pageInfo.endCursor;
          }
        }

        async function sweepPull(pull: SweptPull, now: number) {
          const pr = String(pull.number);
          const head = pull.headRefOid;
          const commit = pull.commits.nodes[0]?.commit;
          if (commit?.oid !== head) {
            console.log(`#${pr}: could not read the status of head ${head.slice(0, 10)}`);
            return;
          }
          const gate = commit.status?.context;
          const status = gate
            ? { ...gate, state: gate.state.toLowerCase(), description: gate.description ?? '' }
            : undefined;
          const labelled = pull.labels.nodes.some((each) => each.name === label());
          const labelledAt = labelled
            ? (pull.timelineItems.nodes.findLast((each) => each.label.name === label())?.createdAt ?? null)
            : undefined;

          const runId = !labelled && isOpenRequest(status) ? runIdOf(status?.targetUrl) : null;
          let run: SweptRun | null = null;
          if (runId) {
            try {
              const found = await github('GET', `/repos/${repo()}/actions/runs/${runId}`);
              run = { status: found.status, conclusion: found.conclusion, updatedAt: found.updated_at };
            } catch (error) {
              // A deleted run; the request then ages out.
              console.log(`#${pr}: run ${runId}: ${error}`);
            }
          }

          const action = sweepAction({ labelledAt, status, run }, now);
          if (!action) {
            return;
          }

          // A run waiting for a runner hasn't taken the label or reported yet.
          const { workflow_runs: runs }: { workflow_runs: { status: string; created_at: string }[] } =
            await github(
              'GET',
              `/repos/${repo()}/actions/workflows/${PR_CI_PATH.split('/').pop()}/runs?event=pull_request&head_sha=${head}&per_page=100`,
            );
          if (runs.some((each) => runMayReport({ status: each.status, createdAt: each.created_at }, now))) {
            console.log(`#${pr}: a PR CI run on ${head.slice(0, 10)} may still report`);
            return;
          }

          let description =
            action.failure && `${action.failure} Run again: ${runCommand(repo(), pr, label())}`;
          if (action.removeLabel) {
            // Say why nothing started when GitHub still shows it.
            description = description && ((await labelProblem(pr)) ?? description);
          }

          // The PR was read a while ago; a run may have taken the request since.
          const pullNow = await github('GET', `/repos/${repo()}/pulls/${pr}`);
          const labelledNow = pullNow.labels.some((each: { name: string }) => each.name === label());
          if (pullNow.head.sha !== head || labelledNow !== labelled || !sameStatus(status, await gateStatus(head))) {
            console.log(`#${pr}: changed during the sweep; left for the next one`);
            return;
          }

          if (action.removeLabel) {
            await removeLabel(pr);
          }
          if (description) {
            await setStatus(head, 'failure', description, env('CI_GATE_DOCS_URL'));
          }
        }

        async function sweep() {
          const now = Date.now();
          let failed = 0;
          for (const pull of await openPulls()) {
            try {
              await sweepPull(pull, now);
            } catch (error) {
              failed++;
              console.error(`#${pull.number}: ${error}`);
            }
          }
          if (failed > 0) {
            throw new Error(`could not sweep ${failed} pull request(s)`);
          }
        }

        export async function main() {
          const modes: Record<string, () => Promise<void>> = {
            remind,
            label: labelCheck,
            start,
            finish,
            'fork-request': forkRequest,
            fork,
            sweep,
          };
          const mode = modes[env('CI_GATE_MODE')];
          if (!mode) {
            throw new Error(`unknown CI_GATE_MODE ${process.env.CI_GATE_MODE}`);
          }
          await mode();
        }

        await main();
        NODE_SCRIPT
      shell: bash
      env:
        CI_GATE_MODE: remind
        CI_GATE_CONTEXT: CI gate
        CI_GATE_LABEL: run-ci
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CI_GATE_DOCS_URL: https://github.com/macro-inc/macro/blob/main/.agents/skills/run-ci/SKILL.md
