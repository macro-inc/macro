# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_web_app.rs
name: Deploy Web App
on:
  workflow_call:
    inputs:
      environment:
        description: The environment to build for. e.g. (dev, prod)
        required: true
        type: string
      notify:
        required: false
        type: boolean
      prebuilt:
        description: The caller already ran build_web_app.yml in this run
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
      DD_APP_KEY:
        required: true
      DD_API_KEY:
        required: true
      SEGMENT_WRITE_KEY:
        required: true
      POSTHOG_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to build for
        required: true
        type: choice
        options:
          - dev
          - prod
      notify:
        description: Whether to notify the Slack channel of the deployment completion
        required: false
        type: boolean
jobs:
  build:
    if: '!inputs.prebuilt'
    name: Build
    uses: ./.github/workflows/build_web_app.yml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  deploy:
    needs:
      - build
    if: '!cancelled() && (needs.build.result == ''success'' || needs.build.result == ''skipped'')'
    name: Deploy
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CI: 'true'
    steps:
      - name: Checkout Repo # zizmor: ignore[artipacked] deploy scripts run from the checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: nix
          path: /home/runner/.bun/install/cache
        continue-on-error: true
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup
        uses: ./.github/actions/setup-reqs-web
      - name: Download dist
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: web-app-dist-${{ inputs.environment }}
          path: apps/web/dist
      - name: Install infra dependencies
        run: bun install
        working-directory: infra
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy with Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d
        with:
          command: up
          stack-name: macro-inc/${{ inputs.environment }}
          work-dir: ./infra/stacks/web-app
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_HOST: https://api.us5.datadoghq.com/
      - name: Upload sourcemaps to Datadog
        run: bun run ddupload:"$DEPLOY_ENVIRONMENT"
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: us5.datadoghq.com
          DATADOG_API_HOST: api.us5.datadoghq.com
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        working-directory: apps/web
      - name: Upload production build
        if: inputs.environment == 'prod'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          path: apps/web/dist
          name: web-app-build
          overwrite: 'true'
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
concurrency:
  group: deploy-web-app-${{ inputs.environment }}
  cancel-in-progress: false
