name: Build Desktop on Tag
'on':
  push:
    tags:
    - v[0-9]*
  create: {}
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build (v* or refs/tags/v*). Defaults to the selected protected ref or release tag.
        required: false
        type: string
concurrency:
  group: desktop-${{ inputs.ref || (github.event.ref_type == 'tag' && github.event.ref || github.ref_name) }}
  cancel-in-progress: true
jobs:
  resolve-ref:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'create' && github.event.ref_type == 'tag')
    name: Resolve build ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
    - id: resolve
      name: Resolve ref
      run: |
        set -euo pipefail

        # Resolve the git ref for desktop builds from any trigger type:
        #   push (tag)          → github.ref
        #   create (tag)        → github.event.ref
        #   workflow_dispatch   → inputs.ref (validated) or github.ref (protected)

        case "$EVENT_NAME" in
          push)
            echo "ref=$SELECTED_REF" >> "$GITHUB_OUTPUT"
            ;;
          create)
            if [ "$GITHUB_EVENT_REF_TYPE" != "tag" ]; then
              echo "create event was not a tag; skipping" >&2
              exit 1
            fi
            echo "ref=$GITHUB_EVENT_REF" >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            ref="${INPUT_REF:-$SELECTED_REF}"
            if [[ "$ref" =~ ^refs/tags/v[0-9][0-9A-Za-z._-]*$ ]]; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$ref" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
              echo "ref=refs/tags/$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$INPUT_REF" ] && [ "$SELECTED_REF_PROTECTED" = "true" ]; then
              echo "ref=$SELECTED_REF" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Manual desktop builds only allow release tags (v*) or a protected ref." >&2
            exit 1
            ;;
          *)
            echo "Unexpected event: $EVENT_NAME" >&2
            exit 1
            ;;
        esac
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_REF: ${{ inputs.ref }}
        GITHUB_EVENT_REF: ${{ github.event.ref }}
        GITHUB_EVENT_REF_TYPE: ${{ github.event.ref_type }}
        SELECTED_REF: ${{ github.ref }}
        SELECTED_REF_NAME: ${{ github.ref_name }}
        SELECTED_REF_PROTECTED: ${{ github.ref_protected }}
  build-appimage:
    needs:
    - resolve-ref
    uses: './.github/workflows/build_appimage_on_tag.yml'
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
    secrets: inherit
  build-dmg:
