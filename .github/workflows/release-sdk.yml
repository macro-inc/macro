# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/release_sdk.rs
name: Release SDK
on:
  push:
    branches:
      - main
    paths:
      - packages/sdk/package.json
      - .github/workflows/release-sdk.yml
jobs:
  release:
    name: Release @macro-inc/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout # zizmor: ignore[artipacked] pushes the release tag with the persisted token
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          fetch-depth: '0'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.5'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Setup npm
        run: npm install --global 'npm@^11.5.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/sdk
      - id: resolve
        name: Resolve release version
        run: bun scripts/resolve-release.ts
        working-directory: packages/sdk
      - name: Validate SDK
        if: steps.resolve.outputs.release == 'true'
        run: bun run check && bun test && bun run coverage && bun run build && bun run check:pack
        working-directory: packages/sdk
      - name: Publish package
        if: steps.resolve.outputs.release == 'true'
        run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        working-directory: packages/sdk
      - name: Tag the release
        if: steps.resolve.outputs.release == 'true'
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
      - name: Summarize
        if: always()
        run: |
          case "$IS_RELEASE" in
            true)
              echo "Published @macro-inc/sdk@$RELEASE_VERSION ($RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            false)
              echo "No SDK release: packages/sdk version $RELEASE_VERSION is already published." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "SDK release did not resolve; see the failed step above." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
        env:
          IS_RELEASE: ${{ steps.resolve.outputs.release }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
