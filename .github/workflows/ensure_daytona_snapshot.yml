# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/ensure_daytona_snapshot.rs
name: Ensure Daytona Snapshot
'on':
  push:
    branches:
    - main
    paths:
    - crates/agent_harness/container/**
    - crates/agent_harness/justfile
    - nix/cloud-storage.nix
    - tooling/xtask/crates/xtask_workflows/src/workflows/ensure_daytona_snapshot.rs
    - '.github/workflows/ensure_daytona_snapshot.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  ensure-snapshot:
    name: Ensure macro-agent-harness snapshot
    runs-on: namespace-profile-linux-small
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Ensure Daytona snapshot
      run: |
        set -euo pipefail
        if [[ -z "${DAYTONA_API_KEY:-}" ]]; then
          echo "::error::DAYTONA_API_KEY repository secret is not configured"
          exit 1
        fi
        daytona login --api-key "$DAYTONA_API_KEY"
        just --justfile crates/agent_harness/justfile ensure-daytona
      shell: bash
      env:
        DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
  publish-image:
    name: Publish sandbox image to GHCR
    runs-on: namespace-profile-linux-mid
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Set up Namespace Docker builder
      uses: namespacelabs/nscloud-setup-buildx-action@d059ed7184f0bc7c8b27e8810cea153d02bcc6dd
    - name: Log in to GHCR
      run: |
        set -euo pipefail
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
    - name: Build and push sandbox image
      run: |
        set -euo pipefail
        image=ghcr.io/macro-inc/macro-agent-harness
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag "$image:$GITHUB_SHA" \
          --tag "$image:latest" \
          --push \
          crates/agent_harness/container
      shell: bash
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
