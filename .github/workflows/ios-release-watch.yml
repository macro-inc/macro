# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/ios_release_watch.rs
name: iOS Release Watch
'on':
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
  pull-requests: write
jobs:
  watch:
    name: Re-run the iOS Native Check once the App Store release is live
    runs-on: namespace-profile-linux-tiny-no-cache
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    timeout-minutes: 15
    steps:
    - id: prs
      name: Find PRs waiting on an App Store release
      run: |
        set -euo pipefail
        prs=$(gh pr list --repo "$GH_REPO" --label ios-update --state open \
          --json number,headRefOid,potentialMergeCommit \
          --jq 'map({number, sha: .headRefOid, merge: .potentialMergeCommit.oid})' | jq -c .)
        count=$(jq 'length' <<<"$prs")
        echo "Open PRs labeled ios-update: ${count}"
        echo "prs=${prs}" >> "$GITHUB_OUTPUT"
        echo "count=${count}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Checkout
      if: steps.prs.outputs.count != '0'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Bun
      if: steps.prs.outputs.count != '0'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Fetch App Store Connect credentials from Doppler
      if: steps.prs.outputs.count != '0'
      run: |
        set -euo pipefail
        # Fetch the App Store Connect credentials from Doppler (ios-release/prd) —
        # the same shape as the DMG workflow's notarization step — and hand them to
        # later steps the way the iOS scripts expect them:
        #   APPLE_API_KEY / APPLE_API_ISSUER            exported via GITHUB_ENV
        #   ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8   the private key, where
        #     altool, tauri (APPLE_API_KEY_PATH default) and ios-app-store.mjs look
        # With IOS_DISTRIBUTION_CERTIFICATE=1 the optional Apple Distribution .p12 is
        # decoded to $RUNNER_TEMP and exported as APPLE_DISTRIBUTION_CERTIFICATE_PATH
        # / _PASSWORD for the signing step.
        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "DOPPLER_TOKEN is empty: the IOS_RELEASE_DOPPLER_TOKEN secret is missing, or this is a fork PR (secrets are not available to forks; a maintainer must run the release from a branch in this repository, or add skip-ios-update if the change is non-breaking)." >&2
          exit 1
        fi

        umask 077
        secrets=$(mktemp)
        trap 'rm -f "$secrets"' EXIT
        curl --fail --silent --show-error --retry 3 \
          --header "Authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/configs/config/secrets/download?project=ios-release&config=prd&format=json' \
          > "$secrets"

        required() {
          jq -er --arg name "$1" '.[$name] | strings | select(length > 0)' "$secrets" \
            || { echo "ios-release/prd is missing $1" >&2; exit 1; }
        }
        key_id=$(required APPLE_API_KEY_ID)
        issuer=$(required APPLE_API_ISSUER)

        key_dir="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$key_dir"
        key_path="$key_dir/AuthKey_${key_id}.p8"
        required APPLE_API_PRIVATE_KEY > "$key_path"
        echo "::add-mask::$issuer"
        {
          echo "APPLE_API_KEY=$key_id"
          echo "APPLE_API_ISSUER=$issuer"
        } >> "$GITHUB_ENV"
        echo "Wrote App Store Connect API key $key_id to $key_path"

        if [ "${IOS_DISTRIBUTION_CERTIFICATE:-}" = "1" ]; then
          certificate=$(jq -r '.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 // empty' "$secrets")
          if [ -z "$certificate" ]; then
            echo "No APPLE_DISTRIBUTION_CERTIFICATE_BASE64 in ios-release/prd; the build will" \
              "rely on Xcode cloud signing via the API key."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          printf '%s' "$certificate" | base64 --decode > "$certificate_path" 2>/dev/null \
            || printf '%s' "$certificate" | base64 -D > "$certificate_path"
          password=$(jq -r '.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD // empty' "$secrets")
          [ -z "$password" ] || echo "::add-mask::$password"
          {
            echo "APPLE_DISTRIBUTION_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          echo "Wrote Apple Distribution certificate to $certificate_path"
        fi
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ secrets.IOS_RELEASE_DOPPLER_TOKEN }}
    - name: Re-run the check on PRs whose release is live
      if: steps.prs.outputs.count != '0'
      run: |
        # --- native tree ------------------------------------------------------------
        # Hash identifying "the iOS native code" at a commit: every tracked blob under
        # apps/web/tauri except the paths that never reach the iOS binary. Android-only
        # code is recognised by Tauri's naming convention — a path component that is
        # `android`, starts with `android_` / `android.`, or contains `.android.`
        # (the android_* plugins, every android/ directory, android.rs / android.json,
        # android_tls.rs, tauri.android.conf.json; the Rust ones are all behind
        # cfg(target_os = "android")) — plus the desktop updater manifest, editor
        # config, and Markdown (READMEs, generated permission references: never built).
        # Plus one thing outside that tree: the version of the client cache
        # wasm package (crates/client/cache-wasm/Cargo.toml). The app compiles the
        # cache crates natively, and the team bumps that version when a cache change
        # must ship, so the bump — not every edit under crates/client — is the native
        # signal. The release stamps uploaded builds with the hash, the merge gate
        # compares the live build's stamp against the merge result's, and the drift /
        # head guards compare commits with it. Must match nativeTreeHash() in
        # apps/web/scripts/ios-app-store.mjs and the iOS Native Check's change
        # detection (web_app_check_main/ios_native_check.rs).
        NATIVE_TREE_PATH=apps/web/tauri
        CACHE_WASM_MANIFEST=crates/client/cache-wasm/Cargo.toml
        export NATIVE_TREE_EXCLUDE='(^|/)android([_./]|$)|\.android\.|^desktop-release\.json$|^\.helix/|\.md$'

        # native_tree_listing <commit>: what the hash covers — the filtered ls-tree
        # lines plus the cache wasm version — fails if the path is missing.
        # (--full-tree: ls-tree otherwise narrows its output to the current directory,
        # which would silently hash nothing when run from apps/web.)
        native_tree_listing() {
          git rev-parse -q --verify "$1:${NATIVE_TREE_PATH}" >/dev/null || return 1
          git ls-tree -r --full-tree "$1:${NATIVE_TREE_PATH}" \
            | awk -F'\t' '$2 !~ ENVIRON["NATIVE_TREE_EXCLUDE"]'
          echo "cache-wasm-version $(cache_wasm_version "$1")"
        }

        # native_tree_hash <commit>: prints the hash of the listing.
        native_tree_hash() {
          native_tree_listing "$1" | git hash-object --stdin
        }

        # cache_wasm_version <commit>: the `version` of the client cache wasm package
        # at that commit ("none" before the package existed).
        cache_wasm_version() {
          git show "$1:${CACHE_WASM_MANIFEST}" 2>/dev/null \
            | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1 | grep . || echo none
        }

        # native_tree_fetch <sha>: make a commit that is not in this checkout (a new
        # PR head, GitHub's test merge commit, the pre-push head) available to
        # native_tree_hash. Some callers persist actions/checkout credentials; clear
        # inherited headers before adding ours so Git sends Authorization exactly once.
        # Fails if the commit is unreachable (a force-pushed-away head).
        native_tree_fetch() {
          local auth
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth=1 origin "$1"
        }
        # ----------------------------------------------------------------------------
        set -euo pipefail
        # For each open PR labeled `ios-update` (PRS: [{number, sha, merge}]):
        #
        # 1. Drift: if the PR's in-flight App Store submission was built from native
        #    code the PR head no longer has, withdraw it, drop the label and comment —
        #    what the `iOS Release Drift` workflow does on push, except GitHub does
        #    not run pull_request workflows on a PR that conflicts with main, so a
        #    native push to such a PR only gets caught here.
        # 2. Ask App Store Connect whether the iOS version + build committed at the
        #    PR head is live, built from the native tree the PR's merge result would
        #    have (`merge` is GitHub's test merge commit; the gate hashes the same).
        #    When it is, and the PR's latest `iOS Native Check` job (of the web app
        #    PR checks run) failed — it fails until the release is live — re-run that
        #    job so the gate, and the `Web App Status Check` that depends on it, go
        #    green without anyone clicking "Re-run".
        #
        # GH_TOKEN needs actions:write + pull-requests:write.
        cd apps/web
        conf_path="apps/web/tauri/src-tauri/tauri.ios.conf.json"
        bump='cd apps/web && doppler run --project ios-release --config prd -- just ios-bump'

        check_pr() {
          local pr=$1 number sha merge conf version build head_tree native_tree run run_id status run_url job conclusion job_id reruns outputs withdrawn live
          number=$(jq -r '.number' <<<"$pr")
          sha=$(jq -r '.sha' <<<"$pr")
          merge=$(jq -r '.merge // empty' <<<"$pr")
          conf=$(gh api "repos/${GH_REPO}/contents/${conf_path}?ref=${sha}" --jq '.content' | base64 --decode)
          version=$(jq -r '.version' <<<"$conf")
          build=$(jq -r '.bundle.iOS.bundleVersion' <<<"$conf")

          # 1. Drift check against the head's native code.
          native_tree_fetch "$sha"
          head_tree=$(native_tree_hash "$sha")
          outputs="$RUNNER_TEMP/withdraw-${number}.out"
          : >"$outputs"
          GITHUB_OUTPUT="$outputs" bun scripts/ios-app-store.mjs withdraw --pr "$number" --unless-tree "$head_tree" \
            >"$RUNNER_TEMP/withdraw-${number}.log" 2>&1 || true
          sed 's/^/  /' "$RUNNER_TEMP/withdraw-${number}.log"
          withdrawn=$(sed -n 's/^withdrawn=//p' "$outputs")
          live=$(sed -n 's/^live=//p' "$outputs")
          if [[ "$withdrawn" == "true" || -n "$live" ]]; then
            gh pr edit "$number" --remove-label ios-update
            if [[ -n "$live" ]]; then
              gh pr comment "$number" --body "🚨 Native changes were pushed to this PR after Apple had already approved iOS ${live}, so that build is (or is about to be) live with native code this PR no longer matches. Bump (\`${bump}\`), commit, re-add the \`ios-update\` label, and ship the follow-up as soon as possible. The label was removed."
            else
              gh pr comment "$number" --body "📱 Native code changed after this PR's App Store release started (the push-time drift check could not run — does the PR conflict with \`main\`?), so the pending App Review submission was withdrawn and the \`ios-update\` label removed. When the PR is ready again, bump (\`${bump}\`; the marketing version stays, the build number moves), commit, push, and re-add \`ios-update\`."
            fi
            echo "PR #${number}: stale submission handled; label removed"
            return 0
          fi

          # 2. Live check against the merge result.
          if [[ -z "$merge" ]]; then
            echo "PR #${number}: no merge commit (conflicts with main?); cannot check the merge result"
            return 0
          fi
          native_tree_fetch "$merge"
          native_tree=$(native_tree_hash "$merge")
          echo "PR #${number}: iOS ${version} (build ${build}) at ${sha:0:10}, merge-result native tree ${native_tree:0:10}"

          if ! bun scripts/ios-app-store.mjs status --require-live \
              --version "$version" --build "$build" --native-tree "$native_tree" \
              >"$RUNNER_TEMP/status-${number}.log" 2>&1; then
            echo "  not live yet:"
            sed 's/^/    /' "$RUNNER_TEMP/status-${number}.log"
            return 0
          fi
          echo "  live on the App Store"

          run=$(gh run list --workflow web-app-check-main.yml --commit "$sha" \
            --json databaseId,status,url --limit 1 --jq '.[0] // empty')
          if [[ -z "$run" ]]; then
            echo "  no Web App Pr Checks run for this commit; skipping"
            return 0
          fi
          run_id=$(jq -r '.databaseId' <<<"$run")
          status=$(jq -r '.status' <<<"$run")
          run_url=$(jq -r '.url' <<<"$run")
          if [[ "$status" != "completed" ]]; then
            echo "  Web App Pr Checks run ${run_id} is ${status}; skipping"
            return 0
          fi
          job=$(gh run view "$run_id" --json jobs \
            --jq '.jobs[] | select(.name == "iOS Native Check") | {id: .databaseId, conclusion}')
          if [[ -z "$job" ]]; then
            echo "  run ${run_id} has no iOS Native Check job; skipping"
            return 0
          fi
          job_id=$(jq -r '.id' <<<"$job")
          conclusion=$(jq -r '.conclusion' <<<"$job")
          if [[ "$conclusion" == "success" ]]; then
            echo "  iOS Native Check already passed"
            return 0
          fi
          if [[ "$conclusion" != "failure" ]]; then
            echo "  iOS Native Check job concluded ${conclusion}; leaving it alone"
            return 0
          fi
          # If our re-run also fails something else is wrong (the job's log says
          # what), so stop after two rather than retrying every half hour forever.
          # Counted by our own comments: the run's attempt number is shared with
          # label re-runs and "re-run failed jobs" clicks for flaky tests.
          reruns=$(gh pr view "$number" --json comments --jq \
            "[.comments[].body | select(contains(\"Re-ran the **iOS Native Check**\")) | select(contains(\"iOS ${version} (build ${build})\"))] | length")
          if (( reruns >= 2 )); then
            echo "  iOS Native Check already re-run ${reruns} times and still failing; not re-running again — see ${run_url}"
            return 0
          fi
          echo "  re-running iOS Native Check (job ${job_id} of run ${run_id}; ${reruns} automatic re-runs so far)"
          gh run rerun --job "$job_id"
          gh pr comment "$number" --body "📱 iOS ${version} (build ${build}) is live on the App Store. Re-ran the **iOS Native Check** ([run](${run_url})); this PR can merge once it passes."
        }

        # One PR's API hiccup must not stop the others from being checked this
        # half hour: each PR runs in its own errexit subshell.
        failed=0
        while read -r pr; do
          set +e
          ( set -e; check_pr "$pr" )
          rc=$?
          set -e
          if (( rc != 0 )); then
            echo "  error while checking PR $(jq -r '.number' <<<"$pr") (exit ${rc}); continuing"
            failed=1
          fi
        done < <(jq -c '.[]' <<<"$PRS")
        exit $failed
      shell: bash
      env:
        PRS: ${{ steps.prs.outputs.prs }}
