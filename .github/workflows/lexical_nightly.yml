# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/lexical_nightly.rs
name: Lexical nightly
'on':
  schedule:
  - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  native:
    name: Native replay and traceability
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    env:
      PROPTEST_CASES: '20000'
      LEXICAL_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        fetch-depth: '0'
        persist-credentials: 'false'
    - name: Clear prior execution evidence
      run: rm -rf packages/lexical-conformance/coverage/results target/lexical-conformance/cases.json
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: |-
          /nix
          ./target
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cargo/.global-cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        seed-cache: sccache-ci
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Install conformance dependencies
      run: bun install --cwd packages/lexical-conformance --frozen-lockfile --ignore-scripts
    - name: Enforce native editor feature isolation
      run: bun apps/web/scripts/native-editor-features.ts
    - name: Validate traceability tooling
      run: |-
        bunx tsc --noEmit -p coverage/tsconfig.json
        bunx vitest run --config coverage/vitest.config.ts
      working-directory: packages/lexical-conformance
    - name: Model unit and handwritten tests
      run: bun packages/lexical-conformance/coverage/run-tests.ts
    - name: Replay every recorded fixture
      if: always()
      run: just lexical-replay
    - name: Trace every required symbol
      if: always()
      run: |-
        just lexical-coverage-seed --check
        just lexical-coverage --check
    - name: Upload lexical-native-results artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: lexical-native-results
        path: packages/lexical-conformance/coverage/results
        if-no-files-found: error
        retention-days: '30'
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  wasm:
    name: Wasm and boundary checks
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    timeout-minutes: 60
    steps:
    - name: Checkout
