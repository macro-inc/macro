      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        seed-cache: sccache-ci
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Install conformance dependencies
      run: bun install --cwd packages/lexical-conformance --frozen-lockfile --ignore-scripts
    - name: Cache verified upstream archive
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |-
          target/lexical-upstream.tar.gz
          target/lexical-upstream
        key: lexical-upstream-${{ hashFiles('packages/lexical-conformance/upstream.lock', 'packages/lexical-conformance/record/hooks.patch') }}
    - name: Re-record, replay and verify no diff
      run: just lexical-fixtures --check
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  session:
    name: Document session client contract
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    timeout-minutes: 60
