      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: |-
          /nix
          ./target
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cargo/.global-cache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
      with:
        seed-cache: sccache-ci
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Install conformance dependencies
      run: bun install --cwd packages/lexical-conformance --frozen-lockfile --ignore-scripts
    - name: Compile wasm interpreters
      run: cargo check -p lexical_conformance -p lexical_conformance_wasm --target wasm32-unknown-unknown
    - name: Replay every fixture on wasm32
      run: just lexical-replay-wasm
    - name: Flat ABI differential
      if: always()
      run: cargo test -p lexical_conformance --test flat_diff
    - name: Build both conformance wasm targets
      if: always()
      run: just build-lexical-conformance-wasm
    - name: Tier C upstream text and paragraph subset
      if: always()
      run: STEPS=10000 bunx vitest run --config diff/vitest.config.mts
      working-directory: packages/lexical-conformance
    - name: Development-only boundary checks
      if: always()
      run: bun packages/lexical-conformance/coverage/boundaries.ts
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  fixtures:
