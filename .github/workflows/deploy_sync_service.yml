# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_sync_service.rs
name: Deploy Sync Service
on:
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to. e.g. (dev, prod)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=sync-service-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: rust
          path: |-
            ${{ github.workspace }}/target
            /home/runner/.cargo/bin
            /home/runner/.cache/.wasm-pack
        continue-on-error: true
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          sccache: 'false'
          rust-cache: 'false'
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: services/sync-service
      - name: Check required secrets
        run: node scripts/check-deploy-secrets.mjs "$DEPLOY_ENVIRONMENT"
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/sync-service
      - id: worker-key
        name: Compute worker input key
        run: echo "key=$(.github/scripts/sync-worker-key.sh)" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - id: worker-state
        name: Compare with the live worker
        run: ../../.github/scripts/sync-worker-state.sh
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          WORKER_KEY: ${{ steps.worker-key.outputs.key }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/sync-service
      - name: Apply D1 migrations
        if: steps.worker-state.outputs.unchanged != 'true'
        run: npx wrangler d1 migrations apply USER_PEER_MAPPING --env "$DEPLOY_ENVIRONMENT" --remote
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/sync-service
      - name: Deploy with wrangler
        if: steps.worker-state.outputs.unchanged != 'true'
        run: npx wrangler deploy --env "$DEPLOY_ENVIRONMENT" --message "inputs:$WORKER_KEY"
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          WORKER_KEY: ${{ steps.worker-key.outputs.key }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/sync-service
      - name: Wait for active Durable Objects to update
        run: sleep "$WAIT_SECONDS"
        env:
          WAIT_SECONDS: ${{ steps.worker-state.outputs.wait_seconds }}
concurrency:
  group: deploy-sync-service-${{ inputs.environment || 'dev' }}
