# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/build_web_app.rs
name: Build Web App
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: The environment to build for. e.g. (dev, prod)
    secrets:
      SEGMENT_WRITE_KEY:
        required: true
      POSTHOG_API_KEY:
        required: true
jobs:
  build:
    name: Build
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CI: 'true'
      WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs-deploy
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: /home/runner/.bun/install/cache
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup
      uses: ./.github/actions/setup-reqs-web
    - id: restore-wasm
      name: Restore wasm packages
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /home/runner/.cache/wasm-pkgs-deploy
        key: deploy-wasm-pkgs-v2-${{ github.sha }}
        restore-keys: deploy-wasm-pkgs-v2-
      timeout-minutes: 3
      continue-on-error: true
    - id: wasm
      name: Build wasm packages
      run: |
        set -euo pipefail
        # Build the wasm packages, reusing unchanged ones from WASM_PKG_CACHE_DIR, then
        # keep only the packages this build used and name the set for the cache save.
        #
        # A failed restore can leave a partial extraction behind, and
        # cached-wasm-build.sh reuses any entry directory that exists, so without a
        # restored entry start from nothing.
        if [ -z "${RESTORED_KEY:-}" ]; then
          rm -rf "$WASM_PKG_CACHE_DIR"
        fi
        # Restored entries carry the mtimes of the run that saved them. Mark them
        # current first, so cached-wasm-build.sh's pruning of week-old entries cannot
        # remove one before this build has looked it up.
        find "$WASM_PKG_CACHE_DIR" -mindepth 1 -maxdepth 1 -exec touch {} + 2>/dev/null || true
        # cached-wasm-build.sh touches every entry it reuses or stores, so entries not
        # newer than `started` belong to builds of other inputs and would only grow the
        # saved cache.
        started="$(mktemp)"
        just build-wasm
        find "$WASM_PKG_CACHE_DIR" -mindepth 1 -maxdepth 1 \( -name '.tmp-*' -o ! -newer "$started" \) \
          -exec rm -rf {} +
        rm -f "$started"
        # Entry names hold each package's input key, so the same packages make the same
        # set name. The run id keeps the save key new, since a set can come back after
        # another replaced it as the newest entry.
        packages="$(find "$WASM_PKG_CACHE_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
        printf '%s\n' "$packages"
        set_prefix="$KEY_PREFIX$(printf '%s\n' "$packages" | sha256sum | cut -c1-32)-"
        case "${RESTORED_KEY:-}" in
          "$set_prefix"*) echo "The restored entry holds these packages; nothing to save." ;;
          *) echo "key=$set_prefix$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT" ;;
        esac
      env:
        KEY_PREFIX: deploy-wasm-pkgs-v2-
        RESTORED_KEY: ${{ steps.restore-wasm.outputs.cache-matched-key }}
      working-directory: apps/web
    - name: Save wasm packages
      if: steps.wasm.outputs.key != ''
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /home/runner/.cache/wasm-pkgs-deploy
        key: ${{ steps.wasm.outputs.key }}
      timeout-minutes: 3
      continue-on-error: true
    - name: Build
      run: just build-${{ inputs.environment }}
      env:
        VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        VITE_OTEL_EXPORTER_URL: ${{ inputs.environment == 'prod' && 'https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces' || 'https://macro-prox-dev.macroverse.workers.dev/i/otlp/v1/traces' }}
        VITE_OTEL_ENV: ${{ inputs.environment == 'prod' && 'prod' || 'development' }}
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Upload dist
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: web-app-dist-${{ inputs.environment }}
        path: apps/web/dist
        if-no-files-found: error
        retention-days: ${{ inputs.environment == 'prod' && 7 || 1 }}
        overwrite: 'true'
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
