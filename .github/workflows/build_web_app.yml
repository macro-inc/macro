# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/build_web_app.rs
name: Build Web App
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: The environment to build for. e.g. (dev, prod)
    secrets:
      SEGMENT_WRITE_KEY:
        required: true
      POSTHOG_API_KEY:
        required: true
jobs:
  build:
    name: Build
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CI: 'true'
      WASM_PKG_CACHE_DIR: /home/runner/.cache/wasm-pkgs-deploy
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cache/.wasm-pack
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup
      uses: ./.github/actions/setup-reqs-web
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # The server checks the WebDAV backend before it reports ready, and the
          # client's default 10s wait can run out. This limit has no env var.
          sccache_conf="$RUNNER_TEMP/sccache.toml"
          echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
          echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Start sccache server
      run: sccache --start-server
    - id: restore-wasm
      name: Restore wasm packages
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /home/runner/.cache/wasm-pkgs-deploy
        key: deploy-wasm-pkgs-v1-${{ github.sha }}
        restore-keys: deploy-wasm-pkgs-v1-
      continue-on-error: true
    - id: wasm
      name: Build wasm packages
      run: |
        set -euo pipefail
        # Build the wasm packages, reusing unchanged ones from WASM_PKG_CACHE_DIR, then
        # keep only the packages this build used and name the set for the cache save.
        # A package reused or stored here is newer than `started`
        # (apps/web/scripts/cached-wasm-build.sh touches it), so older entries belong
        # to builds of other inputs and would only grow the saved cache.
        # Entries come back from the Actions cache with the mtimes of the run that saved
        # them. Mark them current first, so cached-wasm-build.sh's pruning of week-old
        # entries cannot remove one before this build has looked it up.
        find "$WASM_PKG_CACHE_DIR" -mindepth 1 -maxdepth 1 -exec touch {} + 2>/dev/null || true
        started="$(mktemp)"
        just build-wasm
        find "$WASM_PKG_CACHE_DIR" -mindepth 1 -maxdepth 1 \( -name '.tmp-*' -o ! -newer "$started" \) \
          -exec rm -rf {} +
        rm -f "$started"
        # Entry names hold each package's input key, so the same set gets the same name
        # and an unchanged set is not saved again.
        packages="$(find "$WASM_PKG_CACHE_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
        printf '%s\n' "$packages"
        echo "key=deploy-wasm-pkgs-v1-$(printf '%s\n' "$packages" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      working-directory: apps/web
    - name: Save wasm packages
      if: steps.wasm.outputs.key != steps.restore-wasm.outputs.cache-matched-key
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /home/runner/.cache/wasm-pkgs-deploy
        key: ${{ steps.wasm.outputs.key }}
      continue-on-error: true
    - name: Build
      run: just build-${{ inputs.environment }}
      env:
        VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        VITE_OTEL_EXPORTER_URL: ${{ inputs.environment == 'prod' && 'https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces' || 'https://macro-prox-dev.macroverse.workers.dev/i/otlp/v1/traces' }}
        VITE_OTEL_ENV: ${{ inputs.environment == 'prod' && 'prod' || 'development' }}
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Upload dist
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: web-app-dist-${{ inputs.environment }}
        path: apps/web/dist
        if-no-files-found: error
        retention-days: '1'
        overwrite: 'true'
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
