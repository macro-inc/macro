# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/release_production.rs
name: Deploy Production Release
env:
  MODE: production
on:
  release:
    types:
    - released
jobs:
  deploy-cloud-storage:
    if: github.event_name == 'release'
    name: Deploy Cloud Storage Services
    uses: ./.github/workflows/deploy_all_services.yml
    with:
      environment: prod
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
  deploy-sync-service:
    needs:
    - deploy-cloud-storage
    name: Deploy Sync Service
    uses: ./.github/workflows/deploy_sync_service.yml
    with:
      environment: prod
    secrets: inherit
  deploy-ai-editing-worker:
    needs:
    - deploy-cloud-storage
    - deploy-sync-service
    name: Deploy AI Editing Worker
    uses: ./.github/workflows/deploy_ai_editing_worker.yml
    with:
      environment: prod
    secrets: inherit
  deploy-website:
    if: github.event_name == 'release'
    name: Deploy Website
    uses: ./.github/workflows/deploy_website.yml
    with:
      environment: prod
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  publish-ios:
    needs:
    - deploy
    name: Publish iOS App Store Version
    uses: ./.github/workflows/ios-app-store-publish.yml
    permissions:
      contents: read
    secrets:
      IOS_RELEASE_DOPPLER_TOKEN: ${{ secrets.IOS_RELEASE_DOPPLER_TOKEN }}
  build:
    if: github.event_name == 'release'
    name: Build Web App
    uses: ./.github/workflows/build_web_app.yml
    with:
      environment: prod
    secrets:
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  deploy:
    needs:
    - build
    - deploy-cloud-storage
    - deploy-sync-service
    name: Deploy Web App
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CI: 'true'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: /home/runner/.bun/install/cache
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup Prereqs
      uses: ./.github/actions/setup-reqs-web
    - name: Download dist
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: web-app-dist-prod
        path: apps/web/dist
    - name: Install infra dependencies
      run: bun install
      working-directory: infra
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Deploy with Pulumi
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d
      with:
        command: up
        stack-name: macro-inc/prod
        work-dir: ./infra/stacks/web-app
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_HOST: https://api.us5.datadoghq.com/
    - name: Upload sourcemaps to Datadog
      run: bun run ddupload:prod
      env:
        DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
        DATADOG_SITE: us5.datadoghq.com
        DATADOG_API_HOST: api.us5.datadoghq.com
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  upload:
    needs:
    - build
    - deploy
    name: Upload Release Artifacts
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
    - name: Download dist
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: web-app-dist-prod
        path: apps/web/dist
    - name: Create Web App Artifact
      run: tar -czf web-app-${{ github.ref_name }}.tar.gz -C apps/web/dist .
    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        files: web-app-${{ github.ref_name }}.tar.gz
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false
