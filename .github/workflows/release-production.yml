name: Deploy Production Release
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published production release to rebuild Android for (vYYYY.M.D or vYYYY.M.D.N)
        required: true
        type: string
      publish_android:
        description: Attach the verified APK to the existing release
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'production' }}
  cancel-in-progress: false

env:
  MODE: "production"

jobs:
  build-android:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      CI: "true"
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Validate recovery release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false'
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup prerequisites
        uses: ./.github/actions/setup-reqs-web
      - name: Prepare version and signing
        id: metadata
        working-directory: apps/web
        env:
          DOPPLER_TOKEN: ${{ secrets.ANDROID_RELEASE_DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          filename=$(bun scripts/android-release.ts metadata "$RELEASE_TAG" "$RUNNER_TEMP/android-release.json")
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          bun scripts/android-release.ts signing "$RUNNER_TEMP/android-signing" \
            tauri/src-tauri/gen/android/keystore.properties
          bun scripts/android-firebase.ts build --doppler "$RUNNER_TEMP/android-google-services.json"
      - name: Build production APK
        working-directory: apps/web
        env:
          VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_OTEL_EXPORTER_URL: https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces
          VITE_OTEL_ENV: prod
        run: |
          set -euo pipefail
          # The Nix environment is already loaded. Do not reload it in nested
          # bash processes and re-enable its local-development sccache wrapper.
          # This ephemeral runner has no compiler cache/server to reuse.
          unset BASH_ENV
          export RUSTC_WRAPPER=""
          cargo tauri --version
          # Tauri has shipped both switch-only and value-taking APK/AAB flags.
          # Nix and local installations can differ; select APK-only with either CLI.
          android_help=$(cargo tauri android build --help)
          apk_args=(--apk)
          if [[ "$android_help" == *'--apk <APK>'* ]]; then
            apk_args=(--apk true --aab false)
          fi
          just android-build --firebase-config "$RUNNER_TEMP/android-google-services.json" \
            "${apk_args[@]}" --ci --config "$RUNNER_TEMP/android-release.json" \
            2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Preserve Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify and collect APK
        working-directory: apps/web
        env:
          APK_FILENAME: ${{ steps.metadata.outputs.filename }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find tauri/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one signed ARM64 release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          bun scripts/android-release.ts verify "$RELEASE_TAG" "${apks[0]}" \
            "$ANDROID_HOME/build-tools/36.0.0" "$RUNNER_TEMP/android-signing/certificate-sha256"
          mkdir -p "$GITHUB_WORKSPACE/android-artifacts"
          cp "${apks[0]}" "$GITHUB_WORKSPACE/android-artifacts/$APK_FILENAME"
          \cd "$GITHUB_WORKSPACE/android-artifacts"
          sha256sum "$APK_FILENAME" > "$APK_FILENAME.sha256"
      - name: Upload verified Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release
          path: android-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: |
          rm -f apps/web/tauri/src-tauri/gen/android/keystore.properties \
            apps/web/tauri/src-tauri/gen/android/app/google-services.json \
            "$RUNNER_TEMP/android-google-services.json"
          rm -rf "$RUNNER_TEMP/android-signing"
      # This hosted runner has no separate /nix cache mount to detach. The cache
      # teardown action's fuser -km /nix can kill the runner on its root filesystem.

  upload-android:
    name: Publish Android release artifact
    needs: [build-android, deploy, deploy-sync-service, deploy-ai-editing-worker]
    if: >-
      ${{ !cancelled() && needs.build-android.result == 'success' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish_android) ||
           (github.event_name == 'release' && needs.deploy.result == 'success' &&
            needs.deploy-sync-service.result == 'success' && needs.deploy-ai-editing-worker.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified Android artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-release
          path: android-artifacts
      - name: Attach APK and checksum to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: android-artifacts/*
          fail_on_unmatched_files: true

  deploy-cloud-storage:
    if: github.event_name == 'release'
    name: Deploy Cloud Storage Services
    uses: ./.github/workflows/deploy_all_services.yml
    with:
      environment: prod
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  deploy-sync-service:
    name: Deploy Sync Service
    # The worker calls DSS/SPS at prod URLs, so don't ship it ahead of them.
    needs: [deploy-cloud-storage]
    uses: ./.github/workflows/deploy_sync_service.yml
    with:
      environment: prod
    secrets: inherit

  deploy-ai-editing-worker:
    name: Deploy AI Editing Worker
    # Calls DSS/search/auth at prod URLs and opens doc sessions against the prod
    # sync-service, so it ships behind both. It must also move in lockstep with
    # cloud-storage's EditDocument tool, which picks the worker's model chains.
    needs: [deploy-cloud-storage, deploy-sync-service]
    uses: ./.github/workflows/deploy_ai_editing_worker.yml
    with:
      environment: prod
    secrets: inherit

  deploy-website:
    if: github.event_name == 'release'
    name: Deploy Website
    # Also owns the macro.com CloudFront distribution in front of the web app.
    uses: ./.github/workflows/deploy_website.yml
    with:
      environment: prod
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  build:
    if: github.event_name == 'release'
    name: Build Web App
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CI: "true"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      # Namespace's native Nix cache plus Bun's explicit package-cache path,
      # shared with web PR checks / previews / dev deploys. Bun comes from the
      # Nix shell, so its native cache planner cannot run this early.
      - name: Mount Namespace cache volume
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1.4.3
        with:
          cache: nix
          path: /home/runner/.bun/install/cache
      # Namespace runners don't ship Nix; must run before setup-reqs-web.
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup Prereqs
        uses: ./.github/actions/setup-reqs-web
      - name: Build for Production
        working-directory: apps/web
        run: just build-prod
        env:
          MIN_NATIVE_BUILD_ANDROID: "1"
          MIN_NATIVE_BUILD_IOS: "185"
          VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_OTEL_EXPORTER_URL: https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces
          VITE_OTEL_ENV: prod
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-prod-build
          path: apps/web/dist
          retention-days: 7
      - name: Teardown Nix
        if: ${{ always() }}
        uses: ./.github/actions/teardown-nix

  deploy:
    name: Deploy Web App
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    needs: [build, deploy-cloud-storage]
    env:
      CI: "true"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      # See the build job's mount/setup-nix notes.
      - name: Mount Namespace cache volume
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1.4.3
        with:
          cache: nix
          path: /home/runner/.bun/install/cache
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Setup Prereqs
        uses: ./.github/actions/setup-reqs-web
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: web-app-prod-build
          path: apps/web/dist
      - name: Install infra dependencies
        run: |
          cd infra
          bun install
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy with Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d
        with:
          command: up
          stack-name: macro-inc/prod
          work-dir: ./infra/stacks/web-app
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_HOST: https://api.us5.datadoghq.com/
      - name: Upload sourcemaps to Datadog
        working-directory: apps/web
        run: bun run ddupload:prod
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: us5.datadoghq.com
          DATADOG_API_HOST: api.us5.datadoghq.com
      - name: Teardown Nix
        if: ${{ always() }}
        uses: ./.github/actions/teardown-nix

  upload:
    name: Upload Release Artifacts
    # Checkout + artifact download + tar + gh-release upload; no build.
    runs-on: namespace-profile-linux-tiny-no-cache
    needs: [build, deploy]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: web-app-prod-build
          path: apps/web/dist
      - name: Create Web App Artifact
        run: tar -czf web-app-${{ github.ref_name }}.tar.gz -C apps/web/dist .
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: web-app-${{ github.ref_name }}.tar.gz
