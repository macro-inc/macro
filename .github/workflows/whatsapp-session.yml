# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/whatsapp_session.rs
name: WhatsApp session safety
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    paths:
    - services/whatsapp_session/**
    - '.github/workflows/**'
    - tooling/xtask/crates/xtask_workflows/src/workflows/whatsapp_session.rs
jobs:
  protocol-safety:
    runs-on: namespace-profile-linux-small
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Pinned Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: '1.27.2'
        cache-dependency-path: services/whatsapp_session/go.sum
    - name: Race and physical writer regressions
      run: './go.sh test -race ./... && ./go.sh test -race go.mau.fi/whatsmeow go.mau.fi/whatsmeow/socket && ./go.sh vet ./...'
      working-directory: services/whatsapp_session
