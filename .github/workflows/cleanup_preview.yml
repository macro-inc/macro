# DO NOT EDIT — regenerate with `cargo x workflows` (from rust/cloud-storage).
# Source: rust/cloud-storage/tools/xtask/src/workflows/cleanup_preview.rs
name: Cleanup Preview
env:
  PREVIEW_BUCKET: macro-preview-assets-dev
'on':
  pull_request:
    types:
    - closed
jobs:
  cleanup:
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - id: preview-id
      name: Get preview ID from comments
      run: |
        PREVIEW_ID=$(bun scripts/preview/get-or-create-id.ts \
          --pr ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --branch "$BRANCH")
        echo "id=$PREVIEW_ID" >> $GITHUB_OUTPUT
        echo "Preview ID: $PREVIEW_ID"
      env:
        BRANCH: ${{ github.head_ref }}
      working-directory: js/app
    - name: Cleanup preview
      if: steps.preview-id.outputs.id != ''
      run: |
        bun scripts/preview/deploy.ts \
          --preview-id ${{ steps.preview-id.outputs.id }} \
          --cleanup
      working-directory: js/app
