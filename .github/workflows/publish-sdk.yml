# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/publish_sdk.rs
name: Publish SDK
on:
  push:
    tags:
      - sdk-v*
jobs:
  publish:
    name: Publish @macro-inc/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          fetch-depth: '0'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.5'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Setup npm
        run: npm install --global 'npm@^11.5.1'
      - name: Verify release tag
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          package_version="$(node -p "require('./packages/sdk/package.json').version")"

          if [ "$version" != "$package_version" ]; then
            echo "tag version $version does not match package version $package_version"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/sdk
      - name: Validate SDK
        run: bun run check && bun test && bun run coverage && bun run build && bun run check:pack
        working-directory: packages/sdk
      - name: Publish package
        run: npm publish --access public
        working-directory: packages/sdk
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
