permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - id: preflight
      name: Check upstream exporter limits
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          const run = context.payload.workflow_run;
          const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
            ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
          });
          if (data.total_count > 100 || data.jobs.length !== data.total_count) {
            throw new Error('Grafana exporter supports at most 100 jobs; refusing a partial trace');
          }
          // Check the pinned exporter's name-based IDs and timestamp requirements.
          const { createHash } = require('node:crypto');
          const prefix = `${context.repo.owner}/${context.repo.repo}${run.id}${run.run_attempt}`;
          const ids = new Set();
          function span(suffix) {
            const id = createHash('sha256').update(prefix + suffix).digest('hex').slice(16, 32);
            if (ids.has(id)) throw new Error('Duplicate exporter span ID; job/step names must be distinct');
            ids.add(id);
          }
          function timed(entry) {
            const start = Date.parse(entry.started_at);
            const end = Date.parse(entry.completed_at);
            return entry.conclusion && Number.isFinite(start) && Number.isFinite(end) && end >= start;
          }
          span('s');
          for (const job of data.jobs) {
            if (job.status !== 'completed' || !timed(job)) {
              throw new Error('Job timing is incomplete; retry after GitHub finalizes this attempt');
            }
            span(job.name);
            for (const step of job.steps ?? []) {
              if (!timed(step)) throw new Error('Step timing is unavailable; this exporter cannot represent it');
              span(job.name + step.name);
            }
          }
          // At 512 spans upstream starts an asynchronous batch whose failure can be swallowed.
          if (ids.size >= 512) throw new Error('Grafana exporter cannot reliably report delivery failures for 512+ spans');
          core.setOutput('export', data.jobs.length > 0);
          if (!data.jobs.length) core.notice('No jobs in this attempt; no execution trace to export');
    - name: Collect push, job and step events
      if: always()
      run: |
        node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
        // Turn one completed workflow run into CI telemetry events, as an OTLP logs file.
        //
        // Runs in the privileged exporter without the ingestion token. Everything here is
        // best effort: an error becomes a warning, and the observed workflow is never
        // affected. Events carry ids, names of our own jobs and steps, and timings, never
        // branch names, actors, titles or file paths.

        import { createHash } from 'node:crypto';
        import { readFileSync, writeFileSync } from 'node:fs';

        const API = 'https://api.github.com';
        const PR_EVENTS = new Set(['pull_request', 'pull_request_target']);
        // Runs after a PR closes, so it is never part of waiting for checks.
        const NOT_A_CHECK = new Set(['Cleanup Preview']);
        // Experiment branches stay queryable but are flagged out of the real PR numbers.
        const EXPERIMENT_BRANCH = /^[^/]+\/ci-/;
        // A warm volume restores the dev shell in about 4 s, an empty one takes 110 s or more.
        export const DEV_SHELL_STEP = 'Setup Nix dev shell';
        const COLD_VOLUME_SECONDS = 30;
        // A start this long after the push was not caused by it: a reopen or leaving draft.
        const MAX_PUSH_LAG_SECONDS = 600;
        // Below this a step is noise, and it stays visible in the trace.
        const MIN_STEP_SECONDS = 1;
        // Stop before the exporter's own traces start failing for lack of API budget.
        const MIN_RATE_REMAINING = 100;
        const MAX_FILE_PAGES = 3;
        // Roll-up jobs finish last by design, so they never say what held a push up.
        const ROLL_UP_JOB = /status[ -]check/i;
        // Loki refuses a line this far behind its stream's newest one.
        export const MAX_EVENT_AGE_SECONDS = 1800;
        const SMALL_RUST_CRATES = 2;
        const MEDIUM_RUST_CRATES = 9;
        const WEB_SUFFIXES = ['.ts', '.tsx', '.js', '.jsx', '.css', '.html', '.svelte'];
        const RUST_ROOT_FILES = new Set(['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml']);
        const CRATE_DIRECTORIES = new Set(['src', 'tests', 'benches', 'examples', 'migrations']);

        export type Timed = {
          started_at?: string | null;
          completed_at?: string | null;
          conclusion?: string | null;
        };

        export type Step = Timed & { name: string };

        export type Job = Timed & {
          id: number;
          name: string;
          created_at?: string | null;
          labels?: string[] | null;
          steps?: Step[] | null;
        };

        export type Run = {
          id: number;
          name: string;
          run_attempt: number;
          event: string;
          head_sha: string;
          head_branch?: string | null;
          status: string;
          conclusion: string | null;
          created_at: string;
          updated_at: string;
          pull_requests?: { number: number }[] | null;
          head_repository?: { fork?: boolean } | null;
        };

        export type PullRequest = { created_at: string; draft?: boolean };

        type Interval = [Date, Date];
        type Attributes = Record<string, string | number | boolean>;

        export type TelemetryEvent = {
          body: string;
          at: Date;
          attributes: Attributes;
          ids: [traceId: string, spanId: string];
        };

        export interface GithubApi {
          get(path: string, params?: Record<string, string | number>): Promise<any>;
          calls: number;
          rateLimit: number | null;
          rateRemaining: number | null;
        }

        function parseTime(value: string | null | undefined): Date | null {
          return value ? new Date(value) : null;
        }

        function seconds(start: Date, end: Date): number {
          return Math.trunc((end.getTime() - start.getTime()) / 1000);
        }

        function maxBy<T>(items: T[], key: (item: T) => number): T {
          return items.reduce((best, item) => (key(item) > key(best) ? item : best));
        }

        export class HttpError extends Error {
          code: number;

          constructor(code: number) {
            super(`HTTP ${code}`);
            this.code = code;
          }
        }

        /** Counts its own calls and stops before exhausting the shared token budget. */
        class Github implements GithubApi {
          repo: string;
          token: string;
          calls = 0;
          rateLimit: number | null = null;
          rateRemaining: number | null = null;

          constructor(repo: string, token: string) {
            this.repo = repo;
            this.token = token;
          }

          async get(path: string, params: Record<string, string | number> = {}) {
            if (this.rateRemaining !== null && this.rateRemaining < MIN_RATE_REMAINING) {
              throw new Error('GitHub API budget is low');
            }
            const query = new URLSearchParams(
              Object.entries(params).map(([key, value]): [string, string] => [key, String(value)])
            ).toString();
            this.calls += 1;
            const response = await fetch(`${API}/repos/${this.repo}/${path}${query ? `?${query}` : ''}`, {
              headers: {
                Authorization: `Bearer ${this.token}`,
                Accept: 'application/vnd.github+json',
              },
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) throw new HttpError(response.status);
            this.rateLimit = Number(response.headers.get('x-ratelimit-limit')) || null;
            this.rateRemaining = Number(response.headers.get('x-ratelimit-remaining')) || 0;
            return response.json();
          }
        }

        /** The directory holding a crate's sources, which may be nested in a workspace. */
        function crateRoot(parts: string[]): string {
          for (const [index, part] of parts.slice(0, -1).entries()) {
            if (CRATE_DIRECTORIES.has(part)) return parts.slice(0, index).join('/');
          }
          return parts.slice(0, -1).join('/') || parts[0];
        }

        /**
         * Return [pr_type, rust_crates_changed] from the changed paths.
         *
         * Sizes count changed crates, because the workflow API can't see how many packages
         * path-check selected.
         */
        export function classifyFiles(paths: readonly string[]): [string, number] {
          const crates = new Set<string>();
          let rootManifest = false;
          let web = false;
          let infra = false;
          for (const path of paths) {
            const parts = path.split('/');
            if (parts[0] === 'infra' || parts[0] === '.github' || path.endsWith('.nix')) {
              infra = true;
            } else if (
              path.endsWith('.rs') ||
              parts[0] === 'crates' ||
              parts[0] === '.sqlx' ||
              RUST_ROOT_FILES.has(parts[parts.length - 1])
            ) {
              if (parts.length === 1) rootManifest = true;
              crates.add(crateRoot(parts));
            } else if (
              parts[0] === 'apps' ||
              parts[0] === 'packages' ||
              WEB_SUFFIXES.some((suffix) => path.endsWith(suffix))
            ) {
              web = true;
            } else if (parts[0] === 'tooling') {
              infra = true;
            }
          }
          if (crates.size > 0 && web) return ['mixed', crates.size];
          if (crates.size > 0) {
            if (rootManifest || crates.size > MEDIUM_RUST_CRATES) return ['rust-large', crates.size];
            return [crates.size <= SMALL_RUST_CRATES ? 'rust-small' : 'rust-medium', crates.size];
          }
          if (web) return ['web', 0];
          return [infra ? 'infra' : 'other', 0];
        }

        function runAttributes(run: Run): Attributes {
          const attributes: Attributes = {
            workflow: run.name,
            run_id: run.id,
            run_attempt: run.run_attempt,
            event_name: run.event,
            head_sha: run.head_sha,
            experiment: EXPERIMENT_BRANCH.test(run.head_branch ?? ''),
            rerun: run.run_attempt > 1,
          };
          const pullRequest = run.pull_requests?.[0];
          if (pullRequest) attributes.pr_number = pullRequest.number;
          return attributes;
        }

        /** Reproduce gha-otel-export's ids, so an event links to its workflow trace. */
        export function traceIds(
          repo: string,
          run: Pick<Run, 'id' | 'run_attempt'>,
          suffix?: string
        ): [string, string] {
          const prefix = `${repo}${run.id}${run.run_attempt}`;
          const hash = (input: string) => createHash('sha256').update(input).digest('hex');
          return [hash(`${prefix}t`).slice(0, 32), hash(`${prefix}${suffix ?? 's'}`).slice(16, 32)];
        }

        /** Started and finished, not skipped, and with times GitHub didn't copy from an old attempt. */
        function timed(entry: Timed): Interval | null {
          const start = parseTime(entry.started_at);
          const end = parseTime(entry.completed_at);
          if (entry.conclusion === 'skipped' || !start || !end || end < start) return null;
          return [start, end];
        }

        function volumeState(job: Job): [string, number] | null {
          for (const step of job.steps ?? []) {
            const times = timed(step);
            if (step.name === DEV_SHELL_STEP && times) {
              const duration = seconds(...times);
              return [duration >= COLD_VOLUME_SECONDS ? 'cold' : 'warm', duration];
            }
          }
          return null;
        }

        /** Null for a partial rerun's copied job, which starts before it was created. */
        function queueSeconds(job: Job, times: Interval): number | null {
          const created = parseTime(job.created_at);
          if (!created || times[0] < created) return null;
          return seconds(created, times[0]);
        }

        /** One event per job that ran, and one per step long enough to matter. */
        export function jobEvents(repo: string, run: Run, jobs: Job[]): TelemetryEvent[] {
          const base = runAttributes(run);
          const events: TelemetryEvent[] = [];
          for (const job of jobs) {
            const times = timed(job);
            if (!times) continue;
            const attributes: Attributes = {
              ...base,
              event: 'job',
              job: job.name,
              job_id: job.id,
              conclusion: job.conclusion ?? '',
              run_seconds: seconds(...times),
            };
            const queue = queueSeconds(job, times);
            if (queue !== null) attributes.queue_seconds = queue;
            const label = job.labels?.[0];
            if (label) attributes.runner_profile = label.split(';')[0];
            const volume = volumeState(job);
            if (volume) {
              attributes.volume_state = volume[0];
              attributes.dev_shell_seconds = volume[1];
            }
            events.push({
              body: `job ${job.id} ${run.run_attempt}`,
              at: times[1],
              attributes,
              ids: traceIds(repo, run, job.name),
            });
            for (const [number, step] of (job.steps ?? []).entries()) {
              const stepTimes = timed(step);
              if (!stepTimes || seconds(...stepTimes) < MIN_STEP_SECONDS) continue;
              events.push({
                body: `step ${job.id} ${number} ${run.run_attempt}`,
                at: stepTimes[1],
                attributes: {
                  ...base,
                  event: 'step',
                  job: job.name,
                  job_id: job.id,
                  step: step.name,
                  conclusion: step.conclusion ?? '',
                  run_seconds: seconds(...stepTimes),
                },
                ids: traceIds(repo, run, job.name + step.name),
              });
            }
          }
          return events;
        }

        /**
         * The runs started together with this one, and how many such groups came before.
         *
         * A run that starts after everything on the head has finished wasn't part of that
         * wait: it came from a PR edit, a label or leaving draft.
         */
        export function sameTriggerRuns(runs: Run[], run: Pick<Run, 'id'>): [Run[], number] {
          const created = (entry: Run) => new Date(entry.created_at).getTime();
          const groups: Run[][] = [];
          let groupEnd = 0;
          for (const candidate of [...runs].sort((a, b) => created(a) - created(b))) {
            const end =
              candidate.status === 'completed' ? new Date(candidate.updated_at).getTime() : Infinity;
            const group = groups[groups.length - 1];
            if (group && created(candidate) <= groupEnd) {
              group.push(candidate);
              groupEnd = Math.max(groupEnd, end);
            } else {
              groups.push([candidate]);
              groupEnd = end;
            }
          }
          for (const [index, group] of groups.entries()) {
            if (group.some((candidate) => candidate.id === run.id)) return [group, index];
          }
          return [[], 0];
        }

        /** A workflow's newest run decides, since a PR edit can correct an earlier failure. */
        function conclusionOf(runs: Run[]): string {
          const ordered = [...runs].sort(
            (a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime() || a.id - b.id
          );
          const newest = new Map(ordered.map((run) => [run.name, run]));
          const conclusions = new Set([...newest.values()].map((run) => run.conclusion));
          if (['failure', 'timed_out', 'startup_failure'].some((failed) => conclusions.has(failed))) {
            return 'failure';
          }
          return conclusions.has('cancelled') ? 'cancelled' : 'success';
        }

        /** When the wait began: the push, or opening the PR when that came later. */
        export function clockStart(
          firstCreated: Date,
          pushedAt: Date | null,
          prCreatedAt: Date | null
        ): [Date, string] {
          if (!pushedAt) return [firstCreated, 'first_run'];
          const start = prCreatedAt && prCreatedAt > pushedAt ? prCreatedAt : pushedAt;
          if (start > firstCreated || seconds(start, firstCreated) > MAX_PUSH_LAG_SECONDS) {
            return [firstCreated, 'first_run'];
          }
          return [start, start === pushedAt ? 'push' : 'pr_open'];
        }

        type Finished = { end: Date; times: Interval; job: Job; run: Run };

        /**
         * The whole push: start to last job, by PR type. Null when no job ran.
         *
         * `repeat` counts earlier groups of runs on this head. Those later groups are not
         * the push's wait, so they are flagged as reruns.
         */
        export function pushEvent(
          repo: string,
          run: Run,
          runs: Run[],
          jobsByRun: Map<number, Job[]>,
          pushedAt: Date | null,
          pullRequest: PullRequest | null,
          files: readonly string[] | null,
          repeat = 0
        ): TelemetryEvent | null {
          const finished: Finished[] = [];
          for (const candidate of runs) {
            for (const job of jobsByRun.get(candidate.id) ?? []) {
              const times = timed(job);
              if (times) finished.push({ end: times[1], times, job, run: candidate });
            }
          }
          if (finished.length === 0) return null;
          const firstCreated = new Date(Math.min(...runs.map((c) => new Date(c.created_at).getTime())));
          const prCreatedAt = pullRequest ? new Date(pullRequest.created_at) : null;
          const [start, startSource] = clockStart(firstCreated, pushedAt, prCreatedAt);
          const end = maxBy(finished, (entry) => entry.end.getTime()).end;
          const notRollUp = finished.filter((entry) => !ROLL_UP_JOB.test(entry.job.name));
          const work = notRollUp.length > 0 ? notRollUp : finished;
          const last = maxBy(work, (entry) => entry.end.getTime());
          const slowest = maxBy(work, (entry) => seconds(...entry.times));
          const queues = finished
            .map((entry) => queueSeconds(entry.job, entry.times))
            .filter((queue) => queue !== null);
          const [prType, rustCrates] = files !== null ? classifyFiles(files) : ['unknown', 0];
          const attributes: Attributes = {
            ...runAttributes(run),
            event: 'push',
            pr_type: prType,
            rust_crates_changed: rustCrates,
            conclusion: conclusionOf(runs),
            wall_seconds: seconds(start, end),
            wall_start: startSource,
            start_lag_seconds: seconds(start, firstCreated),
            last_workflow: last.run.name,
            last_job: last.job.name,
            last_job_seconds: seconds(...last.times),
            slowest_job: slowest.job.name,
            slowest_job_seconds: seconds(...slowest.times),
            queue_max_seconds: Math.max(0, ...queues),
            queue_total_seconds: queues.reduce((sum, queue) => sum + queue, 0),
            workflows: runs.length,
            jobs: finished.length,
            cold_volumes: finished.filter((entry) => volumeState(entry.job)?.[0] === 'cold').length,
            rerun: repeat > 0 || runs.some((candidate) => candidate.run_attempt > 1),
          };
          delete attributes.workflow;
          delete attributes.run_id;
          delete attributes.run_attempt;
          if (files !== null) attributes.files_changed = files.length;
          if (pullRequest) attributes.pr_draft = Boolean(pullRequest.draft);
          if (run.head_repository?.fork) attributes.fork = true;
          const attempts = runs.reduce((sum, candidate) => sum + candidate.run_attempt, 0);
          // The body and time are the same from every exporter that sees the push finish,
          // so Loki drops the duplicates when two runs complete together.
          return {
            body: `push ${run.head_sha} ${repeat} ${attempts}`,
            at: end,
            attributes,
            ids: traceIds(repo, last.run, last.job.name),
          };
        }

        async function pushedTime(github: GithubApi, branch: string, headSha: string) {
          const activity: { after?: string; timestamp: string }[] = await github.get('activity', {
            ref: `refs/heads/${branch}`,
            per_page: 30,
          });
          const entry = activity.find((candidate) => candidate.after === headSha);
          return entry ? new Date(entry.timestamp) : null;
        }

        async function changedFiles(github: GithubApi, number: number) {
          const paths: string[] = [];
          for (let page = 1; page <= MAX_FILE_PAGES; page += 1) {
            const batch: { filename: string }[] = await github.get(`pulls/${number}/files`, {
              per_page: 100,
              page,
            });
            paths.push(...batch.map((entry) => entry.filename));
            if (batch.length < 100) break;
          }
          return paths;
        }

        /** The push event once this completion is the last one, otherwise null. */
        export async function collectPush(
          github: GithubApi,
          repo: string,
          run: Run
        ): Promise<TelemetryEvent | null> {
          if (!PR_EVENTS.has(run.event)) return null;
          const listing: { workflow_runs: Run[] } = await github.get('actions/runs', {
            head_sha: run.head_sha,
            per_page: 100,
          });
          const checks = listing.workflow_runs.filter(
            (candidate) => PR_EVENTS.has(candidate.event) && !NOT_A_CHECK.has(candidate.name)
          );
          const [runs, repeat] = sameTriggerRuns(checks, run);
          if (runs.length === 0 || runs.some((candidate) => candidate.status !== 'completed')) {
            return null;
          }
          const jobsByRun = new Map<number, Job[]>();
          for (const candidate of runs) {
            jobsByRun.set(
              candidate.id,
              candidate.conclusion === 'skipped'
                ? []
                : (
                    await github.get(
                      `actions/runs/${candidate.id}/attempts/${candidate.run_attempt}/jobs`,
                      { per_page: 100 }
                    )
                  ).jobs
            );
          }
          // GitHub leaves `pull_requests` empty on some runs, so ask the group when this is one.
          const head = run.pull_requests?.length
            ? run
            : (runs.find((candidate) => candidate.pull_requests?.length) ?? run);
          const number = head.pull_requests?.[0]?.number;
          const pullRequest: PullRequest | null = number ? await github.get(`pulls/${number}`) : null;
          const files = number ? await changedFiles(github, number) : null;
          const pushedAt =
            !run.head_repository?.fork && run.head_branch
              ? await pushedTime(github, run.head_branch, run.head_sha)
              : null;
          return pushEvent(repo, head, runs, jobsByRun, pushedAt, pullRequest, files, repeat);
        }

        function otlpValue(value: string | number | boolean) {
          if (typeof value === 'boolean') return { boolValue: value };
          if (typeof value === 'number') return { intValue: String(value) };
          return { stringValue: value };
        }

        /** OTLP logs. A record's time is its event's, clamped to what Loki will accept. */
        export function toOtlp(events: TelemetryEvent[], now: Date) {
          const oldest = now.getTime() - MAX_EVENT_AGE_SECONDS * 1000;
          const logRecords = events.map(({ body, at, attributes, ids: [traceId, spanId] }) => ({
            timeUnixNano: `${Math.trunc(Math.max(at.getTime(), oldest) / 1000)}000000000`,
            severityText: 'INFO',
            body: { stringValue: body },
            traceId,
            spanId,
            attributes: Object.entries(attributes).map(([key, value]) => ({
              key,
              value: otlpValue(value),
            })),
          }));
          const attributes = [
            { key: 'service.name', value: { stringValue: 'ci-telemetry' } },
            { key: 'deployment.environment', value: { stringValue: 'ci' } },
          ];
          return {
            resourceLogs: [
              {
                resource: { attributes },
                scopeLogs: [{ scope: { name: 'ci-telemetry' }, logRecords }],
              },
            ],
          };
        }

        export async function collect(github: GithubApi, repo: string, run: Run) {
          const events: TelemetryEvent[] = [];
          try {
            const { jobs } = await github.get(
              `actions/runs/${run.id}/attempts/${run.run_attempt}/jobs`,
              { per_page: 100 }
            );
            events.push(...jobEvents(repo, run, jobs));
            const push = await collectPush(github, repo, run);
            if (push) events.push(push);
          } catch (error) {
            // A partial export still helps. The class and status can't carry a token or a payload.
            console.log(`::warning::CI telemetry partly collected: ${describe(error)}`);
          }
          return events;
        }

        function describe(error: unknown): string {
          if (error instanceof HttpError) return `HttpError ${error.code}`;
          return error instanceof Error ? error.constructor.name : 'unknown error';
        }

        function required(name: string): string {
          const value = process.env[name];
          if (!value) throw new Error('A required environment variable is missing');
          return value;
        }

        async function runCollection() {
          const started = performance.now();
          const repo = required('GITHUB_REPOSITORY');
          const run: Run = JSON.parse(readFileSync(required('GITHUB_EVENT_PATH'), 'utf8')).workflow_run;
          const github = new Github(repo, required('GITHUB_TOKEN'));
          const events = await collect(github, repo, run);
          const now = new Date();
          const counts: Attributes = {
            event: 'export',
            ...runAttributes(run),
            events: events.length,
            api_calls: github.calls,
            collect_seconds: Math.round((performance.now() - started) / 1000),
          };
          if (github.rateRemaining !== null) counts.rate_remaining = github.rateRemaining;
          if (github.rateLimit) counts.rate_limit = github.rateLimit;
          events.push({
            body: `export ${run.id} ${run.run_attempt}`,
            at: now,
            attributes: counts,
            ids: traceIds(repo, run),
          });
          writeFileSync(required('CI_TELEMETRY_EVENTS'), JSON.stringify(toOtlp(events, now)));
          console.log(`${events.length} events, ${github.calls} API calls`);
        }

        /** Entry point, called by the workflow step and never by an import. */
        export async function main() {
          try {
            await runCollection();
          } catch (error) {
            console.log(`::warning::CI telemetry not collected: ${describe(error)}`);
          }
        }

        await main();
        NODE_SCRIPT
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CI_TELEMETRY_EVENTS: ${{ runner.temp }}/ci-telemetry-events.json
      timeout-minutes: 2
      continue-on-error: true
    - name: Assume CI telemetry role
      if: always()
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        role-to-assume: arn:aws:iam::569036502058:role/macro-observability-ci
        aws-region: us-east-1
        role-duration-seconds: '900'
    - id: ingest
      name: Read ingestion credential
      if: always()
      run: |
        set -euo pipefail
        token=$(aws secretsmanager get-secret-value --region us-east-1 \
          --secret-id observability/dev-ingest --query SecretString --output text)
        if [[ ${#token} -lt 32 || "$token" == *[[:space:]]* ]]; then
          echo 'Invalid ingestion credential' >&2
          exit 1
        fi
        echo "::add-mask::$token"
        headers=$(printf '%s' "$token" | python3 -c 'import sys, urllib.parse; print("Authorization=Bearer%20" + urllib.parse.quote(sys.stdin.read(), safe=""))')
        echo "::add-mask::$headers"
        printf 'headers=%s\n' "$headers" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Send push, job and step events
      if: always()
      run: |
        node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
        // Send the collected CI telemetry to the OTLP logs route. Best effort, never fails the job.

        import { existsSync, readFileSync } from 'node:fs';
        import { gzipSync } from 'node:zlib';

        const ATTEMPTS = 2;
        const TIMEOUT_MILLISECONDS = 10_000;
        const RETRY_DELAY_MILLISECONDS = 2_000;

        /** Read the `Authorization=Bearer%20...` form the credential step writes. */
        export function authorization(headers: string): [string, string] {
          const separator = headers.indexOf('=');
          return [headers.slice(0, separator), decodeURIComponent(headers.slice(separator + 1))];
        }

        async function send(url: string, body: Buffer, header: [string, string]) {
          const response = await fetch(url, {
            method: 'POST',
            body: gzipSync(body),
            headers: {
              'Content-Type': 'application/json',
              'Content-Encoding': 'gzip',
              [header[0]]: header[1],
            },
            signal: AbortSignal.timeout(TIMEOUT_MILLISECONDS),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.status;
        }

        function required(name: string): string {
          const value = process.env[name];
          if (!value) throw new Error('A required environment variable is missing');
          return value;
        }

        async function sendEvents() {
          const started = performance.now();
          const path = required('CI_TELEMETRY_EVENTS');
          if (!existsSync(path)) {
            console.log('Nothing to send');
            return;
          }
          const body = readFileSync(path);
          const header = authorization(required('OTLP_HEADERS'));
          const url = required('OTLP_LOGS_URL');
          for (let attempt = 1; attempt <= ATTEMPTS; attempt += 1) {
            try {
              const status = await send(url, body, header);
              const elapsed = ((performance.now() - started) / 1000).toFixed(1);
              console.log(`Sent ${body.length} bytes, HTTP ${status}, ${elapsed} s`);
              return;
            } catch (error) {
              // Only the class, so neither the header nor a response reaches the log.
              const reason = error instanceof Error ? error.constructor.name : 'unknown error';
              console.log(`::warning::CI telemetry send attempt ${attempt} failed: ${reason}`);
              if (attempt < ATTEMPTS) {
                await new Promise((resolve) => setTimeout(resolve, RETRY_DELAY_MILLISECONDS));
              }
            }
          }
        }

        /** Entry point, called by the workflow step and never by an import. */
        export async function main() {
          try {
            await sendEvents();
          } catch (error) {
            const reason = error instanceof Error ? error.constructor.name : 'unknown error';
            console.log(`::warning::CI telemetry not sent: ${reason}`);
          }
        }

        await main();
        NODE_SCRIPT
      shell: bash
      env:
        CI_TELEMETRY_EVENTS: ${{ runner.temp }}/ci-telemetry-events.json
        OTLP_LOGS_URL: https://otlp.macro-internal.com/v1/logs
        OTLP_HEADERS: ${{ steps.ingest.outputs.headers }}
      timeout-minutes: 1
      continue-on-error: true
    - id: traces
      name: Export workflow, job and step traces
      if: steps.preflight.outputs.export == 'true'
      uses: grafana/grafana-github-actions/gha-otel-export@b1c422726cc4ff4adb0838ebca67586f24babb42
      with:
        github-token: ${{ github.token }}
      env:
        OTEL_SERVICE_NAME: github-actions
        OTEL_RESOURCE_ATTRIBUTES: deployment.environment=ci
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.macro-internal.com
        OTEL_EXPORTER_OTLP_HEADERS: ${{ steps.ingest.outputs.headers }}
