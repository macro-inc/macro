  email-e2e-known-bugs:
    if: github.event_name == 'schedule' || inputs.known_bugs == true
    name: Email end-to-end (known bugs)
    runs-on: namespace-profile-linux-large-build;overrides.cache-tag=sccache-ci
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: -Dwarnings -C link-arg=-fuse-ld=mold
      SQLX_OFFLINE: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
      EMAIL_E2E_DATABASE_URL: postgres://user:password@127.0.0.1:5432/macrodb
      EMAIL_E2E_REDIS_URL: redis://127.0.0.1:6379
      EMAIL_E2E_SQS_URL: http://127.0.0.1:9324
      EMAIL_E2E_KAFKA_BROKERS: '127.0.0.1:9092'
      EMAIL_E2E_RESULTS: target/email-e2e-results
      EMAIL_E2E_KNOWN_BUGS: target/email-e2e-known-bugs
      EMAIL_E2E_SCENARIOS: not binary(search)
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports:
          - '5432:5432'
        options: --health-cmd pg_isready --health-interval 1s --health-start-period 30s --health-timeout 5s --health-retries 5 --shm-size 1g -v /dev/shm/pgdata:/var/lib/postgresql/data
      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: --health-cmd "redis-cli ping" --health-interval 1s --health-start-period 30s --health-timeout 5s --health-retries 5
      sqs:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - '9324:9324'
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        ports:
          - '9092:9092'
        options: --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" --health-interval 2s --health-start-period 60s --health-timeout 10s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
