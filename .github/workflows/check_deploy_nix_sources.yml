name: check deploy nix sources
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  check-deploy-nix-sources:
    name: check deploy nix sources
    runs-on: namespace-profile-linux-small;overrides.cache-tag=nix-checks
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount /nix cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: nix
        continue-on-error: true
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Check vendored patches in the deploy sources
        run: nix build --no-link -L .#checks.x86_64-linux.pruned-deploy-src-vendored-patches
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
