      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: fmt
      run: cargo fmt --check
    - name: clippy
      run: |
        set -euo pipefail

        # Mirrors run_tests.sh package selection so clippy only lints the crates this
        # PR can actually affect. `all` keeps the historical workspace invocation,
        # including sync_service's special-cased feature set.

        packages="${RUST_PACKAGES:-}"

        clippy_sync_service() {
          cargo clippy -p sync_service -- \
            -A clippy::unnecessary_map_or \
            -A clippy::collapsible_if
        }

        if [ -z "$packages" ] || [ "$packages" = "all" ]; then
          cargo clippy --workspace --all-features --exclude sync_service
          clippy_sync_service
          exit 0
        fi

        if [ "$packages" = "none" ]; then
          echo "No Rust packages to lint"
          exit 0
        fi

        sync=false
        pkg_args=()
        for p in $packages; do
          if [ "$p" = "sync_service" ]; then
            sync=true
          else
            pkg_args+=(-p "$p")
          fi
        done

        if [ "${#pkg_args[@]}" -gt 0 ]; then
          cargo clippy --all-features "${pkg_args[@]}"
        fi

        if [ "$sync" = true ]; then
          clippy_sync_service
        fi
      env:
        RUST_PACKAGES: ${{ needs.path-check.outputs.rust_packages }}
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  doppler-config:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true' && github.event.pull_request.draft == false && needs.path-check.outputs.doppler_candidates == 'true'
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    env:
      RUSTFLAGS: '-Dwarnings -Dclippy::disallowed_methods -C link-arg=-fuse-ld=mold'
      RUSTDOCFLAGS: '-Dwarnings'
      SQLX_OFFLINE: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
        fetch-depth: '2'
    - name: compute changed files
      run: |
        set -euo pipefail

        # Compare against the merge-base so a deleted file still appears. `--no-renames`
        # turns a rename into a delete+add pair so the old path is attributed to its
        # package (otherwise git reports only the new name).

        if [ -z "${GITHUB_BASE_REF:-}" ]; then
          compare_rev="$(git rev-parse HEAD~1)"
        else
          git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

          # The checkout holds only the PR merge commit and its two parents. Normally
          # the first parent is on the base branch, so the merge-base is immediate.
          # Stacked PRs can arrive with a merge commit built on another branch's tip;
          # deepen the PR side until its history reaches the base branch instead of
          # falling back to the full suite.
          compare_rev=""
          for deepen in 0 200 2000; do
            if [ "$deepen" -gt 0 ]; then
              echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
              git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
            fi
            if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
              break
            fi
            compare_rev=""
          done

          if [ -z "$compare_rev" ]; then
            echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
            : > /tmp/changed-files
            exit 0
          fi
        fi

        printf '%s\n' "$compare_rev" > /tmp/base-revision
        git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
      shell: bash
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
