# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/code_check_cloud_storage.rs
name: cloud storage code check
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: limited
  CARGO_PROFILE_TEST_DEBUG: limited
  RUST_BACKTRACE: '1'
  RUSTFLAGS: -C link-arg=-fuse-ld=lld
on:
  workflow_call: {}
jobs:
  path-check:
    runs-on: namespace-profile-linux-small;overrides.cache-tag=sccache-ci
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      doppler_candidates: ${{ steps.filter.outputs.doppler_candidates }}
      query_data: ${{ steps.filter.outputs.query_data }}
      graphql_schema: ${{ steps.filter.outputs.graphql_schema }}
      rust_packages: ${{ steps.nextest-filter.outputs.rust_packages }}
      skip_tests: ${{ steps.nextest-filter.outputs.skip_tests }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
          fetch-depth: '2'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          sccache: 'false'
          rust-cache: 'false'
      - id: filter
        name: Filter changed paths
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          filters: |
            should_run:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Cross.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - '.sqlx/**'
              - 'crates/**'
              - 'services/**'
              - 'tooling/xtask/**'
              - 'static_assets/**'
              - 'nix/**'
              - 'nix-support/node_modules*'
              - 'flake.nix'
              - 'flake.lock'
              - 'bun.lock'
              - 'packages/sdk/**'
              - 'packages/sdk-docs/**'
              - 'packages/code-mode-sdk/**'
              - '.github/actions/setup-nix/**'
              - '.github/actions/setup-nix-dev-shell/**'
              - '.github/actions/teardown-nix/**'
              - '.github/actions/setup-sccache/**'
              - '.github/services-config.json'
              - .github/workflows/code_check_cloud_storage.yml
            doppler_candidates:
              - '.github/services-config.json'
              - '**/src/config.rs'
              - '**/src/doppler_config.rs'
              - '**/Cargo.toml'
              - 'tooling/xtask/crates/xtask_doppler_bins/**'
              - .github/workflows/code_check_cloud_storage.yml
            graphql_schema:
              - 'static_assets/schema.graphql'
              - 'tooling/xtask/crates/xtask_graphql_schema_compat/**'
              - .github/workflows/code_check_cloud_storage.yml
            query_data:
              - '**/.sqlx/**'
      - name: compute changed files
        if: steps.filter.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          # Compare against the merge-base so a deleted file still appears. `--no-renames`
          # turns a rename into a delete+add pair so the old path is attributed to its
          # package (otherwise git reports only the new name).

          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            compare_rev="$(git rev-parse HEAD~1)"
          else
            git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

            # The checkout holds only the PR merge commit and its two parents. Normally
            # the first parent is on the base branch, so the merge-base is immediate.
            # Stacked PRs can arrive with a merge commit built on another branch's tip;
            # deepen the PR side until its history reaches the base branch instead of
            # falling back to the full suite.
            compare_rev=""
            for deepen in 0 200 2000; do
              if [ "$deepen" -gt 0 ]; then
                echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
                git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
              fi
              if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
                break
              fi
              compare_rev=""
            done

            if [ -z "$compare_rev" ]; then
              echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
              : > /tmp/changed-files
              exit 0
            fi
          fi

          printf '%s\n' "$compare_rev" > /tmp/base-revision
          git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
        shell: bash
      - name: Mount nextest-filter and cargo registry cache
        if: steps.filter.outputs.should_run == 'true' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          path: |-
            /home/runner/.cache/macro-nextest-filter
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
        continue-on-error: true
      - name: Configure Namespace remote sccache
        if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          set -euo pipefail
          env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
          trap 'rm -f "$env_file"' EXIT
          if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
            # Register credential values as masked BEFORE exporting: GitHub only
            # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
            # ~24h Namespace workspace token (registry + cache write) — printed
            # verbatim in every subsequent step's env dump. Masking is selective by
            # key name: masking non-secrets like the endpoint URL or key prefix
            # would redact those strings everywhere in the logs.
            while IFS= read -r line; do
              k="${line%%=*}"
              v="${line#*=}"
              [ -n "$v" ] && [ "$k" != "$line" ] || continue
              case "$k" in
                *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
              esac
            done < "$env_file"
            cat "$env_file" >> "$GITHUB_ENV"
            # The server checks the WebDAV backend before it reports ready, and the
            # client's default 10s wait can run out. This limit has no env var.
            sccache_conf="$RUNNER_TEMP/sccache.toml"
            echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
            echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
            # Force the next compiler invocation to start a server with the new remote
            # backend even if a setup hook happened to launch one already.
            sccache --stop-server >/dev/null 2>&1 || true
          else
            echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
          fi
      - id: nextest-filter
        name: compute nextest package filter
        if: steps.filter.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          # Writes for the check/test jobs:
          #   rust_packages — all | none | space-separated packages (changed + reverse deps)
          #   skip_tests    — true keeps clippy on rust_packages while the live-Postgres
          #                   test job stays skipped (`.sqlx`-only or clippy.toml-only diffs)
          #
          # Toolchain and cargo/nextest config edits force `all`. Root Cargo.toml and
          # Cargo.lock go to the xtask: determinator's old/new graph comparison scopes
          # lockfile, member, and workspace-dependency changes, and the xtask returns
          # `all` for any other root-manifest edit (profiles, lints, patches, …).
          # Cross.toml and deny.toml configure other tools and select nothing here.
          # clippy.toml changes lint results but not test outcomes (handled below).
          # flake.nix, the Nix shell action, and this workflow file used to live on the
          # full-suite list and turned every dev-shell tweak into a full-suite rebuild.

          # The filter runs as a release binary cached per source tree: a debug build
          # spends ~20 s in guppy on this runner, and compiling it took ~25 s more. The
          # key covers every input of the build. It lives in Namespace's remote cache, which
          # every runner sees, because a cache volume holds it on only some jobs. Forks have
          # no credentials for that cache and always build, in a plain scratch directory.
          filter_bin=""

          # The token goes through a config descriptor so it stays out of curl's arguments.
          filter_cache_request() {
            curl --fail --silent --show-error --max-time 30 --retry 2 \
              --config <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
          }

          # With no arguments a working filter exits non-zero and prints its usage. A corrupt
          # binary in the cache would otherwise fail path-check for every PR on that key.
          filter_bin_runs() {
            chmod +x "$filter_bin"
            case "$("$filter_bin" 2>&1 || true)" in
              *usage:*) return 0 ;;
              *) return 1 ;;
            esac
          }

          ensure_filter_bin() {
            [ -n "$filter_bin" ] && return 0
            local key cache_url=""
            key="$(git rev-parse \
              HEAD:tooling/xtask/crates/xtask_nextest_filter \
              HEAD:tooling/xtask/crates/xtask_graph \
              HEAD:tooling/xtask/crates/xtask_paths \
              HEAD:Cargo.lock \
              HEAD:Cargo.toml \
              HEAD:rust-toolchain.toml | sha256sum | cut -c1-16)"
            filter_bin="$RUNNER_TEMP/xtask_nextest_filter-$key"

            if [ -n "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
              cache_url="$SCCACHE_WEBDAV_ENDPOINT/nextest-filter/$key"
              if filter_cache_request --output "$filter_bin" "$cache_url" && filter_bin_runs; then
                echo "Using cached nextest-filter build $key"
                return 0
              fi
            fi

            echo "Building nextest-filter $key"
            CARGO_TARGET_DIR="$FILTER_CACHE_DIR/target" \
              cargo build --release --locked --quiet -p xtask_nextest_filter
            cp "$FILTER_CACHE_DIR/target/release/xtask_nextest_filter" "$filter_bin"

            # Losing the upload costs the next job a rebuild, not a failure.
            if [ -n "$cache_url" ]; then
              filter_cache_request --upload-file "$filter_bin" "$cache_url" \
                || echo "::warning::Could not save the nextest filter to the remote cache"
            fi
          }

          emit() {
            echo "rust_packages=$1" >> "$GITHUB_OUTPUT"
            echo "skip_tests=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ ! -s /tmp/changed-files ]; then
            echo "Unknown or empty change set; running all tests"
            emit all false
          fi

          if grep -qE '^(rust-toolchain\.toml|\.cargo/.*|\.config/.*)$' /tmp/changed-files; then
            echo "Toolchain or cargo config change detected; running all tests"
            emit all false
          fi

          clippy_config_changed=false
          if grep -qx 'clippy\.toml' /tmp/changed-files; then
            clippy_config_changed=true
          fi

          # The test job compiles queries against live Postgres (SQLX_OFFLINE is unset
          # there), so `.sqlx` contents cannot change test outcomes. Clippy is the
          # offline SQLx check (`SQLX_OFFLINE=true`), so a snapshot-only diff must
          # still compile against the cache rather than skip the check job.
          if ! grep -qvE '^\.sqlx/' /tmp/changed-files; then
            echo "Only .sqlx changes detected; clippy all, skip live-Postgres tests"
            emit all true
          fi

          ensure_filter_bin

          # cargo metadata takes ~15 s on its first run on this runner and ~1 s after, so its
          # output is saved per manifest state. The key covers every input of that output; the
          # filter ignores the file when the change set can alter the graph.
          metadata_file="$RUNNER_TEMP/cargo-metadata.json"
          metadata_url=""
          metadata_restored=false
          if [ -n "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
            metadata_key="$( { pwd; git ls-files --stage -- Cargo.lock rust-toolchain.toml ':(glob)**/Cargo.toml'; } | sha256sum | cut -c1-16)"
            metadata_url="$SCCACHE_WEBDAV_ENDPOINT/nextest-filter/metadata-$metadata_key.json.gz"
            if filter_cache_request "$metadata_url" 2>/dev/null | gunzip > "$metadata_file"; then
              metadata_restored=true
              echo "Using saved cargo metadata $metadata_key"
            else
              rm -f "$metadata_file"
            fi
          fi

          packages="$("$filter_bin" /tmp/changed-files "$(< /tmp/base-revision)" "$metadata_file")"

          # Losing the upload costs the next job about 15 s, not a failure.
          if [ -n "$metadata_url" ] && [ "$metadata_restored" = false ] && [ -f "$metadata_file" ]; then
            gzip < "$metadata_file" | filter_cache_request --upload-file - "$metadata_url" \
              || echo "::warning::Could not save cargo metadata to the remote cache"
          fi

          # One package list drives both clippy and tests, so a clippy.toml edit can
          # only skip tests when nothing else selected a package.
          if [ "$clippy_config_changed" = true ]; then
            if [ -z "$packages" ] || [ "$packages" = "none" ]; then
              echo "Only clippy.toml affects Rust; clippy all, skip live-Postgres tests"
              emit all true
            fi
            echo "clippy.toml changed alongside package changes; running all tests"
            emit all false
          fi

          if [ -z "$packages" ] || [ "$packages" = "none" ]; then
            echo "No package-specific Rust changes detected; running no tests"
            emit none false
          fi

          echo "rust packages: $packages"
          emit "$packages" false
        shell: bash
        env:
          FILTER_CACHE_DIR: /home/runner/.cache/macro-nextest-filter
  check:
    needs:
      - path-check
    if: needs.path-check.outputs.should_run == 'true'
    runs-on: namespace-profile-linux-large-build;overrides.cache-tag=sccache-ci
    env:
      CARGO_TARGET_REBUILD_ALL: ${{ needs.path-check.outputs.query_data == 'true' && 'the pull request changes query data' || '' }}
      RUSTFLAGS: -Dwarnings -Dclippy::disallowed_methods -C link-arg=-fuse-ld=mold
      RUSTDOCFLAGS: -Dwarnings
      SQLX_OFFLINE: 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Mount Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          path: |-
            /nix
            ./target
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            /home/runner/.cargo/.global-cache
        continue-on-error: true
      - name: Reuse the kept cargo target
        run: |
          node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
          // Lets cargo reuse the `target` directory a CI job keeps on its cache
          // volume. Cargo counts a workspace crate as built when none of its
          // sources is newer than its last build, and a checkout stamps every file with
          // the current time, so without this every workspace crate rebuilds.
          //
          // The volume keeps, next to `target`, the time each tracked path's current
          // contents were first seen (`RECORD`). A path whose mode and object match the
          // record keeps that time; a changed or added path, and every directory above a
          // change (its tree object changes), gets the current time. A build made while
          // the contents were what they are now is newer than that time and stays fresh.
          // A build of other contents is older than it: units only an earlier, different
          // build left behind (other features, other dependencies) rebuild too.
          //
          // Some changes cargo can't see:
          // - sqlx reads `.sqlx` query data without telling rustc. A new query's data
          //   comes with the query's new source, so only changed data dates every path
          //   now and rebuilds every workspace crate. Removed data is not: another
          //   pull request's query, missing from this tree, is the common case. A job
          //   rebuilds everything when its own pull request changes data (see
          //   `CARGO_TARGET_REBUILD_ALL` below); data that the base branch removed while
          //   an unchanged query still needs it fails only a full build.
          // - rustc lists the file a symlink pointed to when it built, so a symlink that
          //   changed, appeared or went away dates the files it pointed to, before and
          //   after, now. A link is resolved by its text alone: one through another
          //   symlinked directory, or out of the repository, dates nothing.
          // Migrations need nothing here: `sqlx::migrate!` includes each file and
          // `macro_db_migrator`'s build script watches the directory. A build that checks
          // queries against a live database depends on the schema too; Cloud Storage's
          // test job dates those crates itself.
          //
          // A job sets `CARGO_TARGET_REBUILD_ALL` to a reason to rebuild every workspace
          // crate anyway: Cloud Storage's jobs do when the pull request changes query
          // data.
          //
          // Units dated after now (another clock, or anything else writing `target`)
          // would look fresh against every change, so `target` starts over then.
          //
          // A job that builds into `target` without dating its checkout first (one whose
          // workflow predates this step, or a re-run of one) leaves units the record
          // doesn't describe. So the last step of a job that did date it writes `SEAL`,
          // and a unit newer than the seal rebuilds every workspace crate.
          //
          // It runs on a fresh checkout: it dates the index, not the work tree.

          import { execFileSync } from "node:child_process";
          import {
          	existsSync,
          	lutimesSync,
          	mkdirSync,
          	readdirSync,
          	readFileSync,
          	readlinkSync,
          	rmSync,
          	statfsSync,
          	statSync,
          	writeFileSync,
          } from "node:fs";
          import { dirname, join, posix } from "node:path";

          export const TARGET = "target";
          export const RECORD = `${TARGET}/.macro-source-times`;
          // Written by the last step of a job that dated its checkout; a unit newer than
          // it was built by a job that did not.
          export const SEAL = `${TARGET}/.macro-sealed`;
          // Dependency upgrades leave old artifacts in `target`; start over if the volume
          // is nearly full. Namespace grows a volume as it fills (about 97 GB free at any
          // use, up to 100 GB used), so this guards a full disk, not the volume's size.
          const MIN_FREE_BYTES = 20 * 1024 ** 3;
          const SYMLINK = "120000 ";
          // Directories under a profile that hold build outputs, not more profiles.
          const UNIT_OUTPUTS = new Set(["deps", "incremental", "examples", "doc"]);

          /** Path to `<mode> <type> <object>`. */
          export type Tree = Map<string, string>;
          /** Path to its signature and the time (seconds) those contents were first seen. */
          export type SourceTimes = Map<string, { signature: string; time: number }>;

          export type Plan = {
          	/** What to date each tracked path, and to keep for the next run. */
          	record: SourceTimes;
          	changed: number;
          	/** Why every path is dated now, when it is. */
          	rebuildAll?: string;
          };

          /** `git ls-tree -r -t -z` output. */
          export function parseTree(output: string): Tree {
          	const tree: Tree = new Map();
          	for (const entry of output.split("\0")) {
          		const tab = entry.indexOf("\t");
          		if (tab > 0) tree.set(entry.slice(tab + 1), entry.slice(0, tab));
          	}
          	return tree;
          }

          export function parseRecord(text: string): SourceTimes {
          	const record: SourceTimes = new Map();
          	for (const entry of text.split("\0")) {
          		const tab = entry.indexOf("\t");
          		const space = entry.indexOf(" ");
          		if (tab < 0 || space < 0 || space > tab) continue;
          		record.set(entry.slice(tab + 1), {
          			time: Number(entry.slice(0, space)),
          			signature: entry.slice(space + 1, tab),
          		});
          	}
          	return record;
          }

          export function formatRecord(record: SourceTimes): string {
          	return [...record]
          		.map(([path, { time, signature }]) => `${time} ${signature}\t${path}\0`)
          		.join("");
          }

          /** A symlink's signature carries what it points to, which the next run needs. */
          function signatureOf(mode: string, link: string | undefined): string {
          	return link === undefined ? mode : `${mode} ${JSON.stringify(link)}`;
          }

          /** The repository path a symlink at `path` resolves to, when it stays inside. */
          function linkTarget(path: string, signature: string): string | undefined {
          	if (!signature.startsWith(SYMLINK)) return;
          	const quoted = signature.indexOf(' "');
          	if (quoted < 0) return;
          	const target = posix.normalize(
          		posix.join(posix.dirname(path), JSON.parse(signature.slice(quoted + 1))),
          	);
          	return target.startsWith("../") || posix.isAbsolute(target)
          		? undefined
          		: target;
          }

          /** `links` holds what each tracked symlink in `tree` points to. */
          export function plan(
          	previous: SourceTimes | undefined,
          	tree: Tree,
          	links: Map<string, string>,
          	now: number,
          	forced?: string,
          ): Plan {
          	const record: SourceTimes = new Map();
          	const linkedTo = new Set<string>();
          	const linked = (path: string, signature: string) => {
          		const target = linkTarget(path, signature);
          		if (target !== undefined) linkedTo.add(target);
          	};
          	let changed = 0;
          	let rebuildAll =
          		forced || (previous ? undefined : "no record of earlier builds");
          	for (const [path, mode] of tree) {
          		const signature = signatureOf(mode, links.get(path));
          		const before = previous?.get(path);
          		if (before?.signature === signature) {
          			record.set(path, before);
          			continue;
          		}
          		changed++;
          		record.set(path, { signature, time: now });
          		linked(path, signature);
          		if (before) linked(path, before.signature);
          		if (before && /(^|\/)\.sqlx\//.test(path)) {
          			rebuildAll ??= `${path} (sqlx query data) changed`;
          		}
          	}
          	for (const [path, { signature }] of previous ?? []) {
          		if (tree.has(path)) continue;
          		changed++;
          		linked(path, signature);
          	}
          	const targets = [...linkedTo];
          	for (const [path, { signature, time }] of record) {
          		const dated =
          			rebuildAll !== undefined ||
          			targets.some(
          				(target) => path === target || path.startsWith(`${target}/`),
          			);
          		if (dated && time !== now) record.set(path, { signature, time: now });
          	}
          	return { record, changed, rebuildAll };
          }

          function git(...args: string[]): string {
          	return execFileSync("git", args, { encoding: "utf8", maxBuffer: 1024 ** 3 });
          }

          /**
           * The newest time cargo compares sources against: a unit's fingerprint files
           * and, for a build script's `rerun-if-changed`, its `output`. Profiles sit in
           * `target/<profile>`, and deeper under another `CARGO_TARGET_DIR` inside it or
           * a `--target` triple (`target/cache-wasm/wasm32-unknown-unknown/release`).
           */
          function newestUnit(): number {
          	let newest = 0;
          	const consider = (path: string) => {
          		if (existsSync(path)) {
          			newest = Math.max(newest, statSync(path).mtimeMs / 1000);
          		}
          	};
          	const children = (dir: string) => (existsSync(dir) ? readdirSync(dir) : []);
          	const subdirectories = (dir: string) =>
          		existsSync(dir)
          			? readdirSync(dir, { withFileTypes: true })
          					.filter((entry) => entry.isDirectory())
          					.map((entry) => entry.name)
          			: [];
          	const walk = (dir: string, depth: number) => {
          		for (const name of subdirectories(dir)) {
          			const path = join(dir, name);
          			if (name === ".fingerprint") {
          				for (const unit of children(path)) {
          					for (const file of children(join(path, unit))) {
          						consider(join(path, unit, file));
          					}
          				}
          			} else if (name === "build") {
          				for (const unit of children(path)) consider(join(path, unit, "output"));
          			} else if (depth > 0 && !UNIT_OUTPUTS.has(name)) {
          				walk(path, depth - 1);
          			}
          		}
          	};
          	walk(TARGET, 3);
          	return newest;
          }

          function emptyTarget(why: string) {
          	console.log(`Emptying ${TARGET}: ${why}`);
          	for (const entry of readdirSync(TARGET))
          		rmSync(join(TARGET, entry), { recursive: true, force: true });
          }

          export async function main() {
          	const now = Date.now() / 1000;
          	mkdirSync(TARGET, { recursive: true });
          	const sealed = existsSync(SEAL) ? Number(readFileSync(SEAL, "utf8")) : 0;
          	rmSync(SEAL, { force: true });
          	const { bavail, bsize } = statfsSync(TARGET);
          	console.log(
          		`${Math.round((bavail * bsize) / 1024 ** 3)} GB free on the cache volume`,
          	);
          	const newest = newestUnit();
          	if (bavail * bsize < MIN_FREE_BYTES) {
          		emptyTarget("the cache volume is running out of space");
          	} else if (newest > now) {
          		emptyTarget("a unit in it is dated after now");
          	}

          	const tree = parseTree(
          		git("ls-tree", "-r", "-t", "-z", git("write-tree").trim()),
          	);
          	const links = new Map<string, string>();
          	for (const [path, mode] of tree) {
          		if (mode.startsWith(SYMLINK) && existsSync(dirname(path))) {
          			links.set(path, readlinkSync(path));
          		}
          	}
          	const previous = existsSync(RECORD)
          		? parseRecord(readFileSync(RECORD, "utf8"))
          		: undefined;
          	const { record, changed, rebuildAll } = plan(
          		previous,
          		tree,
          		links,
          		now,
          		process.env.CARGO_TARGET_REBUILD_ALL ||
          			(previous && !(newest <= sealed)
          				? "a job built into it without dating its checkout"
          				: undefined),
          	);
          	for (const [path, { time }] of record) {
          		try {
          			lutimesSync(path, time, time);
          		} catch (error) {
          			// Paths outside a sparse checkout are not in the work tree.
          			if ((error as NodeJS.ErrnoException).code !== "ENOENT") throw error;
          		}
          	}
          	writeFileSync(RECORD, formatRecord(record));
          	console.log(
          		rebuildAll
          			? `Every workspace crate rebuilds: ${rebuildAll}`
          			: `Reusing ${TARGET}: ${changed} paths differ from the last run`,
          	);
          }

          /** The last step of a job that ran `main`: every unit it built is older than this. */
          export async function seal() {
          	writeFileSync(SEAL, String(Date.now() / 1000));
          	console.log(`Sealed ${TARGET} for the next run`);
          }

          await main();
          NODE_SCRIPT
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          seed-cache: sccache-ci
      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell
        timeout-minutes: 15
      - name: Configure Namespace remote sccache
        if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          set -euo pipefail
          env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
          trap 'rm -f "$env_file"' EXIT
          if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
            # Register credential values as masked BEFORE exporting: GitHub only
            # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
            # ~24h Namespace workspace token (registry + cache write) — printed
            # verbatim in every subsequent step's env dump. Masking is selective by
            # key name: masking non-secrets like the endpoint URL or key prefix
            # would redact those strings everywhere in the logs.
            while IFS= read -r line; do
              k="${line%%=*}"
              v="${line#*=}"
              [ -n "$v" ] && [ "$k" != "$line" ] || continue
              case "$k" in
                *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
              esac
            done < "$env_file"
            cat "$env_file" >> "$GITHUB_ENV"
            # The server checks the WebDAV backend before it reports ready, and the
            # client's default 10s wait can run out. This limit has no env var.
            sccache_conf="$RUNNER_TEMP/sccache.toml"
            echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
            echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
            # Force the next compiler invocation to start a server with the new remote
            # backend even if a setup hook happened to launch one already.
            sccache --stop-server >/dev/null 2>&1 || true
          else
            echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
          fi
      - name: Build code-mode assets
        run: |
          set -euo pipefail

          # Build the code-mode assets once per SDK state, not once per job. Cache volumes
          # are forks of past jobs, so most jobs miss the store path another job just built.
          # The key is the store path, which covers every input of the build.
          assets="$(nix eval --raw .#code-mode-assets.outPath)"
          echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

          if nix-store --check-validity "$assets" 2>/dev/null; then
            echo "Code-mode assets already in the store"
            exit 0
          fi

          # Forks have no remote cache credentials.
          if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
            nix build --no-link --print-build-logs .#code-mode-assets
            exit 0
          fi

          cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

          # The token goes through a config descriptor so it stays out of curl's arguments.
          cache_request() {
            curl --fail --silent --show-error --max-time 30 --retry 2 \
              -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
          }

          if cache_request "$cache_url" | gunzip | nix-store --import; then
            echo "Code-mode assets restored from the remote cache"
            exit 0
          fi

          # Installing node_modules is most of a build and changes far less often than the SDK,
          # so it has its own entry.
          modules="$(nix eval --raw .#macro-js-node-modules.outPath)"
          modules_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$modules").zst"
          save_modules=false

          if ! nix-store --check-validity "$modules" 2>/dev/null; then
            # No retries: a retry would restart the stream into the same pipe, and past the limit
            # a rebuild is faster.
            if cache_request --retry 0 --max-time 60 "$modules_url" | zstd -d | nix-store --import; then
              echo "node_modules restored from the remote cache"
            else
              save_modules=true
            fi
          fi

          nix build --no-link --print-build-logs .#code-mode-assets

          if [ "$save_modules" = true ] \
            && ! nix-store --export "$modules" | zstd -T0 -3 | cache_request --max-time 120 --upload-file - "$modules_url"; then
            echo "::warning::Could not save node_modules to the remote cache"
          fi

          # Losing the upload costs the next job a rebuild, not a failure.
          if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
            echo "Code-mode assets saved to the remote cache"
          else
            echo "::warning::Could not save code-mode assets to the remote cache"
          fi
      - name: fmt
        run: cargo fmt --check
      - name: unused dependencies
        run: cargo shear --format github
      - name: clippy
        run: |
          set -euo pipefail

          # Mirrors run_tests.sh package selection so clippy only lints the crates this
          # PR can actually affect. `all` keeps the historical workspace invocation,
          # including sync_service's special-cased feature set.

          packages="${RUST_PACKAGES:-}"

          clippy_sync_service() {
            cargo clippy -p sync_service -- \
              -A clippy::unnecessary_map_or \
              -A clippy::collapsible_if
          }

          # Most of soup's dependents build it without `outbound` (no features, or
          # `ports` alone), where helpers only the service or the Postgres repository
          # call are dead code that --all-features hides.
          clippy_soup_without_outbound() {
            cargo clippy -p soup --no-default-features
            cargo clippy -p soup --no-default-features --features ports
          }

          if [ -z "$packages" ] || [ "$packages" = "all" ]; then
            cargo clippy --workspace --all-features --exclude sync_service
            clippy_sync_service
            clippy_soup_without_outbound
            exit 0
          fi

          if [ "$packages" = "none" ]; then
            echo "No Rust packages to lint"
            exit 0
          fi

          sync=false
          soup=false
          pkg_args=()
          for p in $packages; do
            if [ "$p" = "sync_service" ]; then
              sync=true
            else
              pkg_args+=(-p "$p")
            fi
            if [ "$p" = "soup" ]; then
              soup=true
            fi
          done

          if [ "${#pkg_args[@]}" -gt 0 ]; then
            cargo clippy --all-features "${pkg_args[@]}"
          fi

          if [ "$sync" = true ]; then
            clippy_sync_service
          fi

          if [ "$soup" = true ]; then
            clippy_soup_without_outbound
          fi
        env:
          RUST_PACKAGES: ${{ needs.path-check.outputs.rust_packages }}
      - name: show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
      - name: Seal the kept cargo target
        run: |
          node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
          // Lets cargo reuse the `target` directory a CI job keeps on its cache
          // volume. Cargo counts a workspace crate as built when none of its
          // sources is newer than its last build, and a checkout stamps every file with
          // the current time, so without this every workspace crate rebuilds.
          //
          // The volume keeps, next to `target`, the time each tracked path's current
          // contents were first seen (`RECORD`). A path whose mode and object match the
          // record keeps that time; a changed or added path, and every directory above a
          // change (its tree object changes), gets the current time. A build made while
          // the contents were what they are now is newer than that time and stays fresh.
          // A build of other contents is older than it: units only an earlier, different
          // build left behind (other features, other dependencies) rebuild too.
          //
          // Some changes cargo can't see:
          // - sqlx reads `.sqlx` query data without telling rustc. A new query's data
          //   comes with the query's new source, so only changed data dates every path
          //   now and rebuilds every workspace crate. Removed data is not: another
          //   pull request's query, missing from this tree, is the common case. A job
          //   rebuilds everything when its own pull request changes data (see
          //   `CARGO_TARGET_REBUILD_ALL` below); data that the base branch removed while
          //   an unchanged query still needs it fails only a full build.
          // - rustc lists the file a symlink pointed to when it built, so a symlink that
          //   changed, appeared or went away dates the files it pointed to, before and
          //   after, now. A link is resolved by its text alone: one through another
          //   symlinked directory, or out of the repository, dates nothing.
          // Migrations need nothing here: `sqlx::migrate!` includes each file and
          // `macro_db_migrator`'s build script watches the directory. A build that checks
          // queries against a live database depends on the schema too; Cloud Storage's
          // test job dates those crates itself.
          //
          // A job sets `CARGO_TARGET_REBUILD_ALL` to a reason to rebuild every workspace
          // crate anyway: Cloud Storage's jobs do when the pull request changes query
          // data.
          //
          // Units dated after now (another clock, or anything else writing `target`)
          // would look fresh against every change, so `target` starts over then.
          //
          // A job that builds into `target` without dating its checkout first (one whose
          // workflow predates this step, or a re-run of one) leaves units the record
          // doesn't describe. So the last step of a job that did date it writes `SEAL`,
          // and a unit newer than the seal rebuilds every workspace crate.
          //
          // It runs on a fresh checkout: it dates the index, not the work tree.

          import { execFileSync } from "node:child_process";
          import {
          	existsSync,
          	lutimesSync,
          	mkdirSync,
          	readdirSync,
          	readFileSync,
          	readlinkSync,
          	rmSync,
          	statfsSync,
          	statSync,
          	writeFileSync,
          } from "node:fs";
          import { dirname, join, posix } from "node:path";

          export const TARGET = "target";
          export const RECORD = `${TARGET}/.macro-source-times`;
          // Written by the last step of a job that dated its checkout; a unit newer than
          // it was built by a job that did not.
          export const SEAL = `${TARGET}/.macro-sealed`;
          // Dependency upgrades leave old artifacts in `target`; start over if the volume
          // is nearly full. Namespace grows a volume as it fills (about 97 GB free at any
          // use, up to 100 GB used), so this guards a full disk, not the volume's size.
          const MIN_FREE_BYTES = 20 * 1024 ** 3;
          const SYMLINK = "120000 ";
          // Directories under a profile that hold build outputs, not more profiles.
          const UNIT_OUTPUTS = new Set(["deps", "incremental", "examples", "doc"]);

          /** Path to `<mode> <type> <object>`. */
          export type Tree = Map<string, string>;
          /** Path to its signature and the time (seconds) those contents were first seen. */
          export type SourceTimes = Map<string, { signature: string; time: number }>;

          export type Plan = {
          	/** What to date each tracked path, and to keep for the next run. */
          	record: SourceTimes;
          	changed: number;
          	/** Why every path is dated now, when it is. */
          	rebuildAll?: string;
          };

          /** `git ls-tree -r -t -z` output. */
          export function parseTree(output: string): Tree {
          	const tree: Tree = new Map();
          	for (const entry of output.split("\0")) {
          		const tab = entry.indexOf("\t");
          		if (tab > 0) tree.set(entry.slice(tab + 1), entry.slice(0, tab));
          	}
          	return tree;
          }

          export function parseRecord(text: string): SourceTimes {
          	const record: SourceTimes = new Map();
          	for (const entry of text.split("\0")) {
          		const tab = entry.indexOf("\t");
          		const space = entry.indexOf(" ");
          		if (tab < 0 || space < 0 || space > tab) continue;
          		record.set(entry.slice(tab + 1), {
          			time: Number(entry.slice(0, space)),
          			signature: entry.slice(space + 1, tab),
          		});
          	}
          	return record;
          }

          export function formatRecord(record: SourceTimes): string {
          	return [...record]
          		.map(([path, { time, signature }]) => `${time} ${signature}\t${path}\0`)
          		.join("");
          }

          /** A symlink's signature carries what it points to, which the next run needs. */
          function signatureOf(mode: string, link: string | undefined): string {
          	return link === undefined ? mode : `${mode} ${JSON.stringify(link)}`;
          }

          /** The repository path a symlink at `path` resolves to, when it stays inside. */
          function linkTarget(path: string, signature: string): string | undefined {
          	if (!signature.startsWith(SYMLINK)) return;
          	const quoted = signature.indexOf(' "');
          	if (quoted < 0) return;
          	const target = posix.normalize(
          		posix.join(posix.dirname(path), JSON.parse(signature.slice(quoted + 1))),
          	);
          	return target.startsWith("../") || posix.isAbsolute(target)
          		? undefined
          		: target;
          }

          /** `links` holds what each tracked symlink in `tree` points to. */
          export function plan(
          	previous: SourceTimes | undefined,
          	tree: Tree,
          	links: Map<string, string>,
          	now: number,
          	forced?: string,
          ): Plan {
          	const record: SourceTimes = new Map();
          	const linkedTo = new Set<string>();
          	const linked = (path: string, signature: string) => {
          		const target = linkTarget(path, signature);
          		if (target !== undefined) linkedTo.add(target);
          	};
          	let changed = 0;
          	let rebuildAll =
          		forced || (previous ? undefined : "no record of earlier builds");
          	for (const [path, mode] of tree) {
          		const signature = signatureOf(mode, links.get(path));
          		const before = previous?.get(path);
          		if (before?.signature === signature) {
          			record.set(path, before);
          			continue;
          		}
          		changed++;
          		record.set(path, { signature, time: now });
          		linked(path, signature);
          		if (before) linked(path, before.signature);
          		if (before && /(^|\/)\.sqlx\//.test(path)) {
          			rebuildAll ??= `${path} (sqlx query data) changed`;
          		}
          	}
          	for (const [path, { signature }] of previous ?? []) {
          		if (tree.has(path)) continue;
          		changed++;
          		linked(path, signature);
          	}
          	const targets = [...linkedTo];
          	for (const [path, { signature, time }] of record) {
          		const dated =
          			rebuildAll !== undefined ||
          			targets.some(
          				(target) => path === target || path.startsWith(`${target}/`),
          			);
          		if (dated && time !== now) record.set(path, { signature, time: now });
          	}
          	return { record, changed, rebuildAll };
          }

          function git(...args: string[]): string {
          	return execFileSync("git", args, { encoding: "utf8", maxBuffer: 1024 ** 3 });
          }

          /**
           * The newest time cargo compares sources against: a unit's fingerprint files
           * and, for a build script's `rerun-if-changed`, its `output`. Profiles sit in
           * `target/<profile>`, and deeper under another `CARGO_TARGET_DIR` inside it or
           * a `--target` triple (`target/cache-wasm/wasm32-unknown-unknown/release`).
           */
          function newestUnit(): number {
          	let newest = 0;
          	const consider = (path: string) => {
          		if (existsSync(path)) {
          			newest = Math.max(newest, statSync(path).mtimeMs / 1000);
          		}
          	};
          	const children = (dir: string) => (existsSync(dir) ? readdirSync(dir) : []);
          	const subdirectories = (dir: string) =>
          		existsSync(dir)
          			? readdirSync(dir, { withFileTypes: true })
          					.filter((entry) => entry.isDirectory())
          					.map((entry) => entry.name)
          			: [];
          	const walk = (dir: string, depth: number) => {
          		for (const name of subdirectories(dir)) {
          			const path = join(dir, name);
          			if (name === ".fingerprint") {
          				for (const unit of children(path)) {
          					for (const file of children(join(path, unit))) {
          						consider(join(path, unit, file));
          					}
          				}
          			} else if (name === "build") {
          				for (const unit of children(path)) consider(join(path, unit, "output"));
          			} else if (depth > 0 && !UNIT_OUTPUTS.has(name)) {
          				walk(path, depth - 1);
          			}
          		}
          	};
          	walk(TARGET, 3);
          	return newest;
          }

          function emptyTarget(why: string) {
          	console.log(`Emptying ${TARGET}: ${why}`);
          	for (const entry of readdirSync(TARGET))
          		rmSync(join(TARGET, entry), { recursive: true, force: true });
          }

          export async function main() {
          	const now = Date.now() / 1000;
          	mkdirSync(TARGET, { recursive: true });
          	const sealed = existsSync(SEAL) ? Number(readFileSync(SEAL, "utf8")) : 0;
          	rmSync(SEAL, { force: true });
          	const { bavail, bsize } = statfsSync(TARGET);
          	console.log(
          		`${Math.round((bavail * bsize) / 1024 ** 3)} GB free on the cache volume`,
          	);
          	const newest = newestUnit();
          	if (bavail * bsize < MIN_FREE_BYTES) {
          		emptyTarget("the cache volume is running out of space");
          	} else if (newest > now) {
          		emptyTarget("a unit in it is dated after now");
          	}

          	const tree = parseTree(
          		git("ls-tree", "-r", "-t", "-z", git("write-tree").trim()),
          	);
          	const links = new Map<string, string>();
          	for (const [path, mode] of tree) {
          		if (mode.startsWith(SYMLINK) && existsSync(dirname(path))) {
          			links.set(path, readlinkSync(path));
          		}
          	}
          	const previous = existsSync(RECORD)
          		? parseRecord(readFileSync(RECORD, "utf8"))
          		: undefined;
          	const { record, changed, rebuildAll } = plan(
          		previous,
          		tree,
          		links,
          		now,
          		process.env.CARGO_TARGET_REBUILD_ALL ||
          			(previous && !(newest <= sealed)
          				? "a job built into it without dating its checkout"
          				: undefined),
          	);
          	for (const [path, { time }] of record) {
          		try {
          			lutimesSync(path, time, time);
          		} catch (error) {
          			// Paths outside a sparse checkout are not in the work tree.
          			if ((error as NodeJS.ErrnoException).code !== "ENOENT") throw error;
          		}
          	}
          	writeFileSync(RECORD, formatRecord(record));
          	console.log(
          		rebuildAll
          			? `Every workspace crate rebuilds: ${rebuildAll}`
          			: `Reusing ${TARGET}: ${changed} paths differ from the last run`,
          	);
          }

          /** The last step of a job that ran `main`: every unit it built is older than this. */
          export async function seal() {
          	writeFileSync(SEAL, String(Date.now() / 1000));
          	console.log(`Sealed ${TARGET} for the next run`);
          }

          await seal();
          NODE_SCRIPT
  doppler-config:
    needs:
      - path-check
    if: needs.path-check.outputs.should_run == 'true' && needs.path-check.outputs.doppler_candidates == 'true'
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    env:
      CARGO_TARGET_REBUILD_ALL: ${{ needs.path-check.outputs.query_data == 'true' && 'the pull request changes query data' || '' }}
      RUSTFLAGS: -Dwarnings -Dclippy::disallowed_methods -C link-arg=-fuse-ld=mold
      RUSTDOCFLAGS: -Dwarnings
      SQLX_OFFLINE: 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: 'false'
          persist-credentials: 'false'
          fetch-depth: '2'
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: compute changed files
        run: |
          set -euo pipefail

          # Compare against the merge-base so a deleted file still appears. `--no-renames`
          # turns a rename into a delete+add pair so the old path is attributed to its
          # package (otherwise git reports only the new name).

          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            compare_rev="$(git rev-parse HEAD~1)"
          else
            git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

            # The checkout holds only the PR merge commit and its two parents. Normally
            # the first parent is on the base branch, so the merge-base is immediate.
            # Stacked PRs can arrive with a merge commit built on another branch's tip;
            # deepen the PR side until its history reaches the base branch instead of
            # falling back to the full suite.
            compare_rev=""
            for deepen in 0 200 2000; do
              if [ "$deepen" -gt 0 ]; then
                echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
                git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
              fi
              if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
                break
              fi
              compare_rev=""
            done

            if [ -z "$compare_rev" ]; then
              echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
              : > /tmp/changed-files
              exit 0
            fi
          fi

          printf '%s\n' "$compare_rev" > /tmp/base-revision
          git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
        shell: bash
      - name: Mount Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          path: |-
            /nix
            ./target
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            /home/runner/.cargo/.global-cache
        continue-on-error: true
      - name: Reuse the kept cargo target
        run: |
          node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
          // Lets cargo reuse the `target` directory a CI job keeps on its cache
          // volume. Cargo counts a workspace crate as built when none of its
          // sources is newer than its last build, and a checkout stamps every file with
          // the current time, so without this every workspace crate rebuilds.
          //
          // The volume keeps, next to `target`, the time each tracked path's current
          // contents were first seen (`RECORD`). A path whose mode and object match the
          // record keeps that time; a changed or added path, and every directory above a
          // change (its tree object changes), gets the current time. A build made while
          // the contents were what they are now is newer than that time and stays fresh.
          // A build of other contents is older than it: units only an earlier, different
          // build left behind (other features, other dependencies) rebuild too.
          //
          // Some changes cargo can't see:
          // - sqlx reads `.sqlx` query data without telling rustc. A new query's data
          //   comes with the query's new source, so only changed data dates every path
          //   now and rebuilds every workspace crate. Removed data is not: another
          //   pull request's query, missing from this tree, is the common case. A job
          //   rebuilds everything when its own pull request changes data (see
          //   `CARGO_TARGET_REBUILD_ALL` below); data that the base branch removed while
          //   an unchanged query still needs it fails only a full build.
          // - rustc lists the file a symlink pointed to when it built, so a symlink that
          //   changed, appeared or went away dates the files it pointed to, before and
          //   after, now. A link is resolved by its text alone: one through another
          //   symlinked directory, or out of the repository, dates nothing.
          // Migrations need nothing here: `sqlx::migrate!` includes each file and
          // `macro_db_migrator`'s build script watches the directory. A build that checks
          // queries against a live database depends on the schema too; Cloud Storage's
          // test job dates those crates itself.
          //
          // A job sets `CARGO_TARGET_REBUILD_ALL` to a reason to rebuild every workspace
          // crate anyway: Cloud Storage's jobs do when the pull request changes query
          // data.
          //
          // Units dated after now (another clock, or anything else writing `target`)
          // would look fresh against every change, so `target` starts over then.
          //
          // A job that builds into `target` without dating its checkout first (one whose
          // workflow predates this step, or a re-run of one) leaves units the record
          // doesn't describe. So the last step of a job that did date it writes `SEAL`,
          // and a unit newer than the seal rebuilds every workspace crate.
          //
          // It runs on a fresh checkout: it dates the index, not the work tree.

          import { execFileSync } from "node:child_process";
          import {
          	existsSync,
          	lutimesSync,
          	mkdirSync,
          	readdirSync,
          	readFileSync,
          	readlinkSync,
          	rmSync,
          	statfsSync,
          	statSync,
          	writeFileSync,
          } from "node:fs";
          import { dirname, join, posix } from "node:path";

          export const TARGET = "target";
          export const RECORD = `${TARGET}/.macro-source-times`;
          // Written by the last step of a job that dated its checkout; a unit newer than
          // it was built by a job that did not.
          export const SEAL = `${TARGET}/.macro-sealed`;
          // Dependency upgrades leave old artifacts in `target`; start over if the volume
          // is nearly full. Namespace grows a volume as it fills (about 97 GB free at any
          // use, up to 100 GB used), so this guards a full disk, not the volume's size.
          const MIN_FREE_BYTES = 20 * 1024 ** 3;
          const SYMLINK = "120000 ";
          // Directories under a profile that hold build outputs, not more profiles.
          const UNIT_OUTPUTS = new Set(["deps", "incremental", "examples", "doc"]);

          /** Path to `<mode> <type> <object>`. */
          export type Tree = Map<string, string>;
          /** Path to its signature and the time (seconds) those contents were first seen. */
          export type SourceTimes = Map<string, { signature: string; time: number }>;

          export type Plan = {
          	/** What to date each tracked path, and to keep for the next run. */
          	record: SourceTimes;
          	changed: number;
          	/** Why every path is dated now, when it is. */
          	rebuildAll?: string;
          };

          /** `git ls-tree -r -t -z` output. */
          export function parseTree(output: string): Tree {
          	const tree: Tree = new Map();
          	for (const entry of output.split("\0")) {
          		const tab = entry.indexOf("\t");
          		if (tab > 0) tree.set(entry.slice(tab + 1), entry.slice(0, tab));
          	}
          	return tree;
          }

          export function parseRecord(text: string): SourceTimes {
          	const record: SourceTimes = new Map();
          	for (const entry of text.split("\0")) {
          		const tab = entry.indexOf("\t");
          		const space = entry.indexOf(" ");
          		if (tab < 0 || space < 0 || space > tab) continue;
          		record.set(entry.slice(tab + 1), {
          			time: Number(entry.slice(0, space)),
          			signature: entry.slice(space + 1, tab),
          		});
          	}
          	return record;
          }

          export function formatRecord(record: SourceTimes): string {
          	return [...record]
          		.map(([path, { time, signature }]) => `${time} ${signature}\t${path}\0`)
          		.join("");
          }

          /** A symlink's signature carries what it points to, which the next run needs. */
          function signatureOf(mode: string, link: string | undefined): string {
          	return link === undefined ? mode : `${mode} ${JSON.stringify(link)}`;
          }

          /** The repository path a symlink at `path` resolves to, when it stays inside. */
          function linkTarget(path: string, signature: string): string | undefined {
          	if (!signature.startsWith(SYMLINK)) return;
          	const quoted = signature.indexOf(' "');
          	if (quoted < 0) return;
          	const target = posix.normalize(
          		posix.join(posix.dirname(path), JSON.parse(signature.slice(quoted + 1))),
          	);
          	return target.startsWith("../") || posix.isAbsolute(target)
          		? undefined
          		: target;
          }

          /** `links` holds what each tracked symlink in `tree` points to. */
          export function plan(
          	previous: SourceTimes | undefined,
          	tree: Tree,
          	links: Map<string, string>,
          	now: number,
          	forced?: string,
          ): Plan {
          	const record: SourceTimes = new Map();
          	const linkedTo = new Set<string>();
          	const linked = (path: string, signature: string) => {
          		const target = linkTarget(path, signature);
          		if (target !== undefined) linkedTo.add(target);
          	};
          	let changed = 0;
          	let rebuildAll =
          		forced || (previous ? undefined : "no record of earlier builds");
          	for (const [path, mode] of tree) {
          		const signature = signatureOf(mode, links.get(path));
          		const before = previous?.get(path);
          		if (before?.signature === signature) {
          			record.set(path, before);
          			continue;
          		}
          		changed++;
          		record.set(path, { signature, time: now });
          		linked(path, signature);
          		if (before) linked(path, before.signature);
          		if (before && /(^|\/)\.sqlx\//.test(path)) {
          			rebuildAll ??= `${path} (sqlx query data) changed`;
          		}
          	}
          	for (const [path, { signature }] of previous ?? []) {
          		if (tree.has(path)) continue;
          		changed++;
          		linked(path, signature);
          	}
          	const targets = [...linkedTo];
          	for (const [path, { signature, time }] of record) {
          		const dated =
          			rebuildAll !== undefined ||
          			targets.some(
          				(target) => path === target || path.startsWith(`${target}/`),
          			);
          		if (dated && time !== now) record.set(path, { signature, time: now });
          	}
          	return { record, changed, rebuildAll };
          }

          function git(...args: string[]): string {
          	return execFileSync("git", args, { encoding: "utf8", maxBuffer: 1024 ** 3 });
          }

          /**
           * The newest time cargo compares sources against: a unit's fingerprint files
           * and, for a build script's `rerun-if-changed`, its `output`. Profiles sit in
           * `target/<profile>`, and deeper under another `CARGO_TARGET_DIR` inside it or
           * a `--target` triple (`target/cache-wasm/wasm32-unknown-unknown/release`).
           */
          function newestUnit(): number {
          	let newest = 0;
          	const consider = (path: string) => {
          		if (existsSync(path)) {
          			newest = Math.max(newest, statSync(path).mtimeMs / 1000);
          		}
          	};
          	const children = (dir: string) => (existsSync(dir) ? readdirSync(dir) : []);
          	const subdirectories = (dir: string) =>
          		existsSync(dir)
          			? readdirSync(dir, { withFileTypes: true })
          					.filter((entry) => entry.isDirectory())
          					.map((entry) => entry.name)
          			: [];
          	const walk = (dir: string, depth: number) => {
          		for (const name of subdirectories(dir)) {
          			const path = join(dir, name);
          			if (name === ".fingerprint") {
          				for (const unit of children(path)) {
          					for (const file of children(join(path, unit))) {
          						consider(join(path, unit, file));
          					}
          				}
          			} else if (name === "build") {
          				for (const unit of children(path)) consider(join(path, unit, "output"));
          			} else if (depth > 0 && !UNIT_OUTPUTS.has(name)) {
          				walk(path, depth - 1);
          			}
          		}
          	};
          	walk(TARGET, 3);
          	return newest;
          }

          function emptyTarget(why: string) {
          	console.log(`Emptying ${TARGET}: ${why}`);
          	for (const entry of readdirSync(TARGET))
          		rmSync(join(TARGET, entry), { recursive: true, force: true });
          }

          export async function main() {
          	const now = Date.now() / 1000;
          	mkdirSync(TARGET, { recursive: true });
          	const sealed = existsSync(SEAL) ? Number(readFileSync(SEAL, "utf8")) : 0;
          	rmSync(SEAL, { force: true });
          	const { bavail, bsize } = statfsSync(TARGET);
          	console.log(
          		`${Math.round((bavail * bsize) / 1024 ** 3)} GB free on the cache volume`,
          	);
          	const newest = newestUnit();
          	if (bavail * bsize < MIN_FREE_BYTES) {
          		emptyTarget("the cache volume is running out of space");
          	} else if (newest > now) {
          		emptyTarget("a unit in it is dated after now");
          	}

          	const tree = parseTree(
          		git("ls-tree", "-r", "-t", "-z", git("write-tree").trim()),
          	);
          	const links = new Map<string, string>();
          	for (const [path, mode] of tree) {
          		if (mode.startsWith(SYMLINK) && existsSync(dirname(path))) {
          			links.set(path, readlinkSync(path));
          		}
          	}
          	const previous = existsSync(RECORD)
          		? parseRecord(readFileSync(RECORD, "utf8"))
          		: undefined;
          	const { record, changed, rebuildAll } = plan(
          		previous,
          		tree,
          		links,
          		now,
          		process.env.CARGO_TARGET_REBUILD_ALL ||
          			(previous && !(newest <= sealed)
          				? "a job built into it without dating its checkout"
          				: undefined),
          	);
          	for (const [path, { time }] of record) {
          		try {
          			lutimesSync(path, time, time);
          		} catch (error) {
          			// Paths outside a sparse checkout are not in the work tree.
          			if ((error as NodeJS.ErrnoException).code !== "ENOENT") throw error;
          		}
          	}
          	writeFileSync(RECORD, formatRecord(record));
          	console.log(
          		rebuildAll
          			? `Every workspace crate rebuilds: ${rebuildAll}`
          			: `Reusing ${TARGET}: ${changed} paths differ from the last run`,
          	);
          }

          /** The last step of a job that ran `main`: every unit it built is older than this. */
          export async function seal() {
          	writeFileSync(SEAL, String(Date.now() / 1000));
          	console.log(`Sealed ${TARGET} for the next run`);
          }

          await main();
          NODE_SCRIPT
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          seed-cache: sccache-ci
      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell
        timeout-minutes: 15
      - name: Configure Namespace remote sccache
        if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          set -euo pipefail
          env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
          trap 'rm -f "$env_file"' EXIT
          if nsc cache sccache setup --cache_name sccache-ci > "$env_file"; then
            # Register credential values as masked BEFORE exporting: GitHub only
            # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
            # ~24h Namespace workspace token (registry + cache write) — printed
            # verbatim in every subsequent step's env dump. Masking is selective by
            # key name: masking non-secrets like the endpoint URL or key prefix
            # would redact those strings everywhere in the logs.
            while IFS= read -r line; do
              k="${line%%=*}"
              v="${line#*=}"
              [ -n "$v" ] && [ "$k" != "$line" ] || continue
              case "$k" in
                *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
              esac
            done < "$env_file"
            cat "$env_file" >> "$GITHUB_ENV"
            # The server checks the WebDAV backend before it reports ready, and the
            # client's default 10s wait can run out. This limit has no env var.
            sccache_conf="$RUNNER_TEMP/sccache.toml"
            echo 'server_startup_timeout_ms = 60000' > "$sccache_conf"
            echo "SCCACHE_CONF=$sccache_conf" >> "$GITHUB_ENV"
            # Force the next compiler invocation to start a server with the new remote
            # backend even if a setup hook happened to launch one already.
            sccache --stop-server >/dev/null 2>&1 || true
          else
            echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
          fi
      - name: Build code-mode assets
        run: |
          set -euo pipefail

          # Build the code-mode assets once per SDK state, not once per job. Cache volumes
          # are forks of past jobs, so most jobs miss the store path another job just built.
          # The key is the store path, which covers every input of the build.
          assets="$(nix eval --raw .#code-mode-assets.outPath)"
          echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

          if nix-store --check-validity "$assets" 2>/dev/null; then
            echo "Code-mode assets already in the store"
            exit 0
          fi

          # Forks have no remote cache credentials.
          if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
            nix build --no-link --print-build-logs .#code-mode-assets
            exit 0
          fi

          cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

          # The token goes through a config descriptor so it stays out of curl's arguments.
          cache_request() {
            curl --fail --silent --show-error --max-time 30 --retry 2 \
              -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
          }

          if cache_request "$cache_url" | gunzip | nix-store --import; then
            echo "Code-mode assets restored from the remote cache"
            exit 0
          fi

          # Installing node_modules is most of a build and changes far less often than the SDK,
          # so it has its own entry.
          modules="$(nix eval --raw .#macro-js-node-modules.outPath)"
          modules_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$modules").zst"
          save_modules=false

          if ! nix-store --check-validity "$modules" 2>/dev/null; then
            # No retries: a retry would restart the stream into the same pipe, and past the limit
            # a rebuild is faster.
            if cache_request --retry 0 --max-time 60 "$modules_url" | zstd -d | nix-store --import; then
              echo "node_modules restored from the remote cache"
            else
              save_modules=true
            fi
          fi

          nix build --no-link --print-build-logs .#code-mode-assets

          if [ "$save_modules" = true ] \
            && ! nix-store --export "$modules" | zstd -T0 -3 | cache_request --max-time 120 --upload-file - "$modules_url"; then
            echo "::warning::Could not save node_modules to the remote cache"
          fi

          # Losing the upload costs the next job a rebuild, not a failure.
          if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
            echo "Code-mode assets saved to the remote cache"
          else
            echo "::warning::Could not save code-mode assets to the remote cache"
          fi
      - id: doppler-bins
        name: compute affected Doppler config bins
        run: |
          set -euo pipefail

          doppler_config_bins="$(cargo run --manifest-path tooling/xtask/Cargo.toml -- doppler-bins /tmp/changed-files)"
          {
            echo 'doppler_config_bins<<__DOPPLER_CONFIG_BINS__'
            if [ -n "$doppler_config_bins" ]; then
              printf '%s\n' "$doppler_config_bins"
            fi
            echo '__DOPPLER_CONFIG_BINS__'
          } >> "$GITHUB_OUTPUT"
        shell: bash
      - name: validate Doppler configs
        if: steps.doppler-bins.outputs.doppler_config_bins != ''
        run: |
          set -euo pipefail

          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN secret is required to validate Doppler configs" >&2
            exit 1
          fi

          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "RUSTC_WRAPPER is required so Doppler config binaries build through sccache" >&2
            exit 1
          fi

          bins=()
          cargo_args=(build --locked --all-features)
          while IFS= read -r bin; do
            if [ -z "$bin" ]; then
              continue
            fi

            bins+=("$bin")
            cargo_args+=(--bin "$bin")
          done <<< "$DOPPLER_CONFIG_BINS"

          if [ "${#bins[@]}" -eq 0 ]; then
            echo "No Doppler config binaries to validate"
            exit 0
          fi

          echo "Building affected Doppler config binaries with RUSTC_WRAPPER=$RUSTC_WRAPPER"
          printf '  %s\n' "${bins[@]}"

          cargo "${cargo_args[@]}"
          for bin in "${bins[@]}"; do
            "./target/debug/$bin"
          done
        env:
          DOPPLER_CONFIG_BINS: ${{ steps.doppler-bins.outputs.doppler_config_bins }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Teardown Nix
        if: always()
        uses: ./.github/actions/teardown-nix
      - name: Seal the kept cargo target
        run: |
          node --disable-warning=ExperimentalWarning --input-type=module-typescript <<'NODE_SCRIPT'
