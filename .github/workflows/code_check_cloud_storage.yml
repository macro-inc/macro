# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/code_check_cloud_storage.rs
name: cloud storage code check
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: limited
  CARGO_PROFILE_TEST_DEBUG: limited
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
jobs:
  path-check:
    runs-on: namespace-profile-linux-small;overrides.cache-tag=nextest-filter
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      doppler_candidates: ${{ steps.filter.outputs.doppler_candidates }}
      rust_packages: ${{ steps.nextest-filter.outputs.rust_packages }}
      skip_tests: ${{ steps.nextest-filter.outputs.skip_tests }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
        fetch-depth: '2'
    - name: Setup Rust
      uses: './.github/actions/setup-rust'
      with:
        sccache: 'false'
        rust-cache: 'false'
    - id: filter
      name: Filter changed paths
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'Cross.toml'
            - 'clippy.toml'
            - 'deny.toml'
            - 'rust-toolchain.toml'
            - '.cargo/**'
            - '.config/**'
            - '.sqlx/**'
            - 'crates/**'
            - 'services/**'
            - 'tooling/xtask/**'
            - 'static_assets/**'
            - 'nix/**'
            - 'flake.nix'
            - 'flake.lock'
            - '.github/actions/setup-nix/**'
            - '.github/actions/setup-nix-dev-shell/**'
            - '.github/actions/teardown-nix/**'
            - '.github/actions/setup-sccache/**'
            - '.github/services-config.json'
            - .github/workflows/code_check_cloud_storage.yml
          doppler_candidates:
            - '.github/services-config.json'
            - '**/src/config.rs'
            - '**/src/doppler_config.rs'
            - '**/Cargo.toml'
            - 'tooling/xtask/crates/xtask_doppler_bins/**'
            - .github/workflows/code_check_cloud_storage.yml
    - name: compute changed files
      if: steps.filter.outputs.should_run == 'true'
      run: |
        set -euo pipefail

        # Compare against the merge-base so a deleted file still appears. `--no-renames`
        # turns a rename into a delete+add pair so the old path is attributed to its
        # package (otherwise git reports only the new name).

        if [ -z "${GITHUB_BASE_REF:-}" ]; then
          compare_rev="$(git rev-parse HEAD~1)"
        else
          git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

          # The checkout holds only the PR merge commit and its two parents. Normally
          # the first parent is on the base branch, so the merge-base is immediate.
          # Stacked PRs can arrive with a merge commit built on another branch's tip;
          # deepen the PR side until its history reaches the base branch instead of
          # falling back to the full suite.
          compare_rev=""
          for deepen in 0 200 2000; do
            if [ "$deepen" -gt 0 ]; then
              echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
              git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
            fi
            if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
              break
            fi
            compare_rev=""
          done

          if [ -z "$compare_rev" ]; then
            echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
            : > /tmp/changed-files
            exit 0
          fi
        fi

        printf '%s\n' "$compare_rev" > /tmp/base-revision
        git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
      shell: bash
    - name: Mount nextest-filter binary cache
      if: steps.filter.outputs.should_run == 'true' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /home/runner/.cache/macro-nextest-filter
      continue-on-error: true
    - id: nextest-filter
      name: compute nextest package filter
      if: steps.filter.outputs.should_run == 'true'
      run: |
        set -euo pipefail

        # Writes for the check/test jobs:
        #   rust_packages — all | none | space-separated packages (changed + reverse deps)
        #   skip_tests    — true keeps clippy on rust_packages while the live-Postgres
        #                   test job stays skipped (`.sqlx`-only or clippy.toml-only diffs)
        #
        # Toolchain and cargo/nextest config edits force `all`. Root Cargo.toml and
        # Cargo.lock go to the xtask: determinator's old/new graph comparison scopes
        # lockfile, member, and workspace-dependency changes, and the xtask returns
        # `all` for any other root-manifest edit (profiles, lints, patches, …).
        # Cross.toml and deny.toml configure other tools and select nothing here.
        # clippy.toml changes lint results but not test outcomes (handled below).
        # flake.nix, the Nix shell action, and this workflow file used to live on the
        # full-suite list and turned every dev-shell tweak into a full-suite rebuild.

        # The filter runs as a release binary cached per source tree: a debug build
        # spends ~20 s in guppy on this runner, and compiling it took ~40 s more. The
        # key covers every input of the build, so a hit is exactly what `cargo build`
        # would produce. FILTER_CACHE_DIR is a Namespace cache volume for same-repo
        # PRs and a plain scratch directory for forks.
        filter_bin=""
        ensure_filter_bin() {
          [ -n "$filter_bin" ] && return 0
          local key bin_dir staging
          key="$(git rev-parse \
            HEAD:tooling/xtask/crates/xtask_nextest_filter \
            HEAD:tooling/xtask/crates/xtask_graph \
            HEAD:tooling/xtask/crates/xtask_paths \
            HEAD:Cargo.lock \
            HEAD:rust-toolchain.toml | sha256sum | cut -c1-16)"
          bin_dir="$FILTER_CACHE_DIR/bin/$key"
          filter_bin="$bin_dir/xtask_nextest_filter"
          if [ -x "$filter_bin" ]; then
            echo "Using cached nextest-filter build $key"
            touch "$bin_dir"
            return 0
          fi

          echo "Building nextest-filter $key"
          CARGO_TARGET_DIR="$FILTER_CACHE_DIR/target" \
            cargo build --release --locked --quiet -p xtask_nextest_filter
          staging="$(mktemp -d "$FILTER_CACHE_DIR/bin/.staging.XXXXXX")"
          cp "$FILTER_CACHE_DIR/target/release/xtask_nextest_filter" "$staging/"
          # Another job may have published the same key meanwhile; either copy works.
          mv -T "$staging" "$bin_dir" 2>/dev/null || rm -rf "$staging"
          # Drop builds no PR has used for a week (every Cargo.lock change adds one).
          find "$FILTER_CACHE_DIR/bin" -mindepth 1 -maxdepth 1 -type d -mtime +7 \
            -exec rm -rf {} + || true
        }
        mkdir -p "$FILTER_CACHE_DIR/bin"

        emit() {
          echo "rust_packages=$1" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$2" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ ! -s /tmp/changed-files ]; then
          echo "Unknown or empty change set; running all tests"
          emit all false
        fi

        if grep -qE '^(rust-toolchain\.toml|\.cargo/.*|\.config/.*)$' /tmp/changed-files; then
          echo "Toolchain or cargo config change detected; running all tests"
          emit all false
        fi

        clippy_config_changed=false
        if grep -qx 'clippy\.toml' /tmp/changed-files; then
          clippy_config_changed=true
        fi

        # The test job compiles queries against live Postgres (SQLX_OFFLINE is unset
        # there), so `.sqlx` contents cannot change test outcomes. Clippy is the
        # offline SQLx check (`SQLX_OFFLINE=true`), so a snapshot-only diff must
        # still compile against the cache rather than skip the check job.
        if ! grep -qvE '^\.sqlx/' /tmp/changed-files; then
          echo "Only .sqlx changes detected; clippy all, skip live-Postgres tests"
          emit all true
        fi

        ensure_filter_bin
        packages="$("$filter_bin" /tmp/changed-files "$(< /tmp/base-revision)")"

        # One package list drives both clippy and tests, so a clippy.toml edit can
        # only skip tests when nothing else selected a package.
        if [ "$clippy_config_changed" = true ]; then
          if [ -z "$packages" ] || [ "$packages" = "none" ]; then
            echo "Only clippy.toml affects Rust; clippy all, skip live-Postgres tests"
            emit all true
          fi
          echo "clippy.toml changed alongside package changes; running all tests"
          emit all false
        fi

        if [ -z "$packages" ] || [ "$packages" = "none" ]; then
          echo "No package-specific Rust changes detected; running no tests"
          emit none false
        fi

        echo "rust packages: $packages"
        emit "$packages" false
      shell: bash
      env:
        FILTER_CACHE_DIR: /home/runner/.cache/macro-nextest-filter
  check:
    needs:
    - path-check
    if: needs.path-check.outputs.should_run == 'true' && github.event.pull_request.draft == false
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    env:
