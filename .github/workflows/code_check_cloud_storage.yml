        # no lib — xtask binaries such as xtask_nextest_filter / xtask_workflows.
        # Unconstrained `-p` still runs that package's tests.

        : "${RUST_PACKAGES:?RUST_PACKAGES is required}"
        # Dependencies build without debug info, which cuts compile, link and disk cost.
        # Workspace crates keep CARGO_PROFILE_*_DEBUG=limited, so backtraces still carry
        # line numbers in our own code.
        common=(
          --config 'profile.dev.package."*".debug=false'
          --all-features --no-tests=pass --test-threads "$NEXTEST_TEST_THREADS"
        )

        if [ "$RUST_PACKAGES" = "all" ]; then
          cargo nextest run --workspace --exclude sync_service --lib --bins --tests "${common[@]}"
          exit 0
        fi

        pkg_args=()
        for package in $RUST_PACKAGES; do
          [ "$package" = "sync_service" ] || pkg_args+=(-p "$package")
        done

        if [ "${#pkg_args[@]}" -eq 0 ]; then
          echo "No packages in the test suite were affected"
          exit 0
        fi

        cargo nextest run "${common[@]}" "${pkg_args[@]}"
    - name: Set up code execution runtime
      if: env.RUST_PACKAGES == 'all' || contains(env.RUST_PACKAGES, 'code_execution') || contains(env.RUST_PACKAGES, 'agent_code_mode') || contains(env.RUST_PACKAGES, 'agent_harness_service')
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      with:
        deno-version: '2.9.6'
    - name: Test Deno sandbox and live host bridge
      if: env.RUST_PACKAGES == 'all' || contains(env.RUST_PACKAGES, 'code_execution') || contains(env.RUST_PACKAGES, 'agent_code_mode') || contains(env.RUST_PACKAGES, 'agent_harness_service')
      run: |-
        cargo test --locked -p code_execution -- --ignored --test-threads=2
        cargo test --locked -p agent_harness_service authenticated_mcp_runs_typescript_parallel_tools_and_persists_ui_results -- --ignored
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  status-check:
    needs:
    - path-check
    - check
    - doppler-config
    - test
    if: always()
    name: Cloud Storage Status Check
    runs-on: namespace-profile-linux-small
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "check: ${{ needs.check.result }}"
        echo "doppler-config: ${{ needs.doppler-config.result }}"
        echo "test: ${{ needs.test.result }}"

        # Fail if any job failed (skipped and success are both OK)
        if [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.check.result }}" == "failure" ]] || \
           [[ "${{ needs.doppler-config.result }}" == "failure" ]] || \
           [[ "${{ needs.test.result }}" == "failure" ]]; then
          echo "❌ One or more jobs failed"
          exit 1
        fi

        echo "✅ All jobs passed or were skipped"
concurrency:
  group: code-check-cloud-storage-${{ github.ref }}
  cancel-in-progress: true
