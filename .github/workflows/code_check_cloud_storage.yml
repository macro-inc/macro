          echo "KACHE_RUNTIME_DIR=$RUNNER_TEMP/kache"
        } >> "$GITHUB_ENV"
        if [ "$TRUSTED" != true ]; then
          echo "KACHE_LOCAL_ONLY=1" >> "$GITHUB_ENV"
        elif [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ]; then
          echo "::warning::KACHE_R2_* secrets are not set; kache uses only the volume store"
          echo "KACHE_LOCAL_ONLY=1" >> "$GITHUB_ENV"
        else
          # `just ci-prebuild` publishes the exact entries a tree needs under
          # this manifest key, so the daemon prefetches them as the build
          # starts instead of fetching each 100 MiB test binary on demand,
          # which takes longer than a compile waits. Test binaries alone
          # exceed the default 2 GiB plan.
          {
            echo "KACHE_S3_ACCESS_KEY=$R2_ACCESS_KEY"
            echo "KACHE_S3_SECRET_KEY=$R2_SECRET_KEY"
            echo "KACHE_MANIFEST_KEY=tree/$(git rev-parse HEAD^{tree})"
            echo "KACHE_PREFETCH_MAX_BYTES=16GiB"
            echo "KACHE_PREFETCH_MAX_KEYS=0"
            echo "KACHE_S3_CONCURRENCY=64"
          } >> "$GITHUB_ENV"
        fi
      shell: bash
      env:
        KACHE_VOLUME_DIR: /home/runner/.cache/kache
        KACHE_VOLUME_MAX_SIZE: '30GiB'
        TRUSTED: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}
        R2_ACCESS_KEY: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
        R2_SECRET_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    - name: configure postgres for concurrent tests
      run: |
        postgres_container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "pgvector/pgvector:pg14" { print $1; exit }')"
        if [ -z "$postgres_container" ]; then
          echo "pgvector/pgvector:pg14 service container not found" >&2
          docker ps
          exit 1
        fi

        docker exec -i "$postgres_container" psql -U user -d macrodb <<'SQL'
        ALTER SYSTEM SET fsync = off;
        ALTER SYSTEM SET synchronous_commit = off;
        ALTER SYSTEM SET full_page_writes = off;
        ALTER SYSTEM SET max_wal_size = '4GB';
        ALTER SYSTEM SET checkpoint_timeout = '30min';
        ALTER SYSTEM SET max_locks_per_transaction = 8192;
        SQL
        docker restart "$postgres_container"
        until docker exec "$postgres_container" pg_isready -U user -d macrodb; do
          sleep 1
        done
        docker exec "$postgres_container" psql -U user -d macrodb -c "SHOW max_locks_per_transaction;"
    - name: prepare tests
      run: just setup_test_envs && just initialize_dbs && just setup_test_template
    - name: Clean target (experiment)
      run: find target -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    - name: Trace kache keys (experiment)
      run: |
        echo "KACHE_LOG_FILE=kache::cache_key=trace" >> "$GITHUB_ENV"
        echo "KACHE_LOG_FILE_PATH=$RUNNER_TEMP/kache-keys.log" >> "$GITHUB_ENV"
    - name: run tests
      run: |
        set -euo pipefail

        # --no-tests=pass: a package filter can legitimately select a crate with no
        # tests; treat that as success, not nextest's default error.
        # sync-service is not part of this suite, and its storage backends are mutually
        # exclusive under --all-features.
        #
        # Package selection uses `cargo nextest run -p`, not `--workspace -E rdeps(...)`.
        # The filterset only decides which tests *run* after a workspace build; `-p`
        # is what keeps an unrelated crate's test binary from being compiled.
        #
        # `--lib --bins --tests` is safe with `--workspace` (cargo skips packages that
        # lack a given target type) but fails with `-p` when any selected package has
        # no lib — xtask binaries such as xtask_nextest_filter / xtask_workflows.
        # Unconstrained `-p` still runs that package's tests.

        : "${RUST_PACKAGES:?RUST_PACKAGES is required}"
        # NEXTEST_NO_RUN=1 builds the test binaries without running them, which is how
        # `just ci-prebuild` fills kache with exactly what this job compiles.
        common=(--all-features --no-tests=pass --test-threads "$NEXTEST_TEST_THREADS")
        if [ "${NEXTEST_NO_RUN:-}" = 1 ]; then
          common+=(--no-run)
        fi

        # Warnings fail the run here rather than through -Dwarnings: a lint level is
        # part of every crate's kache key, and laptops build without one. kache replays
        # a cached crate's warnings, so a hit still reports them.
        deny_warnings() {
          local log status=0
          log="$(mktemp)"
          { "$@" 2>&1 1>&3 3>&- | tee "$log" >&2; } 3>&1 || status=$?
          if grep -qE 'generated [0-9]+ warnings?' "$log"; then
            echo "error: Rust warnings are not allowed; fix the warnings above" >&2
            [ "$status" -ne 0 ] || status=1
          fi
          rm -f "$log"
          return "$status"
        }

        if [ "$RUST_PACKAGES" = "all" ]; then
          deny_warnings cargo nextest run --workspace --exclude sync_service --lib --bins --tests "${common[@]}"
          exit 0
        fi

        pkg_args=()
        for package in $RUST_PACKAGES; do
          [ "$package" = "sync_service" ] || pkg_args+=(-p "$package")
        done

        if [ "${#pkg_args[@]}" -eq 0 ]; then
          echo "No packages in the test suite were affected"
          exit 0
        fi

        deny_warnings cargo nextest run "${common[@]}" "${pkg_args[@]}"
    - name: Report kache stats
      if: always()
      run: |
        kache stats || true

        # Which crates compiled instead of coming from the cache, costliest first.
        # The key prefix matches `kache explain`'s, so a miss can be compared with
        # the key a developer machine published for the same crate.
        events="${KACHE_RUNTIME_DIR:-$KACHE_CACHE_DIR${KACHE_TRUST_DOMAIN:+/$KACHE_TRUST_DOMAIN}}/events.jsonl"
        if [ -f "$events" ]; then
          echo "Costliest kache misses (compile ms, crate, key):"
          jq -r 'select(.result == "miss") | "\(.compile_time_ms // 0)\t\(.crate_name)\t\(.cache_key[0:12])"' \
            "$events" | sort -rn | head -60 || true
        fi

        kache daemon stop || true
      shell: bash
    - name: Upload kache key trace (experiment)
      if: always()
      run: gzip -9 -c "$RUNNER_TEMP/kache-keys.log" > "$RUNNER_TEMP/kache-keys.log.gz" || true
    - name: Upload kache key trace artifact (experiment)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: kache-keys
        path: ${{ runner.temp }}/kache-keys.log.gz
        retention-days: 3
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  status-check:
    needs:
    - path-check
    - check
    - doppler-config
    - test
    if: always()
    name: Cloud Storage Status Check
    runs-on: namespace-profile-linux-small
    steps:
    - name: Check job results
      run: |
        echo "path-check: ${{ needs.path-check.result }}"
        echo "check: ${{ needs.check.result }}"
        echo "doppler-config: ${{ needs.doppler-config.result }}"
        echo "test: ${{ needs.test.result }}"

        # Fail if any job failed (skipped and success are both OK)
        if [[ "${{ needs.path-check.result }}" == "failure" ]] || \
           [[ "${{ needs.check.result }}" == "failure" ]] || \
           [[ "${{ needs.doppler-config.result }}" == "failure" ]] || \
           [[ "${{ needs.test.result }}" == "failure" ]]; then
          echo "❌ One or more jobs failed"
          exit 1
        fi

        echo "✅ All jobs passed or were skipped"
concurrency:
  group: code-check-cloud-storage-${{ github.ref }}
  cancel-in-progress: true
