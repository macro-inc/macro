name: Migrate Macro Database

on:
  workflow_dispatch:

jobs:
  migrate-db:
    name: Run Database Migrations (dev)
    runs-on: db-migrator
    steps:
      # This is needed to checkout the action files
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/

      - name: Run migrations for dev
        uses: ./.github/actions/migrate-cloud-storage-db
        with:
          environment: dev
