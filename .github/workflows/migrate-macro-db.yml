name: Migrate Macro Database
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run migrations for
        required: true
        type: choice
        options:
          - dev
          - prod
jobs:
  migrate-db:
    name: Run Database Migrations (${{ inputs.environment }})
    runs-on: db-migrator
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # zizmor: ignore[artipacked] the migration action that runs next may use the persisted token
        with:
          sparse-checkout: |
            .github/
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '10000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
      - name: Run migrations
        uses: ./.github/actions/migrate-cloud-storage-db
        with:
          environment: ${{ inputs.environment }}
