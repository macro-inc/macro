# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_preview.rs
name: Deploy Preview
env:
  PREVIEW_BUCKET: macro-preview-assets-dev
'on':
  pull_request:
    types:
    - opened
    - synchronize
    paths:
    - package.json
    - bun.lock
    - apps/web/**
    - packages/**
    - crates/agent_fold/**
    - crates/agent_runtime_protocol/**
    - crates/client/cache-core/**
    - crates/client/cache-turso/**
    - crates/client/cache-wasm/**
    - crates/client/turso-opfs/**
    - static_assets/schema.graphql
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
jobs:
  deploy:
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cache/.wasm-pack
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup
      uses: './.github/actions/setup-reqs-web'
    - name: Configure Namespace remote sccache
      if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
      run: |-
        set -euo pipefail
        env_file="$(mktemp "$RUNNER_TEMP/namespace-sccache.XXXXXX")"
        trap 'rm -f "$env_file"' EXIT
        if nsc cache sccache setup --cache_name web-ci > "$env_file"; then
          # Register credential values as masked BEFORE exporting: GitHub only
          # masks `secrets.*`, so without this SCCACHE_WEBDAV_TOKEN — a broad,
          # ~24h Namespace workspace token (registry + cache write) — printed
          # verbatim in every subsequent step's env dump. Masking is selective by
          # key name: masking non-secrets like the endpoint URL or key prefix
          # would redact those strings everywhere in the logs.
          while IFS= read -r line; do
            k="${line%%=*}"
            v="${line#*=}"
            [ -n "$v" ] && [ "$k" != "$line" ] || continue
            case "$k" in
              *TOKEN*|*SECRET*|*PASSWORD*) echo "::add-mask::$v" ;;
            esac
          done < "$env_file"
          cat "$env_file" >> "$GITHUB_ENV"
          # Force the next compiler invocation to start a server with the new remote
          # backend even if a setup hook happened to launch one already.
          sccache --stop-server >/dev/null 2>&1 || true
        else
          echo "::warning::Namespace remote sccache setup failed; using local cache fallback"
        fi
    - name: Build
      run: just build-dev
      env:
        VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      working-directory: apps/web
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - id: preview-id
      name: Get or create preview ID
      run: |
        PREVIEW_ID=$(bun scripts/preview/get-or-create-id.ts \
          --pr ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --branch "${{ github.head_ref }}")
        echo "id=$PREVIEW_ID" >> $GITHUB_OUTPUT
        echo "Preview ID: $PREVIEW_ID"
      working-directory: apps/web
    - name: Validate bucket name
      run: |
        if [[ "${{ env.PREVIEW_BUCKET }}" != "macro-preview-assets-dev" ]]; then
          echo "ERROR: PREVIEW_BUCKET must be 'macro-preview-assets-dev'"
          exit 1
        fi
    - name: Deploy to S3
      run: |
        bun scripts/preview/deploy.ts \
          --preview-id ${{ steps.preview-id.outputs.id }} \
          --skip-build
      working-directory: apps/web
    - name: Comment on PR
      run: |
        bun scripts/preview/post-comment.ts \
          --pr ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --preview-id ${{ steps.preview-id.outputs.id }} \
          --sha ${{ github.sha }}
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
