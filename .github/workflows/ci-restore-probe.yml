# Experiment only: is the HTTP cache slow, or is unpacking slow? Reads objects that are
# already in the cache, and writes nothing to it.
name: CI Restore Probe

on:
  pull_request:

concurrency:
  group: ci-restore-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SNAP_BASE: test-snapshot/0afc757a8051b7f8e5ad47cced7fd0743d414326
  SEED_BASE: nix-seed/71502a370b081760da2e405d95bf8c0dcdf018510f5ab055b06d07218cac7520

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [1, 2, 3]
    runs-on: namespace-profile-linux-large-build;overrides.cache-tag=ci-restore-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.run }}
    steps:
      - name: Mount empty volume
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          path: |-
            /nix
        continue-on-error: true
      - name: Credentials
        run: |
          set -euo pipefail
          nsc cache sccache setup --cache_name sccache-ci > "$RUNNER_TEMP/creds"
          token="$(sed -n 's/^SCCACHE_WEBDAV_TOKEN=//p' "$RUNNER_TEMP/creds")"
          echo "::add-mask::$token"
          grep -E '^SCCACHE_WEBDAV_(ENDPOINT|TOKEN)=' "$RUNNER_TEMP/creds" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds"
          df -h / /nix
      - name: Snapshot, download only
        run: |
          set -uo pipefail
          start=$(date +%s)
          for i in $(seq 0 15); do
            curl --fail --silent --show-error --max-time 200 --output /dev/null --write-out "shard $i %{size_download} bytes %{time_total}s %{speed_download} B/s\n" \
              -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$SCCACHE_WEBDAV_ENDPOINT/$SNAP_BASE/shard$i" &
          done
          wait
          echo "snapshot_download_seconds=$(( $(date +%s) - start ))"
      - name: Snapshot, download and unpack
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/snap"
          start=$(date +%s)
          for i in $(seq 0 15); do
            (curl --fail --silent --show-error --max-time 200 \
              -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$SCCACHE_WEBDAV_ENDPOINT/$SNAP_BASE/shard$i" \
              | zstd -d -T2 2>/dev/null | tar -xf - -C "$RUNNER_TEMP/snap") &
          done
          wait
          echo "snapshot_restore_seconds=$(( $(date +%s) - start ))"
          du -sh "$RUNNER_TEMP/snap"
          rm -rf "$RUNNER_TEMP/snap"
      - name: Nix seed, download only
        run: |
          set -uo pipefail
          start=$(date +%s)
          for i in $(seq 0 7); do
            curl --fail --silent --show-error --max-time 200 --output /dev/null --write-out "shard $i %{size_download} bytes %{time_total}s %{speed_download} B/s\n" \
              -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$SCCACHE_WEBDAV_ENDPOINT/$SEED_BASE/$i" &
          done
          wait
          echo "seed_download_seconds=$(( $(date +%s) - start ))"
      - name: Nix seed, download and unpack onto the volume
        run: |
          set -uo pipefail
          start=$(date +%s)
          for i in $(seq 0 7); do
            (curl --fail --silent --show-error --max-time 200 \
              -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$SCCACHE_WEBDAV_ENDPOINT/$SEED_BASE/$i" \
              | zstd -d -T2 2>/dev/null | sudo tar -xf - -C /) &
          done
          wait
          echo "seed_restore_seconds=$(( $(date +%s) - start ))"
          sudo du -sh /nix
