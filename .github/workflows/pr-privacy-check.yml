# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/pr_privacy_check.rs
name: PR Privacy Check
'on':
  pull_request:
    types:
    - opened
    - edited
    - reopened
    - synchronize
jobs:
  check:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    name: PR text has no personal or support-channel details
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    timeout-minutes: 5
    steps:
    - name: Scan PR title, body, and commit messages
      run: |
        # Fail when a PR title, PR body, or commit message carries personal or
        # support-channel details. The rule lives in the git skill
        # (.agents/skills/git/SKILL.md, "Privacy"); this catches the patterns a
        # regex can see: emails, phone numbers, @mentions, chat-channel names, and
        # links into support tools or Macro workspace content. Names of people and
        # customers can't be matched mechanically; reviewers own those.
        #
        # CI: PR_TITLE, PR_BODY, PR_NUMBER, GH_REPO, GH_TOKEN; commits come from the
        # PR API. Locally (`just pr-privacy [body-file]`): commits are
        # CHECK_BASE..HEAD (default: merge-base with origin/main); PR_TITLE and the
        # optional body file are scanned when given.
        set -euo pipefail

        found=0

        # report SOURCE LABEL MATCHES: print each match under its source.
        report() {
          local source="$1" label="$2" matches="$3"
          [[ -z "$matches" ]] && return 0
          found=1
          while IFS= read -r m; do
            echo "::error::${source}: ${label}: ${m}"
          done <<<"$matches"
        }

        # scan SOURCE: read text on stdin and report every banned pattern.
        scan() {
          local source="$1" text prose
          # Trailers (Co-authored-by, Signed-off-by) are git identity metadata.
          text=$(grep -viE '^[A-Za-z-]+-by: ' || true)
          [[ -z "$text" ]] && return 0
          # Mentions and channel names are only checked outside code, where
          # decorators, CSS colors, and shell comments look alike.
          prose=$(awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced' <<<"$text" | sed -E 's/`[^`]*`//g')

          report "$source" "email address" "$(grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' <<<"$text" \
            | grep -viE '@(example\.(com|org|net)|([a-z0-9-]+\.)?noreply\.github\.com|(group|resource)\.calendar\.google\.com)$|^git@github\.com$' || true)"
          report "$source" "phone number" "$(grep -oE '(\+[0-9]{1,3}[ .-]?)?\(?[0-9]{3}\)?[ .-][0-9]{3}[ .-][0-9]{4}' <<<"$text" || true)"
          report "$source" "support or chat link" "$(grep -oiE 'https?://([a-z0-9-]+\.slack\.com/(archives|client|team)|app\.slack\.com/client|app\.intercom\.(com|io)|[a-z0-9-]+\.zendesk\.com/agent|app\.frontapp\.com|discord\.com/channels|mail\.google\.com|app\.hubspot\.com|app\.usepylon\.com|app\.plain\.com|app\.crisp\.chat|secure\.helpscout\.net)[^[:space:])>]*' <<<"$text" || true)"
          # Links to workspace items (channels, documents, chats, emails). Tasks are
          # the issue tracker and may be linked like GitHub issues.
          report "$source" "Macro workspace link" "$(grep -oiE 'https?://([a-z0-9-]+\.)?macro\.com/app/[a-z-]+/[A-Za-z0-9-]+[^[:space:])>`]*' <<<"$text" \
            | grep -viE '/app/tasks?/' || true)"
          # `@scope/package` names end in a slash and are not mentions.
          report "$source" "@mention" "$(grep -oE '(^|[[:space:](])@[A-Za-z0-9][A-Za-z0-9-]*/?' <<<"$prose" \
            | sed -E 's/^[[:space:](]*//' | grep -v '/$' \
            | grep -viE '^@(mentions?|coderabbitai|dependabot|github-actions|copilot|claude|cursor)$' || true)"
          report "$source" "chat channel" "$(grep -oE '(^|[[:space:]])#[a-z][a-z0-9_-]*' <<<"$prose" \
            | sed -E 's/^[[:space:]]*//' \
            | grep -vE '^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$' || true)"
        }

        if [[ -n "${PR_TITLE:-}" ]]; then
          scan "PR title" <<<"$PR_TITLE"
        fi
        if [[ -n "${PR_BODY:-}" ]]; then
          scan "PR body" <<<"$PR_BODY"
        fi
        if [[ -n "${PR_BODY_FILE:-}" ]]; then
          scan "PR body" <"$PR_BODY_FILE"
        fi

        # One line per commit: sha, then the base64 message (messages span lines).
        if [[ -n "${PR_NUMBER:-}" ]]; then
          commits=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | "\(.sha) \(.commit.message | @base64)"')
        else
          base="${CHECK_BASE:-$(git merge-base HEAD origin/main)}"
          commits=$(git rev-list "${base}..HEAD" | while read -r sha; do
            echo "$sha $(git log -1 --format=%B "$sha" | base64 | tr -d "\n")"
          done)
        fi
        while read -r sha encoded; do
          [[ -z "$sha" ]] && continue
          scan "commit ${sha:0:10}" < <(base64 -d <<<"$encoded")
        done <<<"$commits"

        if [[ "$found" -ne 0 ]]; then
          echo "Pull request text must describe only the code change. Remove the details above"
          echo "(edit the PR title or body; reword commits on your own branch) and describe any"
          echo "reason in general terms. See the Privacy section of .agents/skills/git/SKILL.md."
          exit 1
        fi
        echo "No personal or support-channel details found."
      shell: bash
