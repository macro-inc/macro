# DO NOT EDIT — regenerate with `cargo x workflows` (from rust/cloud-storage).
# Source: rust/cloud-storage/tools/xtask/src/workflows/reusable_preview_service.rs
name: Reusable Preview Service
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: The environment to preview
      service-name:
        required: true
        type: string
        description: The name of the service to preview
      pulumi-stack-name:
        required: false
        type: string
        description: Override pulumi stack name (defaults to service-name)
      use-docker:
        required: false
        type: boolean
        default: true
        description: Whether to setup docker
      use-lfs:
        required: false
        type: boolean
        default: false
        description: Whether to checkout LFS content
      github-token:
        required: false
        type: string
        description: GitHub token for PR comments
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
      DD_APP_KEY:
        required: true
      DD_API_KEY:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
jobs:
  preview:
    runs-on: namespace-profile-linux-small
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - id: project-name
      name: Get project name
      uses: ./.github/actions/get-project-name
      with:
        service-name: ${{ inputs.service-name }}
    - name: Preview pulumi stack
      uses: ./.github/actions/preview-cloud-storage-pulumi
      with:
        environment: ${{ inputs.environment }}
        aws-access-key: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        pulumi-service-name: ${{ inputs.pulumi-stack-name || steps.project-name.outputs.project-name }}
        dd-app-key: ${{ secrets.DD_APP_KEY }}
        dd-api-key: ${{ secrets.DD_API_KEY }}
        use-docker: ${{ inputs.use-docker }}
        use-lfs: ${{ inputs.use-lfs }}
        github-token: ${{ inputs.github-token }}
        cloud-storage-service-name: ${{ inputs.service-name }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
