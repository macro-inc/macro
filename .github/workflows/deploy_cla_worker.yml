# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_cla_worker.rs
name: Deploy CLA Worker
'on':
  push:
    branches:
    - main
    paths:
    - '.github/workflows/deploy_cla_worker.yml'
    - services/cla-worker/**
  workflow_dispatch: {}
jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: namespace-profile-linux-small
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: bun install --frozen-lockfile
      working-directory: services/cla-worker
    - name: Deploy with wrangler
      run: bun run deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      working-directory: services/cla-worker
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
