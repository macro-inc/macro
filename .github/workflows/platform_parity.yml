# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/platform_parity.rs
name: platform parity
'on':
  pull_request:
    branches:
    - main
    paths:
    - infra/platform/**
    - nix/platform.nix
    - flake.lock
    - '.github/workflows/platform_parity.yml'
permissions:
  contents: read
jobs:
  parity:
    name: local and prod differ only in size
    runs-on: namespace-profile-linux-small
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Compare renderings
      run: nix build --no-link -L .#platform.parity
    - name: Validate the AWS configuration
      run: nix build --no-link -L .#platform.awsCheck
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
