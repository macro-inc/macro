# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/cargo_deny.rs
name: cargo deny check
'on':
  workflow_call: {}
jobs:
  cargo-deny:
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Fetch the pinned advisory database
      run: |
        set -euo pipefail
        db=target/advisory-dbs/advisory-db-3157b0e258782691
        rm -rf "$db"
        git init -q "$db"
        git -C "$db" remote add -t main origin https://github.com/rustsec/advisory-db
        git -C "$db" fetch -q --depth 1 origin "$(cat .github/advisory-db-rev)"
        git -C "$db" checkout -q --detach FETCH_HEAD
        echo "advisory-db at $(git -C "$db" log -1 --format='%h %cI')"
      shell: bash
    - name: cargo deny
      uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe
      with:
        manifest-path: Cargo.toml
        command-arguments: '--disable-fetch'
