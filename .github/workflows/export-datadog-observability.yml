name: Export Datadog observability definitions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - infra/stacks/observability/migration/export-datadog.ts
      - .github/workflows/export-datadog-observability.yml
permissions:
  contents: read
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-linux-small
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Read dashboards and monitors
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: bun infra/stacks/observability/migration/export-datadog.ts /tmp/datadog-inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datadog-observability-definitions
          path: /tmp/datadog-inventory
          retention-days: 7
