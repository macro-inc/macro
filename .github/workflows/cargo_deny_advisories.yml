# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/cargo_deny_advisories.rs
name: cargo deny advisories
'on':
  schedule:
  - cron: '23 6 * * *'
  workflow_dispatch: {}
jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: namespace-profile-linux-small
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Setup Rust
      uses: './.github/actions/setup-rust'
      with:
        sccache: 'false'
        rust-cache: 'false'
    - name: Install cargo-deny
      run: |
        set -euo pipefail
        name=cargo-deny-0.19.8-x86_64-unknown-linux-musl
        curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.8/$name.tar.gz"
        echo "70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --quiet
        tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      shell: bash
    - name: cargo deny check advisories
      run: cargo-deny --all-features --manifest-path Cargo.toml check advisories
      shell: bash
    - name: Post the failure to Macro Alerts
      if: failure()
      run: |
        set -euo pipefail
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        message="🚨 The daily cargo deny advisories run failed on $GITHUB_REF_NAME. If the log shows a RustSec advisory against a package in Cargo.lock, update the crate, or ignore the advisory in deny.toml with a reason. $run_url"
        jq -n --arg content "$message" '{content: $content}' |
          curl --fail-with-body --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --header "x-macro-channel-bot-token: $MACRO_BOT_TOKEN" \
            --data-binary @- "$MACRO_WEBHOOK_URL"
      shell: bash
      env:
        MACRO_WEBHOOK_URL: ${{ vars.MACRO_BUILD_ALERT_WEBHOOK_URL }}
        MACRO_BOT_TOKEN: ${{ secrets.MACRO_BUILD_ALERT_BOT_TOKEN }}
