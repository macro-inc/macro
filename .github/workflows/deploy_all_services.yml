# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_all_services.rs
name: Deploy All Services
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: The environment we are deploying to.
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
      DD_APP_KEY:
        required: true
      DD_API_KEY:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options:
        - dev
        - prod
        description: The environment we are deploying to.
jobs:
  setup:
    name: Setup Deployment Matrix
    runs-on: namespace-profile-linux-tiny-no-cache
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      binaries: ${{ steps.set-matrix.outputs.binaries }}
      lambdas: ${{ steps.set-matrix.outputs.lambdas }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - id: set-matrix
      name: Set deployment matrix
      run: |
        set -euo pipefail
        cfg=.github/services-config.json
        # Full list drives deploy-services; the filtered lists keep each build
        # matrix to only the services that actually produce that artifact, so
        # no build job spins up Nix + a cache volume for nothing.
        services=$(jq -c '.services | keys' "$cfg")
        binaries=$(jq -c '[.services | to_entries[] | select((.value.deploy_binaries // []) | length > 0) | .key]' "$cfg")
        lambdas=$(jq -c '[.services | to_entries[] | select((.value.deploy_lambdas // []) | length > 0) | .key]' "$cfg")
        echo "matrix=${services}" >> "$GITHUB_OUTPUT"
        echo "binaries=${binaries}" >> "$GITHUB_OUTPUT"
        echo "lambdas=${lambdas}" >> "$GITHUB_OUTPUT"
        echo "All services: ${services}"
        echo "With binaries: ${binaries}"
        echo "With lambdas: ${lambdas}"
  warm-binaries:
    needs:
    - setup
    if: ${{ needs.setup.outputs.binaries != '[]' }}
    name: Warm shared binary deps onto sticky disk
    runs-on: namespace-profile-linux-mid
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Configure Cachix fallback
      uses: ./.github/actions/setup-cachix
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Warm shared release deps
      run: |
        set -euo pipefail
        cachix_pid=
        if command -v cachix >/dev/null 2>&1 && [ -n "${CACHIX_CACHE_NAME:-}" ]; then
          cachix watch-store "$CACHIX_CACHE_NAME" >/tmp/cachix-watch-store.log 2>&1 &
          cachix_pid=$!
          trap 'if [ -n "${cachix_pid:-}" ]; then kill "$cachix_pid" 2>/dev/null || true; wait "$cachix_pid" 2>/dev/null || true; fi' EXIT
        fi
        nix build --print-build-logs ".#deployCargoArtifacts"
        echo "Shared release deps realised into /nix/store; committed on job exit."
      shell: bash
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  warm-lambdas:
    needs:
    - setup
    if: ${{ needs.setup.outputs.lambdas != '[]' }}
    name: Warm shared lambda deps onto sticky disk
    runs-on: namespace-profile-linux-mid
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Configure Cachix fallback
      uses: ./.github/actions/setup-cachix
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Warm shared lambda dep closure
      run: |
        set -euo pipefail
        cachix_pid=
        if command -v cachix >/dev/null 2>&1 && [ -n "${CACHIX_CACHE_NAME:-}" ]; then
          cachix watch-store "$CACHIX_CACHE_NAME" >/tmp/cachix-watch-store.log 2>&1 &
          cachix_pid=$!
          trap 'if [ -n "${cachix_pid:-}" ]; then kill "$cachix_pid" 2>/dev/null || true; wait "$cachix_pid" 2>/dev/null || true; fi' EXIT
        fi
        nix build --print-build-logs ".#lambdaDeployCargoArtifacts" ".#callRecordingPreviewFfmpegLayer"
        echo "Shared lambda deps realised into /nix/store; committed on job exit."
      shell: bash
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  build-service-binaries:
    needs:
    - setup
    - warm-binaries
    if: ${{ needs.setup.outputs.binaries != '[]' }}
    name: Build ${{ matrix.service }} binaries
    runs-on: namespace-profile-linux-mid
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.binaries) }}
      fail-fast: false
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
        clean: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Configure Cachix fallback
      uses: ./.github/actions/setup-cachix
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Build prebuilt binaries
      run: |+
        set -euo pipefail
        cachix_pid=
        if command -v cachix >/dev/null 2>&1 && [ -n "${CACHIX_CACHE_NAME:-}" ]; then
          cachix watch-store "$CACHIX_CACHE_NAME" >/tmp/cachix-watch-store.log 2>&1 &
          cachix_pid=$!
          trap 'if [ -n "${cachix_pid:-}" ]; then kill "$cachix_pid" 2>/dev/null || true; wait "$cachix_pid" 2>/dev/null || true; fi' EXIT
        fi
        mkdir -p prebuilt
        nix build --print-build-logs ".#deploy-service-binaries-${SERVICE}"
        cp -r result/bin/* prebuilt/
        mkdir -p prebuilt/nix-store
        while IFS= read -r store_path; do
          cp -a "$store_path" prebuilt/nix-store/
        done < <(nix-store -qR result)
        touch prebuilt/.keep
        tar -C prebuilt -czf prebuilt-binaries.tar.gz .
        # Receipt: the deploy job logs the same hash on read.
        echo "handoff receipt: $(sha256sum prebuilt-binaries.tar.gz | cut -d' ' -f1) ($(stat -c%s prebuilt-binaries.tar.gz) bytes)"

      shell: bash
      env:
        SERVICE: ${{ matrix.service }}
    - name: Upload handoff artifact
      run: nsc artifact upload prebuilt-binaries.tar.gz "$DEST" --expires_in=24h
      shell: bash
      env:
        DEST: handoff/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.service }}/prebuilt-binaries.tar.gz
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  build-lambda-artifacts:
    needs:
    - setup
    - warm-lambdas
    if: ${{ needs.setup.outputs.lambdas != '[]' }}
    name: Build ${{ matrix.service }} Lambda artifacts
    runs-on: namespace-profile-linux-mid
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.lambdas) }}
      fail-fast: false
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
        clean: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Configure Cachix fallback
      uses: ./.github/actions/setup-cachix
      with:
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Build Lambda artifacts
      run: .github/scripts/build-cloud-storage-lambdas-nix.sh
      env:
        SERVICE: ${{ matrix.service }}
    - name: Log handoff receipt
      run: |
        set -euo pipefail
        # The build script writes lambda-artifacts.tar.gz to the workspace
        # root; the deploy job logs the same hash on read.
        echo "handoff receipt: $(sha256sum lambda-artifacts.tar.gz | cut -d' ' -f1) ($(stat -c%s lambda-artifacts.tar.gz) bytes)"
      shell: bash
    - name: Upload handoff artifact
      run: nsc artifact upload lambda-artifacts.tar.gz "$DEST" --expires_in=24h
      shell: bash
      env:
        DEST: handoff/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.service }}/lambda-artifacts.tar.gz
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  migrate-db:
    needs:
    - setup
    - warm-binaries
    - warm-lambdas
    - build-service-binaries
    - build-lambda-artifacts
    if: ${{ !cancelled() && needs.setup.outputs.matrix != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    name: Run Database Migrations
    runs-on: db-migrator
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
        sparse-checkout: .github/
    - name: Run migrations
      uses: ./.github/actions/migrate-cloud-storage-db
      with:
        environment: ${{ inputs.environment }}
  deploy-services:
    needs:
    - setup
    - warm-binaries
    - warm-lambdas
    - build-service-binaries
    - build-lambda-artifacts
    - migrate-db
    if: ${{ !cancelled() && needs.setup.outputs.matrix != '[]' && needs.migrate-db.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    name: Deploy ${{ matrix.service }}
    runs-on: namespace-profile-linux-small
    env:
      PULUMI_HOME: /pulumi
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - id: project-name
      name: Get project name
      uses: ./.github/actions/get-project-name
      with:
        service-name: ${{ matrix.service }}
    - id: check-artifacts
      name: Check artifact config
      run: |
        has_binaries=$(jq -r --arg service "$SERVICE" '((.services[$service].deploy_binaries // []) | length) > 0' .github/services-config.json)
        has_lambdas=$(jq -r --arg service "$SERVICE" '((.services[$service].deploy_lambdas // []) | length) > 0' .github/services-config.json)
        echo "has_binaries=$has_binaries" >> "$GITHUB_OUTPUT"
        echo "has_lambdas=$has_lambdas" >> "$GITHUB_OUTPUT"
      env:
        SERVICE: ${{ matrix.service }}
    - name: Download handoff artifacts
      if: ${{ steps.check-artifacts.outputs.has_binaries == 'true' || steps.check-artifacts.outputs.has_lambdas == 'true' }}
      run: |
        set -euo pipefail
        if ! command -v nsc >/dev/null 2>&1; then
          echo "::error::nsc CLI not found — this job expects a Namespace runner (or add namespacelabs/nscloud-setup)"
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/handoff"
        if [[ "$HAS_BINARIES" == "true" ]]; then
          nsc artifact download "$BASE/prebuilt-binaries.tar.gz" "$RUNNER_TEMP/handoff/prebuilt-binaries.tar.gz"
        fi
        if [[ "$HAS_LAMBDAS" == "true" ]]; then
          nsc artifact download "$BASE/lambda-artifacts.tar.gz" "$RUNNER_TEMP/handoff/lambda-artifacts.tar.gz"
        fi
      shell: bash
      env:
        HAS_BINARIES: ${{ steps.check-artifacts.outputs.has_binaries }}
        HAS_LAMBDAS: ${{ steps.check-artifacts.outputs.has_lambdas }}
        BASE: handoff/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.service }}
    - name: Cache Pulumi plugins
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: /pulumi/plugins
      continue-on-error: true
    - name: Ensure Pulumi home is writable
      run: |
        set -euo pipefail
        sudo mkdir -p /pulumi
        if [ "$(id -u)" -ne 0 ]; then sudo chown -R "$(id -u):$(id -g)" /pulumi; fi
      shell: bash
    - name: Deploy ${{ matrix.service }}
      uses: ./.github/actions/deploy-cloud-storage-pulumi
      with:
        environment: ${{ inputs.environment }}
        aws-access-key: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        pulumi-service-name: ${{ steps.project-name.outputs.project-name }}
        use-namespace-builder: 'true'
        prebuilt-binaries-tar: ${{ steps.check-artifacts.outputs.has_binaries == 'true' && format('{0}/handoff/prebuilt-binaries.tar.gz', runner.temp) || '' }}
        lambda-artifacts-tar: ${{ steps.check-artifacts.outputs.has_lambdas == 'true' && format('{0}/handoff/lambda-artifacts.tar.gz', runner.temp) || '' }}
        dd-app-key: ${{ secrets.DD_APP_KEY }}
        dd-api-key: ${{ secrets.DD_API_KEY }}
  deployment-summary:
    needs:
    - setup
    - warm-binaries
    - warm-lambdas
    - build-service-binaries
    - build-lambda-artifacts
    - migrate-db
    - deploy-services
    if: always()
    name: Deployment Summary
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Check deployment results
      run: |
        if [[ "${{ needs.setup.result }}" == "failure" ]]; then
          echo "❌ Deployment setup failed"
          exit 1
        elif [[ "${{ needs.setup.result }}" == "skipped" ]]; then
          echo "⏭️ Deployment setup was skipped"
        elif [[ "${{ needs.warm-binaries.result }}" == "failure" || "${{ needs.warm-lambdas.result }}" == "failure" ]]; then
          echo "❌ Warming shared deps onto a sticky disk failed"
          exit 1
        elif [[ "${{ needs.build-service-binaries.result }}" == "failure" ]]; then
          echo "❌ One or more service binary builds failed"
          exit 1
        elif [[ "${{ needs.build-lambda-artifacts.result }}" == "failure" ]]; then
          echo "❌ One or more Lambda artifact builds failed"
          exit 1
        elif [[ "${{ needs.migrate-db.result }}" == "failure" ]]; then
          echo "❌ Database migrations failed"
          exit 1
        elif [[ "${{ needs.deploy-services.result }}" == "failure" ]]; then
          echo "❌ One or more service deployments failed"
          exit 1
        elif [[ "${{ needs.deploy-services.result }}" == "skipped" ]]; then
          echo "⏭️ No services to deploy"
        else
          echo "✅ All service deployments completed successfully for $ENVIRONMENT environment"
        fi
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
concurrency:
  group: deploy-all-services-${{ inputs.environment }}
  cancel-in-progress: false
