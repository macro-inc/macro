# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_all_services.rs
name: Deploy All Services
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: The environment we are deploying to.
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
      DD_APP_KEY:
        required: true
      DD_API_KEY:
        required: true
      NIX_CACHE_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options:
        - dev
        - prod
        description: The environment we are deploying to.
jobs:
  setup:
    name: Setup Deployment Matrix
    runs-on: namespace-profile-linux-tiny-no-cache
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      binaries: ${{ steps.set-matrix.outputs.binaries }}
      lambdas: ${{ steps.set-matrix.outputs.lambdas }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - id: set-matrix
      name: Set deployment matrix
      run: |
        set -euo pipefail
        cfg=.github/services-config.json
        # Enabled services drive deploy-services; the filtered lists keep each
        # build matrix to only enabled services that produce that artifact, so
        # disabled/unbootstrapped services and empty artifact jobs consume no runners.
        services=$(jq -c '[.services | to_entries[] | select(.value.deploy_enabled != false and .value.bootstrap_pending == null) | .key]' "$cfg")
        binaries=$(jq -c '[.services | to_entries[] | select(.value.deploy_enabled != false and .value.bootstrap_pending == null) | select((.value.deploy_binaries // []) | length > 0) | .key]' "$cfg")
        lambdas=$(jq -c '[.services | to_entries[] | select(.value.deploy_enabled != false and .value.bootstrap_pending == null) | select((.value.deploy_lambdas // []) | length > 0) | .key]' "$cfg")
        echo "matrix=${services}" >> "$GITHUB_OUTPUT"
        echo "binaries=${binaries}" >> "$GITHUB_OUTPUT"
        echo "lambdas=${lambdas}" >> "$GITHUB_OUTPUT"
        echo "All services: ${services}"
        echo "With binaries: ${binaries}"
        echo "With lambdas: ${lambdas}"
  warm-binaries:
    needs:
    - setup
    if: ${{ needs.setup.outputs.binaries != '[]' }}
    name: Warm shared binary deps onto sticky disk
    runs-on: namespace-profile-linux-mid
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
      with:
        nix-cache-url: ${{ vars.NIX_CACHE_URL }}
        nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Warm shared release deps
      run: |-
        set -euo pipefail
        nix build --print-build-logs ".#deployCargoArtifacts"
        echo "Shared release deps realised into /nix/store; committed on job exit."
      shell: bash
    - name: Push to nix cache
      run: |
        set -uo pipefail
        if [[ -z "${NIX_CACHE_URL:-}" || -z "${NIX_CACHE_SIGNING_KEY:-}" ]]; then
          echo "nix cache not configured; skipping push"
          exit 0
        fi
        key="$RUNNER_TEMP/nix-cache-signing-key"
        printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$key"
        sep='?'; [[ "$NIX_CACHE_URL" == *\?* ]] && sep='&'
        # shellcheck disable=SC2086 # TARGETS is a list on purpose
        nix copy --to "${NIX_CACHE_URL}${sep}secret-key=${key}" $TARGETS \
          || echo "::warning::nix cache push failed (non-fatal)"
        rm -f "$key"
      shell: bash
      env:
        TARGETS: .#deployCargoArtifacts
        NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
        NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  warm-lambdas:
    needs:
    - setup
    if: ${{ needs.setup.outputs.lambdas != '[]' }}
    name: Warm shared lambda deps onto sticky disk
    runs-on: namespace-profile-linux-mid
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
      with:
        nix-cache-url: ${{ vars.NIX_CACHE_URL }}
        nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Warm shared lambda dep closure
      run: |-
        set -euo pipefail
        nix build --print-build-logs ".#lambdaDeployCargoArtifacts" ".#callRecordingPreviewFfmpegLayer"
        echo "Shared lambda deps realised into /nix/store; committed on job exit."
      shell: bash
    - name: Push to nix cache
      run: |
        set -uo pipefail
        if [[ -z "${NIX_CACHE_URL:-}" || -z "${NIX_CACHE_SIGNING_KEY:-}" ]]; then
          echo "nix cache not configured; skipping push"
          exit 0
        fi
        key="$RUNNER_TEMP/nix-cache-signing-key"
        printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$key"
        sep='?'; [[ "$NIX_CACHE_URL" == *\?* ]] && sep='&'
        # shellcheck disable=SC2086 # TARGETS is a list on purpose
        nix copy --to "${NIX_CACHE_URL}${sep}secret-key=${key}" $TARGETS \
          || echo "::warning::nix cache push failed (non-fatal)"
        rm -f "$key"
      shell: bash
      env:
        TARGETS: .#lambdaDeployCargoArtifacts .#callRecordingPreviewFfmpegLayer
        NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
        NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
  migrate-db:
    needs:
    - setup
    if: ${{ !cancelled() && needs.setup.outputs.matrix != '[]' && needs.setup.result == 'success' }}
    name: Run Database Migrations
    runs-on: db-migrator
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
        sparse-checkout: .github/
    - name: Run migrations
      uses: ./.github/actions/migrate-cloud-storage-db
      with:
        environment: ${{ inputs.environment }}
  deploy-services:
    needs:
    - setup
    - warm-binaries
    - warm-lambdas
    - migrate-db
    if: ${{ !cancelled() && needs.setup.outputs.matrix != '[]' && needs.migrate-db.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    name: ${{ matrix.service }}
    uses: ./.github/workflows/reusable_deploy_service.yml
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    with:
      environment: ${{ inputs.environment }}
      service-name: ${{ matrix.service }}
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
  deployment-summary:
    needs:
    - setup
    - warm-binaries
    - warm-lambdas
    - migrate-db
    - deploy-services
    if: always()
    name: Deployment Summary
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Check deployment results
      run: |
        if [[ "${{ needs.setup.result }}" == "failure" ]]; then
          echo "❌ Deployment setup failed"
          exit 1
        elif [[ "${{ needs.setup.result }}" == "skipped" ]]; then
          echo "⏭️ Deployment setup was skipped"
        elif [[ "${{ needs.warm-binaries.result }}" == "failure" || "${{ needs.warm-lambdas.result }}" == "failure" ]]; then
          echo "❌ Warming shared deps onto a sticky disk failed"
          exit 1
        elif [[ "${{ needs.migrate-db.result }}" == "failure" ]]; then
          echo "❌ Database migrations failed"
          exit 1
        elif [[ "${{ needs.deploy-services.result }}" == "failure" ]]; then
          echo "❌ One or more services failed to build or deploy"
          exit 1
        elif [[ "${{ needs.deploy-services.result }}" == "skipped" ]]; then
          echo "⏭️ No services to deploy"
        else
          echo "✅ All service deployments completed successfully for $ENVIRONMENT environment"
        fi
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
concurrency:
  group: deploy-all-services-${{ inputs.environment }}
  cancel-in-progress: false
