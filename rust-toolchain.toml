[toolchain]
channel = "1.94.0"
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
# The linux-gnu targets are required by `cargo x zigbuild` (the local
# orchestrator cross-compiles service binaries for the runtime image). They
# don't affect the fenix channel-manifest hash in nix/cloud-storage.nix (targets
# are selected after the manifest is fetched), so adding one needs no hash bump.
targets = [
  "wasm32-unknown-unknown",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  # The musl targets carry the statically linked `coding_agent_worker` release
  # builds (see `build_agent_daemon_on_tag`): self-hosters run the daemon on
  # whatever distro they have, so it must not link a host libc.
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
]
