services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: connect
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d connect"]
      interval: 2s
      retries: 20
    volumes:
      - connect_db:/var/lib/postgresql/data
  api:
    build:
      context: ..
      dockerfile: connect/services/connect_api/Dockerfile
    ports:
      - "${CONNECT_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://connect:connect_local_only@db:5432/connect
      CONNECT_PUBLIC_URL: http://localhost:${CONNECT_PORT:-8080}
      CONNECT_LOCAL_WRAPPING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    depends_on:
      db:
        condition: service_healthy
  demo:
    build:
      context: ..
      dockerfile: connect/services/connect_demo/Dockerfile
    ports:
      - "${CONNECT_DEMO_PORT:-3000}:3000"
    environment:
      CONNECT_BASE_URL: http://api:8080
      CONNECT_DEMO_CUSTOMER_KEY: ${CONNECT_DEMO_CUSTOMER_KEY:-}
      CONNECT_DEMO_PUBLIC_URL: http://localhost:${CONNECT_DEMO_PORT:-3000}/demo
    depends_on:
      - api

volumes:
  connect_db:
